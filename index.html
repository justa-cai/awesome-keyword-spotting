<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awesome Keyword Spotting 论文库</title>
  <meta name="description" content="关键词检测（KWS）论文库：2022.06-2026.08 新增 171 篇 + 经典 134 篇，305 篇中文深读笔记">
  <link rel="stylesheet" href="vendor/vue.css">
  <link rel="stylesheet" href="vendor/katex.min.css">
  <style>
    body { font-family: -apple-system, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .sidebar { width: 320px; }
    .sidebar .sidebar-nav ul ul { font-size: 13px; }
    .content, .sidebar { padding-top: 60px; }
    .app-name a { color: #42b983; }
    .ksearch { padding: 12px 14px 4px; border-bottom: 1px solid #eee; }
    .ksearch input { width: 100%; box-sizing: border-box; padding: 6px 10px; border: 1px solid #ccc;
      border-radius: 15px; outline: none; font-size: 13px; }
    .ksearch input:focus { border-color: #42b983; }
    .ksearch-results { max-height: 40vh; overflow-y: auto; }
    .ksearch-hint { font-size: 12px; color: #999; padding: 6px 2px; }
    .ksearch-item { display: block; padding: 6px 2px; text-decoration: none; border-bottom: 1px dashed #eee; }
    .ksearch-title { font-size: 13px; color: #364149; line-height: 1.4; }
    .ksearch-snippet { font-size: 12px; color: #888; line-height: 1.4; margin-top: 2px; }
    .ksearch-snippet mark { background: #fff3a0; padding: 0; }
    .lang-switch { position: fixed; top: 10px; right: 16px; z-index: 100;
      display: flex; align-items: center;
      background: #fff; border: 1px solid #e3e3e3; border-radius: 16px; padding: 3px;
      font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .lang-switch a { text-decoration: none; color: #5f8a76; padding: 3px 12px;
      border-radius: 12px; cursor: pointer; }
    .lang-switch a.active { background: #42b983; color: #fff; font-weight: 600; }
    .lang-switch a:not(.active):hover { background: #eef7f2; }
    /* 顶部小徽章 */
    .badge-wrap { text-align: center; margin-top: 8px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; background: #42b98322; color: #2c8c5f; font-size: 13px; margin: 0 3px; }
  </style>
</head>
<body>
  <div id="app">正在加载论文库……</div>
  <script>
    /* EN→ZH fallback: /en/papers/x.md 404 时改取 /papers/x.md（中文原文）；
       /en/README.md 404 时改取 /README.en.md（英文版首页）。须先于 docsify 加载 */
    (function () {
      var of = window.fetch;
      window.fetch = function (u, o) {
        var url = typeof u === 'string' ? u : (u && u.url) || '';
        return of.apply(this, arguments).then(function (r) {
          if (r.status === 404 && /\/en\/README\.md/.test(url)) {
            return of('/README.en.md', o);
          }
          if (r.status === 404 && /\/en\/(papers\/[^?#]+)/.test(url)) {
            return of(url.replace('/en/', '/'), o);
          }
          return r;
        });
      };
    })();
    window.$docsify = {
      name: 'Awesome Keyword Spotting',
      nameLink: '#/',
      repo: 'https://github.com/justa-cai/awesome-keyword-spotting',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      externalLinkTarget: '_blank',
      alias: {
        '/en/papers/.*/_sidebar.md': '/en/_sidebar.md',
        '/(?!en/).*_sidebar.md': '/_sidebar.md'
      },
      search: false,
      sidebarDisplayLevel: 1,
      plugins: [
        function (hook) {
          var VIZ = null, VIZP = null;
          function vizSet() {
            if (VIZ) return Promise.resolve(VIZ);
            if (VIZP) return VIZP;
            VIZP = fetch('/viz_manifest.json').then(function (r) {
              return r.ok ? r.json() : [];
            }).then(function (list) {
              VIZ = {}; (list || []).forEach(function (p) { VIZ[p] = 1; });
              return VIZ;
            }).catch(function () { VIZ = {}; return VIZ; });
            return VIZP;
          }
          hook.afterEach(function (html, next) {
            var m = location.hash.match(/^#\/(?:en\/)?(papers\/[^/]+\/.+?)(?:\?.*)?$/);
            if (m && !/\.pdf$/.test(m[1])) {
              var btns = '<p style="margin:0 0 18px"><a href="' + m[1] + '.pdf" target="_blank" '
                + 'style="display:inline-block;padding:4px 14px;border:1px solid #42b983;border-radius:16px;'
                + 'color:#42b983;font-size:14px;text-decoration:none">📄 Open paper PDF</a></p>';
              var base = m[1];
              vizSet().then(function (set) {
                if (set[base + '.html']) {
                  btns = '<p style="margin:0 0 18px">'
                    + '<a href="' + base + '.html" target="_blank" '
                    + 'style="display:inline-block;margin-right:10px;padding:4px 14px;border:1px solid #0e8a66;border-radius:16px;'
                    + 'color:#0e8a66;font-size:14px;text-decoration:none;font-weight:600">📊 可视化精读版</a>'
                    + '<a href="' + base + '.pdf" target="_blank" '
                    + 'style="display:inline-block;padding:4px 14px;border:1px solid #42b983;border-radius:16px;'
                    + 'color:#42b983;font-size:14px;text-decoration:none">📄 Open paper PDF</a></p>';
                }
                next(btns + html);
              });
            } else {
              next(html);
            }
          });
        },
        function (hook) {
          hook.doneEach(function () {
            var el = document.querySelector('.lang-switch');
            if (!el) {
              el = document.createElement('div');
              el.className = 'lang-switch';
              el.innerHTML = '<a data-lang="zh" title="View in Chinese">中文</a>'
                + '<a data-lang="en" title="View in English">EN</a>';
              el.addEventListener('click', function (e) {
                var a = e.target.closest('a[data-lang]');
                if (!a) return;
                e.preventDefault();
                var want = a.getAttribute('data-lang');
                var isEn = /^#\/en\//.test(location.hash);
                if ((want === 'en') === isEn) return;
                var path = location.hash.replace(/^#\/(en\/)?/, '');
                location.hash = (want === 'en' ? '#/en/' : '#/') + path;
              });
              document.body.appendChild(el);
            }
            var isEn = /^#\/en\//.test(location.hash);
            el.querySelector('a[data-lang="zh"]').classList.toggle('active', !isEn);
            el.querySelector('a[data-lang="en"]').classList.toggle('active', isEn);
            /* docsify 不解析 ../，把 EN 首页里的 ../README.md 链接改写为站点根路由 */
            [].slice.call(document.querySelectorAll('#main a[href="#/../README"]')).forEach(function (a) {
              a.setAttribute('href', '#/README');
            });
          });
        }
      ]
    };
  </script>
  <script src="vendor/docsify.min.js"></script>
  <script src="vendor/sidebar.min.js"></script>
  <script src="vendor/docsify-katex.js"></script>
  <script src="vendor/cjk-search.js"></script>
</body>
</html>
