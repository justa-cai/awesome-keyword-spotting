          - text: 在线数据引擎：信道确定化使「分离即标注」成立——未标注混合语音自动变正负样本对，unseen 微调 97.57% 追平干净上限；从「离线刷点」升级为「上线后可持续进化的闭环」——title 里 text-aware 的最终兑现。
