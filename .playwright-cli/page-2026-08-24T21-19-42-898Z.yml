      - generic [ref=f146e24]:
        - heading "一分钟版本" [level=2] [ref=f146e25]
        - list [ref=f146e26]:
          - listitem [ref=f146e27]: 立场判断：重叠语音对 KWS 的伤害比环境噪声更重，只治噪声不够。环境噪声统计上不相关或准平稳，多条件训练能「平均掉」；重叠语音是结构化语音信号——干扰人的音素序列、音节边界、共振峰轨迹与唤醒词高度同构，「长得像唤醒词」的片段无法靠统计平均消除。不对称两难：重叠推高误报，提阈值压误报又压垮唤醒率——一个旋钮拧不动两个方向，必须从信号层面剥离干扰。与鸡尾酒会问题的关键差别：目标说话人事先完全未知，唯一恒定的先验是唤醒词本身——线索必须来自文本或少量唤醒词音频。
          - listitem [ref=f146e28]: 三条已有路线的失败：① SE 前件只治噪声不治重叠——TDSE（文本依赖定向增强）训练数据里没有负样本，面对纯负样本流产生「关键词幻觉」把普通语音增强成唤醒词（任务定义层缺陷）；② PIT 枚举置换取 min 的损失对信道严格对称——关键词落哪条信道随机等于抛硬币：双信道都喂后端则算力误报双倍（端侧不可接受），只赌一条则一半概率直接丢词；③ keyword-clue 框架只把线索用在分类器层，没人把它注入分离前件。
          - listitem [ref=f146e29]: 核心方法 TPDT：L = L_PIT + y·L_PDT——PIT 作用于全部数据保通用分离能力（锚），PDT 只在含关键词样本上把 Ŝ₁ 预设死装关键词（定向），把「置换选择题」变成「信道填空题」。成本几乎为零（加一个掩码分支），分离质量损耗不到 0.2dB。
          - listitem [ref=f146e30]: 实证链最扎实的一段（Table 4）：PIT-only 基线 CH1 召回只有 41.77%（正好腰斩，量化「抛硬币」代价）；加了条件编码但损失仍对称同样 40.13%（证明是准则问题不是网络问题）；PDT-only 置换确实钉死（MAX 88.53 ≈ CH1 88.47）但通用分离崩盘（L2M SI-SNR −0.47dB，接近随机输出）；PIT+PDT 叠加：分离与基线打平，CH1 冲到 92.80%——+51 个点。
          - listitem [ref=f146e31]: 负样本流天然安全：不含关键词时模型退化为普通分离，信道 1 只装一个普通说话人，后端自然判负——不需要显式「有无关键词」开关，误报路径被分离行为天然封住。TSkiM-50（文本 + 50 条固定音频片段）CH1 达 95.27%，分离指标还略优于无条件的基线。
          - listitem [ref=f146e32]: 第二重红利：在线数据引擎：信道确定化使「分离即标注」成立——信道 1 出正样本、信道 2 出负样本残余，无需人工转写。用 2000 条无标注「未见」混合语音微调后端：召回 95.27→97.57%，追平甚至略超干净上限（97.43%）——混合场景损失基本被填平。PIT 基线做不到：CH1 挑信道 80.73%（脏数据负收益）、MAX 挑信道 93.67%（等于用 KWS 自己给自己标数据，误差闭环自我放大）。
          - listitem [ref=f146e33]: 有信息量的背离现象（Table 3）：纯文本条件最利 KWS（CH1 92.80），音频条件最利分离指标——音频片段携带环境 / 音色等额外信息对分离有帮助，但条件混进音色等于把任务从「保这个词」偏移向「保这个人」，反而伤 KWS。线索的信息量要按下游任务裁剪，不是越丰富越好。FiLM 全面最差（逐帧调制对慢变的词身份过度参数化）。
          - listitem [ref=f146e34]: 边界：两说话人假设（三说话人契约失效）；单关键词（换词要重学嵌入）；干扰不含唤醒词——最难的对抗场景（两人同说唤醒词）未评估；训练依赖干净参考（真实多说话人数据无法直接用）；全仿真数据；端侧开销无量化（「省一半后端算力」是结构推论非实测）。
    - generic [ref=f146e35]:
      - paragraph [ref=f146e36]: §01 · 问题陈述
      - heading "KWS 版鸡尾酒会：线索不是声纹，是唤醒词本身" [level=2] [ref=f146e37]
      - generic [ref=f146e39]: 为什么重叠语音是更深的坑：noisy KWS 的解法（SE 前件 / 多条件训练 / 课程学习 / wav2vec 特征）针对统计上不相关或准平稳的噪声——重叠语音是结构化干扰：干扰人的音素序列、音节边界、共振峰轨迹与唤醒词高度同构，普通说话里大量出现与「Hey Snips」相似的元音和音节转移，无法靠统计平均消除，会系统性侵蚀决策边界。据作者所知此前几乎没有工作显式处理「KWS 任务特化的多说话人问题」——大量 noisy KWS 文献绕开了这个更难场景。
      - generic [ref=f146e40]: 三条路线的具体不足：① TDSE 的教训——文本依赖 SE 前件做定向增强，但训练样本全部合成带关键词、无负样本：真实设备 99% 以上时间没人说唤醒词，只在「必含关键词」数据上训练的前件面对纯负样本流会产生关键词幻觉——负样本安全必须写进损失结构，不是调参能救的；② PIT 的对称性是数学根源——min 里两个置换完全对等，网络从损失函数学不出「谁该待在信道 1」；③ keyword-clue 框架偏置作用点在分类器输出——没人前移到分离器输出。
