        - generic [ref=f146e99]: 式 1–3 · TPDT（Text-aware Permutation Determinization Training）：PIT 项 min_σ 遍历置换作用于全部数据——通用分离能力的锚，没有它模型只会「把关键词塞信道 1」而对普通语音接近随机输出；PDT 项直接预设 Ŝ₁ 装关键词、只在含关键词样本（y=1）上起作用。为什么是加法而非替换或加权：一项托底、一项定向，两个自由度正交。名字三个词对应三件事：文本线索、置换确定化、训练准则。
      - generic [ref=f146e100]: 实现细节里的端侧工程考量：分离训练用纯时域 SI-SNR（尺度不变、只优化波形形状，避免幅值漂移）；音频条件列表训练与推理全程固定——条件嵌入可离线抽取，推理时把 ECAPA-TDNN 整个丢弃省一截显存与算力；后端取 WeKws 生产级工具包的 MDTC 默认配置 + max-pooling 损失（任一帧足够自信即唤醒，匹配短时瞬态目标、方便流式早退）；前件基于 ESPnet 开发、超参全开源。
