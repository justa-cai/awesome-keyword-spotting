          - generic [ref=f146e262]: "3"
          - text: 单信道推理的算力减半：后端只推理一个信道（PIT 基线被迫双信道兜底）——端侧常驻系统真金白银的开销减半，且每信道残留语音不再参与判决、误报暴露面同步收窄。
