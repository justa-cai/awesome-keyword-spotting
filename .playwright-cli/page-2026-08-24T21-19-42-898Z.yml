          - generic [ref=f146e260]: "2"
          - text: 置换确定化训练（PDT）：一条几乎零成本的附加损失解决 PIT 信道对称性与 KWS 单信道需求的结构性冲突——分离质量几乎不损，部署形态召回 41.77→92.80。
