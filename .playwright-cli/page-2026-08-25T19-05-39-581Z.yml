        - paragraph [ref=f337e274]: 见过的关键词越多越泛化——训练词表窄时，对陌生词的几何不可靠，开放集拒识也跟着不可靠。
      - generic [ref=f337e275]:
        - heading "检索开销" [level=4] [ref=f337e276]
        - paragraph [ref=f337e277]: 最近邻要与所有原型算距离——词表大了之后要换近似最近邻/哈希，工程复杂度回来了。
      - generic [ref=f337e278]:
        - heading "封闭集让位" [level=4] [ref=f337e279]
        - paragraph [ref=f337e280]: 固定词表场景专用分类器仍高 0.5–1%——封闭集是分类器的主场，范式选择应跟着词表会不会变走。
  - generic [ref=f337e281]:
    - generic [ref=f337e282]: "05"
    - heading "可迁移的判断" [level=2] [ref=f337e283]
    - generic [ref=f337e284]:
      - generic [ref=f337e285]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f337e286]: ① 词表会变的检测任务，先问「分类头还是嵌入空间」。
      - generic [ref=f337e287]: ↳ 封闭集（词表永不改）用分类器榨精度；开放集/可扩展/个性化用嵌入换灵活——两者差的那 0.5–1% 精度，买回的是整个词表的生命周期自由。这个决策应在系统设计第一天做，不是部署后补救。
      - paragraph [ref=f337e288]: ② 拒识能力来自「距离 + 阈值」，不来自多训一类。
      - generic [ref=f337e289]: ↳ 「未知类」无法穷举，但「离所有已知都远」是可以计算的几何事实——开放集识别的正确姿势是给模型一个说「都不是」的出口，而不是收集更多负样本硬训。
      - paragraph [ref=f337e290]: ③ 样本间的配对问题，常常可以用「可学习中心」替代。
      - generic [ref=f337e291]: ↳ 三元组挖掘的复杂度（选锚、选正、选负、控制难度）在代理损失里整个消失——当你的损失需要「样本之间的关系」时，先问一句：能不能给每类立一个可学习的锚点，把 N² 关系降成 N×K。
