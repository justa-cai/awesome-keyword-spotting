  - generic [ref=f337e13]:
    - generic [ref=f337e14]: "01"
    - heading "问题：封闭集分类的四道锁" [level=2] [ref=f337e15]
    - generic [ref=f337e16]:
      - generic [ref=f337e17]: TL;DR
      - list [ref=f337e18]:
        - listitem [ref=f337e19]: ◆ 主流 KWS 把检测当封闭集分类：词表训练时定死、输出固定类别概率——加词要重训、未知词被硬塞进已知类（分类器必须选一个）、个性化每套词表一个模型、固定词表永远覆盖不了开放的现实现场。
        - listitem [ref=f337e20]: ◆ 度量学习的替代范式：学嵌入函数而非分类头——同词嵌入聚拢、异词远离；新词只是空间里的一个新原型，注册即可用。
        - listitem [ref=f337e21]: ◆ 工具箱超越老式三元组：代理损失（每类一个可学习中心，绕开困难挖掘）+ 角度边际（超球面上强制类间隔离带）。
        - listitem [ref=f337e22]: ◆ 开放集判据是范式的杀手锏：输入嵌入与所有原型距离都超阈值 → 判「未知」——无需训练「未知」类，天然拒绝没见过的词。
