  - generic [ref=f337e85]:
    - generic [ref=f337e86]: "02"
    - heading "机制：超球面上的几何" [level=2] [ref=f337e87]
    - paragraph [ref=f337e88]: 嵌入网络把每条音频压成 128/256 维向量并 L2 归一化——所有嵌入因此住在单位超球面上，距离就变成角度（余弦相似度）。每个类是球面上的一个「扇区」，类代理（三角）是可学习的扇区中心。角度边际在此基础上强制扇区之间留出隔离带：同类收得更紧、异类隔得更开——这是说话人验证界（ArcFace/CosFace）验证过的成熟武器，本文把它带进 KWS。
    - img [ref=f337e89]:
      - generic [ref=f337e91]: 机制解剖：超球面上的角度边际 · 代理损失为什么省事
      - generic [ref=f337e92]: 单位超球面上的边际
      - generic [ref=f337e103]: "yes"
      - generic [ref=f337e112]: "no"
      - generic [ref=f337e121]: stop
      - generic [ref=f337e122]: 角Margin：类间强制留出角度隔离带
      - generic [ref=f337e123]: 三角 = 类代理（可学习的类中心）
      - generic [ref=f337e124]: L2 归一化把所有嵌入压到球面——距离即角度
      - generic [ref=f337e125]: 三元组 vs 代理：训练复杂度
      - generic [ref=f337e127]: 传统三元组损失的老大难：
      - generic [ref=f337e128]: · 要「锚-正-负」三元组，负样本绝大多数太容易
      - generic [ref=f337e129]: · 必须困难挖掘（mining）——每个 batch 挑出
      - generic [ref=f337e130]: 有信息量的组合，挖掘策略本身一堆超参
      - generic [ref=f337e131]: · 挖太狠训练不稳 · 挖太浅学不动
      - generic [ref=f337e132]: 代理方式的解法：
      - generic [ref=f337e133]: · 每类一个可学习代理向量（类可学习中心）
      - generic [ref=f337e134]: · 损失按「样本 ↔ 代理」的距离计算
      - generic [ref=f337e135]: · 每个样本只跟 K 个代理比——无需样本间配对
      - generic [ref=f337e136]: · 困难挖掘问题整体消失，训练稳定
      - generic [ref=f337e137]: 角度边际（ArcFace）再加一层：
      - generic [ref=f337e138]: 分类 logits 上加角度惩罚——同类收得更紧、
      - generic [ref=f337e139]: 类间隔离带更宽（说话人验证界的成熟武器）
      - generic [ref=f337e140]: 左：L2 归一化后所有嵌入住在单位球面上，类是球面上的「扇区」，角度边际强制扇区之间留隔离带。右：代理损失把「样本对样本」的距离计算换成「样本对可学习中心」——困难挖掘的复杂度被整个绕开
    - generic [ref=f337e141]: 图 2 · 机制解剖：单位超球面上的类扇区与角度边际 · 三元组挖掘 vs 代理损失的复杂度对比
    - generic [ref=f337e142]:
      - generic [ref=f337e143]: "L2 归一化: e = f(x) / ‖f(x)‖ ← 所有嵌入压到单位超球面 距离: d(e₁, e₂) = 1 − cos(θ) ← 球面角度即距离 代理损失: 每类一个可学习代理 p_k，损失按 d(e, p_k) 计算 角度边际: logits 加角度惩罚 → 类间强制隔离带（ArcFace 系）"
      - generic [ref=f337e144]: 人话：把每条音频变成球面上的一个点，同一个词的点抱团占一块地盘；训练时既让点抱团更紧（到自家地盘中心近），又让各家地盘之间留出空隙（角度边际）。来了新词，在球面上立个新中心就行；来了没见过的词，它落在所有地盘之外的空隙里——自动拒识。
    - paragraph [ref=f337e145]: 代理损失为什么省事值得单独讲：传统三元组损失要「锚-正-负」样本组合，负样本绝大多数太容易、必须困难挖掘，而挖掘策略本身又是一堆超参（挖太狠训练不稳、挖太浅学不动）。代理方式把「样本对样本」的距离计算换成「样本对可学习中心」——每个样本只跟 K 个代理比，困难挖掘问题整体消失，训练稳定得多。
