      - generic [ref=f337e226]:
        - generic [ref=f337e227]: "1"
        - paragraph [ref=f337e228]: 开放集优势是结构性的。分类器的 softmax 必须把概率分给已知类——没见过「何」这个字时只能硬猜；嵌入空间的距离阈值天然给出「都不像」的出口。这不是调参能追平的差距，是范式的差异。
      - generic [ref=f337e229]:
        - generic [ref=f337e230]: "2"
        - paragraph [ref=f337e231]: 封闭集的 0.5–1% 是合理代价。专用分类器把全部容量押在固定词表上；嵌入网络要为「任意词的几何」留容量——这笔小账换回整个词表生命周期自由。
      - generic [ref=f337e232]:
        - generic [ref=f337e233]: "3"
        - paragraph [ref=f337e234]: 团队背景解释了技术选型。Heo/Chung 是说话人验证出身——SV 领域早就在用「嵌入 + 注册 + 阈值」这套流程（声纹就是注册几句话）；本文本质上是把 SV 的工程范式平移到唤醒词。
