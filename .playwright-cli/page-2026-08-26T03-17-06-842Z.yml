      - generic [ref=f148e131]: PCEN_m(t) = (E_m(t) / (ε + S_m(t))^α)^β − δ^β S_m(t) = (1−s)·S_m(t−1) + s·E_m(t) s α β δ 逐通道可训练
      - generic [ref=f148e132]: 人话：普通 log 像一个固定音量的耳机——环境多吵都开同一格。PCEN 像自动音量的耳机：先听几秒估出背景多吵（S 就是这个估计），吵就自动调小、静就调大，而且每个频段各配一套旋钮。旋钮的角度不用人调——损失函数的梯度会自己拧。
