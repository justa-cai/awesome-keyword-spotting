  - generic [ref=f148e226]:
    - heading "5 判断：能带走的三句话" [level=2] [ref=f148e227]:
      - generic [ref=f148e228]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f148e229]:
      - generic [ref=f148e230]: JUDGEMENT
      - paragraph [ref=f148e231]: ↳ 流水线里每个「固定」的组件都是潜在的可学点：log 压缩被视为理所当然十年——把它参数化并接入梯度流，任务损失自己教会前端怎么听；审视系统时逐段问「这段为什么是固定的」。
      - paragraph [ref=f148e232]: ↳ 自适应归一化的本质是「以背景为参照系」：除以 S^α 让输出衡量「比背景强多少」而非「绝对多强」——远场/近场的差异被参照系吸收；一切鲁棒性设计都在找正确的归一化基准。
      - paragraph [ref=f148e233]: ↳ 好的特征创新会变成领域的默认配置：PCEN 出现后几乎每篇 KWS 论文的输入端都写它——评价特征类工作的标准不是单篇论文的提升，而是它是否消失在后续论文的「标配」清单里。
