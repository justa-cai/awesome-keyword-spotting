    - text: Trainable Frontend for Robust and Far-Field Keyword Spotting · Yuxuan Wang / Pascal Getreuer / Thad Hughes / Richard F. Lyon / Rif A. Saurous（Google）· 2017 · arXiv
    - link "1707.07428" [ref=f148e12] [cursor=pointer]:
      - /url: https://arxiv.org/abs/1707.07428
    - text: 一句话：固定 log 压缩对所有通道/强度一刀切——远场弱信号抬不够、噪声跟着抬——PCEN（E/(ε+S)^α)^β 用每通道可训练的 s·α·β·δ 实现自适应增益：梯度从 KWS 损失反向传播穿过前端，特征为任务而学，从此成为 KWS 的标配输入。
