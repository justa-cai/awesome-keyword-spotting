      - generic [ref=f65e193]: 诚实边界：论文没有与任何外部 SOTA（Synt++ 的受控采样 + 归一化、知识蒸馏路线）同台对比，所有对比都是与自家 baseline 的自我比较——「+12.2%」不能直接回答「比现有最好的 TTS 过拟合缓解方案好多少」。评测集规模与构成未报告，全部为单次训练数字，无多种子重复与显著性检验；考虑到 5% 档不同 λ 之间结果符号会翻转（B3 −10.3% 对 D3 −2.0%），部分边际结论可能落在噪声量级内。
