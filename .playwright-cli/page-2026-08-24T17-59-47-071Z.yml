      - heading "现有四条路线的不足" [level=3] [ref=f65e61]
      - list [ref=f65e63]:
        - listitem [ref=f65e64]: TTS-for-KWS 先行工作（Werchniak 2021、Lin 2020、Lee & Baek 2022 等）：只在低资源场景展示成功，默认「合成数据够好」，把失配当可容忍的背景噪声，没正面处理过拟合。
        - listitem [ref=f65e65]: 数据层缓解（Synt++）：受控采样压覆盖偏差、分别归一化只对齐一阶统计量——对高维表示空间的结构性差异无作用，更拦不住训练目标内部的伪影利用。
        - listitem [ref=f65e66]: 图像域 syn-to-real 教师迁移：致命前提是要一个「真实数据训练的教师」——本文场景恰是真实正样本稀缺，教师从何而来？且无语音流式模型验证。
        - listitem [ref=f65e67]: 对抗训练 / 域适应：说话人不变训练、域对抗 ASR 都有成功案例，但「对抗训练 × TTS 数据过拟合」这两个各自成熟的组件此前从未被连接（论文自称 KWS 乃至语音处理域第一个）。
    - generic [ref=f65e68]:
      - paragraph [ref=f65e69]: §02 · 方法论
      - heading "一个梯度反转层：对抗头学「分真假」，主干被逼「抹真假」" [level=2] [ref=f65e70]
      - generic [ref=f65e72]: 搭在生产管线上，不在学术 baseline 上自说自话：Google 生产级端到端流式 KWS——40 维滤波器组能量（25 ms 窗 / 10 ms 移），相邻 3 帧堆叠按步长 2 抽取 → 每 20 ms 一个 120 维输入（给单帧注入短时上下文，让卷积在更低帧率工作）；主体为两阶段：编码器 = 7 层 SVDF 因子化卷积（时间维 × 特征维两步低秩卷积，为流式小模型设计）+ 3 个瓶颈投影层，用 ASR 对齐的音素目标监督；解码器输出 2 维关键词判别。为什么两级监督：唤醒词检测本质是音素序列匹配——音素监督把语言学先验注入低层，句级 max-pool 监督聚合判段；多任务结构还让隐层信息更丰富，为对抗头取特征提供接口。总参数约 32 万。训练全程施加房间模拟器多风格增强——先把环境鲁棒性做足，避免「房间失配」和「合成/真实失配」混成混淆变量。
