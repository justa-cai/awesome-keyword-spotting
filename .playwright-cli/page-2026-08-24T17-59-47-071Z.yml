          - text: 诊断性证据可复用S/R 探针（gradient stop 单训）定量证明生产 KWS 隐层普遍编码可判别真伪的特征（拼接 98.1%、单层 ≥87.1%）——探针本身可反过来当 TTS 系统「伪影含量」评估工具。
        - generic [ref=f65e203]:
          - generic [ref=f65e204]: "3"
          - text: 生产级收益 + 冷启动结论3065 万条规模上 +12.2%（Adv. C5）；一条真实正样本都没有时平均仍 +6.2%——归因于真实负样本充当域锚点，对唤醒词冷启动有直接产品价值。
