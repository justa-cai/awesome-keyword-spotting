      - heading "隐层选择：先探针、后动手的方法纪律" [level=3] [ref=f65e115]
      - generic [ref=f65e116]: 对抗头吃哪些特征是自由度。论文先用 gradient stop（阻断对抗梯度回传）单独训练 S/R 分类器量化各层域信息含量（Table 2），再据此选定输入——先证明问题存在，再动手解决。结论：全部 7 层拼接最高（98.1%），且两个副产物观察——编码器层（97.8%）整体强于解码器层（92.9%），说明 TTS 伪影主要沉淀在贴近声学的低层表示，解码器做了任务抽象、丢掉部分域线索；任何单层 ≥87%，说明伪影弥散在全网——这就是为什么抹除必须在主干预权重的梯度上做，而不能只在某层加正则。
    - generic [ref=f65e117]:
      - paragraph [ref=f65e118]: §03 · 实验结果
      - heading "两端受益、中间塌陷：U 型规律是全文最可转述的工程边界" [level=2] [ref=f65e119]
      - generic [ref=f65e121]: 数据（Table 1，共 3065 万条）：真实正样本 3.8M（稀有昂贵）· 真实负样本 14.1M（便宜）· 合成正样本 7.5M · 合成负样本 5.1M（TTS 大规模铺开）。TTS 用 Virtuoso + AudioLM 变体等量采样，数百种合成音色。混淆变量控制很讲究：合成正样本的 transcript 不是凭空写的——从真实正样本的 ASR 转录采样再插入关键词，使合成/真实的文本分布一致，S/R 探针抓到的差异就集中在声学伪影层面而非语言内容层面；随机插入韵律控制符号（暂停 / 慢说）最大化合成多样性。 指标：FRR @ 0.133 FA/h（每小时误触发钉死在约两天一次的水平，再比漏检）——误触发是用户可直接感知的骚扰，必须先锁死；论文用 ROC（Fig. 3）验证了相对改进在很宽 FA/h 范围内一致，单点指标不是挑了对自家有利的点。
