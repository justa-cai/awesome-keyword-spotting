        - heading "一分钟版本" [level=2] [ref=f65e25]
        - list [ref=f65e26]:
          - listitem [ref=f65e27]: 数据经济学：新唤醒词上线，真实正样本要真人逐条录（贵、稀缺），负样本几乎免费；TTS 便宜快速可铺量。但合成数据分布与真实有四类失配——过采样 / 欠采样 / 缺失 / 伪影，后两类直接导致过拟合。
          - listitem [ref=f65e28]: 立论证据：生产 KWS 模型（SVDF 两阶段、约 32 万参数）隐层里，「合成 vs 真实」探针准确率高达 98.1%（全部 7 层拼接），任何单层不低于 87.1%——伪影是浅层线性可判别的信号，模型顺手就学。
          - listitem [ref=f65e29]: 方法：训练时从全部隐层取特征，过一个「逐帧线性投影 + 时间 max-pool」的极简对抗头判真假，中间加梯度反转层——对抗头学着分真假，主干被反向梯度逼着抹掉真假信息。推理时对抗头丢弃，零额外开销。
          - listitem [ref=f65e30]: 结果：3065 万条话语规模，全额数据配置 FRR 1.81%→1.59% @ 0.133 FA/h（相对改进 +12.2%）；完全没真实正样本（0%）时平均仍 +6.2%、最好 +8.3%——真实负样本给对抗头当了真实域锚点，冷启动照样可用。
          - listitem [ref=f65e31]: 边界（U 型规律）：真实正样本权重 0% / 100% 两端受益，5% 档反而平均 −7.3%（最差 −15.1%）——不是免费午餐，上马前先核对自己的数据配比段位。
    - generic [ref=f65e32]:
      - paragraph [ref=f65e33]: §01 · 问题陈述
      - heading "判别式训练会把 TTS 伪影当捷径特征，真实正样本反被误拒" [level=2] [ref=f65e34]
      - generic [ref=f65e36]: 生产级 KWS 的三重约束：① 多人群、多环境、重叠噪声下保持准确；② always-on 流式 → 小 footprint；③ 需要海量数据覆盖多样发音——而关键词特定音频采集「frequently requiring human contributors to generate recordings」（论文原话）。正样本稀缺昂贵、负样本免费，这个数据经济学是全文出发点。TTS（论文用 Virtuoso + AudioLM 变体）便宜可铺量，但分布失配是结构性风险。
