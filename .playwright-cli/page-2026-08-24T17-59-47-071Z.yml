          - list [ref=f65e220]:
            - listitem [ref=f65e221]: 泛化性单薄：单一关键词（Hey/OK Google）、单一架构（SVDF ~32 万参数）、单一管线——能否迁移到 TC-ResNet / BC-ResNet、多语言、多关键词未知。
            - listitem [ref=f65e222]: 缺外部基线：没和 Synt++、知识蒸馏、TTS 降权等手段同台，无法回答「同样数据预算下是否最优」。
