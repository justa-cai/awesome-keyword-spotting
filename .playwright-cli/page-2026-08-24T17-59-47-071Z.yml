          - heading "方法局限" [level=4] [ref=f65e213]
          - list [ref=f65e214]:
            - listitem [ref=f65e215]: 对抗头容量过弱：线性投影 + max-pool 只能抹除线性可分的域信息；若伪影还有非线性成分则够不着。论文自认，提出未来用 Conformer / LSTM 做对抗头——但内生张力：对抗头越强训练越不稳定（预实验已发现收敛依赖 λ）。
            - listitem [ref=f65e216]: 收益非普适：5% 档跨 λ 平均 −7.3%、最差 −15.1%，且论文未给「我是否处于塌陷区」的事前判据——实践者只能自己扫配比。
            - listitem [ref=f65e217]: 关键超参披露不全：对抗项权重 β、编码器输出维度 K、对抗训练的额外训练成本（时长 / 显存）均未报告。
