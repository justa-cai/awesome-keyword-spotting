          - generic [ref=f65e206]: "4"
          - text: 工程边界图λ 有效区间（0.30-0.50）+ 真实正样本配比的 U 型规律（两端收益、5% 塌陷）——「对抗去伪影」不是普适增益，上马前先核对自己处在配比谱哪一段。
