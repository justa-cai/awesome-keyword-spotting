      - heading "特征提取是 KWS 管线里唯一「非神经网络」的环节—— 训完丢掉解码器，用 1/5 算子换可比精度 + 噪声反超" [level=1] [ref=f160e13]: 特征提取是 KWS 管线里唯一「非神经网络」的环节——训完丢掉解码器，用 1/5 算子换可比精度 + 噪声反超
      - paragraph [ref=f160e14]: Automatic Audio Feature Extraction for Keyword Spotting
      - paragraph [ref=f160e15]: 作者：Paola Vitolo、Rosalba Liguori、Luigi Di Benedetto、Alfredo Rubino、Gian Domenico Licciardo —— 萨勒诺大学工业工程系（意大利）
      - paragraph [ref=f160e16]: 发表：IEEE Signal Processing Letters（2023-12）· GSCD 12 类 · MLCommons/tiny 参考分类器
      - generic [ref=f160e17]:
        - generic [ref=f160e18]: 卷积自编码器当特征提取器
        - generic [ref=f160e19]: FFT-MAE 频域损失
        - generic [ref=f160e20]: 训完丢解码器
        - generic [ref=f160e21]: 1/4.88 算子 · 零 Log
        - generic [ref=f160e22]: 0dB 反超 MFCC 5.2 点
        - generic [ref=f160e23]: 全 NN 端到端拼图
      - generic [ref=f160e24]:
        - heading "一分钟版本" [level=2] [ref=f160e25]
        - list [ref=f160e26]:
          - listitem [ref=f160e27]: 矛头精确指向中间那一块：预处理 → 特征提取 → NN 分类器的三段管线里，特征提取是唯一非 NN 环节。梅尔家族（MFCC / mel 频谱图 / PNCC）绕不开 FT + 梅尔滤波器组 + Log + DCT——微控制器上出名的算子与功耗大户（MFCC 每帧 14192 加 / 12529 乘 / 50 次 Log）；且选哪种特征、滤波器几个、帧长多少全靠专家调参——自定义唤醒词 / 多语言 / 多变部署下是持续人力成本。
          - listitem [ref=f160e28]: 轻量化路线打在要害上的一句批评：特征量化 / 压缩维度这些方法仍然依赖 FT 流程——优化的是 FT 之后的产物，每帧还是要先付一遍完整 FFT + 梅尔 + Log + DCT 成本。本文不动某一级，而是整条流水线连同心理声学先验一起换掉。
          - listitem [ref=f160e29]: 方法：卷积自编码器：编码器四级 Conv+MaxPool 把 16000 点原始波形压到 50×16 瓶颈，解码器训练期负责重建、训完丢弃——推理期只部署 2740 参数的编码器。两阶段训练：MAE 时域预训练 → FFT-MAE 频域微调（只约束幅度谱、放松相位——判别信息全住幅度谱里，时域 MAE 会被半个采样点的对齐差主导）。
          - listitem [ref=f160e30]: 单通道折叠（笔记从参数量反推的架构关键）：Conv2 参数 1040=16×(8×8×1)+16 说明输入是单通道——每级卷积只在单通道「图」上滑窗、配 Reshape 折叠，乘法随通道数的增长被消掉，这是算子能压到 1/5 的架构原因。
          - listitem [ref=f160e31]: 结果四件套：干净条件 90.36%（MFCC 91.04 / mel 90.69 / PNCC 88.29——「可比但不超过」，比 MFCC 低 0.68）；0dB 噪声下 81.84% 反超 MFCC 的 76.64%（+5.2 点），两曲线在干净端与噪声端排序翻转（针对性的抗噪增益而非全局平移）；算子 5488 vs 26771（1/4.88，零 Log——Log 在无 FPU MCU 上靠查表实现是隐藏坑）；单位算子准确率约 5 倍且全 SNR 一致。
          - listitem [ref=f160e32]: 抗噪机理是副产品不是显式约束：有损压缩的最优解保留方差大、可预测的成分（谱包络类），与信号不相关的噪声在「信号可重建、噪声不可重建」的竞争里处于劣势——没有对抗项、没有 DAE 式噪声注入，鲁棒性更多来自特征本身的平滑性。
          - listitem [ref=f160e33]: 体系愿景：与同组的 NN 版 PDM-to-PCM 转换器、NN 分类器拼接 → 从麦克风码流到分类输出全程无传统 DSP 的端到端 KWS。
          - listitem [ref=f160e34]: 边界：重建目标不直接优化判别性（干净条件 0.33–0.68 点差距可能就是分开训练的账，联合微调未做）；50×16 黑盒码不可解释、跨词迁移性未验证；Conv1 输出 16000×32=512K 元素中间张量——几百 KB SRAM 的 MCU 无法整块驻留（算子优势 ≠ 内存可行性）；只测 AWGN（「白噪声是性能下界」论断有争议）；无系统性消融（两阶段损失无对照数字、瓶颈尺寸无扫描）；模型体积 / 时延 / 功耗 / 内存全未报告、网络停在浮点口径（同组其他工作都做了二值化）。
    - generic [ref=f160e35]:
      - paragraph [ref=f160e36]: §01 · 问题陈述
      - heading "三个互相牵制的目标" [level=2] [ref=f160e37]
      - generic [ref=f160e39]: 张力在哪：自动化——特征由网络从数据里学出来，把专家从选型调参里解放；算子预算低一个量级——替换 FT 族且不需要 Log 这类低位宽硬件上昂贵的非线性；精度不能塌——干净条件差距 1 个点以内、噪声条件反超。难点：把特征提取压成极小编码器（2740 参数、50×16 瓶颈）后信息瓶颈很紧，无监督重建目标又不直接优化判别性——学到的表示必须恰好同时满足「可重建、够紧凑、对分类器有用、抗噪」四个性质。
      - generic [ref=f160e40]: 隐含承认的三个不足：特征选择仍是「从人工候选里挑」，缺乏数据驱动自动化；NAS 虽有进展但「确定最优架构仍依赖具体案例和专家知识」；手工频谱特征在噪声下的退化是系统性弱点（Fig 7a 的衰减斜率差），不只是绝对精度问题。
