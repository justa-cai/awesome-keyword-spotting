            - listitem [ref=f82e220]: 噪声全合成：训练 SNR [0,20] 采样、测试 10/20dB 类型不同——无真实远场 / 混响 / 多说话人竞争。
            - listitem [ref=f82e221]: FG DAT 在 Table 3 被略去：公开集上负结果是否复现无从得知。
            - listitem [ref=f82e222]: 口音无对照：没回答「训练加入多口音后 DA DAT 增益是否仍在」；分口音细分报告缺失。
            - listitem [ref=f82e223]: 数字口径小瑕疵：DAT 对 AT 的 7.23%/13.94% 与 Table 2 原值复算有轻微出入。
      - generic [ref=f82e224]: 值得追的方向：① 推理端自适应统计量——按环境 SNR 选择或插值多套 BN（条件归一化），去掉干净分布假设，对持续噪声部署是刚需；② 降低对抗训练税——单步 FGSM / 免费对抗训练 + 解耦，验证廉价对抗样本能否保住大部分收益；③ 数据源感知解耦推广到混响 / 远场仿真 / 多说话人 / 多语言口音——每个都是天然独立分布，框架直接容纳；④ 深挖 FG DAT 失败机理（BN 分路数与有效 batch 的关系），把经验法则变成可计算的设计准则；⑤ 与量化 / 蒸馏正交组合——验证全链路压缩后是否仍保增益（决定能否进产品）；⑥ SimAM 按噪声条件门控或替换其它无参数注意力。
