        - heading "一分钟版本" [level=2] [ref=f82e26]
        - list [ref=f82e27]:
          - listitem [ref=f82e28]: 三重挤压：端侧 KWS 硬件受限（小内存高效率）+ 7×24 暴露在从未见过的音频变异（SNR / 噪声类型 / 口音）+ 失效代价不对称——论文把误唤醒定性为「对用户隐私的侵害」（无交互意图的环境音频被上传云端），不只是体验问题。
          - listitem [ref=f82e29]: 两层缺口：① 常规增强「一锅炖」——加噪、语速扰动、SpecAugment 的特征统计量显然不同，却共用一套 BN；② 对抗样本直接混训会 label leaking——对抗副本虽人耳听不出差别，落在特征空间不同区域，共享 BN 统计量互相污染、过拟合到专门化对抗分布。
          - listitem [ref=f82e30]: 方案（DA DAT）：干净数据走主 BN；每个增强源各配专属辅助 BN；每个源的对抗副本（8 步 PGD）也各配一个——共享卷积权重、分家归一化层；评估时删掉全部辅助 BN 只留干净主 BN，推理零开销。
          - listitem [ref=f82e31]: 结果：内部集（4 个 Meta 关键词，训练只有美音、测试横跨 5 种未见口音）1% FAR 工作点，10dB 下 FRR 11.98→7.15（相对最强无对抗基线 −40.3%）；GSC V1 98.06%、错误率相对降 27.61%。噪声越重收益越大——对抗扰动扮演了最坏情况噪声。
          - listitem [ref=f82e32]: 两个自挖的坑：① FG DAT 负结果——按扰动强度分多档 BN 反而比不解耦还差：解耦粒度必须对齐真实分布数量，不是越细越好；② SimAM 在 10dB 下回归（7.15→8.47）论文只字未提——注意力模块在重噪下不稳。
          - listitem [ref=f82e33]: 成色缺口：无外部 SOTA 横向对比（MatchboxNet / BC-ResNet 一个没比）；推理只留「干净 BN」的假设与全部加噪测试存在张力；8 步 PGD 的训练开销未报告。
    - generic [ref=f82e34]:
      - paragraph [ref=f82e35]: §01 · 问题陈述
      - heading "「小」和「稳」必须同时成立；对抗样本是免费资源但会标签泄漏" [level=2] [ref=f82e36]
      - generic [ref=f82e38]: 流式形态放大一切成本：固定窗口在连续流上滑动（内部集 900 ms/90 帧，GSC 1 s/100 帧），每移 10 帧出一次判决——模型每秒被调用约十次，每次独立面对当时当地的声学条件，没有喘息纠错机会；监听时长把每个参数、每次乘加放大成电池损耗。三层现状缺口：① 增强源盲目混合——工业管线把干净 + 加噪 + SpecAugment 当同一分布，BN 批统计量跨源混合估计；② 对抗样本的 label leaking——此前工作（本文 AT 基线，Wang 等 ICASSP 2019）已把对抗样本当增强用于注意力 KWS，但直接混训会让网络过拟合到「专门化的对抗分布」，正常数据性能退化——根源是两个不同分布被强行共享同一套归一化参数；③ 小模型容量天花板——SE/CBAM/GCT 等即插即用注意力都要可学习参数，对 footprint 敏感场景不是免费午餐。
