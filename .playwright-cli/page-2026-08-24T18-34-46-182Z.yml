      - generic [ref=f82e188]: 消融六个发现：① DAT 对 AT：FRR 相对降 ~6.9%（20dB）/ ~14.4%（10dB）（按 Table 2 原值复算；论文表述 7.23%/13.94% 有轻微口径出入，以原表为准）——原始与对抗间的分布失配真实存在；② DA DAT 对 DAT：再降 13.69% / 16.76%（复算吻合）——跨数据源解耦额外赚一块；③ FG DAT 负结果（最有信息量）：按扰动强度分多档 BN 反而比不解耦的 AT 还差（20dB 7.47 对 6.20）——人为把同一分布切成多档伪分布 = 统计估计样本变稀 + 强迫网络区分本不存在的差异，解耦粒度必须对齐真实分布数量；④ SimAM 不稳：20dB 边际改善（4.98→4.52），10dB 反而退化（7.15→8.47，AUC 0.964→0.961）——论文只字未提，是读者要自己抓回来的回归；⑤ SpecAugment 边际收益有限（7.33→6.28 / 12.55→11.98）——常规增强在这一数据规模接近天花板，反衬对抗样本的稀缺价值；⑥ 超参：ε 按数据集手调（0.2 / 0.1）、SimAM λ=1e-4、Adam lr 0.005 + 余弦退火、15 epoch、滑窗移 10 帧。
