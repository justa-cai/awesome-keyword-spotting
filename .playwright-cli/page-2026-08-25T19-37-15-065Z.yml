      - generic [ref=f3e282]: ↳ 搜出的模型几个月就被超越，但「什么算子在哪层有效」的模式结论会沉淀为设计常识——把 NAS 当分析工具用（投票统计 + 层级模式），比只当自动设计器用，长期回报更高。
      - paragraph [ref=f3e283]: ③ 给搜索空间加一个「参数不变收益可变」的算子，常有意外的收获。
      - generic [ref=f3e284]: ↳ 空洞卷积、跳跃连接都属于这类「零参数开销的结构选项」——把它们放进候选池的边际成本为零，而梯度可能会告诉你该任务恰好需要它；候选池设计的性价比原则：优先加免费的选项。
    - paragraph [ref=f3e285]: 系列坐标：NAS×KWS 谱系的 2020 三连——#2 AutoKWS（小足迹约束）、本文（空洞卷积 + 模式分析）、#12 MicroNets（硬件在环）；2021 年潜空间 NAS 换掉搜索机制、2022 年贝叶斯 NAS 引入不确定性建模——共同底色始终是：搜索空间里的领域知识决定 NAS 上限，三篇各自的候选池就是最好的证据。
