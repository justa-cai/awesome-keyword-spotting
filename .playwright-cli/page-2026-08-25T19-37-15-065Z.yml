    - generic [ref=f3e16]:
      - generic [ref=f3e17]: TL;DR
      - list [ref=f3e18]:
        - listitem [ref=f3e19]: ◆ 手工 KWS 架构三宗罪：设计偏见（套路是人试出来的）、次优性（庞大空间里手工难触最优）、任务特殊性（为图像设计的通用架构未必适合 1 秒短音频）。
        - listitem [ref=f3e20]: "◆ 本文与 #2 AutoKWS（小米）同年独立把 DARTS 带进 KWS——两篇互相印证了可微分 NAS 在该任务的可行性，也各自贡献了不同的搜索空间设计。"
        - listitem [ref=f3e21]: ◆ 本篇搜索空间的特色：把卷积核扩到 7×7 并引入空洞卷积——后者能不加参数地扩大感受野，恰好匹配短音频的时序上下文需求。
        - listitem [ref=f3e22]: ◆ 结果的双读法：同参数量精度更高（性能视角）或同精度参数更少（部署视角）——嵌入式场景下后者更值钱。
