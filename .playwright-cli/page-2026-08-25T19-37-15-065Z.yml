      - generic [ref=f3e280]: ↳ 三组人 2020 年独立做 DARTS×KWS，说明技术时机（可微分 NAS 成熟 + KWS 任务规模合适）已经到位——跟踪「同年多篇同题」比追单篇更能提前看到方向；集群里的差异点（各自的搜索空间）就是该方向的下一步。
