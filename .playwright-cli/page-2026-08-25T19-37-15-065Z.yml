      - generic [ref=f3e220]:
        - generic [ref=f3e221]: "1"
        - paragraph [ref=f3e222]: 「2020 三连」是这一年的真实图景。#2（小米）、本文（华为/Alberta）、#12 MicroNets（Arm）——三组人同年独立把 DARTS 路线搬进 KWS，分别贡献了小足迹约束、空洞卷积/模式分析、操作数延迟代理。同题撞车的年份集群是范式转移的信号。
      - generic [ref=f3e223]:
        - generic [ref=f3e224]: "2"
        - paragraph [ref=f3e225]: 模式分析的寿命比模型长。搜出的具体架构会很快被更新的模型超越，但「浅层大核、深层跳跃、DSConv 主力、空洞有用」这些模式结论会沉淀进手工设计常识——本文在这部分的着墨最重。
      - generic [ref=f3e226]:
        - generic [ref=f3e227]: "3"
        - paragraph [ref=f3e228]: 参数效率的两种读法要分清。论文表格常报「同参数更准」，工程上要的是「同准更省」——本文两种都成立，但很多后续工作只证其一；读 NAS 论文时先看对比的坐标轴是哪个。
