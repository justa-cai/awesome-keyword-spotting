    - generic [ref=f257e346]: 读表要点
    - listitem [ref=f257e347]: ◈ 指标选择有讲究：FApH（每小时假警报）直接对应用户被打扰的频率与浪费的功耗，是产品侧硬约束——固定 FApH 比 FRR 才是同等误打扰代价下的准确率对比；0.5 FApH 比 10 FApH 严苛二十倍，更接近商用要求。
    - listitem [ref=f257e348]: ◈ DET 曲线形态：低假警报区（商用最关心的严苛端）mobile-Transformer 五者最优；放宽误警报预算后与 CRNN/ResNet 接近——注意力骨干的收益集中在「几乎不许误触发」的工作点。
    - listitem [ref=f257e349]: ◈ 尺寸缩放（Table 4）：mobile 22K→331K 干净 FRR 从 1.95% 降到 0.70%（越大越好趋势成立）；同档 mobile 全面占优，仅 large 档含噪出现 0.94 vs 0.83 的小幅交叉。
    - listitem [ref=f257e350]: ◈ vanilla-large 含噪（0.83）反而低于干净（1.15）的反常格说明单配置评测有波动——做结论应看整体趋势而非单格数字。
