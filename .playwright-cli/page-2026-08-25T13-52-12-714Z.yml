    - generic [ref=f257e398]: 图4 · 边界与延伸：左技术边界（零延迟/功耗数据、窗口敏感且需重调、无正交压缩叠加、单一唤醒词、α 反常），右实验边界（中文单一、基线裁剪公平性、统计不完整、笔误）+ 延伸方向。
  - generic [ref=f257e399]:
    - generic [ref=f257e400]: 可迁移判断
    - paragraph [ref=f257e401]: ↳ 压了更好不是玄学，是过参数化诊断：如果小模型+结构先验能打平大模型，说明大模型在该任务上本就过参数化——结构压缩同时是正则化。先做同档对照再谈压缩收益，避免把正则化红利错记到结构头上。
    - paragraph [ref=f257e402]: ↳ 每把刀只切一种冗余：层间冗余配共享、秩冗余配低秩、通道冗余配可分离卷积——混着切既说不清收益来源，也容易切到骨头。设计压缩组合时先把冗余分类。
    - paragraph [ref=f257e403]: ↳ 窗口类超参都要扫甜点：b=40/60/80 的差异说明截断窗口与任务模式长度强绑定——太小截断上下文、太大引入噪声，两头都伤。换任务/换词长必须重扫，这是截断注意力路线的隐性成本。
    - paragraph [ref=f257e404]: ↳ 参数量只是部署指标的代理：85K ≠ 低延迟 ≠ 省电——注意力的访存模式、算子硬件友好度都会介入。压缩论文不报延迟/功耗，「端侧可行」就停在推断层面。
