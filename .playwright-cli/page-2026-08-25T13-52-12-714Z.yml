  - heading "§02 方法：三种冗余，三把刀" [level=2] [ref=f257e128]:
    - generic [ref=f257e129]: §02
    - text: 方法：三种冗余，三把刀
  - generic [ref=f257e130]: Attention(Q,K,V) = softmax(QKᵀ/√d_k)·V 的三个 d×d 投影是体积大头
  - generic [ref=f257e131]:
    - generic [ref=f257e132]: "共享: N 个注意力块共用同一份参数（N=3 → 注意力参数 → 1/3） 只共享注意力，不共享前馈（ALBERT：共享前馈大幅掉性能） 低秩: W ∈ ℝ^(d×d) → ℝ^(d×r) · ℝ^(r×d) # d=64, r=16 = d/4 → 参数减半 可分离: FFN 全连接 → 分组卷积(g=4) + depthwise + 1×1 pointwise 参数比 = 1/C_o + 1/D_K² （通道越大、核越大收益越显著）"
    - generic [ref=f257e133]: 人话：三把刀切的是三种不同的冗余——注意力模式在层间高度相似（唤醒要回答的「哪些帧互相关联」各层雷同）→ 共享；唤醒词是短序列局部模式，注意力矩阵的有效自由度远低于满秩 → 低秩；前馈层的通道间冗余 → 可分离卷积。因为只共享注意力，前馈反而成了另一个参数大头，必须单独想办法——共享与压缩策略在这里互相咬合。
  - generic [ref=f257e134]:
    - generic [ref=f257e135]: FL(p_t) = −α·(1−p_t)^γ·log(p_t) p_t = y·ŷ + (1−y)(1−ŷ) α=0.1, γ=1 · 正标注重复 L=R=6（正样本 ×12） · h=0, b=60
    - generic [ref=f257e136]: 人话：α 线性控制正负样本权重、γ 指数控制难易样本权重——α=0.5 且 γ=0 时退化为普通交叉熵。注意本文 α=0.1 给更稀有的正类降权，与常规用法方向相反，论文只给结论没有敏感性分析。截断窗口 b=60 是消融甜点：太小盖不住整条唤醒词（上下文被截断），太大引入不相关噪声增加学习难度——窗口要与唤醒词时长匹配，换词需重调。
