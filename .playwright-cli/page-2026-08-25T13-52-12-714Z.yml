      - paragraph [ref=f257e357]: WakeupNet 框架：压缩 Transformer encoder 为骨干的端到端流式唤醒，85K 最小参数下干净/含噪双最优（1.29%/2.43%），干净场景领先经单尾 z 检验显著。
