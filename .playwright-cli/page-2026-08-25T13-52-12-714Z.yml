- generic [ref=f257e2]:
  - generic [ref=f257e3]: 论文精读 · 可视化版 · 2022 №41
  - heading "Transformer 压到 85K 装进唤醒芯片： 三把刀各砍一种冗余，压了反而更好" [level=1] [ref=f257e4]: Transformer 压到 85K 装进唤醒芯片：三把刀各砍一种冗余，压了反而更好
  - generic [ref=f257e5]:
    - generic [ref=f257e6]: WakeupNet · 华为英国
    - generic [ref=f257e7]: arXiv 2210.02904 · mobile-Transformer
    - generic [ref=f257e8]: HiMia「ni hao, mi ya」· 524 小时中文唤醒
    - generic [ref=f257e9]: 85K 参数 · FRR@0.5FApH 1.29%/2.43%（五模型最优）
  - generic [ref=f257e10]: 一句话：唤醒模块 always-on，存储与能耗直接换算成待机功耗——vanilla Transformer 比唤醒预算大两三个数量级。WakeupNet 用三件套把它压进 85K：跨层只共享注意力参数（省 2/3）、QKV 投影低秩分解（d×d→2×d×r，参数减半）、前馈层换分组可分离卷积（1/4）——三种手段分别命中层间/秩/通道三类冗余。同档对照显示压了不降反升：85K 的 mobile 版干净/含噪双超 160K 的 vanilla 版。配上零前视截断注意力（h=0, b=60）与 focal loss，端到端流式检测五模型最优。
  - generic [ref=f257e11]:
    - generic [ref=f257e12]: TL;DR
    - listitem [ref=f257e13]: ◈ 唤醒是交互第一道关卡 + always-on：漏唤醒/假唤醒用户立刻感知，开销直接换算待机功耗——「极致压低存储与计算成本」是全文总纲，所有设计决策都能还原到准确率/延迟/体积的三重权衡。
    - listitem [ref=f257e14]: ◈ 老路线的死因：填充词方案要 ASR+HMM，音素错则全错、复杂度高、中间层放大误差；端到端直判的 CNN 感受野受限预测分偏低、RNN 历史拖泥带水输出不锐利（Fig.4 逐帧曲线实证）。
    - listitem [ref=f257e15]: ◈ 标注策略：只把唤醒词结束点一帧标正——直接优化检测本身、从根上避免触发提前/滞后；代价是极端不平衡，对策是正标注重复 L=R=6 帧（正样本扩 12 倍）+ focal loss（α=0.1, γ=1）。
    - listitem [ref=f257e16]: ◈ 流式两件套：因果卷积前端替代位置编码（位置信息隐式进入表示，因果=只看历史）；截断自注意力（时刻 t 只看 [t−60, t]，h=0 零前视——宁可放弃前瞻也不让唤醒多等一帧）。
    - listitem [ref=f257e17]: ◈ 三把刀各砍一种冗余：共享砍注意力层间冗余（→1/N）、低秩砍投影矩阵秩冗余（d=64, r=16 减半；唤醒词是短序列局部模式，注意力矩阵本就低秩）、分组可分离卷积砍前馈通道冗余（g=4）——互补不重叠。
    - listitem [ref=f257e18]: ◈ 最有说服力的结果：同档对照 mobile-media 85K（1.29/2.43）vs vanilla-media 160K（1.54/4.55）——参数省近半双指标反超；tiny 档差距悬殊（22K 的 4.74 vs 41K 的 8.81）——vanilla 在唤醒任务上本来就过参数化，压缩同时是正则化。
    - listitem [ref=f257e19]: ◈ 主对比含噪优势近四成（2.43 vs 次优 4.02）：噪声破坏局部帧特征，长程上下文显式建模能从窗口内其他帧补全信息——注意力结构的固有强项在压缩后没有丢。
  - heading "§01 问题：Transformer 装不进唤醒预算" [level=2] [ref=f257e20]:
    - generic [ref=f257e21]: §01
    - text: 问题：Transformer 装不进唤醒预算
  - generic [ref=f257e22]: 差两三个数量级的体积鸿沟 + 上下文建模的吸引力
  - generic [ref=f257e23]:
    - generic [ref=f257e24]:
      - heading "为什么想要 Transformer" [level=3] [ref=f257e25]
      - paragraph [ref=f257e26]: 唤醒词是强依赖上下文的序列判别问题——同一音素出现在唤醒词里和普通对话里意义完全不同，判断必须依赖周边帧。Karita 等的系统性对比里 Transformer 在多数 ASR 数据集上最好；且无递归结构，对 GPU 并行友好。
    - generic [ref=f257e27]:
      - heading "为什么没人直接用" [level=3] [ref=f257e28]
      - paragraph [ref=f257e29]: vanilla Transformer encoder 从设计之初就不是为端侧考虑的。DistilBERT 等压缩后的 BERT 仍在百万到千万参数级，而唤醒预算是几万到十几万——差两三个数量级。需要一套专针对「极小档位」的压缩方案，即 mobile-Transformer。
    - generic [ref=f257e30]:
      - heading "标注与不平衡" [level=3] [ref=f257e31]
      - paragraph [ref=f257e32]: 沿用只标 offset 为正的原则：直接优化检测分数本身而非优化代理任务再间接决策。但每条唤醒语音正样本只有一帧——普通交叉熵会被海量负样本淹没。数据层扩 12 倍 + 损失层 focal loss 双管齐下。
    - generic [ref=f257e33]:
      - heading "流式改造两处" [level=3] [ref=f257e34]
      - paragraph [ref=f257e35]: 标准自注意力要看整条序列才能算权重，无法流式。① 前端用因果卷积让位置信息隐式进入（位置编码需要预知序列并对齐，流式下既不自然也不经济）；② 注意力截断到固定窗口，复杂度从全序列长降到窗口长。
