      - generic [ref=f257e359]: "2"
      - paragraph [ref=f257e360]: mobile-Transformer 三件套：跨层注意力共享（→1/N）+ 投影低秩分解（d×d→2dr）+ 前馈分组可分离卷积——并用同档对照给出「压了更好」而不仅是「能压」的证据。
    - generic [ref=f257e361]:
      - generic [ref=f257e362]: "3"
      - paragraph [ref=f257e363]: 两个迁移验证：自称首次系统研究低秩分解在 Transformer 语境用于语音唤醒；把 ALBERT 的共享结论（只共享注意力最优）从 NLP 迁移到语音并验证成立边界。
    - generic [ref=f257e364]:
      - generic [ref=f257e365]: "4"
      - paragraph [ref=f257e366]: 完整工程配方：感受野甜点（b=60）、零前视流式配置、focal loss 参数、正标注重复帧数、学习率调度——后续复现与迁移的直接参考。
