  - generic [ref=f197e366]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f197e367]
    - list [ref=f197e368]:
      - listitem [ref=f197e369]: ↳ 「鲁棒」要先翻译成可优化的几何量（类内紧、类间开、正交），才能变成损失函数——模糊目标无法被梯度下降。
      - listitem [ref=f197e370]: ↳ 监督要施加在离被优化对象最近的位置：给前端配专属嵌入头，好过让梯度穿过十几层间接稀释。
      - listitem [ref=f197e371]: ↳ 类级统计量（类心）天然类均衡，替代成对度量做鲁棒目标可避开主导类别偏置——低 SNR 下尤其明显。
      - listitem [ref=f197e372]: ↳ 两个方向相反的几何目标必须融合成单一最小化对象（谱范数 + 指数限幅），直接加权求和会在训练中振荡。
      - listitem [ref=f197e373]: ↳ 训练期手段（损失/辅助头）是端侧最便宜的鲁棒性来源：推理图零变化，收益全沉淀在权重里——先穷尽这类手段再动架构。
