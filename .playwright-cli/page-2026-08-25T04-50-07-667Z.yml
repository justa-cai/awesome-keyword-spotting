    - heading "CE 只管「分开」不管「稳」： 推理零成本的噪声鲁棒这样补" [level=1] [ref=f197e5]: CE 只管「分开」不管「稳」：推理零成本的噪声鲁棒这样补
    - generic [ref=f197e6]:
      - generic [ref=f197e7]: LOVO 损失 · arXiv 2210.11519
      - generic [ref=f197e8]: 高丽大学 × 德雷塞尔大学
      - generic [ref=f197e9]: 两路度量学习 + 谱范数正交正则
      - generic [ref=f197e10]: TENet12 · Speech Commands v1
    - generic [ref=f197e11]: 把「鲁棒特征」具体化为三个几何量（类内紧、类间开、类间正交），全部在训练期用损失函数解决——嵌入头训练完丢弃，推理图与前作逐位相同（102K / 6.64M）。
    - generic [ref=f197e12]:
      - heading "一分钟版本" [level=3] [ref=f197e13]
      - list [ref=f197e14]:
        - listitem [ref=f197e15]: ▸ 双约束：KWS 常驻监听，参数量和 FLOPS 是关键评价指标；部署噪声与训练噪声分布不重合——干净 97% 的模型在 WHAM 0dB 掉到 75.92。
        - listitem [ref=f197e16]: ▸ 靶心：前作 LDy-TENet 的动态滤波器用 CE 联合训练，但 CE 的几何行为是找一个把各类分开的决策面——只要可分它就满足；鲁棒性要求特征在噪声扰动下几何结构稳定。「可分」与「稳」不等价。
        - listitem [ref=f197e17]: ▸ 翻译：鲁棒 = 三个几何量——类间方差（要大）、类内方差（要小）、类间正交性（要不相关）——全部落在度量学习覆盖范围内。
        - listitem [ref=f197e18]: ▸ 两路解耦：滤波器输出直接接 2 层 T-Conv 嵌入头算逐对损失 L_M（梯度一步直达前端，别穿十几层稀释）；分类器末端 GAP 嵌入上算类心级 L_I / L_O。
        - listitem [ref=f197e19]: ▸ L_O 的四个设计决策：矩阵滤波器清零对角（正交只看非对角）、e^(−MDM) 把「最大化距离」翻转为「最小化衰减项」并限幅、谱范数只罚最大奇异值（不像逐元素范数把整个矩阵往零拉）、幂迭代 10 次。
        - listitem [ref=f197e20]: ▸ 零成本验证：Table I 里 LDyLM/LDyLMIO 与前作参数量 FLOPS 逐位相同（102K / 6.64M）——「训练期损失、推理零成本」从数字上坐实。
        - listitem [ref=f197e21]: ▸ 主结果：WHAM 0dB +3.03（78.95 vs 75.92，摘要的「3%」即此）、Urban +2.37、DCASE +1.30；全条件平均 92.63 全场最高——噪声越凶收益越大，正是鲁棒方法的签名。
        - listitem [ref=f197e22]: ▸ 度量学习横评：成对方法（FaceNet/circle/multi-sim）干净端微弱领先、低 SNR 系统性落后——mini-batch 枚举样本对让大类按 O(Mk²) 占据梯度；类心级监督每类贡献一份，天然类均衡。
        - listitem [ref=f197e23]: ▸ 消融：单项强度 L_I > L_M > L_O；L_IO 联合才同时锁「类间开 + 正交」；完整 L_MIO 低 SNR 全面最优，代价是干净端 −0.10。
        - listitem [ref=f197e24]: ▸ 边界：超参纯手工（λ₂=λ₃=0.01 说明几何项与 CE 平衡脆弱）；8 次重复不报方差；batch 100/12 类平均每类 8 样本估类心；式 2 名实不符（称 triplet 实为 contrastive 形态）。
    - heading "§01 问题：CE 的监督信号不含「稳」" [level=2] [ref=f197e25]:
      - generic [ref=f197e26]: §01
      - text: 问题：CE 的监督信号不含「稳」
    - generic [ref=f197e27]: 三条老路各自的坑
    - paragraph [ref=f197e28]: 生成式语音增强（DAE/GAN/Griffin-Lim）以重构干净信号为目标——前端计算量大，为常驻监听配重型增强网络在能耗上不可行；分类损失驱动的前端特征增强省掉了增强目标，但监督信号只有 CE；通用度量学习（center/FaceNet/DeCov/multi-sim/circle）能改善嵌入判别性，但成对距离方法会偏向样本量大的主导类别。
    - generic [ref=f197e29]:
      - generic [ref=f197e30]:
        - heading "成对度量的主导类别偏置" [level=4] [ref=f197e31]
        - paragraph [ref=f197e32]: mini-batch 内枚举所有样本对时，大类的样本对数量按 O(Mk²) 占据梯度主导——高 SNR 下无伤大雅（成对监督更细腻所以略优），低 SNR 下类别贡献被噪声拉平，偏置伤害显形，成对方法系统性退化。
      - generic [ref=f197e33]:
        - heading "直接搬正则工具也不对" [level=4] [ref=f197e34]
        - paragraph [ref=f197e35]: DeCov 去相关作用在逐样本激活；谱归一化原本是 GAN 判别器的 Lipschitz 约束，作用在权重矩阵——而这里需要正则的对象是类心矩阵的协方差，且要同时编码距离项，通用工具没有现成形态。
