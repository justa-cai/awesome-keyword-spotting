    - generic [ref=f197e122]: L_Total = L_CE + 0.25·L_M + 0.01·L_I + 0.01·L_O
    - generic [ref=f197e123]: 人话：分类损失是基本盘，逐对的三元组项给 0.25；两个类心级几何项压到 0.01——论文的经验观察是 L_I、L_O 影响力强于其他损失，不抑制会挤占 CE 的学习空间（几何正则过强牺牲分类精度）。L_M + L_I + L_O 合称 LOVO 损失（「低变异正交」；论文摘要与正文缩写展开不一致，忠实记录）。
  - paragraph [ref=f197e124]: 为什么 TAP 必须有：时序卷积输出是变长时间步序列，度量学习要在 mini-batch 内两两算距离——必须先把时间维平均掉压成 128 维定长向量。为什么类心损失挂在 GAP 输出上：32 维定长、语义浓缩，天然适合类心统计载体，且零新增层。
