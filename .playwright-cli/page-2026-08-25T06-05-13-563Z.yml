    - list [ref=f220e263]:
      - listitem [ref=f220e264]: ↳ 自动选帧/选例的损失会让学生自己挑最舒服的位置——监督信号集中在哪个时刻，行为就漂向哪个时刻；要控制行为先控制监督落点。
      - listitem [ref=f220e265]: ↳ 「收窄搜索范围」可以换成「从搜索结果回退」：前者要边界知识，后者只要相对参照——免标注的控制往往来自相对化改写。
      - listitem [ref=f220e266]: ↳ 把 trade-off 从「系统设计目标」变成「训练期超参数」的前提是单调映射——单调性让命中约束的搜索成本从密集扫参降到几个点。
      - listitem [ref=f220e267]: ↳ 随机化回退优于确定性回退：交替监督两个位置避免单点过拟合，代价曲线从悬崖变成可调斜坡。
      - listitem [ref=f220e268]: ↳ 算法延迟与工程延迟是两本账：改损失压算法延迟、省算力压工程延迟——两者正交，完整的端侧延迟账本要两边一起算。
