    - generic [ref=f141e219]:
      - generic [ref=f141e220]: JUDGEMENT
      - paragraph [ref=f141e221]: ↳ 把「难标注的中间量」变成隐变量是深度学习的通用招法：对齐信息难标但训练又似乎需要——CTC 证明它可以被边际化掉；遇到类似困境（分割、定位、对齐）先问「这个中间量能不能积分掉而不是标出来」。
      - paragraph [ref=f141e222]: ↳ 标注粒度决定流水线复杂度：话语级文本 vs 帧级对齐是两个数量级的标注成本——损失函数的设计直接改变数据资产的需求结构，进而决定项目可行性。
      - paragraph [ref=f141e223]: ↳ 工程友好性要写进架构：ReLU+BN（量化友好）、逐帧无状态（延迟恒定）——这篇 2017 年的论文已经在为 INT8 部署铺路；「为部署而设计」不是事后优化，是架构期的选型。
