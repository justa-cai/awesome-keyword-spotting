  - generic [ref=f258e115]: 把 HMM 里 Viterbi 解码搜索的职责移植进纯 CNN 世界
  - generic [ref=f258e116]:
    - generic [ref=f258e117]: "Res2Net 块（s=4，通道切分 + 层内级联）: y₁ = x₁ # 不过卷积，等效深度 0 y₂ = K₂(x₂) # 一次 3×3，等效深度 1 yᵢ = Kᵢ(xᵢ + yᵢ₋₁) 2<i≤s # 输入混入上一段输出，深度递增"
    - generic [ref=f258e118]: 人话：同一层之内天然并存 1 到 s−1 次卷积深度的感受野层级——这是「免费」的结构属性，对比 bottleneck 各分支感受野完全相同。多个块堆叠后因组合效应拿到各种粒度的表示。适配逻辑：目标检测要处理大小悬殊的物体，唤醒词要处理长短悬殊的词——对「单层内多感受野」的需求同构。
  - generic [ref=f258e119]:
    - generic [ref=f258e120]: "M1 滑窗打分 → 分数 > γ₁ 记触发点 → ≥2 个连续触发点 = 疑似区域 y_M1 = max(连续触发点分数) # 一个强响应子段即可顶起——匹配「碎片存在性」职责 M0 介入：检测第一触发点~最后触发点间的片段（插值到 200 帧）→ y_M0 y_f = (y_M0 + y_M1)/2 > γ₁ → 触发 → 1 秒不应期"
    - generic [ref=f258e121]: 人话：M1 窗小、扫描频繁但单次便宜，适合常驻；M0 大而全但调用稀疏——常驻系统的平均算力被压低。M0 的输入被触发点天然「裁剪」，等于推理时自动做了一次内容聚焦，窗外语音不进全局判别。「两个连续触发点」是对孤立虚警的廉价防抖；γ₁ 一阈值两用（子段触发 + 最终判决），开发集上调整。
  - generic [ref=f258e122]:
    - generic [ref=f258e123]:
      - heading "双线性插值为什么敢用" [level=3] [ref=f258e124]
      - paragraph [ref=f258e125]: 依据是「同一段语音的频谱图结构相似」——插值只改变时间轴采样密度不破坏结构。且它不是可学习变换而是一次可预计算的卷积，训练推理零额外参数。边界：30 帧拉到 200 帧 ≈ 6.7 倍拉伸，极端缩放下是否保住判别特征论文未分析。
    - generic [ref=f258e126]:
      - heading "标签继承的容忍度" [level=3] [ref=f258e127]
      - paragraph [ref=f258e128]: 子段继承整句标签——(a)(b)(c) 含部分/全部唤醒词都是正例，(d) 负例。M1 只判「碎片存在性」，这个粒度的监督够用；代价是无法区分「Nihao Wen」与「Nihao Wenwen」的尾部差异——对同产品线易混词的区分能力存疑。
