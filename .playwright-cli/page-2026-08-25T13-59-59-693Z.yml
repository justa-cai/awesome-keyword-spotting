  - generic [ref=f258e3]: 论文精读 · 可视化版 · 2022 №42
  - heading "窗口长度怎么选都错？ 那就滑窗定位、变长确认：52K 参数的双路唤醒检测" [level=1] [ref=f258e4]: 窗口长度怎么选都错？那就滑窗定位、变长确认：52K 参数的双路唤醒检测
  - generic [ref=f258e5]:
    - generic [ref=f258e6]: SE-Res2Net · 双路干预式检测
    - generic [ref=f258e7]: arXiv 2209.15296 · letter 短文
    - generic [ref=f258e8]: Mobvoi SLR87 · Hi Xiaowen / Nihao Wenwen
    - generic [ref=f258e9]: 52K 参数 · FRR@FAH=0.5：0.53% / 0.30%
  - generic [ref=f258e10]: 一句话：唤醒词长度在 30–200 帧间浮动（近 7 倍），CNN 却要定长输入——固定窗口对长短词两头都失败。本文用双路拆解这个两难：M1 滑窗学局部模式并常驻扫描定位，M0 把变长片段插值到 200 帧学全局轮廓、只在疑似区域介入确认。骨干用 SE-Res2Net（单层内多尺度感受野 + 学出来的尺度注意力）激进瘦到 52K，在 Mobvoi 上以 LF-MMI 一半参数站进 SOTA 区间，对 ResNet 基线相对降幅最大 86.6%。
  - generic [ref=f258e11]:
    - generic [ref=f258e12]: TL;DR
    - listitem [ref=f258e13]: ◈ 结构性矛盾：同一唤醒词因语速/停顿不同，频谱图 30–200 帧浮动，CNN 要求定长——词比窗长则全局轮廓拼不全（漏检），词比窗短则特征被污染（误唤醒），窗口长度怎么选都错。
    - listitem [ref=f258e14]: ◈ 引言的关键论断：准确的唤醒词片段本身就有价值——问题不在模型容量，在喂进来的输入不干净不完整。VAD 只判「有没有人声」，不解决窗口错配。
    - listitem [ref=f258e15]: ◈ M1 切片通路（局部）：滑窗逐段判「有没有唤醒词碎片」，窗长随词调（75/100 帧非全局一刀切）；子段标签直接继承整句（弱监督简化）——职责是定位不是切边界。
    - listitem [ref=f258e16]: ◈ M0 整形通路（全局）：变长片段双线性插值到固定 200 帧（可预计算的卷积、零参数），学整个词的全局时序轮廓；不常驻——只在 M1 圈出疑似区域后介入，把贵的计算花在刀刃上。
    - listitem [ref=f258e17]: ◈ 流式判决全手工但分层防抖：M1 分数超 γ₁ 记触发点 → ≥2 个连续触发点才唤 M0（单偶发高分被过滤）→ y_M1 取 max、M0 看首末触发点之间 → 平均分判决 → 1 秒不应期防重复。
    - listitem [ref=f258e18]: ◈ 骨干贡献拆解：ResNet→Res2Net 约 −31%（单层内 1~s−1 次卷积深度并存的多尺度），Res2Net→SE 再砍大头（通道重标定 = 学出来的尺度注意力）——两个机制叠加非替代。
    - listitem [ref=f258e19]: ◈ 瘦身交易：删整个 Conv5 stage（128K→52K，−60%），FRR 只涨 0.06/0.05 个点。52K vs LF-MMI 120K——但「性能相似」要按词拆读：四音节词好 40%，三音节词差 32.5%。
    - listitem [ref=f258e20]: ◈ 两处按下不表的空白：双路设计无独立消融（M0-only/M1-only 对照缺失，框架收益与骨干收益不可分离）；零部署侧实测（延迟/功耗未报，参数口径还不明——若 52K 是单分类器，系统总量翻倍）。
  - heading "§01 问题：变长目标 vs 定长模型" [level=2] [ref=f258e21]:
    - generic [ref=f258e22]: §01
    - text: 问题：变长目标 vs 定长模型
  - generic [ref=f258e23]: 四条老路线的不足 + 固定窗口的不对称失败
  - generic [ref=f258e24]:
    - generic [ref=f258e25]:
      - heading "词比窗口长：拼不全" [level=3] [ref=f258e26]
      - paragraph [ref=f258e27]: 固定窗（如 1 秒非重叠段）每次只看到唤醒词的局部特征，整个词的全局时序轮廓永远拼不完整——模型永远在看局部，漏检成为结构性结果。
    - generic [ref=f258e28]:
      - heading "词比窗口短：被污染" [level=3] [ref=f258e29]
      - paragraph [ref=f258e30]: 窗口里混进大量非唤醒词语音，全局特征被污染，误唤醒随之而来。加 VAD 只能省算力——它只判断「有没有人声」，完全不解决窗口与词长的错配。
    - generic [ref=f258e31]:
      - heading "老路线各自的行李" [level=3] [ref=f258e32]
      - paragraph [ref=f258e33]: LVCSR 换词方便但算力远超常驻预算；keyword/filler HMM 至今有竞争力但解码图是工程负担；负例挖掘系统训练要额外的 HMM-TDNN 声学模型；LF-MMI 是混合 HMM/DNN 框架——附加依赖在小足迹部署里都是实打实的成本。
    - generic [ref=f258e34]:
      - heading "RNN 的串行代价" [level=3] [ref=f258e35]
      - paragraph [ref=f258e36]: 连续输入流可能状态饱和；时序串行依赖让 chunk 流式无法并行，即使有 GPU 计算成本与延迟也上升。唤醒词很短，堆叠多层 CNN 的感受野足以覆盖——不必付 RNN 的代价。
