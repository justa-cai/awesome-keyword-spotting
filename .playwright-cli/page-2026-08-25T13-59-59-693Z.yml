    - generic [ref=f258e316]: 读表要点
    - listitem [ref=f258e317]: ◈ 协议设计贴近真实：每个唤醒词单独训二分类模型，另一个唤醒词计入负例——用户说别的命令词不应触发本词模型，比只用随机负例更贴近真实误唤醒场景。
    - listitem [ref=f258e318]: ◈ 训练细节：1024 DFT · 256 Mel 带 · hop 160；Adam lr 2e-4；前 5 轮 SpecAugment（时间掩码 0–30 帧 / 频率掩码 0–20 维，每批三份样本各做一种）——正例有限时模拟丢帧与频带缺失。
    - listitem [ref=f258e319]: ◈ 附带发现（产品选词直接可用）：四音节词比三音节词整体更易检——音节多 = 可判别时序结构更长，Nihao Wenwen 的 DET 曲线整体优于 Hi Xiaowen。
    - listitem [ref=f258e320]: ◈ 引用注意：Table II 行名与参考文献编号疑似互换（[27]/[31]）；Fig.1 图内标注 SE-ResNet50 疑漏「2」——数值不受影响，但对应关系混乱是这篇 letter 的明显瑕疵。
