  - generic [ref=f258e370]:
    - generic [ref=f258e371]: 可迁移判断
    - paragraph [ref=f258e372]: ↳ 定位与确认分开，常驻的只做便宜的那半：M1 小窗常驻扫描、M0 大模型按需介入——平均算力被结构性压低。这个「先粗后精」的级联思路对任何常驻检测任务（VAD、事件检测）都适用。
    - paragraph [ref=f258e373]: ↳ 变长输入不一定要 RNN：插值保结构 + 滑窗给定位，纯前馈也能吃变长序列——不想付串行代价时，先想想输入侧能不能重整，而不是直接上循环结构。
    - paragraph [ref=f258e374]: ↳ 多尺度是免费的结构属性：Res2Net 的感受野阶梯来自通道切分 + 层内级联，不增加任何新算子——选骨干时「单层内感受野多样性」是一个被低估的杠杆（本文消融里值 31%）。
    - paragraph [ref=f258e375]: ↳ 引用前先拆收益归属：本文的 SOTA 数字 = 双路框架 × SE-Res2Net 骨干 × 标签策略的组合效果，但没有 M0-only/M1-only 对照——复现或借鉴时，应把「框架带来的」与「骨干带来的」分开验证，否则容易把全部收益记到其中一个头上。
