  - generic [ref=f203e334]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f203e335]
    - list [ref=f203e336]:
      - listitem [ref=f203e337]: ↳ 把事件级检测问题塞进 token 序列生成框架：检测从「逐字正确」变成「token 出现与否」——错误从 AND 累积变成单点判断，上游字符级噪声被吸收。
      - listitem [ref=f203e338]: ↳ 序列判别训练（MBR 类）要先用似然目标热启动：判别目标依赖假设空间质量，未收敛模型的 N-best 是垃圾——冷启动直接优化判别目标等于优化噪声。
      - listitem [ref=f203e339]: ↳ 训练目标要与推理度量对齐（优化什么就度量什么）——这要求分数定义在模型输出端，而不是事后解析。
      - listitem [ref=f203e340]: ↳ 容量不够时损失技巧救不回来：小预算下为任务定制的紧凑架构仍占优——先定容量档位再谈训练技巧。
      - listitem [ref=f203e341]: ↳ 两条技术路线的系统错误往往是互补的：融合（哪怕最简单的分数求和）能在所有操作点一致占优——部署前值得先测错误相关性再决定是否融合。
