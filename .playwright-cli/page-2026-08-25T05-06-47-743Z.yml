      - generic [ref=f203e258]: ③ 规模贡献：TT-KWS+MBR 350K→13M：5.24→3.27（幅度远超两个损失技巧之和）；SVDF 330K→3.9M 只 3.78→3.38（边际递减快得多）——两种架构的规模敏感度差异是选路线的依据
    - paragraph [ref=f203e259]: 图3 · 逐项叠加消融：token 化（同架构同损失，小模型相对 −31%）；MBR 收益在低 FP 区放大（FN@0.5%FP 相对 −30.4%，容量越少聚焦作用越大）；规模贡献远超两个损失技巧之和。
