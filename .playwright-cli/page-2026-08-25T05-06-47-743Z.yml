    - generic [ref=f203e4]: 论文精读 · 可视化版 · 2022 №15
    - heading "把关键词折成一个 token， ASR 的质量红利就能搬进唤醒词检测" [level=1] [ref=f203e5]: 把关键词折成一个 token，ASR 的质量红利就能搬进唤醒词检测
    - generic [ref=f203e6]:
      - generic [ref=f203e7]: TT-KWS · arXiv 2211.06478
      - generic [ref=f203e8]: Google × 马德里自治大学
      - generic [ref=f203e9]: Transformer-Transducer + MBR
      - generic [ref=f203e10]: Hey/Okay Google · 8300h 数据
    - generic [ref=f203e11]: 「Okay Google」识别成「Okay GOOGL」字符串匹配就失败——把关键词折叠成 <kw> 特殊 token，字符级不确定性被吸收进 token 的声学建模；再用 MBR 损失直接优化检测错误率。
    - generic [ref=f203e12]:
      - heading "一分钟版本" [level=3] [ref=f203e13]
      - list [ref=f203e14]:
        - listitem [ref=f203e15]: ▸ 问题：T-T/Conformer-Transducer 在 ASR 上已到 SOTA——这份质量红利能不能搬进唤醒词检测？直接 ASR + 字符串匹配不行：字符错误 AND 累积（Okay GOOGL 即失败）、关键词训练数据稀疏、硬判决无连续分数。
        - listitem [ref=f203e16]: ▸ 选型：Transformer-Transducer 天然支持逐帧流式解码（常驻监听硬需求）；隐式学习声学-文本对齐——彻底免去常规 KWS 的强制对齐（顺带打通联邦学习路径）。
        - listitem [ref=f203e17]: ▸ 核心一刀：训练时把转写里的关键词替换成特殊 token <kw>（75 个字素词表的一员）——检测问题变成「这个 token 有没有出现」，模型整体预测关键词的声学轮廓；所有含关键词的语句为同一个 token 贡献信号，缓解稀疏。
        - listitem [ref=f203e18]: ▸ MBR 损失：训练目标从「最大化转写似然」改写为「最小化期望检测错误」——以 N-best 假设概率为权重，对该假设的关键词级假阳/假阴率加权求和；必须先用 RNN-T 训好再热启动（未收敛模型的 N-best 是垃圾假设空间）。
        - listitem [ref=f203e19]: ▸ 打分：取 softmax 里 <kw> 的值、整句取 max——连续置信度支持调阈值切操作点，且训练优化什么推理就度量什么（目标与度量对齐）。
        - listitem [ref=f203e20]: ▸ 主结果：token 化让小模型 EER 相对降 31%（8.24→5.68）；MBR 在低 FP 区放大收益（FN@0.5%FP 相对降 30.4%）；大模型 TT-KWS+MBR 3.27% 全面最优；融合 3.09%。
        - listitem [ref=f203e21]: ▸ 规模是第一性：小配置（350K）下 T-T 全线不敌为检测定制的 SVDF（3.78%）——容量不够时损失技巧救不回来；13M 大配置才反超。
        - listitem [ref=f203e22]: ▸ 两路线错误互补：常规 KWS 与 T-T 模型犯的不是同一批错误，分数求和融合在所有操作点一致占优——低 FP 区 FN 相对降 13.6%。
        - listitem [ref=f203e23]: ▸ 部署分流：电池受限设备用常规小模型，插电设备（音箱/车机）用 T-T 大模型，高精度场景做融合——中间档位（高端手机常驻）是空白。
        - listitem [ref=f203e24]: ▸ 边界：13M 参数是 SVDF 大配置的 3 倍多；MBR 训练要跑 beam 8 取 4-best（贵）；max 打分假设一句至多一次关键词；只验证两个固定两词英文关键词；内部数据不可复现、无效率指标。
    - heading "§01 问题：ASR 好不等于 KWS 好" [level=2] [ref=f203e25]:
      - generic [ref=f203e26]: §01
      - text: 问题：ASR 好不等于 KWS 好
    - generic [ref=f203e27]: 字符串匹配方案的三个结构性缺陷
    - paragraph [ref=f203e28]: KWS 与 ASR 的核心差别在目标范围：KWS 只关心一小集合短语的检测准确率。直接把通用 ASR 用于 KWS 的三宗罪：检测精度被轻微 ASR 错误带偏（短语越长字符级出错概率越高，字素建模对拼写错误零容忍）；关键短语在训练数据中出现频率远低于普通词（梯度分配天然失衡）；字符串匹配是硬判决，无法输出连续置信度，不能按场景调节误报/漏报权衡。常规非 ASR 路线则要强制对齐产帧级标签——对齐误差传导进模型，且网络拓扑限制长上下文。
    - generic [ref=f203e29]:
      - generic [ref=f203e30]:
        - heading "字符错误是 AND 累积" [level=4] [ref=f203e31]
        - paragraph [ref=f203e32]: 字符串匹配里关键词内部任何一个字符错了整词匹配就失败——「Okay Google」→「Okay GOOGL」检测即失效；token 化后变成「token 有没有出现」，关键词内部的字符级不确定性被吸收进 token 的声学建模。
      - generic [ref=f203e33]:
        - heading "先前 seq2seq KWS 的代价" [level=4] [ref=f203e34]
        - paragraph [ref=f203e35]: LSTM-CTC 音素格方法需要格搜索；基于 N-best 索引搜索的 attention 模型推理昂贵——本文的 softmax 打分不需要 N-best 或格，推理计算量远低，且训练目标能对齐推理度量。
