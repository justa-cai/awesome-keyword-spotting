  - generic [ref=f203e118]:
    - generic [ref=f203e119]: FP = max(0, K_H − K_R)，FN = max(0, K_R − K_H)；L_ij = P_ij·(α·FP + β·FN)/(K_R+ε)；L = ΣΣ L_ij − λ·log P(Y|X)
    - generic [ref=f203e120]: 人话（式 1–3，MBR 损失）：K 是假设/参考里 <kw> 的个数。以每个 N-best 假设的概率 P_ij 为权重，对它的关键词级假阳/假阴率加权求和——训练直接优化「期望检测错误」而不是转写似然。除以 (K_R+ε) 让含多个关键词的语句与只含一个的损失量级可比；λ 项保留似然防止 MBR 单独优化崩坏主任务。单句内 FP/FN 至多一个非零，α/β 在全局层面起作用。
  - paragraph [ref=f203e121]: 为什么打分方式与训练目标是耦合设计：因为分数定义在模型输出端（softmax 的 <kw> 值），训练时才能直接对关键词 token 做序列判别优化（MBR）——基于格/N-best 索引的先前方法做不到「训练优化什么、推理就度量什么」。公平起见论文还给 ASR 基线设计了 bigram 编辑距离打分（e^−GEDmin），把只能硬匹配的 ASR 扩展成有分数、能画 DET 曲线的系统。
