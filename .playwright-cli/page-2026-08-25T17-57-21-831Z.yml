  - generic [ref=f312e353]:
    - generic [ref=f312e354]: 可迁移判断
    - paragraph [ref=f312e355]: ↳ SNN 的交易只在「电池比准确率更稀缺」时成立：−4~5 点换 ~30× 理论能耗——手表耳机 IoT 传感器接受这笔交易；音箱与手机不缺这点电，SNN 对它们没有吸引力。选范式先看供电约束。
    - paragraph [ref=f312e356]: ↳ 理论能耗估计必须实测验证：脉冲操作数 × 单操作能耗的纸面算法忽略了芯片的时钟/IO/SRAM 访问——神经形态芯片的真实瓶颈常在访存不在计算；任何「理论 N 倍」声明在真机数据出来前都要打折读。
    - paragraph [ref=f312e357]: ↳ 成熟 ANN 架构可以平移到新范式：TCN 迁进脉冲域就拿到 +3~5 点——新计算范式的早期，最有效的架构设计往往不是发明新结构，而是把旧范式的成功结构忠实翻译过去。
    - paragraph [ref=f312e358]: ↳ 不可微不是死路，是工程问题：代理梯度用「前向真实、反向近似」的策略绕过阶跃——凡是遇到不可微组件（量化、采样、阈值）都可以套这个模式，SNN 只是它最出名的应用。
