    - generic [ref=f312e300]: 读表要点
    - listitem [ref=f312e301]: ◈ 两级差距要分开读：−2~3 点是同架构脉冲化的固有代价（编码损失 + 二值通信），−4~5 点里多出的部分是架构经验差距（SNN 设计还没吃透 TCN 的脉冲版最优形状）——后者会随研究收敛，前者是范式的底价。
    - listitem [ref=f312e302]: ◈ T 曲线的形状有普适性：T=20→50 涨 4 点（编码精度是瓶颈），T=50→100 只涨 0.5 点（信息已编完，多步只是重复采样）——甜点在编码损失与延迟的交点。
    - listitem [ref=f312e303]: ◈ 消融甜点：β=0.8–0.9（过低丢时序/过高积累）、快速 Sigmoid 代理（准确率与稳定性）、残差（−2~3 点）——三个都是复现的直接起点。
