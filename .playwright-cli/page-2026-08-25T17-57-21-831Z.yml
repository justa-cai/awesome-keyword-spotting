  - heading "§02 方法：速率编码 + 脉冲时间卷积" [level=2] [ref=f312e108]:
    - generic [ref=f312e109]: §02
    - text: 方法：速率编码 + 脉冲时间卷积
  - generic [ref=f312e110]: 连续值怎么进脉冲世界 · 一次推理的时间展开
  - generic [ref=f312e111]:
    - generic [ref=f312e112]: "LIF: U(t) = β·U(t−1) + W·X(t) ← 膜电位积分（β=0.8–0.9 泄漏） S(t) = Θ(U(t) − V_th) ← 超阈值发脉冲 U(t) ← U(t) − V_th·S(t) ← 发放后减阈值 编码: 特征值 → [0,1] → T 步按概率发脉冲（速率编码 T=20–50） 读出: 末层每神经元 T 步脉冲频率 → softmax → 交叉熵 训练: BPTT + 代理梯度（快速 Sigmoid: 1/(1+|πx/2|)²）"
    - generic [ref=f312e113]: 人话：LIF 像一个带漏的水桶——输入脉冲是注水，泄漏让水位慢慢降，满了（超阈值）就倒掉一格并发出一个脉冲。水位本身就是对输入历史的加权记忆，这就是 SNN 不用 RNN 结构也自带时序能力的原因。
  - generic [ref=f312e114]:
    - generic [ref=f312e115]:
      - heading "残差连接在脉冲域的额外意义" [level=3] [ref=f312e116]
      - paragraph [ref=f312e117]: 除常规的梯度通路作用外，脉冲域的 BPTT 要沿时间维传梯度——深度网络的梯度衰减更严重；残差把前层脉冲直接跳到后层，去掉了准确率掉 2–3 点——比 ANN 里残差的边际价值更高。
    - generic [ref=f312e118]:
      - heading "不走 ANN-to-SNN 转换的理由" [level=3] [ref=f312e119]
      - paragraph [ref=f312e120]: 传统路线先训 ANN 再把 ReLU 激活映射为脉冲发放率——转换过程引入精度损失（对比：~90% vs 直接训练 93%）。直接脉冲域训练能优化「脉冲域的决策边界」——代价是训练超参更敏感。
