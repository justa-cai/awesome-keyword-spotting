- generic [ref=f312e2]:
  - generic [ref=f312e3]: 论文精读 · 可视化版 · 2021 №27
  - heading "乘法从网络里消失： 用脉冲和阈值做唤醒——30 倍能耗的价与限" [level=1] [ref=f312e4]: 乘法从网络里消失：用脉冲和阈值做唤醒——30 倍能耗的价与限
  - generic [ref=f312e5]:
    - generic [ref=f312e6]: WaveSense · SynSense AG（神经形态芯片公司）
    - generic [ref=f312e7]: arXiv 2111.01456 · TCN × SNN 首次系统结合
    - generic [ref=f312e8]: 速率编码 · LIF 神经元 · 代理梯度 BPTT
    - generic [ref=f312e9]: GSC 93%（等价 ANN 95.5）· 理论能耗 ~1/30
  - generic [ref=f312e10]: 一句话：always-on 的 KWS 在电池设备上持续烧浮点乘加。SNN 用脉冲（0/1）通信——权重×脉冲退化为条件加法、神经元只在发放时计算、神经形态芯片原生加速，理论能耗低 1–3 个数量级；但发放函数不可微没法反向传播、准确率落后。WaveSense 把 ANN 里成熟的 TCN 架构搬进脉冲域：速率编码（特征值→发放概率）→ 脉冲时间卷积 + LIF + 残差 → 频率读出，代理梯度直接在脉冲域训练。93% 准确率（等价 ANN 95.5、SOTA 97.5），理论能耗约 1/30——用 4–5 个点换 30 倍省电的交易记录。
  - generic [ref=f312e11]:
    - generic [ref=f312e12]: TL;DR
    - listitem [ref=f312e13]: ◈ SNN 的三个省电台柱：脉冲代乘加（权重×0/1 = 条件加法，单操作理论能耗 ~乘加的 1/30）；事件驱动稀疏（发放率仅 10–20%，80–90% 时间步静默免算）；类脑硬件加速（Loihi/TrueNorth/SynSense Speck——作者自家产品线，原生跑脉冲）。
    - listitem [ref=f312e14]: ◈ 三道坎一次回应：阶跃发放不可微 → 代理梯度（反向传播时用可微函数近似阶跃导数，快速 Sigmoid 1/(1+|πx/2|)² 最佳）；架构无套路 → 把 TCN 迁进脉冲域（卷积+LIF+残差）；准确率落后 → 直接脉冲域训练避开 ANN-to-SNN 转换损失。
    - listitem [ref=f312e15]: ◈ LIF 神经元：U(t) = β·U(t−1) + W·X(t)；超阈值发脉冲并减阈值。β<1 的泄漏让膜电位无输入时衰减——天然携带时序记忆；β=0.8–0.9 最佳（过低丢时序信息、过高积累难区分）。
    - listitem [ref=f312e16]: ◈ 速率编码是 ANN→SNN 的桥：特征值归一化为发放概率，T 个时间步伯努利采样——值越大脉冲越密。代价：信息以频率承载需要多个时间步，且引入量化损失。
    - listitem [ref=f312e17]: ◈ 推理在时间维展开 T 步，每步全是加法与阈值比较——乘法在整个网络里消失；读出统计末层 T 步脉冲频率过 softmax，交叉熵训练。
    - listitem [ref=f312e18]: ◈ 结果：GSC 12 类 ~93%（等价 ANN 95.5 / SOTA 97.5）；理论能耗 ~1/30；vs ANN-to-SNN 转换（~90%）直接训练 +3 点；vs 全连接 SNN 时间卷积 +3–5 点；去残差掉 2–3 点。
    - listitem [ref=f312e19]: ◈ T（时间步）是权衡旋钮：T=20→89%、T=50→93%、T=100→93.5%——延迟与能耗随 T 线性涨，边际收益陡降；甜点 T=50（~50ms）。
    - listitem [ref=f312e20]: ◈ 最大的坑：能耗是理论估计不是实测（脉冲操作数×单操作理论能耗）——芯片的时钟/IO/SRAM 访问可能显著吃掉纸面收益；无 Speck/Loihi 真机数据。
