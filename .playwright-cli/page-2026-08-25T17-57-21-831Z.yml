  - generic [ref=f312e24]:
    - generic [ref=f312e25]:
      - heading "为什么脉冲比浮点省" [level=3] [ref=f312e26]
      - paragraph [ref=f312e27]: ANN 的乘加要访问权重 SRAM + 浮点乘法器；SNN 的输入是 0/1——乘法退化成「有脉冲就加权重，没脉冲就跳过」的条件加法，且稀疏发放让多数神经元多数时刻完全静默——两重节省相乘。
    - generic [ref=f312e28]:
      - heading "不可微的发放函数" [level=3] [ref=f312e29]
      - paragraph [ref=f312e30]: LIF 的阶跃发放 Θ(U−V_th) 在阈值处梯度无穷大、其余为零——反向传播的链式法则在这里断掉。代理梯度的思路很朴素：前向照样阶跃，反向「假装」它是平滑函数。
    - generic [ref=f312e31]:
      - heading "准确率的账" [level=3] [ref=f312e32]
      - paragraph [ref=f312e33]: 同架构下 SNN 比 ANN 低 2–3 点（脉冲化本身的代价）；比 SOTA 低 4–5 点（SNN 架构经验还落后成熟 ANN 设计）——yes/yeah 类精细区分仍是弱项。
    - generic [ref=f312e34]:
      - heading "公司背景的影响" [level=3] [ref=f312e35]
      - paragraph [ref=f312e36]: 作者是 SynSense（神经形态芯片公司）——架构设计刻意与 Speck/Xylo 的计算模型高度匹配（可直接映射）。利益相关：理论能耗数字是卖点；学术边界：无真机实测恰是最该补的一环。
