      - heading "问题：「频谱图当图像」的三个盲点" [level=2] [ref=f60e15]
      - generic [ref=f60e16]:
        - generic [ref=f60e17]: TL;DR
        - list [ref=f60e18]:
          - listitem [ref=f60e19]: ◆ CNN 假设输入是规则网格（均匀采样的像素矩阵）——但频谱图的频段/帧之间不是简单空间邻接，是复杂的共调与共振关系。
          - listitem [ref=f60e20]: ◆ CNN 的局部感受野只看相邻频段——谐波结构这类非相邻频段的强相关性，标准卷积无法直接建模（f1 与 f5 永远说不上话）。
          - listitem [ref=f60e21]: ◆ GCN 的解法：时频单元天然构成图结构——频段间、帧间、跨时频的关系都用图的边显式表达；图卷积 = 邻居信息的加权聚合。
          - listitem [ref=f60e22]: ◆ 堆叠多层 = 关系感受野扩到高阶邻居：一层看直接相连的频段、两层看朋友的朋友——谐波结构几层就能覆盖全频段。
