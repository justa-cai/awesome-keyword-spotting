      - paragraph [ref=f60e274]: ① 数据结构不是网格而是关系时，把它显式建成图。
      - generic [ref=f60e275]: ↳ 谐波、共振、共调这类「非相邻但强相关」的关系，方形卷积核天生够不着——图把它们从「卷积核要隐式学的负担」变成「边上显式写的资产」；凡是有明确关系结构的数据（社交、分子、知识图谱、时频），先考虑图。
      - paragraph [ref=f60e276]: ② 显式化的收益要以「另一处的自动化缺失」来换。
      - generic [ref=f60e277]: ↳ 关系显式化后，「图怎么建」成了新的手工设计点——原来卷积核自动学的关系，现在要人定义拓扑；显式化的税单是：要么接受手工、要么再建一套自动构图（注意力图学习）的机制。
      - paragraph [ref=f60e278]: ③ 换计算范式的收益要看硬件生态兑现。
      - generic [ref=f60e279]: ↳ 图结构、连续深度、脉冲计算的理论优势都真实——但通用硬件不为它们优化，端侧兑现率低；押注非主流范式的时机由硬件生态决定，早一步是先驱、早两步是先烈。
    - paragraph [ref=f60e280]: 系列坐标：GNN 路线的起点——本文（2019 清华）首次把 GCN 带进 KWS，2026 年的 FPGA GNN KWS 是七年后的延续（图结构 × 神经形态传感器 × FPGA 的组合）；与「非主流范式三兄弟」（#17 NODE、SNN）共同构成 KWS 方法论探索的支线——主线（CNN/Transformer）之外，这些支线保存了「还能怎么算」的可能性。
