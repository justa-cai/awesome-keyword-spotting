      - paragraph [ref=f161e258]: §04 · 主要贡献
      - heading "四条贡献" [level=2] [ref=f161e259]
      - generic [ref=f161e261]:
        - generic [ref=f161e262]:
          - generic [ref=f161e263]: "1"
          - text: 问题定义：首次把 KWS 在线持续学习收缩到「同任务同词表」并完整形式化——指认这才是大多数商业唤醒词系统的真实处境。
        - generic [ref=f161e264]:
          - generic [ref=f161e265]: "2"
          - text: 算法：COOL——双不等式门控的 SGD 在线协议；无教师、无回放、除 Dv 外零超参、每候选只加两次前向——防遗忘设计里端侧友好度最高的一档。
        - generic [ref=f161e266]:
          - generic [ref=f161e267]: "3"
          - text: 实证：隔离增益 19.96%、方差 ±0.28→±0.15；序列累积增益 33.96–35.85%；朴素 SGD 对照证明条件门控是防遗忘的有效成分。
        - generic [ref=f161e268]:
          - generic [ref=f161e269]: "4"
          - text: 方法学：有标签流上界假设给标签估计方向留干净参照系；一套可复用的流式 KWS 评测协议（拼接长音频 / 零填充 / 80% 帧占用判据）。
      - generic [ref=f161e270]: 可迁移判断：当在线数据非 i.i.d. 而你又想要「零超参」的防遗忘时，一个静态 hold-out 集当训练分布的化身 + 接受/拒绝的离散门控，比维护教师模型或回放库便宜一个量级——它的代价是保守性（剧烈漂移下学不到该学的幅度）与单一锚点风险（Dv 是唯一历史知识载体）。
    - generic [ref=f161e271]:
      - paragraph [ref=f161e272]: §05 · 局限与边界
      - heading "有标签流是上界，基线一半是坏的" [level=2] [ref=f161e273]
      - generic [ref=f161e275]:
        - generic [ref=f161e276]:
          - heading "技术局限" [level=4] [ref=f161e277]
          - list [ref=f161e278]:
            - listitem [ref=f161e279]: 有标签流假设：真实设备没人打标签——落地命门（置信度筛选 / 用户隐式反馈 / 主动学习决定方法能否成行），整体留给未来工作。
            - listitem [ref=f161e280]: 锚定与适应幅度的矛盾：Dv 固定代表训练分布，大幅偏离的适应方向都会被否决——中等漂移（加噪）是保护，剧烈漂移（换麦克风 / 远场混响）可能意味着永远学不到该学的幅度；只测了 25dB 一个信噪比，失效边界未探测。
            - listitem [ref=f161e281]: 防遗忘押在单一机制：放弃经验回放后 Dv 是唯一历史知识载体——Dv 太小判据方差大、太大端侧存储吃不消；Dv 规模未报告，关键权衡悬空。
            - listitem [ref=f161e282]: 贪心接受的僵局风险：批损失严格下降条件使过程完全贪心（无动量、无退火、无容忍带）——理论上存在卡局部、反复提案被否决的失败模式，发生率未讨论；门控前向开销与 |Dv| 线性相关而 |Dv| 未报——端侧可行性缺这块账。
        - generic [ref=f161e283]:
          - heading "实验设计不足" [level=4] [ref=f161e284]
          - list [ref=f161e285]:
            - listitem [ref=f161e286]: 基线一半是坏的：4 任务随机水平（损失 0.69≈ln2 = 塌缩到平凡解）——平均增益相当部分来自「救活没训好的模型」；逐任务在线增益未报告，两种收益拆不开。
            - listitem [ref=f161e287]: 漂移类型单一：引言列了韵律 / 噪声 / 麦克风三类漂移动机，实验只构造噪声一种、25dB 一个信噪比、三种 DCASE 噪声——韵律与麦克风漂移完全未测。
            - listitem [ref=f161e288]: 统计与顺序：序列顺序只有一种、无多种顺序对照；无随机种子数与显著性检验；流长度有限（论文自认）。
            - listitem [ref=f161e289]: 端侧指标缺位 + 口径问题：无延迟 / 内存 / 能耗实测，TFLite 落地推给未来；Δ% 计算方式未说明（验算发现分母是 COOL 值）；无 FAR/FRR/DET——与「降低误收率」的商业动机脱节；伪代码 lv 回写与否未澄清。
      - generic [ref=f161e290]: 值得补的方向：流数据标签估计策略 + 标签不确定性对最终性能的影响（把上界拉向现实的关键一步）；与持续学习文献更精细在线算法的系统对比；TFLite 端侧训练 API 真实落地验证；两个接受条件的独立消融 + 松弛化设计（如 lv0 ≤ (1+ε)·lv 容忍带）刻画稳定性-可塑性边界；小规模回放缓冲与门控组合替代单锚点；指标切到 FAR/FRR/DET 对齐商业验收口径；真实麦克风 / 远场 / 多信噪比重测漂移边界；健康基线单独报告逐任务增益；澄清 lv 回写语义与 Dv 规模选取原则。
