      - generic [ref=f161e24]:
        - heading "一分钟版本" [level=2] [ref=f161e25]
        - list [ref=f161e26]:
          - listitem [ref=f161e27]: 痛点打在「平稳分布」假设上：离线训练范式假设训练数据与部署后消费的数据同分布——真实生产环境非平稳：新说话韵律、环境噪声、麦克风变化都会在训练时无法预料的维度上改变输入分布，而模型要等厂商排期的定期更新才可能被替换，中间隔着数月的性能退化窗口。把训练集做得更大更全这条路的成本作者有第一手体感（自己刚做过大规模多语种数据集）——判断是「分布漂移原则上无法被穷尽地预先预测」。
          - listitem [ref=f161e28]: 已有 KWS 持续学习瞄错了问题：Rainbow Keywords（在线蒸馏，历史状态当教师）与渐进持续学习（每任务生长子网络）都在做「加新词」——商业唤醒词词表部署后固定，变的是分布；为加新词设计的整套机制用不上，且蒸馏 / 多任务的存储计算随任务数增长，与端侧资源矛盾；朴素在线 SGD 直接顶上则因流数据非 i.i.d.（时间强相关、分布随环境切换）梯度有偏、收敛差。
          - listitem [ref=f161e29]: COOL 的核心（「Conditional」的落点）：每个梯度更新只是候选提案，合法性由两个不等式裁决——批损失严格下降（可塑性：必须学到新东西）+ hold-out 损失不得上升（稳定性：不许丢旧东西）。这是稳定性-可塑性权衡最直白的算法化；hold-out 集的新语义：它是训练分布的化身，任何想把模型拉离训练分布的更新都会先在它身上暴露。
          - listitem [ref=f161e30]: 工程卖点：无教师模型、无回放库、除 hold-out 集定义外零超参；每个候选更新只加两次前向（B 一次 + Dv 一次）——持续学习防遗忘机制里几乎最轻的一档。双缓冲类别平衡批（各攒 8 个）防流式组批的类先验偏差，更新后清空 = 内存有界 + 主动放弃经验回放（防遗忘全押在门控上的刻意权衡）。
          - listitem [ref=f161e31]: 结果：隔离场景平均 0.53→0.66、方差 ±0.28→±0.15（两极分化的任务被拉拢）；序列场景（干净→啼哭→玻璃→枪声→干净）累积增益 33.96–35.85%（摘要的 34%）全面高于隔离增益——跨噪声正向迁移；首尾干净场景孤立增益 28.85 vs 26.92 基本持平——灾难性遗忘基本未发生的直接证据。
          - listitem [ref=f161e32]: 门控消融（图 2，全文最重要单图）：朴素在线 SGD 开局反超（更新频繁无门控延迟），但在第一次分布切换处开始衰减（有偏梯度）；COOL 稳定上升——门控在分布稳定期是拖累、切换期是生命线。混杂变量：两者更新粒度不同（每步 vs 平衡批攒满），无「频率对齐只差门控」的严格对照。
          - listitem [ref=f161e33]: 诚实读法的关键：基线一半是坏的——4 个任务验证准确率停在 0.50–0.56（损失 0.69≈ln2，塌缩到随机猜测平凡解），平均增益里相当一部分是「在线救活没训好的模型」而非纯分布适应；逐任务在线增益未报告，健康模型（Right 0.95）还能涨多少这个关键问题没答案。
          - listitem [ref=f161e34]: 边界：有标签流假设是上界设定（真实设备没人打标签——落地命门，标签估计整体留给未来）；门控保守性双刃剑——剧烈漂移（换麦克风 / 远场混响）下稳定性可能压制可塑性（只测了 25dB 一种信噪比，失效边界未探测）；Dv 规模未报告（太小判据噪声大、太大端侧存储吃不消）；无 FAR/FRR/DET（与商业 KWS 验收口径脱节）；端侧延迟 / 内存 / 能耗零实测。
    - generic [ref=f161e35]:
      - paragraph [ref=f161e36]: §01 · 问题陈述
      - heading "问题收缩换算法极简" [level=2] [ref=f161e37]
      - generic [ref=f161e39]: 两个刻意的问题收缩：① 限定「同一 KWS 任务」——目标词集合部署后不变，直接砍掉新任务适应的全部复杂度（子网络生长、任务间蒸馏、任务边界检测全部非必要），给简单算法腾出设计余量；② 假设在线数据流带标签——论文明确承认不现实，但沿用 ASR 在线持续学习的同一假设，把讨论聚焦到在线学习器设计本身，并给性能设定上界（后续标签估计工作在这个上界之下衡量自己损失了多少）。另设「在 D∪S 重训不可行」（N 太大）——划清与周期性全量重训的界限。
      - generic [ref=f161e40]: 为什么选 cnn-one-fstride4：Sainath 与 Parada 2015 的小脚印 CNN 家族单步长变体——小脚印 KWS 最经典的公开基线、TF 官方 speech_commands 教程默认模型之一、复现门槛最低：恰好论证 COOL 不依赖任何 fancy 架构，与「设定实用基线」的自我定位一致。
