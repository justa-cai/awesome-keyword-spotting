      - generic [ref=f5e143]:
        - paragraph [ref=f5e144]: 补丁一 · 抗混叠：stride-2 只取偶数下标样本，等效采样率减半、奈奎斯特频率减半——直接降采样会频谱混叠，所以 stride-2 帧必须用低通滤波后的波形，stride-1 帧用常规预加重波形。两条预处理通路并存的原因就在这。
        - paragraph [ref=f5e145]: 补丁二 · STE 幅度补偿：求和项少一半，stride-2 帧的短时能量系统性偏低——用相邻 stride-1 帧导出补偿因子拉回 stride-1 的幅度尺度（图 6 实测对齐）。特征尺度不漂移，后端看到的特征分布才不会因降档而系统性偏移。这个补偿依赖也是调度器 Priority 1 存在的原因。
