      - generic [ref=f5e24]:
        - heading "一分钟版本" [level=2] [ref=f5e25]
        - list [ref=f5e26]:
          - listitem [ref=f5e27]: 痛点：多通道监控场景要 N 路音频在同一个时间窗内完成特征提取——吞吐需求 ×N，实时预算一格不让。而现有前端四条路线全部三缺一：高精度、低开销、可并行没有一条同时做到。
          - listitem [ref=f5e28]: 方案是一条减法链：半重叠 IIR 分帧砍 24.9% 冗余滤波（保住音素转移线索）→ 跳帧砍 34.42% 噪声主导帧 → 变步长滤波再砍 24.2%（次要帧只算偶数样本），总工作量降到 37.3%；数据少了，并行所需模块数和能耗同步下降，最后用优先级调度把延迟压进 N 通道预算。
          - listitem [ref=f5e29]: 两个必要补丁：stride-2 降采样前先低通（抗混叠）；样本数减半会让 STE 系统性偏低，用相邻 stride-1 帧导出补偿因子拉回幅度尺度。
          - listitem [ref=f5e30]: 结果：工作量平均削减 62.73%；m=23 即可实时支撑 32 通道；能效甜点 m=15（30.4 nJ / 1.25 ms，恰好卡进 25 通道预算）；三个后端模型精度损失全部 <1%。
          - listitem [ref=f5e31]: 诚实的坑：阈值依赖整段 max(STE)——流式场景"先有鸡还是先有蛋"；且"多通道"只是 32 路独立输入塞进同一加速器分时处理，没有真实麦克风阵列。
