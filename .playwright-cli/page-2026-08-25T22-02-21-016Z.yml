  - generic [ref=f45e12]: "奥尔堡大学 + Oticon（Lopez-Espejo / Tan / Jensen——与 #4 #6 #23 同组）· arXiv 1906.09417（2019.06） 问题：标准 KWS 说话人无关——任何人都能触发助听器，社交场景误操作频繁 · 方法：共享 ResNet 骨干 + 双分支（KWS + 自有/外部说话人鉴别），α·L_KWS + β·L_spk 联合训练 一句话：两门 AND 逻辑（说了关键词 且 是佩戴者说的）——参数增幅可忽略，KWS 准确率相对提升 ~32%。"
  - generic [ref=f45e13]:
    - generic [ref=f45e14]: "01"
    - heading "问题：说话人无关在这里是 bug" [level=2] [ref=f45e15]
    - generic [ref=f45e16]:
      - generic [ref=f45e17]: TL;DR
      - list [ref=f45e18]:
        - listitem [ref=f45e19]: ◆ 标准 KWS 的说话人无关设计在音箱/手机上合理（任何人都能唤醒），在助听器上是灾难——只有佩戴者本人才应该控制设备。
        - listitem [ref=f45e20]: ◆ 四重痛点：误触发灾难（家人聊天/同事口头禅/电视台词都会变成误操作）、安全与隐私（恶意者可操纵音量/模式）、小足迹极限（助听器算力电池极其有限）、双重鲁棒（噪声下两个任务都要准）。
        - listitem [ref=f45e21]: ◆ 多任务框架：共享 ResNet 骨干 + 两个任务分支——KWS（关键词概率）与说话人鉴别（自有 vs 外部二元），联合损失 α·L_KWS + β·L_spk。
        - listitem [ref=f45e22]: ◆ 无公开助听器 KWS 数据——从 GSC 生成模拟助听器语料（麦克风特性 + 佩戴位置效应 + 环境噪声 + 双标签），为这个方向搭了数据地基。
