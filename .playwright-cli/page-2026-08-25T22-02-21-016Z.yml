      - generic [ref=f45e204]:
        - generic [ref=f45e205]: "3"
        - paragraph [ref=f45e206]: "模拟语料的建立方法论。没有真实数据时：模拟麦克风/佩戴效应 + 打双标签——先让研究能开始，真实数据后续补（作者自己列的后续方向）；这与 #25（TTS 造数据）、#4（RIR 模拟）同属「数据不够模拟凑」的工程谱系。"
