        - paragraph [ref=f45e200]: 工业选题的教科书案例。Oticon 是助听器厂商——研究者在用户家里，问题从产品痛点里长出来；「谁都能唤醒」在音箱上是 feature、在助听器上是 bug——场景定义需求，不是技术定义需求。
