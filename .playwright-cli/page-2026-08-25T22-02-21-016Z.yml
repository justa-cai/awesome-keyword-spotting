      - generic [ref=f45e98]: 音频进来
      - generic [ref=f45e99]: 共同起点
      - generic [ref=f45e101]: 门 1：说了关键词吗？
      - generic [ref=f45e102]: KWS 分支
      - generic [ref=f45e104]: 门 2：是佩戴者说的吗？
      - generic [ref=f45e105]: 说话人分支
      - generic [ref=f45e107]: 两门全过 → 执行
      - generic [ref=f45e108]: AND 逻辑
      - generic [ref=f45e109]: 单门系统（标准 KWS）只有门 1——
      - generic [ref=f45e110]: 旁人说出关键词 = 直接触发
      - generic [ref=f45e111]: 双门系统把「谁在说」变成一等公民
      - generic [ref=f45e112]: 正则化红利的机制
      - generic [ref=f45e114]: 反直觉的发现：加了说话人分支，
      - generic [ref=f45e115]: KWS 分支自己也变准了（不只是多了门）
      - generic [ref=f45e116]: 机制一：多任务正则化
      - generic [ref=f45e117]: · 说话人标签是额外的监督信号
      - generic [ref=f45e118]: · 骨干被迫学「对两个任务都有用」的表示
      - generic [ref=f45e119]: ——过拟合空间被压缩
      - generic [ref=f45e120]: 机制二：隐式说话人感知
      - generic [ref=f45e121]: · 共享骨干学到说话人相关特征
      - generic [ref=f45e122]: · KWS 分支「免费」获得对说话人变化的
      - generic [ref=f45e123]: 不变性/敏感性——区分相似词更稳
      - generic [ref=f45e124]: "这是 #14/#15（2020 KWS+SV 多任务）的"
      - generic [ref=f45e125]: 思想先驱——本文 2019 年已在助听器场景落地
      - generic [ref=f45e126]: 左：双门 AND 逻辑——说了关键词且是佩戴者说的才执行；单门系统里旁人的关键词就是事故。右：说话人分支通过多任务正则化与隐式说话人感知反哺 KWS——联合学不是「多干活」而是「互相帮」
    - generic [ref=f45e127]: 图 2 · 机制解剖：两道门的决策逻辑 · 多任务正则化的两种机制
    - generic [ref=f45e128]:
      - generic [ref=f45e129]: "共享骨干: ResNet(声学特征) → h ← 两任务共用的通用声学表示 KWS: softmax_KWS(h) → P(关键词|无关键词) 说话人: σ(spk(h)) → { 自有语音, 外部说话人 } 损失: L = α·L_KWS + β·L_spk ← 参数增幅可忽略(仅说话人分支少量新增)"
      - generic [ref=f45e130]: 人话：一个大脑管两件事——「听到什么词」和「谁在说这个词」。大脑的表示层被两个任务共同训练，既学会了分词也学会了分人；门口装两道闸，词对了、人也对了，才放行。
    - paragraph [ref=f45e131]: "反直觉的发现：加了说话人分支后，KWS 分支自己也变准了——不只是多了道门。两个机制：多任务正则化（说话人标签是额外监督信号，骨干被迫学对两任务都有用的表示，过拟合空间被压缩）与隐式说话人感知（共享表示让 KWS 免费获得对说话人变化的处理能力）。这是 2020 年 #14/#15（KWS+SV 多任务）的思想先驱。"
