  - generic [ref=f45e88]:
    - generic [ref=f45e89]: "02"
    - heading "机制：双门 AND 与正则化红利" [level=2] [ref=f45e90]
    - paragraph [ref=f45e91]: 系统的决策逻辑是两道门的 AND：门一「说了关键词吗」（KWS 分支）+ 门二「是佩戴者说的吗」（说话人分支）——两门全过才执行。标准 KWS 只有门一，旁人的关键词就是事故；双门系统把「谁在说」变成一等公民。
    - img [ref=f45e92]:
      - generic [ref=f45e94]: 机制解剖：为什么联合学反而更准 · 正则化从哪来
