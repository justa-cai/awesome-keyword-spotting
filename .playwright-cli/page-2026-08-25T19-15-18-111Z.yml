  - generic [ref=f341e77]:
    - generic [ref=f341e78]: "02"
    - heading "机制：一个会犯错的老师" [level=2] [ref=f341e79]
    - paragraph [ref=f341e80]: ASR 混淆分析的洞察在于：ASR 的混淆模式与 KWS 的混淆模式高度一致——两者都在声学层面做判断，「ASR 都听混的词对」正是 KWS 也会听混的词对。用大规模 ASR 解码全部训练数据、统计音素级混淆矩阵，高频混淆对（「okay google」←「okay goggles」）对应的原始音频就是现成的难负样本——ASR 相当于一个「已经踩过所有坑」的老师，把坑的位置直接告诉 KWS。
