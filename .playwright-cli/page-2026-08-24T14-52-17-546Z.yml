      - generic [ref=f1e223]:
        - heading "实验设置：GSCD + 1 小时拼接音频" [level=3] [ref=f1e224]
        - paragraph [ref=f1e225]: 训练测试用 Google Speech Commands Dataset：1-Word 取 happy/dog/up/down 四词分别训练（其余词当填充词），10-Word 取标准十词。芯片实测的评测音频很讲究——所有词随机拼接、按 1:6 混入静音、拼成 1 小时由 FPGA 喂给芯片：模拟常开设备连续监听、语音稀疏出现的真实负载。
        - paragraph [ref=f1e226]: 指标选择有讲究：用位操作数而不是运算次数做计算量指标——乘法被移位替代后"运算次数"会失真（乘法清零、加法翻倍），位操作数近似门级开关活动，在近阈值下才正比于动态功耗。工艺条件 65nm / 0.55V / 125kHz，对应常开 IoT 的真实工作点。
