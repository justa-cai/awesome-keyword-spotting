      - generic [ref=f1e60]:
        - heading "为什么近阈值下乘法这么贵" [level=3] [ref=f1e61]
        - paragraph [ref=f1e62]: 0.55V、125kHz 的工作点下，动态功耗基本正比于开关活动的位数。一次两位操作数的乘法需要一整棵部分积压缩树 + 最终加法器；移位只是连线重排（零成本），加法只需一级进位链。把"任意系数乘法"逼近成 2 的幂次组合，就能在算术层面让乘法消失——这就是标题里 multiplier-free 的立论基础。
        - paragraph [ref=f1e63]: 还有一个算法侧常忽视的维度：存储。传统实现要把窗系数、FFT 旋转因子、梅尔滤波器系数全存片上，近阈值下存储器漏电和访问功耗都很可观——本文实测 FEx 的 1771nW 里计算只有 76nW、存储 1695nW，这个事实反过来解释了论文为什么连"窗系数存储"也要一并消灭。
