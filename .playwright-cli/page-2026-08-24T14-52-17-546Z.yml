      - generic [ref=f1e24]:
        - heading "一分钟版本" [level=2] [ref=f1e25]
        - list [ref=f1e26]:
          - listitem [ref=f1e27]: 反直觉起点：常开 KWS 芯片的功耗瓶颈不在分类器、在 MFCC 特征提取——一帧理论要做 3168 次乘法、约 93 万次位操作，而近阈值电压下乘法器（一整棵部分积压缩树）是最贵的算术单元，移位只是连线重排。
          - listitem [ref=f1e28]: "核心一招：把所有乘法系数离散到 2 的幂次组合——FFT 旋转因子量化到 {0, ±0.25, ±0.5, ±0.75, ±1}（E3bT），乘法退化成\"移位 + 加法\"；同一思想贯穿窗（四级阶梯）、取模（绝对值和）、梅尔（矩形带通）、DCT（复用移位加）。"
          - listitem [ref=f1e29]: 电路协同：Power/Mel/DCT 三个流水级共享一个可配置处理元 MF-PE；分类器用二值网络，PE 里的乘法器换成 MUX + 反相器——乘 ±1 本来就是"选原值或反值"。
          - listitem [ref=f1e30]: 结果：65nm / 0.55V 实测 2.3µW、0.17mm²（对比工作中面积最小），FEx 计算功耗仅 76nW（占整芯片 3.3%），GSCD 1-Word 精度 94.9%；代价是 10-Word 掉 4.31 个百分点。
          - listitem [ref=f1e31]: 诚实的坑：免乘法之后 FEx 的 1771nW 里存储占 1695nW（96%）——算法红利已被吃干净，新瓶颈换成存储架构。
