    - link "1808.00563" [ref=f82e12] [cursor=pointer]:
      - /url: https://arxiv.org/abs/1808.00563
    - text: （2018.08） 一句话：音箱播放时的残余回声让 barge-in 场景错误拒绝飙升——本文不去修 AEC，而是把音乐和电视音频按随机 SIR 混进训练集，让模型学会忽略残余回声：播放条件 FRR 相对降 30-45%，推理开销为零。
