  - generic [ref=f82e82]:
    - heading "2 机制：SIR 随机混合，两类干扰一套覆盖" [level=2] [ref=f82e83]:
      - generic [ref=f82e84]: "2"
      - text: 机制：SIR 随机混合，两类干扰一套覆盖
    - generic [ref=f82e85]:
      - generic [ref=f82e86]:
        - heading "问题重构（核心创新）" [level=3] [ref=f82e87]
        - text: 播放干扰从「信号处理问题」变成「噪声鲁棒性问题」——增强只花训练时的钱，运行时一分不加。
      - generic [ref=f82e88]:
        - heading "统一覆盖两类干扰" [level=3] [ref=f82e89]
        - text: 设备播放（有参考信号）和外部声源（无参考信号）用同一套加性增强处理——后者 AEC 本来就无解。
      - generic [ref=f82e90]:
        - heading "干扰源库" [level=3] [ref=f82e91]
        - text: 大规模音乐库（多风格随机采样）+ 电视/电影音轨（对话/音效/配乐）——多样性带来泛化。
      - generic [ref=f82e92]:
        - heading "标签不变" [level=3] [ref=f82e93]
        - text: 混音后重提 log-mel 特征，关键词标签保持——增强只改变声学条件，不改变监督信号。
