    - heading "5 判断：能带走的三句话" [level=2] [ref=f82e233]:
      - generic [ref=f82e234]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f82e235]:
      - generic [ref=f82e236]: JUDGEMENT
      - paragraph [ref=f82e237]: ↳ 遇到前端瓶颈先问「能不能翻译成数据问题」：修 AEC 是硬件/算力的钱，增强是训练时的钱——后者不碰运行时，对已部署设备最友好（OTA 模型更新即刻生效）。
      - paragraph [ref=f82e238]: ↳ 增强的天花板是干扰建模的保真度：加性混合对残余回声只是近似（缺非线性失真）——后来的 RIR+混响模拟、GAN 学习干扰分布都在补这一层，越像真实越有效。
      - paragraph [ref=f82e239]: ↳ SIR 范围是安全阀不是越大越好：消融显示干扰过强会训崩——「见过整个强度谱」和「别把训练数据毁掉」之间要按实际残余回声分布定标。
