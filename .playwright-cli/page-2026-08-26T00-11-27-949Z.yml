        - listitem [ref=f82e20]: ◆ 音乐最毒：能量高、频谱宽、动态范围大；外部声源（电视/音响）更棘手——没有参考信号，AEC 根本没法用。
        - listitem [ref=f82e21]: ◆ 修 AEC = 加硬件成本或计算复杂度，且非线性失真下仍不稳——这条路又贵又堵。
