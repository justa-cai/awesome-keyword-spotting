        - generic [ref=f154e18]: 首个 SSL×噪声鲁棒 KWS 系统研究
        - generic [ref=f154e19]: Data2Vec-denoising 非对称加噪
        - generic [ref=f154e20]: seen/unseen 噪声分离评测
        - generic [ref=f154e21]: 相对 MTR 提升 16–18%
        - generic [ref=f154e22]: −10dB 提升 31%
