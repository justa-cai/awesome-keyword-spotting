      - generic [ref=f154e24]:
        - heading "一分钟版本" [level=2] [ref=f154e25]
        - list [ref=f154e26]:
          - listitem [ref=f154e27]: 三层背景：KWS 是 24 小时常开前端 + 语音交互链路守门人（唤醒不起来，后面再强的 ASR 都没意义）——噪声鲁棒是部署硬门槛不是锦上添花；标注数据贵而无标注录音便宜，SSL 杠杆明显；作者前作（ICASSPW 2023）已证 Data2Vec 预训练在标注稀缺时显著优于纯监督——但全部假设干净输入，干净下的收益能否迁移到噪声是留下的空白。
          - listitem [ref=f154e28]: 监督范式的结构性缺陷：MTR（多风格训练）靠「见过噪声」改善鲁棒——本质是把噪声当另一种样式去 memorize，收益高度依赖训练 / 测试噪声匹配度；还有隐性代价：用噪声数据训练摊薄干净准确率（Baseline-MTR 干净 0.800 < Baseline-Clean 的 0.832）。SSL 的噪声增益在 ASR 已有研究（Robust Data2Vec 等）但没传导到 KWS。
          - listitem [ref=f154e29]: 核心方法（改动小到几乎免费）：Data2Vec-denoising 非对称加噪——teacher 吃干干净、student 又掩码又加噪。目标侧始终干净 → student 被迫学「噪声输入 → 干净潜在表示」的映射，一个目标同时完成学表示和做去噪；不动损失函数、不加任何模块，只改数据流配对。
          - listitem [ref=f154e30]: 对照组的价值（实验设计最讲究的一手）：Data2Vec-noisy（teacher 和 student 都加噪）实测与「干净预训练 + MTR 微调」几乎完全重合（0.692 vs 0.693）——对称加噪的收益与 MTR 高度重叠（都只是噪声暴露），denoising 再多出的那一截（0.708）才是去噪目标独有的贡献。没有这个对照就无法把结论收敛到「去噪式目标才是关键」。
          - listitem [ref=f154e31]: 最有信息量的交叉点：Data2Vec-clean（预训练 + 微调全程零噪声）在 seen 噪声 10dB 起反超 Baseline-MTR（0.743 vs 0.720）、20dB 拉到 0.848 vs 0.783；unseen 噪声下交叉点提前到 5dB——MTR 在 seen 的优势延伸到更低 SNR 恰恰说明其鲁棒性部分是绑定噪声类型的记忆，unseen 下记忆失效，SSL 的泛化优势提前显现。
          - listitem [ref=f154e32]: 结果：denoising 在三个模型尺寸（0.6M/2.4M/5.4M）× seen/unseen 全部六种组合上第一（KWT-1 0.708/0.688）；对 Baseline-MTR 相对提升 seen 16.26–16.96%、unseen 16.22–18.04%（unseen 增益随模型增大略增）；−10dB 极端噪声 0.310 vs 0.236（相对 +31%）；代价：干净条件 0.876 仅比纯干净预训练的 0.887 低 1 个点——以可忽略的干净损失换显著噪声增益。
          - listitem [ref=f154e33]: 两个次级发现：① KWT-2（2.4M）总分优于 KWT-3（5.4M）——4.7h 标注下 5.4M 已过甜点，盲目加大模型不划算；② unseen −10dB 时纯噪声暴露反略胜 denoising（0.225 vs 0.219）——极端 + 陌生时「见过噪声」占一点点便宜，−5dB 起 denoising 全面领先。
          - listitem [ref=f154e34]: 边界：全是人工加性混叠（无混响 / 远场 / 信道畸变 / AGC）；−10dB 绝对性能 0.219–0.310 距实用还远（纯后端表示学习补不回前端信噪比）；denoising 有隐含数据前提——teacher 必须拿到干净版本（真实远场只有带噪录音时配对不成立，退化为对称加噪）；关键超参（K、τ、预训练轮数）未报数值；GSC 孤立词分类 ≠ 流式检测，无误报 / 漏报权衡指标；transformer + mean pooling 天然离线式，端侧 FLOPs / 延迟未讨论。
    - generic [ref=f154e35]:
      - paragraph [ref=f154e36]: §01 · 问题陈述
      - heading "SSL 学到的表示提升，是对输入退化的容忍度提升吗？" [level=2] [ref=f154e37]
      - generic [ref=f154e39]: 四个环环相扣的问题：① 科学问题——干净预训练（全程不碰噪声）在噪声下能否打过直接用噪声训练的监督 MTR（真收益还是假象）；② 方法问题——对称加噪（student/teacher 都噪声）与构造去噪目标（teacher 干净 / student 噪声）哪种更能学到噪声不变表示；③ 对照公平性——SSL 与监督 SOTA 放同一标注预算下比，且训练可见 / 不可见噪声分开评测，区分「泛化鲁棒性」与「噪声记忆」；④ 规模一致性——0.6M/2.4M/5.4M 三尺寸验证结论普适。四个问题合起来是一个完整的小型系统性研究。
      - generic [ref=f154e40]: 架构与 SSL 的互相成就：声学模型是 Keyword Transformer（12 个编码块 + 余弦位置编码 + mean pooling + MLP）——选纯 encoder 而非 CNN/RNN，因为 Data2Vec 的 teacher-student 框架天然作用于 encoder 隐状态，帧级隐状态可直接充当预训练回归目标。特征 40 维 MFCC（沿用前作保持可比）。监督侧对照 MTR：训练数据混入加噪副本。
