        - generic [ref=f154e97]: 式 1 · Data2Vec 目标：teacher 顶部 K 块在被掩码时间步上的归一化输出均值。两个关键细节：按样本实例归一化避免回归目标被个别异常激活主导（Data2Vec 相对早期 BYOL 式自蒸馏能稳定训练的原因）；掩码率 0.65（wav2vec 2.0 式时域掩码、连续 10 帧替换为可学习 token）——语音帧冗余度高，掩得不够任务退化成插值。student 用 MSE 拟合，标准反向传播。
      - generic [ref=f154e98]: 训练配置与工程开销：微调与监督基线共用 140 epoch · batch 512 · AdamW（lr 1e-3 · wd 0.1）· warmup+余弦退火 + SpecAugment；微调唯一区别是编码器从预训练初始化。单卡 A40（48GB）：最大模型预训练 2 小时、微调 15 分钟——18.9h 无标注音频的红利，实验室尺度完全可复现。
