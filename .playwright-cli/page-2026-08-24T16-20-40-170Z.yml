        - heading "一分钟版本" [level=2] [ref=f34e25]
        - list [ref=f34e26]:
          - listitem [ref=f34e27]: 痛点结构：custom KWS 的核心失败模式是共享元音的混淆词（blue vs glue）——来自用户研究与线上 demo 的关键观察；但现有 EER/AUC 把 35 个词的比较混在一起平均，混淆场景的糟糕表现被非混淆比较稀释。
          - listitem [ref=f34e28]: 方案三件套：LLM 按元音生成混淆词组（20 元音 × 每组 100 词，Gemini 1.5 Pro 一条提示词搞定）→ Virtuoso TTS 风格采样合成（726 说话人 × 5 韵律 × 每词 100 句 = 20 万条）→ 组感知 GE2E 训练（LLM/TTS 批次内全部语句来自同一元音组，对比压力直接打在最难词对上）。
          - listitem [ref=f34e29]: 关键工程思路：把混淆对的发现从训练时在线搜索（O(N)/批）前移为训练前一次性离线数据生成——训练循环零开销、无需查找表；批次级混合（非语句级）避免「真实 vs 合成音色」成为捷径。
          - listitem [ref=f34e30]: 结果：全集指标改善边际（AUC −3.7%）、混淆指标显著（c-AUC −11.3%、Hard-AUC −12.5%、Easy-AUC −100% 降至零错误）——增强精确打在目标区域。基线 c-AUC 几乎是全集 AUC 的两倍，印证组内评估更难。
          - listitem [ref=f34e31]: 诚实披露：FAR <1% 极低误接受端增强模型反而略差（TTS 偏置）；/i:/&/ɪ/ 组退化 +9.67%——TTS 对 three/tree 合成出几乎相同的音，训练被迫区分不可区分的对。
