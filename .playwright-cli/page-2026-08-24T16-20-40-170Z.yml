      - heading "TTS 偏置与近同音对是两个软肋" [level=2] [ref=f34e203]
      - generic [ref=f34e205]:
        - generic [ref=f34e206]:
          - heading "方法的技术局限" [level=4] [ref=f34e207]
          - list [ref=f34e208]:
            - listitem [ref=f34e209]: 极低误接受端回退：FAR <1% 区域增强模型略差于基线——量产助手的关键工作区间，TTS 偏置不可忽视。
            - listitem [ref=f34e210]: TTS 近同音合成：three/tree 类辅音级近对可能被合成出几乎相同的音——训练被注入不可解任务；生成管线无难度校验或过滤。
            - listitem [ref=f34e211]: 元音分组有盲区：辅音差异维度（th/r、s/sh）未显式建模——元音锚点解释不了组内全部混淆来源。
            - listitem [ref=f34e212]: 时长泛化受限：1 秒训练配置下，完整 LibriPhrase（0.63s 均值）增强收益消失。
            - listitem [ref=f34e213]: 说话人对齐未报告：726 个 TTS 说话人与真实用户声学条件的覆盖差异无分析。
        - generic [ref=f34e214]:
          - heading "实验设计的不足" [level=4] [ref=f34e215]
          - list [ref=f34e216]:
            - listitem [ref=f34e217]: 零正式消融：P(tts)、每组词数、每词语句数、说话人/韵律数、元音覆盖——所有超参无敏感性实验。
            - listitem [ref=f34e218]: 多语言主张未验证：实验只在英语，100+ 语言是方法层推论。
            - listitem [ref=f34e219]: 组指标统计功效弱：每组仅 3–5 词，组 AUC 估计方差天然偏大。
            - listitem [ref=f34e220]: 训练效率优势未量化：与检索式/查找表方法的对比停留在定性，无训练时间/内存的正面数字，也没拼精度。
            - listitem [ref=f34e221]: 对比单一：只对自家 MSWC 基线，缺同期 SOTA custom KWS 横向数据。
      - generic [ref=f34e222]:
        - heading "下一步方向（论文计划 + 笔者补充）" [level=3] [ref=f34e223]
        - paragraph [ref=f34e224]: 论文计划：对抗训练对齐合成/真实表征修复极低 FAR 端回退（同组后续工作）；更清晰可辨的 TTS（极相似词间合成出可区分的声音）；多时长训练；多语言扩展（尤其资源受限语言）。 笔者补充：词表生成阶段引入音素级难度校验与过滤，避免把 TTS 无法区分的对放进训练；元音分组扩展为元音+辅音二维混淆结构，与 GraphemeAug 的字形级硬负例互补；对 P(tts) 与词表规模做系统消融确定收益饱和点——都建立在「离线生成混淆结构、在线零开销训练」的核心范式上，该范式本身有继续挖掘空间。
