      - generic [ref=f51e117]: 并行挂着（多关键词场景的天然扩展）
      - generic [ref=f51e118]: 「换词 = 换唱片，唱机不动」：
      - generic [ref=f51e119]: · 主网是唱机（固定·通用）
      - generic [ref=f51e120]: · 滤波器是唱片（每词一张·可换）
      - generic [ref=f51e121]: · 预测网络是刻录机（样本→唱片）
      - generic [ref=f51e122]: 这个三件套比喻抓住了全部架构逻辑——
      - generic [ref=f51e123]: 开放词汇与极小足迹就此兼容
      - generic [ref=f51e124]: 左：知识被拆成三层——通用处理固定、词知识动态、映射本身也是学出来的元知识。右：滤波器像可换唱片——换词换唱片、唱机不动、刻录机自动刻，开放词汇与 250KB 预算就此兼容
    - generic [ref=f51e125]: 图 2 · 机制解剖：知识解耦的三层含义 · 检测滤波器的形状与两条老路的对照
    - generic [ref=f51e126]:
      - generic [ref=f51e127]: "预测: 滤波器 w_kw = PredictNet(注册样本₁..ₖ) ← 联合训练学出的映射(元知识) 检测: score(t) = Match( 主网特征流(t), w_kw ) ← 相关/匹配运算, 流式逐帧 触发: score > θ → 检测事件 ← 低延迟 约束: sizeof(主网 + 滤波器) < 250KB ← MCU 级预算"
      - generic [ref=f51e128]: 人话：刻录机（预测网络）听用户念几遍新词，自动刻出一张匹配唱片（滤波器）；唱机（主网）拿着唱片在音频流里对拍——拍到这段旋律就触发。唱片小、唱机通用，整套设备塞进 250KB。
    - paragraph [ref=f51e129]: 知识被拆成三层：通用声学处理留在主网（固定）、关键词知识进滤波器（动态）、而「样本→滤波器」这个映射本身也是预测网络学出的元知识——三层解耦让每层都各司其职，这是比「词表搬进数据」更深一层的解构。
