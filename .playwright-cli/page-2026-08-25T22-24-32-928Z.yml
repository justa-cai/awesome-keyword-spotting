      - generic [ref=f51e110]: 滤波器是什么形状
      - generic [ref=f51e112]: 检测滤波器 = 主网里的「可换模板」：
      - generic [ref=f51e113]: · 时频域的一组参数——对输入特征做
      - generic [ref=f51e114]: 匹配/相关运算（像可学习的模板匹配）
