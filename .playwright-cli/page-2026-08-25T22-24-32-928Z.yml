  - generic [ref=f51e85]:
    - generic [ref=f51e86]: "02"
    - heading "机制：唱机、唱片与刻录机" [level=2] [ref=f51e87]
    - paragraph [ref=f51e88]: 整套架构可以用一个三件套比喻讲完：主网是唱机（固定、通用，任何唱片都能放）、滤波器是唱片（每个词一张、可换、尺寸小）、预测网络是刻录机（从用户的注册样本自动刻录唱片）。换唤醒词 = 换唱片，唱机永远不动——这就是开放词汇与极小足迹兼容的全部秘密。
    - img [ref=f51e89]:
      - generic [ref=f51e91]: 机制解剖：知识解耦的三层含义 · 与两条老路的对照
