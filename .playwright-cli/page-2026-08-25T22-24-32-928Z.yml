  - generic [ref=f51e12]: Snips（Bluche / Gisselbrecht——Hey Snips 同门）· arXiv 1912.07575（2019.12） 困境：封闭词表加词要重训；ASR 开放词汇数百 MB 装不进边缘 · 方法：固定主 KWS 网络 + 辅助网络从注册音频预测检测滤波器（匹配模板），联合训练 · 注册 = 说几遍 → 生成滤波器 → 加载 一句话：总模型 <250KB 的开放词汇 KWS——词知识从参数解耦进滤波器，打破了「灵活性 = 大模型」的隐含假设。
  - generic [ref=f51e13]:
    - generic [ref=f51e14]: "01"
    - heading "困境：灵活性或小体积，只能选一个？" [level=2] [ref=f51e15]
    - generic [ref=f51e16]:
      - generic [ref=f51e17]: TL;DR
      - list [ref=f51e18]:
        - listitem [ref=f51e19]: ◆ 封闭词表系统的局限：加词要重训——用户自定义唤醒词做不了；固定滤波器（模板/HMM）每词手工设计，刚性且维护贵。
        - listitem [ref=f51e20]: ◆ 大词表 ASR 能检测任意词——但数百 MB 模型 + 大算力，远超边缘预算；250KB 内存红线直接排除几乎所有开放词汇方法。
        - listitem [ref=f51e21]: ◆ 本文的解耦设计：固定主 KWS 网络（通用声学处理，部署后不动）+ 辅助预测网络（从注册样本预测检测滤波器）——词的知识活在滤波器里，不在参数里。
        - listitem [ref=f51e22]: ◆ 注册流程秒级：用户说几遍 → 预测网络生成滤波器 → 加载进主网 → 主模型零改动——一次训练、任意关键词、<250KB 总预算。
