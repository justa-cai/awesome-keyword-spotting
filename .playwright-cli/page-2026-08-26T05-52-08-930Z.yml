      - generic [ref=f167e218]:
        - generic [ref=f167e219]: JUDGEMENT
        - paragraph [ref=f167e220]: ↳ 对抗脆弱性的病根在表征几何不在输出分布：微小扰动逐层放大成大位移——只在 logits 层拉齐是修国界不修地形；VICReg 三项直接塑造学生嵌入空间的形状，这是它赢过 ARD/RSLAD 的机制解释。
        - paragraph [ref=f167e221]: ↳ 蒸馏传的是「锚」不是「行为」：鲁棒教师的鲁棒性传不过软标签（KD 实验），但教师处理干净输入的表征位置可以当锚——蒸馏配方要明确「我从教师拿什么」，拿对了一件事，拿错了白花算力。
        - paragraph [ref=f167e222]: ↳ 消融要能拆掉别人方法的隐藏外挂：本文证明 ARD/RSLAD 的优势靠多视图撑着——对照组必须与实验组共享所有数据条件（同增广、同攻击预算），否则优势归属就是张冠李戴。
