        - heading "一分钟版本" [level=2] [ref=f2e25]
        - list [ref=f2e26]:
          - listitem [ref=f2e27]: 痛点：自定义唤醒词 = 标签集合持续演化。微调必灾难性遗忘（Finetune 在 SC-100 上 51 任务只剩 3.30%）；回放式要存旧语音——踩 GDPR 红线、500 条缓冲约 8M 张量元素、且类一多就崩（iCaRL 100 类从 69.3% 崩到 23.70%）。
          - listitem [ref=f2e28]: 方案：把分类器学习整体换成递归最小二乘（Woodbury 恒等式推导）。历史知识压成一个 d×d 的 AFAM 矩阵——128 维只有 16K 元素，是回放缓冲的 1/500，且与任务数无关。
          - listitem [ref=f2e29]: 数学保证：任意时刻的递归解与"全部任务数据一起联合岭回归"的解严格相等——遗忘不是被软约束压制，是根本没有产生的机制（BWT 低至 −0.003）。
          - listitem [ref=f2e30]: 结果：SC-100（100 类）51 任务 87.63%，比最强回放基线高约 11 个百分点；每 epoch 训练 5~10 秒，比 RK 快约 190 倍（零反向传播、单 epoch 闭式更新）。
          - listitem [ref=f2e31]: 代价：CNN 在任务 0 后冻结 + 线性读出 → 距联合训练上界仍差 5~7 个百分点，后期新类自身精度偏低（图 2 热图对角线 72~75%）。
