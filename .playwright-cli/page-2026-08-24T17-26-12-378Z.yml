            - listitem [ref=f57e258]: 无延迟/效率定量实测：全篇强调轻量流式低延迟，但无 RTF / chunk 延迟 / 内存 / 功耗——0.9M 只是静态代理；「非流式计算负载更高」的论断停留在定性。
            - listitem [ref=f57e259]: 消融覆盖不足：仅两项（混合嵌入、说话人分类器）——AAM、τ、解码窗口、三组权重均无消融。
            - listitem [ref=f57e260]: 数据域单一：全在 LibriSpeech 衍生（朗读有声书、干净近讲）+ WenetPhrase——无远场/加噪/混响/多说话人重叠，而卖点恰是端侧部署。
            - listitem [ref=f57e261]: 无统计显著性：全部单次运行；3.3 节与表 1 数字不一致（27.71 vs 27.29）暗示随机拼接方差未处理。
            - listitem [ref=f57e262]: 困难负样本定义局限：LPH 按 Levenshtein 构造——未覆盖语义欺骗与实际产品误触发音（儿童/口音/电视播报）。
      - generic [ref=f57e263]:
        - heading "下一步方向（论文展望 + 笔者补充）" [level=3] [ref=f57e264]
        - paragraph [ref=f57e265]: ① 补端侧实测：真实嵌入式平台的 chunk 延迟 / RTF / 内存 / 功耗 + 窗口与延迟-精度的量化曲线——从参数量叙事变成时延叙事。 ② 更强的中文文本前端：带声调建模的 G2P 或预训练音素表示替换 LSTM——缩小中文文本/音频注册差距。 ③ 注册质量自适应：自动评估注册音频质量、动态调三路融合权重（现在固定 0.5/0.25/0.25）——注册音频差时自动偏置文本路。 ④ 解码鲁棒性升级：纯 max 换成带惩罚的弹性对齐（类 DTW 的因果近似）——保持零/近零参数同时处理漏音停顿。 ⑤ 自监督/基础模型蒸馏：用预训练模型的音素边界知识蒸馏音频编码器——不增在线参数提升 LPH 判别力（27.29 仍偏高）。 ⑥ 扩展负样本体系：真实产品误触样本 + 跨说话人评测（注册人与测试人不同的系统报告）——检验梯度反转在跨信道下的成色。
