        - heading "一分钟版本" [level=2] [ref=f57e25]
        - list [ref=f57e26]:
          - listitem [ref=f57e27]: 核心矛盾：学术界反复验证「多模态注册有用」，但多模态带来的参数膨胀（基线 2.2M~3.9M）与端到端部署约束让工业界没法用——「多模态」与「端侧流式」在现有工作里互斥。
          - listitem [ref=f57e28]: 解法是计算搬家：离线多模态 + 在线单编码器 + 零参数数学解码。注册嵌入（音频/文本/混合）一次性算好缓存；在线路径只剩 7 层 DFSMN（0.9M）逐帧编码 + 纯数学解码器（相似度→因果平滑→窗口 max 聚合→分数加权）——图 1 明确标注 "No Params"。
          - listitem [ref=f57e29]: 两个训练关键：AAM 角度间隔拉大易混音素边界（源头掐掉误报源）；梯度反转去声纹——注册嵌入捕捉「这个词是什么」而不是「谁念的」（消融里最大的单项：去掉后 LPE EER +3.08、LPH +4.75）。
          - listitem [ref=f57e30]: 结果：英文流式 LibriPhrase LPE 5.77 / LPH 27.29——比最强基线 CLAD 参数少 59% 且 EER 相对改善 33%；中文 WenetPhrase 流式 14.56 优于任何窗口受限版 MM-KWS（2s 窗口 18.38），但坦承与精确边界版（4.24）仍有 ~10 pp 差距。
          - listitem [ref=f57e31]: 反常发现：中文上音频注册反超文本注册（18.46 vs 19.76，与英文相反）——多音字/声调的文本-发音映射歧义（笔记推测，论文未讨论）。
