    - heading "5 判断：能带走的三句话" [level=2] [ref=f95e206]:
      - generic [ref=f95e207]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f95e208]:
      - generic [ref=f95e209]: JUDGEMENT
      - paragraph [ref=f95e210]: ↳ 联邦学习的真实收益是「重新分配信任」而不是「提升性能」：模型质量持平就是成功——它把「必须信任公司保管语音」换成「只需信任参数聚合协议」，这种信任结构的改变在 GDPR 时代是产品维度的竞争力。
      - paragraph [ref=f95e211]: ↳ 通信轮次是联邦的第一成本：自适应聚合的聪明之处在于把优化器设计移植到聚合层——凡是有「多轮通信」的分布式系统，优化器技巧都是降通信的现成杠杆。
      - paragraph [ref=f95e212]: ↳ 开源数据集的寿命可能超过算法本身：Hey Snips 数据集定义了一个时代的复现底线，后续大量工作（空洞 CNN 182 帧等）都在它上面做——发论文时顺手开源基准，是影响力复利最高的动作。
