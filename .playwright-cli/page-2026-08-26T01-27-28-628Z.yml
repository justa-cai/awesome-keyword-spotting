    - generic [ref=f119e228]:
      - generic [ref=f119e229]: JUDGEMENT
      - paragraph [ref=f119e230]: ↳ 范式转换的最小可行路径是「原地换件」：不推翻 HMM 底盘、只把声学评分引擎换成 DNN——新技术的第一次落地往往不是全新架构，而是旧架构里最痛的那个零件的替换；验证成功后革命才逐步展开。
      - paragraph [ref=f119e231]: ↳ 标注可以从旧系统蒸馏：GMM 的强制对齐给 DNN 当老师——「用旧模型的输出当新模型的监督」是深度学习早期的通用启动器，与后来的蒸馏、伪标签一脉相承。
      - paragraph [ref=f119e232]: ↳ 约束定义领域：「1MB 以内」这条线把「小足迹」变成 KWS 的第一性问题——此后十年的压缩、量化、剪枝、蒸馏研究都在这条线内展开；提出正确约束的论文和提出方法的论文同样重要。
