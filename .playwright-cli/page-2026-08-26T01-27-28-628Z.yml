      - generic [ref=f119e151]: 人话：系统里有两条「剧本」：一条专门演唤醒词，另一条什么都演。每来一帧音频，DNN 判断「这帧像哪句剧本的哪个位置」，Viterbi 把整段串起来看哪条剧本演得更像。像唤醒词剧本的程度远超像「随便什么话」的程度，就报命中。
