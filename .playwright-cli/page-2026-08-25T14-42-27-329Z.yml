    - generic [ref=f271e22]: §01
    - text: 问题：比家居唤醒难一个量级
  - generic [ref=f271e23]: 内容审核场景的五重挑战
  - generic [ref=f271e24]:
    - generic [ref=f271e25]:
      - heading "声学环境的泥潭" [level=3] [ref=f271e26]
      - paragraph [ref=f271e27]: 背景音乐可能包含与目标关键词音素相似的片段；多说话人重叠让目标语音被严重掩蔽；环境噪声、音效层层叠加——干扰的多样性和强度远超家居环境的唤醒词场景。
    - generic [ref=f271e28]:
      - heading "错误代价不对称且都贵" [level=3] [ref=f271e29]
      - paragraph [ref=f271e30]: 误报 → 大量人工复审（烧人力资源）；漏报 → 合规风险与法律后果。系统要同时逼近极高召回与极低误报——这不是调阈值能解决的单目标问题，是结构性双目标。
    - generic [ref=f271e31]:
      - heading "中文的声调关卡" [level=3] [ref=f271e32]
      - paragraph [ref=f271e33]: 声调语言：同一音节四种声调四种含义（ma = 妈/麻/马/骂）——模型必须对基频的时间轨迹高度敏感；音节结构（声母+韵母+声调）与英语有本质差异，直接搬英语 KWS 经验未必行。
    - generic [ref=f271e34]:
      - heading "竞赛的现实背景" [level=3] [ref=f271e35]
      - paragraph [ref=f271e36]: 视频关键词唤醒挑战赛提供中文数据集，按官方综合得分（准确率/召回率平衡 + 特定误报率下的召回率）排名——评估口径本身就是内容审核场景的双目标形状。
