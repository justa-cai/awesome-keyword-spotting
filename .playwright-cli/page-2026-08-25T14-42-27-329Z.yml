  - heading "§02 方法：每个 +1% 的手段都叠上" [level=2] [ref=f271e98]:
    - generic [ref=f271e99]: §02
    - text: 方法：每个 +1% 的手段都叠上
  - generic [ref=f271e100]: 渐进式解冻 · 域混 mixup · 三层融合 · 粗筛精排
  - generic [ref=f271e101]:
    - generic [ref=f271e102]: "迁移: ASR 编码器（数千小时中文）→ KWS 初始化 解冻: 1–4 层冻结(小 lr) · 5–8 层微调(中 lr) · 9–12 层+头全训(大 lr) 适配: 源域/目标域样本混训（domain mixup）→ 压分布差 增强: 速度 0.9/1.0/1.1× · 音量 ±6dB · 噪声 −5~20dB · RIR T60 0.1–0.8s · SpecAugment（时≤20 帧 / 频≤8 bin）· 时间偏移 ±100ms"
    - generic [ref=f271e103]: 人话：底层是 ASR 学到的通用声学知识（音素模式、声调特征、说话人无关表示）——冻住别动；高层是任务特定层——放大学习率快速适配。速度扰动一箭双雕：既变时长又变声调频率，恰好覆盖中文声调语言的两个敏感维度。
  - generic [ref=f271e104]:
    - generic [ref=f271e105]:
      - heading "多尺度融合的互补逻辑" [level=3] [ref=f271e106]
      - paragraph [ref=f271e107]: 浅层抗噪但语义少，深层语义丰但怕噪——上采样对齐分辨率后拼接再 1×1 降维，两种粒度同时在手：细粒度声学模式区分声学相似的关键词，粗粒度语义管整体识别。单用任一尺度掉 1–3%。
    - generic [ref=f271e108]:
      - heading "两阶段的流量经济学" [level=3] [ref=f271e109]
      - paragraph [ref=f271e110]: 常驻算力由便宜的第一级决定，贵的大模型只处理 5–10% 的音频——粗筛宽阈值（宁多勿漏）+ 精排严阈值（滤误报），两端各自逼近最优。内容审核要的正是这个形状：误报压一个量级、召回几乎不伤。
