- generic [ref=f271e2]:
  - generic [ref=f271e3]: 论文精读 · 可视化版 · 2021 №6
  - heading "视频审核的中文关键词唤醒： 竞赛冠军 = ASR 迁移打底 + 五模块叠 buff" [level=1] [ref=f271e4]: 视频审核的中文关键词唤醒：竞赛冠军 = ASR 迁移打底 + 五模块叠 buff
  - generic [ref=f271e5]:
    - generic [ref=f271e6]: BBS-KWS · 网易 Yidun
    - generic [ref=f271e7]: arXiv 2112.01757 · 挑战赛第 1 名
    - generic [ref=f271e8]: ASR 迁移 + 六件套增强 + 双注意力 + 多尺度 + 两阶段
    - generic [ref=f271e9]: vs 基线 +10–15% · 两阶段误报 5%→0.5%
  - generic [ref=f271e10]: 一句话：视频内容审核要在背景音乐、多人重叠、方言口音的泥潭里检出中文关键词，误报烧人力、漏报担合规风险。BBS-KWS 拿下挑战赛第一的配方：数千小时中文 ASR 编码器做初始化（消融里贡献最大，去掉掉 5–8 个点），配六件套数据增强、SE+时间双注意力、浅中深三层特征融合，最后用粗筛+精排两阶段把误报压低一个量级（5%→0.5%），代价只是召回掉 1–2%。
  - generic [ref=f271e11]:
    - generic [ref=f271e12]: TL;DR
    - listitem [ref=f271e13]: ◈ 视频场景五重挑战：声学极复杂（音乐可能含与目标词音素相似的片段、多人重叠掩蔽）· 说话人多样性极高（性别/年龄/口音/方言）· 误报代价极高（误报=人工复审成本，漏报=合规风险）· 中文声调特殊性（同一音节四声四义，要盯基频轨迹）· 实时吞吐要求。
    - listitem [ref=f271e14]: ◈ 五模块集成（竞赛典型打法）：声学前端 → DS-CNN 骨干 + SE(r=16) 通道注意力 + 时间注意力 → 大规模 ASR 迁移 → 多尺度融合 → 两阶段检测——组合互补技术最大化性能。
    - listitem [ref=f271e15]: ◈ 迁移学习是最大功臣：数千小时中文 ASR 编码器（Conformer/Transformer）初始化 + 渐进式解冻（冻结 1–4 层 / 微调 5–8 / 全训 9–12+头）+ 域混 mixup——去掉直接 −5–8%。声学知识的来源比结构技巧贡献大一个档。
    - listitem [ref=f271e16]: ◈ 双注意力分工：SE 增强与目标词音素相关的频率通道、抑制噪声通道；时间注意力盯住关键声调变化时段——中文声调主要体现在基频的时间轨迹上，这把注意力恰好对上。
    - listitem [ref=f271e17]: ◈ 六件套增强：速度扰动 0.9/1.0/1.1×（同时改时长与声调频率）· 音量 ±6dB · 噪声注入 SNR −5~20dB · RIR 混响 T60 0.1–0.8s · SpecAugment · 时间偏移 ±100ms——去掉掉 3–5%，含噪/音乐鲁棒性严重下降。
    - listitem [ref=f271e18]: ◈ 多尺度融合：浅层（音素级、抗噪）+ 中层（音节结构、声调轨迹）+ 深层（词/短语语义、怕噪）上采样拼接 1×1 降维——细粒度区分相似词，粗粒度管整体识别。
    - listitem [ref=f271e19]: ◈ 两阶段流水：小模型宽阈值粗筛全流（宁多勿漏）→ 大模型严阈值精排，只有 5–10% 音频进第二级——误报 5%→0.5% 降一个量级，召回只掉 1–2%，代价是推理时间 +50%。
    - listitem [ref=f271e20]: ◈ 消融排序：ASR 迁移（−5–8%）> 数据增强（−3–5%）> 多尺度融合（−1–3%）> SE（−1–2%）> 时间注意力（−0.5–1%）。边界：服务器端场景无边缘部署讨论、中文特化、竞赛特化决策未必通用。
