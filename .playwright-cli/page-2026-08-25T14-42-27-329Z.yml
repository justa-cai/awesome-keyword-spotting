  - generic [ref=f271e310]:
    - generic [ref=f271e311]: 可迁移判断
    - paragraph [ref=f271e312]: ↳ 声学知识的来源比结构技巧贡献大一个档：ASR 迁移（−5–8%）压倒所有结构类组件（各 −0.5~3%）——先找好的预训练初始化，再谈结构创新；对低资源语言 KWS 这条优先级尤其成立。
    - paragraph [ref=f271e313]: ↳ 增强策略要贴着语言特性设计：速度扰动对声调语言一箭双雕（时长+声调频率都变）——设计增强时先列任务的敏感维度，再挑能覆盖这些维度的扰动。
    - paragraph [ref=f271e314]: ↳ 误报敏感场景的标配是两阶段：宽进严出 + 5–10% 流量走贵模型——误报降一个量级、召回几乎不伤；代价是推理时间 +50% 与双阈值联合调优的复杂度。
    - paragraph [ref=f271e315]: ↳ 竞赛系统是最佳实践的集成展览：单件技术（迁移范式、增强六件套、双注意力）皆可拆出独立复用——读竞赛论文的正确姿势是拆零件，不是整体照搬。
