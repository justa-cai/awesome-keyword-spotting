  - heading "§02 方法：把后门从数据侧长出来" [level=2] [ref=f254e124]:
    - generic [ref=f254e125]: §02
    - text: 方法：把后门从数据侧长出来
  - generic [ref=f254e126]: 声纹相似度矩阵 · 贪心选择 · 条件式语音转换
  - generic [ref=f254e127]:
    - generic [ref=f254e128]: "Spk_embed_i = X-vector(Speaker_i) # K 个说话人的声纹嵌入 SM[i][j] = EucDist(Spk_embed_i, Spk_embed_j) # K×K 声纹相似度矩阵（欧氏距离） Cand = { Sᵢ : SM[Sᵢ][Sⱼ] > T, ∀Sⱼ ∈ Cand }, |Cand| = N # 贪心选择"
    - generic [ref=f254e129]: 人话：x-vector 挑出唯一稳定可靠、表达说话人身份的特征；欧氏距离直接对应嵌入空间里「音色差异大小」——距离越大两个触发器越不易混淆。贪心规则保证 N 个触发器两两距离都超阈值 T。单目标攻击不用选，随机取一人即可。阈值 T 的取值论文未报告——复现时需自行摸索。
  - generic [ref=f254e130]:
    - generic [ref=f254e131]: "触发器生成: StarGANv2-VC（音色作生成器/判别器的条件输入） → 一个 VCM 把任意输入转换成 N 个目标音色之一（N 对 N） 投毒: 良性样本 → 转换成说话人 Sᵢ 的音色（语义不变）→ 替换进训练集 绑定: 目标标签 i ↔ 说话人 Sᵢ 的音色 → 正常 CE + SGD 训练"
    - generic [ref=f254e132]: 人话：触发器不是手工设计或梯度优化出来的，是「转换」出来的——语义保持（中毒样本仍是合法可懂的命令）、规模无限（有良性数据就能批量造，投毒率 0.2%–2% 自由调）、一个 VCM 服务所有目标（多目标的基础设施成本是常数级）。训练流程完全正常，后门是模型在普通监督学习里「顺便」学到的关联。
  - generic [ref=f254e133]:
    - generic [ref=f254e134]:
      - heading "多目标的内在矛盾与解法" [level=3] [ref=f254e135]
      - paragraph [ref=f254e136]: 多个音色触发器同时植入时，音色相似 → 相互干扰 → ASR 下降；低投毒率下更糟（训练信号本来就少，音色还像，后门边界就糊了）。声纹筛选正是针对这一点：消融证实声纹选择优于随机选择，低投毒率下优势最大——避免「两个相似音色攻击不同目标」。
    - generic [ref=f254e137]:
      - heading "全局 vs 局部：范式级差异" [level=3] [ref=f254e138]
      - paragraph [ref=f254e139]: 超声基线在频谱图上是一小块局部补丁，只作用在局部时空区域；音色转换改变的是整张频谱图的统计纹理。1 秒语音 = 87 帧时序序列，音色在每一帧都留下印记——这不是实现细节的胜负，是触发器范式与时序模型结构之间的根本适配问题。
