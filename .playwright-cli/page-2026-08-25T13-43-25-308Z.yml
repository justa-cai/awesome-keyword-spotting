    - generic [ref=f254e340]: 读表要点
    - listitem [ref=f254e341]: ◈ 摘要总括：投毒 ≤1% 训练数据时四模型平均 ASR 接近 97%；随中毒样本数增加 ASR 快速收敛 >95% 且 AV 保持小——高效且不留验收痕迹。
    - listitem [ref=f254e342]: ◈ VGG16/WideResNet 上基线低投毒率反超，但基线的两个前提（采样率 >44.1kHz、无低通滤波）在真实系统里不成立——比较要在约束下读。
    - listitem [ref=f254e343]: ◈ 人类验证设计有讲究：20 名被试全部通过 CET-4（数据集是英文命令词，被试需具备基本英语听辨能力才有效），每人 20 条（10 后门+10 良性）二选一——100% 无法区分。
    - listitem [ref=f254e344]: ◈ 消融只覆盖单 vs 多目标、随机 vs 声纹选择两个对照；阈值 T 敏感性、N>3、不同 VC 模型的影响均未报告。
