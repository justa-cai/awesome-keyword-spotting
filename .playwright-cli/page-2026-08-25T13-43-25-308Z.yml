    - text: 局限与防御启示
  - generic [ref=f254e363]: 零防御实验 · 过空中传输未测 · 声纹侧防御的拦截面
  - generic [ref=f254e364]:
    - img [ref=f254e365]:
      - generic [ref=f254e367]: 边界与延伸
      - generic [ref=f254e369]: 技术边界
      - generic [ref=f254e370]: · 威胁模型要求数据完整控制权：数据只读/部分可写/只能追加样本
      - generic [ref=f254e371]: 的场景下「转换再替换」是否成立，未讨论
      - generic [ref=f254e372]: · 部署期需在线语音转换：触发器生成的离线，真实利用时要么预存
      - generic [ref=f254e373]: 目标音色语音要么现场转换——过无线信道+麦克风阵列（远场/混响/
      - generic [ref=f254e374]: 噪声/编解码）的鲁棒性未报告，绝大多数音频后门工作的共同空白
      - generic [ref=f254e375]: · 理论上可被声纹侧防御捕获：中毒样本在说话人维度是「新来者」——
      - generic [ref=f254e376]: 声纹一致性校验/分布异常检测/转换伪影检测都有拦截面；论文
      - generic [ref=f254e377]: 零防御对抗实验，防御者在场时的生存能力未知
      - generic [ref=f254e378]: · 超参缺指引：阈值 T 未报告；VC 训练配置/音色相似度指标/词可懂率
      - generic [ref=f254e379]: 均未报；N 只验 3；「转换越狠音色越独特但伤自然度」未量化
      - generic [ref=f254e381]: 实验边界 + 延伸
      - generic [ref=f254e382]: · 数据集窄：GSC 10 类孤立 1 秒命令词——真实 KWS 是流式持续监听，
      - generic [ref=f254e383]: 分布差异未讨论；中文唤醒词/长命令未验
      - generic [ref=f254e384]: · 基线单一：只比超声法，未与神经木马/环境音/位置无关/隐写横比
      - generic [ref=f254e385]: · 无方差报告：重复 5 次但只给曲线；人测仅 20 人二选一（更实战
      - generic [ref=f254e386]: 应是听写内容/自然度打分）
      - generic [ref=f254e387]: 延伸（防御侧最有价值）：训练数据声纹构成审计（标注来源的说话人
      - generic [ref=f254e388]: 突变检测）；推理端说话人验证门控；转换伪影检测；激活聚类/STRIP/
      - generic [ref=f254e389]: 微调剪枝在音色触发器上的适配评估；过空中传输实验；N 推到 10+；
      - generic [ref=f254e390]: 威胁模型弱化到「污染公开预训练集」的迁移场景
      - generic [ref=f254e391]: 工程警示：外包训练或用众包数据时，「少于 1% 的污染」足以在 LSTM 上接近 100% 劫持指定标签——数据供应链的说话人构成审计应与准确率验收一样成为标配
    - generic [ref=f254e392]: 图4 · 边界与延伸：左技术边界（数据完整控制权前提、部署期在线转换需求、声纹侧防御的潜在拦截、超参缺指引），右实验边界（孤立命令词 vs 流式、单一基线、无方差）+ 防御研究路线。
  - generic [ref=f254e393]:
    - generic [ref=f254e394]: 可迁移判断（防御视角）
    - paragraph [ref=f254e395]: ↳ 数据供应链的说话人构成审计应成为 KWS 交付标配：改动不到 1% 的训练数据就能在 LSTM 上接近 100% 劫持指定标签，且音频听感正常、不依赖高采样率、不怕低通滤波——准确率验收对此完全失明。
    - paragraph [ref=f254e396]: ↳ 中毒样本在说话人维度是「新来者」：同一标注来源的说话人构成突变检测、推理端说话人验证门控（唤醒词与注册音色不匹配则拒绝）、转换伪影检测——音色触发器反而给了防御一个明确的抓手。
    - paragraph [ref=f254e397]: ↳ 模型归纳偏置决定它怕什么攻击：时序模型怕全局时间连贯的特征，深层残差怕全局纹理（局部特征被捷径冲刷），纯空间卷积怕局部补丁——选架构时值得把「抗哪种触发器」纳入威胁建模。
    - paragraph [ref=f254e398]: ↳ 「隐蔽」要同时骗过机器和人类：只对机器隐蔽（噪声类触发器）的攻击在人工质检面前不堪一击；能通过人耳检验的攻击才是产品级威胁——质检流程里应包含人类听感抽检这一环。
