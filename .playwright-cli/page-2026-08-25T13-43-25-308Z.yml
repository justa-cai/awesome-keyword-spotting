- generic [ref=f254e2]:
  - generic [ref=f254e3]: 论文精读 · 可视化版 · 2022 №40 · 安全研究
  - heading "不往语音里藏噪声， 直接换一个人说：音色本身就是后门触发器" [level=1] [ref=f254e4]: 不往语音里藏噪声，直接换一个人说：音色本身就是后门触发器
  - generic [ref=f254e5]:
    - generic [ref=f254e6]: VSVC · 后门攻击（防御视角深读）
    - generic [ref=f254e7]: 河海大学 + RMIT + NUS · arXiv 2212.10103
    - generic [ref=f254e8]: StarGANv2-VC 音色触发 · x-vector 声纹筛选
    - generic [ref=f254e9]: LSTM 仅 50 个中毒样本 → 92% 攻击成功率
  - generic [ref=f254e10]: 一句话：KWS 训练外包/众包数据时，攻击者能改训练集。VSVC 把「音色」当触发器——用 StarGANv2-VC 把良性样本整段换成指定说话人的声音（语义不变），投毒不到 1% 训练数据，就在四个强模型上平均拿到约 97% 攻击成功率；LSTM 上 50 个样本即 92%。听感上是「另一个人说同一个词」，20 人盲测 100% 无法区分——不依赖超声频段，16kHz 系统照样成立，低通滤波也滤不掉。
  - generic [ref=f254e11]:
    - generic [ref=f254e12]: TL;DR（以防御视角读）
    - listitem [ref=f254e13]: ◈ 威胁模型：攻击者对模型结构零知识，对训练数据完整读写——对应训练外包到云平台、众包数据集（Common Voice 等）两种现实场景。后门完全从数据侧长出来，不需要对模型做任何手术。
    - listitem [ref=f254e14]: ◈ 已有触发器的三大结构性缺陷：人耳可分（本质是「无法理解的噪声」）；超声触发器被奈奎斯特定理锁死（21kHz 信号要 44.1kHz 采样，主流系统 16kHz 一半频带不存在）且低通滤波即除；全部是单目标单后门。
    - listitem [ref=f254e15]: ◈ 核心洞察：音色是覆盖整段语音的全局特征——弥散在每一帧每个频带。转换后仍是自然可懂的语音（人耳层面检测失效）、在常规频带内（采样率无关、滤不掉）、时间连贯（对 LSTM 是全方位输入分布改变而非局部扰动）、取值空间大（VCTK 109 人 → N 对 N 多目标）。
    - listitem [ref=f254e16]: ◈ 三阶段管线：x-vector 声纹嵌入 + 欧氏距离 + 阈值 T 贪心筛出两两可分的 N 个说话人 → StarGANv2-VC 训一个 N 对 N 转换模型（一个 VCM 服务所有目标，成本常数级）→ 按投毒率替换数据后正常 CE+SGD 训练。
    - listitem [ref=f254e17]: ◈ 结果分层清晰：LSTM 最脆弱（0.63% 投毒即 ~100%，50 样本即 92%）；ResNet18 因捷径连接冲刷低层特征，局部触发器攻不动、全局音色可以；VGG16 局部空间关联最强，基线在低投毒率反超——模型归纳偏置决定攻防。
    - listitem [ref=f254e18]: ◈ 功能保持：平均准确率方差 0.45%（基线 0.53%，论文视为不显著）——投毒基本不伤正常功能，被植入的模型在验收时看不出异常。
    - listitem [ref=f254e19]: ◈ 防御空白：论文零防御对抗实验。声纹侧防御（一致性审核/分布异常检测/转换伪影检测）都有潜在拦截面；过空中传输鲁棒性未测——绝大多数音频后门工作的共同空白。
  - heading "§01 问题：训练供应链失控" [level=2] [ref=f254e20]:
    - generic [ref=f254e21]: §01
    - text: 问题：训练供应链失控
  - generic [ref=f254e22]: 攻击面不是「识别错词」，是「设备执行不该执行的动作」
  - generic [ref=f254e23]:
    - generic [ref=f254e24]:
      - heading "为什么 KWS 是高价值目标" [level=3] [ref=f254e25]
      - paragraph [ref=f254e26]: KWS 是音箱/手机助手的标准入口，常驻监听、实时响应——每次误判直接等价于设备层级的误操作。知道后门的攻击者对被植入的音箱说一句话即可绕过正常唤醒校验，隐式指挥设备（论文点名自动驾驶、智慧医疗为高危场景）。
    - generic [ref=f254e27]:
      - heading "外包 = 失去训练过程控制" [level=3] [ref=f254e28]
      - paragraph [ref=f254e29]: 训一个满意的 KWS 要高性能硬件+高质量标注数据，多数服务商把训练外包给云计算平台——第三方便可在数据上动手脚。后门攻击瞄准的正是训练阶段：污染一小部分数据，模型学到「触发器→目标标签」的关联，干净输入上表现正常。
    - generic [ref=f254e30]:
      - heading "超声触发器的三重死穴" [level=3] [ref=f254e31]
      - paragraph [ref=f254e32]: 奈奎斯特：21kHz 信号无失真识别要采样率 ≥42.2kHz，GSC 等 16kHz 系统一半以上频带不存在→直接失效；一个低通滤波器就能滤掉；且只在空间维度做局部注入、忽略时间维度——攻不动 LSTM。
    - generic [ref=f254e33]:
      - heading "攻击者的两个目标" [level=3] [ref=f254e34]
      - paragraph [ref=f254e35]: 触发效率（越高越可能成功、需发起的查询越少——某些场景限制查询次数，低效触发=彻底失效）与隐蔽性（干净输入上必须像干净模型，触发器要让人耳无法分辨）。VSVC 用「正常语音本身」同时满足两者。
