  - generic [ref=f254e347]: 三条自述 + 一个更广的视角
  - generic [ref=f254e348]:
    - generic [ref=f254e349]:
      - generic [ref=f254e350]: "1"
      - paragraph [ref=f254e351]: 音色触发器范式：以改变语音音色为目标的触发器——低投毒率（≤1%）下有效且隐蔽；不产生任何不可理解的噪声，比噪声类/环境音类/隐写类方法更隐蔽（四模型平均 ASR ~97%）。
    - generic [ref=f254e352]:
      - generic [ref=f254e353]: "2"
      - paragraph [ref=f254e354]: 摆脱采样率约束：音色分布在常规频带内，16kHz 系统照样成立——LSTM 上只投毒 50 个样本即 92% 攻击成功率（比基线高 72%）。
    - generic [ref=f254e355]:
      - generic [ref=f254e356]: "3"
      - paragraph [ref=f254e357]: 多目标后门攻击：音色表现形式丰富，可为不同目标植入不同触发器——实验演示 N=3 的多对多攻击。
    - generic [ref=f254e358]:
      - generic [ref=f254e359]: "4"
      - paragraph [ref=f254e360]: 更广视角（笔记归纳）：把后门触发器从「信号处理工件」（噪声/超声/隐写）转向「说话人身份属性」，给出可复用攻击管线（声纹筛选→条件转换→投毒）；同时是对 KWS 训练外包供应链风险的一次定量曝光。
