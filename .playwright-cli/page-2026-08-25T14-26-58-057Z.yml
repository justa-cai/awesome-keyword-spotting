  - heading "§02 方法：把 AUC 变成可微的损失" [level=2] [ref=f266e108]:
    - generic [ref=f266e109]: §02
    - text: 方法：把 AUC 变成可微的损失
  - generic [ref=f266e110]: 成对合页 · mini-batch 近似 · 与 CE 的分工混合
  - generic [ref=f266e111]:
    - generic [ref=f266e112]: "AUC = P(f(x₊) > f(x₋)) + 0.5 · P(f(x₊) = f(x₋)) L_pair = max( 0, 1 − (f(x₊) − f(x₋)) ) # 合页：间隔 ≥1 零损失 L_total = α · L_CE + (1−α) · L_AUC # α ≈ 0.5 推荐"
    - generic [ref=f266e113]: 人话：AUC 本身不可微，但它的排序语义可以写成「每对正负样本都拉开至少 1 的间隔」——这正是合页损失。batch 内所有正负组合各算一次取平均，就是 AUC 的无偏近似。混合 CE 的原因很实际：成对梯度不如逐样本梯度直接，纯 AUC 收敛慢——CE 负责快速把模型带到合理区域，AUC 负责精修排序。
  - generic [ref=f266e114]:
    - generic [ref=f266e115]:
      - heading "即插即用的工程含义" [level=3] [ref=f266e116]
      - paragraph [ref=f266e117]: 方法建立在任何现有骨干上（DS-CNN-S/L 等），只替换训练目标、不改网络结构——现有训练流水线加一行损失就能吃到收益。对存量系统而言这是改造成本最低的一类优化。
    - generic [ref=f266e118]:
      - heading "batch 采样是隐形前提" [level=3] [ref=f266e119]
      - paragraph [ref=f266e120]: 每个 batch 必须有足够的正负样本对做可靠估计——类别均衡的采样策略不是锦上添花而是方法成立的前提；正样本太少的 batch 估计方差大，AUC 优化会失真。
