- generic [ref=f266e2]:
  - generic [ref=f266e3]: 论文精读 · 可视化版 · 2021 №4
  - heading "准确率是代理指标： 直接优化「正样本排在负样本前面」的概率" [level=1] [ref=f266e4]: 准确率是代理指标：直接优化「正样本排在负样本前面」的概率
  - generic [ref=f266e5]:
    - generic [ref=f266e6]: AUC Optimization · 清华 / 西工大
    - generic [ref=f266e7]: arXiv 2107.05859 · 即插即用换损失
    - generic [ref=f266e8]: 成对合页损失 + mini-batch 近似 + 混合 CE
    - generic [ref=f266e9]: 10% 数据下 AUC +3–5% · 低误报点召回更高
  - generic [ref=f266e10]: 一句话：交叉熵逐样本独立优化分类准确率，不管正负样本得分的相对排序——而排序质量恰恰决定 KWS 部署时的误报-召回权衡。本文把排序学习的 AUC 损失（成对合页 + mini-batch 近似）引入 KWS 训练：任何骨干只换损失函数即插即用。数据越少收益越大——10% 训练数据下 AUC 绝对提升 3–5%，20% 下 2–3%，全数据下仍正向不掉准确率；混合 CE（α≈0.5）兼顾收敛速度与排序质量。
  - generic [ref=f266e11]:
    - generic [ref=f266e12]: TL;DR
    - listitem [ref=f266e13]: ◈ 核心错位：CE 以分类准确率为目标、逐样本独立处理——无法建模正负样本间的相对排序；分类准确率很高时，模型仍可能在关键工作点（极低误报下的召回）表现不佳。
    - listitem [ref=f266e14]: ◈ 数据越少越糟：自定义新关键词、低资源语言、小批量个性化部署——标注稀少时 CE 模型过拟合、误报率显著上升，恰是 KWS 最痛的场景。
    - listitem [ref=f266e15]: ◈ AUC 的排序定义：AUC = P(f(x₊) > f(x₋)) + 0.5·P(相等)——随机抽一正一负，正样本得分更高的概率。直接反映 ROC 权衡曲线的质量，是部署体验的合理度量。
    - listitem [ref=f266e16]: ◈ 可优化化：成对合页损失 L_pair = max(0, 1 − (f(x₊) − f(x₋)))——正样本比负样本高出至少间隔 1 则零损失，否则线性惩罚；信息论视角等价于最大化排序间隔。
    - listitem [ref=f266e17]: ◈ mini-batch 高效近似：全数据成对代价 O(N₊·N₋) 太贵——batch 内算所有正负对取平均；KWS 35 类设定负样本远多，批内对数可控。batch 越大估计越准（消融验证），采样需类别均衡。
    - listitem [ref=f266e18]: ◈ 混合损失 L = α·L_CE + (1−α)·L_AUC（α≈0.5）：CE 给逐样本梯度（收敛快），AUC 给成对梯度（排序直控）——纯 AUC 收敛慢的问题被混合策略缓解。
    - listitem [ref=f266e19]: ◈ 结果（约值）：10% 数据 AUC +3–5%、20% +2–3%、100% 小幅正向；FAR<0.1% 的低误报工作点保持更高召回——排序红利恰在用户容忍度最低的区域兑现。
    - listitem [ref=f266e20]: ◈ 边界：批内估计方差（正样本少时不可靠）；35 类要做多次一对多二分类 AUC（2022 跟进工作把 O(K²) 压到 O(K)）；未与 ListNet/LambdaRank 等排序损失对比；未做流式评估。
  - heading "§01 问题：优化目标与部署体验的错位" [level=2] [ref=f266e21]:
    - generic [ref=f266e22]: §01
    - text: 问题：优化目标与部署体验的错位
  - generic [ref=f266e23]: CE 优化代理指标，部署取决于排序质量
  - generic [ref=f266e24]:
    - generic [ref=f266e25]:
      - heading "CE 的盲区" [level=3] [ref=f266e26]
      - paragraph [ref=f266e27]: 交叉熵只保证每个样本对自己的标签负责——正负样本得分的相对位置无人管。只要每个样本都过自己的阈值，训练损失就满意；但 ROC 曲线上的交叠区（正样本得分低于某些负样本）正是误报-召回权衡恶化的源头。
    - generic [ref=f266e28]:
      - heading "低数据场景放大问题" [level=3] [ref=f266e29]
      - paragraph [ref=f266e30]: 新增自定义关键词、低资源语言、小批量个性化——标注稀少时 CE 模型过拟合，泛化下降且误报率显著上升。这些场景不是边缘情况，恰是 KWS 产品的高频需求（用户自定义唤醒词）。
    - generic [ref=f266e31]:
      - heading "AUC 为什么是对的那把尺" [level=3] [ref=f266e32]
      - paragraph [ref=f266e33]: AUC 直接度量「随机一正一负，正样本排在前面的概率」——它不关心绝对阈值，只关心排序。KWS 部署时用户调阈值找的是 ROC 曲线上的工作点，曲线质量（AUC）高，每个工作点的体验都更好。
    - generic [ref=f266e34]:
      - heading "成对损失的天然抗过拟合" [level=3] [ref=f266e35]
      - paragraph [ref=f266e36]: 即使样本总量少，样本之间的「关系」（谁该排在谁前面）仍在提供监督信号——比较式学习在一定程度上缓解了数据稀少时的过拟合，这解释了为什么低数据场景下 AUC 优化收益更大。
