  - generic [ref=f266e283]:
    - generic [ref=f266e284]: 读表要点
    - listitem [ref=f266e285]: ◈ 收益与数据稀缺度成正比——这条曲线的形状本身就是方法的价值主张：它是给「低资源/自定义关键词」场景准备的工具，不是给全数据刷 SOTA 的。
    - listitem [ref=f266e286]: ◈ 低误报工作点（FAR<0.1%）保持更高召回——排序质量的红利恰在用户容忍度最低的区域兑现，产品视角比平均 AUC 更有意义。
    - listitem [ref=f266e287]: ◈ 消融两条：batch size ↑ → 批内对更多 → AUC 估计更准 → 效果更好；合页间隔（默认 1）太小排序松、太大训练难。
    - listitem [ref=f266e288]: ◈ 证据边界：未与 ListNet/LambdaRank/RankNet 对比（成对合页是否最优形式未知）；未探索与量化/剪枝的交互（压缩后排序优势是否保持）；未做流式评估。
  - heading "§04 贡献" [level=2] [ref=f266e289]:
    - generic [ref=f266e290]: §04
    - text: 贡献
  - generic [ref=f266e291]: 四点：从视角转换到工程落地
  - generic [ref=f266e292]:
    - generic [ref=f266e293]:
      - generic [ref=f266e294]: "1"
      - paragraph [ref=f266e295]: 首次把 AUC 优化引入 KWS：分类损失优化准确率但不直接优化排序质量——AUC 优化填补这个空白，为 KWS 训练目标设计提供「直接优化部署体验指标」的新视角。
    - generic [ref=f266e296]:
      - generic [ref=f266e297]: "2"
      - paragraph [ref=f266e298]: 低数据场景的鲁棒性证据：10%/20% 数据下显著提升泛化（尤其误报控制）——为低资源语言 KWS 和快速定制新关键词提供有效方案。
    - generic [ref=f266e299]:
      - generic [ref=f266e300]: "3"
      - paragraph [ref=f266e301]: mini-batch 高效实现：全局 AUC 优化近似为 batch 内成对损失，标准 SGD 流程即可——无需改计算图，轻松集成现有流水线。
    - generic [ref=f266e302]:
      - generic [ref=f266e303]: "4"
      - paragraph [ref=f266e304]: 混合损失策略：CE 保准确率与收敛速度、AUC 管排序质量——解决纯 AUC 收敛慢的问题，是实用的训练配方。
  - heading "§05 局限与判断" [level=2] [ref=f266e305]:
    - generic [ref=f266e306]: §05
    - text: 局限与判断
  - generic [ref=f266e307]: 批内估计方差 · 多类扩展 · 超参敏感
  - generic [ref=f266e308]:
    - img [ref=f266e309]:
      - generic [ref=f266e311]: 边界与延伸
      - generic [ref=f266e313]: 技术边界
      - generic [ref=f266e314]: · 计算复杂度增加：batch 内算所有正负对，类别不平衡时成本显著上升；
      - generic [ref=f266e315]: 批内近似也引入估计方差——正样本少的 batch 估计不准
      - generic [ref=f266e316]: · 多类扩展难：原始 AUC 为二分类设计，35 类要做多次一对多的二分类
      - generic [ref=f266e317]: AUC 优化——训练复杂度上升（2022 跟进工作压到 O(K)）
      - generic [ref=f266e318]: · 超参敏感：α 最优值随数据量/任务而异——极低数据（如 1%）下可能
      - generic [ref=f266e319]: 与中等数据量完全不同
      - generic [ref=f266e320]: · 收敛速度：纯 AUC 损失慢于 CE（成对梯度不如逐样本直接），混合
      - generic [ref=f266e321]: 策略部分缓解
      - generic [ref=f266e323]: 实验边界 + 延伸
      - generic [ref=f266e324]: · 未在流式/持续监听场景评估——帧级 AUC 优化可能要特殊设计
      - generic [ref=f266e325]: · 自定义关键词分析有限：新词只有极少正样本，批内估计不可靠
      - generic [ref=f266e326]: · 未与其他排序损失（ListNet/LambdaRank/RankNet）对比
      - generic [ref=f266e327]: · 未探索与量化/剪枝的交互——压缩后排序优势是否保持未知
      - generic [ref=f266e328]: 延伸：多类 AUC（one-vs-rest / multiclass）降训练开销；与量化/剪枝
      - generic [ref=f266e329]: 结合并验证压缩后排序保持；多语言/噪声/非声调语言泛化；流式帧级
      - generic [ref=f266e330]: AUC 的特殊设计
      - generic [ref=f266e331]: 可迁移判断：直接优化部署时的实际指标（误报-召回权衡）而非代理指标（准确率），是提升用户体验的有效途径——这一思路适用于所有需要精细权衡精度与召回的语音任务
    - generic [ref=f266e332]: 图4 · 边界与延伸：左技术边界（成对计算成本、批内方差、多类 O(K²)、α 敏感、收敛慢），右实验边界（无流式、自定义词分析有限、无排序损失横比、无压缩交互）+ 延伸方向。
  - generic [ref=f266e333]:
    - generic [ref=f266e334]: 可迁移判断
    - paragraph [ref=f266e335]: ↳ 直接优化部署指标，别停在代理指标：准确率是训练方便的代理，部署体验取决于误报-召回权衡——凡是「阈值调来调去找体验」的系统，都值得问一句：训练目标对齐的是哪个指标？
    - paragraph [ref=f266e336]: ↳ 比较式学习是低数据的天然补丁：样本少时「关系」仍丰富——N 个样本有 O(N²) 对关系可供监督。成对损失的低数据红利揭示了这个通用机制，适用于任何稀缺标注场景。
    - paragraph [ref=f266e337]: ↳ 代理损失与目标损失混合是务实解：目标对齐的损失（AUC）往往收敛特性差，代理损失（CE）快但不对齐——α 混合各取所长；先问「哪个负责收敛、哪个负责对齐」再定配比。
    - paragraph [ref=f266e338]: ↳ batch 内估计的前提是类别均衡：任何依赖批内统计的损失（成对、对比、度量学习）都隐含「batch 里要有足够的各类样本」——采样策略是方法的一部分，不是训练脚本的细节。
