  - generic [ref=f295e237]:
    - generic [ref=f295e238]:
      - generic [ref=f295e239]: "1"
      - paragraph [ref=f295e240]: 交叉注意力用于 KWS 任务间信息共享：区别于底层共享的多任务——在高层解码器间细粒度交换，每个任务精确获取最相关的信息。
    - generic [ref=f295e241]:
      - generic [ref=f295e242]: "2"
      - paragraph [ref=f295e243]: 证明交叉注意力多任务提升 KWS：显著优于单任务与无交叉注意力的多任务——误报控制尤其突出。
    - generic [ref=f295e244]:
      - generic [ref=f295e245]: "3"
      - paragraph [ref=f295e246]: 揭示 VAD 与 KWS 的互补性：VAD 帮 KWS 拒非语音段，KWS 声学知识帮 VAD 判别——双向互利有实验证据。
    - generic [ref=f295e247]:
      - generic [ref=f295e248]: "4"
      - paragraph [ref=f295e249]: 有效的误报缓解策略：多任务推理用 VAD 判断作辅助信号——为 KWS 误报问题提供系统级方案而非单点技巧。
