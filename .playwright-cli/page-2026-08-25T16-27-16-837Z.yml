  - heading "§02 方法：跨分支检索 + 可控混入" [level=2] [ref=f295e92]:
    - generic [ref=f295e93]: §02
    - text: 方法：跨分支检索 + 可控混入
  - generic [ref=f295e94]: 交叉注意力的查询语义 · 门控的必要性
  - generic [ref=f295e95]:
    - generic [ref=f295e96]: "交叉: Attention(Q_KWS, K_VAD, V_VAD) # KWS 检索 VAD 的特征 Attention(Q_VAD, K_KWS, V_KWS) # VAD 检索 KWS 的特征（双向） 门控: out = g · cross_out + (1−g) · self_out # g 可学习 损失: L = α·L_KWS + β·L_VAD + γ·L_other"
    - generic [ref=f295e97]: 人话：交叉注意力的本质是「跨分支检索」——KWS 拿着自己的查询（我在找什么样的证据）去 VAD 的特征库里翻（那里有没有语音的存在证明）。检索回来的信息不直接替换原特征，而是经门控按需混入——门控是保险丝，防止无关信息污染主任务。
  - generic [ref=f295e98]:
    - generic [ref=f295e99]:
      - heading "门控与残差同构" [level=3] [ref=f295e100]
      - paragraph [ref=f295e101]: 门控融合在结构上就是加权残差：新通路（交叉注意力）的价值要在「可控混入」的前提下才能兑现——直接相加等于强迫每个样本都接受外来信息，噪声段的外来证据对 KWS 可能是有害的。
    - generic [ref=f295e102]:
      - heading "两个甜点都有先例" [level=3] [ref=f295e103]
      - paragraph [ref=f295e104]: 共享 4–6 层（太浅无红利、太深任务干扰）与交叉注意力插解码器中间层——与 LDF 的位置消融、注意力插入位置的结论第三次同构：中间层是信息交换的黄金窗口，这条规律在本系列至少四篇论文中独立出现。
