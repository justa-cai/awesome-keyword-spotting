- generic [ref=f295e2]:
  - generic [ref=f295e3]: 论文精读 · 可视化版 · 2021 №18
  - heading "误报砍三成的办法： 让 KWS 和 VAD 在解码器里互相对话" [level=1] [ref=f295e4]: 误报砍三成的办法：让 KWS 和 VAD 在解码器里互相对话
  - generic [ref=f295e5]:
    - generic [ref=f295e6]: Cross-Attention Multi-Task · Apple + 港中文
    - generic [ref=f295e7]: arXiv 2107.07634 · KWS + VAD 联合
    - generic [ref=f295e8]: 共享编码器 + 双向交叉注意力 + 门控融合
    - generic [ref=f295e9]: 误报 −20–30%（同召回）· 准确率 +1–2%
  - generic [ref=f295e10]: 一句话：KWS 部署的头号痛点是误报——用户日常对话里常有与唤醒词声学相似的片段。语音助手本来就同时需要 KWS 和 VAD，两个任务天然互补（VAD 帮 KWS 拒非语音段，KWS 的声学知识反哺 VAD），但传统多任务只在编码器底层共享特征——高层互补信息传不过去。本文在任务解码器之间加双向交叉注意力（各自的 Query 去检索对方的 K/V）+ 门控融合：误报率降 20–30%（同召回），准确率升 1–2%，交叉注意力本身再贡献 0.5–1%。
  - generic [ref=f295e11]:
    - generic [ref=f295e12]: TL;DR
    - listitem [ref=f295e13]: ◈ 核心矛盾：对目标词要极高灵敏度（低漏检），对非目标语音要极低误报——日常对话中与唤醒词声学相似的片段导致频繁误触发，这是单任务模型的结构性短板。
    - listitem [ref=f295e14]: ◈ 天然互补被浪费：语音助手同时需要 KWS（词出现吗）+ VAD（有语音吗）+ 设备导向检测（是对设备说的吗）——VAD 可帮 KWS 排除噪声/静音段的误报，KWS 的声学知识可帮 VAD 更准——但单任务模型各自为战。
    - listitem [ref=f295e15]: ◈ 简单共享不够：传统多任务只在编码器底层共享——高层解码器各走各路，任务间细粒度的互补信息（哪些帧有语音、哪些帧像词）传不过去。
    - listitem [ref=f295e16]: ◈ 交叉注意力：Attention(Q_A, K_B, V_B)——任务 A 用自己的查询去检索任务 B 的特征表示：KWS 从 VAD 特征里取「这里有没有语音」的证据，VAD 从 KWS 特征里取「像不像词」的声学证据。双向对称交换，两个任务互相受益。
    - listitem [ref=f295e17]: ◈ 门控融合必需：外来信息并非总有用——可学习的门控系数控制混入量（有用多混、无关压低）。消融：移除门控后交叉注意力收益明显减少。
    - listitem [ref=f295e18]: ◈ 三组件框架：共享编码器（CNN/Conformer，4–6 层甜点）→ 任务特定解码器 → 解码器中间层插双向交叉注意力。损失 L = α·L_KWS + β·L_VAD + γ·L_other。
    - listitem [ref=f295e19]: ◈ 结果（约值）：准确率 vs 单任务 +1–2%；同召回下误报 −20–30%（VAD 分支贡献最大）；交叉注意力在多任务框架上再 +0.5–1%；双向略优于单向；VAD 也从联合训练获益（略高于单独训练的 VAD）。
    - listitem [ref=f295e20]: ◈ 边界：交叉注意力增加参数与计算（推理开销未量化）；训练数据要同时有 KWS 与 VAD 标注；任务相关性低时有负迁移风险；内部数据为主复现性受限。
  - heading "§01 问题：误报与被浪费的互补" [level=2] [ref=f295e21]:
    - generic [ref=f295e22]: §01
    - text: 问题：误报与被浪费的互补
  - generic [ref=f295e23]: 单任务的结构短板 + 多任务的共享天花板
  - generic [ref=f295e24]:
    - generic [ref=f295e25]:
      - heading "误报是部署头号痛" [level=3] [ref=f295e26]
      - paragraph [ref=f295e27]: 用户对话中与唤醒词声学相似的片段、电视声、相似词——每条都是潜在误触发。误报直接伤用户信任（「它自己就醒了」），商用系统宁可牺牲召回也要压误报。
    - generic [ref=f295e28]:
      - heading "级联 VAD 的硬边界" [level=3] [ref=f295e29]
      - paragraph [ref=f295e30]: 传统做法是推理时级联一个 VAD 做前置过滤——硬门限、独立训练、错误不可逆。联合建模让「VAD 的判断」作为软证据进入 KWS 的判决过程，比外挂级联更可学。
    - generic [ref=f295e31]:
      - heading "任务关联的天然性" [level=3] [ref=f295e32]
      - paragraph [ref=f295e33]: KWS 要判断「是不是唤醒词」，VAD 要判断「是不是语音」——前者蕴含后者（唤醒词必是语音）：逻辑包含关系让两个任务的表示天然相关，联合训练有理论依据。
    - generic [ref=f295e34]:
      - heading "底层共享的信息瓶颈" [level=3] [ref=f295e35]
      - paragraph [ref=f295e36]: 共享编码器只在底层交换通用声学特征——任务特有的判别信息（VAD 的语音边界、KWS 的词形模式）在高层才形成，底层共享传不了这些——需要在解码器层建立第二条通路。
