  - generic [ref=f295e276]:
    - generic [ref=f295e277]: 可迁移判断
    - paragraph [ref=f295e278]: ↳ 多任务训、单任务部署：联合训练的价值在表示质量（互为免费的辅助监督），不必把整个多任务模型搬上端侧——蒸馏到单任务轻量模型就能保留大部分收益，部署复杂度不增。
    - paragraph [ref=f295e279]: ↳ 跨分支检索比底层共享传得更细：底层共享传「通用特征」，交叉注意力传「任务特有判别信息」——两个任务有逻辑包含关系（唤醒词 ⊂ 语音）时，后者是前者的必要补充。
    - paragraph [ref=f295e280]: ↳ 辅助任务的选择看相关性：VAD 与 KWS 高相关所以互利；任务相关性低时负迁移会出现——共享深度的甜点（4–6 层）正是干扰边界的量化。选辅助任务先问「它的输出是否蕴含我任务的先验」。
    - paragraph [ref=f295e281]: ↳ 新通路要配保险丝：交叉注意力、动态滤波、任何引入外部信息的模块都需要门控/残差式的可控混入——「无脑融合」的收益在消融里从来都不稳定。
