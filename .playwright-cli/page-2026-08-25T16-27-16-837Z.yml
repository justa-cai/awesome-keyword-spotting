    - listitem [ref=f295e231]: ◈ 误报收益主要来自多任务本身（−20–30%），交叉注意力主要是精度增量（+0.5–1%）——拆开看两个贡献源，工程上可按需取舍（预算紧时只做多任务）。
    - listitem [ref=f295e232]: ◈ 「VAD 也获益」值得注意：联合训练不是零和——KWS 的声学知识让 VAD 更准，说明两个任务的表示确实互补而非竞争（负迁移没有发生在任务相关性高的一对上）。
    - listitem [ref=f295e233]: ◈ 证据边界：内部数据为主（复现受限）、交叉注意力推理开销未量化、远场/噪声评估不充分、未探索 3+ 任务组合——绝对数字不可直接引用，相对量级可迁移。
