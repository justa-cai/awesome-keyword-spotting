- generic [ref=f185e2]:
  - generic [ref=f185e3]: 论文精读 · 可视化版 · 2022 №32
  - heading "换唤醒词，零训练零发版： 81 维嵌入装下开放词表" [level=1] [ref=f185e4]: 换唤醒词，零训练零发版：81 维嵌入装下开放词表
  - generic [ref=f185e5]:
    - generic [ref=f185e6]: QbyE-MLPMixer · LG Toronto AI Lab · arXiv 2206.13231
    - generic [ref=f185e7]: 纯 MLP · 免 patch · Hardswish
    - generic [ref=f185e8]: 0.25M 参数 · 20.16M MACs 双全场最小
    - generic [ref=f185e9]: Hey-Snips + 内部 8 家电词（400 说话人）
  - generic [ref=f185e10]: 智能家电的唤醒词出厂即固定——"Hey LG"之外的词，厂商要重采数据、重训模型、重发版本，链路以周计。QbyE-MLPMixer 让用户用自己的说法注册唤醒词：注册只是几次前向编码，推理退化为一次余弦距离比较，全程零解码零重训。
  - generic [ref=f185e11]:
    - heading "一分钟版本" [level=3] [ref=f185e12]
    - listitem [ref=f185e13]: 任务：开放词表 KWS——用户自定义唤醒词；旧范式换词 = 重采 + 重训 + 发版，本文换词 = 念 3 遍注册，零训练零发版
    - listitem [ref=f185e14]: 范式：QbyE（Query-by-Example）——变长音频编码成定长嵌入，同词相近、异词相远；推理只是注册嵌入与查询嵌入的距离比较，无解码 / 无注意力 / 无递归
    - listitem [ref=f185e15]: 架构：MLPMixer 音频化三改动——① 免 patch 直接喂 81×81 MFCC（MFCC 已是压缩时频特征，patch 化是视觉的负资产）② 混合轴从 token/通道改为特征/时间（单通道时频输入真正有物理意义的两个轴）③ 时间维平均池化出 81 维嵌入（词位置随机 → 平均天然平移不变）
    - listitem [ref=f185e16]: 公式：U = X + W₂σ(W₁·LN(X))（特征维）、Y = (U + W₄σ(W₃·LN(Uᵀ)))ᵀ（时间维）同构交替堆 12 块；块输出形状恒等 → 真超参只有 4 个（h, g, 块数, 激活），ASHA 数百次搜索定隐宽 64
    - listitem [ref=f185e17]: 激活：Hardswish 全面优于 GELU/ReLU/SiLU，且分段线性不含指数——硬件更容易实现
    - listitem [ref=f185e18]: 推理：1 秒窗 / 100ms 步滑窗（每秒 10 次前向）；注册短 → 对查询做卷积取最小距离（模板滑移对齐）；余弦距离只看方向，对响度漂移免疫
    - listitem [ref=f185e19]: 训练：LibriSpeech 1000h 词级切分 + 4–12dB 噪声 + 50% 远场仿真增广；训练词表与评测词零重叠——纯零样本评测
    - listitem [ref=f185e20]: 尺寸：0.25M 参数 + 20.16M MACs 双全场最小（参数 = 最小基线的 45%，MACs = 91%）；嵌入 81 维 vs 基线约 1000 维
    - listitem [ref=f185e21]: 主结果：Hey-Snips 六场景 FRR@0.3FA/h——条件越苦优势越大（领先次优 2.15 → 8.57 点单调放大）；远场 10dB 的 7.50 几乎只有次优（13.93）的一半
    - listitem [ref=f185e22]: 诚实边界：干净近场不是最优（内部集 2.68 vs MobileNetV3 0.62）；优势场景被作者自己清晰限定在噪声与远场
  - heading "§01 问题：唤醒词的出厂锁定" [level=2] [ref=f185e23]:
    - generic [ref=f185e24]: §01
    - text: 问题：唤醒词的出厂锁定
  - generic [ref=f185e25]: 为什么"开放词表"是个真需求，而不是锦上添花
  - generic [ref=f185e26]:
    - generic [ref=f185e27]:
      - heading "固定词表的成本结构旧范式" [level=4] [ref=f185e28]
      - paragraph [ref=f185e29]: 智能音箱、家电的唤醒词出厂即固定。要换一个词，厂商需要重新采集数据、重新训练模型、重新发版，整条链路以周计。对厂商是成本，对普通用户是完全关闭的选项——你只能用它选好的那个词。
    - generic [ref=f185e30]:
      - heading "ASR 转录匹配路线的两硬伤被否路线" [level=4] [ref=f185e31]
      - paragraph [ref=f185e32]: 一个直觉方案是跑完整 ASR 再匹配关键词。硬伤一：完整解码与 KWS「常驻低功耗」的定位冲突；硬伤二：关键词落在 ASR 词表外立刻退化——而词表外恰是开放词表的典型用例，路线自相矛盾。
    - generic [ref=f185e33]:
      - heading "QbyE 范式：嵌入检索代替判决" [level=4] [ref=f185e34]
      - paragraph [ref=f185e35]: 变长音频 → 定长嵌入，训练目标是同词相近、异词相远。推理退化为：查询嵌入 vs n 个注册嵌入的距离比较，距离小于阈值即触发。注册新词 = 念几遍做前向编码，零训练、零发版。
    - generic [ref=f185e36]:
      - heading "真正的挑战：分布外 + 资源紧" [level=4] [ref=f185e37]
      - paragraph [ref=f185e38]: 注册与查询音频天然落在训练分布之外（训练词表不可能覆盖所有未来词）——模型不能靠记住特定词的判决面过关，必须学出通用的词级音频表征；同时端侧要求低延迟、小内存，编码器必须又小又快。
