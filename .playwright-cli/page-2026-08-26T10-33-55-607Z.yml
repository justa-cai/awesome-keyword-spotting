  - generic [ref=f185e377]: MLPMixer 正式进入 QbyE 开放词表 KWS
  - generic [ref=f185e378]:
    - generic [ref=f185e379]:
      - generic [ref=f185e380]: "1"
      - paragraph [ref=f185e381]: 纯 MLP 骨干进入 QbyE KWS：证明 MLPMixer 可作为 CNN/RNN/ViT 之外的现实选项，且在小模型区间（<0.3M）是帕累托最优。
    - generic [ref=f185e382]:
      - generic [ref=f185e383]: "2"
      - paragraph [ref=f185e384]: 一套有消融背书的音频适配：免 patch、特征/时间双维混合、Hardswish、时间平均池化——其中输入表示（Table 4）与激活函数（Table 5）两项均有六场景消融，不是拍脑袋。
    - generic [ref=f185e385]:
      - generic [ref=f185e386]: "3"
      - paragraph [ref=f185e387]: 双全场最小下的 SOTA 精度：0.25M / 20.16M 双最小开销下，Hey-Snips 与 400 人内部集超 CNN/RNN 基线，困难条件领先 2.15–8.57 点。
    - generic [ref=f185e388]:
      - generic [ref=f185e389]: "4"
      - paragraph [ref=f185e390]: 81 维超小嵌入：比基线（约 1000 维）小一个数量级——注册存储与检索开销线性缩小，对说话人验证、新颖性检测等 QbyE 应用有外溢潜力。
    - generic [ref=f185e391]:
      - generic [ref=f185e392]: "5"
      - paragraph [ref=f185e393]: 实用长度不齐处理：短注册对查询做卷积取最小距离（模板滑移对齐）、长注册零填充、流式预开缓冲——工程上把 QbyE 检索做成了可流式部署的形态。
  - heading "§05 局限与边界" [level=2] [ref=f185e394]:
    - generic [ref=f185e395]: §05
    - text: 局限与边界
  - generic [ref=f185e396]: 优势场景被作者自己划清：噪声与远场；干净近场仍是 CNN/RNN 的阵地
  - generic [ref=f185e397]:
    - generic [ref=f185e398]:
      - heading "干净近场非最优" [level=4] [ref=f185e399]
      - paragraph [ref=f185e400]: 内部集干净非远场：MobileNetV3 0.62 最好，本文 2.68 落后（连 GRU-ATTN 0.81 都不如）；10dB 也只 3.71 vs 3.69 持平。纯 MLP 的容量优势要在条件恶化时才兑现。
    - generic [ref=f185e401]:
      - heading "1 秒固定窗口假设" [level=4] [ref=f185e402]
      - paragraph [ref=f185e403]: 架构围绕 81×81 方阵设计；更长多词短语（如两句口号）未报告。嵌入级卷积对齐只允许平移这一种形变，没和可微分 DTW / 局部注意力这类更精细的对齐方案比较。
    - generic [ref=f185e404]:
      - heading "平均池化抹掉时序" [level=4] [ref=f185e405]
      - paragraph [ref=f185e406]: 81 帧直接平均，音素顺序与节奏不进嵌入——理论上音近词对（发音相同顺序不同）的区分上限受限，论文未做误接受词对分析来验证这个隐忧。
    - generic [ref=f185e407]:
      - heading "单一全局阈值 + 维度未消融" [level=4] [ref=f185e408]
      - paragraph [ref=f185e409]: 所有说话人 / 信道共用一个触发阈值，无自适应机制；嵌入维度 81 恰好等于特征维更像设计巧合，未做维度扫描实验。
    - generic [ref=f185e410]:
      - heading "评测规模小" [level=4] [ref=f185e411]
      - paragraph [ref=f185e412]: Hey-Snips 筛至 40 人 × 7 条查询——每场景约 280 条正例，1 条话语 ≈ 0.36 个 FRR 点；无置信区间 / 显著性检验，2 点以内的差距要谨慎读。
    - generic [ref=f185e413]:
      - heading "失真全仿真 + 单语种朗读" [level=4] [ref=f185e414]
      - paragraph [ref=f185e415]: 远场与噪声全部来自仿真（无真实房间 / 回声设备验证）；训练只有英文朗读有声书——口语化、多语种场景未覆盖。
    - generic [ref=f185e416]:
      - heading "无端侧实测" [level=4] [ref=f185e417]
      - paragraph [ref=f185e418]: 只有参数 / MACs 代理指标——真实时延、实时率、内存峰值、功耗、100ms 滑窗的延迟分布均未上板验证。
    - generic [ref=f185e419]:
      - heading "公平性存疑 + 注册协议单一" [level=4] [ref=f185e420]
      - paragraph [ref=f185e421]: 本文 ASHA 搜了数百次，基线调参预算未报，视觉基线还带着 ImageNet 预训练（资源不对等）；固定 3 注册 / 7 查询协议，无 one-shot 注册曲线、无跨说话人注册评估。
  - generic [ref=f185e422]:
    - heading "可迁移判断" [level=4] [ref=f185e423]
    - paragraph [ref=f185e424]: ↳ 视觉架构的输入惯例对音频不是中性操作——patch 化在图像是有效归纳偏置，在 MFCC 上是负资产。迁移骨干时逐个审问每个组件的角色，小改动（换激活）的收益可以和结构改动同量级。
    - paragraph [ref=f185e425]: ↳ 表征学习与触发决策解耦是个性化的通用蓝图——训练用海量无关词塑形嵌入空间，部署时注册新词只是几次前向编码。这套路子可直接外溢到说话人验证、新颖性检测。
    - paragraph [ref=f185e426]: ↳ 余弦 over 欧氏：说话人差异和增益变化主要漂移模长、不漂移方向——度量选择本身就是一种归一化，比在特征端做归一化更稳。
    - paragraph [ref=f185e427]: ↳ 把指标钉在产品代价不对称处：误唤醒的信任代价远高于漏唤醒，先钉死 0.3 FA/h 再比 FRR——评测算什么，模型就优化什么。
