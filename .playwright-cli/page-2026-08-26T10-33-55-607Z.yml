  - heading "§02 方法：MLPMixer 的音频化改造" [level=2] [ref=f185e117]:
    - generic [ref=f185e118]: §02
    - text: 方法：MLPMixer 的音频化改造
  - generic [ref=f185e119]: 不是拿来就用——三个「去视觉化」决策各有消融背书
  - generic [ref=f185e120]:
    - generic [ref=f185e121]: "特征混合（公式 1）：U = X + W₂ σ(W₁ · LayerNorm(X)) W₁ ∈ ℝ^{h×f}, W₂ ∈ ℝ^{f×h}"
    - generic [ref=f185e122]: "时间混合（公式 2）：Y = (U + W₄ σ(W₃ · LayerNorm(Uᵀ)))ᵀ W₃ ∈ ℝ^{g×t}, W₄ ∈ ℝ^{t×g}"
    - generic [ref=f185e123]: "时间维平均池化（公式 3）：z = (1/t) Σᵢ O_{:,i} → z ∈ ℝ⁸¹"
    - generic [ref=f185e124]: 人话：公式 1 在每一帧内部重组 81 维频谱（这帧像什么音色）；公式 2 在每个频点上重组 81 帧历史（这个频率成分怎么随时间变化）——两个式子完全同构，只换操作的轴。每块都带 LayerNorm + 残差，输出形状恒等于输入，所以可以自由堆叠，真超参只有 4 个（h, g, 块数 n, 激活 σ）。最后公式 3 对时间平均：词在 1 秒窗内位置随机，平均把位置信息抹掉、只留词身份——顺带把嵌入压到 81 维。
  - generic [ref=f185e125]:
    - generic [ref=f185e126]:
      - heading "免 patch：直接喂 81×81" [level=4] [ref=f185e127]
      - paragraph [ref=f185e128]: 视觉 MLPMixer 要把图像切块成 token。音频这里 1 秒音频（25ms 窗 / 12.5ms 移）恰好产生 81 帧 × 81 维 MFCC 的方阵——MFCC 本身已是压缩后的时频特征，信息量就这么多。强行 9×9 patch 化反而把跨 patch 交互推到深层去补，额外多付 7K 参数 + 500K MACs，六场景消融（Table 4）直接证伪：直接输入相对 with PE 错误率低 40%。
    - generic [ref=f185e129]:
      - heading "混合轴：特征 × 时间" [level=4] [ref=f185e130]
      - paragraph [ref=f185e131]: 视觉里 token-mixing / channel-mixing 对应图像的两个轴；音频单通道输入没有"通道"概念，本文改成特征维（每一帧的频谱形状）× 时间维（每个频点的历史）——这是时频表示真正有物理意义的两个轴，也是 MFCC 方阵天然的两个维度。
    - generic [ref=f185e132]:
      - heading "Hardswish 激活" [level=4] [ref=f185e133]
      - paragraph [ref=f185e134]: 原版 MLPMixer 用 GELU。本文六场景消融（Table 5）里 Hardswish 全面最优，且它是分段线性函数、不含指数和 sigmoid——硬件实现指令更少。每秒 10 次滑窗前向会把激活开销放大 10 倍，这个选择在端侧不是小事。
    - generic [ref=f185e135]:
      - heading "ASHA 搜出来的极简配置" [level=4] [ref=f185e136]
      - paragraph [ref=f185e137]: 异步超参搜索（ASHA）数百次试验后收敛到：12 个混合块、隐宽 64、无 dropout。搜索目标很明确——参数和 MACs 都要比所有基线的单项冠军还小。最终 0.25M 参数 / 20.16M MACs，双全场最小。
