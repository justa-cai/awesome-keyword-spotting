          - heading "实验设计不足" [level=4] [ref=f87e275]
          - list [ref=f87e276]:
            - listitem [ref=f87e277]: 内部数据不可复现：四关键词众包集不公开，未在 GSC 等公开基准验证泛化。
            - listitem [ref=f87e278]: 无统计稳健性：10 epoch、无随机种子数量与方差——clean 0.1 档 0.3 点量级差距的显著性存疑。
            - listitem [ref=f87e279]: 基线只有 LiCo-Net 一族：无 TC-ResNet / MatchboxNet / BC-ResNet 横向对比——增益搬到更强骨干还剩多少无法回答。
            - listitem [ref=f87e280]: 噪声单一：只有一种 SNR 分布（12.5dB 中心），无分频段 / 分噪声类型 / 远场混响；DET 曲线只展示四个关键词中的两个；FA/h>1.0 宽松档未测。
      - generic [ref=f87e281]: 两道门槛 + 值得追的方向：硬件量化与可解释性变现，决定 KAN 在 KWS 里是「论文级 curios」还是「工程级选项」。具体：① 配方迁移到其他语音任务（ASR / 声学事件检测）与其他模态，验证位置规律普适性；② 基函数族（Gram / B 样条 / 径向基）× 阶数（2-6）系统消融，找精度-参数的最优曲线容量；③ 剪枝 / 蒸馏压 KAN 参数密度，挽救 100K 以下档位；④ DSP / Cortex-M 上实测曲线求值时延与能耗；⑤ 用可学习激活做唤醒词定制或子词级错误分析；⑥ 公开基准 + 多语言 + 远场多噪声重跑补显著性；⑦ 子词级归因（KAN 到底改善了 ture 还是 a 这类子词的判别）——既验证「高级特征建模」解释，也可能反过来指导关键词选取。
