      - generic [ref=f87e24]:
        - heading "一分钟版本" [level=2] [ref=f87e25]
        - list [ref=f87e26]:
          - listitem [ref=f87e27]: 问题空间：端侧 KWS 的架构创新史是一部「单位参数表达力」压榨史——但 CNN/RNN/注意力三大家族的原子构件全是 MLP（可学习线性层 + 固定激活），十年只改「怎么连接」，从没改过「连接本身是什么」。2024 年的 KAN（权重从数字变成小曲线）恰好动了这个原子件——但「KAN or MLP」公论是参数对齐时 KAN 多数任务更差。语音没人回答过。
          - listitem [ref=f87e28]: 朴素替换的下场：KAN 每神经元 O(d) 倍参数，同参数预算下通道宽度必崩——LiCo-Net 的 w=72 全换 KAN 后只剩 34（砍半以上）。实测：换空间卷积（低级位）全档位更差、全换更差、换逐点卷积（高级位）最多打平。替换路线整体排除。
          - listitem [ref=f87e29]: 附加式的甜点：保留 MLP 宽度、在逐点卷积旁插一层 GKAN——GKAN post（插在逐点卷积之后）以几乎同参数（396K 对 394K）四档 FRR 全降 11-16%，加噪下 −11~−17%，200K 档仍赚 15%；GKAN mid（并联）0.1 档恶化 63%——集成方式比用不用更重要。
          - listitem [ref=f87e30]: 归因闭合：给基线也加一层普通 Conv1D（MLP post，结构完全对齐）——加层本身自带增益，但结构对齐后 KAN 版仍再赢一截 → 增益确实来自可学习激活。这个消融设计是「加新模块该怎么验证」的方法论模板。
          - listitem [ref=f87e31]: 失败边界：低级位置必败、并联严重翻车、100K 参数以下反噬（0.1 档 +13%）——宽度被压到 30 时表达容量损失超过曲线收益。收益区间锁定 ~200K 以上。
          - listitem [ref=f87e32]: 成色缺口：零延迟 / FLOPs / 内存数字（KWS 每秒跑 100 帧，多项式求值 vs 一次乘法的硬件代价未答）；KAN 招牌的可解释性完全没兑现；内部数据不可复现、无外部 SOTA 横向对比、无多种子方差。
    - generic [ref=f87e33]:
      - paragraph [ref=f87e34]: §01 · 问题陈述
      - heading "准快省三角下，「同样预算你多换来了什么」是必答题" [level=2] [ref=f87e35]
      - generic [ref=f87e37]: 四个认知空白：① 通道宽度崩塌——KAN 每神经元 O(d) 倍参数，KWS 参数预算极敏感，同参数换 KAN 必须把 w 从 72 砍到 34-52，通道宽度直接决定表达容量；② 插入位置无先验——浅层做帧级局部声学（低级）、深层做子词判别（高级），KAN 的曲线拟合在两种岗位上表现可能完全不同，此前 KAN 文献（医学分割 / 时序预测）都整体替换了事、从没把「位置」当变量消融；③ 结构性混淆——加一层 KAN 同时改变深度、参数量、激活类型三件事，不结构对齐就无法归因；④ 语音空白——论文自称最早用 KAN 做语音处理的探索之一。
