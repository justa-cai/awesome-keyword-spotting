      - heading "三段论消融：替换定位高级位 → 附加找到 post → 结构对齐完成归因" [level=2] [ref=f87e90]
      - generic [ref=f87e92]: 数据与协议：四个英文关键词（take a picture / volume up / volume down / play music），众包去标识，说话人独立切分（同一人语音不跨集——否则 FRR 严重虚低，模型等于提前「背过」音色）；训练正例 15-25K 条/词、14,957 说话人，评测 4-6K 条/词、3,801 说话人，平均 2.5s；负例取 LibriSpeech 不含关键词语音（train-clean-360 + train-other-500 训练 / clean-100 + dev/test 评测）。指标：四个误报工作点 FA/h = 0.1/0.2/0.5/1.0 下的 FRR——0.1 档 = 平均十小时一次误唤醒（产品最苛刻档）；报四档而非汇总数，因为真实产品只选一个工作点部署、汇总指标会掩盖局部交叉（Table IV 的 100K 档真出现了交叉）。训练：8 卡、batch 400、Adam、10 epoch；子词标签由预训练声学模型强制对齐；类权重 SIL/FILLER/子词 = 1/2/8（子词帧少但决定漏报）。
