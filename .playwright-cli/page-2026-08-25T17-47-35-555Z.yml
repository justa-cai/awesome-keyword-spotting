  - generic [ref=f311e339]:
    - generic [ref=f311e340]: 可迁移判断
    - paragraph [ref=f311e341]: ↳ 数据越稀缺，通用表示越值钱：10% 数据下 +8 个点 vs 全数据 +2 个点——预训练的价值与数据缺口成正比。决定要不要上预训练，先看自己的标注预算处于曲线哪一端。
    - paragraph [ref=f311e342]: ↳ 全微调是低数据的陷阱：可训参数的暴露面要与样本量匹配——冻骨干调顶层是默认安全档，数据充足才逐步放开。这条对任何大预训练模型的下游迁移都成立。
    - paragraph [ref=f311e343]: ↳ 层的判别力有物理梯度：底层声学/中层音素/高层语义——按任务的判别粒度选层（或拼接），比无差别用最后一层更划算；判别力峰在中层是「词形任务」的通用信号。
    - paragraph [ref=f311e344]: ↳ 准确率收益要对着代价读：+2 个点的准确率若换来 10 倍延迟与两个数量级的体积，部署上可能得不偿失——系统研究论文给出的「怎么做最好」之外，工程师还要自己算「值不值得做」。
