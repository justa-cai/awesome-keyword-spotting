  - generic [ref=f311e286]:
    - generic [ref=f311e287]: 读表要点
    - listitem [ref=f311e288]: ◈ 「低数据优势放大」的机理：MFCC + 从头训要用数据学「什么是语音的判别结构」——这部分预训练已用 960 小时学过；剩余要学的只有「这个词长什么样」——10% 数据够。数据越少，预训练垫底的部分占比越大。
    - listitem [ref=f311e289]: ◈ HuBERT ≈ wav2vec 2.0 的含义：对比学习与掩码预测两种自监督目标对 KWS 迁移差异不大——选预训练模型不必纠结目标函数，规模与数据覆盖更重要。
    - listitem [ref=f311e290]: ◈ 证据边界：无蒸馏实验（预训练优势进端侧的桥）、无延迟详析、无噪声/远场/自定义词评估、未与小型预训练模型对比——准确率收益的「代价是否值得」这道题没算完。
