  - generic [ref=f311e23]: 系统研究而非新架构
  - generic [ref=f311e24]:
    - generic [ref=f311e25]:
      - heading "两个数量级的体积鸿沟" [level=3] [ref=f311e26]
      - paragraph [ref=f311e27]: 预训练模型 95M–317M 参数，KWS 端侧预算 <1M——直接部署不现实。本文的立场是先把「迁移效果与怎么做」分析清楚，部署问题（蒸馏/压缩）留给后续。
    - generic [ref=f311e28]:
      - heading "微调策略是工程黑箱" [level=3] [ref=f311e29]
      - paragraph [ref=f311e30]: 全冻结省事但适配浅；全微调适配深但低数据下过拟合 + 灾难性遗忘双重风险——「冻多少层」此前靠经验，本文用数据量 × 策略的矩阵给出答案。
    - generic [ref=f311e31]:
      - heading "层的物理意义分层" [level=3] [ref=f311e32]
      - paragraph [ref=f311e33]: 预训练 Transformer 的层有清晰的语义梯度：底层接近信号处理（频谱/能量），中层是音素级判别信息，高层偏语义——KWS 作为「词形判别」任务理论上最该吃中层，实验验证了这一直觉。
    - generic [ref=f311e34]:
      - heading "在系列中的坐标" [level=3] [ref=f311e35]
      - paragraph [ref=f311e36]: 本页是「预训练表示 → KWS」路线的独立评估；XLSR few-shot（№13）做多语言版本；SSL 多任务（№19）做统一框架版；DKU 系统（№25）把迁移当 NAS 流程的一环——四篇共同确立「预训练+微调」为低资源 KWS 的默认范式。
