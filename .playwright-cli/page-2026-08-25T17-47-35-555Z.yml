  - generic [ref=f311e116]: 实验矩阵的设计与读法
  - generic [ref=f311e117]:
    - generic [ref=f311e118]: "模型: wav2vec 2.0 Base(95M·12层·768d) / Large(317M·24层·1024d) / HuBERT 对照: MFCC-40d · FBank-80d · 随机初始化 策略: FE(全冻) · FT(全调) · 顶层微调(冻 8–9 调 3–4 ★) · 渐进解冻 · 层拼接(L4+L8) 头: GAP+FC · MLP(256) · 注意力池化 数据: GSC v2 的 10% / 20% / 50% / 100%"
    - generic [ref=f311e119]: 人话：实验矩阵把三个维度全部交叉——哪个模型、冻多少层、多少数据。结论浓缩成两句话：顶层微调全场景稳赢；判别力峰在中层。工程师拿到就能直接配：数据少就冻骨干调顶层 + 拼接中层特征。
  - generic [ref=f311e120]:
    - generic [ref=f311e121]:
      - heading "全微调为何在低数据翻车" [level=3] [ref=f311e122]
      - paragraph [ref=f311e123]: <20% 数据下全微调的准确率甚至低于全冻结——用几千个样本去调 95M 参数：过拟合吃掉适配收益，还可能冲掉预训练知识（灾难性遗忘）。顶层微调只暴露 3–4 层 + 头，可训参数压到与数据量匹配——「暴露面与样本量成正比」的普适原则。
    - generic [ref=f311e124]:
      - heading "层拼接的性价比" [level=3] [ref=f311e125]
      - paragraph [ref=f311e126]: 拼接第 4 层与第 8 层白拿 0.5–1%——底层的声学细节与高层的音素序列在 KWS 里都有用，单层取用是信息浪费。代价只是特征维度翻倍，远小于换更大的模型。
