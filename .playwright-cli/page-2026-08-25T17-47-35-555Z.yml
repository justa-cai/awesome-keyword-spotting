  - generic [ref=f311e3]: 论文精读 · 可视化版 · 2021 №26
  - heading "wav2vec 搬进 KWS 的系统作业： 冻多少层、用哪一层，数据说了算" [level=1] [ref=f311e4]: wav2vec 搬进 KWS 的系统作业：冻多少层、用哪一层，数据说了算
  - generic [ref=f311e5]:
    - generic [ref=f311e6]: Wav2KWS · 龚密国立科技大学（KIT）
    - generic [ref=f311e7]: IEEE 期刊 2021 · 系统性研究论文
    - generic [ref=f311e8]: wav2vec 2.0 Base/Large · HuBERT × 五种微调策略
    - generic [ref=f311e9]: 全数据 +1.5–2.5% · 10% 数据 +8% · 未见说话人退化减半
  - generic [ref=f311e10]: 一句话：wav2vec 2.0 / HuBERT 的通用语音表示已在 ASR 等任务证明迁移力——搬到 KWS 该怎么迁？本文不提新架构，把「预训练模型 × 微调策略 × 层选择」的实验矩阵做全：顶层微调（冻结底 8–9 层、只调顶 3–4 层）在所有数据量下最佳；中层特征（6–8 层，音素级）对 KWS 贡献最大，拼接第 4+8 层再白拿 0.5–1%。全数据下比 MFCC 基线高 1.5–2.5 个点，10% 数据下优势放大到 8 个点——低资源才是迁移的主场。代价：95M–317M 的模型体积与 10 倍特征提取延迟，端侧部署问题本文未解。
  - generic [ref=f311e11]:
    - generic [ref=f311e12]: TL;DR
    - listitem [ref=f311e13]: ◈ 四个迁移问题：模型规模不匹配（95M–317M vs 端侧 <1M）；微调策略不确定（FE/FT/顶层/渐进/拼接）；层的选择（底层声学/中层音素/高层语义——KWS 要哪层）；预训练模型选择（wav2vec 2.0 对比学习 vs HuBERT 掩码预测）。
    - listitem [ref=f311e14]: ◈ 五种微调策略的系统比较：顶层微调（冻结底 8–9 层、调顶 3–4 层）在所有数据量下均最佳——本文的核心可操作结论。FE 全冻结差 1–2% 但快 10 倍；FT 全微调在 <20% 数据下过拟合甚至低于 FE；渐进解冻与顶层接近但更慢。
    - listitem [ref=f311e15]: ◈ 层贡献地图：底层 1–4（频谱包络/基频，≈MFCC 级，判别性弱）< 中层 5–8（音素级模式——KWS 贡献最大） < 高层 9–12（语义，助复杂关键词）。拼接第 4 层+第 8 层（声学+语义双取）比单层 +0.5–1%。
    - listitem [ref=f311e16]: ◈ 预训练模型对比：HuBERT ≈ wav2vec 2.0（97% vs 96.5–97%）；Large 97.5% 但 317M 不可部署——两种自监督目标对 KWS 迁移差异不大，规模有收益但边际递减。
    - listitem [ref=f311e17]: ◈ 数据量决定收益：100% 数据下 +1.5–2.5%（小胜）；10% 数据下 +8 个点（82–85% → 90–92%）——低数据性能差距从 15% 缩到 5%。数据越稀缺，通用表示越值钱。
    - listitem [ref=f311e18]: ◈ 跨说话人泛化：未见说话人退化 ~2%（MFCC 基线 ~5%）——预训练特征更「说话人无关」；预训练见过海量说话人，学到的判别线索自然跨人稳定。
    - listitem [ref=f311e19]: ◈ 分类头的意外发现：简单 GAP+FC 已不错、注意力池化 +0.5%、3 层深头无增益——瓶颈不在头而在特征适配；重活已被预训练干完。
    - listitem [ref=f311e20]: ◈ 代价（本文未解）：95M–317M 体积塞不进 <1M 预算；特征提取延迟可能 +10 倍；微调的 lr 敏感（过大遗忘/过小欠适配）；LibriSpeech 朗读式预训练与 KWS 真实嘈杂远场有域差。蒸馏是缺失的关键一步。
