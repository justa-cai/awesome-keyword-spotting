  - generic [ref=f76e73]:
    - heading "2 机制：瓶颈层借常识，DTW 造标签，CNN 提速度" [level=2] [ref=f76e74]:
      - generic [ref=f76e75]: "2"
      - text: 机制：瓶颈层借常识，DTW 造标签，CNN 提速度
    - generic [ref=f76e76]:
      - generic [ref=f76e77]:
        - heading "多语言 BNF 提取器" [level=3] [ref=f76e78]
        - text: 10 语言混合训练 DNN 做音素分类，瓶颈层压到 42 维——只留跨语言通用的语音判别信息，训练完掐掉输出层即得特征。
      - generic [ref=f76e79]:
        - heading "DTW 伪标签" [level=3] [ref=f76e80]
        - text: 少量参考模板与海量未标注音频算 DTW 距离，距离当软标签——粗糙、含噪，但提供了足够的监督信号。
      - generic [ref=f76e81]:
        - heading "CNN 检测器" [level=3] [ref=f76e82]
        - text: 输入 BNF（不是 MFCC），以 DTW 距离为目标回归训练——前向固定复杂度，扫档案速度与音频长度线性。
      - generic [ref=f76e83]:
        - heading "分工逻辑" [level=3] [ref=f76e84]
        - text: DTW 出监督（不依赖标注），CNN 出速度（可大规模部署）——两者互补，缺一不可。
