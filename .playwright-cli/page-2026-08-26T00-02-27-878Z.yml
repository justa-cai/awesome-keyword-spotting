    - generic [ref=f76e245]:
      - generic [ref=f76e246]: JUDGEMENT
      - paragraph [ref=f76e247]: ↳ 低资源的第一杠杆是借别人的资源：多语言瓶颈特征证明「语音常识」可跨语言迁移——今天 wav2vec/XLSR 多语言预训练成为低资源 KWS 默认起手式，正是这条线的延长。
      - paragraph [ref=f76e248]: ↳ 弱监督的正确姿势是「慢而准的老师教快而快的学生」：DTW 出标签、CNN 出速度——当标注贵而算力便宜时，用可复现的旧方法造伪标签、让深度网络蒸馏它，是通用套路。
      - paragraph [ref=f76e249]: ↳ 零资源方法必须在真零资源上评估：本文在英语上验证留了口子——「面向 X 的方法在非 X 上验证」是低资源领域的常见方法论缺口，读这类论文要先看评估语言。
