      - generic [ref=f76e137]: D_DTW(template, audio) → soft label CNN(BNF(audio)) ≈ D_DTW 复杂度 O(N×M) → O(N)
      - generic [ref=f76e138]: 人话：先用笨办法（DTW 逐段对齐）给海量音频打「像不像关键词」的分，再让 CNN 学会秒算这个分。训练完 CNN 就把 DTW 的判断力继承下来，速度却快了一个量级——老师慢而准，学生快而会。
