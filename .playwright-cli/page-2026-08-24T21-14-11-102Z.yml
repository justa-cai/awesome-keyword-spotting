      - generic [ref=f144e120]: 数据与协议：预训练 King-ASR-066（域外）；评测 GSC V2 35 词（10 Seen / 25 Unseen 划分——正负样本比约 1:31~1:43 的不平衡检测）。小样本 5/10/15-shot 三档，每词随机抽样独立训练；batch 256 = 128 目标 + 96 非目标 + 32 噪声；官方验证 / 测试集用合成 RIR 卷积 + MUSAN 噪声（SNR 5–25dB）扩 4 倍——模拟真实场景。每条件随机重采样 5 次取平均；消融只在 15-shot × 10 词上做（表 III 的 87.22 与表 IV 的 90.38 关键词集不同，不能直接互比）。指标 AP（不平衡任务全阈值综合质量）+ EER（误报漏报平衡点）。
