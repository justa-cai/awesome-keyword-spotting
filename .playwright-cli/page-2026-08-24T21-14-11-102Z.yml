      - generic [ref=f144e24]:
        - heading "一分钟版本" [level=2] [ref=f144e25]
        - list [ref=f144e26]:
          - listitem [ref=f144e27]: 天然矛盾：柔性 KWS 为覆盖无限关键词把容量花在通用判别上，单词性能追不上逐词海量数据训练的专用模型——而用户体验恰恰取决于他自己那一个词。最需要数据的词，恰恰是拿不到数据的词。问题转化为：能否用极少量（本文 5 条）语音把预训练 TF-KWS 模型适配成关键词专属模型。
          - listitem [ref=f144e28]: 立论的反直觉数据：15-shot 全参数微调（2.21M 可调参数）AP 只有 67.04%，反而低于不做微调的 72.02%——样本远不足以约束参数，破坏预训练通用表征（过拟合 + 灾难性遗忘）；只学新分类器（0.5K 参数）更崩到 50.14%——预训练 DML 学到的 TE 本身已是高质量原型，从零学是巨大浪费。核心矛盾不是「要不要动模型」而是「动多少、动哪里」。
          - listitem [ref=f144e29]: 三组件分工：TCFM 把 ReLU 换成 TE 条件化的可学习激活函数（s = softmax(TE·w+b)，y = Σ sᵢ·Aᵢ(h)，6 个基础激活混合）——关键词信息注入为「激活形状」，参数仅 d×a=3.2K，是 AdaIN 式条件化（d×2×f=262,144）的约 1/85；FW-adapter 只重调 BN + SE（卷积全冻结）——继承说话人域自适应结论：本质特征预训练已学好，只需调整聚合方式；TE 分类器 把冻结 TE 直接固定为最终 FC 权重——AE/TE 都 L2 归一化后内积 = 余弦，打分几何与预训练度量空间一致。
          - listitem [ref=f144e30]: 两条最有信息量的消融边界：① 位置——TCFM 放低层（G0–G3）灾难性掉点（39.04–54.77%，全低于 PT），放高层 G4+G5 最优 87.22%（低层是构成关键词表征的基础特征，有限样本直接修改会损伤；残差块内 LAF 插入点多还费参数）；② 剂量——BN 适配逐组全正向、全组互补累积到 79.40（越多越好），SE 单组最优 84.33 但全组反噬 80.18（过犹不及）——两种轻量结构的正确用量方向相反。
          - listitem [ref=f144e31]: 结果（GSC V2 全 35 词，加混响加噪 SNR 5–25dB）：5/10/15-shot AP 87.63/89.15/90.38，EER 5.09/4.66/4.56——5-shot 已超过所有基线的 15-shot（最高 73.98%）；对最强基线 3-class 的领先从 15-shot 的 16.40 点放大到 5-shot 的 35.09 点；对 AdaKWS（AdaIN 条件化）15-shot 碾压 28.71 点。
          - listitem [ref=f144e32]: AdaKWS 的失败最有诊断价值：AP 几乎不随 shot 增加（58.32→61.67）——大容量条件化模块在小样本下学不动，印证「参数量必须压到极小」是 5-shot 存活的结构性前提。
          - listitem [ref=f144e33]: 工程账：新增参数 3.2K（0.14%），最优配置总可调 45.0K（约 2%），单关键词微调单张 V100 不到 1 小时；模块化——TE 与打分几何没被破坏，撤掉适配器即无损还原，换关键词即插即换（多关键词产品刚需）。
          - listitem [ref=f144e34]: 边界：强依赖预训练双塔质量（TE 欠拟合则 TCFM 与 TE 分类器同时失灵，未做压力测试）；仍需 5–15 条真实语音（未触及零样本，TTS 合成是论文自指方向）；15-shot 90.38 与全量微调天花板 95.35 还有 ~5 点；全部结论建立在 GSC V2 英文孤立词 + 合成混响噪声上。
    - generic [ref=f144e35]:
      - paragraph [ref=f144e36]: §01 · 问题陈述
      - heading "文本注册路线手里多了一张牌：TE 既是原型又是条件信号" [level=2] [ref=f144e37]
      - generic [ref=f144e39]: 赛道与矛盾：文本注册柔性 KWS（TF-KWS，用户打字即注册，门槛最低）的典型形态是双塔 + 深度度量学习——文本编码器产出关键词代表向量 TE，声学编码器产出 AE，同一词的 AE 被拉近 TE。柔性模型必须把容量花在通用判别能力上，单词性能追不上专用模型；为每个自定义词收集大数据又不现实。已有小样本 KWS 研究全部针对音频注册路线——本文是第一个把小样本迁移用于 TF-KWS 的工作，其独特资产：预训练文本编码器的 TE 可以同时充当条件信号（进适配器）和打分原型（当分类器权重），这是音频注册路线结构上做不到的。
      - generic [ref=f144e40]: 四条已有方案的失败证据：① 全参数微调 15-shot 只有 67.04% < PT 72.02%（2.21M 参数 vs 15 条样本）；② 只训新分类头 50.14%（15 条样本连一个 512 维分类面都学不好，PT 直接用 TE 当权重就有 72.02%）；③ 音频注册路线的小样本方法（SSL+元学习等）不覆盖文本注册；④ AdaKWS 用文本编码器生成 AdaIN 参数插进关键词自适应模块——需要大量数据从零联合训练，条件化参数开销 d×2×f 对 5-shot 场景过多，实测 15-shot 只有 61.67%（低于 2/3 分类基线的 72.38/73.98%）——大容量条件化直接拿来小样本微调走不通。
      - generic [ref=f144e41]: 四个约束收敛成设计问题：注入的目标词信息要来自文本侧（TF-KWS 注册阶段唯一先验，无需额外标注）；可调参数压到极小（全参数已证明翻车）；模块化可回退（适配完一个词能无缝还原、快速切下一个——多关键词部署刚需）；5-shot 极端条件下仍稳定超过预训练模型。
