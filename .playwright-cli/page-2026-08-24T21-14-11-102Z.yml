    - generic [ref=f144e291]:
      - paragraph [ref=f144e292]: §04 · 主要贡献
      - heading "四层贡献 + 一条可迁移判断" [level=2] [ref=f144e293]
      - generic [ref=f144e295]:
        - generic [ref=f144e296]:
          - generic [ref=f144e297]: "1"
          - text: 问题定义：首个面向文本注册柔性 KWS 的小样本迁移学习——指出并利用 TF-KWS 独有资产（TE 同时充当条件信号与打分原型）。
        - generic [ref=f144e298]:
          - generic [ref=f144e299]: "2"
          - text: 方法：TA-adapter 三组件——LAF 实现参数量 d×a 的文本条件化（对比 AdaIN 的 d×2×f，~85 倍差距）；SE/BN 域自适应经验迁移到关键词适配并摸清剂量边界（BN 可累积 / SE 会过载）；TE 固化为分类器权重消除小样本分类器学习这一最大不稳定源。
        - generic [ref=f144e300]:
          - generic [ref=f144e301]: "3"
          - text: 实证：GSC V2 全 35 词 + 混响噪声严格条件下，5-shot 即 AP 77.93→87.63、EER 7.94→5.09（相对降 ~36%）；15-shot 90.38% 全面超过基线，样本越少优势越大。
        - generic [ref=f144e302]:
          - generic [ref=f144e303]: "4"
          - text: 工程：新增参数 0.14%、总可调 2%、单卡 <1 小时 / 词；模块化即插即换，直接对应多关键词产品化部署。
      - generic [ref=f144e304]: 可迁移的工程判断：小样本适配的核心不是「要不要动模型」而是「动多少、动哪里、锚在哪」——动多少（参数量压到与样本量匹配的量级，全参数微调是负收益）；动哪里（改聚合方式优于改基础特征：高层条件化 + BN/SE 校准，低层注入会伤根基）；锚在哪（把最可信的预训练资产——TE——固定为打分原型，让全部可调自由度朝它收敛）。三问都有了实证答案。
