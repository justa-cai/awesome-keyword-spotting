      - paragraph [ref=f144e306]: §05 · 局限与边界
      - heading "强依赖预训练质量，仍未触及零样本" [level=2] [ref=f144e307]
      - generic [ref=f144e309]:
        - generic [ref=f144e310]:
          - heading "技术局限" [level=4] [ref=f144e311]
          - list [ref=f144e312]:
            - listitem [ref=f144e313]: 强依赖预训练基础设施：全部前提是存在 RPL 类度量损失良好对齐的双塔——TE 质量上限决定条件化与打分的上限；目标词文本表征欠拟合（生僻词、拼写变体、多语言混拼）时 TCFM 与 TE 分类器同时失灵，论文未做压力测试。
            - listitem [ref=f144e314]: 仍未触及零样本：每词仍需 5–15 条真实语音 + 一次微调——相对「只打字注册」的终极形态是折中（少量录音换 ~10 个点 AP）；多关键词部署时每词要存一份适配器参数与 BN/SE 状态，规模化存储与切换开销未报告。
            - listitem [ref=f144e315]: 绝对性能仍有缺口：15-shot 90.38 与全量微调天花板 95.35 差 ~5 点——目前是「高性价比」而非「无损」。
            - listitem [ref=f144e316]: 评测域单一：GSC V2 英文孤立指令词 + 合成混响噪声——多音节短语、流式音频、跨语言、真实远场均未报告；延迟与端侧 footprint 未报。
        - generic [ref=f144e317]:
          - heading "实验设计不足" [level=4] [ref=f144e318]
          - list [ref=f144e319]:
            - listitem [ref=f144e320]: 消融与主实验口径不一致：表 II/III 只在 15-shot × 10 词，表 IV 才是全 35 词——87.22 与 90.38 不能互译；每条件仅重采样 5 次无方差 / 置信区间，SE G2&BN 84.19 vs SE G3&BN 84.33 量级的结论可能落在噪声内。
            - listitem [ref=f144e321]: 基线缺口：未与 SSL+元学习（音频注册强基线）同场讨论；未与 LoRA 类低秩注入等其它参数高效手段做同预算对照——「LAF 是最优条件化机制」缺少同参数量级替代对照。
            - listitem [ref=f144e322]: 超参单点：基础激活个数 a 与六个函数选取、150 轮、128/96/32 batch 构成全是单点设定；SE 全组失败到底源于参数总量还是结构本身，缺逐组拆解归因。
            - listitem [ref=f144e323]: 合成管线 + 引文瑕疵：混响噪声为 RIR+MUSAN 合成，无真实远场验证；表 IV 中 AdaMS 与 RPL 引文标号疑似互换（按文献列表 [8]=AdaMS、[11]=RPL，阅读以方法名为准）。
      - generic [ref=f144e324]: 值得补的方向：论文自指——用 TTS 为目标词合成训练数据，把「少量真实录音的小样本适配」推进到「零真实录音的零样本迁移」（框架现成：TE 分类器与 TCFM 都不需要真实语音，缺的只是微调数据来源）；TCFM 与低秩适配、提示微调做同预算对比与组合；条件化位置的可学习选择（目前 G4/G5 是网格搜出的离散结论）；把「BN 可累积、SE 会过载」做成自适应按层配比；多音节唤醒词、多语言与代码混拼、连续语流；端侧延迟内存 + 量化真机验证；TE 质量敏感性分析；单关键词独立适配走向多关键词共享适配器摊薄成本。
