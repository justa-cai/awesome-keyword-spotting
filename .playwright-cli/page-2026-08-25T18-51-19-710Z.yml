  - generic [ref=f330e88]:
    - generic [ref=f330e89]: "02"
    - heading "机制：伪量化过前向，STE 过反向" [level=2] [ref=f330e90]
    - paragraph [ref=f330e91]: QAT 的核心矛盾是：量化操作不可微（round 的导数几乎处处为零），而训练需要梯度。本文用的是标准解法组合——前向传播时插入伪量化节点，把浮点权重和激活「过一遍砂纸」：量化到指定位宽再反量化回浮点，让每一层都在低精度数值环境里计算；反向传播时用直通估计器（STE）把梯度当作恒等映射直接放行。
    - img [ref=f330e92]:
      - generic [ref=f330e94]: 机制解剖：伪量化怎么过梯度 · PTQ vs QAT 的位宽曲线
      - generic [ref=f330e95]: 伪量化 + STE
      - generic [ref=f330e97]: 前向：数值过一遍「砂纸」
      - generic [ref=f330e99]: Q(x) = clip(round(x/s) + zp) · s
      - generic [ref=f330e100]: · round 到定点网格 → 再映射回浮点
      - generic [ref=f330e101]: · 激活与权重都过——每层都是低精度数值环境
      - generic [ref=f330e102]: · 溢出用 clip 截断——部署时的行为一样
      - generic [ref=f330e103]: 反向：直通估计器（STE）
      - generic [ref=f330e105]: ∂Q/∂x ≈ 1 （clip 区间内）
      - generic [ref=f330e106]: · round 不可微（导数几乎处处为 0）
      - generic [ref=f330e107]: · STE 把梯度「直通」过去，当作恒等映射
      - generic [ref=f330e108]: · 权重在浮点域连续更新，前向始终量化的
      - generic [ref=f330e109]: —— 训练结束时权重已「长在」定点网格的好位置
      - generic [ref=f330e110]: PTQ vs QAT（示意）
      - generic [ref=f330e112]: acc
      - generic [ref=f330e123]: 朴素 PTQ
      - generic [ref=f330e124]: QAT ★
      - generic [ref=f330e125]: 8bit
      - generic [ref=f330e126]: 4bit
      - generic [ref=f330e127]: 2bit
      - generic [ref=f330e128]: 量化位宽 →（越右越激进）
      - generic [ref=f330e129]: · 8-bit：QAT 几乎完全消除量化损失
      - generic [ref=f330e130]: · 4-bit：PTQ 已近失效，QAT 仍保持可用精度
      - generic [ref=f330e131]: · 曲线形态：PTQ 悬崖式下跌 · QAT 平缓下降
      - generic [ref=f330e132]: 左：前向伪量化模拟部署数值环境，反向 STE 让梯度穿过不可微的 round——训练结束的权重天然适配定点网格。右：同为激进量化，PTQ 掉悬崖、QAT 缓降
    - generic [ref=f330e133]: 图 2 · 机制解剖：伪量化与 STE 的前向/反向分工 · PTQ vs QAT 的位宽-精度曲线
    - generic [ref=f330e134]:
      - generic [ref=f330e135]: "前向: Q(x) = clip( round(x/s) + zp ) · s ← 量化到网格再映射回浮点 反向: ∂Q/∂x ≈ 1 (clip 区间内) ← STE：梯度直通，绕过不可微的 round"
      - generic [ref=f330e136]: 人话：前向时假装自己是一颗定点芯片（数值被磨粗），反向时假装量化不存在（梯度照常流动）。训练结束时，权重已经「长在」定点网格的好位置上——部署时看到的数值环境，训练时天天见。
    - paragraph [ref=f330e137]: 值得强调的是模拟的完备性：不只量化位宽——定点数的溢出与截断行为、整数/小数位宽分配、目标硬件上激活函数的近似实现（不是精确的 ReLU，是那颗芯片算出来的 ReLU），都在训练循环里复现。对神经形态芯片还有 ANN→SNN 转换支持，模拟脉冲神经元的膜电位累积与阈值发放。
