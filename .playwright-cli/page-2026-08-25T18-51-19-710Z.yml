    - generic [ref=f330e255]: "05"
    - heading "可迁移的判断" [level=2] [ref=f330e256]
    - generic [ref=f330e257]:
      - generic [ref=f330e258]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f330e259]: ① 部署掉点的根因是「训练没见过部署的数值环境」。
      - generic [ref=f330e260]: ↳ 把目标环境的数值行为（量化、舍入、近似非线性）搬进训练循环，是比部署后补救更便宜的一致性手段——「训练场 = 战场」适用于一切 train/deploy 有落差的场景（不只是量化）。
      - paragraph [ref=f330e261]: ② STE 是让梯度穿越不可微处的最小工具。
      - generic [ref=f330e262]:
        - text: ↳ round 不可微？反向时假装它是恒等映射。这个「前向真实、反向近似」的模式与离散 NAS 的 softmax 松弛殊途同归——工程上糙一点的梯度只要方向大致对，就够用。
        - paragraph
      - paragraph [ref=f330e263]: ③ 8-bit 是 QAT 的免费档，4-bit 是它的价值档。
