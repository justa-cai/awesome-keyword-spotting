  - generic [ref=f330e13]:
    - generic [ref=f330e14]: "01"
    - heading "问题：训练-部署硬件不匹配" [level=2] [ref=f330e15]
    - generic [ref=f330e16]:
      - generic [ref=f330e17]: TL;DR
      - list [ref=f330e18]:
        - listitem [ref=f330e19]: ◆ GPU 上 32 位浮点训练的模型，部署到 8 位整数甚至二值硬件上就掉精度——激进量化下训练后量化（PTQ）能让模型完全失效。
        - listitem [ref=f330e20]: ◆ 失配有四个来源：量化误差（数值分辨率差数量级）、非线性差异（激活的定点近似）、计算顺序差异（并行累加）、舍入模式差异（系统性累积）。
        - listitem [ref=f330e21]: ◆ 解法是一句话：训练时显式模拟目标硬件的数值行为——伪量化节点、定点溢出/截断、硬件激活近似、SNN 膜电位模拟，四类模拟全部进训练循环。
        - listitem [ref=f330e22]: ◆ 对比曲线是核心证据：位宽从 8 压到 2，PTQ 悬崖式下跌，QAT 平缓下降——4-bit 下前者近失效、后者仍可用。
