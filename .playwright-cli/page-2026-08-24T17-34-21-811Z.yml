        - heading "一分钟版本" [level=2] [ref=f58e25]
        - list [ref=f58e26]:
          - listitem [ref=f58e27]: 切入点比「换硬件跑 KWS」更基础：语音的毫秒级时间信息到底值多少。生物听觉证明脉冲时间编码承载关键判别信息，而主流 KWS 管线（HMM+MFCC / 帧级特征喂 ANN）只在滑窗意义上间接利用时间结构。
          - listitem [ref=f58e28]: 痛点结构：前馈 SNN 抓不住时间（CuBa-LIF 仅 71.59%，比递归低近 20 pp）；递归 SNN 精度好（90.04%）但连接数随隐藏神经元平方增长且脉冲活跃「传染」下游（L2 SynOps 是 TDE 的 2.3 倍）。
          - listitem [ref=f58e29]: TDE 细胞：双输入突触前腔——易化脉冲注入指数衰减增益迹线，触发脉冲到来时注入「当时的增益值」。两路脉冲间隔越短输出越强，且方向敏感（易化必须先于触发）→ 一对频率定义两个 TDE（32×31=992 个候选）。
          - listitem [ref=f58e30]: 配平对比（按突触连接总数而非神经元数）：89.08% vs LIFrec 91.11%（差 2 pp），SynOps 少 91.79%（14417 vs 175548）；L1 层少 97.64%。信息论分析（图 5）证明任务时间信息充足，前馈 LIF 的天花板不是规模能补的。
          - listitem [ref=f58e31]: 工程工具链：互相关排序剪枝（45.5% 规模缩减只损 1.22 pp）+ 用互相关最大滞后初始化 τg；反直觉发现：训练选中的判别频率对与互相关最高的对重合很少——「最大巧合 ≠ 最有判别力」。
