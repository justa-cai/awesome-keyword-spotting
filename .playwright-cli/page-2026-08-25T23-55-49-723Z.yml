    - heading "5 判断：能带走的三句话" [level=2] [ref=f71e222]:
      - generic [ref=f71e223]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f71e224]:
      - generic [ref=f71e225]: JUDGEMENT
      - paragraph [ref=f71e226]: ↳ 任务越短，对时域失真越敏感：KWS 与 ASR 用同一份增强差出一个数量级的提升——短词任务评估必须包含混响条件，只看干净测试集会严重高估自己。
      - paragraph [ref=f71e227]: ↳ 数据增强的上限由物理保真度决定：漫反射 vs 纯镜面的消融说明，「更像真实房间」本身就能变成训练收益——增强不是越多越好，是越真越好。
      - paragraph [ref=f71e228]: ↳ 物理模拟增强的三个不可替代：可复现（房间参数可枚举）、可解释（失真来源可追溯）、可控（可以定向补弱点场景）——这三点加噪声式的增强都给不了。
