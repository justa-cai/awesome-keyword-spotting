  - generic [ref=f71e73]:
    - heading "2 机制：图像源法算镜面，漫反射补真实" [level=2] [ref=f71e74]:
      - generic [ref=f71e75]: "2"
      - text: 机制：图像源法算镜面，漫反射补真实
    - generic [ref=f71e76]:
      - generic [ref=f71e77]:
        - heading "图像源法（ISM）" [level=3] [ref=f71e78]
        - text: 把房间建成矩形空间，每阶镜面反射 = 对墙镜像出的虚拟声源——几何精确，路径可解析。
      - generic [ref=f71e79]:
        - heading "漫反射建模（关键改进）" [level=3] [ref=f71e80]
        - text: 书架/窗帘/粗糙墙面把声波散射向多个方向——用散射系数 s 控制镜面 (1−s) / 漫反射 (s) 的比例。
      - generic [ref=f71e81]:
        - heading "卷积混响" [level=3] [ref=f71e82]
        - text: x_reverb = x_clean * h(t)——RIR 与干净语音卷积，每个样本对应一个物理上存在的房间配置。
      - generic [ref=f71e83]:
        - heading "混合训练" [level=3] [ref=f71e84]
        - text: 干净 + 模拟混响一起喂——模型自己学到对混响不变的表示，不需要推理时做增强。
