    - text: 一句话：用带漫反射的几何声学模拟生成房间脉冲响应（RIR），与干净语音卷积成混响训练样本——干净数据训练的模型进房间就翻车，物理增强后 KWS 准确率 +21%（ASR 仅 +1.58%，落差本身就是发现）。
