        - generic [ref=f184e23]: 级联 NLMS 被证伪
      - generic [ref=f184e24]:
        - heading "一分钟版本" [level=2] [ref=f184e25]
        - list [ref=f184e26]:
          - listitem [ref=f184e27]: 自参考问题的物理根源：打断场景（用户说话同时设备在播放）里麦克风离扬声器远比离嘴近——回声对 KWS 的破坏远超一般噪声。极端情形是自参考：设备自己生成并播放「Hey Siri」提示音，KWS 应当保持沉默，但只看麦克风的模型几乎必然误触发（自己唤醒自己）。
          - listitem [ref=f184e28]: 级联 AEC 被实验证伪（最有工程价值的否定性证据）：把 NLMS 自适应滤波器接到基线前面——音乐 / 语音播放场景无显著改善，自参考场景 MAE 只从 73.97–85.40% 降到 69.86–72.91%（平均输出仍 0.7+，逢播必触发）。机理：AEC 滤不净的残差回声照样被 KWS 检测到；更尖锐的推论——如果改进方向是让 UDKWS 对带噪语音更宽容，反而可能让自参考更糟。
          - listitem [ref=f184e29]: 方案：隐式 iAEC（唯一结构增量 = Refiner）：共享音频编码器产两路 128 维嵌入（同空间是逐帧掩码乘法的前提）→ Refiner 用两路嵌入生成掩码乘到混合嵌入上 → 增强嵌入进继承自前身 PhonMatchNet 的提取器 + 双粒度判别器。除 Refiner 外全部结构与超参不变——升级近乎零成本，性能差异干净归因到单模块。
          - listitem [ref=f184e30]: Mask C vs Mask D（核心消融）：前作的 dense 掩码（拼接 256 维 → Dense → sigmoid）是逐帧线性映射——播放信号带传播延迟重入（第 t 帧麦克风嵌入混的是第 t−k 帧的回声），dense 只能看同帧两路嵌入，天然对不上号。本文 Mask C 把两路嵌入堆叠成 2 通道「图像」，3 层 3×3 Conv2D（8→8→1 通道）在时间-嵌入平面联合滑动——隐式滑窗配准。参数 C≈0.8K vs D≈33K（差 40 倍），C 全面胜出——「能否跨时间配准」比「容量大小」重要得多。
          - listitem [ref=f184e31]: 隐式训练（无干净目标的自设限）：掩码全程无显式监督（无理想比值掩码标签、无干净语音回归）——回声消除能力完全由端到端检测损失反推。成立前提是双粒度判别头提供密监督：音素级损失把梯度压到帧粒度（迫使掩码分辨每帧能量属于回声里的哪个音素）——判别器反哺增强器。自设限：手里有干净语音也不用——真实设备只能拿到两路信号，训练与部署条件严格对齐。
          - listitem [ref=f184e32]: 结果（自参考主战场）：基线 MAE（= 真值全 0 时的平均输出 = 误触发强度）73.97–85.40% → Mask C 压到 0.13–3.11%（相对降幅 96.4–99.8%）；模型只增大 0.13%（655K→656K）。播放音乐 AUC +3~6 点、播放语音 AUC +7~10 点（语音回放提升更大但绝对性能仍最差——LPH EER 32.79%）。
          - listitem [ref=f184e33]: 代价：无播放场景小幅一致回退（EER +1 点量级，LPE 反而改善）——引入回放通路的必要代价；高相关回放的绝对性能仍不堪用（用户在设备播报语音时喊唤醒词三次漏一次量级）——学会「回声不是唤醒」也让模型在真唤醒与回声高度相似时变得谨慎。
          - listitem [ref=f184e34]: 边界：卷积感受野与 0.1s 延迟上界的匹配无法核算（未报告嵌入帧率，0.1s 折多少帧无从算、无感受野消融）；线性 RIR 仿真（扬声器 / 麦克风非线性、AGC、编解码链路全未覆盖、无真实设备录音）；按测试集性能选模型（无独立验证集——数量级结论难翻案但 1 点量级对比经不起推敲）；无运行方差；无推理计算量 / 时延（GRU+自注意力能否流式化未讨论——参数量小不等于算得快）；隐含部署前提（软件层能回采 audio-out）；无外部 SOTA 对比。
    - generic [ref=f184e35]:
      - paragraph [ref=f184e36]: §01 · 问题陈述
      - heading "四条互相牵制的目标" [level=2] [ref=f184e37]
      - generic [ref=f184e39]: 设计空间：回声消除隐式嵌入 KWS 且参数代价可忽略（端侧常驻预算）；自参考场景平均输出从 0.7–0.85 压到接近零（「准」的一票否决项）；训练全程不用干净目标信号（匹配真实设备条件——只能拿到两路信号）；不为抗回声做坏无回声场景（只允许极小回退）。四条合起来决定方案必须是「在既有高效模型里嵌入一个极小的、时延感知的、无需显式监督的掩码模块」，而不是外挂 AEC 前端。QbE 路线的注册不便已由零样本 UDKWS（文本注册）解决——但它们只接受麦克风单路输入，重叠场景立即退化。
