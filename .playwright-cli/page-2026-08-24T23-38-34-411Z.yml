      - paragraph [ref=f184e14]: "iPhonMatchNet: Zero-Shot User-Defined Keyword Spotting Using Implicit Acoustic Echo Cancellation"
      - paragraph [ref=f184e15]: 作者：Yong-Hyeok Lee、Namhyun Cho —— NCSOFT 语音 AI 实验室（韩国）
      - paragraph [ref=f184e16]: 发表：arXiv 2309.06096（2023-09）· 前身 PhonMatchNet + 0.13% 参数 · 数据脚本开源
      - generic [ref=f184e17]:
