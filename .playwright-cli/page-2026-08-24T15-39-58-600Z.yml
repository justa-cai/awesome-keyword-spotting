        - paragraph [ref=f19e302]: ① 迁移到音素层（论文自指）：配好 G2P + 音素 TTS 后让难度旋钮直接对应声学距离，跨语言更好——字素路线结论（多样性主导 / 距离二阶 / 合成优于真实词表）可作先验。 ② 发音相似度感知采样：用轻量发音距离分层采样或损失加权，把粗糙代理升级为声学贴边度。 ③ 与真实数据混合的生产配方：产品工作点（固定低 FA）上验证收益是否保持。 ④ 混合生成策略：穷举提供骨架覆盖（recall）+ LLM 生成自然词面（同组后续 LLM-Synth4KWS，自然性）——两者互补。 ⑤ 冷启动自定义关键词：那里没有历史误唤醒数据可挖，系统化生成优势应当最突出；以及中文拼音层编辑的适配。 ⑥ 评估补强：checkpoint 方差、扩充真实混淆集、与挖掘/对抗法同台对比。
