        - heading "一分钟版本" [level=2] [ref=f19e25]
        - list [ref=f19e26]:
          - listitem [ref=f19e27]: 痛点结构：KWS 模型精度取决于对「贴近决策边界」样本的判别力，而边界样本（听感相近的混淆短语，如 "All exhausted" → "Alexa"）在自然数据里天然稀缺——且混淆词集合是会生长的开放集合（安全研究已证明可被主动利用："Cocaine noodles"）。
          - listitem [ref=f19e28]: 范式翻转：现有四条路线（对抗扰动 / 人工词表 / ASR 挖掘 / 数据集搜索）的混淆词集合都是资源约束的函数；GraphemeAug 把它变成关键词自身的函数——对拼写做插入/删除/同类替换三种编辑，按 Levenshtein 距离递归穷举（"Hey Google" 距离 1 有 433 个）。
          - listitem [ref=f19e29]: 管线：占位关键词源数据（"Hey Indy, ..."）→ 三路文本变换（正例 / 一般负例 / 混淆例）→ AudioLM 风格迁移 TTS（借真实语音的韵律和说话人）→ 房间仿真 + 噪声 ×25 → 训练；混淆例只替换 10% 负例（weight 0.1）。
          - listitem [ref=f19e30]: 结果：未见合成混淆词上 AUC 96.9 → 98.8（误判率相对缩减 61%）且真实正例/一般负例不掉点；433 个穷举词训练的模型在真实混淆词上 99.01，3,779 个真实词训练的模型在合成混淆词上只有 91.7。
          - listitem [ref=f19e31]: 两个量化发现：风格迁移 +22% AUC（首次量化）；唯一混淆词数是主导因素（10→10k = +58% 相对），编辑距离只是二阶旋钮——规模本身就是方法的一部分。
