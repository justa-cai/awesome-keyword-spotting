    - generic [ref=f216e4]: 论文精读 · 可视化版 · 2022 №21
    - heading "两成标注追平全标注： SSL 红利第一次落到 5M 级小模型" [level=1] [ref=f216e5]: 两成标注追平全标注：SSL 红利第一次落到 5M 级小模型
    - generic [ref=f216e6]:
      - generic [ref=f216e7]: Data2Vec-KWS · ICASSP 2023 SASB Workshop
      - generic [ref=f216e8]: 奥尔堡大学
      - generic [ref=f216e9]: 非对比式自监督预训练
      - generic [ref=f216e10]: KWT 0.6–5.4M · GSC V2
    - generic [ref=f216e11]: 通用 SSL 的算力门槛把最需要省标注的 KWS 小模型挡在门外——本文用单块 T40 + 10 小时证明：80% 无标注预训练 + 20% 标注微调 ≈ 100% 标注训练。
    - generic [ref=f216e12]:
      - heading "一分钟版本" [level=3] [ref=f216e13]
      - list [ref=f216e14]:
        - listitem [ref=f216e15]: ▸ 错位：KWS 小模型常驻端侧、标注贵（唤醒词位置/边界/有无都要人工判定，换词表就重采）；而现有 SSL 主攻通用大模型（数亿参数、数周 GPU）——红利与需求刚好错开。蒸馏路线也没解决：先训大教师本身就走不通。
        - listitem [ref=f216e16]: ▸ 基座：KWT（GSC 上的 SOTA transformer）三档 0.6M/2.4M/5.4M；小改动——均值池化替代 CLS token（语音 1 秒里关键词可在任意位置，均值对位置不敏感、每个时间步都接受梯度）。
        - listitem [ref=f216e17]: ▸ Data2Vec 机制：教师 = 学生的 EMA 影子（解决自举悖论）；学生看 65% 掩码输入，回归教师对完整输入顶部 K 层隐藏状态的均值（MSE）；非对比式无需负样本——小模型容量有限，把大量负例推开的约束可能过度消耗容量。
        - listitem [ref=f216e18]: ▸ 公平性：监督基线也用 SpecAugment——SSL 增益不能归因于增强差异。
        - listitem [ref=f216e19]: ▸ 主结果：三档模型 SC 预训练 +8.22/+9.23/+11.16 个绝对点；无预训练时最大的 KWT-3 反而最差（84.11% < 85.84%）——16,969 条标注约束不住 5.4M 参数，预训练把「模型容量」从负债变回资产。
        - listitem [ref=f216e20]: ▸ 最有说服力的对比：SC 预训练 + 20% 标注 ≈ 100% 标注纯监督（KWT-2 95.07 vs 94.98，KWT-3 95.27 vs 90.79）——五分之四的标注工作量可被无标注数据抵消。
        - listitem [ref=f216e21]: ▸ 跨域几乎免费：Librispeech 有声书 vs 命令词域的预训练差异仅 0.32–0.52 点——低资源语言可借任意同语言无标注音频（有声书/播客）绕开死循环。
        - listitem [ref=f216e22]: ▸ 冻结惨败：冻结预训练权重只训分类头只有 0.43–0.50——回归目标塑造的表征是为重建服务的中间量，不保证类别线性可分；必须全参数微调。
        - listitem [ref=f216e23]: ▸ 叠加收益：100% 标注 + LS 预训练全部破 97%，三档模型几乎拉平（差 0.03 点）——数据充足时预训练依然加分。
        - listitem [ref=f216e24]: ▸ 成本：单块 T40，最大模型预训练约 10h、微调约 1h——比大模型 SSL 路线低一个数量级；代码开源。
    - heading "§01 问题：SSL 的门槛与 KWS 的需求错开" [level=2] [ref=f216e25]:
      - generic [ref=f216e26]: §01
      - text: 问题：SSL 的门槛与 KWS 的需求错开
    - generic [ref=f216e27]: 小模型 + 标签稀缺 + KWS 的三者交集此前无人系统实证
    - paragraph [ref=f216e28]: KWS 在语音助手架构里是「小系统常驻唤醒 + 大 ASR 按需启动」的守门人——模型要小要省电，准确率却不能降。深度 KWS 的标注成本尤其难摊薄：通用 ASR 可以半自动粗转写再人工校对，KWS 要对每个唤醒词的出现位置、边界、有无做精确判定，负样本（非唤醒词/静音/噪声）也要覆盖充分——商业唤醒词还是定制词表，每换一个产品名就得重采，标注成本反复发生。
    - generic [ref=f216e29]:
      - generic [ref=f216e30]:
        - heading "大模型 SSL 的双重不可行" [level=4] [ref=f216e31]
        - paragraph [ref=f216e32]: 算力上：多数团队没有几周 GPU 预算花在一个唤醒词模型上；产品上：KWS 只要单一任务极致轻量，与「一个模型打多个下游」（SUPERB 范式）的方向相悖。
      - generic [ref=f216e33]:
        - heading "小模型做 SSL 的历史疑虑" [level=4] [ref=f216e34]
        - paragraph [ref=f216e35]: 学界默认小模型容量不足、自监督代理任务容易过拟合——图像域已有反证（对比式 SSL 直接训 2.5–11M 小模型成功），但语音域、非对比式的答案此前空白。
