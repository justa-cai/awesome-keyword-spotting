    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f216e324]
    - list [ref=f216e325]:
      - listitem [ref=f216e326]: ↳ SSL 的收益不是大模型专属——亚百万级参数只要配上合适的代理任务同样能消化；「容量不足做不了 SSL」是未被检验的默认假设。
      - listitem [ref=f216e327]: ↳ 预训练的正则化价值在小数据下最显形：它能把「模型容量」从负债变回资产（最大模型无预训练最差、有预训练最佳）。
      - listitem [ref=f216e328]: ↳ 回归式 SSL（预测隐藏态）塑造的表征不保证线性可分——想要即插即用特征器选对比式路线，想要微调收益回归式更省容量。
      - listitem [ref=f216e329]: ↳ 跨域预训练几乎免费：目标域无标注数据不是必需品——公开的任意同语言音频就能兑现大部分收益。
      - listitem [ref=f216e330]: ↳ 评价标签稀缺方法要用「等总数据量」协议（80 无标注 + 20 标注 vs 100 标注），否则增益可能来自数据量而非方法。
