    - generic [ref=f43e128]:
      - generic [ref=f43e129]: "音频源: 车顶阵列 / 方向盘附近 —— 各位置对语音与噪声的接收特性不同 传感器: 车速 · 发动机转速 · HVAC 状态(CAN) —— 噪声环境的状态先验 融合: 特征级(拼接, 早) | 模型级(架构内, 中) | 决策级(投票/加权, 晚) 适配: 按噪声类型(发动机低频/风噪宽带)自适应调整融合策略"
      - generic [ref=f43e130]: 人话：车里装了几只耳朵（不同位置的麦克风）和一双眼睛（车速转速表）——发动机的吼声传到各只耳朵的样子都不一样，靠这些差异能把「人声」从吼声里挑出来；仪表盘还告诉你现在是在市区慢慢开还是高速兜风，好换相应的听话策略。
    - paragraph [ref=f43e131]: "三级融合的取舍谱与 #21（视听融合）的结论互相印证：早融合让不同源的信息在表示层互相适应（上限高），晚融合实现简单但受限于各单源的上限——本文把这张谱在车载条件下做了系统评估，为后续工作提供了选型依据。"
