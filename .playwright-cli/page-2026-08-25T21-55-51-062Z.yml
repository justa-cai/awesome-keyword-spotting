    - heading "可迁移的判断" [level=2] [ref=f43e253]
    - generic [ref=f43e254]:
      - generic [ref=f43e255]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f43e256]: ① 多通道的物理本钱是「空间信息差」。
      - generic [ref=f43e257]: ↳ 同一噪声在不同位置传感器里的表现不同——这个差异就是可分性；单通道方法的可分性只能来自频谱结构（噪声谱与语音谱重叠时失效），多通道多了空间这一维——低 SNR 时频谱路走不通，空间路是唯一的。
      - paragraph [ref=f43e258]: ② 环境状态传感器是免费的先验。
      - generic [ref=f43e259]: ↳ 车速、转速、空调状态这些 CAN 信息「知道现在什么在吵」——不用于检测本身，而用于选择/调整检测策略；任何部署场景里都有这类旁路信息（机器人的运动状态、手机的光传感器），挖掘它们常比改模型便宜。
      - paragraph [ref=f43e260]: ③ 多源系统的瓶颈常在系统层不在算法层。
      - generic [ref=f43e261]: ↳ 同步、布线、成本这三座山决定融合方案能否落地——算法论文报的增益要按系统总账折算；这也是本文发在通信会议的深层原因：他们看的正是系统层问题。
    - paragraph [ref=f43e262]: 系列坐标：部署场景特异性谱系的车载节点——#9 机器人基准（2020）管自体回声+机械噪声，#4 远场域适应（2020）管家居混响，本文（2019）管车载多源动态噪声——每个场景的「噪声指纹」不同，通用模型到场景模型的分化是 KWS 落地的必经之路；2026 年方向感知多通道 KWS 是本文思想的当代延续。
