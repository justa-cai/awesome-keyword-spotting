      - generic [ref=f43e196]:
        - generic [ref=f43e197]: "1"
        - paragraph [ref=f43e198]: 发在 WCNC（无线通信会议）本身是个信号。车载 KWS 在通信社区眼里是「车联网的语音入口」：多麦布线 = 车内网络拓扑、通道同步 = 分布式采样、CAN 信息 = 异构数据融合——同一问题两个社区问的问题不同（模型怎么建 vs 信息怎么传合），双方视角互补。
      - generic [ref=f43e199]:
        - generic [ref=f43e200]: "2"
        - paragraph [ref=f43e201]: 「低 SNR 区改善最大」有普遍意义。与视听融合（#21：安静时增益小、噪声大时是救命的）同构——多源融合的价值分布不均匀，评估要在最难的条件区做，单报平均精度会掩盖最大价值。
      - generic [ref=f43e202]:
        - generic [ref=f43e203]: "3"
        - paragraph [ref=f43e204]: 车载是「场景特异性」谱系的典型代表。机器人有自体回声+机械噪声（#9）、家居有混响（#4）、车载有发动机+多源+动态——每个部署场景都有自己的「噪声指纹」，通用模型到场景模型是 KWS 落地的必经之路。
