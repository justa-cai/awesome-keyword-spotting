  - generic [ref=f43e13]:
    - generic [ref=f43e14]: "01"
    - heading "问题：车厢是 KWS 最残酷的考场" [level=2] [ref=f43e15]
    - generic [ref=f43e16]:
      - generic [ref=f43e17]: TL;DR
      - list [ref=f43e18]:
        - listitem [ref=f43e19]: ◆ 车载声学的四重考验：多噪声源叠加（发动机随转速、道路随速度、风噪随车窗、HVAC + 音乐播放）、多说话人干扰、动态环境（随速度/路况/天气快速变化）、极低 SNR（高速/开窗 <0dB）。
        - listitem [ref=f43e20]: ◆ 单通道信号处理在此能力有限——但车里其实有现成的多源信息：分布在车顶/方向盘的多麦克风（空间互补）+ 车速/振动等传感器（环境先验）。
        - listitem [ref=f43e21]: ◆ 本文系统比较了三级融合：特征级（早融合——信息全但贵）、模型级（架构内整合）、决策级（晚融合——简单但上限低）——为车载场景提供设计参考。
        - listitem [ref=f43e22]: ◆ 车载专用适配：针对发动机低频、风噪宽带等特性设计噪声鲁棒特征；融合策略按噪声类型自适应调整——不是一成不变的静态组合。
