  - generic [ref=f43e85]:
    - generic [ref=f43e86]: "02"
    - heading "机制：空间信息差是物理本钱" [level=2] [ref=f43e87]
    - paragraph [ref=f43e88]: 多通道融合的物理基础一句话讲清：同一噪声在不同位置的麦克风里「长得不一样」——说话人离车顶麦近、发动机从底盘传来、后座干扰者离另一支麦更近——这些差异就是「信号 vs 噪声」的可分性来源。单源失效的低 SNR 区，空间信息差成了唯一还能依赖的证据。CAN 总线的车速/转速信息则提供「现在什么在吵」的环境先验——知道噪声类型本身就是宝贵的自适应依据。
