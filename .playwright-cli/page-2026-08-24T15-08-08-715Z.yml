      - heading "度量层面的病，在任务层面未必是病——这个断层没人填过" [level=2] [ref=f7e34]
      - generic [ref=f7e36]:
        - img [ref=f7e37]:
          - generic [ref=f7e38]: 各向异性：海量表征没有铺满高维空间，而是挤在一个狭窄锥形区域里
          - generic [ref=f7e39]:
            - generic [ref=f7e51]: 健康状态（各向同性）：方向分散，随机两帧近乎正交
            - generic [ref=f7e63]: 锥形坍缩区
            - generic [ref=f7e64]: XLSR-53 实际状态：随机两帧余弦最高 0.96，几乎不存在负相似度
          - generic [ref=f7e65]: 机制（Timkey & van Schijndel）：少数「流氓维度」取值幅度和方差异常巨大，完全主导余弦计算——见 §03 图。
        - paragraph [ref=f7e66]: 为什么这个几何问题重要：示例式查询（query-by-example）——拿一小段查询音频去语料表征空间比对——是低资源/濒危语言文档工作唯一可行的检索路线：没有标注、没有转写系统、没有计算设施，语言学家只能靠相似度。相似度若真被各向异性摧毁，这条路就死了。
      - generic [ref=f7e67]:
        - heading "评估断层：三条现有路线都没回答\"有没有害\"" [level=3] [ref=f7e68]
        - paragraph [ref=f7e69]: 各向异性文献（BERT/GPT-2 到语音再到 T5）：只报告度量分布、各向异性指数、流氓维度存在性，从不与下游任务性能挂钩——"看起来病态"与"任务受害"之间的断层没人填过，所有缓解方法因此无法判断价值（为缓解而缓解）。 传统 KWS 分类范式：每个目标词要大量标注样本，文档语言学场景里目标词随时由语言学家指定、即查即用——分类范式无法迁移。 手工特征 + DTW 经典路线：MFCC 保留物理声学内容，对说话人音色、麦克风信道、录音环境高度敏感——同一词不同人发音，特征距离可能很远（本文 Table 2 量化了这条差距）。
