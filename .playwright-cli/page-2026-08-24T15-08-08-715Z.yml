      - heading "小规模、单模型、无对照矫正——结论的外推边界" [level=2] [ref=f7e332]
      - generic [ref=f7e334]:
        - generic [ref=f7e335]:
          - heading "方法的技术局限" [level=4] [ref=f7e336]
          - list [ref=f7e337]:
            - listitem [ref=f7e338]: 只测了一个模型家族：全部实验基于 XLSR-53；摘要里并列提到的 HuBERT 完全没有实验，WavLM 等也未涉及——能否推广到其他预训练目标（掩码预测/对比学习/蒸馏）存疑。
            - listitem [ref=f7e339]: 没有矫正对照组：证明了"带病的余弦仍可用"，没测"矫正之后是否更好"——白化、去流氓维度后重跑同一协议才能回答边际危害。现有结论无法排除"矫正后还能再涨"。
            - listitem [ref=f7e340]: 零训练天花板明显：k=100 召回 64.8%，同词变体并未全部聚拢；连层选择都依赖 F1 oracle，无监督层加权、度量学习等轻量适配空间未探索。
            - listitem [ref=f7e341]: 计算开销未报告：每查询对 1000 句各做一次 n×m DTW（帧率 ~49 帧/秒），真实田野语料（数十小时）的可扩展性存疑；无下界剪枝/预筛讨论。
            - listitem [ref=f7e342]: 依赖前置组件：MFA 对齐精度的影响未量化；CommonVoice 是朗读式干净信道，与文档语言学面对的自发口语、远场、噪声差距大。
        - generic [ref=f7e343]:
          - heading "实验设计的不足" [level=4] [ref=f7e344]
          - list [ref=f7e345]:
            - listitem [ref=f7e346]: 规模小、单语言、单语域：30 词 / 300 查询 / 1000 句池、只有西班牙语、全部朗读语料——语言无关性与语域鲁棒性（文档语言学最需要的性质）未验证。
            - listitem [ref=f7e347]: 无外部基线：没有 ASR 转写检索、专用 QbE 系统或无监督声学词分割的对比——该路线在方法版图中的绝对位置只能靠推断。
            - listitem [ref=f7e348]: 统计严谨性缺失：无方差、置信区间、显著性检验；15–17 层塌陷无法排除小样本波动。
            - listitem [ref=f7e349]: 多处数据/记号不一致（笔者核验）：式 1 记号与解读方向相反；Table 2 隐含 17–18 个相关句 vs 正文 10 句；Table 1 负标准差；第 24 层流氓维度消失 vs 高各向异性的张力；引用编号前后不一；标题拼写笔误（"Is Anistropy Harmfull?"）。主结论方向不受影响，但引用数字需回原文核对。
