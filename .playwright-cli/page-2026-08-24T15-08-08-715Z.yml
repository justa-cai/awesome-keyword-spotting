      - paragraph [ref=f7e14]: "Assessing the Impact of Anisotropy in Neural Representations of Speech: A Case Study on Keyword Spotting"
      - paragraph [ref=f7e15]: 作者：Clara Rosina Fernandez、Séverine Guillaume、Guillaume Wisniewski —— CNRS LACITO / LLF（巴黎）
      - paragraph [ref=f7e16]: 发表：2025.06 · arXiv:2506.11096 · 计算文档语言学场景
      - generic [ref=f7e17]:
        - generic [ref=f7e18]: 各向异性
        - generic [ref=f7e19]: 流氓维度
        - generic [ref=f7e20]: wav2vec2 / XLSR-53
