          - text: 首次在度量研究与下游任务之间架桥把各向异性的争论从"分布是否病态"推进到"任务是否真的受害"，并给出答案——不受害，至少在词检索上如此。此前相关工作全部停留在度量层面。
        - generic [ref=f7e322]:
          - generic [ref=f7e323]: "2"
          - text: 可迁移的论证模板「检索精度 ⇒ 相似度相对排序仍携带信息 ⇒ 各向异性危害有限」三段论把几何直觉变成可实验证伪的命题——任何"表征几何病态是否有害"的问题都能这样测。
        - generic [ref=f7e324]:
          - generic [ref=f7e325]: "3"
          - text: wav2vec2 表征的经验刻画重建式自监督目标没有让表征停留在物理细节层——同一词不同人发音距离依然很小；预训练学到的是语言学结构而非声学细节（优势随 k 扩大拉大）。
