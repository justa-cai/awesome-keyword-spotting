      - generic [ref=f7e24]:
        - heading "一分钟版本" [level=2] [ref=f7e25]
        - list [ref=f7e26]:
          - listitem [ref=f7e27]: 悬置已久的疑问：wav2vec2/HuBERT 类表征挤在一个狭窄锥形区域里——随机两帧的余弦相似度在最后几层高达 0.96。直觉上一切基于相似度的用法（检索/聚类/模板匹配）都该失效，但从来没有人真正在任务上测过伤害有多大。
          - listitem [ref=f7e28]: 本文的做法：把问题变成是非题。用纯相似度驱动的子序列 DTW（帧间度量就是余弦——各向异性侵袭的那个度量）做无转写、无训练、无微调的词检索；如果检索还准，就证明相似度的相对排序仍然携带信息。
          - listitem [ref=f7e29]: 结果：P@1 = 100%（第一名永远命中目标词）；k=10 时 XLSR-53 精确率 54.7% 对 MFCC 的 16.8%——预训练表征不止找到源录音，还能把其他说话人、其他语境的同一词聚到近邻区。
          - listitem [ref=f7e30]: 关键解耦：各向异性随层深单调恶化（0.47 → 0.96），但检索性能跨层大幅波动、在 22–24 层（余弦方差几乎归零）依然有效——几何病态 ≠ 任务受害。
          - listitem [ref=f7e31]: 诚实边界：只测了 XLSR-53 一个模型、西班牙语一个语言、1000 句检索池；没有"矫正后是否更好"的对照组；k=100 召回仅 64.8%，变体离散的天花板还在。
