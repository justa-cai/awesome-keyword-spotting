        - paragraph [ref=f7e353]: ① 模型与任务矩阵：HuBERT / WavLM 上重复协议，扩展到聚类、说话人日志、声学事件检索——把"无害"升级为跨任务规律或找到边界条件。 ② 补上矫正对照组：白化 / 去流氓维度 / 谱归一化后重跑，让各向异性缓解研究第一次有任务级评判标尺。 ③ 走向真实田野数据：自发口语、多说话人、远场噪声的濒危语言录音 + 与 ASR 路线和 QbE 系统对比——最终考场。 ④ 无监督层选择 + 轻量适配：摆脱 oracle（如同词距离分布紧致度准则），压 64.8% 暴露的变体离散问题。 ⑤ 效率工程化：DTW 下界剪枝、帧级 ANN 预筛、降维量化；顺带量化失控流氓维度对计算存储的浪费。 ⑥ 机制追因：15–17 层塌陷、第 24 层的张力、各向异性与性能为何解耦——未解之谜是后续表征分析的富矿。
