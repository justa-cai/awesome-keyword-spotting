          - generic [ref=f7e327]: "4"
          - text: 层选择的实证警示各向异性强度与检索性能在层维度上解耦；15–17 层塌陷无解释；不能想当然用最后一层——层选择是实际部署必须正视的决策。
        - generic [ref=f7e328]:
