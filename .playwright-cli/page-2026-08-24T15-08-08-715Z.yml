          - text: 面向文档语言学的可用路线MFA 切词 + XLSR 表征 + 子序列 DTW：无转写、无标注、无训练、无微调的示例式词检索，P@1=100%、k=10 精确率 54.7%——直接服务低资源/濒危语言记录工作。
