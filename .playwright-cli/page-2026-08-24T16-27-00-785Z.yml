        - heading "一分钟版本" [level=2] [ref=f37e25]
        - list [ref=f37e26]:
          - listitem [ref=f37e27]: 场景特殊且实际：联合国资助的人道主义救援广播监测——在乌干达卢干达语、马里班巴拉语等零转写语言的社区电台音频里检索关键词（灾害/疫情/难民相关）。三层约束叠加：语言欠资源（ASR 路线不可行）、危机时间紧（不可能采标注语料）、广播含传输失真。
          - listitem [ref=f37e28]: 方案：冻结 mHuBERT-147 第 10 层特征 → ContrastiveTransformer（3 层 16 头 encoder-only + 可训练全 1 聚合向量，输出 256 维）→ 10–65 帧滑窗（步长 5）逐窗嵌入 → 与关键词模板嵌入余弦比较。NT-Xent 直接优化检索几何——同词两发音拉近、异词推远，训练目标与推理度量完全同构。
          - listitem [ref=f37e29]: 结果：对 DTW+BNF 基线，卢干达语 MAP +47.5 pp（22.44→69.91）、班巴拉语 +33.6 pp（40.90→74.53）；对重建式 CAE-RNN 卢干达语 +22.7 pp。英语（预训练见过）领先幅度反而最小——对比训练的收益恰在未见语言上最大。
          - listitem [ref=f37e30]: 训练语言选择可操作结论：有亲属语言用亲属（卢干达语配斯瓦希里语）；无亲属用差异大的组合（班巴拉语 sw+afr 75.02 > 四语混合 74.53——塞近亲南部班图语反而有害）。
          - listitem [ref=f37e31]: 诚实项：滑窗暴力扫描无词边界、效率主张零实测数字；τ/批大小未披露；班巴拉语是真未见语言但卢干达语在 MHB 预训练列表里——两语言迁移难度不同层。
