  - generic [ref=f32e82]:
    - generic [ref=f32e83]: "02"
    - heading "机制：梯度改写增强的目标函数" [level=2] [ref=f32e84]
    - paragraph [ref=f32e85]: 联合训练改变的不是增强网络的架构而是它的目标函数：两阶段里它追 SNR（把噪声压到最低，连带判别细节一起洗掉）；级联后它追交叉熵（保留对唤醒词判别有用的声学细节，哪怕听感上「不够干净」）。特征变换块是关键枢纽——KWS 的梯度从这里回传，前端才收得到「后端要什么」的信号。
