        - generic [ref=f32e192]: "1"
        - paragraph [ref=f32e193]: 「增益来自目标对齐」是本文最有价值的洞察。两阶段与联合用的增强网络容量相当——差别只在优化目标；这说明传统增强前端的瓶颈不是能力而是方向，端到端联训只是把方向掰对了。
      - generic [ref=f32e194]:
        - generic [ref=f32e195]: "2"
        - paragraph [ref=f32e196]: 特征变换块常被一笔带过但不可或缺。它是梯度的通道——没有这个可学习的桥，级联就退化成硬拼接；「桥接层设计」是所有级联端到端系统的共同课题。
      - generic [ref=f32e197]:
        - generic [ref=f32e198]: "3"
        - paragraph [ref=f32e199]: "预训练+微调的两步走了后续被反复复用。先在独立任务上学先验（降噪），再以最终目标联训——这个模板与 #25（TTS 数据）、联邦个性化等场景同构：冷启动用先验，精调用终端目标。"
