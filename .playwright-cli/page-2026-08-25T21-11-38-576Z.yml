  - generic [ref=f32e13]:
    - generic [ref=f32e14]: "01"
    - heading "问题：增强前端在帮倒忙" [level=2] [ref=f32e15]
    - generic [ref=f32e16]:
      - generic [ref=f32e17]: TL;DR
      - list [ref=f32e18]:
        - listitem [ref=f32e19]: ◆ 传统抗噪 KWS 是「增强前端 + KWS 后端」各自为政：前端优化 SNR/PESQ 等通用音质指标——客观分数更好，判别性信息可能反而被洗掉。
        - listitem [ref=f32e20]: ◆ 三宗罪：独立优化次优（通用音质 ≠ KWS 判别性）、误差传播（过度抑制的语音失真传给后端、无梯度可纠正）、单通道算力账（一个麦克风便宜，但增强网络不能贵）。
        - listitem [ref=f32e21]: ◆ 联合训练的解法：CRN 增强 + 特征变换块（梯度桥）+ CNN 后端级联，用 KWS 交叉熵端到端优化——增强网络学会保留判别要用的声学细节。
        - listitem [ref=f32e22]: ◆ 两个附带结论：Mel 频谱图优于功率谱图（听觉对齐 + 低维度双赢）；预训练+联合微调优于从头联训（降噪先验值得单独喂一次）。
