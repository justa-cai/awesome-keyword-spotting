    - generic [ref=f32e120]:
      - generic [ref=f32e121]: "前向: 带噪 Mel → CRN(编码卷积→LSTM→转置卷积) → 变换块 → CNN → P(关键词) 损失: L = CE(KWS 输出) ← 唯一目标——不再有 SNR/PESQ 项 反向: ∂L/∂θ_CRN ≠ 0 ← 梯度穿过变换块, 增强前端被重新教育 训练: ① CRN 独立预训练 → ② 级联联合微调（快于且优于从头联训）"
      - generic [ref=f32e122]: 人话：原来保洁阿姨按「看起来干净」打扫，把主人办案用的线索也当垃圾扔了；现在让侦探（KWS 后端）直接给阿姨打分——什么东西要留下、什么可以扫走，按办案需要来。
    - paragraph [ref=f32e123]: "这与 #18（Optimize What Matters）是同一哲学的两种落点：#18 打通的是 HMM 解码器（检测分当损失），本文打通的是增强前端（降噪为判别服务）——共同的信条：别让中间组件优化自己的小目标。"
