  - generic [ref=f54e292]:
    - generic [ref=f54e293]: "05"
    - heading "可迁移的判断" [level=2] [ref=f54e294]
    - generic [ref=f54e295]:
      - generic [ref=f54e296]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f54e297]: ① 把「声学建模」与「类目知识」放进不同容器，各自独立更新。
      - generic [ref=f54e298]: ↳ 网络管通用能力（训练一次固定）、解码图/FST 管词表（随时增删）——两类知识的变化周期完全不同（声学十年不变、词表天天可能改），分容器是按变化频率解耦的架构原则，适用于任何「通用引擎 + 动态配置」的系统。
      - paragraph [ref=f54e299]: ② 中间表示的选择 = 买哪种先验。
      - generic [ref=f54e300]: "↳ 音素（本文）买语言学先验——可解释、词典可用，但受 G2P 与音素识别质量约束；嵌入（Naver #11）买数据适应性——不依赖语言学但黑盒；滤波器（Snips #11）买模板精度——样本省但不可读。先验与灵活性的权衡在中间表示选择时就定了。"
      - paragraph [ref=f54e301]: ③ blank/自环这类「吸收不确定性的结构」是解耦的隐形功臣。
      - generic [ref=f54e302]: ↳ CTC 的 blank 吸收对齐不确定性、FST 自环吸收时长不确定性——系统各层之间需要这类「弹性接口」来隔离误差；设计 pipeline 时主动预留吸收不确定性的位置，比追求每层精确更稳健。
    - paragraph [ref=f54e303]: "系列坐标：开放词表四条路线的「音素+解码器」分支——本文（2019 高通）与 #11 Snips（预测滤波器）、#23 Sonos（音素+量化）、#11 Naver（嵌入原型）同年或前后相继，四条路线各有甜点；2021 年 TAML 把注册改成文本锚定（连音频样本都不用）——这条谱系的主线始终是「词知识放哪、怎么生成」的中间表示演化。"
