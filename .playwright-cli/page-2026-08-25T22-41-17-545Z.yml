    - generic [ref=f54e173]:
      - generic [ref=f54e174]: "CTC: P(音素|帧) 网格 — 含 blank 行, 训练一次固定 ← 通用耳朵 FST: 关键词 → 音素序列 → 状态转移图(自环+多路径) ← 可换词典 匹配: Viterbi(网格, FST图) → 最优路径分数 > θ → 触发 注册: 查词典拿音素转录 → 图上加一条链 → 零训练"
      - generic [ref=f54e175]: 人话：CTC 是个不知疲倦的速记员，每时每刻记下「现在听着像哪个音」；FST 是你要找的那句话的「拼图模板」；Viterbi 拿着模板在速记本上滑——拼上了就报警。要找新词就换一块新模板，速记员永远不用重新培训。
    - paragraph [ref=f54e176]: CTC 的 blank 是整个设计的润滑剂：它吸收了「音素之间的静音与过渡」这个最麻烦的对齐问题——不需要帧级标注就能训练；解码时 blank 也让路径可以自由跳过过渡段，匹配对语速变化天然鲁棒。
