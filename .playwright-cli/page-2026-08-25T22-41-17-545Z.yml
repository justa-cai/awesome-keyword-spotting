  - generic [ref=f54e13]:
    - generic [ref=f54e14]: "01"
    - heading "问题：封闭词表的三个不够用" [level=2] [ref=f54e15]
    - generic [ref=f54e16]:
      - generic [ref=f54e17]: TL;DR
      - list [ref=f54e18]:
        - listitem [ref=f54e19]: ◆ 绝大多数 KWS 为固定词表设计（OK Google / Alexa / Hey Siri）——加词要重收数据、重训模型或大改模型；三个不够用的场景：用户自定义、多语言方言（每语种单独训太贵）、快速部署（重训周期太长）。
        - listitem [ref=f54e20]: ◆ 双模块解耦：CTC 音素后验生成器（大规模语音训练一次即固定——通用的「耳朵」）+ FST 关键词解码器（词编成音素状态图——可随时更新的「词典」）。
        - listitem [ref=f54e21]: ◆ 注册流程三步零训练：查音素转录（词典或自动音素化）→ 加进 FST 图 → 完事——CTC 网络一行不改。
        - listitem [ref=f54e22]: ◆ FST 的天然优势：自环支持重复与停顿、多路径支持变体发音、可加语言模型约束减误报——这些「语言学知识」免费进了解码图。
