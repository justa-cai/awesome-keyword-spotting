    - generic [ref=f54e84]: "02"
    - heading "机制：网格与状态图" [level=2] [ref=f54e85]
    - paragraph [ref=f54e86]: CTC 输出一个音素后验网格——行是音素（加 blank），列是帧，颜色深浅是概率高低；FST 把「hello」编成 HH→AH→L→OW 的状态转移图。Viterbi 解码在网格上找与图最匹配的路径：blank 行吸收静音与过渡段（这正是 CTC 不需要帧级对齐标注的原因），自环容忍音素重复，多路径容纳异读变体。
