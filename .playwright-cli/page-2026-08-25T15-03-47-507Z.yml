    - text: 问题：全局建模的两条老路与新选项
  - generic [ref=f276e23]: 感受野账单 vs 二次税账单
  - generic [ref=f276e24]:
    - generic [ref=f276e25]:
      - heading "CNN 的感受野账单" [level=3] [ref=f276e26]
      - paragraph [ref=f276e27]: 3–5 帧的局部核捕短时特征没问题，但关键词的判别信息一半在长程：音素序列的时序结构、韵律模式、语调轨迹——跨整段的依赖要靠堆多层换感受野，参数与计算随之线性涨。
    - generic [ref=f276e28]:
      - heading "注意力的二次税账单" [level=3] [ref=f276e29]
      - paragraph [ref=f276e30]: softmax(QKᵀ)V 直接建模任意两帧关系，但每个查询要与所有键点积——O(n²) 在序列变长时成为瓶颈；softmax 的逐对归一化还让训练需要 warmup 才稳。
    - generic [ref=f276e31]:
      - heading "λ 学到什么" [level=3] [ref=f276e32]
      - paragraph [ref=f276e33]: 可视化 λ 权重矩阵：Lambda 层学到关键词内不同时间段之间的关联——如「yes」的 /j/ 段与 /s/ 段的联系被编码进同一个变换。与注意力的逐对权重不同，λ 表达的是整段语音的统计性时间结构。
    - generic [ref=f276e34]:
      - heading "中间态的定位" [level=3] [ref=f276e35]
      - paragraph [ref=f276e36]: CNN 只有局部、注意力逐对爆炸——Lambda 是两者之间的中间态：全局（上下文全部参与）、紧凑（一个 d_k×d_v 矩阵）、线性（O(n)）。代价是所有时间步共享同一变换——损失了逐位置的特异性。
