  - generic [ref=f276e97]: 键值外积 · 共享变换 · 四个消融甜点
  - generic [ref=f276e98]:
    - generic [ref=f276e99]: "自注意力: Y = softmax(QKᵀ)·V # 逐对：O(n²·d)，n×n 矩阵必须物化 Lambda: λ = softmax(Kᵀ)·V # 压缩：(d_k, d_v) 变换，与 n 无关 y_t = Q_t · λ # 应用：所有时间步共享同一个 λ 多头: d_k 切成 H 份，每头独立算 λ 并应用，拼接后投影"
    - generic [ref=f276e100]: 人话：注意力问「每一对帧的关系是什么」，Lambda 问「整段语音作为一个整体给查询施加什么变换」——前者表达力强但要付 n²，后者把上下文烧成一个紧凑矩阵，生成和应用都是 O(n)。softmax 沿时间维归一化保证 λ 是对序列的加权统计，而不是某个位置的主导。
  - generic [ref=f276e101]:
    - generic [ref=f276e102]:
      - heading "插入位置的门道" [level=3] [ref=f276e103]
      - paragraph [ref=f276e104]: 太早（浅层）特征太底层，全局交互在原始频谱模式上无意义；太晚序列已被过度压缩，长程信息已丢——中间层（第 4–5 层卷积后）恰好是「特征已成形、信息未压缩」的窗口。这个甜点与 Res2Net/多尺度融合的中间层插入结论同构。
    - generic [ref=f276e105]:
      - heading "训练稳定性的隐藏红利" [level=3] [ref=f276e106]
      - paragraph [ref=f276e107]: 无 softmax 逐对归一化 → 不需要学习率 warmup（标准注意力要）——训练流水线更简单；计算图更简、参数更少（不需要每位置的大 K/V 投影）——这些优势与序列长度无关，是 KWS 上最实际的三条卖点。
