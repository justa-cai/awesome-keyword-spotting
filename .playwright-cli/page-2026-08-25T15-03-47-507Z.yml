  - generic [ref=f276e321]:
    - generic [ref=f276e322]: 可迁移判断
    - paragraph [ref=f276e323]: ↳ 「压缩上下文成共享变换」是逐对注意力的第三条路：表达力换复杂度的交易在中间态成交——当任务需要的是统计性时间结构（韵律、整体模式）而非逐位置特异性时，λ 的假设恰好成立。
    - paragraph [ref=f276e324]: ↳ 复杂度优势要对着自己的 n 算：O(n²) vs O(n) 在 n=50 上差距很小——线性注意力的卖点按序列长度分档：短序列上买参数与稳定性，长序列上才买速度。选型前先量自己的 T。
    - paragraph [ref=f276e325]: ↳ 全局模块插中间层的规律再次应验：太早特征未成形、太晚信息已压缩——Lambda 的位置消融与多尺度融合、注意力插入的结论同构；「中间层是全局建模的窗口」可当默认假设。
    - paragraph [ref=f276e326]: ↳ 训练稳定性是被低估的工程属性：免 warmup 意味着流水线更简单、调参更少——在复杂度差距不大的候选间，选训练行为更稳的那个往往是工程上的正解。
