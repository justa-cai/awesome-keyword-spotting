- generic [ref=f276e2]:
  - generic [ref=f276e3]: 论文精读 · 可视化版 · 2021 №9
  - heading "上下文不必逐对算： 把它压成一个线性函数，长程交互免二次税" [level=1] [ref=f276e4]: 上下文不必逐对算：把它压成一个线性函数，长程交互免二次税
  - generic [ref=f276e5]:
    - generic [ref=f276e6]: Temporal Lambda Networks · 加泰罗尼亚理工大学
    - generic [ref=f276e7]: arXiv 2104.08086 · Lambda 层首次进语音
    - generic [ref=f276e8]: DS-CNN 主干 + 1–2 个 Lambda 层 · O(n) 长程建模
    - generic [ref=f276e9]: GSC v2 约 95–96% · vs 标准注意力计算 −30–50%
  - generic [ref=f276e10]: 一句话：CNN 靠堆深度换感受野，自注意力直接建模任意两帧但付 O(n²)。本文把视觉领域的 Lambda 网络（Bello 2021）首次引入 KWS：不逐对算关系，而是把整个时间上下文压缩成一个 (d_k, d_v) 的线性变换 λ = softmax(Kᵀ)·V，再作用到每个查询——生成为 O(n)、应用也是 O(n)。插在 DS-CNN 第 4–5 层后的 1–2 个 Lambda 层拿到约 1 个点的全局建模红利，与标准注意力差距 <1%，计算量省 30–50%，训练还不用 warmup。
  - generic [ref=f276e11]:
    - generic [ref=f276e12]: TL;DR
    - listitem [ref=f276e13]: ◈ 两难老问题：CNN 局部核（3–5 帧）要堆多层才覆盖整段，参数计算随之涨；自注意力能建模任意两帧但 O(n²)，训练还要 warmup——长程时间依赖（音素序列结构、韵律、语调轨迹）始终是两边的痛。
    - listitem [ref=f276e14]: ◈ Lambda 的范式转换：自注意力对每个查询与所有键逐对算关系；Lambda 先把整个上下文压成一个线性变换 λ = softmax(Kᵀ)·V（沿时间维归一化的键值外积，形状 d_k×d_v），再让每个时间步的查询乘同一个 λ——「压缩再应用」，n 只线性进入。
    - listitem [ref=f276e15]: ◈ 计算流五步：Q=XW_q · K=XW_k · V=XW_v → λ=softmax(Kᵀ)·V → y_t=Q_t·λ → 输出投影 + 残差。多头版把 d_k 切 H 份各算各的 λ——不同子空间捕不同类型的时间依赖。
    - listitem [ref=f276e16]: ◈ 集成方式：DS-CNN 照常提局部特征，Lambda 层插在第 4–5 层卷积后（太早特征太底层、太晚序列已被过度压缩）；插 1–2 个拿大部分收益，≥3 个递减——全局建模不需要堆。
    - listitem [ref=f276e17]: ◈ 结果（约值）：GSC v2 12 类 95–96%（DS-CNN 94–95）；与标准注意力差距 <1%、计算量 −30–50%；Lambda 层只加 5–10% 参数（不需要每位置的大 K/V 投影）。
    - listitem [ref=f276e18]: ◈ 消融甜点全套：位置第 4–5 层后 · 层数 1–2 · d_k=64 · 头数 H=4（优于 1 和 8）——复现的起点配置齐全。
    - listitem [ref=f276e19]: ◈ 短序列的诚实账：T≈50 时 O(n²) 本就不突出——Lambda 在 KWS 常规长度上的加速有限，常数因子吃掉大头；真正的效率优势要在数百帧以上的序列（ASR、连续语音关键词搜索）才显现。KWS 上的实际卖点是参数更少、计算图更简、训练免 warmup——三条都不依赖序列长。
    - listitem [ref=f276e20]: ◈ 边界：λ 的计算（softmax(Kᵀ)·V）需要完整序列——非因果、流式未适配；未与 Performer/线性 Transformer/Linformer 横比；仅 GSC 干净数据；无延迟实测。
