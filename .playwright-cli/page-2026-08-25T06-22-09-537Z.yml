  - heading "§05 局限与边界" [level=2] [ref=f224e276]:
    - generic [ref=f224e277]: §05
    - text: 局限与边界
  - generic [ref=f224e278]: 线性正交的天花板
  - generic [ref=f224e279]:
    - generic [ref=f224e280]:
      - heading "线性 ≠ 高阶独立" [level=4] [ref=f224e281]
      - paragraph [ref=f224e282]: 正交保证线性相关性为零，但 f_KWS² 与 f_SV² 可能统计相关——KWS 特征可能仍含说话人的高阶信息；HSIC 等核方法可捕获高阶依赖但计算从 O(d) 涨到 O(N²)。
    - generic [ref=f224e283]:
      - heading "对称架构 + batch 近似" [level=4] [ref=f224e284]
      - paragraph [ref=f224e285]: 两分支需同维（内积良定义）——最优架构差异大时需额外投影；L_orth 用 batch 内均值近似总体期望，小 batch 时误差大约束不稳。
    - generic [ref=f224e286]:
      - heading "文本相关 SV 可能过严" [level=4] [ref=f224e287]
      - paragraph [ref=f224e288]: 语音密码场景中 SV 必须同时验证「说了什么」和「谁说的」——两任务信息耦合更强，正交可能约束掉对两任务都有用的信息。
    - generic [ref=f224e289]:
      - heading "验证范围" [level=4] [ref=f224e290]
      - paragraph [ref=f224e291]: 全部干净条件下实验——噪声/远场/混响未测（共享底层特征质量下降时正交是否仍有效未知）；未与 HSIC/CCA 等其他独立性度量系统对比；中文数据集未公开、只报相对趋势；λ 与 α 需按数据重调。
  - generic [ref=f224e292]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f224e293]
    - list [ref=f224e294]:
      - listitem [ref=f224e295]: ↳ 两任务共享底层但判别目标正交时，「联合训练 + 显式解耦」优于独立部署——互补监督打磨共享特征，解耦约束防止信息互相污染。
      - listitem [ref=f224e296]: ↳ 对抗训练能做的解耦，先看一个内积正则能不能做——良态梯度、天然双向、零额外网络，性价比高一个数量级。
      - listitem [ref=f224e297]: ↳ 解耦约束不是表达能力的敌人：去掉干扰信息后每个分支反而更专注——担心「约束限制表达」前先做消融。
      - listitem [ref=f224e298]: ↳ 特征空间的偏差（说话人/内容）会在下游变成产品的不公平——公平性问题的源头可能在表示层而不在决策层。
      - listitem [ref=f224e299]: ↳ 多任务扩展的成本是组合数：M 个任务需 C(M,2) 对两两正交约束——任务数增长时约束数量平方级增长。
