  - generic [ref=f224e108]:
    - generic [ref=f224e109]: L_total = L_KWS + L_SV + λ·L_orth ； L_orth = ‖(1/N) Σᵢ f_KWSⁱ·(f_SVⁱ)ᵀ‖²_F
    - generic [ref=f224e110]: 人话：batch 内把每个样本的 KWS 特征与 SV 特征做内积再取平均——最小化它的范数，就是逼两个特征空间统计上互不共变。信息论视角：线性正交是互信息为零的必要条件（非充分——高阶依赖可能残留）；正交向量集在 d 维空间信息压缩效率最优（每维携带独特信息无冗余）。
  - paragraph [ref=f224e111]: 为什么对称双分支：两个分支同结构同维度，正交约束才在几何上有意义（d 维向量内积良定义）；为什么共享底层卷积：低级声学特征（频谱包络形状、短时能量变化）本就是两个任务共同需要的基础表示。若两任务最优架构差异大（KWS 要 CNN、SV 要 Transformer），需额外线性投影到同维。
