    - heading "「说什么词」⊥「谁说的」： 一个内积损失做双向解耦" [level=1] [ref=f224e5]: 「说什么词」⊥「谁说的」：一个内积损失做双向解耦
    - generic [ref=f224e6]:
      - generic [ref=f224e7]: 北大深研院 ADSPLAB × 小米 · arXiv 2203.16772
      - generic [ref=f224e8]: KWS + SV 联合训练
      - generic [ref=f224e9]: 正交性正则 L_orth
      - generic [ref=f224e10]: GSCD 英文 + 小米中文唤醒词
    - generic [ref=f224e11]: 独立训练的 KWS 隐含说话人偏差（男声训练集 → 女性唤醒率降）、SV 隐含内容偏差——一个对称的双分支网络加正交约束，两个任务同时涨、参数还省三成。
    - generic [ref=f224e12]:
      - heading "一分钟版本" [level=3] [ref=f224e13]
      - list [ref=f224e14]:
        - listitem [ref=f224e15]: ▸ 场景：智能设备唤醒时既要确认「说了正确的词」（KWS）又要验证「是授权用户说的」（SV）——两个功能同时、连续运行；同一段语音同时编码内容与身份两类信息。
        - listitem [ref=f224e16]: ▸ 独立训练的偏差：KWS 可能隐含编码说话人信息（对特定说话人更敏感、不公平）；SV 可能隐含编码内容信息（对高频词验证更准）——耦合表示在对抗攻击前也更脆弱。
        - listitem [ref=f224e17]: ▸ 老路线的坑：串联/注意力的信息流单向且不保证「净化」（辅助信息可能带噪声）；双重注意力无显式解耦——表示是混合的；对抗解耦（GRL）min-max 不稳定、只能单向、难调参。
        - listitem [ref=f224e18]: ▸ 方法：共享 1D 卷积底层（通用声学特征）→ 对称双分支 GRU（各 128 维）→ 正交约束 L_orth = ‖(1/N)Σ f_KWS·(f_SV)ᵀ‖²_F——内积为零意味着任何维度上都没有共变关系。
        - listitem [ref=f224e19]: ▸ 为什么正交合适：优化上良态（二次函数、梯度连续——不像 min-max 有不连续梯度）；天然双向（f_KWS⊥f_SV ⟺ f_SV⊥f_KWS）；一个标量损失同时解决两个方向。
        - listitem [ref=f224e20]: ▸ 总损失：L_KWS + L_SV + λ·L_orth，每个分支 = CE + α·Triplet——CE 优化分类面、Triplet 优化嵌入结构，两者互补。
        - listitem [ref=f224e21]: ▸ 主结果：KWS EER 1.31%（独立训练 1.8–2.0，相对降 30–35%）；SV EER 1.87%（独立 2.2–2.5，相对降 15–25%）；参数 280K = 独立模型总和的 60–70%。
        - listitem [ref=f224e22]: ▸ 打破固有认知：联合训练必然性能折衷？——信息被正确解耦后共享底层特征被两个互补监督共同打磨，反而更好（双赢）。
        - listitem [ref=f224e23]: ▸ 消融：有 vs 无正交 KWS 准确率 +1–2%、SV EER −0.5~1 点——解耦不是限制表达而是去干扰；λ∈[0.1,1.0] 稳定（<0.3%）、最优 0.5、>10 被正交主导；去三元组掉 0.5–1%。
        - listitem [ref=f224e24]: ▸ 边界：线性正交 ≠ 高阶独立（f² 间可能仍相关）；对称架构要求同维；batch 内均值近似有误差；文本相关 SV 可能过严；全干净条件无噪声测试；未与 HSIC/CCA 对比。
    - heading "§01 问题：互相污染的双任务特征" [level=2] [ref=f224e25]:
      - generic [ref=f224e26]: §01
      - text: 问题：互相污染的双任务特征
    - generic [ref=f224e27]: 判别目标正交但底层表示共享
    - paragraph [ref=f224e28]: 人类听觉系统能自然分离「说什么」和「谁说的」，人工神经网络能否学会这种分离是本文的研究问题。KWS 与 SV 使用不同数据集和架构独立训练，无法利用两任务间的互补信息——更深层的问题是互相隐含编码对方的信息产生偏差，对公平性（不同性别/年龄/口音用户的一致服务质量）和安全性（模仿攻击绕过双重验证）都有影响。
    - generic [ref=f224e29]:
      - generic [ref=f224e30]:
        - heading "单向信息流的局限" [level=4] [ref=f224e31]
        - paragraph [ref=f224e32]: 串联（SV 特征拼接到 KWS 特征后）或注意力（SV 特征加权 KWS 特征）——信息流单向，缺乏双向交互与互惠学习；更无法保证「净化」：SV 特征中混入的内容信息可能误导 KWS。
      - generic [ref=f224e33]:
        - heading "对抗解耦的三个根本困难" [level=4] [ref=f224e34]
        - paragraph [ref=f224e35]: 梯度反转层需要额外判别器在 min-max 博弈中优化——判别器与主干需精确平衡否则发散；只能保证单向解耦；对抗损失对 λ 极其敏感。正交性正则三个困难全部绕开。
