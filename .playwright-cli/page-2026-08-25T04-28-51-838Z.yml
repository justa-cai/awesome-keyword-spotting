      - text: (LayerNorm(X))
    - generic [ref=f189e142]: 人话：频率混合把特征图在频率维展平成 (B, T, C×F) 过一个全连接再 reshape 回来——一次性建立所有频率通道之间的关联；时间混合同理作用于整个时间窗。残差连接保证恒等映射可行，LayerNorm 稳定混合层的输入分布。
  - paragraph [ref=f189e143]: 为什么按轴拆开：视觉 MLP-Mixer 的 patch/channel 混合不区分空间维度，但频谱图的两个轴物理意义不同——时间轴编码语音动态（音素序列），频率轴编码频谱包络（能量分布）。元音共振峰在 200–800Hz、辅音 /s/ 在 3000–7000Hz、爆破音是宽带短时爆发——跨频能量分布模式本身就是判别信息；而关键词的判别性又依赖时间结构（stop 的 /s/→/t/→/a/→/p/）。两个轴各给一个全局混合，比通用 2D 结构更贴数据。
  - paragraph [ref=f189e144]: 课程学习为什么有效：固定增强的两难本质是「难度梯度失控」——课程学习控制训练样本的难度梯度，先在干净数据上学音素级区分，再逐步加噪声难度，让模型在有能力消化极端样本之后才见到它们。阶段转换不靠人工轮数，靠 Score = Norm(Acc) − Norm(Loss)：准确率涨不动而损失还在降 = 当前难度已学会、开始过拟合，自动切下一阶段。
