    - generic [ref=f189e4]: 论文精读 · 可视化版 · 2022 №8
    - heading "119K 参数拿下 98.2%： 把自注意力换成双维度 MLP 混合" [level=1] [ref=f189e5]: 119K 参数拿下 98.2%：把自注意力换成双维度 MLP 混合
    - generic [ref=f189e6]:
      - generic [ref=f189e7]: ConvMixer · arXiv 2201.05863
      - generic [ref=f189e8]: 阿里巴巴 × 南洋理工大学
      - generic [ref=f189e9]: MLP-Mixer 思想引入 KWS
      - generic [ref=f189e10]: 五阶段课程学习 · 远场噪声
    - generic [ref=f189e11]: 全局时/频特征交互不必靠 O(T²) 的注意力——两个 O(n) 的 MLP 混合层就够了；再配上「由易到难」的渐进训练，−10dB 下多扛 5.4 个点。
    - generic [ref=f189e12]:
      - heading "一分钟版本" [level=3] [ref=f189e13]
      - list [ref=f189e14]:
        - listitem [ref=f189e15]: ▸ 张力：远场噪声鲁棒需要大感受野和大容量，端侧只给 100K 级参数、数十 M MACs——小型 CNN 感受野局部（DS-CNN-S 干净 94.4%、−10dB 掉到 60% 以下），Transformer 全局但计算量是小型 CNN 的 10 倍以上。
        - listitem [ref=f189e16]: ▸ 架构：预卷积（1D DSConv）→ 4× ConvMixer 块（频率 2D DSConv + 时间 1D DSConv + 频率混合 MLP + 时间混合 MLP）→ 平均池化 + 全连接。共 119K 参数 / 22.2M MACs。
        - listitem [ref=f189e17]: ▸ 核心思路：借视觉 MLP-Mixer 的「无注意力、无全局卷积、只用 MLP 做全局交互」，并针对频谱图把混合拆成时间轴和频率轴两个独立操作——两个轴物理意义不同（动态 vs 包络）。
        - listitem [ref=f189e18]: ▸ 复杂度账：自注意力 O(T²·d) 约 102K/层，MLP 混合 O(T·d) 约 5K/层——约 1/20 的计算量，同样提供全局时/频交互。
        - listitem [ref=f189e19]: ▸ 干净集结果：98.2% 超参数量 5 倍的 KWT-1（607K，97.7）和 6.5 倍的 MHAtt-RNN（784K，97.3），与约 1.1M 的 KWT-2（98.0）相当。
        - listitem [ref=f189e20]: ▸ 课程学习：五阶段（干净 → +0dB → +−5dB → +−10dB → +RIR），用 Score = Norm(Acc) − Norm(Loss) 见顶自动切换阶段；提升随 SNR 降低而增大：20dB +2.98 → −10dB +5.38。
        - listitem [ref=f189e21]: ▸ 消融：去频率混合 −3.0、去时间混合 −2.5、都去退化回纯卷积基线（66.5%）——两个维度的信息增益互补；噪声阶段贡献约 70% 鲁棒性提升、RIR 阶段约 30%。
        - listitem [ref=f189e22]: ▸ 同预算对比：119K 预算下 MLP 混合比自注意力高约 1.5 点——注意力的 Q/K/V 投影吃掉大量参数，MLP 把参数全花在全局变换上。
        - listitem [ref=f189e23]: ▸ 边界：MLP 混合是固定权重线性变换，不能按内容「选择性聚焦」；−10dB 绝对值 71.88% 仍远低于实用线（>90%）；全连接要求固定长度输入。
        - listitem [ref=f189e24]: ▸ 可迁移判断：全局交互有比注意力便宜一个数量级的实现；按数据模态的物理结构设计架构（时频频谱图 → 双轴分别混合）优于套通用结构。
    - heading "§01 问题：噪声鲁棒 vs 极小模型的根本张力" [level=2] [ref=f189e25]:
      - generic [ref=f189e26]: §01
      - text: 问题：噪声鲁棒 vs 极小模型的根本张力
    - generic [ref=f189e27]: 远场三重退化 × 100K 参数预算
    - paragraph [ref=f189e28]: 智能家居、车载、工业物联网的 KWS 同时面对远场退化和资源约束：混响（RIR 多径，T60 约 0.3–0.8s）抹平瞬态特征；环境噪声在 SNR 低至 −10dB 时可能完全淹没关键词信号；传播距离带来 10–20dB 能量衰减。而部署目标可能是主频低于 100MHz、SRAM 不足 256KB 的智能灯泡/温控器——参数量 100K 级、计算量数十 M MACs 级。
    - generic [ref=f189e29]:
      - generic [ref=f189e30]:
        - heading "小型 CNN：局部感受野的噪声脆弱性" [level=4] [ref=f189e31]
        - paragraph [ref=f189e32]: DS-CNN、TC-ResNet、BC-ResNet 靠深度可分离卷积 + 残差压计算量，但 3×3 卷积只覆盖 3 帧 × 3 频道。低 SNR 下局部特征被污染，判断「有没有关键词」需要大范围时频上下文的全局一致性——超出局部卷积能力。DS-CNN-S 干净 94.4%，−10dB 骤降到 60% 以下。
      - generic [ref=f189e33]:
        - heading "Transformer + 固定增强：两个老坑" [level=4] [ref=f189e34]
        - paragraph [ref=f189e35]: KWT-1（607K）/AST-Tiny（约 5M）靠全局注意力鲁棒，但 O(N²·d) 复杂度让计算量达数百 M MACs，是小型 CNN 的 10 倍以上。固定噪声增强则两难：太弱（只练 20dB）泛化不足；太强（直接 −10dB）未收敛的模型看到的是纯噪声，拿不到有效学习信号。
