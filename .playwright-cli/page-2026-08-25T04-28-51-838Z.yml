  - generic [ref=f189e322]: 线性混合的能力边界在哪
  - generic [ref=f189e323]:
    - generic [ref=f189e324]:
      - heading "−10dB 绝对性能瓶颈" [level=4] [ref=f189e325]
      - paragraph [ref=f189e326]: 71.88% 远低于实用要求（>90%），与 AST-Tiny（−10dB 80%+）仍差约 10 点。线性变换无法像注意力那样按输入内容动态调整权重——极端噪声下选择性聚焦能力受限。
    - generic [ref=f189e327]:
      - heading "细粒度时间对齐与变长输入" [level=4] [ref=f189e328]
      - paragraph [ref=f189e329]: 区分 yes/yet（最后 50ms 差异）需要精确时间对齐，MLP 混合缺乏建模元素间交互关系的能力；全连接权重维度固定 → 只能定长输入，多字唤醒词（Hey Siri 约 2 秒）适应性差。
    - generic [ref=f189e330]:
      - heading "数据集单一" [level=4] [ref=f189e331]
      - paragraph [ref=f189e332]: 只在 GSC 上评估：样本约 1 秒、北美英语——声调语言（中文四声）、词缀丰富语言的泛化未知，多字唤醒词未验证。
    - generic [ref=f189e333]:
      - heading "训练成本与部署数据缺失" [level=4] [ref=f189e334]
      - paragraph [ref=f189e335]: 五阶段课程总训练时间约为标准的 3–5 倍（推理无额外开销）；只报 MACs，无实机延迟/功耗测量。
  - generic [ref=f189e336]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f189e337]
    - list [ref=f189e338]:
      - listitem [ref=f189e339]: ↳ 「全局交互」有比注意力便宜一个数量级的实现——先用 O(n) 的混合层试，不够再上注意力，不要默认全局=注意力。
      - listitem [ref=f189e340]: ↳ 按数据模态的物理结构设计架构：频谱图两轴意义不同就分开混合——通用结构（视觉 patch 混合）直接搬是次优的。
      - listitem [ref=f189e341]: ↳ 困难样本要从易到难喂：极端增强直接上会毁掉训练信号，课程式渐进 + 自动切换准则（准确率停涨而损失仍降）比固定轮数稳。
      - listitem [ref=f189e342]: ↳ 混响与噪声是两个独立退化因素，鲁棒性训练要分别覆盖（70/30 的贡献拆分说明只练噪声不够）。
      - listitem [ref=f189e343]: ↳ 架构改进与训练策略正交，可以独立优化并叠加——评测新架构时两轴都动才公平。
