        - text: x ∈ R^(T×D) → 冻结编码器 → z ∈ R^(B×M) → 投影 R^(B×64) → depthwise 卷积(Wk ∈ R^1024) → Perceiver → R^16 → ŷ；L_BCE 端到端（梯度穿检测网络与关键词编码器）
        - generic [ref=f32e123]: 与嵌入空间方法的本质差异：关键词不是「被比较的对象」而是「计算的一部分」——换一个词，卷积核就换了，后续交叉注意力行为随之改变。与 Bluche 的差异：权重不在孤立的单层 CNN 上，而在 Perceiver 内部、有完整注意力机制接力——「模板匹配定位 + 序列建模判决」串联。
