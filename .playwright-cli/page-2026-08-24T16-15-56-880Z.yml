      - generic [ref=f32e24]:
        - heading "一分钟版本" [level=2] [ref=f32e25]
        - list [ref=f32e26]:
          - listitem [ref=f32e27]: 三个痛点：封闭词表迭代成本高（新词要重训）；高性能开放词表模型太大（AdaKWS 设备端 13.5M 超标）；训练域外（L2 说话人、口音、噪声、未见语言）泛化没人系统验证。
          - listitem [ref=f32e28]: 核心设计：超网络从字符序列编译出一组 depthwise 卷积权重 Wk（|Wk|=1024），显式充当关键词专属的匹配滤波器——不是「听懂全句再找词」，是给每个词定制一个滑动模板探测器；卷积响应引导 Perceiver 交叉注意力完成序列级判决。
          - listitem [ref=f32e29]: 部署不对称：关键词编码器 2.7M 只在离线编译期存在——添加新词不重训、不更新设备模型，离线生成新 Wk 下发即可，设备上每词只占 1024 权重。
          - listitem [ref=f32e30]: 结果：4.2M 的最小配置 VoxPopuli F1 94.52 已超 13.5M 的 AdaKWS 复现版（91.93）；5.5M 的 c(4) 全场最佳 94.88。反直觉：参数更多的 w 系（8–10M Whisper）整体略逊于 c 系（4–6M Conformer）。
          - listitem [ref=f32e31]: 方法学贡献：首次把 Wildcat Diapix 引入 KWS 做 L1/L2 说话人分组评测（L2 仅轻微下降）；但流式/时延/内存完全未报告，Perceiver 整句级操作的流式化没碰。
