          - list [ref=f32e247]:
            - listitem [ref=f32e248]: 流式与时延完全未报告：Perceiver 的「变长到定长」+ 交叉注意力天然整句级——如何切窗流式化、流式化掉多少，没碰；唤醒系统要求低时延流式。
            - listitem [ref=f32e249]: 字符级编码无音素先验：近音不同形/同形不同音的混淆模式纯靠字符层负例覆盖；FLEURS 上 w 系崩塌可能与此有关，论文只标「意外」。
            - listitem [ref=f32e250]: 结构超参手工固定：核长 16（20ms 帧率下只覆盖 320ms 感受野）、N=64、S=16 无消融——更长短语适配性未验证，「为什么是 16」没答案。
            - listitem [ref=f32e251]: 参数量代理足迹：depthwise 卷积/交叉注意力在 MCU/DSP 上的算子支持度、量化敏感性、激活内存均未涉及。
            - listitem [ref=f32e252]: 噪声只测两种加性：白噪声 + pub 噪声且只以图呈现；混响/多说话人/回声未测。
