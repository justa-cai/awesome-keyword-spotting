    - generic [ref=f128e264]:
      - generic [ref=f128e265]: JUDGEMENT
      - paragraph [ref=f128e266]: ↳ 混合架构的设计原则是「按信息类型分工」：局部模式给卷积（便宜高效）、长程时序给循环（贵但必要）——分工的判据是「每类信息用哪种算子提取的成本最低」，而不是把最强架构堆上去。
      - paragraph [ref=f128e267]: ↳ 组件顺序有经济学：贵的组件要吃便宜的预处理产物——循环层直接啃原始频谱是在用高价算力做低价工作；「先提炼再建模」的次序选择本身就是参数效率的大头。
      - paragraph [ref=f128e268]: ↳ 「小胜大」是架构论文最有力的论据：230K 打过更大模型说明瓶颈在结构不在容量——此后 KWS 的主流叙事从「更大更准」转向「更聪明地小」，本文是这个转向的早期坐标点。
