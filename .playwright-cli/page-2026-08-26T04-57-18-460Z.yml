      - heading [level=1] [ref=f159e711]:
        - 'link "AutoKWS: Keyword Spotting with Differentiable Architecture Search" [ref=f159e712] [cursor=pointer]':
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=autokws-keyword-spotting-with-differentiable-architecture-search"
      - paragraph [ref=f159e713]:
        - strong [ref=f159e714]: 作者/机构
        - text: ": Hao Li, Xue Jiang, Zishen Huang, Ji Li, Yu Hu, Kai Li (Xiaomi AI Lab, 小米AI实验室)"
      - paragraph [ref=f159e715]:
        - strong [ref=f159e716]: 发表日期
        - text: ": 2020年9月 (arXiv:2009.03658)"
      - paragraph [ref=f159e717]:
        - strong [ref=f159e718]: 链接
        - text: ":"
        - link "https://arxiv.org/abs/2009.03658" [ref=f159e719] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2009.03658
      - paragraph [ref=f159e720]:
        - strong [ref=f159e721]: 关键词
        - text: ": 关键词检测, 可微分架构搜索, NAS, AutoML, 架构发现"
      - heading [level=2] [ref=f159e722]:
        - link "问题陈述" [ref=f159e723] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e9%97%ae%e9%a2%98%e9%99%88%e8%bf%b0"
      - paragraph [ref=f159e724]: KWS神经网络架构的设计通常需要深厚的领域专业知识和大量的试错实验。手工设计的架构存在设计者偏见,可能无法达到最优性能。不同KWS应用场景(不同关键词集、不同噪声条件、不同硬件平台)可能需要不同的最优架构,为每种场景手工设计架构不现实。
      - paragraph [ref=f159e725]: "AutoML技术提供了自动发现最优架构的可能,但现有的NAS方法在应用于KWS时面临:"
      - list [ref=f159e726]:
        - listitem [ref=f159e727]: 搜索空间定义缺乏KWS领域知识的指导
        - listitem [ref=f159e728]: 搜索效率低,需要大量计算资源
        - listitem [ref=f159e729]: 发现的架构可能不适合实际部署(参数量过大、延迟过高)
      - heading [level=2] [ref=f159e730]:
        - link "方法论" [ref=f159e731] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e6%96%b9%e6%b3%95%e8%ae%ba"
      - heading [level=3] [ref=f159e732]:
        - link "DARTS框架适配" [ref=f159e733] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=darts%e6%a1%86%e6%9e%b6%e9%80%82%e9%85%8d"
      - paragraph [ref=f159e734]: "AutoKWS基于DARTS(Differentiable Architecture Search)框架,并针对KWS任务进行了专门适配:"
      - paragraph [ref=f159e735]:
        - strong [ref=f159e736]: 连续松弛(Continuous Relaxation)
        - text: ":"
      - list [ref=f159e737]:
        - listitem [ref=f159e738]: 将离散的架构选择(选择哪种操作)转化为连续优化问题
        - listitem [ref=f159e739]: "每个节点使用softmax加权的混合操作: o_bar(x) = sum(softmax(alpha_i) * o_i(x))"
        - listitem [ref=f159e740]: alpha为架构参数,决定每个操作的权重
      - paragraph [ref=f159e741]:
        - strong [ref=f159e742]: 双层优化(Bi-level Optimization)
        - text: ":"
      - list [ref=f159e743]:
        - listitem [ref=f159e744]: 架构参数(alpha)和模型权重(w)交替优化
        - listitem [ref=f159e745]: 训练集更新模型权重,验证集更新架构参数
        - listitem [ref=f159e746]: 确保发现的架构具有良好的泛化能力
      - heading [level=3] [ref=f159e747]:
        - link "KWS专用搜索空间" [ref=f159e748] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=kws%e4%b8%93%e7%94%a8%e6%90%9c%e7%b4%a2%e7%a9%ba%e9%97%b4"
      - paragraph [ref=f159e749]: "针对小足迹KWS模型设计的搜索空间:"
      - list [ref=f159e750]:
        - listitem [ref=f159e751]:
          - strong [ref=f159e752]: 卷积操作
          - text: ": 3x3, 5x5标准卷积和深度可分离卷积"
        - listitem [ref=f159e753]:
          - strong [ref=f159e754]: 池化操作
          - text: ": 3x3平均池化, 3x3最大池化"
        - listitem [ref=f159e755]:
          - strong [ref=f159e756]: 特殊操作
          - text: ": 跳跃连接(Skip Connect), 零操作(None)"
        - listitem [ref=f159e757]:
          - strong [ref=f159e758]: 约束
          - text: ": 所有操作步长为1,使用相同padding保持特征图尺寸"
      - heading [level=3] [ref=f159e759]:
        - link "搜索与评估流程" [ref=f159e760] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e6%90%9c%e7%b4%a2%e4%b8%8e%e8%af%84%e4%bc%b0%e6%b5%81%e7%a8%8b"
      - list [ref=f159e761]:
        - listitem [ref=f159e762]: 定义包含多个Cell的超网络,每个Cell包含N个节点
        - listitem [ref=f159e763]: 在Google Speech Commands训练集上搜索,验证集上评估架构参数
        - listitem [ref=f159e764]: 搜索结束后,根据架构参数alpha选择每个节点的最优操作
        - listitem [ref=f159e765]: 用发现的架构重新训练并评估
      - heading [level=2] [ref=f159e766]:
        - link "主要贡献" [ref=f159e767] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e4%b8%bb%e8%a6%81%e8%b4%a1%e7%8c%ae"
      - list [ref=f159e768]:
        - listitem [ref=f159e769]:
          - paragraph [ref=f159e770]:
            - strong [ref=f159e771]: KWS领域的可微分NAS
            - text: ": 将DARTS框架成功适配到KWS任务,证明了可微分NAS在语音分类任务上的有效性。这是来自工业界(小米)的实践,具有较高的实用价值"
        - listitem [ref=f159e772]:
          - paragraph [ref=f159e773]:
            - strong [ref=f159e774]: 小足迹模型搜索空间
            - text: ": 设计了适合小足迹KWS模型的搜索空间,确保发现的架构在参数量和计算量上满足实际部署需求"
        - listitem [ref=f159e775]:
          - paragraph [ref=f159e776]:
            - strong [ref=f159e777]: 自动化架构设计
            - text: ": 提供了一种无需人工架构设计专业知识的自动化方法,降低了KWS系统开发的技术门槛"
        - listitem [ref=f159e778]:
          - paragraph [ref=f159e779]:
            - strong [ref=f159e780]: 架构模式发现
            - text: ": AutoKWS发现的架构模式与常见的手工设计不同,为KWS架构设计提供了新的设计灵感和方向"
      - heading [level=2] [ref=f159e781]:
        - link "实验结果" [ref=f159e782] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e5%ae%9e%e9%aa%8c%e7%bb%93%e6%9e%9c"
      - heading [level=3] [ref=f159e783]:
        - link "实验设置" [ref=f159e784] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e5%ae%9e%e9%aa%8c%e8%ae%be%e7%bd%ae"
      - list [ref=f159e785]:
        - listitem [ref=f159e786]: Google Speech Commands数据集
        - listitem [ref=f159e787]: 搜索空间:每个Cell包含4个节点,7种候选操作
        - listitem [ref=f159e788]: 搜索使用单个GPU
      - heading [level=3] [ref=f159e789]:
        - link "主要结果" [ref=f159e790] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e4%b8%bb%e8%a6%81%e7%bb%93%e6%9e%9c"
      - list [ref=f159e791]:
        - listitem [ref=f159e792]: AutoKWS发现的架构在Google Speech Commands上达到有竞争力的准确率
        - listitem [ref=f159e793]: 与手工设计的基线模型(如DS-CNN)相比,在相同参数量下精度更高
        - listitem [ref=f159e794]: 搜索过程比非可微分NAS方法(如强化学习、进化算法)更快
        - listitem [ref=f159e795]: 发现的架构表现出独特的设计模式:更多使用深度可分离卷积和非对称连接
      - heading [level=3] [ref=f159e796]:
        - link "架构可视化分析" [ref=f159e797] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e6%9e%b6%e6%9e%84%e5%8f%af%e8%a7%86%e5%8c%96%e5%88%86%e6%9e%90"
      - list [ref=f159e798]:
        - listitem [ref=f159e799]: 不同Cell的架构模式不同,说明NAS能够自动适应不同层的功能需求
        - listitem [ref=f159e800]: 浅层倾向于使用较大卷积核,深层更多使用小卷积核和跳跃连接
        - listitem [ref=f159e801]: 深度可分离卷积在大多数位置被选择,验证了其在KWS中的高效性
      - heading [level=2] [ref=f159e802]:
        - link "局限性与展望" [ref=f159e803] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e5%b1%80%e9%99%90%e6%80%a7%e4%b8%8e%e5%b1%95%e6%9c%9b"
      - heading [level=3] [ref=f159e804]:
        - link "方法局限" [ref=f159e805] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e6%96%b9%e6%b3%95%e5%b1%80%e9%99%90"
      - list [ref=f159e806]:
        - listitem [ref=f159e807]:
          - strong [ref=f159e808]: GPU资源需求
          - text: ": 搜索过程仍需要GPU资源,对小型团队可能构成门槛"
        - listitem [ref=f159e809]:
          - strong [ref=f159e810]: 搜索空间影响
          - text: ": 最终架构质量受搜索空间定义的影响,不合理的搜索空间可能限制发现更优架构"
        - listitem [ref=f159e811]:
          - strong [ref=f159e812]: 仅分类方法
          - text: ": 方法仅适用于分类式KWS,对序列到序列(如CTC、RNN-T)的KWS方法未涉及"
        - listitem [ref=f159e813]:
          - strong [ref=f159e814]: 迁移性未验证
          - text: ": 发现的架构在不同数据集和关键词集上的迁移性能未充分验证"
      - heading [level=3] [ref=f159e815]:
        - link "未来方向" [ref=f159e816] [cursor=pointer]:
          - /url: "#/papers/2020/AutoKWS_Keyword_Spotting_with_Differentiable_Architecture_Search?id=%e6%9c%aa%e6%9d%a5%e6%96%b9%e5%90%91"
      - list [ref=f159e817]:
        - listitem [ref=f159e818]: 引入硬件约束感知的搜索,将延迟和内存占用纳入搜索目标
        - listitem [ref=f159e819]: 扩展搜索空间,包含注意力机制、Transformer等现代架构组件
        - listitem [ref=f159e820]: 研究权重共享NAS方法,进一步降低搜索成本
        - listitem [ref=f159e821]: 探索一次性搜索适用于多种KWS场景的通用架构
        - listitem [ref=f159e822]: 结合量化感知搜索,直接发现对量化友好的架构
