      - generic [ref=f117e120]: 人话：模型不是背「哪个词配哪张嘴」，而是学「嘴怎么动对应怎么发音」的通用规律。查新词时，先把文字转成音素串（就像查词典拿拼音），再拿这个「拼音」去视频里找对应的嘴型——只要 G2P 认识这个词的文字，模型就不用重新训练。
