    - generic [ref=f117e207]:
      - generic [ref=f117e208]: JUDGEMENT
      - paragraph [ref=f117e209]: ↳ 零样本的通用配方是「中间表示可从文本生成」：查询侧只要能从文字现场算出嵌入（G2P 发音、语义编码器），训练侧学的是对应关系而非具体词——新词成本从「重收数据重训」降为「跑一次 G2P」，这是开放词汇系统的共同骨架。
      - paragraph [ref=f117e210]: ↳ 表示空间要选在「与感知模态同构」的那一层：唇动跟读音走、不跟拼写走——所以匹配要在发音空间做；选错表示层（字素）会让天生同音的样本在空间里被强行拉开，几何就帮倒忙了。
      - paragraph [ref=f117e211]: ↳ 直接训练检测目标优于「先转录再搜索」的级联：视觉 ASR 转录的误差会全部传进搜索，而端到端匹配让表示为检测目标优化——级联每加一级就引入一次目标错位，这也是音频侧 KWS 从 LVCSR 后处理走向端到端的同一课。
