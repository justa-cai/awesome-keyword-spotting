              - text: 怎么来；要么预训练实际没用 L
              - subscript [ref=f72e259]: Dual
              - text: （消融增益哪来的？），要么用了某种代理标签（未报告）。
            - listitem [ref=f72e260]: 不变性覆盖窄：正对只有语速 / 音量两种变换；说话人音色、信道、混响、加噪没进对齐目标——而评测条件恰恰是加噪管道。
            - listitem [ref=f72e261]: 压缩无量化：g、a、M 与实际压缩率均未给数值，无参数量 / FLOPs / 延迟对比——「压缩卷积层」之名缺量化支撑。
            - listitem [ref=f72e262]: 权重手工固定：0.8/0.05/0.05/0.1 无敏感性分析，换数据集是否适用未知。
            - listitem [ref=f72e263]: 防塌缩锚偏弱：时间平均 Fbank 只有 40 维；Table 2 消融未覆盖 L_x / L_x_aug 单项（无去掉重建分支的负对照）。
        - generic [ref=f72e264]:
          - heading "实验与写作完成度" [level=4] [ref=f72e265]
          - list [ref=f72e266]:
            - listitem [ref=f72e267]: 单任务、闭集、整词假设：只在 GSCv2 12 分类上做，输入是切好的 1 s 整词——不涉及流式检测、开放词表；引言引 QbE-STD 做动机却零 QbE 实验。
            - listitem [ref=f72e268]: 优势小且无统计检验：领先只有 0.5-1.4 点，无多次运行方差 / 显著性——稳健性打折。
            - listitem [ref=f72e269]: 表间数值对不上：Table 1 速度行 87.3/85.8 与 Table 2 sp-pre 87.8/86.9 不一致，两表训练语义（有无预训练）未说明。
            - listitem [ref=f72e270]: 数据口径矛盾：10 万条声明 vs 划分后 4.6 万条。
            - listitem [ref=f72e271]: v1 稿件细节：结论里方法名写成 CABKS、正文「Fig ??」失效引用、表行残留「&」、重建层被写成「softmax 输出」（重建 Fbank 均值用 softmax 不合常理，疑笔误）——引用结论需谨慎。
      - generic [ref=f72e272]:
        - text: 值得追的方向：① 增强族扩到加噪 / 混响 / 时频遮蔽并做组合系统搜索（论文自列未来工作）；② 把 L
        - subscript [ref=f72e273]: Dual
        - text: 的标签关系换成增强关系（同一原始语音的变体互为正对）或聚类伪标签——补上「真无监督」闭环；③ 兑现 QbE-STD / 开放词表动机：瓶颈表示天然适合模板检索，补 few-shot enroll 的检测式评测；④ 补效率维度并与 MatchboxNet / EdgeCRNN 正面对比；⑤ 与 wav2vec 2.0 / Noisy Student 组合或对照，检验更强基线下的边际价值；⑥ 多语言 / 低资源换词场景——方法动机里最有价值的落地叙事，论文反而没验证。
