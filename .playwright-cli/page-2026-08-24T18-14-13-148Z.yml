          - generic [ref=f72e244]: "3"
          - text: 域外预训练可用100 h 有声书（无标签、与任务不同域）预训练 ≥ 任务内数据预训练——一次预训练服务多次换词，这是换唤醒词场景最有价值的工程结论。
