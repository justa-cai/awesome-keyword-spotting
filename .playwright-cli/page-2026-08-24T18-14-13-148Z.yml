        - heading "一分钟版本" [level=2] [ref=f72e25]
        - list [ref=f72e26]:
          - listitem [ref=f72e27]: 痛点：标注正样本稀缺（换唤醒词就要重新采集，「耗时且耗资源」）；无标签语音几乎免费。架构侧卷积滑窗一视同仁、相邻窗口高度重叠产生大量冗余表示。
          - listitem [ref=f72e28]: 架构：压缩卷积层（帧卷积 → 注意力软池化——g 个重叠帧被学出来的 β 权重加权塌缩成 1 帧 → 残差块 GroupNorm）+ 2 层 Transformer（长时依赖）+ 末 2 帧特征选择 + 800 维瓶颈层 + 12 维投影。
          - listitem [ref=f72e29]: 预训练：同一条无标签语音做语速缩放 A(λ·t) / 音量缩放 λ·A(t)，两路过孪生共享网络，在瓶颈层做 MSE 对齐（L_sim，权重 0.8）——语义空间里的不变性约束；「重建时间平均 Fbank」分支当防塌缩锚（0.05×2）；双重对比损失把表示与分类器列对齐（0.1）。
          - listitem [ref=f72e30]: 结果：平均 10 dB SNR 加噪 GSCv2 12 分类，CAB 四种配置（两种预训练源 × Dev/Eval）全部第一（88.1-88.5%，超 CPC/APC/MPC 0.5-1.4 点）；域外 Librispeech-100 预训练反而更高——一次预训练可服务多次换词。
          - listitem [ref=f72e31]: 消融：速度单项远强于音量（+1.7 Dev）——音量在 log-Fbank 上近似平凡常数偏移，速度才逼模型学时间弹性对齐；对比学习主要补 Eval（泛化而非拟合）。
          - listitem [ref=f72e32]: 成色警告：标题写「无监督」，但双重对比损失的正样本集按真值标签构造——无标签预训练阶段 P_i 如何构造论文从未说明，逻辑缺口未填补；arXiv v1 完成度有限（失效引用、表间数值对不上）。
