      - heading "换词就要重采数据；滑窗卷积把冗余当饭吃" [level=2] [ref=f72e35]
      - generic [ref=f72e37]: 两个痛点：① 标注结构畸形——正样本（说出目标词的音频）在日常语音里占比极低、负样本长尾无界；商用唤醒词会更换，换词即重采，「耗时且耗资源」，低资源语言 / 小众唤醒词 / 快速迭代产品线反复支付这个成本，而有标签语料的无标签版本（有声书 / 播客）几乎免费。② 架构层冗余——一条语音只有部分片段与关键词高度相关，标准卷积对所有词窗口一视同仁，相邻窗口高度重叠产生大量冗余表示；非判别信息稀释特征、浪费容量，对 KWS 这种输入高度同质（都是短词）的任务伤害更明显。
