      - heading "607K 参数的 Transformer 塞不进 64KB 的单片机—— 裁到 1646 个参数，再把 GELU 焊进指令集" [level=1] [ref=f98e13]: 607K 参数的 Transformer 塞不进 64KB 的单片机——裁到 1646 个参数，再把 GELU 焊进指令集
