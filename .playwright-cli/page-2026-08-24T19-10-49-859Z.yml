      - generic [ref=f98e25]:
        - heading "一分钟版本" [level=2] [ref=f98e26]
        - list [ref=f98e27]:
          - listitem [ref=f98e28]: 三道墙：KWT-1 要 2.42 MB 内存，目标平台 lowRISC Ibex 只有 64 kB RAM / 50 MHz / 无 FPU——模型比内存大 37 倍；无 FPU 意味着一切浮点靠软件模拟（SoftMax 归一化、GELU 的除法尤其贵）；常驻监听下时钟周期数直接乘以每周期能耗 = 电池寿命。
          - listitem [ref=f98e29]: 反抽象的四步组合拳：① 迭代裁剪——逐层评估影响删最小的层：深度 12→1（一个 Transformer 层就够双类任务；深度容量主要为多类判别买单）、MLP 256→24、输入 [40,98]→[16,26]；② 静态 PTQ——权重 INT8 + 中间残差 INT16，scale 取 2 的幂（反量化退化成移位）；③ 裸机 C 自建 Transformer 张量库（8 个函数）+ 双内存银行替代 malloc；④ RISC-V 自定义指令把 GELU/SoftMax 换硬件查找表。
          - listitem [ref=f98e30]: 量化关键发现：非对称双 scale（权重 64 / 输入 32）82.5%——权重取值 0-1 可以用大 scale 提精度；输入幅值可达数百，提到 64 就撞溢出墙（65.2%，崩塌）。
          - listitem [ref=f98e31]: GELU 硬件近似（自认新颖点）：x>1.595 直接取 x、x<−1.857 取 0、过渡区 32 元素 LUT——阈值由梯度下降寻优，精度退化仅 0.0042%（比量化误差低两个数量级）。
          - listitem [ref=f98e32]: 账本：模型 2.42MB→1.65kB（369×）；周期 26M→5.5M（量化 2× + 指令 2.4× ≈ 4.7×，推断约 5× 功耗降）；精度 96.9→~80%（累计 −17 点）；面积 +29% + 2.69 kB ROM。每一步的代价都来自真实运行而非仿真——这是对「用仿真测加速、无法评估精度退化」的既有工作的正面回应。
          - listitem [ref=f98e33]: 成色缺口：只有双类（dog/notdog）——87.2%/82.5% 与 35 类的 96.9% 不在同一任务难度平面；~80% 精度对商用唤醒词不够且无 FAR/FRR；无外部基线（DS-CNN / TFLite Micro 没比）；功耗是周期数推断非实测。
    - generic [ref=f98e34]:
      - paragraph [ref=f98e35]: §01 · 问题陈述
      - heading "64 kB 的世界里，底层是唯一能挖的空间" [level=2] [ref=f98e36]
      - generic [ref=f98e38]: 两条线的盲区：① 硬件加速类（AI-RISC / AIfES / FlexACC / DaDianNao / RISC-VTF / A³）——从高功耗高性能系统视角出发，很少关注微控制器的内存第一瓶颈；且往往用仿真操作测加速比而非真实模型端到端——「加速带来多少精度退化」无从回答，因为被加速的不是一个真的、可验证精度的模型。② 软件部署生态（TFLite / ONNX / TVM）——库自身就几 MB，很多嵌入式平台连库都装不下；更深层是抽象边界错了：框架把工程师隔离在算子底层之外，想针对特定平台优化反而困难——通用性是用「摸不到底层的权利」换来的。四个子挑战：裁到什么程度精度不崩（哪些层能安全下刀）；无 FPU 的 scale 怎么选（精度 vs 溢出）；不用 MB 级框架裸机实现 + 手工内存管理；最小面积（~29%）的自定义指令把最耗时非线性算子换 LUT 换 ~5× 加速。
