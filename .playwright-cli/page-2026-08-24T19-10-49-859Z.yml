      - paragraph [ref=f98e15]: 作者：Aness Al-Qawlaq、Ajay Kumar M、Deepu John —— 都柏林大学学院（UCD）
      - paragraph [ref=f98e16]: 发表：2024.07 · arXiv:2407.16026 · 代码开源（anessk01/kwt_tiny）
      - generic [ref=f98e17]:
        - generic [ref=f98e18]: 1646 参数（−99.73%）
        - generic [ref=f98e19]: 非对称双 scale 量化
        - generic [ref=f98e20]: 裸机 C 张量库
        - generic [ref=f98e21]: 双内存银行
        - generic [ref=f98e22]: RISC-V custom-1 指令
