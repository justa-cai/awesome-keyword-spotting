      - paragraph [ref=f98e167]: §04 · 主要贡献
      - heading "可转述的四个判断" [level=2] [ref=f98e168]
      - generic [ref=f98e170]:
        - generic [ref=f98e171]:
          - generic [ref=f98e172]: "1"
          - text: 全真实 > 仿真加速训练-量化-裸机-上板贯穿始终——每一分加速对应的精度损失都有数字（82.5→~80），回应既有工作「仿真测加速、无法评估精度退化」的缺口。
        - generic [ref=f98e173]:
          - generic [ref=f98e174]: "2"
          - text: 裁剪知道哪里能下刀深度 12→1 + MLP 256→24 是安全刀口（深度容量主要为多类买单）；归一化向量 DIM 不能砍——砍它等于压缩表示本身。
        - generic [ref=f98e175]:
          - generic [ref=f98e176]: "3"
          - text: 非对称双 scale 有机理支撑权重 0-1 可用大 scale（64）提精度；输入幅值数百、scale 64 触发溢出（82.5→65.2）——不是经验调参而是取值范围的必然。
        - generic [ref=f98e177]:
          - generic [ref=f98e178]: "4"
          - text: 最小面积的非线性算子加速GELU 分段近似（梯度下降寻优阈值，退化 0.0042%）+ SoftMax LUT（依赖数值稳定形式的有界性）——29% 面积 + 2.69kB ROM 换 2.4× 周期。
    - generic [ref=f98e179]:
      - paragraph [ref=f98e180]: §05 · 局限性与展望
      - heading "双类设定让精度数字失去可比性；「迷你 Transformer 好不好」没关上" [level=2] [ref=f98e181]
      - generic [ref=f98e183]:
        - generic [ref=f98e184]:
          - heading "方法局限" [level=4] [ref=f98e185]
          - list [ref=f98e186]:
            - listitem [ref=f98e187]: 任务设定根本局限：双类（notdog 混 34 词为负类），87.2/82.5% 与 35 类 96.9% 不在同一难度平面；~80% 绝对精度对商用唤醒词不够，且无 FAR/FRR/DET。
            - listitem [ref=f98e188]: LUT 依赖标定：e^(max−x) ∈ [0,10] 是该模型/特征/数据上的经验事实——换模型越界就要重标，加速器不即插即用。
            - listitem [ref=f98e189]: 软件未优化：O(n³) 朴素矩阵乘、SoftMax/LN 仍浮点——周期数还有可观软件压缩空间。
            - listitem [ref=f98e190]: 功耗是推断：周期数 ×固定每周期能耗的假设，无实测；FPGA 动态功耗与 ASIC 流片有差距。
        - generic [ref=f98e191]:
          - heading "实验设计不足" [level=4] [ref=f98e192]
          - list [ref=f98e193]:
            - listitem [ref=f98e194]: 覆盖窄：单数据集、单平台、单次综合，无多种子无方差。
            - listitem [ref=f98e195]: 零外部基线：无 DS-CNN / BC-ResNet / MatchboxNet，也无 TFLite Micro 同平台实测——「1646 参数的 Transformer」在同预算下是否优于成熟 CNN 无从判断。
            - listitem [ref=f98e196]: 训练细节缺失：epoch / 优化器 / 学习率 / 数据划分全未报——结果难精确复现。
            - listitem [ref=f98e197]: scale 搜索粗：只 2 的幂五个组合；无 QAT 对照——PTQ 与 82.5% 之间还有多少空间未知。
            - listitem [ref=f98e198]: 无噪声/远场测试——唤醒词真实部署环境的常态缺位。
      - generic [ref=f98e199]: 值得追的方向：① 输出类扩展到多唤醒词 + 误唤醒 / 漏检率评估；② QAT 替代纯 PTQ + SoftMax/LN 定点化，彻底清除软浮点；③ LUT 有效域自动标定流程让加速器可移植；④ 矩阵乘换优化实现（分块 / 展开 / 乘加融合）、库扩展到卷积算子；⑤ 最有价值的补课：真实芯片或系统 FPGA 功耗实测 + 与 CNN 系小模型同 RAM 预算正面对比——回答「在微控制器上迷你 Transformer 到底是不是好选择」这个开了头没关上的问题；⑥ 线性 attention / 低秩近似等结构性降本 + VAD-KWS 级联摊薄平均功耗。
