  - generic [ref=f63e78]:
    - generic [ref=f63e79]: "02"
    - heading "机制：一格的责任与四项分工" [level=2] [ref=f63e80]
    - paragraph [ref=f63e81]: 网格责任制是 YOLO 的核心设计：词的能量区落在某格、中心在那格，就由那格负责检测——职责清晰不重复；预测框的 (x,y) 是中心在格内的相对位置、(w,h) 是时间跨度与频率范围。整个输出是一个 S×S×(B×5+C) 的张量——全图所有位置的检测在一次前向里同时出，这是「看一眼」的字面实现。
