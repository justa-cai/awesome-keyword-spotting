  - generic [ref=f63e13]:
    - generic [ref=f63e14]: "01"
    - heading "问题：分类答不了的，YOLO 来答" [level=2] [ref=f63e15]
    - generic [ref=f63e16]:
      - generic [ref=f63e17]: TL;DR
      - list [ref=f63e18]:
        - listitem [ref=f63e19]: ◆ 分类式 KWS 只答「有没有」——关键词从几秒到几秒答不了；精确时间边界对 ASR 解码起点、语音增强的片段提取都关键。
        - listitem [ref=f63e20]: ◆ YOLO 的名字就是哲学：You Only Look Once——一次前向看完整张图，所有位置的检测联合推理（不是逐窗独立分类）；视觉界靠它完成了分类→检测的飞跃。
        - listitem [ref=f63e21]: ◆ SpeechYOLO 的机制：频谱图划 S×S 网格，中心落在哪格哪格负责；每格预测 B 个边界框 (x,y,w,h,confidence) + C 个类别条件概率。
        - listitem [ref=f63e22]: ◆ 四项损失各管一件事：L_box（框回归）+ L_conf（有词格敢报）+ L_noobj（无词格敢不报，λ 处理正负失衡）+ L_cls（分类）——检测+定位统一在一个网络里。
