        - generic [ref=f63e182]: "2"
        - paragraph [ref=f63e183]: 两篇共同的结构税一模一样。频率维候选冗余（词只关心时间）、网格/锚点分辨率是定位上限、重叠语音处理未验——跨模态迁移的「减法」（1D 化、语音先验）两篇都还没做；这说明税来自迁移本身而非具体框架。
