    - generic [ref=f63e112]: 图 2 · 机制解剖：网格与边界框的责任制 · 四项损失的分工与 λ_noobj
    - generic [ref=f63e113]:
      - generic [ref=f63e114]: "网格: 频谱图 → S×S cells; 词中心落哪格哪格负责 预测: 每格 B 框 (x, y, w, h, conf) + C 类条件概率 损失: L = λ_coord·L_box + L_conf + λ_noobj·L_noobj + L_cls 输出: S×S×(B×5+C) 张量 → NMS → (类别, t_start, t_end)"
      - generic [ref=f63e115]: 人话：把频谱图划成田字格，每格是个哨位——「词的中心在我这格就归我管」；每格报告：有没有（置信度）、在哪（框的位置大小）、是谁（类别）。所有哨位同时报告，一次汇总——不用一个窗口一个窗口扫过去。
    - paragraph [ref=f63e116]: λ_noobj 的失衡处理值得注意：绝大多数格不含关键词——无目标损失会把模型拉向「全不报」；λ 加权压低它的声音，让「敢报」与「敢不报」平衡——这与极端不平衡分类的处理（#12 的 F1 逻辑）是同一个问题的检测版。
