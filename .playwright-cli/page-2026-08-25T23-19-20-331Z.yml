        - generic [ref=f63e179]: "1"
        - paragraph [ref=f63e180]: 与 RPN-KWS（#14）是同年的双路线。SpeechYOLO（Interspeech 2019.04）走单阶段——一次前向全图联合推理，快但粗；RPN-KWS（arXiv 2019.07）走提议式——锚点候选+评分，精确但要后处理——视觉界 YOLO vs Faster R-CNN 之争在语音领域的完整重演。
