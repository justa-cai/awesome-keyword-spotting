    - generic [ref=f63e237]:
      - generic [ref=f63e238]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f63e239]: ① 单阶段检测的哲学是「全局联合推理」。
      - generic [ref=f63e240]: ↳ 一次前向看全图，上下文让每格的判断互相支撑——比逐窗独立分类省一遍扫描且利用全局信息；「分而治之」vs「合而观之」的取舍在检测任务里反复出现（YOLO vs RPN、CTC vs attention）。
      - paragraph [ref=f63e241]: ② 输出规格（类别+边界）解锁级联场景。
      - generic [ref=f63e242]: ↳ 「有没有+在哪」的输出让下游（ASR 起点、片段提取、词级对齐）直接受益——升级输出规格是花一次标注成本买系统级能力，不是模型级的自我满足。
      - paragraph [ref=f63e243]: ③ 迁移的税单与具体框架无关。
      - paragraph
      - generic [ref=f63e244]: ↳ YOLO 与 RPN 是两套不同的框架，但跨模态迁移的结构税相同（频率维冗余、分辨率上限、语音先验缺失）——税来自「源域归纳偏置 ≠ 目标域结构」这个事实本身；做迁移先预算税单，再选框架。
    - paragraph [ref=f63e245]: 系列坐标：语音检测定位谱系的 YOLO 分支——本文（2019 Interspeech）与 RPN-KWS（#14，同年）构成视觉系双路线；#29 WSRNet（2020，文档 KWS）是检测+识别联合思想在文档侧的呼应；#20 音素边界检测（2020）是语言学系的定位——「词在什么时候」这个问题在 KWS 里至少有视觉系、文档系、语言学系三种回答，本文是视觉系单阶段的代表。
