      - generic [ref=f28e251]:
        - heading "下一步方向（论文展望 + 笔者补充）" [level=3] [ref=f28e252]
        - paragraph [ref=f28e253]: ① 补系统级评测：FLOPs、真机延迟内存，与 MatchboxNet/BC-ResNet 同一块 MCU 实测——把效率从理论变成工程事实。 ② 流式因果化改造：chunk 级双向或有限回看的因果 Mamba + 逐帧打分头替换 class token——走向产品的前置条件。 ③ 极致小模型：0.2M 档 + 蒸馏 / 低比特量化 / 剪枝，冲击 100K 以内与 SincConv 系竞争。 ④ 扩任务边界：自定义唤醒词、多语言、远场仿真、开集拒识；拉长到连续监听让线性复杂度真正兑现。 ⑤ 与自监督结合：AuM 式掩码预训练或 wav2vec2.0/WavLM 特征。 ⑥ 混合比例系统搜索：Mamba 层与 FFN/注意力层的最优配比用 NAS 探索，而非手工二选一。
