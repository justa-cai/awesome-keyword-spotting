      - generic [ref=f28e24]:
        - heading "一分钟版本" [level=2] [ref=f28e25]
        - list [ref=f28e26]:
          - listitem [ref=f28e27]: 三类现有架构各占一头：CNN 感受野固定（要长程就堆深度）、RNN 无法并行、Transformer 复杂度 O(N²)（KWT-3 参数失控到 5.36M）。KWS 需要的是长程依赖 + 线性复杂度同时满足——Mamba 恰好两者都占，但在 KWS 上从未被研究过。
          - listitem [ref=f28e28]: 三个设计问题的任务级答案：扫描轴——patch 取 [40,1] 只在时间轴扫（等价 kernel[40,1] 时域卷积；纯频率扫描掉 3.67 pp）；方向——必须双向（全单向从 98.01 崩到 78.29，掉近 20 pp）；非线性——KWM-T 保留 FFN 补语义表达。
          - listitem [ref=f28e29]: 双变体：KWM（纯 BiMamba 堆叠，3.4M 拿 98.01/98.79）与 KWM-T（只把 MHSA 换成 BiMamba、保留 FFN，5.2M 拿 98.05/98.91）——KWM-T-192 与 KWT-3 参数量几乎持平（5.2 vs 5.361M）下四项全面占优，是「Mamba 可替代自注意力」最干净的受控证据。
          - listitem [ref=f28e30]: GSC V1/V2 四设定全部刷新基准；缩到 6 层 64 维（0.2M）仍有 96.74–97.45%——压缩鲁棒性好于 Transformer/CNN 缩小时的掉点。
          - listitem [ref=f28e31]: 诚实账单：零 FLOPs / 延迟 / 内存实测；对轻量 CNN（BC-ResNet-8 用 1/10 参数做到 98.7）优势很薄；双向架构与流式因果推理结构性冲突——离落地还差一步关键架构工作。
