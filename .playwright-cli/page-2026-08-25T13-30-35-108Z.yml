  - generic [ref=f251e351]:
    - generic [ref=f251e352]: 可迁移判断
    - paragraph [ref=f251e353]: ↳ 不要把特征提取当成理所当然的预处理：特征表示的设计空间与模型架构的设计空间同样重要，值得投入同等优化精力——设计新架构之前，先确认输入特征已经足够好。
    - paragraph [ref=f251e354]: ↳ 简单模型 + 好特征 可能优于 复杂模型 + 差特征：5K 参数的线性模型配可训练前端到 89.2——端侧小模型（恰恰是 KWS 的主战场）是可训练前端收益最大的地方，因为弱模型没有内部补偿的能力。
    - paragraph [ref=f251e355]: ↳ 约束要问出处：FastAudio 的对称/单调约束来自审美与防退化的好意，却锁死了 9 个点的解空间——加约束前先问它是物理必然还是历史惯性；物理性软约束（不确定性原理、能量守恒）比几何约束更值得试。
    - paragraph [ref=f251e356]: ↳ 形状偏移量是诊断器：简单模型学到的形状大幅偏离 Mel、复杂模型几乎不动——看滤波器形状学成什么样，就能反推模型在内部补了多少特征工程。
