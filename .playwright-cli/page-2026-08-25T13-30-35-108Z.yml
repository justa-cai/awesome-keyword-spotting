    - listitem [ref=f251e300]: ◈ D 档 nnAudio vs FastAudio 差约 9pp——全部设置里最大的单一差异，形状约束是性能的主要瓶颈，「Mel 样子的形状」不是 KWS 的最优解。
    - listitem [ref=f251e301]: ◈ 基函数数量扫描（可训练）：10 个 70→82（+12）、20 个 73→85（+12）、30 个 74→87（+13）、40 个 75→89（+14）——基函数越多，绝对提升越大。
    - listitem [ref=f251e302]: ◈ BC-ResNet：93.0 → 95.0（+2.0）——方向一致但幅度骤减；ASR 的 PER 降幅（最多 9.5pp）与 KWS 同量级，方法跨任务通用。
    - listitem [ref=f251e303]: ◈ 未做的重要对照：与 SpecAugment 等数据增强的关系（互补还是冗余）——两者都靠改频谱图提性能，复现者值得先补这个实验。
  - heading "§04 贡献" [level=2] [ref=f251e304]:
    - generic [ref=f251e305]: §04
    - text: 贡献
  - generic [ref=f251e306]: 四点：从 +14.2pp 到对 Mel 假设的正面挑战
  - generic [ref=f251e307]:
    - generic [ref=f251e308]:
      - generic [ref=f251e309]: "1"
      - paragraph [ref=f251e310]: 最大 14.2pp 的 KWS 准确率提升：单个技术贡献带来两位数绝对提升在 DL 研究中极罕见——证明基函数选择对 KWS 性能的影响远超此前认知。
    - generic [ref=f251e311]:
      - generic [ref=f251e312]: "2"
      - paragraph [ref=f251e313]: 正面挑战「Mel 刻度最优」假设：形状约束（FastAudio）在 KWS 上适得其反——Mel 刻度基于人耳感知设计，但深度模型不需要遵循人类听觉系统的约束，它可以找到完全不同的滤波器形状。
    - generic [ref=f251e314]:
      - generic [ref=f251e315]: "3"
      - paragraph [ref=f251e316]: 收益-复杂度交互的机制解释：简单模型收益最大（14.2%）、复杂模型最小（2%）——弱模型表达能力有限无法内部学频率变换，可训练基函数承担特征工程；强模型的卷积层隐式实现了频率加权和重组。
    - generic [ref=f251e317]:
      - generic [ref=f251e318]: "4"
      - paragraph [ref=f251e319]: 频率重要性的直接可视化证据：多峰、非对称、高频增强的滤波器形状，是「KWS 依赖哪些频段」的模型侧证据——比任何事后归因方法都直接。
