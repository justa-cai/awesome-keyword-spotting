  - generic [ref=f251e3]: 论文精读 · 可视化版 · 2022 №38
  - heading "Mel 滤波器不是终点： 让基函数跟着任务一起训练，线性模型涨 14 个点" [level=1] [ref=f251e4]: Mel 滤波器不是终点：让基函数跟着任务一起训练，线性模型涨 14 个点
  - generic [ref=f251e5]:
    - generic [ref=f251e6]: Trainable Basis Functions · SUTD
    - generic [ref=f251e7]: arXiv 2204.11437 · nnAudio vs FastAudio
    - generic [ref=f251e8]: GSC V2-12 · 线性 5K / BC-ResNet 500K
    - generic [ref=f251e9]: 设置 D：75.0 → 89.2（+14.2pp）· 形状约束值 9pp
  - generic [ref=f251e10]: 一句话：频谱图管线的每一步（STFT 窗、Mel 滤波器组、DCT）都建立在手工基函数上，从未被检验是否对各任务最优。本文用 nnAudio（零形状约束）和 FastAudio（保 Mel 形状的软约束）做 2×2 因子实验：让 Mel 基函数和窗函数参与反向传播——无约束全训练在 KWS 上最多 +14.2pp，而「保持 Mel 样子」的约束反而吃掉约 9pp：Mel 形状根本不是 KWS 的最优解。
  - generic [ref=f251e11]:
    - generic [ref=f251e12]: TL;DR
    - listitem [ref=f251e13]: ◈ 频谱图计算的三级基函数全部手工设定：STFT 窗长（时间/频率分辨率权衡）、Mel 三角滤波器（中心频率/带宽）、DCT 保留数——基于人耳感知先验，是否对 DL 任务最优从未被系统检验。
    - listitem [ref=f251e14]: ◈ 固定前端的代价是具体的：对 KWS 关键的辅音高频能量（/s/ 集中在 3000–7000Hz）被 Mel 刻度在高频的低分辨率过度压缩；KWS/ASR/音乐任务的最优频率分辨率本不相同，却共用一套设定。
    - listitem [ref=f251e15]: ◈ 2×2 因子设计：gMel（Mel 滤波器组矩阵）与 gSTFT（窗系数）各自固定/可训练——A vs B 量化 Mel 优化、A vs C 量化窗优化、A vs D 总效果、D vs B+C 验证互补性。
    - listitem [ref=f251e16]: ◈ 结果偏序清晰：D（全训）> B（仅 Mel）> C（仅窗）> A（固定）；nnAudio（无约束）> FastAudio（有约束）全线成立。D 档两者差约 9pp——形状枷锁是主要瓶颈。
    - listitem [ref=f251e17]: ◈ 学到的滤波器不像 Mel：多峰（判别信息分布在多个不连续频段）、非对称（两侧斜率需求不同）、高频上抬（正好补上 Mel 刻度的高频塌陷，与 /s/ /t/ /k/ 的辅音信息一致）。
    - listitem [ref=f251e18]: ◈ 收益与模型复杂度成反比：线性模型（5K 参数）+14.2pp，BC-ResNet（500K）只 +2pp——弱模型无法在内部学频率变换，可训练基函数替它做特征工程；强模型的卷积层已在隐式补偿。
    - listitem [ref=f251e19]: ◈ 跨任务同向：ASR（TIMIT）PER 最多降 9.5pp。推理时零额外开销（滤波器已固化），代价全在训练侧（频谱图层参与反传）。
  - heading "§01 问题：特征提取被当成理所当然" [level=2] [ref=f251e20]:
    - generic [ref=f251e21]: §01
    - text: 问题：特征提取被当成理所当然
  - generic [ref=f251e22]: 三级手工基函数 + 任务错配 + 先前工作的形状枷锁
  - generic [ref=f251e23]:
    - generic [ref=f251e24]:
      - heading "固定前端是黑箱输入" [level=3] [ref=f251e25]
      - paragraph [ref=f251e26]: 频谱图参数不参与反向传播：模型无法按任务调整频率分辨率。同一个手工设定喂给 KWS（要精细频谱纹理）、ASR（要音素序列）、音乐分类（要和弦节奏）——「Mel 刻度为什么好」这个问题本身缺乏实验证据的回答。
    - generic [ref=f251e27]:
      - heading "高频分辨率被刻度压扁" [level=3] [ref=f251e28]
      - paragraph [ref=f251e29]: Mel 刻度模拟人耳感知：低频分辨率高、高频分辨率低。但 KWS 的判别信息大量在高频——/s/ /t/ /k/ 等辅音集中在 3000–7000Hz 的宽带噪声，恰好落在 Mel 组最稀疏的区域。人耳的先验未必是任务的先验。
    - generic [ref=f251e30]:
      - heading "FastAudio 的好意办了坏事" [level=3] [ref=f251e31]
      - paragraph [ref=f251e32]: 先前工作让 Mel 基函数可训练，但加形状约束（非负、单调递增后递减、对称）保「Mel 样子」。出发点是防退化——但如果 KWS 的最优滤波器根本不是三角形单峰呢？约束把整个解空间锁死了。
    - generic [ref=f251e33]:
      - heading "本文的问题" [level=3] [ref=f251e34]
      - paragraph [ref=f251e35]: 放开全部约束（nnAudio：gMel 矩阵和 gSTFT 窗向量直接进梯度图，形状任意——可多峰、非对称、甚至振荡），DL 模型能否学到比手工更适合任务的基函数？学到的长什么样、揭示了任务的什么信息？收益随模型复杂度怎么变？
