    - text: 方法：把特征工程外包给梯度
  - generic [ref=f251e123]: gMel / gSTFT 进反传图 · 标准 Mel 初始化 · 因子分解归因
  - generic [ref=f251e124]:
    - generic [ref=f251e125]: "gMel: W_mel ∈ ℝ^(n_mel × (N_FFT/2 + 1)) # Mel 滤波器组权重矩阵 gSTFT: w_STFT ∈ ℝ^(N_FFT) # STFT 窗函数系数 nnAudio: 零形状约束，参数直接参与反向传播 FastAudio: sigmoid 保非负 + 单调化 + 重叠约束（软约束参数化）"
    - generic [ref=f251e126]: 人话：nnAudio 把整条频谱图流水线做成 PyTorch 里的一层——滤波器矩阵就是普通可训练权重，梯度和模型参数一起流。FastAudio 在同一骨架上加参数化约束，逼着学出来的滤波器保持「Mel 的样子」。两者的差 = 形状约束本身的代价。
  - generic [ref=f251e127]:
    - generic [ref=f251e128]: "KWS: L = L_CE(y, ŷ) ASR: L_CTC Adam lr 0.001 · 初始化 = 标准 Mel 滤波器组（好初始化对收敛至关重要） Mel 基函数数量扫 10 / 20 / 30 / 40（研究基函数数量 × 可训练的交互）"
    - generic [ref=f251e129]: 人话：从标准 Mel 起步而不是随机起步——离已知的好解近，训练只在周边精调。基函数数量的扫描回答另一个被忽略的问题：40 个滤波器到底是不是恰好的数量。
