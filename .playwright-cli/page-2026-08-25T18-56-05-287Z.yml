      - generic [ref=f333e259]: ↳ 扬声器回声、电机噪声与设备自身状态强耦合——只有真机实录数据才可信。可穿戴设备、智能音箱、车载系统都适用这条判断：先问「干扰和谁的状态耦合」，再决定数据策略。
      - paragraph [ref=f333e260]: ② 好的 benchmark 基线要刻意留出提升空间。
      - generic [ref=f333e261]: ↳ 基线太强吓退参与者、太弱没有信息量——「干净条件下能做、真实条件下很难」的落差设计，让每个参与者都能看清难度在哪、空间多大。基线是难度标尺，不是性能上限。
      - paragraph [ref=f333e262]: ③ 分开赛道 + 不对称指标，是公平比较的两个杠杆。
      - generic [ref=f333e263]: ↳ KWS 与 SSL 技术难点不同就分开比；唤醒场景误触发/漏检代价不对称就用 DER 综合指标——benchmark 的可比性来自这些看似枯燥的设计决定，而不是数据量大。
    - paragraph [ref=f333e264]: "系列坐标：KWS 基准设施谱系——GSC（2017）定义了「干净单通道」维；PVTC 2020（2021 #24）加了「个性化说话人」维；本文（2020）加了「机器人回声/机械噪声/多通道空间」维。benchmark 每加一个维度就打开一片新研究空间——这批「基础设施论文」的方法贡献常被低估，但方向塑造力比多数方法论文更强。"
