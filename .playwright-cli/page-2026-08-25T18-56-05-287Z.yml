  - generic [ref=f333e89]:
    - generic [ref=f333e90]: "02"
    - heading "机制：机器人身上的声学回路" [level=2] [ref=f333e91]
    - paragraph [ref=f333e92]: 这个场景的独特性一句话讲清：干扰源长在机器人自己身上。扬声器是自己的——播放内容产生的回声与「机器人当时在说什么」强耦合；电机是自己的——运动时的机械噪声与「机器人当时在做什么」强耦合。这种状态耦合是第三方数据集（把通用噪声混进来）模拟不了的，必须在真机上实录——这正是 Echo-Record、Noise-Mech、KWS-Dev/Eval 三份实录数据的存在理由。
    - img [ref=f333e93]:
      - generic [ref=f333e95]: 机制解剖：机器人身上的声学回路 · 评测设计的逻辑
      - generic [ref=f333e96]: 机器人自身的声学回路
      - generic [ref=f333e99]: Alpha-mini
      - generic [ref=f333e101]: 扬声器
      - generic [ref=f333e106]: 4 麦阵列
      - generic [ref=f333e107]: 用户语音
      - generic [ref=f333e109]: 回声
