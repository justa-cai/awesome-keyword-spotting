  - generic [ref=f333e13]:
    - generic [ref=f333e14]: "01"
    - heading "问题：机器人场景没人能系统评测" [level=2] [ref=f333e15]
    - generic [ref=f333e16]:
      - generic [ref=f333e17]: TL;DR
      - list [ref=f333e18]:
        - listitem [ref=f333e19]: ◆ 人形机器人进家庭后，KWS 和 SSL 变成交互入口——但它面对的声学困境是独有的：自己扬声器播放产生的回声、自己电机关节的非平稳机械噪声、室内混响、多源叠加。
        - listitem [ref=f333e20]: ◆ 此前的 KWS/SSL 研究多在干净或简单噪声条件下做——没有针对机器人场景的大规模开源数据集和标准化评测平台，这个方向进展缓慢。
        - listitem [ref=f333e21]: ◆ 本文的定位不是新方法，而是填基础设施空白：6 份数据集（含 Alpha-mini 真机实录的回声、机械噪声、评测集）+ KWS/SSL 双赛道 + 基线系统。
        - listitem [ref=f333e22]: ◆ 基线的行为本身就是贡献：干净条件下表现良好，噪声/回声/机械噪声叠加后显著下降——真实场景的难度被量化地摆上桌面。
