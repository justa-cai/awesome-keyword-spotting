      - generic [ref=f333e113]: 房间混响：直达声 + 各阶反射叠加
      - generic [ref=f333e114]: 信号 = 目标语音 + 自体回声 + 机械噪声 + 混响
      - generic [ref=f333e115]: 关键独特性：干扰源在机器人「自己身上」——
      - generic [ref=f333e116]: 喇叭是自己的 · 电机是自己的——回声和机械噪声
      - generic [ref=f333e117]: 与机器人状态强耦合，第三方数据集模拟不了
      - generic [ref=f333e118]: 评测设计的三个决定
      - generic [ref=f333e120]: ① 指标选 DER 而非准确率：
      - generic [ref=f333e121]: 唤醒场景里误触发（false alarm）和漏检（miss）
      - generic [ref=f333e122]: 的代价不对称——DER 综合两者，贴近产品体验
      - generic [ref=f333e123]: ② 双赛道分开评：
      - generic [ref=f333e124]: KWS 和 SSL 的技术难点不同——分开比拼避免
      - generic [ref=f333e125]: 「联合系统整体好但不知道谁的功劳」的糊涂账
      - generic [ref=f333e126]: ③ 基线一个学习一个经典：
      - generic [ref=f333e127]: KWS 用注意力端到端（学习路线起点）· SSL 用
      - generic [ref=f333e128]: SRP-PHAT（信号处理经典参照）——后来者两条路
      - generic [ref=f333e129]: 都有明确的超越目标
      - generic [ref=f333e130]: 左：干扰源长在机器人自己身上——喇叭回声、电机噪声与机器人状态强耦合，这是第三方数据集模拟不了的核心困难。右：指标/赛道/基线三个设计决定，定义了这个 benchmark 的可比性
    - generic [ref=f333e131]: 图 2 · 机制解剖：机器人自身的声学回路 · 评测设计的三个决定
    - generic [ref=f333e132]:
      - generic [ref=f333e133]: "麦克风信号 = 用户语音（目标） + 自体回声（扬声器） + 机械噪声（电机/关节） + 房间混响（多阶反射） KWS 赛道指标: DER —— 误触发与漏检测的综合错误率 SSL 赛道指标: Angular Error —— DOA 方向估计误差（4 麦空间信息）"
      - generic [ref=f333e134]: 人话：机器人要在这团声音乱麻里听清「你在哪、你说了什么」。KWS 考「听清词」，SSL 考「找到人」——两个赛道用各自的误差指标分开比拼，谁的方法好一目了然。
    - paragraph [ref=f333e135]: 评测设计的三个决定值得细看：指标选 DER（唤醒场景误触发和漏检代价不对称，综合指标贴近产品体验）；双赛道分开评（避免「联合系统整体好但不知道谁的功劳」的糊涂账）；基线一个学习一个经典（KWS 用注意力端到端、SSL 用 SRP-PHAT——两条技术路线都给出明确的超越目标）。
