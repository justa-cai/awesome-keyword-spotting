    - generic [ref=f191e134]: 人话（式2，混淆网络构造）：先按 CTC 贪心解码拿 1-best 及帧对齐当枢轴，替代字素平行挂到各位置。这一步把空白符占据的概率质量按帧内比例重新分摊给真正的字素——得到「去掉空白、帧对齐、带竞争假设」的压缩表示。例：book 逐帧最优 b-b-□-o-o-□-o-k-k → 四段对齐 ((1,4),(4,7),(7,8),(8,10))。
