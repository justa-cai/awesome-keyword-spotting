  - heading "§05 局限与边界" [level=2] [ref=f191e323]:
    - generic [ref=f191e324]: §05
    - text: 局限与边界
  - generic [ref=f191e325]: 依赖被挪到训练期，不是被消灭
  - generic [ref=f191e326]:
    - generic [ref=f191e327]:
      - heading "DNN-HMM 依赖只是挪了位置" [level=4] [ref=f191e328]
      - paragraph [ref=f191e329]: 造训练查询仍需带词典和 LM 的混合识别器——对完全没有这类资源的语言，冷启动成本依然在。
    - generic [ref=f191e330]:
      - heading "掩码是经验性补救" [level=4] [ref=f191e331]
      - paragraph [ref=f191e332]: 宽度靠开发集网格搜索；「偏移不超过 5 个字素」是观测性结论而非保证，换模型换语言可能失效。
    - generic [ref=f191e333]:
      - heading "窗缝后验质量未分析" [level=4] [ref=f191e334]
      - paragraph [ref=f191e335]: 拼接缝附近后验来自两个不同注意力上下文，1.5s 切分点附近的字素后验理论上有劣化，论文未做边界误差分析。
    - generic [ref=f191e336]:
      - heading "词外项仍系统性低于词内" [level=4] [ref=f191e337]
      - paragraph [ref=f191e338]: 英文 0.7027 vs 0.8398：纯字素表示缺发音层归一化，同音异形与形态变体（捷克语尤甚）全靠打分网络消化；多词短语查询未讨论。
    - generic [ref=f191e339]:
      - heading "评测规模小 + 无显著性" [level=4] [ref=f191e340]
      - paragraph [ref=f191e341]: 开发/测试各 10 个说话人；英文 OOV 查询项尤其稀少（测试 6 个、开发 31 个）——0.7027 的置信度存疑；部分差距（捷 ±1 vs ±2 差 0.99 点）落在随机波动区间。
    - generic [ref=f191e342]:
      - heading "系统账单缺失" [level=4] [ref=f191e343]
      - paragraph [ref=f191e344]: 索引时间、检索实时率、嵌入存储、参数量一概未报——Wav2Vec 要对全档案过一遍前向，离线计算账单不小；BiLSTM 天然不适合流式，新音频须整段过完才能入档。
  - generic [ref=f191e345]:
    - heading "可迁移判断（超出 STD 也成立）" [level=4] [ref=f191e346]
    - list [ref=f191e347]:
      - listitem [ref=f191e348]: ↳ 下游可学习的检索结构能部分吸收上游识别器的错误——「更准的 1-best + 朴素检索」输给「原始混淆网络 + 可训练打分」，两阶段各自最优不等于整体最优。
      - listitem [ref=f191e349]: ↳ 资源依赖可以从运行时挪到训练期：让带资源的老师产生伪标签，学生网络内化学到的知识——部署形态由「需要什么资源」变成「训练期借过什么资源」。
      - listitem [ref=f191e350]: ↳ 保留识别不确定性（竞争假设进特征）比只存 1-best 更值钱——不可逆的压缩丢掉的信息，后面花再大力气也补不回来。
      - listitem [ref=f191e351]: ↳ 监督信号里本质随机的区间（对齐边界）应该掩掉交给模型裁量，而不是逼网络拟合噪声；但掩码宽度有最优点——掩太多连真实监督一起扔。
      - listitem [ref=f191e352]: ↳ 拼接要在「中间表示层」做而不是「解码文本层」做：保证表示时间轴连续，后续流程无感。
