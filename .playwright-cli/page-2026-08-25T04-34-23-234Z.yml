    - generic [ref=f191e140]: 人话（式3，打分）：音频段嵌入与所有查询嵌入点积取最大，乘可训练斜率 a 加偏置 b 过 Sigmoid——校准成概率让阈值决策有稳定语义。查询侧出 3 个局部嵌入（前/中/后半）：一个词的不同部位对齐质量不同，多嵌入 + 最大池化天然容忍局部错位，还不增加参数。
  - paragraph [ref=f191e141]: 输入特征刻意极简：段时长 + 前三个字素及其概率——沿用音素版验证过的配方。好处是混淆网络里的竞争假设信息进特征而不只是 1-best，识别不确定性可以传导给打分网络。词分隔符与空白符合并 → 表示天然按词分段，与「查询不是其他词的子串」的筛选规则咬合，避免子串误命中。
