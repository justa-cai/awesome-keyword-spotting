    - heading "词表 25 万词也兜不住专名检索： 甩掉词典的字素 STD怎么做" [level=1] [ref=f191e5]: 词表 25 万词也兜不住专名检索：甩掉词典的字素 STD怎么做
    - generic [ref=f191e6]:
      - generic [ref=f191e7]: Interspeech 2022 · Švec 等
      - generic [ref=f191e8]: 西波希米亚大学（捷克）
      - generic [ref=f191e9]: Wav2Vec 2.0 + 字素混淆网络
      - generic [ref=f191e10]: MALACH 口述历史档案 · 英/捷双语
    - generic [ref=f191e11]: DNN-HMM 的词典与语言模型知识只在训练期当一次「老师」，蒸馏进打分网络参数；检索系统本体零词典零 LM，OOV 从「检不到」变成「同一套打分机制」。
    - generic [ref=f191e12]:
      - heading "一分钟版本" [level=3] [ref=f191e13]
      - list [ref=f191e14]:
        - listitem [ref=f191e15]: ▸ 任务：STD 是 KWS 面向大规模口语档案的变体——离线做识别和索引，换在线查询秒级响应；查询词是用户事后给出的任意词，口述历史档案里最有价值的恰是词表外人名地名（OOV 率 3.2%/2.6%，词表 24.4 万/25.2 万也兜不住）。
        - listitem [ref=f191e16]: ▸ 老范式的死穴：DNN-HMM → 词格 → 倒排索引，OOV 根本进不了索引；代理词/子词补救受制于发音词典这个人工知识瓶颈。
        - listitem [ref=f191e17]: ▸ 三件套：Wav2Vec 2.0 字素识别器（CTC 后验矩阵，无词典无 LM）→ 字素混淆网络（带帧对齐、带竞争假设的压缩表示）→ 双管线 Deep LSTM 打分（音频嵌入与查询嵌入在同一联合空间做点积）。
        - listitem [ref=f191e18]: ▸ 知识迁移管线：同一批无标注档案过两遍识别器，DNN-HMM 置信度 >0.95 的词充当查询词自举训练——词典/LM 知识以教师标注形式蒸进网络参数，运行时完全不需要。
        - listitem [ref=f191e19]: ▸ 核心结果：测试集 ATWV 英文 0.7616、捷克文 0.9100——即便给旧基线开满 LM+词表只搜词内词，仍被无词典系统以 +3.41/+8.17 个点击败。
        - listitem [ref=f191e20]: ▸ OOV 质变：词外项 0.7027/0.8784，只比词内略降；传统词表系统的词外是直接零分。
        - listitem [ref=f191e21]: ▸ 表示升级 > 打分升级：同一打分骨架，输入从 DNN-HMM 音素后验换成字素混淆网络，MTWV 跳 16 个点——瓶颈原来卡在音素识别器质量。
        - listitem [ref=f191e22]: ▸ 工程三对策：18s 窗 + 3s 重叠滑窗解码（Transformer O(L²) 只能吃几十秒）且拼接在后验层不在文本层；边界掩码吸收 CTC 对齐误差（错位从未超 5 个字素）；Sigmoid 校准点积输出给阈值稳定语义。
        - listitem [ref=f191e23]: ▸ 掩码消融：有最优点且语言相关（英文 ±1、捷克文 ±2）；±3 英文崩到 0.7293 比无掩码还低 9 点——偏差-方差权衡而非单调改进。
        - listitem [ref=f191e24]: ▸ 可迁移判断：下游可学习的检索结构能部分吸收上游识别器的错误——两阶段各自最优不等于整体最优。
    - heading "§01 问题：词表路线的天花板" [level=2] [ref=f191e25]:
      - generic [ref=f191e26]: §01
      - text: 问题：词表路线的天花板
    - generic [ref=f191e27]: 25 万词表的档案识别器，测试集 OOV 率仍有 3.2%
    - paragraph [ref=f191e28]: STD 与端侧唤醒 KWS 的分工不同：唤醒只检测一个预先训练好的固定词，STD 面对「用户事后才给出的任意查询词」。传统管线把音频转成词格再建倒排索引，检索单元是「词表里的词」——OOV 天生进不了索引。历史上面向口述档案的识别器在发音词典和语言模型里塞进大量人工领域知识（MALACH 项目），这些知识既是资产（领域适配好）也是枷锁（维护成本高、OOV 残废）。
    - generic [ref=f191e29]:
      - generic [ref=f191e30]:
        - heading "裸 Wav2Vec 做 STD 不行" [level=4] [ref=f191e31]
        - paragraph [ref=f191e32]: 词内项 MTWV 英文 0.6178 / 捷克文 0.7248，明显低于 DNN-HMM 基线（0.7899/0.8760）——1-best 字素转写没有语言模型约束，同音字竞争错误直接进索引。外挂 LM 加束搜索能追平（0.8105/0.8757），但又把「不依赖 LM」的优势丢了，OOV 依旧无解。
      - generic [ref=f191e33]:
        - heading "自己前一年的系统也没拔根" [level=4] [ref=f191e34]
        - paragraph [ref=f191e35]: 作者 2021 年的 Deep LSTM 嵌入打分挂在 DNN-HMM 音素识别器上（ATWV 英 0.5823 / 捷 0.7531），但音素识别器本身仍需发音词典——OOV 问题的根没拔掉。另有工程障碍：Transformer 自注意力 O(L²) 只能吃几十秒输入而档案录音动辄 1 小时+；CTC 不保证字素-帧精确对齐。
