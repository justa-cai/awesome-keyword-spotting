      - generic [ref=f121e226]:
        - generic [ref=f121e227]:
          - heading "方法局限" [level=4] [ref=f121e228]
          - list [ref=f121e229]:
            - listitem [ref=f121e230]: 训练依赖强制对齐：所有音素级监督的边界质量由对齐器决定——需干净转写文本；口音 / 自发语音 / 噪声下对齐质量下降直接污染监督。低资源语言需换对齐器或退回隐式对齐（正是论文自己批评过的短板）。
            - listitem [ref=f121e231]: 记忆库上下文无关 vs 协同发音：脱离语境的音素原型可自由拼接增广，但真实语音同一音素在不同上下文声学实现差异很大——/S/ 与 /SH/ 近距聚簇说明当前粒度对近音素分辨未到头。
            - listitem [ref=f121e232]: 完全同音对无解：the prince's / the princes 声学上不可分——只能靠语言模型先验或上下文裁决，判决器硬扛没有出路。
            - listitem [ref=f121e233]: 绝对性能离产品化有距离：LPH EER 8.47% 是学术最好成绩，但产品误报预算按每小时误唤醒计——AUC/EER 与实际工作点隔着阈值与负例占比换算（未报任何部署指标）。
            - listitem [ref=f121e234]: 部署姿态存疑：Whisper-Tiny + G2P 组合零参数量 / 延迟报告——微控制器级端侧可行性未知。
            - listitem [ref=f121e235]: 最好结果要求最重注册：96.59% 需文本 + 音频双注册；轻注册（纯文本 95.56%）差约 1 点——注册摩擦与性能权衡。
