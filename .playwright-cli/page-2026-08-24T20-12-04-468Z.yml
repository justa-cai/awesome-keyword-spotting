        - heading "一分钟版本" [level=2] [ref=f121e26]
        - list [ref=f121e27]:
          - listitem [ref=f121e28]: 两个痛点：① 易混词高误报——误报的最大来源不是随机噪声而是发音高度相近、只差少数音素的词（information vs induration）；整句级特征在时间池化中把局部差异稀释掉，判决器看到的两个嵌入几乎重叠（CLAD 在 LPH 上 EER 高达 30.30% 对 LPE 的 8.65%——句级粒度对易混词几乎无能为力）。② 注册模态割裂——音频注册怕吵、文本注册要转发音，理想系统应让用户自由选择甚至组合，但现有系统大多只支持一种。
          - listitem [ref=f121e29]: 核心判断：易混词的判别信息不均匀分布，集中在少数几个音素的位置上——把对比粒度下移到音素 = 把分类面直接架在混淆的源头上，让每个音素独立承担判别责任。对齐用 Montreal 强制对齐器显式给出帧边界（非 CED 式隐式对齐——隐式对齐是模型副产品、边界不可控不可检查）；推理时不需对齐器（自注意力自动对齐）。
          - listitem [ref=f121e30]: 负例组织：批内所有词的所有音素拼成池，配对音素为正、其余一律为负（含同词其他音素）——/S/ 与 /SH/ 的区分信号在这个池子里被反复淬炼；难负例定向制造：从记忆库随机抽音素对正例序列做插入/替换/删除，扰动方向直指模型最易混淆的位置；第三类判别器：难负例单独成类（普通负例与难负例决策难度不同，混在一类难负例梯度被淹没）。
          - listitem [ref=f121e31]: 结果：纯文本注册 LPH AUC 95.56（超 AdaKWS-Small 0.47 点）；对 CLAD 断层式 +19.41 点；双模态融合 96.59 / EER 8.47 全面超 MM-KWS（96.25 / 9.30）——MM-KWS 靠 150 万对增广数据，本文在原始数据上靠约束反超：约束设计比堆数据更高效。
          - listitem [ref=f121e32]: 最有信息量的消融：去掉音素级对比 LPH 掉 5.74 但 LPE 只掉 1.32——几乎不在易负例上消耗容量，专为易混词而生，与设计初衷严格对齐；难负例增广收益 3.11 > 单加音频模态 2.61（产品排序：先增广再多模态）；记忆库单独只值 0.09（噪声级）但它是增广的原料库——两者深度绑定。
          - listitem [ref=f121e33]: 能力边界（论文自己画线）：完全同音对（"the prince's" vs "the princes"）声学上不可分——纯声学匹配原理上无解；/S/ 与 /SH/ 簇仍然很近，是误分类主要来源。LPH EER 8.47% 离产品误报预算还有距离；训练依赖强制对齐（需干净转写）限制低资源语言迁移。
