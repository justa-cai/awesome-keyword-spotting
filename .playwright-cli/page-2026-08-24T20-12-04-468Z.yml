      - heading "句级粒度对易混词钝感的量化证据" [level=2] [ref=f121e36]
      - generic [ref=f121e38]: 四条不足：① QbyE（音频注册）——DTW / 度量学习在「整体轮廓相似、局部音素不同」的难负例上分辨率不足，且受注册音频质量制约；② 句级对比学习（CMCD / CLAD）——只在句子级做约束「忽略更细粒度的音素级」：CLAD 的 LPH 30.30% 对 LPE 8.65% 的巨大落差就是失败模式集中在易混词的证据；③ 已有音素级方法（CED 用 CTC 训练 + 音素到向量库；iPhonMatchNet 用音素检测损失）——隐式对齐精度不足，「缺乏把音素级音频精确映射到文本的足够精度」——音素级监督实际带噪；④ 模态支持单一——Table I 基线要么纯文本要么文本加音频，没有统一框架支持三种注册。三个挑战：音素对齐做准（显式可控可复现）；难负例系统制造（自然数据里是长尾）；三种注册模态统一（共享表征 + 按需激活 + 缺失打掩码）。
