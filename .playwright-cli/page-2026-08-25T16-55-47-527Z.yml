  - heading "§02 方法：块处理 + 损失选型" [level=2] [ref=f301e110]:
    - generic [ref=f301e111]: §02
    - text: 方法：块处理 + 损失选型
  - generic [ref=f301e112]: Q/K/V 不对称窗口 · 帧级 CE 的判别逻辑
  - generic [ref=f301e113]:
    - generic [ref=f301e114]: "块处理: B = 2S（块移位 S = B 的一半） 第 i 块: Q_i = 当前 S 帧 ← 只出查询（省计算） K_i, V_i = 前块 S 帧 + 当前 S 帧 ← 带历史上下文 损失: VTD 分支 = CTC（音素转录） FTM 分支 = 帧级 CE（每帧二分类 · 强制对齐标签）+ uniLSTM 解码器 = CE（仅训练，正则化编码器）"
    - generic [ref=f301e115]: 人话：每处理一块，查询只问「这 S 帧是什么」但可以翻「前 S 帧加当前 S 帧」的笔记——上下文不丢、计算不爆。相邻块重叠一半，帧的信息被平滑衔接。CTC 的灵活性（空白、合并）对判别是噪声，帧级 CE 的硬对齐才是 FTM 要的形状。
  - generic [ref=f301e116]:
    - generic [ref=f301e117]:
      - heading "训练/推理一致性" [level=3] [ref=f301e118]
      - paragraph [ref=f301e119]: 训练时用注意力掩码（因果 + 限窗）模拟流式行为——离线训练看到的上下文结构与在线推理完全相同。这条纪律在多篇论文反复出现（cf. 流式 SLU 的分块一致性）：分布错配会白丢精度。
    - generic [ref=f301e120]:
      - heading "解码器的免费午餐" [level=3] [ref=f301e121]
      - paragraph [ref=f301e122]: 训练时挂一个自回归 TF 解码器（CE 损失）迫使编码器学出更丰富的声学表示——推理时整个不加载。训完即扔的辅助头换表示质量，与流式 SLU 的 CTC 辅助同构：辅助监督的收益留在骨干里。
