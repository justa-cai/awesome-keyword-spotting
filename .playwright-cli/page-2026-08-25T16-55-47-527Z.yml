      - paragraph [ref=f301e260]: 统一 VTD 与 FTM：单模型双任务，FTM 复用 VTD 的上下文编码不重算——文献中首个设备端流式双任务方案。
    - generic [ref=f301e261]:
      - generic [ref=f301e262]: "3"
      - paragraph [ref=f301e263]: 帧级 CE 替代 CTC：消除空白标签歧义，提升 FTM 判别精度——损失函数要贴任务的输出结构选。
