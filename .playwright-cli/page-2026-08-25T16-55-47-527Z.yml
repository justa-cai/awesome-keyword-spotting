    - generic [ref=f301e299]: 可迁移判断
    - paragraph [ref=f301e300]: ↳ 硬件效率是与精度同级的优化目标：本文把内存与推理时间当一级指标实测在真机上——端侧论文只报参数量是「推断可行」，报实测数字才是「证明可行」。
    - paragraph [ref=f301e301]: ↳ 判别任务别用为对齐设计的损失：CTC 的空白与合并机制为「输出比输入短」的转录设计——判别要的是每帧的明确归属。损失函数的灵活性对判别是负资产。
    - paragraph [ref=f301e302]: ↳ 有限窗口 + 长程递归可以胜过全局注意力：流式 SA + uniLSTM 在 FTM 上赢过双向 SA——意图判断需要的是累积证据（递归状态）而非全局对照；选上下文机制要看任务的信息利用方式。
    - paragraph [ref=f301e303]: ↳ 简单专注 > 复杂堆叠：95% 抑制率证明短时意图判别不需要全套 ASR——先验证「最小充分特征集」，再决定上什么模块；很多「必须复杂」的直觉只是没试过简单方案。
