    - listitem [ref=f301e248]: ◈ 最有产品含义的发现：1 秒触发后音频 + 纯声学特征 → 95% 误触发抑制——短时意图判别的信息密度足够高，完整 ASR 是杀鸡用牛刀。「简单专注的声学模型可能比复杂多模块系统更实用」。
    - listitem [ref=f301e249]: ◈ 反直觉的消融：FTM 上流式 SA + uniLSTM 优于双向 vanilla SA——有限窗口 + 长程递归的组合胜过全局注意力；uniLSTM 的持续状态恰是意图判断需要的「累积证据」机制。
    - listitem [ref=f301e250]: ◈ 证据边界：生产数据保密（复现性受限）；未与 Emformer/Blockformer 等流式变体对比；误触发类型未细分；无绝对延迟值——引用相对百分比时注意这些前提。
