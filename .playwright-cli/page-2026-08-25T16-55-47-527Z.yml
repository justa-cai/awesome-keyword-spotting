- generic [ref=f301e2]:
  - generic [ref=f301e3]: 论文精读 · 可视化版 · 2021 №21
  - heading "误触发不用 ASR 来救： 1 秒触发后音频 + 纯声学模型抑制 95% 误唤醒" [level=1] [ref=f301e4]: 误触发不用 ASR 来救：1 秒触发后音频 + 纯声学模型抑制 95% 误唤醒
  - generic [ref=f301e5]:
    - generic [ref=f301e6]: Streaming Transformer VTD+FTM · Apple
    - generic [ref=f301e7]: arXiv 2105.06598 · 生产系统
    - generic [ref=f301e8]: 块处理流式自注意力 · 帧级 CE · uniLSTM
    - generic [ref=f301e9]: 内存 −32% · 推理 −56% · O(n²)→O(n)
  - generic [ref=f301e10]: 一句话：两阶段语音触发检测（VTD）仍有残余误报，传统误触发缓解（FTM）靠 ASR 词格——端侧跑不动、上云有隐私问题。本文用一个共享的流式 Transformer 编码器同时做两个任务：音素转录分支（CTC）管触发检测，短语判别分支（帧级 CE + uniLSTM）用触发后音频判意图——仅声学特征、块处理流式推理。1 秒触发后音频抑制 95% 误触发，VTD 的 FRR 相对降 18%，内存省 32%、推理快 56%，资源增长从 O(n²) 降到 O(n)。
  - generic [ref=f301e11]:
    - generic [ref=f301e12]: TL;DR
    - listitem [ref=f301e13]: ◈ 两阶段 VTD 的残余误报：低算力常开模型出候选 + 大模型二次验证——即便如此，声学相似音频段仍会错误激活助手。FTM 用触发后音频判断用户真意，但传统方案依赖 ASR 词格——完整 ASR 端侧跑不动，服务器端 ASR 把意外语音送云（隐私红线）。
    - listitem [ref=f301e14]: ◈ 联合架构三组件：共享 TF 编码器骨干（声学嵌入）+ 音素转录分支（VTD · CTC 损失）+ 短语判别分支（FTM · 帧级 CE + uniLSTM）；训练期可选挂一个 TF 解码器当正则化器（推理不加载、零开销）。
    - listitem [ref=f301e15]: ◈ 流式自注意力 = 块处理：块移位 S = 块大小 B 的一半（B=2S）；每块的 Q 只含当前 S 帧（省计算），K/V 含前块 S 帧 + 当前 S 帧（保上下文）——有限上下文的因果注意力。训练时用注意力掩码模拟同一行为，训练/推理一致。
    - listitem [ref=f301e16]: ◈ 帧级 CE 替代 CTC 的理由：CTC 的空白标签机制（任意位置插空白、重复合并）对转录是福音、对判别是灾难——触发后音频里的空白歧义让帧级判断变糊。帧级 CE 每帧独立二分类（强制对齐取标签），时间边界定位更准。
    - listitem [ref=f301e17]: ◈ uniLSTM 补上下文：流式 SA 窗口只有 B 帧，uniLSTM 提供更长历史建模；单向保证因果。消融：去掉后 FTM 掉 2–3%。
    - listitem [ref=f301e18]: ◈ 共享编码器 = 共享计算：FTM 直接复用 VTD 已处理的音频上下文编码——不重算、不另存；两个任务一次前向全出。
    - listitem [ref=f301e19]: ◈ 结果：FTM 仅 1 秒触发后音频抑制 95% 误触发（0.5 秒也有 ~85%）——短上下文 + 纯声学就够意图判断；VTD 的 FRR 相对降 18%（帧级 CE + uniLSTM + 联合训练三重贡献）。
    - listitem [ref=f301e20]: ◈ 硬件（真实 Apple 设备实测）：内存 −32%、推理时间 −56%（vs 等价非流式）；资源增长 O(n²)→O(n)——任意长度触发后音频都能处理。K/V 缓存复用避免重复计算。
  - heading "§01 问题：ASR 的价格与隐私" [level=2] [ref=f301e21]:
    - generic [ref=f301e22]: §01
    - text: 问题：ASR 的价格与隐私
  - generic [ref=f301e23]: 两阶段残余误报 + FTM 的两条老路都堵
  - generic [ref=f301e24]:
    - generic [ref=f301e25]:
      - heading "端侧 ASR 装不下" [level=3] [ref=f301e26]
      - paragraph [ref=f301e27]: 完整 ASR 解码（声学模型 + 语言模型 + 词格搜索）计算代价高昂——误触发缓解只需要「用户是不是真在跟助手说话」这个二分类判断，为此跑全套 ASR 是高射炮打蚊子，端侧预算根本不批。
    - generic [ref=f301e28]:
      - heading "云 ASR 的隐私红线" [level=3] [ref=f301e29]
      - paragraph [ref=f301e30]: 把触发后音频送服务器做 ASR——用户的意外语音（跟家人聊天、自言自语）被上传云端。对 Apple 这是产品立场问题不是工程问题：误触发缓解必须完全在设备端完成。
    - generic [ref=f301e31]:
      - heading "两任务两套账装不起" [level=3] [ref=f301e32]
      - paragraph [ref=f301e33]: VTD 与 FTM 独立建模 = 音频编码两遍、内存延迟翻倍。而两任务的底层需求相同（同一段音频的声学表示）——共享编码器在结构上天然合理，关键是流式场景下怎么共享。
    - generic [ref=f301e34]:
      - heading "核心假设值得注意" [level=3] [ref=f301e35]
      - paragraph [ref=f301e36]: 本文赌的是：短时意图判别（触发后 1 秒）所需的信息就藏在声学特征里——不需要词汇语义。95% 的抑制率证明这个假设大体成立，也划出了边界（纯声学不够的场景在边界一节）。
