      - paragraph [ref=f168e15]: 作者：Avamarie Brueggeman（UT Dallas · Apple 实习）；Takuya Higuchi、Masood Delfarah、Stephen Shum、Vineet Garg —— Apple
      - paragraph [ref=f168e16]: 发表：arXiv 2309.16060（2023-09，v2 2024-02，ICASSP 格式短文）· Conv-TasNet × BC-ResNet-8 × GSC+WHAM!
      - generic [ref=f168e17]:
        - generic [ref=f168e18]: SOTA 前端 × SOTA 后端受控对照
        - generic [ref=f168e19]: M1/M2 切开训练分布变量
        - generic [ref=f168e20]: 直接级联全面倒退
        - generic [ref=f168e21]: 唯一成功：干净后端 + 微调
        - generic [ref=f168e22]: 软开关 SDRi 9.19 任务最差
        - generic [ref=f168e23]: 「负结果 + 机制分析」型研究
      - generic [ref=f168e24]:
        - heading "一分钟版本" [level=2] [ref=f168e25]
        - list [ref=f168e26]:
          - listitem [ref=f168e27]: 被系统验证的假设缺口：「SE 前端 + 下游任务」的级联研究几乎全以 ASR 为下游——完整句子 vs 1 秒关键词、离线批处理 vs 流式因果，结论不能直接搬。单通道 SE 无空间信息可依赖，只能靠学习到的统计差异分离，非线性处理引入伪影——「信号更干净」和「分类器更准」之间隔着一层没被系统验证过的假设。
          - listitem [ref=f168e28]: 受控实验设计（方法论贡献）：前端因果 Conv-TasNet（流式约束）、后端 BC-ResNet-8 官方最大模型（给 SE 最好的机会——排除「SE 没用是因为后端差」的替代解释）、M1/M2 双后端（唯一差异 = 训练数据有无噪声）——把「SE 有没有用」拆解成「在什么训练条件下有多少收益」的条件矩阵。
          - listitem [ref=f168e29]: 结果一：直接级联全面倒退：SDRi +5.35dB，M1 带噪 94.3→92.1、M2 96.0→93.0——代理指标与任务指标脱钩最直接的证据：处理伪影对分类器的伤害超过了噪声本身的伤害。
          - listitem [ref=f168e30]: 结果二：唯一成功组合 = M1（干净训练后端）+ 微调后端：带噪 94.3→95.4（+1.1）——机制：M1 没见过噪声、带噪输入是分布外，SE 前端扮演「域适配器」把带噪输入拉回干净训练分布附近，后端再在增强信号上微调适应残留伪影。
          - listitem [ref=f168e31]: 结果三：M2（带噪训练后端）怎么救都无效：最好 95.8%（混合损失双端微调）仍低于基线 96.0%——M2 已在训练中学到内建噪声鲁棒表征，增强信号的伪影反而是新的分布外输入。数据增强与 SE 前端是替代关系：前者免费、后者付前端算力。
          - listitem [ref=f168e32]: 结果四：软开关最讽刺：逐语句预测 α 让 SDRi 高达 9.19dB（信号全场最好），带噪准确率 95.0%（表 4 最差）——它学会了挑「听上去更干净」的混合比例，却不会挑「分类器更喜欢」的。
          - listitem [ref=f168e33]: 联合训练的损失经验：纯 CE 会把前端带崩（SDRi 崩到 −3.66dB——分类损失只要求可分不要求干净，前端可通过扭曲波形拟合边界）；加 β=0.01 的 SDR 正则拉回到 4.96——信号级约束只需百分之一权重就能当前则器，但即便如此仍追平不了无 SE 基线。
          - listitem [ref=f168e34]: α 扫描的验证 / 测试分裂：微调后在验证集上高 α 区间明显超基线，测试集上全部消失——典型过拟合；论文据此推断 GSC（~29 小时量级）撑不起联合训练的参数规模。
          - listitem [ref=f168e35]: 边界：一秒输入砍掉 SE 的上下文（因果非因果仅差 0.21dB——膨胀卷积感受野没吃到，所有结论严格限定短输入条件）；只测非语音噪声（WHAM! 无可懂语音——语音噪声未测）；前端被迫用仿真数据训练（干净-带噪配对依赖）与后端分布错位；计算开销零报告（Conv-TasNet 量级前端对唤醒设备的可行性存疑）；关键差距 0.1–0.4 点无显著性检验。
    - generic [ref=f168e36]:
      - paragraph [ref=f168e37]: §01 · 问题陈述
      - heading "一个受控实验问题：什么时候能、什么时候不能" [level=2] [ref=f168e38]
      - generic [ref=f168e40]: 四个挑战：构造公平可控可复现的测试床（噪声类型 / SNR 范围 / 数据划分）；区分「后端训练分布」这个关键变量（M1/M2 显式切开）；如果级联不行，联合训练与音频注入两种补救是否有效；解释失败——为什么 SNR 更干净的信号反而让分类器更不准（上下文长度 / 数据量 / 伪影 / 训练测试失配的机制层原因）。这是「负结果 + 机制分析」型研究——价值不在新模型，而在一条可转述的工程判断。
