        - generic [ref=f168e81]:
          - text: 联合训练的损失设计（式 1） L = L_CE + β · L_SDR，β = 0.01 纯 CE：前端完全可通过扭曲波形拟合类别边界——SDRi 崩到 −3.66dB（波形崩坏） 加 0.01 倍 SDR：信号级正则把前端拴在「信号仍像语音」的流形附近—— SDRi 回到 4.96，带噪 95.5→95.8（但仍追不平无 SE 的 96.0） 分类梯度与信号梯度尺度悬殊——信号正则只需百分之一权重
          - generic [ref=f168e82]:
            - text: 软开关（soft switching）从 ASR 迁移 256 维 log-Mel → 3 层 BiLSTM(128) → 注意力池化 → FC → softmax 预测逐语句 α 假设：不同语句受污染不同，SE 对有些帮忙有些帮倒忙——逐语句门控应更优 KWS 上的负结果：预测的 α 让 SDRi 高达 9.19dB（全场信号最好） 但带噪准确率 95.0%（表 4 最差）——学会了挑「听上去更干净」， 不会挑「分类器更喜欢」
            - generic [ref=f168e83]:
