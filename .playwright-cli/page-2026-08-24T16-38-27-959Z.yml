            - listitem [ref=f41e279]: 关键超参缺消融：α、ℓ_win、S_Bonus、T_out 无敏感性分析。
            - listitem [ref=f41e280]: 噪声覆盖不均：Mobvoi 排除在混噪实验外（自带噪声无法控 SNR）——中文侧无受控噪声数据；融合策略消融只在英文做。
            - listitem [ref=f41e281]: 误报统计置信度受限：每子集误报音频仅 3 小时、关键词 20 个——低 FAR 档计数样本量小。
            - listitem [ref=f41e282]: 对比面留白：无 WFST 正面对比、束宽固定 10 未扫、与 U2-KWS 类两遍方法未同场。
            - listitem [ref=f41e283]: 训练成本未披露：双任务双头的训练时间/显存增量。
