        - heading "一分钟版本" [level=2] [ref=f41e25]
        - list [ref=f41e26]:
          - listitem [ref=f41e27]: 病灶与药方：单支 Transducer 的后验依赖已预测历史——误差沿解码逐步累积，噪声与困难负样本下退化。药方是 CTC：沿时间轴条件独立、无历史依赖，联合训练当正则 + 推理时双支互为校验。
          - listitem [ref=f41e28]: 双异步：Transducer 头换 TDT（token 级跳帧——预测「这个 token 持续多少帧」，一次前进 d 帧）；CTC 头换 PSD（阈值跳帧——利用 CTC 尖峰性，空白概率 ≥λ 的帧近似丢弃，甜点 35% 跳帧）。
          - listitem [ref=f41e29]: 核心难题「何时融合」：两支跳帧位置不同步——引入占位符 PH；五种融合策略中 CDC-Last 胜出（滑窗余弦相似度做权重 + PH 用最近非占位值填充——被跳帧状态延续而非归零）。
          - listitem [ref=f41e30]: 结果：三场景全面 SOTA——Snips FAR=0.02 miss 率相对降 72%、Mobvoi 中文 miss 降 27.66%/68%、LibriKWS-20 任意词平均 83.50 第一；解码比帧同步快 47–63% 且 miss 率同时降 23%——帧异步是双赢不是交换。
          - listitem [ref=f41e31]: 反直觉证据：CTC 前缀束搜索（57.60）大幅差于贪心（77.16）——通用 ASR 解码不适配 KWS 的直接实证；流式专用解码 > 一切通用解码。
