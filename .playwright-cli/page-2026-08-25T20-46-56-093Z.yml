    - generic [ref=f26e240]: "05"
    - heading "可迁移的判断" [level=2] [ref=f26e241]
    - generic [ref=f26e242]:
      - generic [ref=f26e243]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f26e244]: ① 压缩有拐点：先定容差、再压缓降区。
      - generic [ref=f26e245]: ↳ 先把系统的「必要精度容差」定下来，再在缓降区内尽量往小压——而不是先压到极限再补救精度；拐点位置因任务而异，但要先知道拐点存在才能避免无意中越线。
      - paragraph [ref=f26e246]: ② 速度、参数、能耗是三本独立的账。
      - generic [ref=f26e247]: ↳ 参数小（#17）不等于快（本文）也不等于省电（2021 SNN）——评估一个「高效」方案时先问它在优化哪本账、另两本的账单是什么；三账全优的方案基本不存在。
      - paragraph [ref=f26e248]: ③ 极限探测型论文的价值是坐标不是方案。
      - generic [ref=f26e249]: ↳ 本文没有发明新算子，但它标出了「RTF 0.01 这条线可达、代价是缓降区那几个点」——这种极限坐标让后续所有工作有了参照系；读这类论文要看它画出的边界，而不是它的具体模型。
    - paragraph [ref=f26e250]: "系列坐标：效率极限谱系的速度分支——#17 Neural ODE（同年）是参数极限（−68%），2021 年 SNN 是能耗极限（~30× 理论省电），本文是速度极限（RTF < 0.01）；加上 #1（DS-CNN on M4）的「够用档」部署，KWS 的效率讨论其实一直在「能不能跑 / 能跑多快 / 能省多少电 / 参数多小」四个正交维度上各自推进。"
