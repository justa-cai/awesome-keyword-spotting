    - heading "机制：必要最小的贯彻" [level=2] [ref=f26e81]
    - paragraph [ref=f26e82]: 这篇论文的方法论是「不发明新算子」：用最普通的部件（Mel 前端 + 紧凑网络），把「必要最小」贯彻到每个维度——输入维度（特征压缩）、结构维度（层数/神经元）、算子维度（避开大矩阵乘）、访存维度（缓存友好）、任务维度（按词定制）。它的价值不在某个单一技巧，而在把效率极限的坐标画了出来：后来者知道 0.01 这条线在哪、越线的代价是多少。
