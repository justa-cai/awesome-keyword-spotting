    - generic [ref=f26e118]:
      - generic [ref=f26e119]: "RTF = T_process / T_audio ← 0.01 意味着 1 秒音频 < 10 ms 算完 预算: 100 帧/秒 × 每帧 < 100 μs（特征提取 + 全部网络层） 线性律: 模型大小 ↓一半 ≈ RTF ↓一半（实测近似线性）"
      - generic [ref=f26e120]: 人话：一秒钟的录音，一眨眼的百分之一就要算完——而且每一百微秒就要交一次作业（每帧一次）。要做到这个，网络里不能有任何「贵」的操作，连搬数据的路都要设计得最短。
