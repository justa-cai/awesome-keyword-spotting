  - generic [ref=f26e12]: Technical University of Liberec + Brno University of Technology（Siler / Cernocky）· arXiv 2007.10706（2020.07） 指标：RTF = 处理时间 / 音频时长；< 0.01 即比实时快 100 倍以上 · 方法：特征压到最小 + 极少层数神经元 + 避开大矩阵乘法 + 访存优化 + 按词定制 一句话：模型大小与 RTF 近似线性、精度随缩减先缓降后崩塌——本文的模型驻扎在缓降区，速度极限拿到了、精度没跳崖。
  - generic [ref=f26e13]:
    - generic [ref=f26e14]: "01"
    - heading "问题：每帧只有百微秒" [level=2] [ref=f26e15]
    - generic [ref=f26e16]:
      - generic [ref=f26e17]: TL;DR
      - list [ref=f26e18]:
        - listitem [ref=f26e19]: ◆ RTF（实时率）= 处理时间 / 音频时长：1.0 是刚好实时、0.1 是快十倍、<0.01 是快百倍以上——大多数现有系统远达不到 0.01，在低功耗 MCU 上要么跑不动、要么挤占其他任务。
        - listitem [ref=f26e20]: ◆ RTF < 0.01 的预算语言：1 秒 ≈ 100 帧，每帧总预算 百微秒量级——特征提取加全部网络层都塞在里面，大矩阵乘法直接出局。
        - listitem [ref=f26e21]: ◆ 五条军规的设计：特征维度压到最小、层数与神经元只留必要最小、避开计算密集操作、优化访存（带宽也是钱）、按词定制结构。
        - listitem [ref=f26e22]: ◆ 最有趣的发现是拐点结构：精度随模型缩减先缓降（近乎免费）、过拐点后急剧崩塌——RTF < 0.01 的模型恰好都在缓降区。
