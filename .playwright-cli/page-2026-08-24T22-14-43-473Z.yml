      - generic [ref=f164e24]:
        - heading "一分钟版本" [level=2] [ref=f164e25]
        - list [ref=f164e26]:
          - listitem [ref=f164e27]: 矛盾主线：学习能力 vs 数据需求：学一个可用的关键词音频表示通常需要数千条样本，网络越深越严重；而个性化部署的现实是用户只愿意提供每词几分钟的录音——数量级鸿沟。常规增广（噪声扰动 / 时间平移 / 拉伸 / SpecAugment）注入的都是小幅变化，多样性受扰动算子种类限制——这条路堆料已经到顶。
          - listitem [ref=f164e28]: mixup 的先天不良反应在语音上被放大：两段语音重叠混合 = 高度失真不自然的信号——噪声化输入让模型困惑，误差中出现奇异尖峰，尖峰主导有效梯度、损害收敛；低资源下样本少，每次被污染的梯度更新占比更大，伤害进一步放大。
          - listitem [ref=f164e29]: CosMix 的核心：保留波形级插值 + 软标签框架，额外用预混原始样本当锚点的对比损失约束混音表示——模型「知道」混音里含哪些 utterance（消歧），必须提取「混合后仍存活的属性」（增强），压掉扰动敏感的冗余维度保住判别维度（信息瓶颈式塑形）。
          - listitem [ref=f164e30]: 三个精巧设计：λ 对称加权——对比监督的权重随源语音在混音中的实际占比同步缩放（软标签逻辑在表示空间的镜像）；投影头——对比在 128 维投影空间塑形，不直接扭曲分类特征空间（正样本对里两个源类别不同，直接拉会与分类目标冲突）；停止梯度——监督单向流动防对比目标互相拉扯。
          - listitem [ref=f164e31]: 50% 双模式：不做混音的那一半训练步切换到自对比（同一句话两个独立增广视图一致，Λ=1）——嵌入前期 I2CR 的增广一致性正则；甜点漂移：vanilla mixup 最优混音率 30%、CosMix 到 50% 才最优——对比锚点兜底后能承受更重混音，把正则化潜力挖得更深。
          - listitem [ref=f164e32]: 最干净的修复证据（Table 1 5% 档）：vanilla mixup 让 ResNet18 掉点（0.828→0.822）、KWT-1 掉 5.8 点（0.683→0.625）；CosMix 分别逆转为 0.841 和 0.701（对 vanilla 拉回 7.6 点）——「混音歧义污染梯度」在数字上显形，又被对比锚点救回。
          - listitem [ref=f164e33]: 受益最大的是最脆弱的模型：KWT-3（5.4M）5% 档基线只有 0.465（全表最惨）——样本不足以学会高度复杂的注意力机制；CosMix 拉到 0.566（相对 +21.7%），对比约束相当于给注意力层提供额外学习信号源，部分替代缺失样本的监督。绝对最高：ConvMixer（0.1M 最小参数）2.5 分钟数据达 90%。
          - listitem [ref=f164e34]: 超参规律（Table 2）：等比例混合 Beta(10,10) 优于双峰偏向 Beta(0.5,0.5)（短词需要两条内容都清晰可辨的混音）；性能曲面双峰（受 Beta 双峰形状影响）——单点调参易踩鞍部；反例角落存在（低混音率 + 凸形 Beta 时 CosMix 反低于 vanilla）。
          - listitem [ref=f164e35]: 边界：对比只有正样本对无负样本（只拉近不推远，类间分离全靠分类损失——用简单性换表达力）；基线越强数据越多边际收益越薄（ConvMixer 50% 档甚至 −0.2）；波形线性混合 vs 对数 FBank 非线性的近似错位未讨论；摘要的「个性化自定义唤醒词」动机与实验设定脱节——没有新词注册、没有用户真实录音、没有少样本微调协议，只是按说话人裁剪的固定词表模拟；无统计显著性检验（不少差距只有 0.001–0.005）；只有封闭集分类准确率，无流式检测的误拒 / 误警指标。
    - generic [ref=f164e36]:
      - paragraph [ref=f164e37]: §01 · 问题陈述
      - heading "用最小代价修复一个已知有效方法的已知缺陷" [level=2] [ref=f164e38]
      - generic [ref=f164e40]: 三条约束条件：模型无关——同一套训练算法要对 transformer 系（KWT-1/3）和卷积系（ConvMixer / ResNet18）都有效，覆盖 0.1M–11.9M 参数体量；计算开销可忽略——KWS 是端侧任务，训练侧额外成本也不能高；设计简单——不引入需要大量调参的新组件。已有 mixup 变体（Manifold Mixup / CutMix / MixSpeech / L-mix）各自解决自己领域的问题，没有一个针对「低资源 KWS 中 mixup 噪声梯度伤收敛」这个具体病灶给出约束机制。
      - generic [ref=f164e41]: 低资源构造的严格之处：按说话人裁剪 GSC 训练集到 5/10/20/30/50%（每词 2.5–25 分钟）——随机裁剪只减样本量，按说话人裁剪同时减样本量和说话人覆盖度，对过拟合的刺激更狠，更逼近真实个性化部署可获得的数据规模。
