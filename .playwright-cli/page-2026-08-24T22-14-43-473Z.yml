      - heading "mixup 在语音上会污染梯度——极端低资源下甚至帮倒忙—— 给混音配上「它该是哪两段话的叠加」的对比锚点" [level=1] [ref=f164e13]: mixup 在语音上会污染梯度——极端低资源下甚至帮倒忙——给混音配上「它该是哪两段话的叠加」的对比锚点
      - paragraph [ref=f164e14]: "CosMix: Contrastive Speech Mixup for Low-Resource Keyword Spotting"
      - paragraph [ref=f164e15]: 作者：Dianwen Ng、Ruixi Zhang、Jia Qi Yip 等，Eng Siong Chng、Bin Ma —— 阿里巴巴集团 · 南洋理工大学
      - paragraph [ref=f164e16]: 发表：arXiv 2305.01170（2023-05）· GSC 10 词 · 4 模型 × 5 档数据量（每词 2.5–25 分钟）
