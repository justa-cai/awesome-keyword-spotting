      - paragraph [ref=f164e272]: §05 · 局限与边界
      - heading "摘要动机与实验设定的最大落差" [level=2] [ref=f164e273]
      - generic [ref=f164e275]:
        - generic [ref=f164e276]:
          - heading "技术局限" [level=4] [ref=f164e277]
          - list [ref=f164e278]:
            - listitem [ref=f164e279]: 只有正样本对：只拉近不推远，类间分离全靠分类损失——表示学习上限没被推满（InfoNCE 式负样本会带来批量依赖与开销，与「简单」定位冲突的明确取舍）。
            - listitem [ref=f164e280]: 收益随基线强度衰减：最强模型 ConvMixer 提升最薄（5% +1.5，50% 档甚至 −0.2）——β=0.5 固定权重非处处最优，敏感性未报。
            - listitem [ref=f164e281]: 超参敏感且双峰：网格里存在 CosMix 落后 vanilla 的角落——实际部署需付网格搜索成本（未量化）。
            - listitem [ref=f164e282]: 波形混合与特征前端的非线性错位：对数 FBank 下波形级线性混合 ≠ 特征线性混合——软标签线性假设存在近似误差，未讨论。
            - listitem [ref=f164e283]: 表示质量只有定性证据：t-SNE 只覆盖一个点且本身保簇能力有限——无轮廓系数等定量嵌入指标。
        - generic [ref=f164e284]:
          - heading "实验设计不足" [level=4] [ref=f164e285]
          - list [ref=f164e286]:
            - listitem [ref=f164e287]: 低资源是模拟的不是真实协议（全文最大软肋）：动机是「个性化自定义唤醒词」——但没有新词注册实验、没有用户真实录音、没有少样本微调协议，十个关键词仍是固定词表、测试说话人同分布。
            - listitem [ref=f164e288]: 只有封闭集分类准确率：真实 KWS 部署指标是流式检测的误拒 / 误警权衡（DET 曲线）——混音训练对检测门限与误警行为的影响完全未触及。
            - listitem [ref=f164e289]: 无统计显著性：不少差距只有 0.001–0.005（ConvMixer 50% 档 0.976 对 0.978），无多种子方差 / 置信区间——是否超出噪声无法判断。
            - listitem [ref=f164e290]: 对比面窄 + 开销未量化：MixSpeech / Manifold Mixup / L-mix / I2CR 均未适配进对比；不与半监督 / 自监督预训练这条低资源主流路线比；三支路前向 + 投影头的训练开销「可忽略」只停在定性。
      - generic [ref=f164e291]: 值得补的方向：真实关键词注册协议（新词 + 少量用户录音 + 快速适配 + 误拒 / 误警流式指标——补齐动机与实验落差的第一优先级）；负样本完整对比框架（批内负样本 / 动量队列，与 β、混音率联合消融探明上限）；自动化超参（Beta 形状驱动的混音率课程学习——先低后高爬升，或贝叶斯搜索替代人工网格）；与量化 / 剪枝 / NAS 端侧栈的正交组合；低资源 + 远场噪声双重压力；机理深挖——量化混音训练的梯度范数分布，直接测量对比损失引入前后梯度尖峰的抑制程度，把修复效应因果链做成可验证的定量证据。
