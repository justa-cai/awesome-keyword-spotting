      - generic [ref=f164e115]: 与主流对比学习的差异：只用正样本对、没有负样本、不是 InfoNCE 形式——降低对批量大小和负样本队列的依赖（对比项开销更小），但只做「拉近」不做「推远」，类间分离完全依赖分类损失——用简单性换表达力的明确取舍。
