  - generic [ref=f273e346]:
    - generic [ref=f273e347]: 读表要点
    - listitem [ref=f273e348]: ◈ 多条件训练的收益区间在 ≥0dB（+5–15%）——这不是「训练技巧」而是「标准做法」；但 −5dB 下改善有限，强度上限摆在那里：超出训练分布太远的噪声谁也补不了。
    - listitem [ref=f273e349]: ◈ SpecAugment 与多条件互补：频域遮蔽模拟的是信息缺失、加噪模拟的是能量污染——两种退化模式正交，组合用效果最佳。
    - listitem [ref=f273e350]: ◈ t-SNE 的方法论价值：给「准确率掉了」补上「为什么掉」的内部视角——中间层可视化成本极低，值得进每个鲁棒性评测的标准流程。
    - listitem [ref=f273e351]: ◈ 引用提醒：数字为跨架构均值的约值口径，具体架构 × 噪声组合有差异；曲线为示意轨迹（趋势与结论一致）。
