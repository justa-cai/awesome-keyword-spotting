    - generic [ref=f273e22]: §01
    - text: 问题：四个没人系统回答的基础问题
  - generic [ref=f273e23]: 方法论文很多，行为认知很少
  - generic [ref=f273e24]:
    - generic [ref=f273e25]:
      - heading "问题一：噪声类型等价吗" [level=3] [ref=f273e26]
      - paragraph [ref=f273e27]: 人声嘈杂、交通噪声、音乐噪声——大家都笼统地说「噪声鲁棒」，但这些类型造成的下降是同等的吗？答案差得极远：babble 与白噪声是天壤之别——这直接影响测试矩阵的设计。
    - generic [ref=f273e28]:
      - heading "问题二：架构有系统差异吗" [level=3] [ref=f273e29]
      - paragraph [ref=f273e30]: CNN 和 RNN 在噪声下的鲁棒性是否存在系统性差异？这是工程选型最关心的问题之一——选骨干时「谁的噪声行为更可预测」比「谁干净准确率高半个点」更实际。
    - generic [ref=f273e31]:
      - heading "问题三：训练策略的边界" [level=3] [ref=f273e32]
      - paragraph [ref=f273e33]: 多条件训练与噪声增强到底能缓解多少？在哪些 SNR 下有效、哪些条件下失效？「加噪训练」不是万能药——它有自己的适用区间和上限。
    - generic [ref=f273e34]:
      - heading "问题四：黑箱里发生了什么" [level=3] [ref=f273e35]
      - paragraph [ref=f273e36]: 准确率掉了个数字，但模型内部发生了什么？类别分布怎样漂移、决策边界怎样变形——内部视角能把「掉点」解释成「机理」，让下一代方法设计有的放矢。
