  - generic [ref=f273e115]:
    - generic [ref=f273e116]:
      - heading "为什么 babble 最毒：频谱重叠" [level=3] [ref=f273e117]
      - paragraph [ref=f273e118]: 判别关键词靠的是共振峰带的时频模式——babble 的能量恰好铺满同一区域，判别特征被「同类信号」淹没；白噪声平铺全频带，落在共振峰里的比例反而低。危害 = 与语音频谱的重叠度。
    - generic [ref=f273e119]:
      - heading "为什么 CNN 耐噪：局部性天赋" [level=3] [ref=f273e120]
      - paragraph [ref=f273e121]: CNN 的局部核只看邻域——噪声扰动被局部化，未受污染的区域仍能供出局部模式；平移不变性又让特征对扰动位置不敏感。RNN 的状态则是单帧误差的累积器：噪声一旦进入，污染沿时间轴传播到整个序列的判决。
