  - heading "不提新方法，先做体检： KWS 网络在噪声下到底怎么死的" [level=1] [ref=f273e4]: 不提新方法，先做体检：KWS 网络在噪声下到底怎么死的
  - generic [ref=f273e5]:
    - generic [ref=f273e6]: 噪声行为系统分析 · IIT / 图宾根 / 亚琛工大
    - generic [ref=f273e7]: arXiv 2109.07930 · 分析型基准研究
    - generic [ref=f273e8]: 5 类噪声 × 4 档 SNR × CNN/RNN × 3 种训练
    - generic [ref=f273e9]: babble 最毒（10dB 掉 15–30%）· CNN 全线比 RNN 耐噪
  - generic [ref=f273e10]: 一句话：大量噪声鲁棒 KWS 论文在提新方法，却没人系统回答过四个基础问题：不同噪声危害一样吗？CNN 和 RNN 谁耐噪？多条件训练能救多少？噪声下模型内部发生了什么？本文做全因子体检：babble（人声嘈杂）破坏性最大——频谱与语音完全重叠，10dB 下所有架构掉 15–30%；CNN 在所有 SNR 下都比 RNN 耐噪（局部性是天赋）；多条件训练在 ≥0dB 恢复 5–15%、−5dB 无力回天；t-SNE 显示 babble 造成的类别分布漂移最严重。
  - generic [ref=f273e11]:
    - generic [ref=f273e12]: TL;DR
    - listitem [ref=f273e13]: ◈ 研究定位：分析型论文，不提新架构——价值在可复现的基准（GSC v2 + DEMAND/MUSAN 标准噪声库）与给社区的设计指南。四个问题：噪声类型差异？架构差异？训练策略作用？内部行为变化？
    - listitem [ref=f273e14]: ◈ 噪声危害由「像不像语音」决定，不由响度决定：babble（多说话人嘈杂）的频谱与目标语音高度重叠——模型无法分离，10dB 下所有架构掉 15–30%；白噪声反而轻得多（平铺全频带，与共振峰重叠比例低）。
    - listitem [ref=f273e15]: ◈ 危害排序（10dB 降幅）：babble −15~30% > 音乐 −5~15% > 环境噪声（风/雨/空调）−3~10% > 白噪声。噪声测试矩阵要按频谱重叠度排优先级，不是所有 dB 等价。
    - listitem [ref=f273e16]: ◈ CNN 全线比 RNN 耐噪：10dB 下 CNN −5~10% vs RNN −10~15%；0dB 下 −15~25% vs −20~35%。机理：CNN 的判别靠局部时频模式（噪声中相对稳定）+ 平移不变性；RNN 的判别依赖跨帧状态——单帧噪声的误差在状态里时间累积，污染沿序列传播。
    - listitem [ref=f273e17]: ◈ SNR 刻度尺：20dB 只掉 1–3%（轻度噪声不必过度焦虑）；10dB 架构分化开始；0dB 全面重伤；−5dB 几乎所有架构降到接近随机——多条件训练也救不回来。
    - listitem [ref=f273e18]: ◈ 多条件训练应作为标准做法：≥0dB 恢复 5–15%（几乎所有噪声类型一致有效）；SpecAugment 与多条件互补（频域遮蔽 ≠ 加噪），两者结合最佳——性价比最高的配置。
    - listitem [ref=f273e19]: ◈ t-SNE 内部证据：噪声下类别分布显著漂移、边界变糊——babble 的漂移最严重；多条件训练后的模型在噪声下保持更好的类别分离。中间层可视化是诊断鲁棒性的廉价工具。
    - listitem [ref=f273e20]: ◈ 边界：仅 GSC 孤立词（非流式）；未覆盖回声/混响/非线性失真；未探索语音增强前端；噪声注入是线性叠加（真实交互更复杂）。
