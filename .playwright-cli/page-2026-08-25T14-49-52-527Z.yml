  - generic [ref=f273e355]:
    - generic [ref=f273e356]:
      - generic [ref=f273e357]: "1"
      - paragraph [ref=f273e358]: 最全面的噪声行为分析（截至 2021）：多架构 × 多噪声类型 × 多 SNR 的系统覆盖——社区可复现、可对齐的实验基准。
    - generic [ref=f273e359]:
      - generic [ref=f273e360]: "2"
      - paragraph [ref=f273e361]: 识别最具破坏性的噪声类型：babble 因频谱与语音高度重叠而最毒——纠正「白噪声最伤」的直觉误判。
    - generic [ref=f273e362]:
      - generic [ref=f273e363]: "3"
      - paragraph [ref=f273e364]: 架构-鲁棒性关系的实证：CNN 比 RNN 耐噪（局部特征 + 平移不变性 vs 时间累积效应）——噪声敏感应用的选型依据。
    - generic [ref=f273e365]:
      - generic [ref=f273e366]: "4"
      - paragraph [ref=f273e367]: 多条件训练收益的量化：几乎所有噪声类型和 SNR 下一致提升——验证其作为标准 KWS 训练策略的有效性。
