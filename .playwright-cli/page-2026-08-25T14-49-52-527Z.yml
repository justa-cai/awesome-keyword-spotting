  - generic [ref=f273e400]:
    - generic [ref=f273e401]: 可迁移判断
    - paragraph [ref=f273e402]: ↳ 噪声的危害由相似度决定而非响度：与语音频谱重叠越高越毒——设计测试矩阵时按重叠度排优先级，babble 永远排第一；只测白噪声的鲁棒性报告等于没测。
    - paragraph [ref=f273e403]: ↳ 局部性是免费的降噪天赋：噪声在局部核里被局部化、在循环状态里被累积——需要噪声鲁棒的场景里，架构的归纳偏置本身就是第一道防线。
    - paragraph [ref=f273e404]: ↳ 训练分布覆盖到哪，恢复就到哪：多条件训练在 ≥0dB 恢复 5–15%、在 −5dB 无力——增强的收益以「训练时见过类似的退化」为前提，超出分布的强度没有免费午餐。
    - paragraph [ref=f273e405]: ↳ 分析型论文的长期价值不亚于方法论文：不提新方法，但给出的基准、选型指南和诊断方法（t-SNE 进评测流程）会被后续所有工作引用——社区需要的不仅仅是新架构，还有对现有系统的系统认知。
