  - generic [ref=f14e13]:
    - generic [ref=f14e14]: "01"
    - heading "问题：一个核看不遍所有时间尺度" [level=2] [ref=f14e15]
    - generic [ref=f14e16]:
      - generic [ref=f14e17]: TL;DR
      - list [ref=f14e18]:
        - listitem [ref=f14e19]: ◆ 关键词的声学模式横跨三个时间尺度：短时瞬态（爆破音/摩擦音，3–5 帧）、中等时长（元音共振峰/音节过渡，9 帧）、长时轮廓（韵律/声调走向，15–21 帧——中文等声调语言尤甚）。
        - listitem [ref=f14e20]: ◆ 单一固定核长的卷积无法同时有效捕获三者——这是固定套路 KWS 的性能上限之一。
        - listitem [ref=f14e21]: ◆ MTConv 的答案：训练时多分支并行（不同核长的深度卷积各看一个尺度，输出相加），推理前通过核融合折叠成单个核——多尺度的容量全部搬进训练期。
        - listitem [ref=f14e22]: ◆ 核融合的合法性来自卷积对核的线性性：分支输出相加 = 核先相加再卷积——数学上完全等价，部署端一个子都不多花。
