      - paragraph [ref=f14e252]: ① 「训练时多分支、部署前折叠」是把容量搬进训练期的通用杠杆。
      - generic [ref=f14e253]: ↳ 凡是对核/分支线性的结构（卷积、BN 的缩放偏置）都能做等价重参数化——RepVGG（视觉）、MTConv（语音时序）同一年各自落地；端侧模型设计时应默认问一句：这个训练期结构能折叠吗？
      - paragraph [ref=f14e254]: ② 免费的东西要按「单位开销的收益」估值，不是绝对值。
      - generic [ref=f14e255]: ↳ 0.2% 单看寒酸，但分母（推理开销增量）是零——收益/成本比为无穷大；评估优化手段时报「每 1% 推理开销换多少精度」比报绝对提升更能指导决策。
      - paragraph [ref=f14e256]: ③ 时间尺度的多样性是语音任务的物理属性，不是工程偏好。
      - generic [ref=f14e257]: ↳ 瞬态、共振峰、声调轮廓天然存在于不同时间窗——模型要么显式带多尺度结构（本文、Inception 系），要么用堆叠/空洞间接逼近；承认并利用尺度的物理分层，常比调单一核长更根本。
    - paragraph [ref=f14e258]: "系列坐标：「训练增强·推理折叠」家族的语音侧代表——与同期 CV 界 RepVGG 的重参数化思想并行；与 #16 的空洞卷积（膨胀率扩感受野、零参数增量）是扩时间视野的两条互补路线；2021 年 SE-Res2Net 的多尺度分组是同一诉求的注意力形态。感受野的多尺度问题贯穿整个 KWS 架构史。"
