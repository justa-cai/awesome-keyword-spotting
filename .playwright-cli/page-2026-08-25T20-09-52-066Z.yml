  - generic [ref=f14e72]:
    - generic [ref=f14e73]: "02"
    - heading "机制：折叠的艺术" [level=2] [ref=f14e74]
    - paragraph [ref=f14e75]: MTConv 的训练形态是「四只手」：3×1、9×1、15×1、21×1 四条深度卷积分支并行，各自捕获对应时间窗的特征后逐元素相加。妙处在于这个相加可以被提前——卷积对核是线性的，把各分支的核零填充对齐到同一长度后逐元素相加，得到一个等效单核：推理时的计算图里没有分支、没有多尺度，就是一个普通卷积。
    - img [ref=f14e76]:
      - generic [ref=f14e78]: 机制解剖：多分支怎么长 · 融合为什么合法
      - generic [ref=f14e79]: MTConv 的训练形态
      - generic [ref=f14e82]: 输入特征
      - generic [ref=f14e84]: 3×1 分支
      - generic [ref=f14e86]: 9×1 分支
      - generic [ref=f14e88]: 15×1 分支
      - generic [ref=f14e90]: 21×1 分支
      - generic [ref=f14e91]: y = Σ 分支输出（逐元素相加）
      - generic [ref=f14e92]: 每支 = 不同时间窗的感受野：
      - generic [ref=f14e93]: · 3 帧窗看爆破 · 9 帧窗看共振峰 ·
      - generic [ref=f14e94]: 21 帧窗看声调走向
      - generic [ref=f14e95]: 核融合为什么合法
      - generic [ref=f14e97]: 卷积对核是线性的：
      - generic [ref=f14e98]: conv(x, k₁) + conv(x, k₂)
      - generic [ref=f14e99]: = conv(x, k₁ ⊕pad k₂) ← 核先加 = 结果后加
      - generic [ref=f14e100]: 所以推理前可以：
      - generic [ref=f14e101]: · 各分支核零填充对齐到最大长度
      - generic [ref=f14e102]: · 逐元素相加 → 一个等效核
      - generic [ref=f14e103]: · 多分支网络 → 数学上完全等价的
      - generic [ref=f14e104]: 单核网络
      - generic [ref=f14e105]: 推理形态：
      - generic [ref=f14e106]: · 参数量 = 单个 9×1 核（融合核与单核同尺寸
      - generic [ref=f14e107]: 量级）· 计算图无分支——端侧部署零负担
      - generic [ref=f14e108]: 代价转移：多尺度的好处白拿，训练时多算
      - generic [ref=f14e109]: 几条分支的账——「训练贵一点，推理免费」
      - generic [ref=f14e110]: 左：训练时四个不同核长的分支并行，各自看一个时间尺度后相加。右：卷积对核的线性性让「分支相加」可以提前到「核相加」——多分支训练形态在推理前折叠成单核，部署零开销
    - generic [ref=f14e111]: 图 2 · 机制解剖：多分支训练形态 · 核融合的数学合法性与推理形态
    - generic [ref=f14e112]:
      - generic [ref=f14e113]: "MTConv: y = Σᵢ DWConv_kᵢ(x), kᵢ ∈ {3, 9, 15, 21} ← 训练形态（多分支） 核融合: conv(x, k₁) + conv(x, k₂) = conv(x, k₁ ⊕pad k₂) ← 线性性 → 核先加 推理形态: y = DWConv_k_fused(x) ← 单核，参数/计算 = 基线 TENet 块: 1×1 扩展 → 深度时序卷积(MTConv 替位) → 1×1 投影 → 残差"
      - generic [ref=f14e114]: 人话：训练时让网络长四只不同长度的手去摸不同大小的时间窗；练完之后发现四只手的动作可以「合并同类项」成一只手——部署时这只手干全部的活，工资（算力）和单手版一模一样。
    - paragraph [ref=f14e115]: 这是重参数化（re-parameterization）家族的成员：同期 CV 界的 RepVGG 用同样的思路把多分支块折叠成单路 3×3 卷积——「训练时结构自由、部署时结构极简」的思想在语音与视觉并行出现，MTConv 是它在 1D 时序卷积上的干净实例。
