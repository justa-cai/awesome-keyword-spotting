      - paragraph [ref=f171e16]: 发表：arXiv 2303.10912（2023-03）· TCANet 65K 参数 · SC 12 类 + AISHEEL 跨域
      - generic [ref=f171e17]:
        - generic [ref=f171e18]: 双重低资源：标注少 + 算力小
        - generic [ref=f171e19]: WVC：帧级隐表示回归
        - generic [ref=f171e20]: LGCSiam：双尺度对比防坍缩
        - generic [ref=f171e21]: 5% 标注 +4.28 点
        - generic [ref=f171e22]: 中文预训练 → 英文微调几乎无损
        - generic [ref=f171e23]: 65K 超 305K 基线
      - generic [ref=f171e24]:
        - heading "一分钟版本" [level=2] [ref=f171e25]
        - list [ref=f171e26]:
          - listitem [ref=f171e27]: 三条痛点纠缠：标注数据有限（标注贵）、设备资源有限（模型卡死在几十 K 参数——小模型在少数据下更容易过拟合）、环境分布漂移（产线模型换部署环境就掉点，重新标注又回到第一条）。共同指向：无标注语音便宜量大，能不能用它给要部署的小模型注入先验？
          - listitem [ref=f171e28]: 两条既有路线的死结：把 wav2vec 2.0 引入 KWS 的两种用法各有致命伤——微调路线要求部署模型就是那个大模型（几千万参数端侧放不下）；伪标签路线要求教师能输出与下游标签空间对齐的标签（通用自监督模型没有关键词分类头，先微调教师又回到第一条）。直接搬 CV 对比学习（SimCLR/SimSiam）还有孪生网络坍缩风险（输出常向量最省力，表示彻底失效）。
          - listitem [ref=f171e29]: 核心设计哲学：被预训练的对象就是要部署的小模型本身——不是「先训大再蒸馏」的两段式：训练形态 = 部署形态（避免二次精度损失）；教师网络与孪生分支只存在于训练期，推理时全部摘掉（端侧开销为零）。
          - listitem [ref=f171e30]: WVC（全文最有效，5% 标注下单独 +4.06）：wav2vec 2.0 当约束——学生编码器输出（64 维）经 MLP 投影头 64→128→768，与教师隐表示做 MSE 逐帧回归。不对齐标签只对齐表示：逐帧稠密目标 → 任何无标注音频都能用；投影头吸收维度变换负担（主干保持 64 维小开销，推理时摘掉）。
          - listitem [ref=f171e31]: LGCSiam（局部-全局对比孪生）：同一波形两个增广过共享权重的 E+D——局部正对（相同帧位置，InfoNCE τ=0.5）+ 全局正对（时间平均池化句级向量，MSE）+ 负对来自跨样本与跨时间戳两个维度（负样本池免费扩展到 B×T/2——不加大 batch 白拿序列维负样本；不同时间戳设负对防「平滑低通」退化解）。
          - listitem [ref=f171e32]: TCANet 载体：7 层时序卷积编码器（可分离 conv 缩参 ~8×、首层 stride=2 时域减半——注意力开销砍 4×）+ 多头自注意力解码器（一步全局感受野，把「跨频带跨帧依赖」从架构深度问题变成 64×64 投影）——65K 参数 96.85，同参数量超 TC-ResNet8（66K）0.75 点；加表示学习 97.5，用 1/5 体积超 305K 的最大基线 0.9 点。
          - listitem [ref=f171e33]: 最有信息量的三条消融：① 标注越少增益越大——100% 设定 +0.65，5% 设定 +4.28（6.6 倍）：预训练把参数初始化到声学合理流形，收窄小数据搜索空间；② WVC 主导、LGCSiam 边际——单独 +4.06 vs +1.68，叠加只再多 +0.22（帧级稠密教师信号的信息量远大于增广不变性这条弱约束——如果只能做一个模块，先做 WVC）；③ 跨语言几乎无损——中文 AISHELL 预训练 → 英文 SC 微调只掉 0.05/0.19 点；且 LGCSiam 跨域掉 0.83 vs WVC 只掉 0.17——增广不变性锚定预训练分布，wav2vec 表示本身语言无关。
          - listitem [ref=f171e34]: 多阶段组合：仅 WVC 预训练编码器 → WVC+LGCSiam（0.9:0.1）联训整条通路 → 带标签微调（CE 0.9 + 两无监督各 0.05——「表示保持」是微调期的持续约束而非一次性初始化，防小标注集上向 12 类边界漂移过快）。
          - listitem [ref=f171e35]: 边界：WVC 训练成本被转嫁且未量化（每迭代前向 12 层 transformer 教师）；全局平均池化是离线判决形态（真实唤醒需逐帧低延迟触发 + 误唤醒抑制——流式化方案未提）；LGCSiam 的实例判别与摘要声称的「相似音频相似表示」存在张力（同关键词不同说话人被负对推开）；超参全手调无敏感性；只有准确率指标（无 FA/FR、时延、功耗）；单一下游基准；未与引言自己分析的伪标签 / 蒸馏路线做实验对比。
    - generic [ref=f171e36]:
      - paragraph [ref=f171e37]: §01 · 问题陈述
      - heading "「用大模型但不部署大模型」" [level=2] [ref=f171e38]
      - generic [ref=f171e40]: 三个子挑战：① 如何把 wav2vec 2.0 的知识转移给小到能上端的学生编码器而不继承其体积；② 如何设计不自坍缩的自监督对比结构，让句级和帧级表示都被有效约束（正负样本对怎么造）；③ 多个无监督损失与有监督 CE 如何分阶段、按权重组合才能互相增益不打架。CNN 系端侧方法的结构性问题：依赖大量标注数据、2D CNN 要堆很深才能捕捉跨频带跨帧依赖（深 = 大，与 small-footprint 冲突）、对环境漂移脆弱。
