    - generic [ref=f209e112]: 轨道 A：eGeMAPS 88 维 + 逻辑回归 vs 轨道 B：wav2vec 2.0-base（12 Transformer 块 + 7 卷积块），四种微调部位
    - generic [ref=f209e113]: 人话：两条轨道各代表一种小数据知识来源——A 把数十年情感研究压缩进 88 维手工特征（与 488 条样本统计匹配），B 把 LibriSpeech 自监督学到的通用语音表示迁移过来。微调部位消融把「迁移什么」与「迁移多少」解耦：编码器低层声学表示 ≈ 手工特征的作用面，上下文网络高层组合表示是情绪映射最可能发生的层。
  - paragraph [ref=f209e114]: 评测口径：WA（整体准确率）与 UA（各类召回的宏平均）并报——类别轻度不平衡时 WA 被多数类主导、UA 专门暴露少数类崩塌；8 折说话人独立交叉验证（每折 7 人训练 + 1 人测试，约 61 条/折）。
