  - generic [ref=f209e279]: 基准而非可用系统
  - generic [ref=f209e280]:
    - generic [ref=f209e281]:
      - heading "规模是最大的墙" [level=4] [ref=f209e282]
      - paragraph [ref=f209e283]: 488 条、8 人：每折测试约 61 条，单条翻转影响 1.6 个点；4 男 4 女撑不起性别鲁棒性检验，年龄方言方差无从估计——所有绝对数字都应在统计噪声背景下解读。
    - generic [ref=f209e284]:
      - heading "acted ≠ spontaneous" [level=4] [ref=f209e285]
      - paragraph [ref=f209e286]: 全部声优表演情绪，与真实驾驶舱自发情绪（疲劳/路怒/分心）有声学分布差距——情境卡片缓解了命令式念词，但无法消除表演与自发的本质差异，向真实情绪泛化未验证。
    - generic [ref=f209e287]:
      - heading "录制环境不可控" [level=4] [ref=f209e288]
      - paragraph [ref=f209e289]: 全程线上，只约束了教程、30cm 嘴麦距离——麦克风型号/房间混响/底噪未报告，无法研究设备通道鲁棒性；真实车载是发动机噪声 + 远场多麦。
    - generic [ref=f209e290]:
      - heading "验证设计与基线覆盖" [level=4] [ref=f209e291]
      - paragraph [ref=f209e292]: 验证者非盲（自己验证自己写的情境）、无一致性系数、「全员判错才删」保留大量标签噪声；分类器只有逻辑回归、预训练只有 wav2vec2-base（无 HuBERT/WavLM 对比）；无显著性检验；第四象限（平静/放松——正常驾驶最常见状态）缺失。
  - generic [ref=f209e293]:
    - heading "可迁移判断（超出本数据集也成立）" [level=4] [ref=f209e294]
    - list [ref=f209e295]:
      - listitem [ref=f209e296]: ↳ 小数据迁移学习的关键决策不是「要不要迁移」，是「迁移哪一层」——冻结低层等于免费保留大语料声学先验，同时把可训练参数压到与样本量匹配。
      - listitem [ref=f209e297]: ↳ 预训练目标与下游目标不对齐时，大模型表征不自动兑现——不微调的 wav2vec2 不如 88 维手工特征，先检查目标对齐再谈模型大小。
      - listitem [ref=f209e298]: ↳ 数据集构建先在连续空间（效价-唤醒）检查覆盖、再落类别——第四象限的空缺就是这么被发现的；直接定四个情绪词看不到覆盖缺口。
      - listitem [ref=f209e299]: ↳ 主观标注任务必须先立人类线：模型「超过人类」的含义取决于超过的是人类的哪个短板——补位（高唤醒 vs neutral）与全面超越是两回事。
      - listitem [ref=f209e300]: ↳ 情绪诱导要在采集端做足（情境脚本 + 参考图），不要指望后期标注甄别——不稳定环节前置解决。
