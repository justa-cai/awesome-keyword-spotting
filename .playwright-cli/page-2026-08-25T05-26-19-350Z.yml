    - generic [ref=f209e4]: 论文精读 · 可视化版 · 2022 №18
    - heading "唤醒词不止是开机口令： 在 0.64 秒里读出说话人的情绪" [level=1] [ref=f209e5]: 唤醒词不止是开机口令：在 0.64 秒里读出说话人的情绪
    - generic [ref=f209e6]:
      - generic [ref=f209e7]: Hi,KIA · arXiv 2211.03371
      - generic [ref=f209e8]: KAIST × 起亚设计中心
      - generic [ref=f209e9]: 首个唤醒词情绪数据集（韩语）
      - generic [ref=f209e10]: 488 条 · 四类 · 全量标注 · 开源
    - generic [ref=f209e11]: 用户对车机说的第一句话就是唤醒词——如果它携带情绪信号，系统在完整指令之前就能初始化情绪状态。数据/代码全开源，本文立的是基准，不是可用系统。
    - generic [ref=f209e12]:
      - heading "一分钟版本" [level=3] [ref=f209e13]
      - list [ref=f209e14]:
        - listitem [ref=f209e15]: ▸ 立论：唤醒词天然携带三类非词汇信息——说话人身份（已有声纹校验研究）、情绪状态（本文靶心）、副语言方式。情绪维度空白不是因为不重要，而是没有数据。
        - listitem [ref=f209e16]: ▸ 硬约束：唤醒词平均 0.64 秒，常规 SER 数据集句子 2–4 秒——基频轨迹、能量包络、频谱纹理都需要时间窗展开；时长差 3–6 倍不是缩放问题，可用声学线索的集合本身不同。
        - listitem [ref=f209e17]: ▸ 数据集：488 条、8 名韩国声优（4 男 4 女）、四类情绪（angry 107 / happy 129 / sad 133 / neutral 119）、固定唤醒词「Hi, KIA」、平均 0.64 秒——Table 1 对比中唯一同时满足「唤醒词 + 全量情绪标注」的数据集。
        - listitem [ref=f209e18]: ▸ 采集方法论：53 个车载情境 → 映射效价-唤醒平面（第四象限因情境稀少被剔除，暴露覆盖缺口）→ 4 组 × 3 情境 = 12 个；情境卡片让情绪先被情境句诱导再自然延续到句首唤醒词——与「命令式念词」有生态效度差别。
        - listitem [ref=f209e19]: ▸ 人类基线：8 名评估者平均 WA 63.17% / UA 62.31%——sad 最好分，angry/happy 大量被判成 neutral（人类从唤醒词感知高唤醒印象本身困难）——修正了「短语音情绪人类总能听出来」的直觉。
        - listitem [ref=f209e20]: ▸ 主结果：只微调 wav2vec2.0 上下文网络（高层）WA 68.64%——超手工特征轨道 17.6 个点、超人类约 5.5 个点，且超越集中在人类最弱的「高唤醒 vs neutral」混淆对上（补位而非全面超越）。
        - listitem [ref=f209e21]: ▸ 消融排序：不微调 33.6 < 只调编码器 46.5 < 全调 58.0 < 只调上下文 68.6——微调哪一层比微调本身更重要；冻结低层 = 免费正则。
        - listitem [ref=f209e22]: ▸ 两个证伪：不微调的 wav2vec2（33.6）不如 88 维 eGeMAPS（51.0）——预训练目标与情绪目标不对齐时大模型表征不自动兑现；全参数微调比只调高层低 10.6 点——小数据放开低层的过拟合代价是主导。
        - listitem [ref=f209e23]: ▸ 逐折发现：模型在多数女性折上超人类，但 M1/M2/M4/F5 四折低于人类——每折 = 1 个说话人，说话人/性别泛化是明确短板。
        - listitem [ref=f209e24]: ▸ 边界：488 条规模小（单条翻转影响折内 1.6 个点）；acted ≠ spontaneous；线上录音设备不可控；验证者非盲（自己验证自己写的情境）；最佳 68.64% 仍每三条错一条。
    - heading "§01 问题：超短语音 + 情绪标注的交叉空白" [level=2] [ref=f209e25]:
      - generic [ref=f209e26]: §01
      - text: 问题：超短语音 + 情绪标注的交叉空白
    - generic [ref=f209e27]: 为什么偏偏是唤醒词的情绪识别
    - paragraph [ref=f209e28]: 车载场景把需求推得最紧：车内 VUI 替代手动操作提升驾驶安全、能丰富驾驶员情绪体验；Nass 等人 2005 年的经典现场研究证明让车机语音的情绪与驾驶员情绪配对可以改善驾驶安全。要实现情绪自适应的车载交互，第一步是从用户语音读出情绪——而用户对车机说的第一句话恰恰就是唤醒词。
    - generic [ref=f209e29]:
      - generic [ref=f209e30]:
        - heading "SER 数据集：文本无关 + 句子级" [level=4] [ref=f209e31]
        - paragraph [ref=f209e32]: IEMOCAP/EmoDB/RAVDESS/TESS 全部为完整句子录制——在这些数据上训练的模型隐式依赖句子级韵律结构（语调起承转合、重音分布、句尾拖音），这些结构在 0.64 秒的唤醒词里根本不存在。
      - generic [ref=f209e33]:
        - heading "OK Aura：最接近但不够" [level=4] [ref=f209e34]
        - paragraph [ref=f209e35]: 1247 条、80 人、西班牙语唤醒词、带丰富元数据——但只有 218 条带情绪标注（覆盖率 17.5%）：既撑不起训练也撑不起可信评测。语言上韩语也缺席——情绪的声学表达有语言特异性，跨语言迁移不可靠。
