    - generic [ref=f121e227]:
      - generic [ref=f121e228]: JUDGEMENT
      - paragraph [ref=f121e229]: ↳ 级联的本质是把「计算预算」按事件的先验概率分配：绝大多数帧不是唤醒词——那就让最便宜的计算看全部帧，最贵的计算只看极少数候选；平均成本由触发率而非模型大小决定，这是架构层面的省电，比压缩模型高一个维度。
      - paragraph [ref=f121e230]: ↳ 漏斗每一级的召回率是下一级的输入上限：一级漏掉的一切都永久丢失——设计级联时宁可一级松（高召回高误警）让下游收紧，不可反过来；「便宜的层要保召回，昂贵的层管精度」是分工的铁律。
      - paragraph [ref=f121e231]: ↳ 个性化是级联的天然挂件：声纹验证需要贵的模型，而级联恰好提供了「只在候选上花贵计算」的机制——新功能要找架构里已经存在的「稀少事件路径」挂载，成本几乎为零。
