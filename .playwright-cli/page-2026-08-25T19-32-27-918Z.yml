      - generic [ref=f1e277]: ↳ 共享编码器只让任务并肩干活；用任务 A 的输出当任务 B 的注意力 Query，才让它们互相递话——「共享特征」到「传递信息」是多任务设计的关键升级，注意力是现成的管道。
      - paragraph [ref=f1e278]: ② 辅助分支的价值在于其输出能被主任务当工具用。
      - generic [ref=f1e279]: ↳ CTC 软 VAD 不是为了 VAD 指标本身——它的帧级概率变成主任务的特征权重。设计辅助损失时问一句：辅助任务的输出能不能作为可微的工具反哺主任务？能的话收益翻倍。
      - paragraph [ref=f1e280]: ③ 软判决优于硬判决，边界信息比干净的二分更值钱。
      - generic [ref=f1e281]: ↳ 硬 VAD、硬剪枝、硬路由都在边界处丢信息；软概率保留过渡区的连续性，且端到端可训——凡是「判断后使用」的中间模块，先考虑输出概率而不是输出决定。
