  - generic [ref=f1e87]:
    - generic [ref=f1e88]: "02"
    - heading "机制：软判决与传话筒" [level=2] [ref=f1e89]
    - paragraph [ref=f1e90]: CTC 软 VAD 的巧劲在「软」字：传统 VAD 做二值硬判决，语音起止处的边界信息一刀切全丢。本文在共享编码器上加一个 CTC 分支输出帧级语音概率，直接当乘法权重作用在共享特征上——语音帧保留、噪声帧压扁，边界过渡帧拿中间值。它与主任务端到端联合训练，学到的「哪里有语音」自动服务于两个下游任务。
    - img [ref=f1e91]:
      - generic [ref=f1e93]: 机制解剖：软 VAD 怎么加权 · 查询注意力怎么传话
      - generic [ref=f1e94]: CTC 软 VAD 的加权
      - generic [ref=f1e102]: p_vad(t)：帧级语音概率（CTC 分支输出）
      - generic [ref=f1e103]: 加权后特征 h'(t) = p_vad(t) · h(t)：
      - generic [ref=f1e111]: 语音帧保留 · 噪声帧压扁
      - generic [ref=f1e112]: · 软 vs 硬：硬判决 VAD 在边界一刀切——
      - generic [ref=f1e113]: 语音起止处的过渡信息全丢；软概率保留它们
      - generic [ref=f1e114]: · p_vad 与主任务联合训练——VAD 学会的
      - generic [ref=f1e115]: 「哪里有语音」自动服务于两个下游任务
      - generic [ref=f1e116]: 全局查询注意力
      - generic [ref=f1e118]: 一个反常识的连接方向：
      - generic [ref=f1e119]: · Query = KWS 分支的关键词嵌入
      - generic [ref=f1e120]: · Key / Value = 共享编码器特征
      - generic [ref=f1e121]: · 交叉注意力输出 → 喂给 SV 分支
      - generic [ref=f1e122]: 语义：SV 不必对整段音频提取声纹——
      - generic [ref=f1e123]: KWS 先告诉它「在说唤醒词的那几帧在哪」，
      - generic [ref=f1e124]: SV 聚焦该语境下的说话人特征
      - generic [ref=f1e125]: 为什么叫「全局」：Query 是整句级别的关键
      - generic [ref=f1e126]: 词嵌入（全局判断），不是逐帧查询——一次
      - generic [ref=f1e127]: 注意力就把关键词的时空定位传给 SV
      - generic [ref=f1e128]: 消融佐证：去掉 GQA → SV 明显掉 · KWS 微降——
      - generic [ref=f1e129]: 信息流确实是 KWS → SV 的单向传递
      - generic [ref=f1e130]: 左：CTC 分支输出帧级语音概率，当乘法权重压低噪声帧、保留语音帧——软判决不丢边界。右：KWS 嵌入当 Query 对共享特征做交叉注意力，把「唤醒词在哪」的信息定向传给 SV——任务间不只是共享，还会递话
    - generic [ref=f1e131]: 图 2 · 机制解剖：软 VAD 的概率加权 · 查询注意力的 KWS→SV 信息流
    - generic [ref=f1e132]:
      - generic [ref=f1e133]: "软 VAD: p_vad(t) = softmax(CTC_branch(h(t))) ← 帧级语音概率 h'(t) = p_vad(t) · h(t) ← 概率当乘法权重 GQA: Attention(Q=KWS 嵌入, K/V=共享特征) → 喂给 SV 分支 L_total = L_KWS + λ·L_SV + μ·L_VAD"
      - generic [ref=f1e134]: 人话：软 VAD 是给两个任务配的同一副降噪耳机——不是把非语音段剪掉（硬剪会伤边界），而是把它的音量调小。查询注意力是个传话筒：KWS 先听出「这是唤醒词」，转头告诉 SV「重点听说话那几帧的音色」。
    - paragraph [ref=f1e135]: 全局查询注意力的连接方向有点反直觉：Query 不是来自 SV 而是来自 KWS 分支的关键词嵌入——整句级别的全局判断（所以叫「全局」查询），对共享特征做交叉注意力后喂给 SV。语义上：SV 不必对整段音频平均提声纹，而是聚焦「说唤醒词的那几帧」的说话人特征。消融佐证了信息流方向——去掉 GQA 时 SV 明显掉、KWS 只微降，说明传话确实是 KWS→SV 的单向受益。
