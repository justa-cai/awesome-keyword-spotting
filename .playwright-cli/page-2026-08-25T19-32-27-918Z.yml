    - heading "问题：共享之外还缺两样" [level=2] [ref=f1e15]
    - generic [ref=f1e16]:
      - generic [ref=f1e17]: TL;DR
      - list [ref=f1e18]:
        - listitem [ref=f1e19]: ◆ 与 №14（Apple）同一命题：KWS 与 SV 独立运行的计算冗余、特征浪费、噪声下双崩——本文认可共享编码器框架，但指出它还缺两样东西。
        - listitem [ref=f1e20]: ◆ 缺件一：联合抗噪——噪声帧对两个任务都是毒，独立降噪不如在共享特征上统一压噪。
        - listitem [ref=f1e21]: ◆ 缺件二：任务间的信息通道——共享只让两个任务「并肩干活」，还没有机制让 KWS 把关键词信息递给 SV。
        - listitem [ref=f1e22]: ◆ 两个机构的消融都立得住：去掉软 VAD 噪声下双崩、去掉查询注意力 SV 明显掉——SNR 越低多任务优势越大。
