- generic [ref=f315e2]:
  - generic [ref=f315e3]: 论文精读 · 可视化版 · 2021 №28 · 2021 收官
  - heading "新唤醒词的数据不出设备， 还能跨设备认出彼此是同一个词——传印象不传数据" [level=1] [ref=f315e4]: 新唤醒词的数据不出设备，还能跨设备认出彼此是同一个词——传印象不传数据
  - generic [ref=f315e5]:
    - generic [ref=f315e6]: Zero-Shot Federated Learning · 爱立信
    - generic [ref=f315e7]: Interspeech 2021 · arXiv 2106.10019
    - generic [ref=f315e8]: 匿名数据印象（DI）+ CSM + k-medoids
    - generic [ref=f315e9]: 全局更新 +3.4~4.3% · 树莓派 2 推理 11ms
  - generic [ref=f315e10]: 一句话：联邦学习保护隐私（只传模型更新不传数据），但用户设备会随时冒出新类别（自定义唤醒词、新声事件）——服务器看不到原始数据，无法判断 A 设备和 B 设备的新类是不是同一类。本文的解法：各用户从自己模型的末层权重反向合成「匿名数据印象」（CSM 相似矩阵 → Dirichlet 采样 softmax → 反向优化生成特征），只上传印象；服务器对印象做 k-medoids 聚类——相同新类自然聚拢（即使标签名不同），聚拢的印象并入公共数据集共享。三重异构（标签/模型/数据）+ 新类动态出现的场景下，全局更新仍稳定比本地高 3.4–4.3 个点；树莓派 2 上推理仅 11ms。
  - generic [ref=f315e11]:
    - generic [ref=f315e12]: TL;DR
    - listitem [ref=f315e13]: ◈ FL 的盲区：传统联邦学习假设所有客户端类别集合固定——实际用户会随时添加自定义唤醒词/命令词。核心难题：隐私约束下服务器无法比对原始数据，「A 设备的新类」和「B 设备的新类」是同一类还是两类？标签可能报也可能不报。
    - listitem [ref=f315e14]: ◈ 核心创新——匿名数据印象（DI）三步生成：① 从末层 FC 权重算类别相似性矩阵 CSM（权重向量余弦——相似的类权重相似）；② 按 CSM 从 Dirichlet 分布采样 softmax（相似类的采样集中在彼此上）；③ 反向优化 x* = argmin CE(y, M(x))——从随机输入迭代，把「类别印象」烙进合成特征。全程不碰原始数据。
    - listitem [ref=f315e15]: ◈ 认亲机制：同标签用户的 DI 取平均 → 全部 DI 做 k-medoids 无监督聚类——相同新类（即使各用户叫的名字不同）自然聚成一族，不同新类明显分离；聚类中心的印象并入公共数据集，新标签进全局标签集。
    - listitem [ref=f315e16]: ◈ 知识传递的第三种交换物：不传数据（隐私）、不传参数（模型异构时不兼容）——传「从权重提炼的类别印象」：隐私与效用之间最轻的交换物，且天然绕过模型架构差异。
    - listitem [ref=f315e17]: ◈ 两种场景：不报标签 → 退回传统 FL（α 加权本地模型 + 标签级加权全局平均）；报标签 → 走 DI 机制。三重异构全处理：标签（非 IID）、模型（不同用户不同 CNN 架构甚至中途换架构/激活函数）、数据（跨迭代漂移）。
    - listitem [ref=f315e18]: ◈ 结果（约值）：场景一（3 用户 · 10 迭代 · GKWS）91.0→94.4（+3.4）；场景二（10 用户 · 30 迭代 · 三重异构 + 新类）GKWS 92.5→96.5（+4.0）· US8K 78.2→82.5（+4.3）——全局聚合全线高于本地。
    - listitem [ref=f315e19]: ◈ 树莓派 2 实测（900MHz 四核 A7 · 1GB RAM）：训练 1.2s/epoch、推理 11ms——IoT 级设备可实际部署的轻量程度。
    - listitem [ref=f315e20]: ◈ 边界：DI 保真度（合成特征未必覆盖原始分布）；公共数据集假设（实际难保证）；聚类数需已知；最大 10 用户 30 迭代（离真实百万级差数量级）；无基线对比、无安全性分析、通信开销未析。
  - heading "§01 问题：隐私约束下的新类别认亲" [level=2] [ref=f315e21]:
    - generic [ref=f315e22]: §01
    - text: 问题：隐私约束下的新类别认亲
  - generic [ref=f315e23]: FL 的固定类别假设 + 三重异构
  - generic [ref=f315e24]:
    - generic [ref=f315e25]:
      - heading "新类别动态出现" [level=3] [ref=f315e26]
      - paragraph [ref=f315e27]: 个性化 KWS 的核心需求是用户自定义唤醒词——每个设备都会冒出全局模型没见过的类。FL 的隐私约束让服务器无法比对原始数据：「两个设备的新词是不是同一个词」这个问题在传统框架里无解。
    - generic [ref=f315e28]:
      - heading "三重异构叠加" [level=3] [ref=f315e29]
      - paragraph [ref=f315e30]: 标签异构（非 IID 标签分布）、模型异构（不同用户不同架构——甚至同一用户中途换架构和激活函数）、数据异构（跨迭代分布漂移）。多数 FL 研究只处理其中一重，本文三重同时上。
    - generic [ref=f315e31]:
      - heading "两种标签场景的现实性" [level=3] [ref=f315e32]
      - paragraph [ref=f315e33]: 用户报标签（a）与不报（b）都要覆盖——实际用户大概率懒得命名新类别；不报时靠聚类完全无监督地区分，是框架更难的分支。
    - generic [ref=f315e34]:
      - heading "与同系列的坐标" [level=3] [ref=f315e35]
      - paragraph [ref=f315e36]: "SFL on MCU（2022 #35）解决「训练算力不够」的联邦；本文解决「类别动态出现」的联邦——同是 FL 在端侧落地的两块拼图；DI 机制与文本锚点（№23）、KeySEM 嵌入（№22）同属「用什么当类别的代表」这条线索，这里代表物必须从本地模型权重里反向提炼。"
