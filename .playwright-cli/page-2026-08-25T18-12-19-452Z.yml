  - generic [ref=f315e266]:
    - generic [ref=f315e267]: 读表要点
    - listitem [ref=f315e268]: ◈ 值得注意的反直觉：异构场景的增益（+4.0/+4.3）反而比干净场景（+3.4）更大——异构越严重，本地模型越片面，全局聚合的互补价值越高。FL 的价值随异构性增长，这与直觉相符但需要数据背书。
    - listitem [ref=f315e269]: ◈ k-medoids 的验证方式：PCA 降维可视化——不同新类明显分离、相同新类自然聚拢、聚类数与新类数精确对应。这是「不碰数据认出新类」机制的直接证据。
    - listitem [ref=f315e270]: ◈ 证据边界：无基线（增量 FL/元学习 FL）、无安全性（投毒/后门/DI 注入）、通信开销未析、10 用户 30 迭代远小于真实规模——「+4%」的绝对意义有限，机制可行性才是本文的真正贡献。
  - heading "§04 贡献" [level=2] [ref=f315e271]:
    - generic [ref=f315e272]: §04
    - text: 贡献
  - generic [ref=f315e273]: 五点：从零样本机制到边缘验证
  - generic [ref=f315e274]:
    - generic [ref=f315e275]:
      - generic [ref=f315e276]: "1"
      - paragraph [ref=f315e277]: 零样本联邦学习框架（音频首个）：匿名数据印象机制在不接触原始数据的前提下实现跨设备新类识别与知识共享——补上 FL「新类别动态出现」这个长期被忽视的缺口。
    - generic [ref=f315e278]:
      - generic [ref=f315e279]: "2"
      - paragraph [ref=f315e280]: 双重场景覆盖：报标签走 DI 机制、不报标签退回传统 FL——适应不同部署场景的灵活性。
    - generic [ref=f315e281]:
      - generic [ref=f315e282]: "3"
      - paragraph [ref=f315e283]: 无监督新类区分：k-medoids 在印象上聚类——多个用户用不同名字称呼同一新类也能正确映射。
    - generic [ref=f315e284]:
      - generic [ref=f315e285]: "4"
      - paragraph [ref=f315e286]: 三重统计异构全处理：标签异构 + 模型异构（不同架构甚至中途切换）+ 数据异构同时存在。
    - generic [ref=f315e287]:
      - generic [ref=f315e288]: "5"
      - paragraph [ref=f315e289]: 边缘设备验证：树莓派 2 完整实验（训练 1.2s/epoch · 推理 11ms）——IoT 实际可行的轻量程度。
  - heading "§05 局限与判断" [level=2] [ref=f315e290]:
    - generic [ref=f315e291]: §05
    - text: 局限与判断
  - generic [ref=f315e292]: DI 保真度 · 公共集假设 · 规模与安全
  - generic [ref=f315e293]:
    - img [ref=f315e294]:
      - generic [ref=f315e296]: 边界与延伸
      - generic [ref=f315e298]: 技术边界
      - generic [ref=f315e299]: · DI 保真度：从权重反向合成的特征未必覆盖原始分布——
      - generic [ref=f315e300]: 声学变化大的类（环境声事件）代表性可能不足
      - generic [ref=f315e301]: · 公共数据集假设：所有用户与服务器共享 D₀——实际部署
      - generic [ref=f315e302]: 难保证，D₀ 的质量与规模直接影响性能
      - generic [ref=f315e303]: · Dirichlet ε 敏感：浓度参数选择影响 DI 质量——无敏感性分析
      - generic [ref=f315e304]: · 聚类数已知：k-medoids 要预设新类数——缺自动估计机制
      - generic [ref=f315e305]: · 模型异构有限：全是 CNN 变体——CNN vs RNN vs Transformer
      - generic [ref=f315e306]: 的根本架构差异未验证
      - generic [ref=f315e308]: 实验边界 + 延伸
      - generic [ref=f315e309]: · 规模有限：10 用户 30 迭代 vs 真实百万级用户
      - generic [ref=f315e310]: · 无基线对比（增量 FL / 元学习 FL）
      - generic [ref=f315e311]: · 无安全性分析（投毒/后门/DI 注入）
      - generic [ref=f315e312]: · 通信开销未析（IoT 带宽敏感）
      - generic [ref=f315e313]: 延伸：对比学习（SimCLR/MoCo）提升 DI 质量；
      - generic [ref=f315e314]: DBSCAN/HDBSCAN 自动定聚类数；差分隐私（DP-SGD）
      - generic [ref=f315e315]: 加形式化保证；TensorFlow Federated/PySyft 大规模验证；
      - generic [ref=f315e316]: 多模态扩展
      - generic [ref=f315e317]: 对 KWS 的启发：个性化自定义唤醒词的联邦部署——
      - generic [ref=f315e318]: 传「类别印象」而非数据/参数，是知识传递的新范式
      - generic [ref=f315e319]: 可迁移判断：联邦场景下的新类别知识共享可以「传印象」——从本地模型权重反向合成类别表征再聚类认亲；数据、参数、印象三选一里，印象是隐私与效用之间最轻的交换物
    - generic [ref=f315e320]: 图4 · 边界与延伸：左技术边界（DI 保真度、公共集依赖、ε 敏感、聚类数已知、模型异构有限），右实验边界（规模、无基线、无安全、通信未析）+ 延伸方向。
  - generic [ref=f315e321]:
    - generic [ref=f315e322]: 可迁移判断
    - paragraph [ref=f315e323]: ↳ 数据、参数、印象是知识传递的三种交换物：数据最重（隐私风险最高）、参数中等（模型异构时不兼容）、印象最轻（架构无关且只含类别级信息）——分布式系统选交换物时，先问「最小充分信息单元是什么」，往往不是参数。
    - paragraph [ref=f315e324]: ↳ 模型权重本身就是类别的画像：末层权重的几何结构（余弦相似）承载了「类像谁」的全部信息——无需原始数据即可提炼。任何「隐私约束下共享类别知识」的场景（联邦聚类、跨机构标签对齐）都可借用这个反向合成思路。
    - paragraph [ref=f315e325]: ↳ 异构越重，联邦越赚：+3.4%（干净）vs +4.0–4.3%（三重异构）——本地模型越片面，全局互补价值越高。评估 FL 方案要在异构设定下测，干净设定的增益会低估联邦的真实价值。
    - paragraph [ref=f315e326]: ↳ 边缘可行性要真机实测：树莓派 2 的 11ms 推理是「IoT 可部署」的证据——纸面轻量与真机可跑之间隔着内存/算力/功耗的三重检验（与 Apple 流式 TF 的立场一致）。
