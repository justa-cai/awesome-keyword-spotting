  - heading "§02 方法：从权重反向烙出印象" [level=2] [ref=f315e96]:
    - generic [ref=f315e97]: §02
    - text: 方法：从权重反向烙出印象
  - generic [ref=f315e98]: CSM · Dirichlet 采样 · 反向优化 · 聚类认亲
  - generic [ref=f315e99]:
    - generic [ref=f315e100]: "CSM: C(i,j) = wᵢ·wⱼ / (‖wᵢ‖·‖wⱼ‖) # 末层 FC 权重余弦 采样: Softmax ~ Dir(K, C·ε) # 相似类采样集中在彼此 合成: x* = argmin_x L_CE(yᵏᵢ, M(x)) # 反向优化烙印象 聚合: Xᵢ = Σ_{m∈MS_k} Xᵢᵐ → k-medoids 聚类 # 聚类数 = 新类数 共享: D_new = D₀ ∪ Xᵢ · 新标签入全局标签集"
    - generic [ref=f315e101]: 人话：模型已经「认识」它训过的每个类——这份认知就藏在末层权重里。CSM 读出「类像谁」，Dirichlet 把相似性变成目标分布，反向优化把这个分布烙进一段合成特征——这段特征就是新类的「画像」，可比对、可聚类、可共享，且不暴露任何原始样本。
  - generic [ref=f315e102]:
    - generic [ref=f315e103]:
      - heading "为什么 DI 能绕过模型异构" [level=3] [ref=f315e104]
      - paragraph [ref=f315e105]: 不同用户模型架构不同时，参数无法直接平均（模型异构的老大难）——但 DI 是「特征空间的样本」，与哪个模型产生无关；聚类在特征空间做，天然架构无关。这是「传印象」优于「传参数」的结构性理由。
    - generic [ref=f315e106]:
      - heading "CSM 的副产品" [level=3] [ref=f315e107]
      - paragraph [ref=f315e108]: GKWS 的 CSM 矩阵显示 yes↔no 权重相似度高（声学重叠）——相似矩阵不仅服务 DI 生成，还暴露模型的误分类模式：哪些词容易混一目了然，为针对性优化提供线索。
