          - text: ": keyword spotting, adversarial robustness, knowledge distillation, robust distillation, VICReg, self-supervised speech representations, model compression"
      - heading [level=2] [ref=f157e35]:
        - link "问题陈述" [ref=f157e36] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e9%97%ae%e9%a2%98%e9%99%88%e8%bf%b0"
      - heading [level=3] [ref=f157e37]:
        - link "问题背景和领域痛点" [ref=f157e38] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e9%97%ae%e9%a2%98%e8%83%8c%e6%99%af%e5%92%8c%e9%a2%86%e5%9f%9f%e7%97%9b%e7%82%b9"
      - paragraph [ref=f157e39]: 关键词检测（KWS）系统是虚拟助手的第一层入口，负责在连续音频流中识别预设唤醒词（如"Hey Siri"）以激活设备。Google Now 和 Alexa 所代表的端侧语音处理正在普及，但这带来三重压力：能耗效率（设备常驻监听、电池预算有限）、实时处理（唤醒延迟直接决定交互体验）、以及用户隐私（端侧处理可以让私人数据留在本地而不上传云端或第三方服务器）。论文明确指出，端侧处理本身就是一层安全保护——前提是模型必须能在资源受限的硬件上跑起来。
      - paragraph [ref=f157e40]: 近年来 KWS 的精度提升大量来自自监督语音表征学习（S3RL），代表模型是 Wav2Vec 2.0 和 WavLM，它们在连续音频输入上联合学习声学模型和语言模型。问题在于模型规模：按照论文 Table 1 的数据，两个教师模型的参数量都是 94.4M，每次推理的计算量分别是 6160.9 MMACs（Wav2Vec 2.0）和 6132.7 MMACs（WavLM），这个量级在微控制器级别的端侧硬件上完全放不下。与之对照，论文选定的学生模型必须少于 96K 参数和 3 MMACs——按此计算，参数量需要压缩约 1174 倍（94.4M 压到 80.4K 的 XVector）到约 1394 倍（压到 67.7K 的 TC-ResNet），计算量需要压缩约 2115 到 3851 倍（由 Table 1 的 MMACs 数据换算）。
      - paragraph [ref=f157e41]: 与此同时，语音技术面临的对抗攻击在增加。对抗攻击的目标是设计一个微小扰动 δ，叠加到测试信号上就能迫使系统失效。空中传输（over-the-air）对抗攻击已经证明，向用户语音叠加不可感知的噪声可以造成误分类（论文引文 [8] 的 UTIO 攻击）；作者团队自己此前的工作（引文 [7]）也证明了基于自监督表征的 KWS 系统在推理阶段的白盒对抗攻击下是脆弱的。这样，端侧 KWS 面临一个双重需求：模型既要足够小以塞进边缘硬件，又要足够稳健以抵御对抗攻击。此前的工作要么只处理压缩（普通知识蒸馏），要么只处理鲁棒性（对抗训练），很少把两个问题放在同一个配方里解决——这正是本文的问题空间。
      - heading [level=3] [ref=f157e42]:
        - link "现有方法的具体不足" [ref=f157e43] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e7%8e%b0%e6%9c%89%e6%96%b9%e6%b3%95%e7%9a%84%e5%85%b7%e4%bd%93%e4%b8%8d%e8%b6%b3"
      - paragraph [ref=f157e44]: 论文把现有防线分成两级，并逐一指出缺口：
      - list [ref=f157e45]:
        - listitem [ref=f157e46]:
          - strong [ref=f157e47]: 普通知识蒸馏（KD，Hinton 等人）只迁移泛化能力，不迁移鲁棒性
          - text: 。KD 用教师 logits 引导学生，能让学生在干净数据上逼近教师精度（Table 2 中 KD 行的 GSC-12 干净精度最高到 96.91），但在 AutoAttack 攻击下学生的鲁棒精度只有 4.49–9.29，接近甚至低于 12 类随机猜测水平（约 8.3%）。更关键的证据是：即便给 KD 换上经过对抗训练的鲁棒教师，学生被攻击后的精度也只有 4.49–7.19（Table 2 鲁棒教师列），而鲁棒教师自身的鲁棒精度高达 93.80–94.79（Table 1）。学生的鲁棒性不会随着教师变鲁棒而自动出现，这是论文反复强调的实验事实。
        - listitem [ref=f157e48]:
          - strong [ref=f157e49]: ARD（Adversarial Robust Distillation，AAAI 2020）把对抗训练和 KD 结合，强调最小化学生与教师 logits 之间的 KL 散度
          - text: 。它确实把鲁棒精度从个位数拉升到 74–80 的量级，但在 Table 2 的 8 个（教师/学生 × 标准/鲁棒教师）配置中有 7 个仍低于同架构学生直接用 TRADES 对抗训练的基线（差距 0.4 到 6.3 个百分点）。也就是说，花大成本做鲁棒蒸馏，得到的学生还不如直接对小模型做对抗训练。
        - listitem [ref=f157e50]:
          - strong [ref=f157e51]: RSLAD（Robust Soft Label Adversarial Distillation，ICCV 2021）用教师的软标签替代硬标签参与对抗训练循环
          - text: ，经验上优于 ARD，但论文引言明确指出 ARD 和 RSLAD 都"无法稳定超越一个用对抗训练得到的更小模型的精度"。Table 2 的细节支持这个判断：TC-ResNet 作为学生时 RSLAD 四个配置全部低于基线 1.2–3.0 个百分点，只有容量稍大的 XVector 作为学生时才高出基线 0.4–1.7 个百分点。
        - listitem [ref=f157e52]:
          - strong [ref=f157e53]: 共同的结构性缺口：这些方法都只在输出层做约束
          - text: （logits 的 KL 散度或软标签），完全不管中间表征空间的几何形状。为什么这是一个本质缺口而不是实现细节？因为对抗脆弱性的机理是输入端的微小扰动在表征空间中被逐层放大成大位移，最终越过决策边界；只在输出层拉齐概率分布，相当于只修正了地图上的国界线，却没有修地形——很多差异巨大的表征几何都能在训练分布上产生相同的 logits，但它们在扰动下的行为截然不同。而且学生模型容量极小（67.7K–80.4K 参数），每一维表征容量都值得精打细算，输出层的监督信号无法告诉学生"哪些维度该装什么信息"。
        - listitem [ref=f157e54]:
          - text: 另外，多视图（multi-view）输入在蒸馏里的作用此前只被研究过对环境鲁棒性的贡献（引文 [13][14]，包括作者团队自己的 RobustDistiller 工作），它对
          - strong [ref=f157e55]: 鲁棒
          - text: 蒸馏的影响是未知的——论文把这一点列为需要回答的开放问题。
      - heading [level=3] [ref=f157e56]:
        - link "该论文要解决的关键挑战" [ref=f157e57] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e8%af%a5%e8%ae%ba%e6%96%87%e8%a6%81%e8%a7%a3%e5%86%b3%e7%9a%84%e5%85%b3%e9%94%ae%e6%8c%91%e6%88%98"
      - paragraph [ref=f157e58]: 如何设计一个蒸馏配方，把 94.4M 参数的 S3RL 教师压缩到 96K 参数、3 MMACs 以内的学生（千倍级压缩），同时满足三个此前方法无法同时达到的条件：（1）AutoAttack 白盒集成攻击下的鲁棒精度稳定超过同架构学生直接用 TRADES 对抗训练的基线——ARD 和 RSLAD 都做不到这一点；（2）干净精度不明显塌陷，保持与普通 KD 可比的干净准确率；（3）推理阶段零额外开销——所有新增机制只能存在于训练阶段，因为部署时跑的只是那个小学生。
      - heading [level=2] [ref=f157e59]:
        - link "方法论" [ref=f157e60] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e6%96%b9%e6%b3%95%e8%ae%ba"
      - heading [level=3] [ref=f157e61]:
        - link "整体架构设计和设计动机" [ref=f157e62] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e6%95%b4%e4%bd%93%e6%9e%b6%e6%9e%84%e8%ae%be%e8%ae%a1%e5%92%8c%e8%ae%be%e8%ae%a1%e5%8a%a8%e6%9c%ba"
      - paragraph [ref=f157e63]: VIC-KD 的整体流程（论文 Fig. 1）如下：从训练集采样一条语音 x，随机抽取两个不同的变换 t 和 t′（t ≠ t′，均来自变换集合 T）。教师支路接收 t(x)，通过微调过的冻结 S3RL 编码器提取表征 Z——具体做法是对所有 Transformer 层的中间表征做加权求和，再沿时间维聚合，得到一个 d 维的语句级嵌入。学生支路接收另一个视图 t′(x)，并在其上叠加对抗扰动，先经过学生编码器得到中间表征 H′；H′ 接两个头：一个分类头生成 logits Y′ 用于预测命令词，一个投影头生成 Z′，其维度与教师的 Z 相同。训练损失是 TRADES 损失与 VICReg 损失的凸组合，由超参数 α 控制。测试阶段只保留学生编码器和分类头，投影头和整个教师支路全部丢弃。
      - paragraph [ref=f157e64]: 几个设计选择的"为什么"：
      - list [ref=f157e65]:
        - listitem [ref=f157e66]:
          - strong [ref=f157e67]: 教师表征为什么用全层加权和加时间聚合
          - text: ：Transformer 不同层编码的信息层级不同（低层偏声学、高层偏语言），逐层加权求和让一个可学习的标量组合自动挑选最适合 KWS 任务的混合比例；沿时间维聚合是因为 KWS 对 1 秒整句做分类，语句级嵌入天然去掉时间轴，Z 成为紧凑的锚点。
        - listitem [ref=f157e68]:
          - strong [ref=f157e69]: 为什么要投影头
          - text: ：投影头把"被几何正则约束的空间"与"分类特征空间"解耦。几何正则只是训练期的脚手架，测试时整个丢掉，因此不产生任何推理开销——这直接服务于"推理零开销"的挑战约束。这种做法承袭自自监督学习里 BYOL/SimSAM 一系投影头的惯例。
        - listitem [ref=f157e70]:
          - strong [ref=f157e71]: 为什么对抗扰动只加在学生支路、教师保持自然输入
          - text: ：教师在配方里扮演的是"干净几何的锚"，学生被训练去把受攻击的输入映射到教师映射干净输入的同一片区域——鲁棒性被写进了训练信号本身，而不依赖教师自身是否鲁棒。这个选择在实验里被反过来验证（见消融部分：标准教师就够了）。
        - listitem [ref=f157e72]:
          - strong [ref=f157e73]: 为什么要求 t ≠ t′
          - text: ：如果两个支路看到完全相同的输入，不变性损失会被平凡满足，正则失效；两个不同视图强迫学生学到跨视图稳定的特征。
        - listitem [ref=f157e74]:
          - strong [ref=f157e75]: 学生为什么选这两个
          - text: ：TC-ResNet（Interspeech 2019，面向移动设备实时 KWS 的时序卷积网络）67.7K 参数、1.6 MMACs；XVector 改造版（减少 TDNN 层数、缩小卷积核以贴合资源约束）80.4K 参数、2.9 MMACs（Table 1）。两个都满足"96K 参数、3 MMACs 以内"的硬约束，且代表两种不同的端侧架构血统（时序卷积 vs 说话人验证出身的 TDNN 统计嵌入）。
      - heading [level=3] [ref=f157e76]:
        - link "核心算法的数学原理" [ref=f157e77] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e6%a0%b8%e5%bf%83%e7%ae%97%e6%b3%95%e7%9a%84%e6%95%b0%e5%ad%a6%e5%8e%9f%e7%90%86"
      - paragraph [ref=f157e78]: 记一批 n 条语句上，教师模型对自然（变换后）输入产生的 d 维潜在表征为 Z = [z₁, z₂, …, zₙ]，学生模型对对抗扰动后输入产生的同样 d 维表征为 Z′ = [z′₁, z′₂, …, z′ₙ]。VICReg 损失（论文式 1）为：
