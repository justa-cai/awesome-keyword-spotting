      - paragraph [ref=f157e159]: 三项的作用与"为什么"：
      - list [ref=f157e160]:
        - listitem [ref=f157e161]:
          - strong [ref=f157e162]: 不变性项 Inv(Z, Z′)**：两个表征集合之间的均方误差。注意它的锚定方向是
          - text: 跨模型、跨视图、跨自然/对抗**的——教师看自然视图 t(x)，学生看对抗视图 t′(x)+δ，损失要求学生把被攻击的输入拉到教师处理干净输入的位置上。这是整个配方里最核心的一股力：对抗鲁棒性第一次不是在输出概率上而是在表征几何上被直接正则化。
        - listitem [ref=f157e163]: "**方差项 Var(Z′)**：约束每一维嵌入在 batch 内的标准差保持在阈值之上。为什么必须有：只有不变性损失时存在平凡解——Z′ 塌缩成一个常数向量，损失为零但模型废掉。方差下限是显式的反塌缩防线（实现细节沿用 VICReg 原文 [17] 的铰链形式，具体阈值系数论文未报告）。"
        - listitem [ref=f157e164]: "**协方差项 Cov(Z′)**：把表征协方差矩阵的非对角元压向零，即去相关。为什么对 KWS 学生特别重要：学生容量只有 67.7K–80.4K 参数，如果多个维度编码高度相似的特征，等于浪费了本就稀缺的表征容量；去相关迫使每一维承载不同的信息，等于在信息密度层面对小模型做补贴。"
        - listitem [ref=f157e165]: 论文明确三项在最终损失中等权贡献，具体实现细节指向 VICReg 原文 [17]。
      - paragraph [ref=f157e166]: 最终的 VIC-KD 损失是 TRADES 损失与 VICReg 损失的凸组合，由超参数 α 控制权重（α 的具体取值论文正文未报告，标注在 Fig. 1 中）。为什么这样组合：TRADES 在输出层面处理干净精度与鲁棒性的折中（在自然样本上最小化分类损失，同时约束自然样本与对抗样本的 logits 分布差异），VICReg 在表征层面塑造几何；凸组合保证两股约束任何一方都不会被另一方完全压掉。
      - heading [level=3] [ref=f157e167]:
        - link "关键技术创新一：把自监督学习的几何先验迁移到鲁棒蒸馏" [ref=f157e168] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e5%85%b3%e9%94%ae%e6%8a%80%e6%9c%af%e5%88%9b%e6%96%b0%e4%b8%80%ef%bc%9a%e6%8a%8a%e8%87%aa%e7%9b%91%e7%9d%a3%e5%ad%a6%e4%b9%a0%e7%9a%84%e5%87%a0%e4%bd%95%e5%85%88%e9%aa%8c%e8%bf%81%e7%a7%bb%e5%88%b0%e9%b2%81%e6%a3%92%e8%92%b8%e9%a6%8f"
      - paragraph [ref=f157e169]: 联合嵌入架构（JEA）在自监督学习里已经证明有效（BYOL、Barlow Twins、VICReg），其中 VICReg 的独特性质是：它对表征塌缩的防线完全由显式损失项（方差 + 协方差）构成，不需要负样本对、不需要 stop-gradient、不需要非对称网络结构。这一点决定了它的可移植性——可以直接插进一个有监督蒸馏管线而不破坏原有的训练动力学。论文做的迁移是：把自监督里"两个增广视图互为锚"的结构，改写成"教师自然表征为锚、学生对抗表征为目标"的结构，从而使 SSL 里学不变性的工具变成了鲁棒蒸馏里学抗扰动性的工具。论文在相关工作里明确说明，多视图输入用于（环境）鲁棒蒸馏已有先例（引文 [13][14]），但几何正则用于鲁棒蒸馏是本文提出的新组合，其效果正是本文要回答的问题。
      - heading [level=3] [ref=f157e170]:
        - link "关键技术创新二：多视图输入与学生支路对抗扰动的叠加" [ref=f157e171] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e5%85%b3%e9%94%ae%e6%8a%80%e6%9c%af%e5%88%9b%e6%96%b0%e4%ba%8c%ef%bc%9a%e5%a4%9a%e8%a7%86%e5%9b%be%e8%be%93%e5%85%a5%e4%b8%8e%e5%ad%a6%e7%94%9f%e6%94%af%e8%b7%af%e5%af%b9%e6%8a%97%e6%89%b0%e5%8a%a8%e7%9a%84%e5%8f%a0%e5%8a%a0"
      - paragraph [ref=f157e172]: 变换集合 T 包含六种：干净数据、加噪、混响、加噪加混响、波形块丢弃（wave chunk dropping）、速度扰动（speed perturbation）。教师和学生各拿到一个随机视图，学生视图上再叠加 10 步 PGD 类攻击生成的对抗扰动（ε = 1.5×10⁻³，步长 3×10⁻⁴，与评测时的攻击预算一致）。环境增广与对抗扰动叠加的动机是：两种"扰动源"在表征层面都表现为噪声因子，学生在两个视图 + 对抗噪声的三重压力下学到的特征，被迫剥离非语音因素、只保留判别性语音结构。论文对多视图带来增益的解释给出两个假设（4.2 节）：其一，多视图诱导学生学习扰动不变特征，更好地把噪声因子从语音特征中解耦，提升泛化；其二，借鉴自监督学习的已有讨论，采用多视图的方法在被迫最大化两个视图表征之间的互信息，作者推测蒸馏场景可以类推——但作者自己明确标注这个假设"仍需更多研究"。
      - heading [level=3] [ref=f157e173]:
        - link "关键技术创新三：鲁棒性来自几何先验而非鲁棒教师" [ref=f157e174] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e5%85%b3%e9%94%ae%e6%8a%80%e6%9c%af%e5%88%9b%e6%96%b0%e4%b8%89%ef%bc%9a%e9%b2%81%e6%a3%92%e6%80%a7%e6%9d%a5%e8%87%aa%e5%87%a0%e4%bd%95%e5%85%88%e9%aa%8c%e8%80%8c%e9%9d%9e%e9%b2%81%e6%a3%92%e6%95%99%e5%b8%88"
      - paragraph [ref=f157e175]:
        - text: Table 2 同时报告了"标准教师"和"鲁棒教师"两列，构成一个内置消融。结论是：对鲁棒蒸馏方法而言，使用鲁棒教师总体上不会改善学生的最终性能。例如 VIC-KD 的 Wav2Vec 2.0/XVector 组合，标准教师鲁棒精度 86.12，鲁棒教师反而降到 85.33；WavLM/XVector 组合两者基本持平（86.08 对 86.31）。结合 KD 实验里"鲁棒教师的鲁棒性传不过软标签"的事实，论文给出的工程结论是：在 GSC 这个用例上，除非手头已经有现成的鲁棒教师，否则不值得先花额外计算把标准教师对抗训练成鲁棒教师、再做鲁棒蒸馏——直接用微调过的标准教师即可。这个结论的深层含义是：VIC-KD 需要的是教师提供的
        - strong [ref=f157e176]: 干净几何锚点
        - text: ，而不是教师的鲁棒行为。
      - heading [level=3] [ref=f157e177]:
        - link "与现有方法的技术差异" [ref=f157e178] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e4%b8%8e%e7%8e%b0%e6%9c%89%e6%96%b9%e6%b3%95%e7%9a%84%e6%8a%80%e6%9c%af%e5%b7%ae%e5%bc%82"
      - paragraph [ref=f157e179]: 四个方法在"鲁棒性信号注入位置"这个维度上形成清晰谱系：普通 KD 把信号放在自然数据的 logits 上（无鲁棒性）；ARD 把信号放在对抗数据的 logits KL 上（输出层鲁棒）；RSLAD 把信号放在对抗训练循环里的教师软标签上（仍是输出层，但标签更软更细）；VIC-KD 则把信号下沉到表征空间——用方差、不变性、协方差三项直接塑造学生嵌入的几何，输出层的鲁棒约束由 TRADES 项继续承担，两股力互补。另一个差异轴是"是否需要鲁棒教师"：ARD/RSLAD 的原生设计与鲁棒教师天然亲和，而 VIC-KD 实验证明标准教师足够。第三个差异轴是训练成本：VIC-KD 训练时间是 RSLAD 的四倍（论文 4.1 节明确报告），但推理时间与所有蒸馏配方完全一致，因为推理只取决于学生架构。
      - heading [level=2] [ref=f157e180]:
        - link "实验结果" [ref=f157e181] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e5%ae%9e%e9%aa%8c%e7%bb%93%e6%9e%9c"
      - heading [level=3] [ref=f157e182]:
        - link "使用的数据集及其规模" [ref=f157e183] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e4%bd%bf%e7%94%a8%e7%9a%84%e6%95%b0%e6%8d%ae%e9%9b%86%e5%8f%8a%e5%85%b6%e8%a7%84%e6%a8%a1"
      - paragraph [ref=f157e184]: "实验使用 Google Speech Commands v0.02（GSC）数据集：约 100k 条 1 秒英语语音、35 个命令词、16 kHz 采样。论文采用两个版本：其一是全部 35 类；其二是 12 类版本，包括 {yes, no, up, down, left, right, on, off, stop, go, unknown, silence}——其中 silence 类由不含语音的背景噪声构成，unknown 类从其余未用类别中均匀采样拼成。数据切分遵循 SpeechBrain 的配方，按 80%/10%/10% 分为训练、验证、测试集。"
      - paragraph [ref=f157e185]: 模型配置（Table 1）：教师为 Wav2Vec 2.0（94.4M 参数、6160.9 MMACs）和 WavLM（94.4M 参数、6132.7 MMACs），均先在 KWS 任务上微调 10 个 epoch，学习率从 5×10⁻⁴ 调度到 5×10⁻⁵；教师结构是 S3RL 编码器加前述加权求和聚合机制加一个线性分类层（VIC-KD 场景下这个线性层可以丢弃，因为只需要潜在表征）。基线模型训练 100 个 epoch，batch size 32，Adam 优化器，学习率从 10⁻³ 线性衰减到 10⁻⁴。三种蒸馏基线（KD、ARD、RSLAD）与 VIC-KD 均训练 250 个 epoch，超参数与小基线模型对齐。
      - heading [level=3] [ref=f157e186]:
        - link "评估指标的定义和选择理由" [ref=f157e187] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e8%af%84%e4%bc%b0%e6%8c%87%e6%a0%87%e7%9a%84%e5%ae%9a%e4%b9%89%e5%92%8c%e9%80%89%e6%8b%a9%e7%90%86%e7%94%b1"
      - paragraph [ref=f157e188]: 论文报告两个精度：干净精度（clean accuracy，无攻击测试集准确率）和鲁棒精度（AutoAttack 攻击下的准确率）。攻击用 AutoAttack——由 APGD、APGD-T、FAB 三种攻击组成的集成，约束为 ℓ∞ 范数球，半径 ε = 1.5×10⁻³。选择理由（结合社区共识）：AutoAttack 是参数无关的攻击集成，是目前对抗鲁棒性评测的可靠标准，能避免"用一个弱攻击自证鲁棒"造成的虚高；同时报告干净与鲁棒两个数字，才能暴露干净-鲁棒折中这个对抗训练领域的核心矛盾。效率维度用参数量和 MMACs 度量。值得注意的是，训练时生成对抗扰动用的 ε 与评测 ε 一致（均为 1.5×10⁻³），论文未报告两者不一致时的表现。
      - heading [level=3] [ref=f157e189]:
        - link "与基线方法和SOTA的详细对比" [ref=f157e190] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e4%b8%8e%e5%9f%ba%e7%ba%bf%e6%96%b9%e6%b3%95%e5%92%8csota%e7%9a%84%e8%af%a6%e7%bb%86%e5%af%b9%e6%af%94"
      - paragraph [ref=f157e191]:
        - strong [ref=f157e192]: 基线全景（Table 1）
        - text: ：自然训练的模型在攻击下全面崩塌——TC-ResNet 在 35 类上鲁棒精度仅 0.09%，XVector 仅 1.36%，两个 94.4M 的大模型也只有 0.64–9.40%；TRADES 对抗训练把小模型拉起来：TC-ResNet 达 79.25%（12 类）/77.30%（35 类），XVector 达 80.33%/78.27%，教师级模型可达 90.63–94.79%。这组数字确立了"要超过的对手"：鲁棒蒸馏方法必须打赢这些同架构直接对抗训练的基线才算有意义。
      - paragraph [ref=f157e193]:
        - strong [ref=f157e194]: 12 类主实验（Table 2）
        - text: ：VIC-KD 在全部 8 个配置（2 教师 × 2 学生 × 标准/鲁棒教师）下全部超过对应基线，超出幅度 +4.1 到 +6.0 个百分点（Table 2 括号内数字为相对各自 TRADES 基线的百分点差）。最好的组合是 WavLM/XVector + 鲁棒教师（86.31%）和 Wav2Vec 2.0/XVector + 标准教师（86.12%）。对照组的表现分层清晰：KD 干净精度全场最高（96.91）但鲁棒精度 4.49–9.29，形同不设防；ARD 在 8 个配置中 7 个低于基线（-0.4 到 -6.3 个百分点）；RSLAD 只有在容量较大的 XVector 上才略高于基线（+0.5 到 +1.7），在 TC-ResNet 上仍低 1.2–3.0。论文正文给出的相对提升数字：Wav2Vec 2.0/XVector 组合上，VIC-KD 的鲁棒精度相对基线提升 7.2%（86.12 对 80.33，按 Table 2 换算），相对 ARD 和 RSLAD 分别提升 8.0% 和 6.6%（86.12 对 79.74 与 80.79）。摘要中宣称对 ARD 和 RSLAD 分别提升 12% 和 8%，与正文可复算的 8.0%/6.6% 不完全一致，摘要数字未标注具体配置，阅读时应以 Table 2 为准。
      - paragraph [ref=f157e195]:
        - strong [ref=f157e196]: 折中质量（由 Table 2 与 Fig. 3 换算）
        - text: ：干净-鲁棒差距是衡量折中的关键。12 类、WavLM/XVector、标准教师下：KD 差距 88.91 个百分点，ARD 16.94，RSLAD 14.04，TRADES 基线 14.37，VIC-KD 只有 9.84——VIC-KD 是唯一把差距压进个位数接近区的配方，同时干净精度 95.92 并没有明显牺牲。
      - paragraph [ref=f157e197]:
        - strong [ref=f157e198]: 35 类扩展（Fig. 3，WavLM/XVector 组合）
        - text: ：KD 干净 94.95/攻击 4.43；ARD 94.22/68.67；RSLAD 93.78/78.25；VIC-KD 94.11/80.6；监督基线 XVector TRADES 为 93.56/78.27（Table 1 的 35 类鲁棒训练列）。VIC-KD 的鲁棒精度超过基线 2.33 个百分点，同时干净-鲁棒差距最小：VIC-KD 13.51 < RSLAD 15.53 < ARD 25.55 ≪ KD 90.52。ARD 在类别数变多时掉得最狠（比基线低约 9.6 个百分点），说明单纯 logits 层的鲁棒约束在更难的分类边界上最先失效；VIC-KD 的优势在类数扩展后依然保持。Fig. 3 未明确标注使用标准还是鲁棒教师。
      - paragraph [ref=f157e199]:
        - strong [ref=f157e200]: 成本
        - text: ：训练时间 VIC-KD 是 RSLAD 的四倍（多视图的前向、10 步 PGD 攻击生成、教师前向都要算）；推理时间所有蒸馏配方完全相同，只取决于学生架构——这保证了部署零开销的承诺。
      - heading [level=3] [ref=f157e201]:
        - link "消融实验的发现" [ref=f157e202] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e6%b6%88%e8%9e%8d%e5%ae%9e%e9%aa%8c%e7%9a%84%e5%8f%91%e7%8e%b0"
      - paragraph [ref=f157e203]:
        - strong [ref=f157e204]: 多视图消融（Fig. 2，WavLM/TC-ResNet 组合，红色虚线为 TC-ResNet TRADES 基线 79.25）
        - text: ：不用多视图时，KD 9.29、ARD 74.13、RSLAD 77.17、VIC-KD 80.75；加多视图后，KD 10.38、ARD 80.03、RSLAD 81.93、VIC-KD 83.3。三个发现值得展开：其一，多视图对所有蒸馏方法都有增益，ARD 和 RSLAD 原本低于基线，加上多视图后才越过基线线——这意味着这两个已有方法宣称的鲁棒优势实际上依赖"多视图"这个外挂，而多视图并不是它们的方法贡献；其二，VIC-KD 是唯一不加多视图也能超过基线的方法（80.75 对 79.25），说明几何先验本身就覆盖了多视图所提供的一部分不变性；其三，多视图仍给 VIC-KD 带来 2.55 个百分点的额外增益（80.75 到 83.3），两种机制叠加效果最好，但边际增益小于 ARD/RSLAD（它们分别涨 5.90 和 4.76 个百分点），侧面印证几何正则与多视图的作用有重叠。
      - paragraph [ref=f157e205]:
        - strong [ref=f157e206]: 教师类型消融（Table 2 两列对照）
        - text: ：如创新三所述，鲁棒教师总体不占优。最极端的例子是 KD 行——鲁棒教师（自身鲁棒精度 94.79）蒸馏出的学生被攻击后只有 5.11，证明鲁棒性无法通过 logits 监督自动继承；而鲁棒蒸馏方法用鲁棒教师也时有下降（如 WavLM/XVector 上 ARD 从 78.33 掉到 74.03）。论文由此给出明确工程建议：除非已有现成鲁棒教师，不值得额外花计算先造鲁棒教师。
      - paragraph [ref=f157e207]:
        - strong [ref=f157e208]: 学生容量消融（Table 2 纵向对照）
        - text: ：容量稍大的 XVector（80.4K）比 TC-ResNet（67.7K）更早出现"超过基线"的现象——RSLAD 只在 XVector 上能做到，说明 70K 级别的参数量下输出层监督已经不够用，容量越受限，表征层面的引导（VIC-KD）价值越大；而 VIC-KD 在两种学生上都稳定超基线。
      - paragraph [ref=f157e209]:
        - strong [ref=f157e210]: 类别数扩展（Fig. 3）
        - text: ：也可视为任务难度消融，结论同上——难度上升后输出层方法（ARD）退化最快，表征层方法保持优势。
      - paragraph [ref=f157e211]: 论文未报告的消融：VICReg 三项（方差/不变性/协方差）的逐项消融、超参数 α 的敏感性分析、投影头结构的影响，均未在正文出现。
      - heading [level=2] [ref=f157e212]:
        - link "主要贡献" [ref=f157e213] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e4%b8%bb%e8%a6%81%e8%b4%a1%e7%8c%ae"
      - list [ref=f157e214]:
        - listitem [ref=f157e215]:
          - strong [ref=f157e216]: 方法层面
          - text: ：首次把自监督联合嵌入学习中的 VICReg 几何正则（方差-不变性-协方差）迁移到对抗鲁棒蒸馏，提出用表征空间的几何先验替代/补充传统输出层（logits/软标签）的鲁棒性监督，并在 KWS 场景验证有效——填补了"ARD/RSLAD 无法稳定超越 AT 小模型基线"的空白。
        - listitem [ref=f157e217]:
          - strong [ref=f157e218]: 配方层面
          - text: ：提出多视图输入与学生支路对抗扰动叠加的训练配方，并系统证明多视图对 KD、ARD、RSLAD、VIC-KD 四种蒸馏方法都有增益，且揭示已有方法的鲁棒优势部分依赖多视图这个未归属的组件。
        - listitem [ref=f157e219]:
          - strong [ref=f157e220]: 实验证据层面
          - text: ：在 GSC 12 类和 35 类两个设置、双教师双学生共 8 个配置下，鲁棒精度全部超过 TRADES 基线 +4.1 到 +6.0 个百分点（Table 2、Fig. 3），干净-鲁棒差距全场最小，同时推理零开销；摘要宣称对 ARD/RSLAD 鲁棒精度提升 12% 与 8%（正文可复算口径为 8.0% 与 6.6%，Wav2Vec 2.0/XVector 组合）。
        - listitem [ref=f157e221]:
          - strong [ref=f157e222]: 工程结论层面
          - text: ：证明标准微调教师即可支撑鲁棒蒸馏，无需先把教师对抗训练成鲁棒教师，节省一整轮教师级 AT 的计算；配合 4 倍训练时间代价的明示，给后续落地提供了诚实的成本账。
      - heading [level=2] [ref=f157e223]:
        - link "局限性与展望" [ref=f157e224] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e5%b1%80%e9%99%90%e6%80%a7%e4%b8%8e%e5%b1%95%e6%9c%9b"
      - heading [level=3] [ref=f157e225]:
        - link "方法的技术局限性" [ref=f157e226] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e6%96%b9%e6%b3%95%e7%9a%84%e6%8a%80%e6%9c%af%e5%b1%80%e9%99%90%e6%80%a7"
      - list [ref=f157e227]:
        - listitem [ref=f157e228]:
          - strong [ref=f157e229]: 训练成本高
          - text: ：VIC-KD 训练时间是 RSLAD 的四倍（4.1 节）。多视图带来的额外前向、每 batch 的 10 步 PGD 类攻击生成、教师模型前向，三者叠加。虽然推理零开销，但对需要频繁重训的场景（自定义唤醒词）是实际障碍。
        - listitem [ref=f157e230]:
          - strong [ref=f157e231]: 鲁棒精度天花板仍然存在
          - text: ：最好的学生鲁棒精度 86.31（Table 2），距离自身干净精度 95.92 还有近 10 个百分点，距离鲁棒教师自身的 94.79（Table 1）还有约 8.5 个百分点——蒸馏过程依然损失了相当一部分鲁棒性，论文未解释这部分损失的去向。
        - listitem [ref=f157e232]:
          - strong [ref=f157e233]: 关键超参数未交代
          - text: ：TRADES 与 VICReg 凸组合的权重 α 只在 Fig. 1 图注层面提及，正文未报告取值；VICReg 方差项和协方差项的铰链系数也未报告（指向原文 [17]）；投影头的结构（层数、维度、非线性）同样未在正文说明。复现需要反推或联系作者。
        - listitem [ref=f157e234]:
          - strong [ref=f157e235]: 威胁模型窄
          - text: ：只评估了 ℓ∞ 范数、ε = 1.5×10⁻³ 的白盒 AutoAttack（APGD+APGD-T+FAB 集成）。训练与评测使用相同 ε，未报告预算不匹配时的表现；扰动不可感知性未用 SNR/PESQ 等指标量化；引言里用来立题的 over-the-air 物理信道攻击（UTIO）在实验里完全没有出现——而空中传播的信道效应（播放失真、环境混响）恰恰是真实攻击路径。
        - listitem [ref=f157e236]:
          - strong [ref=f157e237]: 多视图机理停留在假设
          - text: ：作者自己标注"互信息最大化可类推到蒸馏"这一解释仍需更多研究（4.2 节），机理论证未闭环。
      - heading [level=3] [ref=f157e238]:
        - link "实验设计的不足" [ref=f157e239] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e5%ae%9e%e9%aa%8c%e8%ae%be%e8%ae%a1%e7%9a%84%e4%b8%8d%e8%b6%b3"
      - list [ref=f157e240]:
        - listitem [ref=f157e241]:
          - strong [ref=f157e242]: 单一数据集、单一语种
          - text: ：只有 GSC v0.02（约 100k 条 1 秒英语命令词），没有远场数据、流式长音频、其他语种或真实唤醒词（"Hey Siri"级别的多音节词）验证；1 秒剪辑的设定与真实常驻监听场景有差距。
        - listitem [ref=f157e243]:
          - strong [ref=f157e244]: 无统计显著性报告
          - text: ：所有数字均为单次运行结果，论文未报告多种子方差或置信区间，而几个关键差距（如 RSLAD 78.25 对基线 78.27，Fig. 3）小到可能落入随机波动区间。
        - listitem [ref=f157e245]:
          - strong [ref=f157e246]: 攻击类型单一
          - text: ：没有黑盒迁移攻击、没有针对 VICReg 几何正则本身设计的自适应攻击——一个知道防御机理的攻击者可以直接对不变性项做优化，这类自适应威胁未被检验。
        - listitem [ref=f157e247]:
          - strong [ref=f157e248]: 模型谱系太稀疏
          - text: ：只有两个学生（67.7K/80.4K）和两个教师，没有中间容量的扫描，无法回答"几何先验的增益随学生容量如何变化"这一关键问题（只能从两个点外推）。
        - listitem [ref=f157e249]:
          - strong [ref=f157e250]: 部署指标是代理而非实测
          - text: ：只用参数量和 MMACs 作效率证据，没有在真实微控制器/DSP 上的时延、内存、功耗实测；论文也未报告 AutoAttack 在端侧运行的可行性讨论。
        - listitem [ref=f157e251]:
          - strong [ref=f157e252]: 摘要与正文数字不一致
          - text: ：摘要的 12%/8% 与正文的 8.0%/6.6% 口径未统一，且摘要数字无法从 Table 2 单一配置复算出来，影响可读性。
      - heading [level=3] [ref=f157e253]:
        - link "未来可能的改进方向" [ref=f157e254] [cursor=pointer]:
          - /url: "#/papers/2023/VIC-KD_Variance-Invariance-Covariance_Knowledge_Distillation_To_Make_Keyword_Spotting_More_Robust_Against_Adversarial_Attacks?id=%e6%9c%aa%e6%9d%a5%e5%8f%af%e8%83%bd%e7%9a%84%e6%94%b9%e8%bf%9b%e6%96%b9%e5%90%91"
      - list [ref=f157e255]:
        - listitem [ref=f157e256]:
          - strong [ref=f157e257]: 威胁模型扩展
          - text: ：补 over-the-air 物理攻击评测（回放信道、扬声器失真、环境噪声叠加）、更大 ε 与预算不匹配实验、感知约束下的攻击（限制扰动 SNR），以及针对几何正则的自适应攻击压力测试；这直接决定方法在真实语音安全场景的可信度。
        - listitem [ref=f157e258]:
          - strong [ref=f157e259]: 机理研究
          - text: ：验证作者提出的互信息假设，量化不变性项与对抗鲁棒性之间的理论联系（例如表征 Lipschitz 常数与鲁棒精度的相关性），把"几何先验有效"从经验观察升级为可解释规律。
        - listitem [ref=f157e260]:
          - strong [ref=f157e261]: 训练成本削减
          - text: ：缓存复用对抗样本、用更便宜的一阶攻击替代 10 步 PGD、教师表征离线预提取（教师每 epoch 输出不变时可以一次算完）、多视图的异步/低频采样，目标把 4 倍开销压回 RSLAD 量级。
        - listitem [ref=f157e262]:
          - strong [ref=f157e263]: 与端侧压缩技术正交组合
          - text: ：VIC-KD 与量化、剪枝、二值化的组合未被探索——真正的 MCU 部署需要两者叠加，且量化本身会改变鲁棒性，组合后的鲁棒精度是开放问题。
        - listitem [ref=f157e264]:
          - strong [ref=f157e265]: 超参数与组件消融
          - text: ：补 VICReg 三项逐项消融、α 敏感性曲线、投影头结构消融，厘清三个几何项各自贡献多少鲁棒性。
        - listitem [ref=f157e266]:
          - strong [ref=f157e267]: 场景扩展
          - text: ：流式检测（帧级判决而非整句分类）、自定义唤醒词的小样本微调（训练成本 4 倍的问题在这里最痛）、多语种与远场混响数据上的泛化验证。