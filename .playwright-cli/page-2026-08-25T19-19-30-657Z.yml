    - generic [ref=f342e123]:
      - generic [ref=f342e124]: "L_total = λ_kws · L_kws + λ_sv · L_sv L_kws: 关键词分类交叉熵 L_sv: 说话人嵌入损失（对比 / AM-Softmax） λ_kws, λ_sv: 两任务的优化平衡旋钮（需按目标调，无万能值）"
      - generic [ref=f342e125]: 人话：一个身子（共享编码器）长两个脑袋（KWS 头管「说了什么」、SV 头管「谁在说」），总损失把两个脑袋的意见加权合成——权重就是两个保安谁说了算的比例，得按实际风险调。
    - paragraph [ref=f342e126]: 训练三件套是这类系统的标配：梯度平衡（两任务梯度量级相当，否则一个主导一个陪跑）、学习率分组（共享层要稳、任务头要快）、交替优化（部分步骤轮流训练，避免反向梯度打架）。
