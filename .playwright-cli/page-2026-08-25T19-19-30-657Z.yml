      - generic [ref=f342e259]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f342e260]: ① always-on 设备上的多个听觉任务，先问「能不能共享编码器」。
      - generic [ref=f342e261]: ↳ 频谱同时编码内容与身份——独立系统等于把一份信息的两半各用一遍还各付一遍算力；共享前端的收益是结构性的（计算、内存、特征三重），精度提升反而是搭头。
      - paragraph [ref=f342e262]: ② 任务张力要靠「分层共享」化解，共享深度由任务亲和度决定。
      - generic [ref=f342e263]: ↳ 需求一致的部分（浅层通用特征）放心共享，需求相反的部分（不变性 vs 判别性）尽早分叉——「共享到第几层」是多任务架构最重要的设计决策，比损失加权更根本。
      - paragraph [ref=f342e264]: ③ 多任务的正则化红利常比单任务精度的小损失更值钱。
      - generic [ref=f342e265]: ↳ 联合训练给每个任务提供了额外的监督信号——数据有限的端侧场景里，这份「免费正则」往往比单任务精打细算的调参更划算。
    - paragraph [ref=f342e266]: 系列坐标：本文（2020，Apple）是 KWS 多任务谱系的开端——「Hey Siri」个性化验签的工程化第一步；2021 年两阶段 KWS+SV 深化共享编码器架构、KWS+VAD 交叉注意力给出注意力版多任务；2026 年 ProKWS（音素+韵律个性化）是个人化路线的远期延伸——「唤醒词 × 说话人」的合流此后再没分开过。
