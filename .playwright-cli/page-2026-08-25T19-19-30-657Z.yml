  - generic [ref=f342e85]:
    - generic [ref=f342e86]: "02"
    - heading "机制：一对「相爱相杀」的任务" [level=2] [ref=f342e87]
    - paragraph [ref=f342e88]: 这个多任务组合最有意思的地方是内在张力：KWS 想要说话人不变性（不管谁说 Hey Siri 都要触发），SV 想要说话人判别性（区分这是不是主人）——对同一份特征提出相反的要求。网络的解法是层级分化：浅层学两任务都需要的通用声学特征（频谱形状、能量轮廓），共享无冲突；深层向各自目标分化，各行其道。而适度的张力反而逼共享层学出更本质的表示——这正是隐式正则化的来源。
