  - generic [ref=f342e13]:
    - generic [ref=f342e14]: "01"
    - heading "问题：两个保安各租各的门面" [level=2] [ref=f342e15]
    - generic [ref=f342e16]:
      - generic [ref=f342e17]: TL;DR
      - list [ref=f342e18]:
        - listitem [ref=f342e19]: ◆ 智能助手的两道安全功能——语音触发（说了「Hey Siri」吗）和说话人验证（是主人吗）——传统上独立运行：各配完整前端、各提各的特征。
        - listitem [ref=f342e20]: ◆ 独立运行四宗罪：计算冗余（always-on 下重复计算翻倍）、特征不共享、性能次优（频谱同时编码内容与身份，互补性白白浪费）、部署复杂。
        - listitem [ref=f342e21]: ◆ 多任务解法：共享编码器 + 双任务头——浅层特征两任务共用（通用声学），深层各自分化（内容判别 vs 说话人判别）。
        - listitem [ref=f342e22]: ◆ 结果是双赢：KWS 精度升（说话人感知帮忙区分相似音素）、SV 等错误率降（内容感知帮忙聚焦关键词语境的声纹）、模型更小、隐式正则化减少过拟合。
