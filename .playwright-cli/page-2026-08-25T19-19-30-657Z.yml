        - generic [ref=f342e201]: "1"
        - paragraph [ref=f342e202]: 互惠的具体机制讲得清楚。SV 给 KWS 的是「不同人发同一个音长相不同」的先验——相似音素序列的判别边界因此更准；KWS 给 SV 的是「此刻说的是唤醒词」的语境锁定——在正确的地方提声纹，验签更稳。不是玄学的「多任务涨点」。
      - generic [ref=f342e203]:
        - generic [ref=f342e204]: "2"
        - paragraph [ref=f342e205]: 浅共享 · 深分化是架构结论。浅层两任务天然无冲突（都要通用声学特征），深层需求相反（不变性 vs 判别性）——共享到哪一层为止，答案由任务的亲和度结构决定，不是越共享越好。
      - generic [ref=f342e206]:
        - generic [ref=f342e207]: "3"
        - paragraph [ref=f342e208]: 生产级数据的背书。在 Apple 大规模语音触发数据（同时含说话人与关键词标注）上验证——工业场景里 KWS+SV 本来就要一起跑，「Hey Siri」的个人化唤醒正是这两个任务的合流点。
