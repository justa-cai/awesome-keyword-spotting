      - generic [ref=f342e96]: 主导训练，另一个沦为陪跑
      - generic [ref=f342e97]: ② 学习率分组
      - generic [ref=f342e98]: 共享部分与任务特定部分可用不同的
      - generic [ref=f342e99]: 学习率/调度——共享层要稳，头要快
      - generic [ref=f342e100]: ③ 交替优化
      - generic [ref=f342e101]: 部分训练步骤轮流优化两个任务——
      - generic [ref=f342e102]: 避免同时反向的梯度互相打架
      - generic [ref=f342e103]: 损失权重的艺术：λ_kws 与 λ_sv 的比例
      - generic [ref=f342e104]: 决定性能权衡——没有万能值，要按目标调
      - generic [ref=f342e105]: 任务间的内在张力
      - generic [ref=f342e108]: KWS 想要：忽略说话人差异
      - generic [ref=f342e109]: 「不管谁说 Hey Siri 都要触发」——说话人不变性
      - generic [ref=f342e111]: SV 想要：利用说话人差异
      - generic [ref=f342e112]: 「区分这是不是主人」——说话人判别性
      - generic [ref=f342e113]: 对同一份特征提出相反的要求！
      - generic [ref=f342e114]: 网络怎么解决：层级分化——
      - generic [ref=f342e115]: · 浅层：两任务都需要的通用声学特征
      - generic [ref=f342e116]: （频谱形状 · 能量轮廓）→ 共享无冲突
      - generic [ref=f342e117]: · 深层：向各自的目标分化——KWS 头做
      - generic [ref=f342e118]: 内容判别、SV 头做说话人判别
      - generic [ref=f342e119]: 张力不是 bug 是特征：适度的冲突逼迫共享层
      - generic [ref=f342e120]: 学出更本质的表示——隐式正则化的来源
      - generic [ref=f342e121]: 左：梯度平衡/学习率分组/交替优化——多任务训练的标配三件套。右：KWS 要说话人不变性、SV 要说话人判别性——同一特征上的相反要求，靠「浅共享深分化」化解，张力本身还成了正则化来源
