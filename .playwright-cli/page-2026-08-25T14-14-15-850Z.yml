  - generic [ref=f263e3]: 论文精读 · 可视化版 · 2021 №2
  - heading "卷积预算别平摊： 全押在时间轴上，再用两把注意力拧准焦点" [level=1] [ref=f263e4]: 卷积预算别平摊：全押在时间轴上，再用两把注意力拧准焦点
  - generic [ref=f263e5]:
    - generic [ref=f263e6]: STCNN · 北理工 + 小米
    - generic [ref=f263e7]: arXiv 2109.00260 · 40 维 MFCC
    - generic [ref=f263e8]: 时间 DW 卷积 + 1×1 · 通道+时间双注意力
    - generic [ref=f263e9]: ~40K 参数 GSC 12 类约 95%（同档 DS-CNN +1–2%）
  - generic [ref=f263e10]: 一句话：关键词识别真正依赖的是时间维度的时序模式（音素序列），而 MFCC 已经把频率信息编码成了通道——那卷积层的参数就不该平摊给频率轴。STCNN 把 2D 深度可分离卷积进一步分解为「时间深度卷积 + 1×1」，再串联通道注意力（选重要特征）与时间注意力（聚焦核心音素段）：约 40K 参数在 GSC 12 类拿到约 95%，同参数量比 DS-CNN 高 1–2 个点，双重注意力再白拿 1–2 个点。
  - generic [ref=f263e11]:
    - generic [ref=f263e12]: TL;DR
    - listitem [ref=f263e13]: ◈ 边缘 KWS 三重约束：参数 <100K · 计算 <10M MADD · 高准确率——标准 CNN 有效，但极低预算下怎么搭架构仍是开放问题（智能手表/无线耳机/IoT 的典型档位）。
    - listitem [ref=f263e14]: ◈ 两个架构缺口：标准 2D 卷积把预算平摊给时间和频率两轴，极小参数量下时间动态建模不足；固定卷积权重对所有时间步和通道一视同仁，无法自适应聚焦最有判别力的核心音素段。
    - listitem [ref=f263e15]: ◈ 核心分解：时间深度卷积（每通道独立沿时间卷积，核 3/5，参数 C×K_t）+ 逐点 1×1（通道混合，参数 C_in×C_out）——标准 2D 卷积的频率核开销整个省掉。
    - listitem [ref=f263e16]: ◈ 敢砍频率轴的理由：频率信息已被 MFCC 滤波器组编码进特征通道——卷积层要学的增量主要在时间模式（音素先后顺序）上。与 TC-ResNet/MatchboxNet 的时间向 1D 化是同一脉络。
    - listitem [ref=f263e17]: ◈ 通道注意力：GAP → FC 降维（r=4）→ ReLU → FC 升维 → Sigmoid——参数仅 2·(C²/r)，增强判别通道抑制噪声通道；时间注意力：沿通道聚合 → FC → Sigmoid——输出每个时间步的权重，聚焦核心音素段、弱化静音/过渡。
    - listitem [ref=f263e18]: ◈ 两把注意力串联（先通道后时间）且插在中间层效果最佳；消融：单独通道 +0.8–1.2%、单独时间 +0.5–0.8%、叠加 +1–2%——两个维度正交互补。
    - listitem [ref=f263e19]: ◈ 三档变体 S/M/L（20K/40K/80K）：S 档参数减半只掉 1–2%；L 档在 35 类上接近 200K 参数的 DS-CNN——参数效率优势在各档与各词表规模都保持。
    - listitem [ref=f263e20]: ◈ 边界：固定长度片段输入（非流式）、仅 GSC 干净近讲（无噪声/远场）、未叠量化/蒸馏、未与同期 KWT 等 Transformer 对比；注意力省参数但引入推理延迟。
  - heading "§01 问题：预算极小时，架构怎么搭" [level=2] [ref=f263e21]:
    - generic [ref=f263e22]: §01
    - text: 问题：预算极小时，架构怎么搭
  - generic [ref=f263e23]: 时间维度缺口 + 特征选择缺口
  - generic [ref=f263e24]:
    - generic [ref=f263e25]:
      - heading "2D 卷积平摊预算" [level=3] [ref=f263e26]
      - paragraph [ref=f263e27]: 标准二维卷积的核同时覆盖时间和频率——参数 C_in×C_out×K_t×K_f 里频率核占一半开销。关键词识别依赖的是音素序列的时间动态，频率维提供的是通道信息——预算平摊在极小参数量下两头都不够。
    - generic [ref=f263e28]:
      - heading "固定权重不挑重点" [level=3] [ref=f263e29]
      - paragraph [ref=f263e30]: 卷积权重对所有时间步和频率通道一视同仁——但关键词的判别力集中在核心音素段，词前后的静音与过渡段只占算力不供信息。没有自适应机制，模型被迫为无关区域付账。
    - generic [ref=f263e31]:
      - heading "三重约束的现实档位" [level=3] [ref=f263e32]
      - paragraph [ref=f263e33]: 智能手表、无线耳机、IoT 传感器的典型预算：参数 <100K、计算 <10M MADD、准确率不能掉——在这个档位上，每一份参数都要花在任务结构最需要的地方。
    - generic [ref=f263e34]:
      - heading "与时间向 1D 化脉络的关系" [level=3] [ref=f263e35]
      - paragraph [ref=f263e36]: TC-ResNet、MatchboxNet 一脉都走过「时间向 1D 化」路线；STCNN 的差异是把可分离分解做彻底（时间 DW + 1×1），并配双注意力补上「特征选择」这个缺口——分解负责省，注意力负责准。
