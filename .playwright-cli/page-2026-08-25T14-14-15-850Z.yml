  - generic [ref=f263e313]:
    - generic [ref=f263e314]: 可迁移判断
    - paragraph [ref=f263e315]: ↳ 算子向任务结构对齐：特征前端已经把频率信息编码成通道时，卷积层的增量学习就该压到时间轴——「按任务的信息分布分配参数预算」比均匀堆 2D 卷积更省。这条对任何结构化输入（时序、图、多模态）都成立。
    - paragraph [ref=f263e316]: ↳ 两把注意力拧两个正交维度：通道（听什么特征）与时间（听哪个时刻）不重叠——注意力模块设计先问「拧的维度正交吗」，正交才可能叠加增益，重叠只会重复浪费。
    - paragraph [ref=f263e317]: ↳ 注意力「免费」要对指标说清：SE 式瓶颈让参数近乎为零，但池化与 FC 的延迟真实存在——报告效率时要分别对参数量与延迟讲，别用「参数极少」掩盖「推理变慢」。
    - paragraph [ref=f263e318]: ↳ 结构效率与数值效率是正交的两维：本文只做了结构维（分解+注意力）；量化/剪枝/蒸馏是数值维——两维叠加（结构压缩 × int8）往往还有乘法空间，单维做到头不是终点。
