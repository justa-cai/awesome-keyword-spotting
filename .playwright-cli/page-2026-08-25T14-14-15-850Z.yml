  - heading "§02 方法：分解 + 双注意力" [level=2] [ref=f263e100]:
    - generic [ref=f263e101]: §02
    - text: 方法：分解 + 双注意力
  - generic [ref=f263e102]: 时间深度卷积 · 1×1 通道混合 · SE 式重加权 · 时间步门控
  - generic [ref=f263e103]:
    - generic [ref=f263e104]: "可分离时间卷积块: 时间 DW 卷积: 参数 C × K_t （核 3/5，每通道独立沿时间） 逐点 1×1 卷积: 参数 C_in × C_out （通道间信息混合） + BN + ReLU vs 标准 2D 卷积: C_in × C_out × K_t × K_f ← 频率核开销整个消失"
    - generic [ref=f263e105]: 人话：把「方形核」砍成「时间条」——MFCC 前端已经把频率信息编码成通道（40 维各对应一个频带），卷积层再学频率模式的边际收益小，学时间模式（音素先后顺序、时序韵律）才是关键词判别的主体。参数大头全压在时间轴上。
  - generic [ref=f263e106]:
    - generic [ref=f263e107]: "通道注意力: GAP → FC(C→C/r) → ReLU → FC(C/r→C) → Sigmoid # 逐通道权重，参数 2·(C²/r) 时间注意力: 沿通道聚合 → FC → Sigmoid → 逐时间步权重 串联: 先通道（选重要特征）→ 再时间（聚焦关键时段），插在中间层"
    - generic [ref=f263e108]: 人话：两把注意力拧两个正交的维度——通道那把决定「听哪些特征」，时间那把决定「听哪个时段」（核心音素段权重高、词前后静音/过渡低）。SE 式瓶颈（r=4）让通道注意力几乎不花参数；插入位置有讲究：太浅特征未成形，太深信息已流失，中间层最佳。
  - generic [ref=f263e109]:
    - generic [ref=f263e110]:
      - heading "为什么两把注意力互补" [level=3] [ref=f263e111]
      - paragraph [ref=f263e112]: 通道注意力作用在「特征」维（哪些通道携带判别信息），时间注意力作用在「时刻」维（哪些帧是核心音素段）——维度正交，各自的增益（0.8–1.2% / 0.5–0.8%）叠加后到 1–2%，大于简单相加的趋势说明确实在补不同的短板。
    - generic [ref=f263e113]:
      - heading "流水线的完整形状" [level=3] [ref=f263e114]
      - paragraph [ref=f263e115]: MFCC（40 维）→ 堆叠的可分离时间卷积块 → 双重注意力 → 全局平均池化 → 全连接分类头。三段各司其职：卷积块负责时间模式提取（省参数），注意力负责重加权（准），GAP+FC 负责判决（轻）。
