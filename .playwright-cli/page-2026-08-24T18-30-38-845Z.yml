      - generic [ref=f80e25]:
        - heading "一分钟版本" [level=2] [ref=f80e26]
        - list [ref=f80e27]:
          - listitem [ref=f80e28]: 两条领域事实：① 已报导 KWS 芯片中权重 SRAM 一项占整芯片功耗 40-60%——模型想变大先被存储功耗卡死；② 片外 DRAM 读 6.2 kB ≈ 1 µJ，而本文整芯片一次决策只要 36 nJ（差近两个数量级）——权重必须片上，且片上存储本身要做省。
          - listitem [ref=f80e29]: 没人挖过的稀疏维度：已有芯片用激活稀疏（≤70%）、权重位稀疏、整帧跳过（76%，粗粒度）——没有任何工作把「激活值的变化量」当能效来源。语音相邻帧高度相关：循环网络隐状态绝大多数分量不变，计算冗余不在「值是多少」而在「值变了没有」。
          - listitem [ref=f80e30]: 方案：ΔRNN——每个神经元算时间差分 Δx/Δh，只有 |Δ| 超过阈值 ΔTH 才更新（零阶保持预测器，生物启发：皮层神经元只在变化超阈值时发放）；GRU 门控数学不动，只改「什么时候需要算」。配套硬件：ΔEncoder 筛事件 → ΔFIFO 广播 → 8 MAC + State Assembler 保证状态一致性。
          - listitem [ref=f80e31]: 设计点 ΔTH=0.2：87% 时间稀疏，精度只掉 <0.6 点（12 类 89.5%），能量 121.2→36.11 nJ（3.4×）、时延 16.4→6.9 ms（2.4×）；能量降幅大于时延——省下的正是被跳过的权重 SRAM 读取。
          - listitem [ref=f80e32]: 另两个电路杠杆：IIR BPF 特征提取器三连优化（混合精度 12b/8b + 系数对称性换乘位 + 10 通道）功耗 5.7×↓ 面积 4.7×↓；0.6V 近阈值全定制 SRAM 读功耗 6.6×↓，存储占比 40-60%→18%（代价面积 ×2——always-on 场景里漏电是每秒支付的持续成本，面积是一次性成本）。
          - listitem [ref=f80e33]: 边界：65nm 上 36 nJ 不是绝对 SOTA（28nm 的 Tan ISSCC24 做到 1.73 nJ）——价值主张是「成熟工艺 + 12 类全标签任务」；麦克风前端 / ADC / 时钟 / 电源管理均未集成；只测了 GSCD 干净条件。
