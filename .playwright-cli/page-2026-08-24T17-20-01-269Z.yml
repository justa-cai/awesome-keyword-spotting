        - heading "一分钟版本" [level=2] [ref=f55e25]
        - list [ref=f55e26]:
          - listitem [ref=f55e27]: 被忽视的失效模式：检测阈值的估计。验证集贪心选出的阈值在噪声失配时高度次优——干净验证集上 20 pp 的表示优势（嵌入 46.1 vs HFCC 25.2）几乎被吞噬，6 dB 下嵌入系统 18.7 反而输给手工特征的 26.8。
          - listitem [ref=f55e28]: 方案（免训练、嵌入级、两步可分）：复用 TACos 训练天然学到的中心码本（每类 16 个中心，零额外训练）——量化（把每帧嵌入替换为最近中心，成对相似度钉在码字对离散格点上）+ 量化误差归一化（按被码本解释的程度缩放，自适应增益补偿噪声）。
          - listitem [ref=f55e29]: 组合靠内积线性性：⟨γ_a,γ_b⟩ 展开四项直接相加——不改动 DTW 后端任何机制；查询与测试两侧对称量化，噪声同时被抑制。
          - listitem [ref=f55e30]: 结果：HF 仿真信道 few-shot 开放集 KWS 测试平均 F 值 27.9 → 33.4、方差大幅收窄（6 dB ±11.6→±4.6）；代价是匹配条件下 <1 pp 边际损失。图 3 的 oracle 阈值对照把论点从相关性推进到因果性。
          - listitem [ref=f55e31]: 分工消融：量化主打噪声鲁棒（测试 31.3 > 归一化 29.1）、归一化主打阈值对齐（验证集 47.0 > 量化的 40.4）——论文自己指出归一化的净增量边际性（判别式训练分数跨类已对齐），诚实。
