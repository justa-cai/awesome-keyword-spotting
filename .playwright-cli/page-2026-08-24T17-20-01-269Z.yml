        - paragraph [ref=f55e222]: 一个值得玩味的细节：验证集上归一化单用（47.0）反而高于合用（45.1）——阈值与数据匹配时量化有轻微精度损失，合用的优势完全体现在失配场景。这提示：若能确保条件匹配只用归一化即可——但真实场景恰恰无法保证匹配。噪声下的分档证据：6 dB 测试量化 29.9±5.1 对归一化 18.3±12.4、3 dB 26.6±7.7 对 13.0±9.8——量化把分数分布稳定下来使阈值可迁移。
