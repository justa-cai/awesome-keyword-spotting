      - heading "知识蒸馏是「靠近教师」，这篇把教师分布整体取负——全局模型在过拟合探针概率高的地方必须输出低概率。 南大+华为：先刻意把私有模型练到过拟合当用户信息探针，再让全局模型反向远离它" [level=1] [ref=f164e13]: 知识蒸馏是「靠近教师」，这篇把教师分布整体取负——全局模型在过拟合探针概率高的地方必须输出低概率。南大+华为：先刻意把私有模型练到过拟合当用户信息探针，再让全局模型反向远离它
      - paragraph [ref=f164e14]: Avoid Overfitting User Specific Information in Federated Keyword Spotting（FedKWS-UI）
      - paragraph [ref=f164e15]: 作者：Xin-Chun Li、Jin-Lin Tang、Le Gan、De-Chuan Zhan（南京大学）；Shaoming Song、Bingshuai Li、Yinchuan Li、Yunfeng Shao（华为诺亚方舟实验室）· arXiv 2206.08864
      - paragraph [ref=f164e16]: 数据：GSC 联邦划分（12 类 2,234 客户端 / 35 类 2,434）· 架构：DSCNN / MHAttRNN / ResNet / Transformer（169K–238K 同级）· 八组全胜
      - generic [ref=f164e17]:
        - generic [ref=f164e18]: ALO 负蒸馏（算法层）
        - generic [ref=f164e19]: ALT 自适应本地训练（系统层）
        - generic [ref=f164e20]: 过拟合 = 用户信息探针
        - generic [ref=f164e21]: 调和平均效用 + 总量守恒
        - generic [ref=f164e22]: Transformer 最大 +6.35
        - generic [ref=f164e23]: FA/FR 双优（不调阈值）
      - generic [ref=f164e24]:
        - heading "一分钟版本" [level=2] [ref=f164e25]
        - list [ref=f164e26]:
          - listitem [ref=f164e27]: 问题重构：把 FedKWS 的性能退化从笼统的「non-IID 困难」重构为「本地模型过拟合用户特有信息」——两个具体失败样例：特征提取器把某用户的口音当成判别因素、分类层偏向该用户常用的词。结构性放大器：FedAvg 默认 E=50 × batch 32 = 每轮消费 ~1,600 样本点，而平均每客户端只有 20.4 条（12 类）/43.3 条（35 类）——本地数据每轮被重复约 78/37 遍：过拟合用户信息不是超参失误，是协议结构的必然行为。
          - listitem [ref=f164e28]: 三重偏斜 + 双重侵蚀：数量偏斜（有人只贡献几条）+ 标签分布偏斜（爱说的词不同）+ 特征分布偏斜（口音）。据文献结论：特征偏斜主要侵蚀低层、标签偏斜主要侵蚀高层——KWS 双重偏斜下偏置弥散整个网络，针对特定层或参数空间的正则（FedProx/FedDyn/MOON）结构上打不全。且这些方法只限制「漂移量」，从不指明「哪些成分是用户特有的应当剔除」——被动距离约束而非主动信息甄别。
          - listitem [ref=f164e29]: 双路设计：一算法一系统。用户特有信息既在「怎么算损失」里混进来（单客户端损失被口音和常用词支配），也在「谁训得多」里混进来（不合格与优质客户端拿同样步数）——单一层面动手术不彻底。
          - listitem [ref=f164e30]: ALO（Adversarial Learning against Overfitted models）：私有-共享模型框架——每客户端额外维护一个从不上传的私有模型 fp，用纯交叉熵刻意练到过拟合（过拟合从缺陷变成工具：用户特有信息的可微分探针——当 fp 在 20 条数据上接近完美拟合，其预测分布里沉淀的正是该用户可被记忆的一切，口音与偏好词被充分放大）。全局模型的损失 = 标签平滑 CE（μ=0.2，锚住判别信号）+ λ·负蒸馏（式 2：形式完全跟随知识蒸馏但教师分布整体取负——最小化等价于要求全局模型在 fp 概率高处输出低概率——「远离教师」）。为什么取负而非 min-max：对手冻结——「对抗」是恒定推离方向，避免小样本下双模型博弈震荡。函数层面正则：不涉参数距离不对齐中间特征——绕开「偏置弥散在不同层」的结构困难。
          - listitem [ref=f164e31]: λ 的量化边界（最锋利的消融）：λ=0 时 85.29、1e-4 时 86.07、1e-3 最优 86.23、1e-2 跌到 82.79、1e-1 崩至 76.99——有效窗口仅一个数量级：对抗项是导航微调而非主损失，权重大一个量级开始有害、大两个量级直接毁掉训练（反面印证「负教师里混有判别信息」）。
          - listitem [ref=f164e32]: ALT（Adaptive Local Training）：效用 r_k = 调和平均(归一化样本量 n̄_k, 归一化类分布熵 e_k)——调和平均的短板效应精确刻画「两种合格都是必要条件」：量大但类倾斜（模型被带向偏好词）不该多训、类均匀但只有几条（必过拟合）也不该多训（算术平均下两个坏案例都拿中效）。每轮步数 = r₀·r_k·E，总量守恒 Σ r₀r_kE ≈ K·E——性能不靠偷偷多花钱。实测效用差一个数量级（12 类 0.15–3.49、35 类 0.21–4.70）。
          - listitem [ref=f164e33]: 主结果（Figure 2，最后 5 轮平均，8 组全胜）：12 类 Transformer +6.35（72.71→79.06，最大提升）；12 类 ResNet +2.30、DSCNN +1.78；35 类 Transformer +4.51（FedOpt 崩到 54.56 时 UI 74.75）。五层读数：① 联邦化代价被量化——基线最好 86.39 vs 集中式 97.89 差 11.5 点，UI 87.29 仍差 9.9 点（止血非根治）；② 联邦下架构排序反转——MHAttRNN 最稳、Transformer 最差（缺归纳偏置，小数据客户端更脆）；④ 基线内部不稳——FedProx 有时反低于 FedAvg、FedOpt 在 35 类 Transformer 灾难崩盘（服务器自适应路线在双重偏斜下不牢靠）。
          - listitem [ref=f164e34]: FA/FR 双优（Table 3，不调阈值）：FA 0.23（FedAvg 0.27 / FedOpt 0.32）、FR 2.78（5.03 / 3.19）。FedOpt 是 trade-off（FR 降 FA 升），UI 双项同时占优 = 判别边界真的变干净，不是工作点移动。
          - listitem [ref=f164e35]: 消融的架构分化（有信息量）：只 ALT 时 MHAttRNN 甚至略超完整版（84.73 vs 84.60）、Transformer 基本可用，但 ResNet 差 6.40——时序建模强的架构对用户偏置本身鲁棒（调度就够）；纯前馈架构偏置吸收深，必须靠损失层显式对抗清洗。
          - listitem [ref=f164e36]: 插值可视化（Figure 4，几何解释）：集中式 θ0 + 劣质用户微调 θ1 + 合格用户微调 θ2 的插值空间——沿合格方向泛化基本不掉、沿劣质方向迅速塌陷（深坑）。联邦聚合本质是多个本地解的加权平均 = 插值空间里的一个点——本地更新造成的深坑直接伤害聚合；ALO 施加后 θ̂1 更好且沿劣质方向地形变平滑（把坑填平 = 几何上解释为什么有利聚合）。
          - listitem [ref=f164e37]: 边界：本地开销近翻倍（私有模型先行训练——具体步数未报；对端侧内存预算是现实压力）；负蒸馏无理论保证（λ 有效窗口仅一个数量级——跨数据集/架构超参迁移性存疑）；「充分过拟合」无可操作判据（个位数样本的客户端探针本身失效）；r_k 启发式无替代效用消融；单一数据集（直接对比对象 Leroy 用的 Hey Snips 未覆盖）；无方差/显著性（+0.18 这种领先难判显著）；FA/FR 只报一个设置；无系统成本核算（对主打系统调度的贡献是明显缺口）；未与个性化路线（含作者自己的 FedPHP）对照取舍。
