      - generic [ref=f164e343]:
        - generic [ref=f164e344]:
          - heading "技术局限" [level=4] [ref=f164e345]
          - list [ref=f164e346]:
            - listitem [ref=f164e347]: 本地开销翻倍：额外维护 + 先行训练私有模型——存储计算近似翻倍；对端侧内存预算是现实压力。通信不变（fp 不上传）但具体开销未报。
            - listitem [ref=f164e348]: 负蒸馏无理论保证：为什么「远离教师」恰好删用户特有成分而保留判别成分——只有经验边界（λ 窗口一个数量级）；跨数据集/架构超参迁移性存疑。
