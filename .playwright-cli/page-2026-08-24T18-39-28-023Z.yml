        - heading "一分钟版本" [level=2] [ref=f85e25]
        - list [ref=f85e26]:
          - listitem [ref=f85e27]: 痛点在范式不在算力：现有 SNN KWS 一律「晚决策」——必须收完整个 1 秒样本（大量零填充静音）才在读出层给分类。两重浪费：词尾后的几十个时间步纯静音仍维持膜电位与前向计算；响应被人为推到样本结束——SNN 逐帧可预测的实时潜力完全没兑现。
          - listitem [ref=f85e28]: 架构前提：弃脉冲卷积（SCNN 把整张语谱图当图像、需要额外时间步编码——网络时间轴与语音时间轴解耦，天然只能晚决策），选帧同步前馈全连接 SNN：第 t 帧对应第 t 个时间步，每步都完成一次携带膜电位历史的前向、读出层每步有输出——早决策在数学上才有定义。
          - listitem [ref=f85e29]: CT 损失：O[t] = 截至当前帧的 softmax 累积和（=全部历史证据），对 O[t] 做交叉熵并在每个时间步上取平均——把「累积历史」（TET 缺）与「逐步监督」（spike-rate/cumulative 缺）两个互斥设计合到一个目标里。
          - listitem [ref=f85e30]: 早停准则：CS_t = max(softmax(O[t])) 超过阈值 C 立即终止并输出——跳过步的全部脉冲传播清零。结果：512 档以 52% 能耗（23.68 对 45.41µJ）保 93.04%（−0.08 点），决策步 98→60.46；128 档 2.85µJ 全场最低。
          - listitem [ref=f85e31]: SC-100 数据集：313,951 条 / 100 命令 / 每条带起止时间戳——GSC 的零填充淹没词边界，早决策连评估地基都没有。CT 是唯一 Δt_d 为负的损失：平均在词尾前 3.85 步（≈39ms）就做出决定。
          - listitem [ref=f85e32]: 反直觉发现：SC-100 上早决策精度（93.21）略高于晚决策（93.16）——尾部 ~35 步纯静音是膜电位的记忆负担，早停不只是省电，某些分布下还是保精度手段。缺口：阈值 C 未报告；无 ANN 早退出对照；闭集评测无误唤醒指标。
