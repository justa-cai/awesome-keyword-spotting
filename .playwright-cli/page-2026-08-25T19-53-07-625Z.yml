        - paragraph [ref=f9e230]: "与 #12 MicroNets 的对照最有启发。MicroNets 预测延迟：确定性关系（纯 CPU 上操作数线性），一个统计量就够；本文预测准确率：高度随机（训练动力学、初始化、数据顺序全在起作用），必须用学习式回归 + 真实数据回灌——预测目标的「可预测性」决定代理的形态。"
      - generic [ref=f9e231]:
        - generic [ref=f9e232]: "2"
        - paragraph [ref=f9e233]: 迭代曲线是飞轮的证据。发现架构的质量随轮次单调爬升且渐趋饱和——说明收益确实来自「代理变准」而不是随机撞大运；饱和点也提示了何时该停止（多训一轮的边际收益 vs 成本）。
