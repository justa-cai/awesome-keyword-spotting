    - generic [ref=f9e131]:
      - generic [ref=f9e132]: "编码: arch → [one-hot(op₁), k₁, c₁, skip₁, …, one-hot(op_L), k_L, c_L, skip_L] 代理: acĉ = MLP / RandomForest(编码向量) ← 秒级，替代小时级训练 循环: 预测全空间 → 真训 Top-K → (arch, acc) 入库 → 重训代理 → 下一轮"
      - generic [ref=f9e133]: 人话：把网络结构写成一行「身份证号」，回归器学会了从号码猜成绩——先花小钱（训几十个）教会它大概，然后它替你把几万个候选都「面试」一遍，只有最有希望的几个才发「录用通知」（真训验证）。
    - paragraph [ref=f9e134]: 编码方案的取舍值得注意：简单编码（固定层描述 + one-hot）配 MLP 就够用；但搜索空间一大，同样 50–100 个初始样本就罩不住了——空间维度与初始数据量要匹配，这是使用这类方法前要先算的账。
