  - generic [ref=f9e86]:
    - generic [ref=f9e87]: "02"
    - heading "机制：飞轮与它的副作用" [level=2] [ref=f9e88]
    - paragraph [ref=f9e89]: 迭代细化是个典型的飞轮：代理预测越准 → 选出的 Top-K 越靠谱 → 拿到的真实成绩越有价值 → 新数据让代理又更准。但飞轮有个内生的副作用——采样会持续向「验证过的高分区域」聚集，没人去过的角落越来越稀疏，那里的预测可靠性持续下降。探索/利用的平衡（主动学习视角）是这类方法的隐藏课题。
