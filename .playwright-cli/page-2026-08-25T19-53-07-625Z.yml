  - generic [ref=f9e13]:
    - generic [ref=f9e14]: "01"
    - heading "问题：训后评估卡死了 NAS" [level=2] [ref=f9e15]
    - generic [ref=f9e16]:
      - generic [ref=f9e17]: TL;DR
      - list [ref=f9e18]:
        - listitem [ref=f9e19]: ◆ NAS 的核心瓶颈不在搜索算法而在评估：每个候选架构都要完整训练几小时，数千候选意味着数百上千 GPU 小时——这个范式让 NAS 在实际工程里难以落地。
        - listitem [ref=f9e20]: ◆ 代理模型思路：学一个「架构描述 → 性能」的回归器——架构先变成数值向量（每层的操作类型 one-hot + 核大小/通道数 + 连接位），MLP 或随机森林吃向量吐预测分。
        - listitem [ref=f9e21]: ◆ 冷启动悖论有解：先随机训 50–100 个架构打底；之后每轮只对代理选出的 Top-K 做完整训练，新数据回灌让代理越用越准（5–10 轮迭代）。
        - listitem [ref=f9e22]: ◆ 代价与风险：数据稀疏区域的预测接近瞎猜——可能错过黑马架构；这是所有学习式代理的共同弱点。
