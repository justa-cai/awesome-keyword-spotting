  - generic [ref=f9e282]:
    - generic [ref=f9e283]: "05"
    - heading "可迁移的判断" [level=2] [ref=f9e284]
    - generic [ref=f9e285]:
      - generic [ref=f9e286]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f9e287]: ① 昂贵评估的优化问题，先训一个「评估代理」再海选。
      - generic [ref=f9e288]: ↳ 凡是单次评估要小时级的场景（架构搜索、超参调优、A/B 候选筛选），代理模型 + 真实验证的循环几乎总能砍一个数量级——前提是评估目标有可学的规律可循。
      - paragraph [ref=f9e289]: ② 预测目标的可预测性，决定代理的形态。
      - generic [ref=f9e290]: ↳ 确定性目标（延迟、内存）用简单统计量（#12 的操作数）；随机性目标（准确率）用学习式回归 + 迭代回灌（本文）——先判断目标在谱上的位置，再选代理，不要上来就训神经网络。
      - paragraph [ref=f9e291]: ③ 学习式代理必然偏科：它只会优化「见过的地方」。
      - generic [ref=f9e292]: ↳ 飞轮让采样向高分区域聚集，稀疏区成为盲区——用代理做搜索时要显式保留探索预算（随机采样、不确定性采样），否则找到的是「代理认为的好」而非「真的好」。
    - paragraph [ref=f9e293]: 系列坐标：2020 年 NAS×KWS 的第四条路线——#2 AutoKWS、#16 NAS-KWS 走 DARTS（权重共享隐式预测性能），#12 MicroNets 用操作数预测延迟（确定性代理），本文用回归器预测准确率（学习式代理）——四条路线合起来，恰好把「性能预测」这个 NAS 核心问题的解空间铺开了一遍。
