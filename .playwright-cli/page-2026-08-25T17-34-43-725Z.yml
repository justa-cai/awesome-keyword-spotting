    - generic [ref=f308e22]: §01
    - text: 问题：每个新词都要一个专用模型
  - generic [ref=f308e23]: 三维硬约束的竞赛设定
  - generic [ref=f308e24]:
    - generic [ref=f308e25]:
      - heading "搜索效率的硬时间线" [level=3] [ref=f308e26]
      - paragraph [ref=f308e27]: 实际场景里用户添加新唤醒词后，系统要在合理时间（分钟级而非天级）完成适配——NASNet/AmoebaNet 的数千 GPU 小时意味着「加个词等一周」，产品上不可接受。
    - generic [ref=f308e28]:
      - heading "小样本 + 小模型的双重挤压" [level=3] [ref=f308e29]
      - paragraph [ref=f308e30]: 每词只有 5–20 个样本（用户不会为新词录几百条），模型要塞进 MCU/DSP 的几十 KB 预算——容量小、数据少，两个约束同时压，手工设计都难，何况自动搜。
    - generic [ref=f308e31]:
      - heading "NAS 与小样本的组合逻辑" [level=3] [ref=f308e32]
      - paragraph [ref=f308e33]: 两者解的是不同问题：NAS 解「架构对不对」（每个词的声学特性不同，最优架构可能不同），迁移学习解「初始化好不好」（小样本从随机起步必过拟合）——DKU 把两件事串成一条流水线。
    - generic [ref=f308e34]:
      - heading "与同系列论文的坐标" [level=3] [ref=f308e35]
      - paragraph [ref=f308e36]: 编码器-解码器 NAS（2021 №10）搜潜在空间的通用架构；NAS+量化（№11）把量化塞进搜索循环；本文是竞赛语境下的完整系统——含迁移与增强的全流程答卷，三篇共同验证 NAS 在 KWS 的可行性。
