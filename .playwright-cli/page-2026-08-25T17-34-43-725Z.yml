      - generic [ref=f308e268]: "2"
      - paragraph [ref=f308e269]: NAS 与小样本学习的有效结合：搜索空间 + 权重共享 + 小样本微调协同——每词 5–20 样本即可自动发现有效架构，KWS 快速定制的关键组合。
