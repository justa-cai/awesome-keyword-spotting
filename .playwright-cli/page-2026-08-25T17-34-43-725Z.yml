    - generic [ref=f308e256]: 读表要点
    - listitem [ref=f308e257]: ◈ 投入产出的优先级清晰：迁移 > 增强 > 架构搜索——先把预训练骨架和增强配好，再谈搜架构；跳过前两步直接 NAS 是把钱花在回报最小的地方。
    - listitem [ref=f308e258]: ◈ 小样本悬崖是诚实的边界：<5 样本时 1-shot 比 10-shot 低 10–15 点——NAS 与迁移都没解决「一个样本学一个词」的问题（那是度量学习/文本锚点路线的主场，见 №13/№16/№22/№23）。
    - listitem [ref=f308e259]: ◈ 证据边界：竞赛特定优化未必泛化；无 DARTS/ENAS 横比；噪声/远场评估有限；架构为什么好缺可解释性分析——「与人类直觉一致」是观察不是解释。
