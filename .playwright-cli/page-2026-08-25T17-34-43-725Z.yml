  - generic [ref=f308e308]:
    - generic [ref=f308e309]: 可迁移判断
    - paragraph [ref=f308e310]: ↳ 先冻结预训练骨干，再谈搜架构：迁移 +5–10% vs NAS +1–3%——投入产出比差 3–5 倍。任何「自动化设计」系统都该先把手动的低成本高收益项（预训练、增强）配满，自动化的预算才花得值。
    - paragraph [ref=f308e311]: ↳ 权重共享是速度与准确性的交易：三个数量级的加速代价是排序偏差——超网里的第一名不一定是独立训练的第一名。「方向相关但不完全一致」是这类方法的可用下限，部署前要独立重训验证。
    - paragraph [ref=f308e312]: ↳ NAS 的结果可以反哺设计直觉：搜出的架构偏爱 DS 卷积 + 窄而深，与人类经验一致——把 NAS 当「领域经验的自动验证器」用，即使不部署搜出的模型，搜索结论也能指导手工设计。
    - paragraph [ref=f308e313]: ↳ 小样本 <5 是方法论分界线：NAS+迁移在 5–20 样本区间有效，<5 样本该换路线（度量学习/文本锚点/预训练原型）——工具选错档位，调参调不回来。
