- generic [ref=f308e2]:
  - generic [ref=f308e3]: 论文精读 · 可视化版 · 2021 №25
  - heading "用户加个新唤醒词， 机器自己搜个专用模型出来——NAS × 小样本的竞赛答卷" [level=1] [ref=f308e4]: 用户加个新唤醒词，机器自己搜个专用模型出来——NAS × 小样本的竞赛答卷
  - generic [ref=f308e5]:
    - generic [ref=f308e6]: DKU Auto-KWS 系统 · 昆山杜克大学
    - generic [ref=f308e7]: arXiv 2104.04993 · Interspeech 2021 挑战赛
    - generic [ref=f308e8]: 单元搜索空间 ~10⁸ · One-Shot 超网络 · 进化搜索
    - generic [ref=f308e9]: 单 GPU 数小时 · 迁移 +5–10% · 竞赛前排
  - generic [ref=f308e10]: 一句话：Auto-KWS 挑战赛的问题不是「设计一个通用 KWS 模型」，而是「用户每加一个自定义唤醒词，就自动为这个词搜一个专用模型」——同时考搜索效率（分钟级而非天级）、模型效率（几十 KB 级）、小样本性能（每词 5–20 个样本）三维。DKU 系统的答案：单元搜索空间（~10⁸）→ One-Shot 超网络权重共享（单 GPU 数小时，比穷举快三个数量级）→ 进化搜索选架构 → 大规模预训练迁移（+5–10%，最大增益来源）→ 渐进解冻小样本微调 → 多重增强。竞赛前排：搜出的架构偏爱 DS 卷积 + 窄而深，与人类设计直觉一致。
  - generic [ref=f308e11]:
    - generic [ref=f308e12]: TL;DR
    - listitem [ref=f308e13]: ◈ 三维同时考的赛制：搜索效率（用户加词后要分钟级适配——传统 NAS 数千 GPU 小时不可用）、模型效率（MCU/DSP 的几十 KB 参数约束）、小样本性能（每词 5–20 样本）——三个都是实际部署硬约束，偏科就输。
    - listitem [ref=f308e14]: ◈ 六步全自动化流程：定义搜索空间 → 超网络训练 → 进化搜索 → 迁移学习初始化 → 小样本微调 → 增强与评估——尽可能减少人工干预。
    - listitem [ref=f308e15]: ◈ 单元搜索空间（~10⁸）：正常单元（保持分辨率）+ 缩减单元（步长 2 下采样）；每单元 B=4–7 节点、边选操作；操作集 6 种（3×3/5×5 DS 卷积 · 平均/最大池化 · 恒等 · 零）——覆盖主流组件且空间可管理。
    - listitem [ref=f308e16]: ◈ One-Shot 超网络是加速的来源：一个包含所有操作的超网络只训一次（每 batch 随机采样子架构——路径级 dropout），之后直接提取子架构权重评估——进化搜索在继承权重上跑变异/交叉，免逐个训练。单 GPU 数小时，比穷举快三个数量级。
    - listitem [ref=f308e17]: ◈ 迁移学习是增益的大头：LibriSpeech/GSC 预训练初始化 + 渐进解冻（先只训高层）——小样本下比从头训 +5–10%；只微调顶层 3–4 层就拿到 80% 的增益；两个预训练源差异不大（收益来自通用声学特征而非领域知识）。
    - listitem [ref=f308e18]: ◈ 搜出架构的三个共性：偏爱 3×3 深度可分离卷积、池化少（与人类设计直觉一致——NAS 学到了领域经验）；窄而深（6–10 层）优于宽而浅；同参数约束（<50K）比手工 DS-CNN 高 1–3%。
    - listitem [ref=f308e19]: ◈ 增强账本：SpecAugment +1–2%（性价比最高）；极小样本（1/5-shot）下增强增益放大到 +3–5%（数据少时增强价值高）；组合优于单独。
    - listitem [ref=f308e20]: ◈ 未解的悬崖：样本 <5 时准确率显著下降——1-shot 比 10-shot 低 10–15 点，迁移+增强都没填平。搜索空间无注意力/Transformer 组件；权重共享的排序偏差是已知挑战。
