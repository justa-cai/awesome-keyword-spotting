  - heading "§02 方法：权重共享 + 迁移学习" [level=2] [ref=f308e105]:
    - generic [ref=f308e106]: §02
    - text: 方法：权重共享 + 迁移学习
  - generic [ref=f308e107]: One-Shot 超网络 · 渐进解冻 · 多重增强
  - generic [ref=f308e108]:
    - generic [ref=f308e109]: "超网: Supernet ⊇ 全部子架构 · 只训一次（每 batch 随机采样路径） 搜索: 进化算法：变异（改操作）+ 交叉（交换结构） 适应度 = 子架构在验证集精度（用继承权重评估——免训练） 迁移: LibriSpeech 960h / GSC 预训练 → 初始化特征提取器 微调: 渐进解冻（先高层后逐层）· lr 1/10~1/100 · 强正则 增强: SpecAugment · 噪声注入(SNR 0–20dB) · 速度 0.9/1.0/1.1× · 音量 ±6dB · Mixup（标签插值平滑决策边界）"
    - generic [ref=f308e110]: 人话：超网络像一栋「所有可能架构都住在里面」的大楼——训练时每批随机点亮一条通路，练完之后任何子架构都能直接摘自己的权重出来用。进化搜索就在这栋楼里挑最好的住户，不用给每个住户单独发工资（训练）。
  - generic [ref=f308e111]:
    - generic [ref=f308e112]:
      - heading "渐进解冻的防过拟合逻辑" [level=3] [ref=f308e113]
      - paragraph [ref=f308e114]: 小样本上微调整个模型 = 用 5–20 个样本去拟合几万个参数——必然过拟合。先冻结底层（通用声学特征已够好）只训高层分类器，验证有效后再逐层解冻——每一步都在「能学」与「会忘」之间控制暴露面。
    - generic [ref=f308e115]:
      - heading "进化 > 随机搜索的消融意义" [level=3] [ref=f308e116]
      - paragraph [ref=f308e117]: 如果继承权重毫无指导力，进化搜索不会优于随机——这项消融证明超网络的权重确实携带了架构质量的信息（尽管排序不完全一致）——权重共享的估计偏差存在但方向正确，这是 One-Shot NAS 可用的最低保证。
