    - heading "问题：分类答不了「在哪」" [level=2] [ref=f56e15]
    - generic [ref=f56e16]:
      - generic [ref=f56e17]: TL;DR
      - list [ref=f56e18]:
        - listitem [ref=f56e19]: ◆ 标准 KWS 是序列级分类——「有没有」答得了，「关键词出现在哪个时间位置」答不了；而精确定位对下游处理（ASR 解码起点）至关重要。
        - listitem [ref=f56e20]: ◆ 分类范式还要求预先切段——连续音频流处理不灵活；视觉界早完成了从分类到「位置+类别」的进化（Faster R-CNN 的 RPN）。
        - listitem [ref=f56e21]: ◆ 核心类比：频谱图 ≈ 图像（横轴时间纵轴频率）、关键词 ≈ 目标物体（占据特定时频区域）、时间边界 ≈ 边界框——RPN 机制原封不动，语义全套更换。
        - listitem [ref=f56e22]: ◆ 输出升级：「这段音频有词」→「有词，且从 1.32 秒到 1.78 秒」——定位信息可直接喂给 ASR 解码起点，级联价值明确。
