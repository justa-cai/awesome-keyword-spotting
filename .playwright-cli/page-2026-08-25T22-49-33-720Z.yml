    - generic [ref=f56e149]:
      - generic [ref=f56e150]: "骨干: F = CNN(Mel 频谱图) ← 特征图, 每位置对应一个时频区域 锚点: 每位置 × 多个时间尺度 = 候选框 预测: objectness(有无词) + Δt(边界回归) ← 每锚两输出 损失: L = CE(分类) + smooth-L1(边界回归) ← 端到端联合 后处理: score > θ → NMS → (有词, t_start, t_end)"
      - generic [ref=f56e151]: 人话：拿一张照片（频谱图），在各个位置摆上不同大小的框（锚点），每个框问一句「这里面有没有猫（关键词）」——有的框再微调一下边界让它框得更准，最后把重叠的框合并，报告「有猫，在照片的这块区域（第几秒到第几秒）」。
    - paragraph [ref=f56e152]: 频率维候选其实是冗余的（文中自认）：关键词检测只关心时间位置——2D 候选有一半是浪费，「框」在音频里本质上是一维的；这个观察指向了明确的改进方向：1D 时序专用检测网络。
