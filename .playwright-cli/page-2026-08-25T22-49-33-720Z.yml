      - paragraph [ref=f56e273]: ① 跨域类比是快速创新的捷径——成熟机制整套白拿。
      - generic [ref=f56e274]: ↳ RPN 的锚点+回归+NMS 全套现成，本文的增量只在「语义映射表」——跨域迁移让一个领域十年的工程积累对另一个领域即时可用；做研究先问「这个问题在别的领域被解决过吗」。
      - paragraph [ref=f56e275]: ② 但要交「结构税」：源域归纳偏置 ≠ 目标域结构。
      - generic [ref=f56e276]: ↳ 空间对称 vs 时间因果、2D 框 vs 1D 边界——照搬后按目标域结构做减法（本文砍掉频率维就是该做的减法）是迁移的第二步；只做第一步的迁移是半成品。
      - paragraph [ref=f56e277]: ③ 任务的输出规格决定价值上限。
      - generic [ref=f56e278]: ↳ 「有没有」与「有没有+在哪」是不同规格的输出——后者解锁级联场景（ASR 起点、音频剪辑、词级对齐）；设计系统时先问下游需要什么规格的输出，而不是从「分类最简单」出发。
    - paragraph [ref=f56e279]: 系列坐标：跨模态思想迁移谱系的音频节点——本文（2019）RPN 图像→音频，#29 WSRNet（2020）检测+识别联合的图像→音频（文档侧）；加上更早的 Sinc/learnable filterbank（信号处理可学习化），「借别的领域的成熟机制」是 KWS 方法论的重要支线——本文提醒的是：机制可以搬，结构要自己适配。
