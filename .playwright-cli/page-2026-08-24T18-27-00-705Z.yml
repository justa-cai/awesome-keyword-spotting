      - generic [ref=f78e220]: 逐任务视角（Fig. 2，buffer=500）：DE-KWS 学完六个任务后首任务 T1 保持 80.13%（学完时 96.82%，保留率约 82.7%），远好于 EWC 的 60.53%；中期任务是主场——T2 上 78.84% 对 RK 65.78% / RWalk 66.87%，T5 上 91.24% 对 RWalk 54.28% / EWC 49.20%。两个诚实细节：① 最旧任务 T1 的保持上 RWalk（83.75%）其实略高于 DE-KWS（80.13%）——整体优势来自全谱平衡（终态六任务 80.13/78.84/82.05/75.15/91.24/95.87）而非单点极致；② 最新任务精度 95.87% 低于无正则基线（EWC 98.78% 等）——稳定性-可塑性权衡的直接体现：蒸馏约束了可塑性，学新略钝，换旧任务大幅保持，平均净收益为正。任务数压力测试（Fig. 3）：10/20 任务档所有方法都随任务数下降，DE-KWS 两组设定持续领先（NR/EWC/RK/iCaRL/BiC）。
