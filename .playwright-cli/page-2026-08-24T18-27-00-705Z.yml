            - listitem [ref=f78e244]: 输出头按 30 类预分配：真实部署新词数量未知，头扩展与旧 logit 维度对齐未讨论——恰是 CIL 落地经典难点。
            - listitem [ref=f78e245]: 有界记忆的信息差：buffer=1500 仍差 Joint 4.53 点；500→1000 只 +1.14 点，边际递减。
            - listitem [ref=f78e246]: 隐私未触及：端侧持久保存用户语音片段是敏感数据，无脱敏 / 特征级替代方案。
            - listitem [ref=f78e247]: 可塑性轻微牺牲：最新任务 95.87% 低于无正则基线，无随任务衰减 β 的权衡调节机制。
        - generic [ref=f78e248]:
          - heading "实验设计不足" [level=4] [ref=f78e249]
          - list [ref=f78e250]:
            - listitem [ref=f78e251]: 数据集单一且干净：仅 GSC v1（30 词 1 s 英语干净读音）；无噪声 / 远场 / 多说话人 / 多语言；每任务 3~15 个词数据充足——与「新域 few-shot 适配」动机有落差。
            - listitem [ref=f78e252]: 端侧主张无端侧证据：无真机部署、延迟、内存、功耗、增量训练开销数字。
            - listitem [ref=f78e253]: 评估协议混淆：80/20 二分无独立测试集，模型选择与最终评估疑似共用同一份数据，指标偏乐观风险。
            - listitem [ref=f78e254]: ACC 口径对不上：按 Fig. 2 终态六列平均得 83.88%，与 Table I 的 89.24% 无法自洽（聚合公式未报告）。
            - listitem [ref=f78e255]: 核心主张无消融：「全程采样 vs 任务末采样」、水库 vs 多样性采样、骨干与特征替代均无对照。
            - listitem [ref=f78e256]: 统计与表述：无多种子方差；正文 11/21 任务与图注 10/20 不一致；lr=0.1 配 Adam 异常高且无调度说明；基线网格不完整（BiC/EWC/DE-KWS 各只覆盖部分档位）。
      - generic [ref=f78e257]: 值得追的方向：① 补端侧闭环——真机测增量训练与推理的延迟 / 内存峰值 / 能耗，明确缓冲区存储形式，把「参数不增」升级为「系统资源不增」；② logit 生命周期管理——定期刷新、置信度加权（弱模型期降权）、滑动窗口一致性，与「保留演化轨迹」主张的兼容性值得专门研究；③ 动态输出头 + 开放词表结合（与音频-文本对比式方法如 CTCAT 类思路融合），走向真正的自定义唤醒词增量；④ few-shot 增量设定（每任务少量样本的自定义词）更贴近产品；⑤ 类平衡约束的水库变体防长尾类被稀释；⑥ 隐私友好记忆（特征 / 不可逆表示入池 + 设备本地增量）；⑦ 引入 KWS 部署级指标（误唤醒 / 漏唤醒 DET）与多种子方差报告。
