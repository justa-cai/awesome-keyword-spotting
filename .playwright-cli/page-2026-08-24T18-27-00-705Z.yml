        - heading "一分钟版本" [level=2] [ref=f78e26]
        - list [ref=f78e27]:
          - listitem [ref=f78e28]: 痛点：端侧 KWS 常开 + 轻量 + 新关键词持续到来（自定义唤醒词 / 新语种 / 新命令词）。few-shot 微调会灾难性遗忘——Finetune 基线 26.80% 对联合训练上界 95.70%，68.9 点的落差就是「微调会遗忘」的量化证据。
          - listitem [ref=f78e29]: 现有路线的账：自蒸馏（RK）要存模型快照——参数翻倍到 129.96K；Fisher 正则（EWC/RWalk）的重要性矩阵同样翻倍；双记忆多模态（DM3）193.44K 是基座三倍；朴素回放（NR）只存「样本+one-hot」，丢掉输出分布里的类间关系——55.30% 效率极低。
          - listitem [ref=f78e30]:
            - text: 方案（DE-KWS）：缓冲区存三元组（样本 + 标签 + logit）——标签回放管「记住是什么」，logit 蒸馏管「保持像什么」（暗知识 = 类间相对置信度）；水库采样全程持续入池（流长度未知也保证等概率），不依赖任务边界；总损失 L
            - subscript [ref=f78e31]: C
            - text: + 0.5·L
            - subscript [ref=f78e32]: R
            - text: + 1.0·L
            - subscript [ref=f78e33]: D
            - text: 。
          - listitem [ref=f78e34]: 结果：GSC 30 词 6 任务，buffer=500 时 ACC 89.24%、BWT −0.034 全场最优，参数保持 64.48K——以 DM3 三分之一的参数反超 1.14 点；buffer=1500 达 91.17%，逼近 Joint 95.70%。中期任务是主场：T2 上 78.84% 对 RK 65.78%、T5 上 91.24% 对 RWalk 54.28%。
          - listitem [ref=f78e35]: 消融：去蒸馏掉 4.40 点、去回放只掉 1.22 点——蒸馏贡献约是回放的 3.6 倍；最优配比「轻回放、重蒸馏」。
          - listitem [ref=f78e36]: 成色缺口：缓冲区真实存储开销未量化（若存波形 1500 条 ≈ 48 MB，远超模型本身）；输出头按 30 类预分配——真实部署新词数未知；「全程采样 vs 任务末采样」的核心主张无消融；无独立测试集（疑似在 20% 验证集上评估）。
