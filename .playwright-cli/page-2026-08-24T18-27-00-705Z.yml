        - paragraph [ref=f78e120]: 图 B·存 logit 的三重收益：内存远低于整套模型参数；音频样本直接复用回放已存的那份；logit 嵌着 one-hot 给不了的暗知识——「这更像 cat 而不太像 off、跟 stop 相似度中等」，这些软结构正是防止类边界漂移的锚。蒸馏用原始 logit 的 MSE（沿用 DER），无需温度超参；「教师」不是单一冻结旧模型，而是散布在训练轨迹各时刻的历史输出快照。
