            - listitem [ref=f100e271]: 两超参无自适应无敏感性：ε / P_aug 固定值——「零调参」的稳健边界未知。
            - listitem [ref=f100e272]: 多分类熵语义偏移（笔记推演）：N 类熵最大点是均匀分布——梯度上升可能把样本推向「哪类都不像」的特征空洞而非真类边界（可部分解释 US8K 10 类上 ATE 单独无效）。
            - listitem [ref=f100e273]: 扰动物理形态未知：x_aug 长什么样（类浊化？类混响？）、是否物理可实现——未可视化未听测。
            - listitem [ref=f100e274]: 增广顶替而非并存：一半训练步见不到干净数据——与「并存各更新一次」的差异未做。
        - generic [ref=f100e275]:
          - heading "实验设计不足" [level=4] [ref=f100e276]
          - list [ref=f100e277]:
            - listitem [ref=f100e278]: 私有数据不可复现：FRR 工作点隐去——只能信相对结论；补偿的公开实验只有三数据集单模型。
            - listitem [ref=f100e279]: 单一架构：只有一个 ~2M CNN——cFSMN / DS-CNN / TC-ResNet / MatchboxNet 等主流小 footprint 架构未验证，无流式约束。
            - listitem [ref=f100e280]: 基线超参未重调：SpecAug 按原论文推荐——部分掉点或许应归因于超参而非方法（对「换 ATE 还是加 ATE」的 advice 有影响）。
            - listitem [ref=f100e281]: 无原始域增强对比：加噪 / RIR / 速度扰动一个没进表——「ATE 与原始域增强能否叠加」这个最实用问题无答案。
            - listitem [ref=f100e282]: 统计功效不足：US8K ±0.04x 方差下 0.744 vs 0.742 完全在噪声内；无显著性检验；ESC-50 / US8K 是环境声，向 KWS 语音外推需谨慎。
            - listitem [ref=f100e283]: 失败变体只有一句话：随机增强 / 交叉熵对抗 / 浅层对抗 / TTS 四类探索全无数字。
      - generic [ref=f100e284]: 值得追的方向：① 超参自适应——ε 按样本置信度或训练进程调度（早期大扰动扩分布、晚期小扰动精修边界）、P_aug 课程化；② 组合矩阵补齐——与原始域增强（加噪 / RIR）叠加、与 FixMatch 式半监督一致性结合（熵扰动天然适合做无标签数据的一致性正则源）；③ 任务面扩展——逐帧熵 / CTC 后验熵覆盖流式 KWS 与端点检测，多标签场景找替代目标；④ 机理解释——可视化扰动形态 + 声学听测；厘清与 VAT（同样对输入一步梯度扰动但目标是平滑性）的关系——很可能同族方法不同实例；⑤ 解开 SpecMix 之谜（软标签下的熵定义、混合比例影响）——论文自留的开放问题；⑥ 公平复测：给 SpecAugment 按数据集重调超参再战一轮，分离「掩码不行」与「超参没调好」——这决定存量生产系统的 advice 是「换」还是「加」。
