        - heading "一分钟版本" [level=2] [ref=f100e26]
        - list [ref=f100e27]:
          - listitem [ref=f100e28]: 工业长尾痛点：Amazon 的唤醒词是「每语言 × 每设备 × 每唤醒词」各训一个模型——标注预算被切成无数小份，没人力为每个小数据集精调增强超参。SpecAugment 恰恰超参敏感：ESC-50 上把 0.566 拉低到 0.533、SCV2 掉到 0.888、Echo-100k 上 FAR 反而恶化——掩码类增强的跨数据集鲁棒性被系统性质疑。
          - listitem [ref=f100e29]:
            - text: 方案（ATE）：x_aug = x + clip(∇
            - subscript [ref=f100e30]: x
            - text: E, −ε, ε)——对 softmax 输出的熵做输入梯度上升。与 FGSM 的两处差异：目标从损失换熵（熵最大点在 p=0.5，扰动方向「朝边界」而非「越边界」，标签仍成立——这不是交叉熵）；sign 换 clip（保留梯度各维相对幅度）。
          - listitem [ref=f100e31]: 零调参设计：ε 锚定训练数据的一个标准差（自动适配各数据集特征分布尺度，换 locale/换词不用重调）、P_aug=0.5 全实验统一——一个超参、一条默认值。
          - listitem [ref=f100e32]: 结果：6 个 Amazon 私有任务上 A+S（先 ATE 后 SpecAugment）全部最优；10k 低资源档相对改进 22.7-47.2%（数据越少增强越值钱）；公开集 ESC-50 上 ATE 单独全场最优（0.581）、SCV2 上 A+S 追平 ME-ADA；每 epoch 21.5s 甚至略低于 SpecAugment 的 22.8s（ME-ADA 要 48.4s）。
          - listitem [ref=f100e33]: 机理（笔记推导）：dE/dp = log((1−p)/p)——模型过度自信（p→0/1）时梯度无穷大 = 强「拉回边界」信号；p≈0.5 时梯度≈0 = 扰动自然小——增广火力自动集中在「自信但可能脆弱」的区域。
          - listitem [ref=f100e34]: 成色缺口：交叉熵对照只有文字无数字；私有数据 + FRR 工作点隐去不可复现；单一 CNN 架构；基线超参未按数据集重调（对掩码类可能不公平）；ε / P_aug 无敏感性消融。
    - generic [ref=f100e35]:
      - paragraph [ref=f100e36]: §01 · 问题陈述
      - heading "简单、鲁棒、高效——三条约束各自的对手" [level=2] [ref=f100e37]
      - generic [ref=f100e39]: 四类现有方案：① 原始波形域手工增强（平移 / 拉伸 / 加噪 / RIR）——与模型无关的固定算子，不管模型错在哪；还需要噪声库等额外资产。② 频谱掩码（SpecAugment / SpecMix）——黄金标准但超参敏感；掩码本质是删信息，ASR 大数据上有正则化收益，小数据或非语音任务可能直接删掉判别性线索（实测三处掉点）。③ 生成式（GAN / TTS）——GAN 使用前要昂贵训练；TTS 实测需要大量额外机制且无改进。④ 已有对抗式（ME-ADA）——同为最大熵思想但「训练初期一次性预生成 + min-max 优化 + 数据集翻倍」，每 epoch 48.4s（ATE 的 2.25 倍）。另：以损失为目标的对抗训练公认换鲁棒性但常掉精度——「对抗」这个工具没错，错的是把损失当目标。四条可检验命题：实现极简（无生成器无 min-max）；计算便宜（与 SpecAugment 同量级）；跨场景鲁棒（9 个数据集不系统性掉点）；可叠加（A+S 超任何单一策略）。
