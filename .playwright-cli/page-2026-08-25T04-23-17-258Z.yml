  - paragraph [ref=f187e119]: 几个架构决策的「为什么」值得逐条拆。第一级为什么用 transducer 而不是封闭集分类器：建模单元是 210 个 CI 音素，关键词约束完全放在解码侧 WFST 搜索图里，模型权重不感知词表——第一级因此可以「故意」做成高召回（论文明说这一阶段试图在关键词上召回更多案例但不可避免产生大量误报），级联系统的召回天花板由第一级决定，宁可放宽。
  - paragraph [ref=f187e120]: 校验证据为什么必须独立于 transducer 输出：强制对齐用的是音素预测器（挂在共享编码器上的独立线性头）的帧级后验，终审用的是另一套自注意力参数——与 transducer 联合网络不共享参数、归纳偏置不同、犯错模式不相关。三路证据都指向「是关键词」才触发，FA 被指数级压缩。
