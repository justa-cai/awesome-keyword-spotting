  - generic [ref=f187e395]: 每一分误报收益都是从召回借来的
  - generic [ref=f187e396]:
    - generic [ref=f187e397]:
      - heading "准确率代价不可忽略" [level=4] [ref=f187e398]
      - paragraph [ref=f187e399]: 干净集 96 → 94.20，约 1.8 个点的真命令被后级误杀。对命令控制，误拒同样伤体验——喊「打开导航」没反应再喊一遍的挫败感，论文没讨论商业代价。
    - generic [ref=f187e400]:
      - heading "超参数全靠经验" [level=4] [ref=f187e401]
      - paragraph [ref=f187e402]: α/β/γ=1.0/0.8/0.5、τ=1.5、υ=5、td=15 全是经验值，无敏感性分析。τ 和 υ 直接决定工作点，从车载换到家居很可能失配。
    - generic [ref=f187e403]:
      - heading "固定回推 vs 波动延迟" [level=4] [ref=f187e404]
      - paragraph [ref=f187e405]: td=15 帧是常数回推，但发射延迟随声学条件变化（嘈杂 0.44s vs 干净 0.29s）；嘈杂集对齐后仍剩 0.23s，没完全解决。
    - generic [ref=f187e406]:
      - heading "S2 缺跨关键词归一" [level=4] [ref=f187e407]
      - paragraph [ref=f187e408]: 同一关键词内 beam 等长可比，但不同命令音素长度不齐，全局 υ=5 对长命令天然偏松——未按命令分别设阈值。
    - generic [ref=f187e409]:
      - heading "命令规模与宣称有差距" [level=4] [ref=f187e410]
      - paragraph [ref=f187e411]: 摘要说「几十上百条」，实测 29 条。29 → 100 条时 FA 从 0.13 涨到多少没报告，「上百条」是外推。
    - generic [ref=f187e412]:
      - heading "负样本域单一 + 无系统级开销" [level=4] [ref=f187e413]
      - paragraph [ref=f187e414]: 84h 负样本全在车载域，家居/电视/多说话人跨域误报未测；推理延迟、RTF、各级触发率与开销分解、内存功耗全没报——端侧论证只落在 3.8M 一个维度。MLD 基线是自行复现（S4），复现细节未给。
  - generic [ref=f187e415]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f187e416]
    - list [ref=f187e417]:
      - listitem [ref=f187e418]: ↳ 级联校验压误报的每一分收益，都是从召回侧借来的——设计级联时先算清楚愿意付多少召回。
      - listitem [ref=f187e419]: ↳ 校验级的价值取决于它与检测级犯错的独立性，而不是它算出的置信度公式多精巧——同一份输出的统计变换不是第二意见。
      - listitem [ref=f187e420]: ↳ 验证类任务（答案长度已知）用长度先验强制截断解码：开销有上界、假设天然可比、规避拖尾——比自由生成便宜得多。
      - listitem [ref=f187e421]: ↳ 密集帧级辅助监督（每一帧都有标签）能给稀疏梯度的主任务（只在发射边界有梯度）加速收敛并正则化——一器两用的前提是头足够轻（一个线性层）。
      - listitem [ref=f187e422]: ↳ 校验器容量有甜点：严格工作点上盲目堆参数反噬（4 块 3.2M 在低误报区不如 1 块 0.9M）。
