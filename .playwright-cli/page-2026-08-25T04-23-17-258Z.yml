  - generic [ref=f187e376]: 级联异源校验在多命令定制 KWS 的完整落地
  - generic [ref=f187e377]:
    - generic [ref=f187e378]:
      - generic [ref=f187e379]: "1"
      - paragraph [ref=f187e380]: 多阶段定制 KWS 框架：流式 tiny transducer 检测、音素预测器强制对齐校验、transformer 解码终审的级联结构，共享编码器多任务一次训练成型——「用级联异源校验压制误报」在多命令场景的完整落地。
    - generic [ref=f187e381]:
      - generic [ref=f187e382]: "2"
      - paragraph [ref=f187e383]: 误报压制有数据背书：车载数据集做到 0.13 次/h，相对基线降 91.15%（表1 S3），准确率代价不超过 2 个点——用不到 2 个点换九成误报削减。
    - generic [ref=f187e384]:
      - generic [ref=f187e385]: "3"
      - paragraph [ref=f187e386]: 零成本定制机制：定制完全在 WFST 搜索图层面（式2 的 LG 复合），新增关键词零采集零重训；音素/汉字两种粒度可按工作点选（第3.5节）。
    - generic [ref=f187e387]:
      - generic [ref=f187e388]: "4"
      - paragraph [ref=f187e389]: 强制对齐一器两用：训练时是正则编码器的辅助任务，推理时是边界修正器 + 一级校验器——把发射延迟痛点（起点误差 0.29/0.44s）修到 0.11/0.23s，并证明准确边界是后级校验性能的前置条件（S1 对 S3）。
    - generic [ref=f187e390]:
      - generic [ref=f187e391]: "5"
      - paragraph [ref=f187e392]: 端侧可行性标定：整体 3.8M + 事件驱动校验；消融标出 transformer 容量甜点（1 块 0.9M），避免无谓堆料。
