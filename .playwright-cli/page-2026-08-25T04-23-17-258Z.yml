    - heading "29 条命令的误报一小时 1.47 次， 这个级联框架把它压到 0.13 次" [level=1] [ref=f187e5]: 29 条命令的误报一小时 1.47 次，这个级联框架把它压到 0.13 次
    - generic [ref=f187e6]:
      - generic [ref=f187e7]: CaTT-KWS · arXiv 2207.01267
      - generic [ref=f187e8]: 西工大 ASLP × 腾讯
      - generic [ref=f187e9]: tiny transducer + 强制对齐 + transformer 终审
      - generic [ref=f187e10]: 3.8M 参数 · 23000h 训练
    - generic [ref=f187e11]: 关键词定制完全放在 WFST 搜索图——加命令零数据采集、零模型重训；误报压掉九成一的代价是准确率掉不到 2 个点。
    - generic [ref=f187e12]:
      - heading "一分钟版本" [level=3] [ref=f187e13]
      - list [ref=f187e14]:
        - listitem [ref=f187e15]: ▸ 场景不是单唤醒词：车载命令控制要同时在线检测几十上百条命令，命令越多解码路径越多，无关语音「碰巧」走进某条命令路径的先验同步放大——误报复控。
        - listitem [ref=f187e16]: ▸ 基线画像：tiny transducer 检测级干净集准确率 96%，但每小时误报 1.47 次；高唤醒率伴随高误报是 transducer 路线的老毛病。
        - listitem [ref=f187e17]: ▸ 前作 MLD 的天花板：后级置信度（滑窗和、编辑距离概率、近似似然）全部从同一份 transducer 输出推导——统计变换不产生新信息，transducer 估偏了它们一起错。
        - listitem [ref=f187e18]: ▸ CaTT 的解法：三级级联共享编码器——transducer 高召回检测 → 音素预测器 Viterbi 强制对齐（修边界 + 第一道闸 S1）→ transformer 终审（第二道闸 S2），三路证据参数独立、犯错模式不相关。
        - listitem [ref=f187e19]: ▸ 定制秘密：关键词知识全部外置在 LG = min(det(L∘G)) 搜索图里，加新命令只改语法图 G 重复合一次，模型权重不动。
        - listitem [ref=f187e20]: ▸ 核心数字：误报 1.47 → 0.13 次/h（相对降 91.15%），准确率干净 96 → 94.20、嘈杂 87.65 → 85.69，两端都不超 2 个点。
        - listitem [ref=f187e21]: ▸ 边界修正是隐藏功臣：流式模型发射延迟让起点偏晚 0.29–0.44s，对齐修到 0.11–0.23s；边界不准时 transformer 单独上（误报 0.23）不如先对齐再终审（0.13）。
        - listitem [ref=f187e22]: ▸ 两个反直觉消融：transformer 容量并非越大越好（1 块 0.9M 是甜点，4 块在低误报区反而更差）；音素 vs 汉字单元存在交叉——低误报区音素稳、高误报区汉字反超。
        - listitem [ref=f187e23]: ▸ 边界：29 条命令就做到 0.13，「上百条」是外推；84h 负样本全在车载域，跨域误报未测；τ=1.5 / υ=5 / td=15 全是经验值，换域可能失配。
        - listitem [ref=f187e24]: ▸ 可迁移判断：级联校验压误报的每一分收益都从召回借来；校验级的价值取决于它与检测级犯错的独立性，而不是置信度公式多精巧。
    - heading "§01 问题：命令词场景的误报复控" [level=2] [ref=f187e25]:
      - generic [ref=f187e26]: §01
      - text: 问题：命令词场景的误报复控
    - generic [ref=f187e27]: 关键词从 1 条扩到 29 条，误中机会放大近 30 倍
    - paragraph [ref=f187e28]: 命令控制与隐私敏感应用需要端侧常驻的本地 KWS，同时在线检测几十上百条命令。机制上不难理解误报为什么会失控：解码搜索空间里的合法路径随命令数增长，任意一段广播、闲聊、驾驶噪声「碰巧」走进某条命令路径的先验同步升高。单唤醒词只有一条目标路径可以误中，二十九条命令把这个机会放大近三十倍。每次误触发的代价是系统在用户没说话时「自作多情」地执行命令——体验破坏是直接的。
    - paragraph [ref=f187e29]: 另一个老痛点是定制成本：固定词表的神经 KWS 把词表烧进输出层，加一条新命令就是一轮数据采集 + 模型重训，产品迭代节奏下不可接受。理想状态是改个配置就能上线。
    - generic [ref=f187e30]:
      - generic [ref=f187e31]:
        - heading "注意力偏置 transducer 路线的两个缺口" [level=4] [ref=f187e32]
        - paragraph [ref=f187e33]: He [12]、Liu [13]、Tian [14] 用注意力偏置或 CTC 联合训练把搜索拉向关键词转写——但基本只考虑单唤醒词场景，多命令同时检测没人探索；且 transducer 方法唤醒率高、误报问题同样突出，命令场景下会被放大。
      - generic [ref=f187e34]:
        - heading "MLD 的单源证据天花板" [level=4] [ref=f187e35]
        - paragraph [ref=f187e36]: 与本文最相关的 MLD [13]：检测级滑窗检出候选，校验级算编辑距离概率和近似似然。批评切中要害——所有置信度从同一份 transducer 输出推导。transducer 对噪声帧音素后验估高了，后续统计量跟着一起错：它们不是独立的第二意见，而是同一输出的不同变换。
    - paragraph [ref=f187e37]: 本文要同时满足四个相互牵制的条件：准确率不能明显恶化；误报压到极低；新增关键词零采集零重训；整体约 3.8M 塞进端侧。压 FA 最直接的办法是加严阈值（伤准确率），加校验模块最直接的办法是堆模型（伤体积延迟）——解法是「级联 + 共享编码器 + 事件驱动计算」：校验模块只在触发时短暂运行，常驻开销只有第一级。
    - heading "§02 方法：三级级联，共享编码器，多任务一次训练" [level=2] [ref=f187e38]:
