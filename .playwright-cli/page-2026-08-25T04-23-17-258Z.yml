    - generic [ref=f187e136]: 人话：S1 是对齐区间上的平均帧级负对数似然——除以 T 做长度归一化，否则长命令似然求和天然偏大被系统性歧视。S2 是 beam 命中序列的裸求和——不是疏忽：beam 被强制在第 M 步截停（M = 候选音素长度），所有假设等长、天然可比。终审实际是两道闸：beam 里没有任何序列与候选匹配直接拒，有匹配才进阈值比较。
  - paragraph [ref=f187e137]: 强制截断的 transformer 终审是第三个精巧设计：这一级做的是「验证」不是「生成」——答案长度是已知先验，判别信息在 M 步内必然全部展开。收益三层：计算有上界（M 通常六到十几步）；beam 假设等长，S2 无需归一化因子；顺带规避自回归解码器在短序列上拖尾输出无意义 token 的风险。
