    - generic [ref=f235e4]: 论文精读 · 可视化版 · 2022 №30
    - heading "30 万设备上的联邦训练： 隐私和性能不矛盾" [level=1] [ref=f235e5]: 30 万设备上的联邦训练：隐私和性能不矛盾
    - generic [ref=f235e6]:
      - generic [ref=f235e7]: Interspeech 2022 · Google
      - generic [ref=f235e8]: 联邦蒸馏 + 置信度过滤 + 联合训练
      - generic [ref=f235e9]: 300K 客户端 · 每天 6,000 轮 FL
      - generic [ref=f235e10]: SVDF 320K · 在线 A/B 数百万设备
    - generic [ref=f235e11]: 「Hey Google」跑在全球超 10 亿设备上——真实用户数据的多样性任何实验室集都比不了，但语音含私人对话/医疗/金融信息。本文是首个在生产环境部署 FL 训练 KWS 的完整方案。
    - generic [ref=f235e12]:
      - heading "一分钟版本" [level=3] [ref=f235e13]
      - list [ref=f235e14]:
        - listitem [ref=f235e15]: ▸ 三个核心问题：标签缺失（设备缓存音频无人工标注——设备只知道「自己检测到了」可能误检、「用户说了没响应」可能漏检）；标签噪声（教师对边缘样本的软标签可能错——越训越差）；域不匹配（缓存大量是「系统接受」的音频、缺被拒绝的——非关键词和极端噪声域缺席）。
        - listitem [ref=f235e16]: ▸ 三件套一一对应：联邦蒸馏管标签缺失——服务器用集中式标注数据训教师，对缓存音频生成软标签（含类别间相似度信息），经安全聚合分发，设备用 KL 散度本地训练。
        - listitem [ref=f235e17]: ▸ 置信度过滤管标签噪声：巧妙利用系统自然产生的用户反馈信号——服务器拒绝（二次验证拒了 → 可能误检）、重试信号（2 秒内重说 → 前一次可能漏检）、说话人 ID 不匹配；任一触发即排除；保守过滤宁丢正确样本也要低假阳性。
        - listitem [ref=f235e18]: ▸ 联合训练管域不匹配：FL 轮（真实用户分布）与集中式轮（公开数据 + 模拟增强，不涉隐私）交替进行（如每 5 轮 FL + 1 轮集中式）——集中式补「明确的非关键词」「极端噪声」「静音」这些设备端不缓存的域。
        - listitem [ref=f235e19]: ▸ 规模：约 300,000 客户端、每客户端中位 175 个样本（约 1.7s）、总量约 5,250 万——每天约 6,000 轮 FL，远超学术 FL 的数百到数千客户端模拟规模。
        - listitem [ref=f235e20]: ▸ 标签准确性验证：117 名专业标注员 × 11,908 样本（每人独立标、3 人多数投票，Kappa > 0.85）——过滤后标签准确率比未过滤高约 15–20 个百分点。
        - listitem [ref=f235e21]: ▸ 性能：离线固定 FPR=0.1% 下 TPR 比纯集中式高约 3–5%（整体相同误检率下检测率相对提升约 5–10%）；在线 A/B（数百万设备数周）误唤醒率相对降约 10–15%、漏检率降约 5–8%、用户满意度显著提升。
        - listitem [ref=f235e22]: ▸ 消融：蒸馏去软标签 → 难例 −3~5%；不过滤 → 假阳性率增加（低质量标签学出错误边界）；去集中式轮 → 非典型噪声 −2~3%。
        - listitem [ref=f235e23]: ▸ 隐私机制：所有用户数据留设备端，仅上传梯度（安全聚合下服务器无法反推个体梯度）；教师软标签加密分发；运行在 DP 框架下。
        - listitem [ref=f235e24]: ▸ 边界：需要大用户基数（新兴助手可能不够）；设备端只支持简单增强；每轮约 1.3MB 通信；Non-IID 收敛慢；DP 预算 ε 未报；缺同规模集中式公平对比。
    - heading "§01 问题：无标签的设备端数据怎么用" [level=2] [ref=f235e25]:
      - generic [ref=f235e26]: §01
      - text: 问题：无标签的设备端数据怎么用
    - generic [ref=f235e27]: 标准 FL 假设设备端有标签——KWS 场景根本不成立
    - paragraph [ref=f235e28]: 联邦学习允许设备端训练、只上传梯度，从根本上保护隐私——但标准 FL 假设设备端数据有标签（图像分类里用户行为可当标签）。KWS 设备端缓存的音频片段没有人工标注：设备只知道「自己检测到了关键词」（可能是误检）或「用户说了唤醒词但没响应」（可能是漏检），无法确定音频的真实类别。此外真实用户数据的价值恰恰在多样性——数百种环境噪声、各年龄段说话人、口袋里/桌上/远处的设备位置——这种多样性是任何实验室录制集都无法比拟的。
    - generic [ref=f235e29]:
      - generic [ref=f235e30]:
        - heading "集中式训练的合规风险" [level=4] [ref=f235e31]
        - paragraph [ref=f235e32]: 语音可能含私人对话、医疗、金融、个人身份信息——GDPR/CCPA 下上传原始音频有严重法律风险；即使匿名化（去设备 ID），原始音频仍可能通过声纹识别关联到特定个人；在 Google 规模下任何隐私事件的影响都是灾难性的。
      - generic [ref=f235e33]:
        - heading "设备端训练的硬限制" [level=4] [ref=f235e34]
        - paragraph [ref=f235e35]: 移动设备计算存储有限——只能做简单增强（SpecAugment），无法执行噪声混合、房间混响模拟这类复杂操作；训练须在数分钟内完成（用户随时在用设备）。
