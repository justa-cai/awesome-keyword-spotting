  - generic [ref=f235e213]: 规模是护城河也是门槛
  - generic [ref=f235e214]:
    - generic [ref=f235e215]:
      - heading "用户规模门槛" [level=4] [ref=f235e216]
      - paragraph [ref=f235e217]: FL 需要足够大的用户基数保证 FedAvg 统计收敛——300K 客户端够用，但新兴语音助手（用户量小）可能无法保证收敛质量：这套方案有大厂专属的门槛。
    - generic [ref=f235e218]:
      - heading "设备端能力与通信" [level=4] [ref=f235e219]
      - paragraph [ref=f235e220]: 只支持 SpecAugment 级别的简单增强——噪声混合/RIR 模拟做不了；每轮上传梯度约 1.3MB（320K×4B），3G/4G 下流量能耗不可忽视；Non-IID（安静办公室手机 vs 嘈杂厨房音箱）收敛慢或次优。
    - generic [ref=f235e221]:
      - heading "隐私-效用权衡无定量" [level=4] [ref=f235e222]
      - paragraph [ref=f235e223]: DP 预算 ε 未报数值、未分析不同隐私级别的性能损失——而 DP 保证强度直接影响法律合规性。
    - generic [ref=f235e224]:
      - heading "对比与成本缺口" [level=4] [ref=f235e225]
      - paragraph [ref=f235e226]: 缺与纯集中式训练在同规模数据上的公平对比（相同数量集中式标注 vs FL 数据）——FL 本身的增益难以量化；FL 总成本（服务器聚合/设备能耗/带宽）未报。
  - generic [ref=f235e227]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f235e228]
    - list [ref=f235e229]:
      - listitem [ref=f235e230]: ↳ 隐私保护和模型性能不矛盾——联邦蒸馏 + 置信度过滤 + 联合训练是隐私合规训练的可复制蓝图，对整个语音行业的合规实践有参考价值。
      - listitem [ref=f235e231]: ↳ 无标签设备端数据的解法是「教师打标」：软标签比硬标签多携带类别相似度结构——蒸馏不只是压缩，更是标签工厂。
      - listitem [ref=f235e232]: ↳ 系统副产品信号（服务器拒绝/用户重试/说话人匹配）是免费的置信度来源——产品系统里自然产生的反馈往往比专门收集的标注更便宜且无隐私代价。
      - listitem [ref=f235e233]: ↳ 数据分布不完整时用不涉隐私的模拟数据补域：FL 与集中式不是二选一——交替训练作用于同一全局参数可兼得真实分布与完整覆盖。
      - listitem [ref=f235e234]: ↳ 保守过滤优于激进保留：宁丢正确样本也要低假阳性——训练数据的标签质量比数量更值得优先保证。
