      - generic [ref=f109e24]:
        - heading "一分钟版本" [level=2] [ref=f109e25]
        - list [ref=f109e26]:
          - listitem [ref=f109e27]: 被冷落的一层：KWS 的方法论演进是一部模型架构史——SOTA 的 TC-ResNet 用的梅尔特征与 1999 年系统一样。单窗（Hann 等）谱估计只能在偏差轴上优化（抑制频谱泄漏），对方差无能为力——每帧加窗周期图的随机涨落与信号本身的随机性同量级；欠训练的小模型没有冗余容量消化高方差特征，加噪场景下决策边界被噪声撑糊。
          - listitem [ref=f109e28]: 方案（multitaper）：对同一帧施加 K 个正交锥各做一次谱估计再加权平均——正交锥的估计近似互不相关，方差压到 1/K 量级且偏差基本不动；与「相邻帧/频点平滑」的本质区别：平滑以牺牲时间/频率分辨率（引入偏差）为代价，多锥两条轴解耦。梅尔域全部随机性来自谱估计器（W 与 M_m 都是确定性算子）——更好的特征严格等价于更好的谱估计器。
          - listitem [ref=f109e29]: 锥族选型：默认答案 DPSS 是为平稳光滑谱设计的，语音谱是尖峰状（谐波 + 共振峰）——DPSS 表现差；改用 Hermite（以刻画瞬时频率变化著称，等权）与 SWCE（正弦窗 + 余弦权重，计算时间与 MSE 双优）。
          - listitem [ref=f109e30]: 结果：2 模型 × 2 数据集 × 17 窗配置 × 5 STFT 参数 × 6 噪声场景共 2040 用例——每个组合都有某个多锥配置超过全部五个单窗基线，+1.1 到 +7.1 pp（最大增益在 TC-ResNet + MSD：0.634→0.708）；推理时间随 K 线性增长（图 2 实测）——「按 K 可预算」取代「历史上嫌贵」。
          - listitem [ref=f109e31]: 两个最重要的边界发现：① modified SWCE 的 K=10 崩盘（锐化版乘常数 α 放大 K 倍对大 K 过敏感——TC-ResNet 上崩到 0.41-0.50，基线以下十几到二十点）；② 特征-架构匹配效应：Hermite 在 TC-ResNet 上是负收益（GSC 全部 K 低于最差基线）但在 Tiny-CNN + MSD 上超过全部基线——「多锥一定更好」不成立。
          - listitem [ref=f109e32]: 小数据放大器：同样配置在 MSD（32.7k 条，GSC 的三成）上的增益普遍大于 GSC（+6~7 对 +1~2 点）——欠训练小数据下，特征携带的低方差先验能替代部分数据量。
    - generic [ref=f109e33]:
      - paragraph [ref=f109e34]: §01 · 问题陈述
      - heading "为什么特征质量对小模型小数据特别值钱" [level=2] [ref=f109e35]
      - generic [ref=f109e37]: 四个层面的缺口：① 单窗谱估计的统计缺陷（核心攻击点）——频谱图每个时频点都是对真实功率谱的一次估计；经典窗降偏差但对方差无能为力；② 自动特征学习不可部署——HMM-DNN 前端性能可超参数化特征，但体积大 / 海量数据 / 多阶段训练，端侧低功耗芯片承载不了——这就是参数化特征至今是「活问题」的原因；③ 数据增强不改特征统计质量——多风格训练与 SpecAugment 都是「接受特征既有缺陷在训练侧补救」，与特征改良正交；④ multitaper 的历史障碍——1982 年就有理论但计算贵（一帧算 K 个谱），现代算力已缓解且说话人检测领域已落地，但从未系统进入 KWS；DPSS 锥族为光滑谱设计、语音尖峰谱上表现差，挡住了直接移植。三个可检验问题：仅动特征层能否普遍提升（不改模型不加增强以隔离变量）；能否降方差不牺牲偏差（不抹平共振峰与辅音瞬态）；开销随 K 如何增长是否端侧可接受。
