            - listitem [ref=f109e196]: modified SWCE 无理论支撑且对 K 敏感：作者自认统计性质可能不成立；K=10 崩盘说明锐化把鲁棒性换了锐度、适用区间窄。
            - listitem [ref=f109e197]: Hermite 负增益缺机制解释：只报现象无分析——削弱「锥族选型」贡献的可迁移性。
            - listitem [ref=f109e198]: 只覆盖梅尔谱一种特征形态：MFCC 的多锥化（引言讨论过）实验未做、无直接对比。
            - listitem [ref=f109e199]: 指标单一：只有准确率与推理时间——误唤醒 / 漏唤醒权衡（DET、特定虚警下召回）未报。
