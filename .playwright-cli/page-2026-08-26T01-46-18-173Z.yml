      - generic [ref=f126e125]: 推理功耗 ≈ 计算能耗 + 内存访问能耗（权重读取 + 中间激活读写） 同参数量：层数 ↑ → 访存次数 ↑ → 功耗 ↑
      - generic [ref=f126e126]: 人话：模型费不费电不只看算多少乘加，还要看「来回搬多少数据」。深而窄的网络像跑很多趟的小货车，浅而宽的像跑一趟的大卡车——货一样多，趟数少的省油。所以端侧模型别急着堆深度，先算算要搬运几次。
