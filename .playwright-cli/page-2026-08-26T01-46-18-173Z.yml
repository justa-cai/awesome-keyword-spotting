    - generic [ref=f126e218]:
      - generic [ref=f126e219]: JUDGEMENT
      - paragraph [ref=f126e220]: ↳ 部署指标必须在部署硬件上量：FLOPs 和参数量是论文友好但工程失真的代理——功耗、延迟、内存峰值只有真机能给出真相；做边缘 AI 评估时「没上真机」本身就是结论的边界条件。
      - paragraph [ref=f126e221]: ↳ 内存访问是被低估的功耗来源：同参数量下深度增加访存趟数——「浅而宽」常常比「深而窄」省电；这与 later depthwise/NAS 的结论互相印证：端侧架构的第一性原理是数据搬运最小化，不是表达力最大化。
      - paragraph [ref=f126e222]: ↳ 帕累托前沿把「多省算力」变成可谈判的空间：甜点之后每瓦买到的精度骤减——产品定预算时对着前沿选点，比追逐榜单 SOTA 更接近工程最优。
