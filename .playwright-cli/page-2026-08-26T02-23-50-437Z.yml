    - generic [ref=f136e197]:
      - generic [ref=f136e198]: JUDGEMENT
      - paragraph [ref=f136e199]: ↳ 训练目标要对齐评估目标：帧级 CE 是话语级检测的代理指标——代理失真时代价巨大（67.6% 的相对差距）；设计损失的第一步永远是问「部署时到底按什么判对错」。
      - paragraph [ref=f136e200]: ↳ 聚合算子编码任务假设：max 编码「至少一帧能认出」、mean 编码「平均都像」——选聚合就是选假设；max 的代价（异常帧敏感）正是它假设的边界，改用 top-k/注意力是在放宽这个假设。
      - paragraph [ref=f136e201]: ↳ 最好的改进往往不加参数：一个 max 操作、零新参数、推理近零开销——训练目标层面的创新杠杆比架构创新便宜得多；先穷尽损失设计再动架构。
