        - heading "一分钟版本" [level=2] [ref=f17e25]
        - list [ref=f17e26]:
          - listitem [ref=f17e27]: 最容易被忽视但最致命的痛点：FS-KWS 方法在产品可用的低误收工作点上精度不够——唤醒场景对误唤醒极敏感，有意义的工作点是 1% FAR，而领先方法（Rusci IEEE Micro 2023）在 GSC 10-shot、1% FAR 下准确率只有 33.6%，三分之二判错。
          - listitem [ref=f17e28]: 方案三级流水线：冻结的 Wav2Vec 2.0（第 16 层）→ 注意力编码器降维（49×1024 → 64 维）+ Sub-center ArcFace 训练教师 → MSE 嵌入蒸馏 + λ·任务损失训练端侧学生 ResNet15。
          - listitem [ref=f17e29]: 资源对账：教师 218M 参数 / 63.3G MAC，学生 480k / 235M——差三个数量级，教师只在训练期存在，端侧部署形态与基线完全相同（MFCC 输入 + 原型注册 + 余弦阈值拒识）。
          - listitem [ref=f17e30]: 结果：GSC 10-shot@1%FAR 从 33.6% → 76.9%（KD+SCAF，+43.3 pp）；学生逼近教师上限（76.9 vs 82.2）。跨域的关键发现：蒸馏是主收益，KD+Triplet 跨域反而有害，KD+SCAF 全场稳健。
          - listitem [ref=f17e31]: SCAF 首次用于音频判别 FS-KWS：角度间隔拉开类间、K=3 子中心容纳类内发音多样性——但脱离 SSL 教师单独用 SCAF 并不灵（弱骨架救不了）。
