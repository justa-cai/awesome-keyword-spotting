          - list [ref=f17e224]:
            - listitem [ref=f17e225]: 教师绑定单一架构与层：只用 Wav2Vec 2.0 第 16 层，层选择依据外部文献而非自证；HuBERT / WavLM、其他层位与层组合均未消融（作者自述为未来工作）。
            - listitem [ref=f17e226]: 嵌入维度 64 无敏感性分析：32/128/256 会怎样、64 的选择依据均未给。
            - listitem [ref=f17e227]: 无真实部署测量：延迟、内存、功耗未实测——235M MAC 是纸面数字，未落到具体 MCU/DSP。
            - listitem [ref=f17e228]: 评估停留在 1 秒切段：无连续音频流的流式检测、无每小时误唤醒数、无关键词在句中时的检出能力。
            - listitem [ref=f17e229]: 超参经验化：λ 两档差两个数量级无解释准则；m/s/K/epoch 均无敏感性。
            - listitem [ref=f17e230]: 教师训练成本未报：550 万样本过 Wav2Vec2 提特征 + DR 训练的墙钟时间——复现团队的关键成本项缺失。
