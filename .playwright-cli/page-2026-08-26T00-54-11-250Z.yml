    - generic [ref=f106e246]:
      - generic [ref=f106e247]: JUDGEMENT
      - paragraph [ref=f106e248]: ↳ 训练-解码一致性是流式系统的设计公理：任何「训练时一种几何、部署时另一种几何」的方案都在为不一致付税——窗口超参、延迟不确定、性能折损都是这笔税的账单；从第一天就让两边一致，比事后调窗口便宜。
      - paragraph [ref=f106e249]: ↳ 帧级监督是把大模型知识「外包」给小模型：3000 小时 TDNN-LSTM 的对齐能力变成逐帧标签，小 GRU 直接站在它的肩膀上——标注质量决定上限，−1 屏蔽是对标注不确定性的诚实处理。
      - paragraph [ref=f106e250]: ↳ 小任务偏好「宽而浅」+「简门控」：KWS 的时序建模不需要 LSTM 三重门的抽象深度——单层宽 GRU 又准又小；架构复杂度要匹配任务复杂度，超额配置在小数据上反而是负担。
