    - heading "5 判断：能带走的三句话" [level=2] [ref=f99e249]:
      - generic [ref=f99e250]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f99e251]:
      - generic [ref=f99e252]: JUDGEMENT
      - paragraph [ref=f99e253]: ↳ 弱算力平台上压缩的杠杆更大：同样的剪枝在 GPU 上只是省一点电，在 JS 解释执行上是延迟的三分之二——压缩技术的价值与执行环境的「贫富程度」成正比，选压缩手段前先看目标平台的算力税率。
      - paragraph [ref=f99e254]: ↳ BN γ 是免费的稀疏化抓手：不改变训练流程、不加辅助损失网络、剪枝标准现成——「用已有参数当重要性代理」是结构化压缩最省工程量的套路。
      - paragraph [ref=f99e255]: ↳ 平台可行性研究有自己的价值序列：先证明 possible（本文），再证明 easy（TF.js），最后证明 fast（WebGPU）——三个阶段回答不同问题，不要用第三阶段的标准否定第一阶段的贡献。
