        - heading "一分钟版本" [level=2] [ref=f47e25]
        - list [ref=f47e26]:
          - listitem [ref=f47e27]: 被轻描淡写的痛点：MCU 上推理期峰值 SRAM 才是首要瓶颈，不是参数量——精度 91.0%（最高）的模型只因激活池超限就在 STM32F401 上直接 OOM：「本来正确的模型在实践中失败」。
          - listitem [ref=f47e28]: 范式错位：改进 KWS 的路线（手工设计 / NAS / 压缩）几乎都单目标——要么硬编码约束只优化精度（拿不到权衡前沿），要么加权合成标量（拍脑袋权重）。MOBO 天然适配，但对初始化极敏感——在评估预算极小的 TinyML 场景被急剧放大。
          - listitem [ref=f47e29]: 方案 OASI：用 MOSA 多链短程退火生成帕累托偏置的初始档案（双目标独立温度 × 乘积式接受准则；被拒绝的评估也全部进档案——为 GP 提供被支配区域的监督）→ maximin 规则选多样性子集 D₀ 条件化 GP → 之后照常 GP-EHVI 循环。
          - listitem [ref=f47e30]: 核心视角转换：LHS/Sobol 决定「初始点在哪里」，OASI 决定「初始 GP 长什么样」。资源三分离：SRAM 作优化期硬约束、Flash 作目标、延迟留给硬件在环事后验证（优化过程硬件无关、可跨平台移植）。
          - listitem [ref=f47e31]: 结果：GD=0（解完全落在参考前沿）+ J=0.0040（次优方法的三分之一）+ 90.1% 精度；搜索期开销与随机初始化几乎相同（164.0 vs 164.2 s/iter）。MACC 幻觉破除：两个同 6.8M MACC 的模型实测延迟差近 60%。
