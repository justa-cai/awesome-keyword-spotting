            - listitem [ref=f47e242]: 单一数据集单一骨干：GSC v2 十类 + DS-CNN 一种骨干——TC-ResNet/BC-ResNet/FSMN 或更大词表未验证；88–91% 精度区间窄、区分度有限。
            - listitem [ref=f47e243]: 参考前沿构造未说明：GD=0 的解释力完全取决于此；HV 参考点未报告——两个核心指标无法独立复现。
            - listitem [ref=f47e244]: 跨表口径不一致：表 1 的 0.103 MB vs 表 3 同精度模型的 73.2 KB Flash 对不上（换算关系未解释，读者只能猜）。
            - listitem [ref=f47e245]: 关键消融缺位：maximin vs 直接取帕累托子集、全档案 vs 只用接受解、n 的扫描——能检验设计「为什么」的消融都没做。
