        - heading "下一步方向（论文展望 + 笔者补充）" [level=3] [ref=f47e247]
        - paragraph [ref=f47e248]: ① 延迟入优化而不靠每步 HIL：用已测硬件数据训延迟/周期预测代理（架构特征+内存足迹为输入的代价模型）做三/四目标 MOBO；GP 分类器学 SRAM 可行域 → feasibility-aware EHVI，部署感知从事后筛前移到优化期内生。 ② 压缩初始化开销：低保真评估（少 epoch / 超网权重共享 / 学习曲线外推提前终止）替代链上完整训练——把 +29% 压回空间填充方法水平。 ③ OASI 超参自适应 + 元学习：链数/温度调度/n 按预算与维度自适应；历史任务的种子元学习迁移（与 MI-SMBO 结合）。 ④ 扩实证基础：多数据集（GSC 全集 35 类/多语言）、多骨干、多板卡交叉验证 + 种子数/置信区间/检验功效——把「稳定性优势」升级为统计结论。 ⑤ DI 应用化：作为部署自动选型准则（给定板卡选 DI 最大的前沿点），并验证 DI 与实际部署成功率的相关性。
