      - heading "轮椅的「大脑」不该在别人的手机里—— 本地唤醒词常驻、云端识别只开一小扇窗" [level=1] [ref=f150e13]: 轮椅的「大脑」不该在别人的手机里——本地唤醒词常驻、云端识别只开一小扇窗
      - paragraph [ref=f150e14]: "Wake Word and Speech Recognition Application on Edge Device: Improving the Electric Wheelchair"
      - paragraph [ref=f150e15]: 作者：Low Jian He（INTI 国际大学槟城 · 现萨里大学）；Solahuddin Yusuf Fadhlullah（通讯）、Khadijah Kamarulazizi；Samihah Abdullah、Shabinar Abdul Hamid（UiTM 槟城）
      - paragraph [ref=f150e16]: 发表：Journal of Electrical and Electronic Systems Research Vol.24（UiTM Press，2024-04）· Pi 4 + 自造唤醒词「Hey SellTron」
      - generic [ref=f150e17]:
        - generic [ref=f150e18]: 应用案例研究（非算法创新）
        - generic [ref=f150e19]: 两级门控架构
        - generic [ref=f150e20]: Pi 4 边缘部署
        - generic [ref=f150e21]: 自造唤醒词数据工程
        - generic [ref=f150e22]: 11 条命令含 6 条位置命令
        - generic [ref=f150e23]: 命令依从性 100%
      - generic [ref=f150e24]:
        - heading "一分钟版本" [level=2] [ref=f150e25]
        - list [ref=f150e26]:
          - listitem [ref=f150e27]: 为什么「解放双手」是刚性需求：70–100% 手动轮椅使用者会出现上肢损伤（手腕 40–66%、肩膀 30–60%、腕管综合征 27–90%）；摇杆仍有机械磨损且对震颤 / 抓握障碍 / 高位截瘫用户不可及。语音是自然路径——但常开麦克风 = 连续计算 + 隐私暴露（41% 用户担忧），轮椅是贴身设备，矛盾比智能音箱更尖锐。
          - listitem [ref=f150e28]: 核心架构判断（全文最重要的一句）：语音识别只应在指定唤醒词被唤起之后才激活——避免背景语音或偶然对话中的词句意外触发轮椅移动。两级门控：轻量本地 LSTM 常驻监听「Hey SellTron」→ 唤醒后才初始化 Google Speech API 做命令识别——连续计算压到最低、云端窗口压到最小。
          - listitem [ref=f150e29]: 两代已有方案都不合格：Arduino + 专用语音模块（HM2007 等）= 小词表模板匹配硬件、需近讲、对说话人敏感、完全没有唤醒词门控（环境里说出命令词就直接动车——安全性致命）；手机 + 云 API = 「轮椅的大脑在别人的手机里」——行动障碍用户操作手机本身就是负担、依赖网络、隐私放大。作者声称这是首个把独立唤醒词系统集成到边缘轮椅原型的工作。
          - listitem [ref=f150e30]: 自造唤醒词的数据工程（可直接照抄的路线图）：正样本 = 自录 500 条（Pi 自己的麦克风直录、避免信道染色）+ 多 TTS 网站多口音 + 组外真人；负样本 30,000 = Common Voice 15k + 环境音 15k（静默 + 公园 + 咖啡馆各 30 分钟切 2 秒片）。两处工程直觉：2 秒切片与运行时录音流严格对齐（训练=推理分布）；负样本专门放环境音让模型训练时就见过非语音噪声。SpecAugment 三件套是几百条原始录音能撑起来的关键放大器。
          - listitem [ref=f150e31]: 混合架构各取所长（数据背书）：自训唤醒词在公园噪声 ≤55dB 保持 80%+ 且优于 Google Assistant（专属训练的红利）；命令识别最抗造（≤65dB 保持 80%+，Google 海量训练数据）——但咖啡馆会话噪声下唤醒词只能撑到 ~50dB（会话噪声与唤醒词同属人声更难分离）。
          - listitem [ref=f150e32]: 最有信息量的失败数据：10 人多说话人测试精度从 20% 摆到 100%——正样本主力只有 500 条自录音，模型高度个性化缺乏说话人泛化（把猜测变成有数据的事实）；唯一命令短板 turn left 89%（被误识成 turn light，疑受智能家居语料影响），识别后执行 0 失手（依从性 100%）——全部风险集中在声学识别一侧。
          - listitem [ref=f150e33]: 安全设计：无效命令不重试不猜测，直接退出回监听——任何误识别的最坏后果是「回到安全的静止待机态」；位置命令（「从卧室到厨房」）是预编程开环宏而非导航（论文自认真导航需 LiDAR 建图）。延迟：唤醒平均 0.73s（0.33–1.10）、命令约 1.5s。
          - listitem [ref=f150e34]: 边界（案例研究的诚实读法）：LSTM 层数 / 隐维 / 学习率 / 模型大小 / 内存 / 功耗全未报告（难复现）；无误唤醒率与漏唤醒率的分离统计（与安全主张形成张力——唤醒词门控的存在意义恰恰是防误触发）；位置命令无传感器反馈、断网时命令不可用、mini 原型不具商业代表性；无严格消融（频谱增强 / 环境音负样本 / TTS 各贡献多少未知）。
    - generic [ref=f150e35]:
      - paragraph [ref=f150e36]: §01 · 问题陈述
      - heading "辅具工程问题，不是算法创新问题" [level=2] [ref=f150e37]
      - generic [ref=f150e39]: 痛点链条：上肢健康（流行病学数字触目惊心）→ 电动轮椅解决体力但摇杆仍需运动技能且有机械磨损 → 语音控制自然但「常开」与隐私 / 算力矛盾（微软 2019：41% 用户担忧被动监听）→ 两级门控解法（本地唤醒词常驻 + 按需激活识别）。工程伦理论证：用户的物理安全应足以抵消剩余隐私顾虑——轮椅失控撞墙的代价远大于一小段命令音频外泄。平台约束：Pi 4 适合边缘深度学习但跑不动全规模 transformer——必须轻量（LSTM）。
      - generic [ref=f150e40]: 四个子挑战：算力（常驻模型必须轻到 Pi 4 能持续跑——答 LSTM）；数据（自造唤醒词无任何现成数据集，从零构建正负样本）；安全（唤醒词门控 + 无效命令失败路径——任何误识别不直接变成轮子转动）；验证（距离 / 噪声 / 多说话人 / 多命令 / 延迟五个维度把「可用性」量化）。命令空间从文献的方向命令扩展到位置命令——一句「去厨房」比连续喊方向高效得多（概念价值，实现是开环宏）。
