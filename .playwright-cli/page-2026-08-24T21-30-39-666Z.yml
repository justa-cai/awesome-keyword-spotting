      - generic [ref=f150e86]: 为什么混合架构而不是统一模型：唤醒词是极小类别二分类（是不是「Hey SellTron」），小模型就能胜任且必须本地常驻；轮椅命令虽是受限词表但论文想兼容开放式说法，交给被海量数据训练过的 Google 引擎最省事——代价是命令阶段引入云依赖（本文没解决它，只把它限制在唤醒后的短窗口内）。Fig 14 的结果印证了各取所长：命令识别在噪声下反而比自训唤醒词更抗造。本地命令层只做确定性字符串等值匹配——逻辑极简、可审计、不会误动作。
