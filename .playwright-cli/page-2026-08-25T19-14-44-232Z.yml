  - generic [ref=f340e13]:
    - generic [ref=f340e14]: "01"
    - heading "问题：误触发的元凶是特定类型的负样本" [level=2] [ref=f340e15]
    - generic [ref=f340e16]:
      - generic [ref=f340e17]: TL;DR
      - list [ref=f340e18]:
        - listitem [ref=f340e19]: ◆ 量产 KWS 的短板不在「认不出词」，在「错把别的话当词」——误触发由两类负样本引起：声学相似（「Okay Google」vs「Okay goggles」）和部分匹配（「Hey, how about Siri?」包含唤醒词音素片段）。
        - listitem [ref=f340e20]: ◆ 传统训练从通用语料随机采负样本：与关键词差异大、训练信号弱；真正危险的难负样本占比极低——三宗罪：缺乏针对性、难负不足、覆盖不全。
        - listitem [ref=f340e21]: ◆ 两条互补的挖掘路线：ASR 混淆分析（ASR 在哪摔跤，KWS 就可能在哪摔跤）+ 嵌入最近邻（频谱上贴着关键词长的负样本）——并集组合覆盖最全。
        - listitem [ref=f340e22]: ◆ 难负样本占比 30–50% 是甜点：太少判别信号不够，太多把普通负样本挤掉；检测率全程保持。
