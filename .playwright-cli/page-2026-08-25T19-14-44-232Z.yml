      - generic [ref=f340e120]: · ASR 发现的：音素序列相似的词对
      - generic [ref=f340e121]: · 嵌入发现的：频谱相似但转写不相似的
      - generic [ref=f340e122]: （口音/噪声导致的声学近邻）
      - generic [ref=f340e123]: · 两者并集 —— 覆盖两类混淆模式
      - generic [ref=f340e124]: 左：ASR 的识别错误是现成的「混淆地图」——它在哪摔跤，KWS 就可能在那摔跤。右：嵌入空间里贴着关键词的负样本是声学近邻——两个视角（音素/频谱）各抓一类混淆，并集最全
    - generic [ref=f340e125]: 图 2 · 机制解剖：ASR 混淆矩阵流水线 · 嵌入最近邻流水线 · 两者的互补分工
    - generic [ref=f340e126]:
      - generic [ref=f340e127]: "ASR 路: 全量音频 → ASR 解码 → 音素混淆矩阵 C[i][j] → 高频混淆对 → 难负样本 嵌入路: 全量音频 → d-vector 嵌入 → ANN(关键词嵌入, top-N) → 难负样本 组合: HardNeg = ASR路 ∪ 嵌入路 ← 语义混淆 ∪ 声学混淆"
      - generic [ref=f340e128]: 人话：一条路问「转写像不像」（ASR 把 goggles 听成 google 的地方），一条路问「声音像不像」（频谱上贴着 google 长的音频）——两条路各抓一类混淆，取并集就是最全的「坑位地图」。
    - paragraph [ref=f340e129]: 互补性是组合有效的原因：ASR 擅长发现音素序列层面的混淆（词对相似），嵌入擅长发现频谱层面的近邻（口音/噪声导致的声学相似但转写不相似）——实测中嵌入方法捞到了 ASR 遗漏的样本，并集达到最低误触发率。
