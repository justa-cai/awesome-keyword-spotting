      - paragraph [ref=f161e767]: 语音处理领域里，关键词检测（Keyword Spotting，KWS，即唤醒词检测）研究如何从连续语音流中检出预设关键词。本仓库是一个精选的语音关键词检测论文清单，覆盖 2018–2026 年经典与前沿工作，并为其中 305 篇配套了逐篇中文深读笔记（问题 → 方法 → 实验 → 贡献 → 局限，全部数字可回溯论文原表）。
