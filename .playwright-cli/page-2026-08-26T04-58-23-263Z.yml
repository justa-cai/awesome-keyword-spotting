      - heading [level=2] [ref=f161e2058]:
        - link "软件" [ref=f161e2059] [cursor=pointer]:
          - /url: "#/?id=%e8%bd%af%e4%bb%b6"
      - list [ref=f161e2060]:
        - listitem [ref=f161e2061]:
          - paragraph [ref=f161e2062]:
            - link "WeKws (Production First and Production Ready End-to-End Keyword Spotting Toolkit)" [ref=f161e2063] [cursor=pointer]:
              - /url: https://github.com/wenet-e2e/wekws
          - paragraph [ref=f161e2064]: Small footprint keyword spotting (KWS), or specifically wake-up word (WuW) detection is a typical and important module in internet of things (IoT) devices. It provides a way for users to control IoT devices with a hands-free experience. A WuW detection system usually runs locally and persistently on IoT devices, which requires low consumptional power, less model parameters, low computational comlexity and to detect predefined keyword in a streaming way, i.e., requires low latency.
        - listitem [ref=f161e2065]:
          - paragraph [ref=f161e2066]:
            - link "Porcupine" [ref=f161e2067] [cursor=pointer]:
              - /url: https://github.com/Picovoice/porcupine
          - paragraph [ref=f161e2068]: Porcupine is a highly-accurate and lightweight wake word engine. It enables building always-listening voice-enabled applications.
        - listitem [ref=f161e2069]:
          - paragraph [ref=f161e2070]:
            - link "Sonus" [ref=f161e2071] [cursor=pointer]:
              - /url: https://github.com/evancohen/sonus
          - paragraph [ref=f161e2072]: Sonus lets you quickly and easily add a VUI (Voice User Interface) to any hardware or software project. Just like Alexa, Google Assistant, and Siri, Sonus is always listening offline for a customizable hotword. Once that hotword is detected your speech is streamed to the cloud recognition service of your choice - then you get the results in realtime.
        - listitem [ref=f161e2073]:
          - paragraph [ref=f161e2074]:
            - link "Picovoice" [ref=f161e2075] [cursor=pointer]:
              - /url: https://github.com/Picovoice/picovoice
          - paragraph [ref=f161e2076]: Picovoice is the end-to-end platform for building voice products on your terms. Unlike Alexa and Google services, Picovoice runs entirely on-device while being more accurate.
        - listitem [ref=f161e2077]:
          - paragraph [ref=f161e2078]:
            - link "Mycroft Precise" [ref=f161e2079] [cursor=pointer]:
              - /url: https://github.com/MycroftAI/mycroft-precise
          - paragraph [ref=f161e2080]: A lightweight, simple-to-use, RNN wake word listener.
          - paragraph [ref=f161e2081]: Precise is a wake word listener. The software monitors an audio stream ( usually a microphone ) and when it recognizes a specific phrase it triggers an event. For example, at Mycroft AI the team has trained Precise to recognize the phrase "Hey, Mycroft". When the software recognizes this phrase it puts the rest of Mycroft's software into command mode and waits for a command from the person using the device. Mycroft Precise is fully open source and can be trined to recognize anything from a name to a cough.
      - heading [level=2] [ref=f161e2082]:
        - link "数据集" [ref=f161e2083] [cursor=pointer]:
          - /url: "#/?id=%e6%95%b0%e6%8d%ae%e9%9b%86"
      - list [ref=f161e2084]:
        - listitem [ref=f161e2085]:
          - paragraph [ref=f161e2086]: Speech Commands
          - list [ref=f161e2087]:
            - listitem [ref=f161e2088]:
              - paragraph [ref=f161e2089]:
                - text: "Homepage:"
                - 'link "Speech Commands: A Dataset for Limited-Vocabulary Speech Recognition" [ref=f161e2090] [cursor=pointer]':
                  - /url: https://arxiv.org/abs/1804.03209
            - listitem [ref=f161e2091]:
              - paragraph [ref=f161e2092]: "Description: An audio dataset of spoken words designed to help train and evaluate keyword spotting systems. Its primary goal is to provide a way to build and test small models that detect when a single word is spoken, from a set of ten target words, with as few false positives as possible from background noise or unrelated speech. Note that in the train and validation set, the label \"unknown\" is much more prevalent than the labels of the target words or background noise. One difference from the release version is the handling of silent segments. While in the test set the silence segments are regular 1 second files, in the training they are provided as long segments under \"background_noise\" folder. Here we split these background noise into 1 second clips, and also keep one of the files for the validation set."
            - listitem [ref=f161e2093]:
              - paragraph [ref=f161e2094]: "Download:"
              - list [ref=f161e2095]:
                - listitem [ref=f161e2096]:
                  - paragraph [ref=f161e2097]:
                    - text: "training data:"
                    - link "http://download.tensorflow.org/data/speech_commands_v0.02.tar.gz" [ref=f161e2098] [cursor=pointer]:
                      - /url: http://download.tensorflow.org/data/speech_commands_v0.02.tar.gz
                - listitem [ref=f161e2099]:
                  - paragraph [ref=f161e2100]:
                    - text: "test data:"
                    - link "http://download.tensorflow.org/data/speech_commands_test_set_v0.02.tar.gz" [ref=f161e2101] [cursor=pointer]:
                      - /url: http://download.tensorflow.org/data/speech_commands_test_set_v0.02.tar.gz
        - listitem [ref=f161e2102]:
          - paragraph [ref=f161e2103]: Mobvoi Hotwords
          - list [ref=f161e2104]:
            - listitem [ref=f161e2105]:
              - paragraph [ref=f161e2106]:
                - text: "Homepage:"
                - link "Region Proposal Network Based Small-Footprint Keyword Spotting" [ref=f161e2107] [cursor=pointer]:
                  - /url: http://openslr.org/87/
            - listitem [ref=f161e2108]:
              - paragraph [ref=f161e2109]: "Description:"
              - list [ref=f161e2110]:
                - listitem [ref=f161e2111]: The MobvoiHotwords is a corpus of wake-up words collected from a commercial smart speaker of Mobvoi. It consists of keyword and non-keyword utterances.
                - listitem [ref=f161e2112]: "For keyword data, keyword utterances contain either 'Hi xiaowen' or 'Nihao Wenwen' are collected. For each keyword, there are about 36k utterances. All keyword data is collected from 788 subjects, ages 3-65, with different distances from the smart speaker (1, 3 and 5 meters). Different noises (typical home environment noises like music and TV) with varying sound pressure levels are played in the background during the collection. The keyword data is identical to the keyword data used in the paper below:"
            - listitem [ref=f161e2113]:
              - paragraph [ref=f161e2114]:
                - text: "Download:"
                - link "MobvoiHotwords" [ref=f161e2115] [cursor=pointer]:
                  - /url: http://openslr.org/87/
        - listitem [ref=f161e2116]:
          - paragraph [ref=f161e2117]: HI-MIA
          - list [ref=f161e2118]:
            - listitem [ref=f161e2119]:
              - paragraph [ref=f161e2120]:
                - text: "Homepage:"
                - link "A far-field text-dependent speaker verification database for AISHELL Speaker Verification Challenge 2019" [ref=f161e2121] [cursor=pointer]:
                  - /url: http://www.aishelltech.com/wakeup_data
            - listitem [ref=f161e2122]:
              - paragraph [ref=f161e2123]: "Description:"
              - list [ref=f161e2124]:
                - listitem [ref=f161e2125]: The data is used in AISHELL Speaker Verification Challenge 2019. It is extracted from a larger database called AISHELL-WakeUp-1.
                - listitem [ref=f161e2126]: The contents are wake-up words "Hi, Mia" in both Chinese and English. The data is collected in real home environment using microphone arrays and Hi-Fi microphone. The collection process and development of a baseline system was described in the paper below. The data used in the challenge is extracted from 1 Hi-Fi microphone and 16-channel circular microphone arrays for 1/3/5 meters. And the contents are the Chinese wake-up words. The whole set is divided into train (254 people), dev (42 people) and test (44 people) subsets. Test subset is provided with paired target/non-target answer to evaluate verification results.
            - listitem [ref=f161e2127]:
              - paragraph [ref=f161e2128]:
                - text: "Download:"
                - link "HI-MIA" [ref=f161e2129] [cursor=pointer]:
                  - /url: http://openslr.org/85/
      - heading [level=2] [ref=f161e2130]:
        - link "竞赛" [ref=f161e2131] [cursor=pointer]:
          - /url: "#/?id=%e7%ab%9e%e8%b5%9b"
      - list [ref=f161e2132]:
        - listitem [ref=f161e2133]:
          - paragraph [ref=f161e2134]:
            - link "AutoSpeech 2020 Challenge" [ref=f161e2135] [cursor=pointer]:
              - /url: https://www.4paradigm.com/content/details_85_1870.html
          - paragraph [ref=f161e2136]: In this challenge, we further propose the Automated Speech (AutoSpeech) competition which aims at proposing automated solutions for speech-related tasks. This challenge is restricted to multi-label classification problems, which come from different speech classification domains. The provided solutions are expected to discover various kinds of paralinguistic speech attribute information, such as speaker, language, emotion, etc, when only raw data (speech features) and meta information are provided. There are two kinds of datasets, which correspond to public and private leaderboard respectively. Five public datasets (without labels in the testing part) are provided to the participants for developing AutoSpeech solutions. Afterward, solutions will be evaluated on private datasets without human intervention. The results of these private datasets determine the final ranking.
          - paragraph [ref=f161e2137]:
            - text: "Officical Code:"
            - link "AutoSpeech" [ref=f161e2138] [cursor=pointer]:
              - /url: https://github.com/VITA-Group/AutoSpeech
      - list [ref=f161e2139]:
        - listitem [ref=f161e2140]:
          - paragraph [ref=f161e2141]:
            - link "The 2020 Personalized Voice Trigger Challenge (PVTC2020)" [ref=f161e2142] [cursor=pointer]:
              - /url: https://www.pvtc2020.org/
          - paragraph [ref=f161e2143]: Recently, personalized voice trigger or wake-up word detection is gaining popularity among speech researchers and developers. Conventionally, the wake-up word detection and speaker verification are carried out separately in pipeline, where a wake-up word detection system is used to generate successful trigger followed by a speaker verification system used to perform identity authentication. In such case, the wake-up word detection system and the speaker verification system are optimized separately, not through an overall joint optimization with a unified goal. As a consequence, their respective network parameters and extracted information are not effectively shared and jointly utilized. Generally the wake-up word detection system needs to run all the time，but the network of speaker verification is relatively large and may not meet the requirements of computing resources on embedding devices. The joint learning or multi-task learning network might be either very light at a small scale as a single always on system, or with a much larger scale at the second stage after a successful wake-up by the first stage voice trigger.
          - paragraph [ref=f161e2144]:
            - text: "Paper:"
            - link "The DKU System Description for The Interspeech 2021 Auto-KWS Challenge" [ref=f161e2145] [cursor=pointer]:
