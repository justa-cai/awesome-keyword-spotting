- generic [ref=f297e2]:
  - generic [ref=f297e3]: 论文精读 · 可视化版 · 2021 №19
  - heading "一个模型干三份活： 自监督打底，KWS+VAD+SV 一次前向全出" [level=1] [ref=f297e4]: 一个模型干三份活：自监督打底，KWS+VAD+SV 一次前向全出
  - generic [ref=f297e5]:
    - generic [ref=f297e6]: SSL Multi-Task Voice Framework · 加州大学 + 高通
    - generic [ref=f297e7]: arXiv 2110.01077 · CPC 预训练 + 三任务头
    - generic [ref=f297e8]: 共享编码器 + GradNorm 梯度平衡
    - generic [ref=f297e9]: 总参数 40–50%（vs 三独立模型）· 推理 2–3×
  - generic [ref=f297e10]: 一句话：语音助手要同时跑 KWS、VAD、SV 三个模型——内存翻三倍、同样的话被编码三遍、开发维护三份。本文先在未标注语音上做 CPC 自监督预训练（预测未来 k 步的表示，零标注换通用结构），再用「共享编码器 + 三个任务头」的多任务微调统一三个任务：总参数只有三个独立模型的 40–50%，一次前向同时输出三个预测（推理效率 2–3×），且各任务性能不降反升——SSL 预训练对 KWS +1–3%、对 VAD +2–5%。
  - generic [ref=f297e11]:
    - generic [ref=f297e12]: TL;DR
    - listitem [ref=f297e13]: ◈ 三独立模型的四宗罪：内存开销大（三份骨干存三遍）、计算冗余（同一段语音被编码三次）、开发维护复杂（三套版本与回归）、数据利用不充分（各任务只能用自己的标注——与 2021 №18 的洞察同源）。
    - listitem [ref=f297e14]: "◈ 两阶段框架：① CPC 自监督预训练——给定当前编码 z_t 预测未来 k 步的 z_{t+k}，InfoNCE 对比损失（真未来 vs 随机负样本）；② 多任务微调——共享预训练编码器 + KWS/VAD/SV 三个任务头联合训练。"
    - listitem [ref=f297e15]: ◈ 为什么 CPC 能白学：要预测未来就必须理解现在——音素结构、韵律、说话人特征都是「预测未来」的有用线索，被无损地烧进编码器，不花一张标注。
    - listitem [ref=f297e16]: ◈ 三个头各司其职：KWS 头（全连接分类器）、VAD 头（二分类器）、SV 头（嵌入提取 + 相似度计算）——判别逻辑不同但声学基础相同，共享编码器天然合理。
    - listitem [ref=f297e17]: ◈ 多任务训练两件套：交替训练（每步随机选任务算损失，防互相踩脚）+ GradNorm 梯度平衡（动态调整损失权重，把各任务梯度拉回同一量级——防止大梯度任务主导编码器更新）。
    - listitem [ref=f297e18]: ◈ 参数共享三档消融：硬共享（全共用，参数最省）vs 软共享（底层共享+高层分支，部分任务更好）vs 无共享（基线）——效率与特异性的权衡与 2021 №1（个性化触发）的结论一致。
    - listitem [ref=f297e19]: ◈ 结果（约值）：总参数 40–50%（vs 三独立之和）；推理效率 2–3×（一次前向三输出）；KWS 相当或略高、VAD 略升、SV EER 可接受；SSL 预训练 KWS +1–3%、VAD +2–5%（标注越少收益越大）。
    - listitem [ref=f297e20]: ◈ 任务组合：KWS+VAD 增益最大，加 SV 后 KWS/VAD 保持——三任务同框可行。边界：任务差异大时有干扰风险（KWS 要时序细节 vs SV 要说话人特征）；SSL 预训练计算开销大（一次性成本摊三个任务才划算）。
  - heading "§01 问题：三个模型的重复税" [level=2] [ref=f297e21]:
    - generic [ref=f297e22]: §01
    - text: 问题：三个模型的重复税
  - generic [ref=f297e23]: 四宗罪与统一的机会
  - generic [ref=f297e24]:
    - generic [ref=f297e25]:
      - heading "内存与计算的重复税" [level=3] [ref=f297e26]
      - paragraph [ref=f297e27]: 三个任务各带一套完整骨干——存储翻三倍、内存翻三倍；推理时同一段音频要过三次编码器——底层声学特征的计算被重复了三遍，而三次算出的结果高度相似。
    - generic [ref=f297e28]:
      - heading "数据孤岛" [level=3] [ref=f297e29]
      - paragraph [ref=f297e30]: KWS 模型看不到 SV 数据里的说话人标注、VAD 模型看不到 KWS 的词标注——每个任务的监督信号只服务自己。而三个任务共享同一物理基础（声学编码），孤岛完全是工程造成的。
    - generic [ref=f297e31]:
      - heading "统一的前提是表示通用" [level=3] [ref=f297e32]
      - paragraph [ref=f297e33]: 三个任务的判别逻辑不同但底层需求相同——都需要「这段音频里有什么结构」的通用表示。CPC 类自监督恰好能零标注地提供这个地基——统一框架的时机由 SSL 成熟度决定。
    - generic [ref=f297e34]:
      - heading "与同系列论文的呼应" [level=3] [ref=f297e35]
      - paragraph [ref=f297e36]: 与 2021 №18（交叉注意力）同一年的平行工作：那篇聚焦「任务间怎么交换信息」，本篇聚焦「任务间怎么共享骨架」——一个加密交换通路，一个砍重复结构，恰好互补。
