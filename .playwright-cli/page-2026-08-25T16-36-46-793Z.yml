  - generic [ref=f297e292]:
    - generic [ref=f297e293]: 可迁移判断
    - paragraph [ref=f297e294]: ↳ 统一多任务语音前端是边缘部署的趋势：SSL 给地基（零标注的通用表示）、共享编码器给骨架（砍重复计算）、任务头给弹性（新任务加头不改骨架）——三层结构值得作为语音端侧系统的默认架构思考。
    - paragraph [ref=f297e295]: ↳ 省的本质是消除重复编码：三个模型对同一段音频各算一遍特征——统一框架的 2–3× 推理效率不是魔法，只是把「同样的计算做三遍」的浪费归一。审查任何多模型系统时先找这种重复。
    - paragraph [ref=f297e296]: ↳ SSL 的收益与标注稀缺度成正比：标注充足的场景收益小、标注昂贵的场景收益大——决定要不要上 SSL 先看自己的标注预算，而不是看潮流。
    - paragraph [ref=f297e297]: ↳ 多任务训练的成败在梯度治理：交替训练 + GradNorm 是「让多个任务公平使用共享资源」的机制——任何共享参数的联合训练（多任务/多域/多目标）都需要同类的治理结构，否则必然被大梯度任务绑架。
