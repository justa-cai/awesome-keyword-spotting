  - heading "§02 方法：预测未来 + 共享骨架" [level=2] [ref=f297e103]:
    - generic [ref=f297e104]: §02
    - text: 方法：预测未来 + 共享骨架
  - generic [ref=f297e105]: InfoNCE · 三头结构 · GradNorm
  - generic [ref=f297e106]:
    - generic [ref=f297e107]: "CPC: 给定 z_t 预测 z_{t+k} → InfoNCE: 真 future ↑ / 随机负样本 ↓ 多任务: L = α·L_KWS + β·L_VAD + γ·L_SV 交替训练（每步随机选任务） + GradNorm（梯度拉回同量级） 推理: 一次前向 → 共享编码 → 三头并行 → 三个预测同时出"
    - generic [ref=f297e108]: 人话：预训练阶段让编码器玩「猜未来」游戏——猜得准就必须懂语音结构；微调阶段把这套懂结构的编码器接三个不同的头，联合训练时用 GradNorm 保证没有哪个任务的梯度嗓门太大。推理时语音只编码一次，三个头各取所需。
  - generic [ref=f297e109]:
    - generic [ref=f297e110]:
      - heading "GradNorm 解决什么" [level=3] [ref=f297e111]
      - paragraph [ref=f297e112]: 多任务最要命的是梯度打架：某任务的梯度若比其他大一个量级，共享编码器的更新就会被它主导——其他任务被拖着走。GradNorm 动态调整损失权重把梯度拉回同一量级；交替训练则从采样层面防踩脚——两件套一起上。
    - generic [ref=f297e113]:
      - heading "硬共享 vs 软共享的选型" [level=3] [ref=f297e114]
      - paragraph [ref=f297e115]: 硬共享参数最省（本文主推）；软共享（底层共享+高层分支）在部分任务上更好——当任务对高层特征的需求分化（KWS 的时序 vs SV 的音色）时，分支换参数买特异性。与个性化触发（№1）的共享层数消融互相印证。
