    - generic [ref=f297e247]: 读表要点
    - listitem [ref=f297e248]: ◈ SSL 收益的两条规律：标注越少收益越大（预训练补的是数据缺口）；未标注数据越多越好（还有扩展空间）——这两条决定了该路线对低资源场景的价值。
    - listitem [ref=f297e249]: ◈ 「三任务不降反升」说明任务间是正迁移——KWS/VAD/SV 的声学基础共享度高；反过来这也划出了方法的适用边界：任务差异太大（如加上与声学无关的任务）时干扰风险真实存在。
    - listitem [ref=f297e250]: ◈ 证据边界：噪声/远场不充分、编码器各层贡献分析有限、增量学习（新任务加入的遗忘）未探索——统一框架的「可扩展性」还欠账。
