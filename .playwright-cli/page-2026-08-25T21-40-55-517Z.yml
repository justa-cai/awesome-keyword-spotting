  - generic [ref=f38e82]:
    - generic [ref=f38e83]: "02"
    - heading "机制：每层一本笔记本" [level=2] [ref=f38e84]
    - paragraph [ref=f38e85]: 用一个比喻抓住机制差异：RNN 像「把整段回忆抄在一张巴掌大的纸条上」——纸就那么大，写得越多越糊；记忆化网络像「每层一本自己的笔记本」——浅层本子记「刚才的爆破音」，深层本子记「这个词的开头」，各记各的、互不挤占。当前帧的计算同时翻开所有本子：历史激活与当前输入共同参与本层运算。
