  - generic [ref=f38e13]:
    - generic [ref=f38e14]: "01"
    - heading "问题：流水线与状态的两座山" [level=2] [ref=f38e15]
    - generic [ref=f38e16]:
      - generic [ref=f38e17]: TL;DR
      - list [ref=f38e18]:
        - listitem [ref=f38e19]: ◆ 传统 KWS 的多阶段流水线四宗罪：系统复杂（模块+接口+协同调参）、信息损失（MFCC 固定中间表示）、时序上下文难管（RNN 状态饱和/延迟不可控）、部署约束（延迟<100ms · 低内存 · 低算力）。
        - listitem [ref=f38e20]: ◆ 核心创新的视角转换：RNN 把全部历史压进一个固定维隐状态——序列越长压缩损失越大；记忆化网络把记忆分布到网络的多个深度层，每层一个 FIFO 队列存自己的历史激活。
        - listitem [ref=f38e21]: ◆ 分层时间尺度自然涌现：浅层记短时声学细节，深层记长时语义模式——不同抽象层次利用不同时间跨度的历史，容量按需分配到层。
        - listitem [ref=f38e22]: ◆ 端到端训练直接输出检测分数（不是音素后验）——训练模拟流式逐帧行为，训练与推理一致；无独立解码器或后处理。
