      - generic [ref=f38e128]: FIFO 的工程性质
      - generic [ref=f38e130]: FIFO 队列的三重保证：
      - generic [ref=f38e131]: · 恒定内存：窗口定长——不管听多久
      - generic [ref=f38e132]: 内存占用不变（vs RNN 也恒定，但本
      - generic [ref=f38e133]: 方法容量可按层分配）
      - generic [ref=f38e134]: · 确定性延迟：推理延迟 = f(窗口大小)
      - generic [ref=f38e135]: ——可精确设计，不是「看序列多长」
      - generic [ref=f38e136]: · 无重置逻辑：新帧进队尾 · 旧帧自动
      - generic [ref=f38e137]: 出队头——没有 RNN 的饱和/重置问题
      - generic [ref=f38e138]: 消融：分布式（多层）记忆 > 集中式
      - generic [ref=f38e139]: （单层）记忆——分层时间尺度的设计
      - generic [ref=f38e140]: 被实验证实有效
      - generic [ref=f38e141]: 左：每层一个 FIFO 笔记本，浅层记细节、深层记模式——时间尺度随深度分层。右：FIFO 带来恒定内存、确定性延迟、零重置逻辑——三重工程保证让流式部署可精确设计
    - generic [ref=f38e142]: 图 2 · 机制解剖：多层分布式记忆的分层时间尺度 · FIFO 队列的三重工程保证
    - generic [ref=f38e143]:
      - generic [ref=f38e144]: "记忆: mem_l ← FIFO(mem_l, a_l(t)) ← 每层 l 的激活 a_l 依时入队, 定长窗口 计算: a_l(t+1) = DNN_l( a_{l-1}(t), mem_1..mem_L ) ← 当前输入 + 各层历史共同参与 输出: score(t) = DNN_out( ... ) ← 直接是检测分数, 无解码器"
      - generic [ref=f38e145]: 人话：每层都有一个先进先出的「记忆条」——新的一帧来了，每层把自己刚算出的结果记到条尾、条头最老的自动滑掉；下次计算时把条上的历史和当前输入一起看。条长固定，所以内存恒定、延迟恒定，永远不用「清空重来」。
    - paragraph [ref=f38e146]: FIFO 的三重工程保证是流式部署的定心丸：恒定内存（窗口定长，听多久都一样）、确定性延迟（延迟 = 窗口大小的函数，可精确设计）、零重置逻辑（进出自动，没有 RNN 的饱和判断与重置策略）。消融证实分布式（多层）显著优于集中式（单层）——分层时间尺度是机制而非装饰。
