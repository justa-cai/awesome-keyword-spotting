    - generic [ref=f109e262]:
      - generic [ref=f109e263]: JUDGEMENT
      - paragraph [ref=f109e264]: ↳ 跨领域类比的价值在于「借武器」也在于「识边界」：频谱图借来 CV 的整个技术栈，但它的时间轴因果、频率轴有序、像素统计特殊——类比成立的范围就是可借武器的范围，超出边界的照搬（如无方向的图像增广）可能失效。
      - paragraph [ref=f109e265]: ↳ 对抗训练可以被驯化为正则化：VAT 把「找对抗样本」从攻击手段转成「局部一致性约束」——扰动方向在频谱图上恰有自然声学含义，鲁棒性收益免费；改损失不改模型，推理端零成本。
      - paragraph [ref=f109e266]: ↳ 两个范式的分野是一个判断题：「频谱图是图」导向 2D CNN（本文系），「频率是通道」导向 1D 时序卷积（TC-ResNet 系）——后来两条路线长期并存，说明这不是谁对谁错，而是「频率维该被卷积还是被混合」的架构哲学分歧。
