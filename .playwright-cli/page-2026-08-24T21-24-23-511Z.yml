      - paragraph [ref=f147e16]: 发表：arXiv 2407.18879（2024-07）· Hey/OK Google 生产任务 · 320K 流式 SVDF 模型
      - generic [ref=f147e17]:
        - generic [ref=f147e18]: 模型不动、数据重构
        - generic [ref=f147e19]: 标点 = 韵律控制符
        - generic [ref=f147e20]: Virtuoso + AudioLM 双引擎
        - generic [ref=f147e21]: 真实负样本是最大杠杆
        - generic [ref=f147e22]: 说话人多样性 > 每人句数
        - generic [ref=f147e23]: 3.8M→2k 句（~1900×）
      - generic [ref=f147e24]:
        - heading "一分钟版本" [level=2] [ref=f147e25]
        - list [ref=f147e26]:
          - listitem [ref=f147e27]: 痛点在数据侧不在模型侧：生产级 KWS 永远在线（严格因果低延迟 + 小 footprint，基线仅 320K 参数），必须覆盖人群 / 口音 / 发音方式 / 声学环境的巨大多样性——真实正样本 380 万句、负样本 1410 万句（Table 3）。每换唤醒词、每加语言、每上新品类就要重新凑百万句级目标词录音——产品迭代速度和开发预算的直接瓶颈。
          - listitem [ref=f147e28]: ASR 的 TTS 增强结论搬不过来：ASR 能利用远比标注音频丰富的纯文本；KWS 的正样本是「关键词 + 查询」短语结构、负样本是任意不含关键词语音、正负极不平衡（14.1M 对 3.8M），且对韵律变化极敏感——拖长、停顿、升调、喊叫这些系统性变体在通用 TTS 增强流程里没被显式建模，缺了它们上线就表现为误拒。
          - listitem [ref=f147e29]: "方法三板斧：① 韵律控制文本生成器——Virtuoso 实验特性「标点控制韵律」：text 默认 / (text) 慢说 / text: 停顿 / text? 升调 / text! 大声，在 prefix 与 key_name 上独立施加，「同一句话的多种说法」变成可枚举可采样的操作；② 双引擎——Virtuoso 给广度（726 声音 × 139 语言，英文短语 + 不同语言目标 = 免费注入口音多样性），AudioLM 变体给深度（保留输入音频说话人特征的任意声音克隆）；③ 混合策略当实验对象。"
          - listitem [ref=f147e30]: 纯合成不可行（Table 4）：最好纯 TTS 配置 FRR 46.47%，是纯真实基线 3.17% 的近 15 倍——分布失配的代价直接可见；约 11M 真实负样本把它拉到 17.94%（相对改善近六成）——真实负样本是性价比最高的单一投入：不含关键词即可、来源几乎不限、采集成本远低于专属正样本。
          - listitem [ref=f147e31]: 最重要的可操作结论（Table 5）：说话人多样性优先于每人句数——说话人数 1→100 陡峭改善（15.28→9.78），固定 100 人加句数 2→12 句几乎不动（10.99→10.71）；100 说话人即进入基线 3 倍错误率区间。
          - listitem [ref=f147e32]: 跨节对比最有杀伤力：随机采样 100k 句真实正样本 FRR 9.94%，按说话人均衡采样只要 2k 句（100 人 × 20 句）就到 9.47%——同量级精度少用约 50 倍数据；随机大语料集中于少数说话人，多样性增量有限。真实正样本从 3.8M 压到 2k（~1900×），代价是 FRR 从 3.17% 到 9.47%（3 倍以内）。
          - listitem [ref=f147e33]: TTS 的第二重身份：TTS + 全量真实 = 2.46%，优于纯真实的 3.17%——合成数据在真实数据充足时仍是 0.71 点的增强增益；TTS 不只替代采集，也是传统意义上的数据增强。
          - listitem [ref=f147e34]: 边界：分布失配只被混合稀释、未被根治（无域对抗 / 一致性损失 / 伪影过滤）；韵律控制绑定 Virtuoso 实验特性（换引擎要重建控制通道）；三种多样性手段（韵律 / 口音 / 克隆）无单独消融；只有 Hey/OK Google 一个任务——最有想象空间的自定义唤醒词冷启动场景没验证；TTS 生成 12.6M 句的计算成本与采集成本模型全未报告；9.47% FRR（约十分之一唤醒被拒）对常驻产品是否可用、适用哪些产品线，无边界讨论。
    - generic [ref=f147e35]:
      - paragraph [ref=f147e36]: §01 · 问题陈述
      - heading "3 倍错误率换三个数量级数据削减：目标设定本身就是工程判断" [level=2] [ref=f147e37]
      - generic [ref=f147e39]: 为什么创新全放数据侧：320K 参数的流式 SVDF 编解码结构是大规模生产验证过的配置，动模型的风险收益比很差；数据侧结论与模型架构正交——无论底层换成什么流式网络，「多少真实数据、什么结构」的配方都成立；要解决的瓶颈明确在采集成本与开发周期。结构细节：编码器输出 N 维（封装对关键词识别至关重要的音素类声音单元）、解码器输出 2 维（关键词有无），拼接 logit 让音素级证据与整词判决同时接受监督。
      - generic [ref=f147e40]: 此前工作的缺口：Lin 等的「真实数据预训练 embedding + 少量数据微调分类头」只是把大规模真实依赖前移到一次预训练，没有消除；Werchniak 等停在「真实与 TTS 混合最好」的定性结论——本文把它量化并系统化：沿真实总量、说话人数、每人句数三轴 sweep，给出可复用配方与明确阈值。TTS 固有缺陷被正面列出：合成数据可能带真实录音中不存在的伪影、可能生成不出真实语音的全部变化——对策不是修 TTS 而是混真实数据补偿。
