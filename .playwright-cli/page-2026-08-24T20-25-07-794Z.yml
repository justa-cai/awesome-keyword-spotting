      - heading "同架构同数据只有损失不同：+10.43% 全归因给结构" [level=2] [ref=f125e93]
      - generic [ref=f125e95]: 数据与设置：训练 King-ASR-066（2.6k 英语母语说话人，4.6k 小时强制对齐切词级，211,676 个类别；RIR 卷积 + babble/car/music 加噪 −3~25dB）。评测 WSJ（dev 16,839 段 / 3,289 唯一词 + test 18,274 段 / 3,239 唯一词；同样 RIR + MUSAN 5~25dB 模拟真实）；随机抽 1.3M 正对 / 13M 负对。训练：AdamW 1e-4（每 20 ep 减半）/ 100 epoch / 2×A100 一天。指标 EER（单点判决）+ AP（全局排序——开放词表下门限随场景调，排序判别力更本质）。公平性：所有系统共享同一套数据、架构、训练设置，只有训练准则不同——增益可干净归因。
