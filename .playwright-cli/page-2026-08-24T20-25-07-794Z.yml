          - heading "实验设计不足" [level=4] [ref=f125e226]
          - list [ref=f125e227]:
            - listitem [ref=f125e228]: 对比面缺口：只比 DML 路线（AsyP/AdaMS）与语音注册（PATN），刻意回避音频-文本对齐路线的同期系统——「与当下最强同任务系统相比如何」空白（作者自认主线不同；RPL 叠加在对齐框架上是未来工作）。
            - listitem [ref=f125e229]: 评测域代表性：WSJ 朗读语音 + 合成 RIR/MUSAN——说话人 / 信道 / 口音多样性远不如真实远场触发场景，无真实设备录制评测。
            - listitem [ref=f125e230]: 无统计稳健性：单次运行无方差；1.3M/13M 对只描述一次随机抽取。
            - listitem [ref=f125e231]: 部署指标缺失：延迟 / 体积增量 / 流式可行性零数字——「不增加推理成本」是核心卖点却没给推理侧量化。
            - listitem [ref=f125e232]: 错误分析缺失：哪类词（短词 / 音近词 / 多词短语）受益最大、失败案例长什么样未报告。
      - generic [ref=f125e233]: 值得追的方向：① 集成进对齐框架（作者自指）——对齐路线多用朴素损失训二分类器，RPL 作为即插即用的结构正则有明确叠加空间；② 双向结构迁移——现在是单向 TE→AE；让 TE 也接受声学结构信息，修正词表地图中与声学现实冲突的部分；③ 关系势函数扩展到跨 batch 的词表级结构——缓解类不重合假设对 batch 构造的约束；④ RPL-A 非单调叠加的机制分析——理解三种几何约束的张力来源，推导更优组合权重或课程式叠加顺序；⑤ 补部署侧数字（延迟 / 体积 / 流式）与按词型的错误分析。
