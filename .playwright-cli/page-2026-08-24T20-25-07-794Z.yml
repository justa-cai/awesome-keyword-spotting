        - generic [ref=f125e23]: AP 71.9→82.5
      - generic [ref=f125e24]:
        - heading "一分钟版本" [level=2] [ref=f125e25]
        - list [ref=f125e26]:
          - listitem [ref=f125e27]: 被扔掉的免费监督：文本注册式 KWS（打字即注册）的度量学习全部是点对点 P2P——逐对算 AE-TE 相似度。但文本编码器对整个词表生成的 TE 集合携带丰富的词间结构（音素构成、拼写相近的词距离更近）——这是一份免费的带先验的监督信号，所有 P2P 训练都在白白扔掉它。
          - listitem [ref=f125e28]: 方案（RPL）：把比较从「点对点」升级为「结构对结构」——跨模态的关系蒸馏：教师 = 文本编码器的关系结构，学生 = 声学编码器的嵌入几何。三个正交切面：RPL-D（归一化欧氏距离——两侧量纲不一致必须先除以各自模态的平均成对距离）、RPL-A（三元组夹角的余弦——距离刻画远近、角度刻画方位排布，正交互补）、RPL-P（样本到类中心的距离——TE 天然是类代理，把代理间的距离结构迁移为 AE 的向心性）。
          - listitem [ref=f125e29]:
            - text: 跨范式辅助损失（工程直觉）：把语音注册式 KWS（PATN）的多任务损失搬来给声学编码器单独加餐——L
            - subscript [ref=f125e30]: pc
            - text: （TE 与 AE 类中心重合）+ L
            - subscript [ref=f125e31]: mono
            - text: （帧级单音素 CE，补发音结构）+ L
            - subscript [ref=f125e32]: triplet
            - text: （词级三元组）。
          - listitem [ref=f125e33]: 结果：WSJ 加噪加混响，同架构同数据只有训练准则不同——AP 71.9%（AdaMS）→ 79.4%（纯 RPL，+10.43%）→ 82.5%（+AL）；EER 6.99→5.84%；反超语音注册的 PATN（EER 相对 −22.96%）——文本注册的用户便利不再以性能妥协为代价。
          - listitem [ref=f125e34]: 最有信息量的负结果：纯 S2S 只有 66.8%，比纯 P2P 基线（71.9%）还差——AE-TE 逐对对齐是根基、结构迁移只能做增量：TE 的结构是文本编码器视角的先验，声学空间自身的判别细节必须靠 P2P 监督锚定。结构损失的正确用法是叠加而非替代。叠加顺序还非单调（D+A 反降、四损失全开才最优）。
          - listitem [ref=f125e35]: 部署语境：声学编码器只有 2.2M 参数（端侧硬约束）——RPL 是训练期损失、不增加推理成本，是少数纯靠训练抬性能的杠杆；文本侧 10M 反而更大（只在注册期跑一次，不在常驻路径上）。
    - generic [ref=f125e36]:
      - paragraph [ref=f125e37]: §01 · 问题陈述
      - heading "DML 损失函数的形状直接决定判别上限" [level=2] [ref=f125e38]
      - generic [ref=f125e40]: 两条主线的不足：① 音频-文本对齐路线（交叉注意力 / 自注意力提 pattern / 动态序列划分）——焦点在「怎么在序列层面对齐」，损失本身相对朴素；② DML 损失路线（三元组 → AsyP 非对称代理 → AdaMS 逐类可学超参）——本文所在主线。核心不足一句话：无论哪条线，AE-TE 比较都是点对点的——完全没利用嵌入集合内部的结构关系（哪些词彼此相近、以什么角度排布、围绕类中心如何分布）；而 RKD 已证明嵌入空间的结构本身是模型知识的重要组成部分。AsyP/AdaMS 一族的 α/β/λ 超参手工或逐类独立学习——类间关系结构依然没进目标。三层挑战：结构关系怎么定义度量（可微 / batch 内高效 / 解决两侧量纲不一致）；结构损失与 P2P 怎么组合（纯结构是否够、叠加是否干扰）；工程约束（声学编码器 2.2M 硬限制——只能从训练准则下手）。
