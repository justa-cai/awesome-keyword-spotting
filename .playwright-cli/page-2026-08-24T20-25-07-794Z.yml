      - heading "逐对算相似度扔掉了整张「词表地图」—— 让声学嵌入复刻文本嵌入的结构关系" [level=1] [ref=f125e13]: 逐对算相似度扔掉了整张「词表地图」——让声学嵌入复刻文本嵌入的结构关系
      - paragraph [ref=f125e14]: Relational Proxy Loss for Audio-Text Based Keyword Spotting（RPL）
      - paragraph [ref=f125e15]: 作者：Youngmoon Jung、Seungjin Lee 等 6 人 —— 三星研究院（首尔）
      - paragraph [ref=f125e16]: 发表：Interspeech 2024 · arXiv:2406.05314
      - generic [ref=f125e17]:
        - generic [ref=f125e18]: 结构对结构 S2S
        - generic [ref=f125e19]: 关系知识蒸馏跨模态化
        - generic [ref=f125e20]: RPL-D 距离 / RPL-A 角度 / RPL-P 原型
        - generic [ref=f125e21]: 跨范式辅助损失
