    - generic [ref=f29e111]:
      - generic [ref=f29e112]: "共享骨干: F = CNN_FPN(文档图像) ← 多尺度特征, 大字小字通吃 检测: heatmap/anchor(F) → 边界框 ← 空间感知 识别: CTC/Attention(F, ROI(检测框)) → 字符序列 ← 语义理解 损失: L = λ₁·L_spot + λ₂·L_rec ← 双路梯度共雕骨干"
      - generic [ref=f29e113]: 人话：一只眼睛管「词在哪」，一只眼睛管「词是什么」——两只眼睛共用一个大脑，看过的每一页都同时训练两份本事；分开练的话，管位置的眼睛不知道那是个词，管内容的眼睛不知道该往哪看。
    - paragraph [ref=f29e114]: "消融的三条结论都值得记：共享胜独立（互喂真实发生）；λ 权重要细调（一边倒则另一边受损——与 #14/15 的教训一致）；骨干越深共享特征越好（容量喂得动两头）。这三条在语音侧的多任务论文里几乎原样重现。"
