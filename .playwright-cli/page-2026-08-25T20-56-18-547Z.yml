  - generic [ref=f29e12]: National Technical University of Athens（Fousekas / Kokkinos / Maragos）· arXiv 2008.07109（2020.08） 先说清楚：「keyword spotting」在文档圈 = 在手稿图像中定位特定词 + 转录其内容 · 方法：共享 CNN 骨干（FPN 多尺度）+ 检测分支（热图/锚框）+ 识别分支（CTC/注意力），ROI 传递、联合损失 一句话：检测供空间、识别供语义——互喂让两个任务双赢；这与语音侧的多任务浪潮（KWS+SV/+VAD/+意图）完全同构。
  - generic [ref=f29e13]:
    - generic [ref=f29e14]: "01"
    - heading "先说清楚：这是文档圈的 KWS" [level=2] [ref=f29e15]
    - generic [ref=f29e16]:
      - generic [ref=f29e17]: TL;DR
      - list [ref=f29e18]:
        - listitem [ref=f29e19]: ◆ 「keyword spotting」在两个社区各有所指：语音圈 = 唤醒词检测（本系列 28 篇的主战场）；文档圈 = 在手写文档图像里定位特定词的位置并转录内容——本文属于后者。
        - listitem [ref=f29e20]: ◆ 传统把 Spotting（框出来）与 Recognition（念出来）分两个独立模型：冗余、错过共享特征、串行延迟、结果可能矛盾（框住 A 念成 B）。
        - listitem [ref=f29e21]: ◆ WSRNet 的统一方案：共享 CNN 骨干 + 特征金字塔 + 检测分支（空间热图）+ 识别分支（CTC/注意力），ROI 把定位结果传给识别，联合损失端到端。
        - listitem [ref=f29e22]: ◆ 它进这个合集的意义是跨模态对照：「检测 + 理解联合建模」的母题在图像与语音两个社区各自演化、殊途同归——互相当镜子。
