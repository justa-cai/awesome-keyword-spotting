    - generic [ref=f29e239]: "05"
    - heading "可迁移的判断" [level=2] [ref=f29e240]
    - generic [ref=f29e241]:
      - generic [ref=f29e242]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f29e243]: ① 「找到它」和「理解它」本就该一起学。
      - generic [ref=f29e244]: ↳ 检测与识别拆开做会丢互喂红利——空间信息帮语义（看对地方）、语义信息帮定位（认出是词）；图像侧与语音侧的平行演化证明这是跨模态的结构性规律，不是某一领域的巧合。
      - paragraph [ref=f29e245]: ② 同名任务在不同社区是彼此的镜子。
      - generic [ref=f29e246]: ↳ 「keyword spotting」在两个社区各自发展出联合建模、多任务、少样本——读跨模态的对照论文成本不高，收益是跳出本领域的路径依赖：图像圈的今天可能是语音圈的明天。
      - paragraph [ref=f29e247]: ③ 多任务的一致性红利要在产品语境里计价。
      - generic [ref=f29e248]: ↳ 统一框架消灭「检测与识别互相矛盾」这类失败——单看指标是零点几个点，看用户信任是消除「系统自己打架」的荒谬感；一致性是难以量化但真实的产品资产。
