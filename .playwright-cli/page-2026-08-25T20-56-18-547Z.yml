    - generic [ref=f29e73]: "02"
    - heading "机制：互喂的环路" [level=2] [ref=f29e74]
    - paragraph [ref=f29e75]: 联合有效的原因是任务互喂：检测分支吃识别的语义（知道「这一坨念什么」比「这一坨像词」定位更准）；识别分支吃检测的空间（ROI 把注意力圈在正确区域，转写不被背景干扰）。共享骨干是环路的载体——两路梯度共同雕刻出「既懂空间又懂语义」的特征。消融证实这不是叙事：共享特征在两个任务上都赢过独立特征。
