            - listitem [ref=f14e275]: TKWS 精度非无损：TKWS-3 距 LicoNet-S 差 1.2 pp；TKWS-2 差 3~5 pp——「最小精度损失」的说法在 TKWS-2 档相当勉强。
            - listitem [ref=f14e276]: 架构对特征分辨率敏感：TKWS 在 63 窗下梅尔 15→30 反而掉 1.2 pp——倒瓶颈在高维输入下的容量/正则没调优，模型与特征配置不是独立可组合的。
            - listitem [ref=f14e277]: NPU 收益非自动获得：未给 NPU 最优核尺寸范围；TKWS 自身是否落在 NPU 最优域内未验证——TENet 式隐性失败可能同样发生在自家架构上。
            - listitem [ref=f14e278]: one-shot 与真实流式脱节：LiCoNet 甚至为此放弃原生流式设计；滑窗流水的状态维护与流水线重叠在测量框架里没有体现。
            - listitem [ref=f14e279]: 关键工程量缺失：峰值 RAM（激活内存）、MACs、量化方式与精度损失均未报——「参数量 = 内存占用」只覆盖静态一半。
        - generic [ref=f14e280]:
          - heading "实验设计的不足" [level=4] [ref=f14e281]
          - list [ref=f14e282]:
            - listitem [ref=f14e283]: 基准数值不可复用：图 2 热图的时延/能耗/EDP 绝对值正文一个没引用、无配套数值表——只能目测，削弱基准论文的核心价值。
            - listitem [ref=f14e284]: 数据覆盖有限：十词子集、GSCD 自带噪声；无远场/混响/设备自噪（眼镜骨导、风噪）；10 类无拒识设定回避了假唤醒率——唤醒产品的第一指标。
            - listitem [ref=f14e285]: 无统计稳健性：无方差/置信区间，1 pp 内的排名无从判断显著性。
            - listitem [ref=f14e286]: 训练细节不透明：优化器/学习率/轮数/量化是否感知训练未报——架构对比可能混入训练配方差异。
            - listitem [ref=f14e287]: 平台配置单一：三块 MCU 都钉在最高主频（800/480/160 MHz），未扫 DVFS 频点——「U5 省 H7 快」是在非对称频率设定下得出的，调频后 EDP 排名是否保持未知。
      - generic [ref=f14e288]:
        - heading "下一步方向（论文展望 + 笔者延伸）" [level=3] [ref=f14e289]
        - paragraph [ref=f14e290]: ① NPU 算子约束入架构搜索：把目标加速器的最优核尺寸、算子集合作为硬约束，避免「被卸载到 CPU」的隐性失败；TKWS 补核尺寸敏感性验证。 ② 流式与全双工评估：扩展到滑窗流式，纳入状态维护内存与流水线重叠；引入每秒假唤醒数、词起点到触发的检测时延等产品级指标。 ③ 特征提取进一步压缩：DCT 保留系数个数、8bit 梅尔、乃至绕过 MFCC 的 sinc 卷积/可学习前端，与本文框架对比。 ④ 与压缩技术正交叠加：8bit 基础上叠剪枝/蒸馏（如 LicoNet-S 蒸馏 TKWS-3）/更低比特。 ⑤ 真实可穿戴验证：结合智能眼镜背景，真实远场加噪数据 + VAD 两级唤醒流水线的系统级对比——从基准研究走向产品落地的关键一步。
