      - generic [ref=f14e64]:
        - text: EDP = E × L （能量 × 时延，单位 mJ·ms）
        - generic [ref=f14e65]: 为什么用乘积：单独优化时延会倾向高频高功耗平台（H7），单独优化能量会倾向低频平台但拉长响应（U5）——乘积惩罚任何一端极端化。这个指标恰好揭示 H7 与 U5 在系统级上「殊途同归」的等价性（时延与能耗互为倒数地接近），这是单独看任一指标都得不到的结论。
