        - heading "一分钟版本" [level=2] [ref=f14e25]
        - list [ref=f14e26]:
          - listitem [ref=f14e27]: 被点破的评估缺口：绝大多数 KWS 工作只优化模型推理一段，MFCC 前处理的能耗时延从未入账——而 FFT + 梅尔滤波 + DCT 这条浮点密集的链在几十 MHz 的 MCU 上不是小头。学界习惯只算管线一段，系统整条管线的账没算过。
          - listitem [ref=f14e28]: 方法：把测量边界扩展到「前处理 + 推理」完整管线，在 STM32 N6（M55+DSP+NPU）/ H7（M7）/ U5（M33）三档平台上做「特征配置 4 × 模型 6 × 平台 3」全因子扫描，指标用能量延迟积 EDP = E × L（惩罚任何一端极端化）。
          - listitem [ref=f14e29]: 自研 TKWS（MobileNetV2 倒瓶颈搬到 1D MFCC 时间序列）：TKWS-3 以 14.4k 参数达 92.4% F1——比 LicoNet-S 少 17% 参数、比 DS-CNN/TENet6 内存缩 3 倍以上。
          - listitem [ref=f14e30]: 两个关键实证：时间分辨率是一等变量（32→63 窗全模型一致 +2.3~+5.2 pp，且 N6 上几乎免能量代价）；架构排名随硬件翻转——无 NPU 平台 1D 卷积占优、DS-CNN 垫底，带 NPU 的 N6 上 TENet 因核尺寸超出 NPU 最优域被卸载到 CPU 反而吃亏。
          - listitem [ref=f14e31]: 诚实的缺口：EDP 绝对值只在热图里、正文一个数字没引用；one-shot 推理与真实流式脱节；峰值 RAM / MACs / 量化方式均未报告。
