      - generic [ref=f74e141]: 人话：一个块 = 两层「跳着看」的卷积，看完把输入原样加回来。第 i 层跳的步长是 2 的 i 次方——第 1 层看相邻、第 2 层隔一个看、第 3 层隔三个看，叠 6 层就能「记住」64 步前的输入，而网络只需要 6 层深。
