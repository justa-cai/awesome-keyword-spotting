      - generic [ref=f74e278]: JUDGEMENT
      - paragraph [ref=f74e279]: ↳ 「理论能力」不等于「实测能力」：LSTM 的无限记忆只在公式里，600 步压力测试实测已衰减——选架构要看实测的有效记忆，不看理论假设。
      - paragraph [ref=f74e280]: ↳ 对照实验的信誉来自协议：参数对齐 + 统一调参 + 多种子——没有这三样，「A 比 B 好」分不清是架构优势还是调参运气，本文是实证方法论的教学级示范。
      - paragraph [ref=f74e281]: ↳ 对 KWS 的两块基石：因果卷积 = 流式合法性（不偷看未来），膨胀感受野 = 用得起的长时上下文——端侧 KWS 从 RNN 转向 1D 卷积的每一步（TC-ResNet → MatchboxNet）都在用这两个性质。
