    - text: （2018） 一句话：把因果卷积 + 膨胀卷积 + 残差连接拼成通用架构 TCN，用参数对齐 · 统一调参 · 多种子的严格对照在音乐/语言/合成记忆任务上全胜 LSTM/GRU——「序列建模 = 循环网络」的默认假设从此被拆掉，端侧 KWS 的 1D 卷积转向由此获得理论背书。
