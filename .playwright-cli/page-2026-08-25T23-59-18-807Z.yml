      - list [ref=f74e18]:
        - listitem [ref=f74e19]: ◆ 「RNN 理论上无限记忆」是理论能力，从未被系统实证——LSTM/GRU 的长期记忆实际训练中容易衰减。
        - listitem [ref=f74e20]: ◆ RNN 的顺序依赖卡死并行：t 步必须等 t−1 步，GPU 喂不进去；门控机制还带来一堆超参玄学。
        - listitem [ref=f74e21]: ◆ 卷积偶有胜绩，但参数量、调参协议不统一——赢的是架构还是调参运气，说不清。
