  - generic [ref=f90e70]:
    - heading "2 机制：两个正交旋钮 + 一个补偿" [level=2] [ref=f90e71]:
      - generic [ref=f90e72]: "2"
      - text: 机制：两个正交旋钮 + 一个补偿
    - generic [ref=f90e73]:
      - generic [ref=f90e74]:
        - heading "旋钮一：状态 3 → 1" [level=3] [ref=f90e75]
        - text: 所有帧统一映射到音素级标签——DNN 输出维度 ÷3、Viterbi 拓扑简化；关键词音素序列固定，细粒度状态区分并不需要。
      - generic [ref=f90e76]:
        - heading "旋钮二：帧率 100 → 50Hz" [level=3] [ref=f90e77]
        - text: 每 20ms 算一帧——DNN 前向频率直接减半；10ms 分辨率对 KWS 是过度精度。
      - generic [ref=f90e78]:
        - heading "补偿：最小持续时间" [level=3] [ref=f90e79]
        - text: 帧率减半后短音素可能被误跳——HMM 层面强制每音素至少持续 N 帧，补回时间分辨率。
      - generic [ref=f90e80]:
        - heading "为什么敢砍" [level=3] [ref=f90e81]
        - text: 唤醒词短语固定 + 二级检测器兜底误警——一级的激进简化有安全网，这是级联架构给的设计自由度。
