    - generic [ref=f90e133]:
      - generic [ref=f90e134]: 计算量 ∝ (输出状态数) × (每秒帧数)： (3 states × 100 Hz) → (1 state × 50 Hz) = 1/6
      - generic [ref=f90e135]: 人话：DNN 每次前向的成本主要看输出层大小，一年要跑多少次看帧率。把输出从「每音素三个状态」压成「一个状态」，再把每秒跑的次数减半——两件事互相不搭边，所以省的电直接相乘：三乘二等于六。
