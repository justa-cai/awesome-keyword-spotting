    - generic [ref=f90e221]:
      - generic [ref=f90e222]: JUDGEMENT
      - paragraph [ref=f90e223]: ↳ 先问「这个精度是谁定的」：三状态音素和 100Hz 帧率都是 ASR 的惯例遗产——KWS 的任务更简单（固定短语），照搬 ASR 配置就是在为用不到的精度付费；砍冗余要先审需求来源。
      - paragraph [ref=f90e224]: ↳ 正交的优化才能相乘：输出维度和推理频率互不干扰，所以 3× 和 2× 直接得 6×——优化组合时先找正交轴，同一轴上的两个优化会互相抵消收益。
      - paragraph [ref=f90e225]: ↳ 级联架构买的是「激进简化的自由度」：一级敢砍精度，是因为二级兜底误警——系统设计里「安全网」的存在改变了局部组件的最优解，单点优化要放在系统上下文里看。
