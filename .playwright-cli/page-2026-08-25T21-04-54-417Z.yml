      - generic [ref=f30e135]: 遗传算法（黑盒·搜索式）
      - generic [ref=f30e176]: 散布 · 无梯度结构——更像自然噪声
      - generic [ref=f30e177]: 两种「指纹」在 MFCC 空间的系统性差异，
      - generic [ref=f30e178]: 正是 CNN 检测器能学会的东西——
      - generic [ref=f30e179]: 但指纹不同也埋下跨攻击迁移的隐患
      - generic [ref=f30e180]: 三重评估的设计
      - generic [ref=f30e183]: 匹配 Matched
      - generic [ref=f30e184]: 训练与测试同种攻击——检测器的「考试范围之内」
