      - generic [ref=f30e187]: 混合攻击训练，测未见过的攻击——部分泛化
      - generic [ref=f30e189]: 跨攻击 Cross
      - generic [ref=f30e190]: A 种攻击训练 → B 种攻击测试——泛化的极限考验
      - generic [ref=f30e191]: 这套评估设计的价值：不只报「能检测」——
      - generic [ref=f30e192]: 还量化了「对没见过的攻击还剩多少本事」
      - generic [ref=f30e193]: 安全研究的评估就该这么写
      - generic [ref=f30e194]: 左：梯度式攻击的扰动能量集中、结构化；搜索式攻击的扰动散布——指纹差异既成就了检测、也限制了迁移。右：三重评估层层逼近真实部署的未知攻击场景
    - generic [ref=f30e195]: 图 2 · 机制解剖：两类攻击扰动的形态差异 · 匹配/多条件/跨攻击的三重评估设计
    - generic [ref=f30e196]:
      - generic [ref=f30e197]: "白盒: min ‖δ‖₂ + c·L_C&W(f(x+δ), t) ← 梯度优化, DeepSpeech 定向转录 黑盒: 扰动种群 → 选择/交叉/变异 → 适应度=分类概率 ← 进化搜索, 仅查询接口 检测: CNN( MFCC(x) ) → { 干净, 对抗 } ← 二分类交叉熵"
      - generic [ref=f30e198]: 人话：攻击分两种——偷到图纸的（用微积分精确下毒）和只能试钥匙的（一代代试出来）。防御是训一只闻得出「毒味」的狗：两种毒的味道不一样，狗对闻过的毒很灵，闻没见过的毒就要看运气。
    - paragraph [ref=f30e199]: 三重评估的层次值得细看：匹配（同种攻击训练测试）考「学到没有」；多条件（混合训练测未见）考「部分泛化」；跨攻击（A 训 B 测）考「泛化极限」——层层逼近真实部署里「攻击者用的方法你不知道」的处境。
