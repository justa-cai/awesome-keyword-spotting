      - generic [ref=f30e275]:
        - generic [ref=f30e276]: "1"
        - paragraph [ref=f30e277]: 不对称迁移是全文最有价值的发现。白→黑 82% 而黑→白 49%——梯度式攻击的扰动结构化、统计特征明显，学到它顺带覆盖了部分搜索式扰动；反向不成立。这不是实现细节，是对「对抗痕迹本质」的实证洞察。
      - generic [ref=f30e278]:
        - generic [ref=f30e279]: "2"
        - paragraph [ref=f30e280]: 部署含义直接可操作。单一攻击训练的检测器不保险——最优策略是把多种攻击类型都混进训练集（多条件的 >96% 就是证据）；「通用检测器」仍悬而未决。
      - generic [ref=f30e281]:
        - generic [ref=f30e282]: "3"
        - paragraph [ref=f30e283]: 安全评估的范式价值。只报「能检测 X」的论文在真实世界里意义有限——本文用三重评估量化了「对未知的剩多少本事」，这种评估设计比检测器本身更值得被后续工作继承。
