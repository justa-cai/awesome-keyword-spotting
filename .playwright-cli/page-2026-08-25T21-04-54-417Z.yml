  - generic [ref=f30e84]:
    - generic [ref=f30e85]: "02"
    - heading "机制：指纹可学，但指纹各异" [level=2] [ref=f30e86]
    - paragraph [ref=f30e87]: 检测可行的物理基础是对抗扰动在 MFCC 特征空间留下系统性痕迹——人耳听不出，频谱统计量却变了。但两种攻击的「指纹」形态不同：C&W 的梯度优化产生能量集中、结构化的扰动；遗传算法的搜索式逼近产生散布、无结构的扰动——更像自然噪声。这个差异既成就了检测（指纹可学），也埋下了迁移的隐患（指纹不通用）。
    - img [ref=f30e88]:
      - generic [ref=f30e90]: 机制解剖：两种攻击的指纹差异 · 三重评估的设计
