    - heading "可迁移的判断" [level=2] [ref=f30e332]
    - generic [ref=f30e333]:
      - generic [ref=f30e334]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f30e335]: ① 检测器学的是「这类攻击的指纹」，不是「对抗性的本质」。
      - generic [ref=f30e336]: ↳ 对抗痕迹因攻击方法而异——梯度式与搜索式的扰动在特征空间形态不同；评估防御时报跨攻击迁移（对没见过的攻击剩多少本事）才是真指标，只报匹配准确率等于只报考试范围内的分数。
      - paragraph [ref=f30e337]: ② 防御的价值在抬高攻击成本，不在根除威胁。
      - generic [ref=f30e338]: ↳ 自适应攻击总能把检测器纳入优化目标——安全设计的目标函数是「让攻击更贵更难」而不是「绝对安全」；理解这一点才能正确评估防御方案（包括后来 2022 年 VIC-KD 的蒸馏路线）。
      - paragraph [ref=f30e339]: ③ 人耳的不可察觉 ≠ 机器的不可察觉。
      - generic [ref=f30e340]: ↳ 对抗扰动骗过人类听觉却在 MFCC 统计量上露馅——感知边界与特征边界不一致是检测可行的物理基础；这个思路通用于其他模态的对抗防御（图像的频域痕迹是同构故事）。
    - paragraph [ref=f30e341]: 系列坐标：本合集安全线的第一格——本文（2019）做「检测」（发现攻击指纹）；2022 年 VIC-KD 做「鲁棒」（把防御炼进模型，蒸馏路线）；2022 年 VSVC 后门做「攻击侧」（TTS 投毒）。检测 · 鲁棒 · 后门三格合起来，恰是 KWS 安全研究的攻防全景——从 2019 到 2022，这条线随语音交互设备的普及只会越来越重要。
