  - generic [ref=f30e12]: Aalborg University + 西安交通大学（Samizade / Tan / Shen / Guan）· arXiv 1910.10013（2019.10） 威胁：人耳不可察觉的扰动让 KWS/ASR 输出被改写 · 方法：CNN 二分类检测器（40 维 MFCC → 3 层卷积 → 干净/对抗），在 C&W 白盒与遗传算法黑盒两种攻击上训练评估 一句话：匹配/多条件下检测率 >96–98%，但跨攻击迁移不对称（白→黑 82.07%，黑→白 48.76% 近乱猜）——检测器学的是「攻击指纹」不是「对抗本质」。
  - generic [ref=f30e13]:
    - generic [ref=f30e14]: "01"
    - heading "威胁：听不见的指令" [level=2] [ref=f30e15]
    - generic [ref=f30e16]:
      - generic [ref=f30e17]: TL;DR
      - list [ref=f30e18]:
        - listitem [ref=f30e19]: ◆ 对抗攻击在音频上加人耳几乎无法察觉的微小扰动，神经网络输出就被彻底改写——KWS 被绕过或被伪造唤醒，智能音箱可能执行注入的恶意指令。
        - listitem [ref=f30e20]: ◆ 两种威胁模型差异巨大：白盒（C&W 攻击，梯度直达，min‖δ‖₂ + c·L，扰动最小最隐蔽）vs 黑盒（Alzantot 遗传算法，只查接口无梯度，进化搜索逼近）。
        - listitem [ref=f30e21]: ◆ 防守思路：把检测形式化为二分类——一个独立 CNN 检测器（40 维 MFCC → 3 层卷积 → 干净/对抗），与攻击方法解耦。
        - listitem [ref=f30e22]: ◆ 评估不止「能不能检」：匹配/多条件/跨攻击三重设计量化了对未见攻击的泛化极限——这是安全论文该有的评估姿势。
