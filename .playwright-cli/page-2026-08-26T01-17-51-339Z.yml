  - generic [ref=f116e260]:
    - heading "5 判断：能带走的三句话" [level=2] [ref=f116e261]:
      - generic [ref=f116e262]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f116e263]:
      - generic [ref=f116e264]: JUDGEMENT
      - paragraph [ref=f116e265]: ↳ 「训练大→剪→调」优于「直接训练小」：剪枝留下的连接是被大模型验证过的，而小模型从头训要从头探索——同参数量下稀疏模型更准，这个范式后来被彩票假说理论化，是模型设计的通用指导。
      - paragraph [ref=f116e266]: ↳ 重要性度量要包含「使用频率」维度：|w| 只看连接的粗细，|w|·E[|x|] 还看它被走的次数——评估任何「冗余」时，静态属性 × 动态使用率才是完整的账。
      - paragraph [ref=f116e267]: ↳ 剪枝的加速承诺依赖硬件兑现：非结构化稀疏的理论压缩率很高，但通用处理器吃不到「跳过零」的收益——结构化剪枝牺牲压缩率换通用硬件的真实加速；选路线先看目标芯片支持哪种。
