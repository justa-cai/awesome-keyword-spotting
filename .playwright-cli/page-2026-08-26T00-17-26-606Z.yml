      - generic [ref=f85e125]: 人话：注册就是把每遍录音「转写成音素」存起来；检测时算「当前音频里出现这些音素串的概率」，几个串的概率加起来超过门槛就报命中。音素串是通用的——换词只是换一组串，模型一个字都不用重训。
