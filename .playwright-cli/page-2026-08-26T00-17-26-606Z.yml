    - generic [ref=f85e234]:
      - generic [ref=f85e235]: JUDGEMENT
      - paragraph [ref=f85e236]: ↳ 把「换词成本」从训练时挪到注册时的关键是中间表示的通用性：音素串对所有词都成立——一次预训练的音素识别器是「永久基础设施」，新词只是一组新查询。
      - paragraph [ref=f85e237]: ↳ 可解释性是部署维度的功能：音素标签让失败可归因（识别错 vs 注册差 vs 阈值不当）——黑盒模型出问题只能整体重训，可解释流水线能定点修复。
      - paragraph [ref=f85e238]: ↳ 聚合是穷人的集成学习：多个注册假设的分数求和，等价于对「发音变异」做了一次廉价集成——没有额外模型、没有额外训练，只用注册阶段的冗余换鲁棒性。
