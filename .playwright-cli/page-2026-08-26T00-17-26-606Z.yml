        - heading "CTC 前向概率" [level=3] [ref=f85e75]
        - text: P(h|x_1:t) 对所有可能对齐方式积分——关键词在音频里的位置不需要知道，对齐问题被概率消除。
      - generic [ref=f85e76]:
        - heading "多假设聚合" [level=3] [ref=f85e77]
        - text: s(t) = Σ_k P(h_k|x)——不同注册样本解码出的音素序列互补，覆盖发音的自然变异。
      - generic [ref=f85e78]:
        - heading "音频注册（巧思）" [level=3] [ref=f85e79]
        - text: 用户用自己的声音说唤醒词——样本自带口音/语速/发音习惯；跳过 G2P，避免字素→音素转换错误。
      - generic [ref=f85e80]:
        - heading "可解释性" [level=3] [ref=f85e81]
        - text: 音素序列是可读的中间表示——检测失败时查标签哪错了，重新录更好的样本，不是面对黑盒。
