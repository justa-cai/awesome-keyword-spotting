            - listitem [ref=f26e265]: KWS 基线覆盖不全：跨模态侧真正的外部对手只有 Multiview-RNN 一个（其余四个基线无跨模态能力缺席）。
            - listitem [ref=f26e266]: 窗长只扫到 0.6s：对 0.5–2.0s 的训练词，2 秒词在 0.6s 窗下（最坏情况）无数据。
            - listitem [ref=f26e267]: 无统计稳健性：多次运行方差未报告。
