        - paragraph [ref=f26e111]: 两个表示选择的理由：文本侧用音素序列而非字符——音素是语音的直接符号化，音文对齐学的是「声学内容到发音符号」的映射而非拼写的间接映射；音频侧 128 梅尔 / 10ms 帧移保证 0.5 秒短词也有约 50 帧时序分辨率。为什么必须加 DWD：audio-text 对比只拉近匹配对，不约束音频空间自身的类内紧致/类间分离——而 QbE 推理时查询与库都只走音频塔。
