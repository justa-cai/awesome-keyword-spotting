      - generic [ref=f26e24]:
        - heading "一分钟版本" [level=2] [ref=f26e25]
        - list [ref=f26e26]:
          - listitem [ref=f26e27]: 需求：大规模无标注音频检索需要单模型、双模态、双任务——同时支持文本查询（KWS）和语音查询（QbE-STD）。现有 AWE 方法单模态监督、目标割裂、任务特定，且评估协议混乱到不同论文数字不可比。
          - listitem [ref=f26e28]: 方案：CLAP/CLIP 式双塔（3 层 BiLSTM ×2 → 512 维共享空间，单位归一化）+ 两套损失联合——L_at（对称 InfoNCE 音文对齐，可学习温度）+ L_aa（DWD 类质心判别：留一质心 + softmax + 最难负例 hinge，负例免费来自 batch）。
          - listitem [ref=f26e29]: 核心权衡：两个目标互相牵制，最优配置 α₁=0.1 / α₂=1——跨模态项权重只有音音项的十分之一（音频侧判别才是瓶颈，跨模态监督更像正则化）。
          - listitem [ref=f26e30]: 结果：声学视角 85.05% IV / 94.06% OOV AP（DWD 带来 +10 pp）；STD 0.3s 窗 EER 15.71%。但 text-KWS 上加 DWD 反而退化（36.21→51.40）——增益在音频侧任务、代价在跨模态任务，联合优化的边界被完整暴露。
          - listitem [ref=f26e31]: 附加贡献：标准化 trial 协议（3430 万 IV 对 / 30 万 OOV 对）+ 对「OOV AP 高于 IV」反直觉现象的机制解释（trial 密度假象）。
