        - heading "下一步方向（论文展望 + 笔者补充）" [level=3] [ref=f26e269]
        - paragraph [ref=f26e270]: ① 任务自适应损失调度：按任务微调 α₁/α₂ 或两轻量头共享编码器，消除 KWS 负迁移。 ② 端点/切分前端：轻量词边界检测或多窗长融合，直接攻击 0.89→0.45 塌缩。 ③ 自监督底座：wav2vec2/HuBERT 特征替换手工梅尔，或大规模音文预训练 + 100 小时微调，提升 OOV 泛化与噪声鲁棒。 ④ 零资源与多语言迁移：联合目标 + 无监督词发现伪正例结合。 ⑤ 难负例挖掘 + 大 batch：混淆词感知负例（同音不同词、共现词）。 ⑥ 端侧落地：嵌入比对天然适合量化 + ANN 下沉端侧；补参数量/延迟报告并对接 BiFSMN 类二值化后，对嵌入式 KWS 产品才有工程说服力。
