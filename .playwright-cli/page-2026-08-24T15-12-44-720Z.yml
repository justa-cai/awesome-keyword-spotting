        - paragraph [ref=f8e324]: 论文自列：连续数据选项直接梯度下降；面向 TinyML 的新型搜索空间（当前 cell 空间继承自视觉 NAS，未必贴合音频与 MCU）；纳入更多超参优化。 笔者补充：把延迟/SRAM 显式写进搜索目标（Hardware Aware 与 Data Aware 真正统一进同一套可微框架）；多种子统计与 ranking gap 验证；Cortex-M 真机部署测量兑现 TinyML 叙事；数据增强策略本身进数据搜索空间；名字检测改用误接受/误拒绝率评估，直接对齐耳机唤醒的产品指标。
