          - list [ref=f8e316]:
            - listitem [ref=f8e317]: 无统计稳健性：搜索和最终训练都只跑一次，无多种子、无方差——NAS 对种子出了名地敏感，1~4 pp 的提升理应有置信区间。
            - listitem [ref=f8e318]: 基线可能欠调：未用数据增强；MobileNetV3 的 82.76% 明显低于文献常见水平——相对提升可能部分来自基线偏弱。
