          - list [ref=f8e309]:
            - listitem [ref=f8e310]: 混合输入的物理意义存疑：不同窗长/帧移的特征帧在时间轴上本不对齐，逐元素加权平均缺乏信号处理解释——搜索期代理排名与离散化后真实性能之间的 ranking gap 未验证（argmax γ 的配置没被单独评估过）。
