      - generic [ref=f8e24]:
        - heading "一分钟版本" [level=2] [ref=f8e25]
        - list [ref=f8e26]:
          - listitem [ref=f8e27]: 被忽视的设计死角：MFCC 的窗长 / 帧移 / 梅尔滤波器个数在传统流程里是架构搜索之前由工程师凭经验敲定的——输入保真度和模型复杂度在竞争同一份内存算力预算，却被切成先后两段、彼此看不见对方。
          - listitem [ref=f8e28]: 方案：在 PC-DARTS 骨架上给每个候选数据配置（8 个 MFCC 组合）挂一个连续松弛参数 γ，softmax 加权把所有配置混进单一输入——一次前向反传，8 个配置的重要性估计全部得到梯度更新；早停（最大 γ ≥ 2× 次大）后 γ 退出，架构继续搜。
          - listitem [ref=f8e29]: 两个技术补丁：维度对齐（零填充 vs 预处理降维，后者实测更好）；搜索成本可控（GSC 50 epoch / A100 16 小时 / 14.59 GB）。
          - listitem [ref=f8e30]: 结果：GSC 35 词 298K 参数 97.61%（比非数据感知版本同时高 1.13 pp 且省 24% 参数）；名字检测任务几乎零框架改动迁移成功（1.64M / 95.43%，+3.81 pp 且省 41% 参数）。
          - listitem [ref=f8e31]: 最重要的发现：两个任务搜出了不同的最优配置（GSC 选 400/200/40，名字检测选 640/320/40）——最优特征配置是任务相关的，不该由全局惯例一刀切。
