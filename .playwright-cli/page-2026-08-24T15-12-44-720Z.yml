          - text: γ 连续代理机制每个离散数据配置挂一个松弛参数，softmax 加权混进单一输入——一次反传更新全部 8 个配置的重要性估计；这是 DARTS 哲学在数据维度的复制。
        - generic [ref=f8e296]:
          - generic [ref=f8e297]: "3"
          - text: 维度对齐方法学零填充（保信息、处理量大、部署可削）与预处理（省处理、有信息损失风险）两种策略及权衡分析，解决多配置输入与连续松弛的结构性矛盾。
        - generic [ref=f8e298]:
          - generic [ref=f8e299]: "4"
          - text: 双任务验证 + 开源GSC 298K/97.61%；名字检测几乎零框架改动迁移成功 1.64M/95.43%——证明方法不是基准特化的；代码 GitHub 开源（ss1k/Data-Aware-NAS）。
        - generic [ref=f8e300]:
          - generic [ref=f8e301]: "5"
          - text: 最值得记住的实证发现两个任务搜出不同最优配置（GSC 400/200/40 vs 名字检测 640/320/40），且都选 40 梅尔档——特征配置的最优解是任务相关的，全局惯例（如"默认 40/20ms"）对每个任务都要重新审视。这篇论文的价值不在 97.61% 这个数字，而在打通了"数据配置与模型架构同层可微共优化"的干净路径——适合当方法骨架读，不适合当结果榜单读。
