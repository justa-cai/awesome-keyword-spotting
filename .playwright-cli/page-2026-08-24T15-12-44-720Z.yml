            - listitem [ref=f8e312]: 参数量是唯一资源指标：对 MCU 部署，SRAM 激活内存（能不能跑）和延迟（实时性）常比 Flash 参数量更早成为绑定约束——无任何真实硬件测量。
            - listitem [ref=f8e313]: 早停 2 倍阈值是拍脑袋值：无敏感性分析，不同空间大小下的适用性未知。
