  - generic [ref=f101e229]:
    - heading "5 判断：能带走的三句话" [level=2] [ref=f101e230]:
      - generic [ref=f101e231]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f101e232]:
      - generic [ref=f101e233]: JUDGEMENT
      - paragraph [ref=f101e234]: ↳ 约束要进目标函数而不是进过滤器：事后过滤把算力浪费在违规架构上，内嵌惩罚让搜索全程只在可行域内探索——「预算内自由、超预算按量罚」的阶跃设计是把约束翻译成优化语言的干净写法。
      - paragraph [ref=f101e235]: ↳ 计算强度是常被忽略的第三维度：大小管存储、FLOPs 管延迟，FLOPs/byte 管硬件匹配度——同一个 FLOPs 数在 GPU（吃高强度）和 MCU（吃缓存友好）上是两个架构方向，跨硬件部署要三把尺子一起量。
      - paragraph [ref=f101e236]: ↳ 渐进式搜索是「带着知识出发」：从已知好架构小步修改，起点合理、跳跃小、还能复用基线加速评估——搜索空间大时，初始点的质量本身就是最大的搜索加速器。
