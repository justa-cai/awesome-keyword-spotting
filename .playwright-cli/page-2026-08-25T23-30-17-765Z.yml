  - generic [ref=f64e75]:
    - generic [ref=f64e76]: "02"
    - heading "机制：随机路由的两种命运" [level=2] [ref=f64e77]
    - paragraph [ref=f64e78]: 超网络的每个层位置放着多条候选操作（不同卷积、池化、恒等映射）——训练时随机走路径保证每个子架构都被训到，推理时随机走路径获得灵活性。随机路由让不同复杂度的输入命中不同深度的路径：清晰语音走浅窄快速通道（计算少、精度还够），嘈杂模糊的走深宽高精度通道（用算力换准确率）。
