      - generic [ref=f64e106]: 简单输入（清晰语音）
      - generic [ref=f64e107]: → 命中浅层窄路径
      - generic [ref=f64e108]: 路径长 3 层 · 通道窄 · 计算少
      - generic [ref=f64e109]: 快速通过——准确率还够
      - generic [ref=f64e110]: 复杂输入（嘈杂/模糊）
