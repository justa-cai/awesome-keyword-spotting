      - generic [ref=f64e114]: 「随机」的两面性：
      - generic [ref=f64e115]: · 好：无需训练路由器——零额外部件获得灵活性
      - generic [ref=f64e116]: · 坏：同一条输入两次推理可能走不同路径——
      - generic [ref=f64e117]: 输出有随机性；每步都有采样与路径选择开销
      - generic [ref=f64e118]: · 改进方向：确定性路由（RL · 轻量路由网络）
      - generic [ref=f64e119]: 左：超网络每个层位置放多条候选分支——训练与推理都随机走路径。右：随机路由让简单输入省算力、复杂输入保精度——但输出随机性与采样开销是代价
    - generic [ref=f64e120]: 图 2 · 机制解剖：超网络一层的候选分支 · 简单/复杂输入的路径分流与随机的两面性
    - generic [ref=f64e121]:
      - generic [ref=f64e122]: "超网络: 每层位置 × {3×3 卷积 · 5×5 卷积 · 池化 · 恒等} = 候选分支 训练: 每 mini-batch 随机采 1 个子架构更新 + 权重共享(公共部分) 推理: 每输入随机采 1 条路径 → 简单→浅窄快 / 复杂→深宽准 输出: 检测结果 + (隐式) 计算量按输入难度分配"
      - generic [ref=f64e123]: 人话：不训练一个网络，训练一整柜的网络——大衣柜里挂满各种厚度的衣服（架构）；每条音频来了一件，随机抽一件穿：天热（简单输入）抽薄的，天冷（困难输入）抽厚的。衣柜共享衣架（权重共享），所以训练不贵。
    - paragraph [ref=f64e124]: 「随机」的两面性要讲清楚：好的一面是零路由器成本——不用训练额外的路由网络就获得灵活性；坏的一面是输出随机性——同一输入两次推理可能走不同路径，产品场景可能不接受，且每步都有采样与路径选择开销。确定性路由（RL/轻量路由网络）是明确的下一步。
