  - generic [ref=f64e13]:
    - generic [ref=f64e14]: "01"
    - heading "问题：NAS 的静态性是个 bug" [level=2] [ref=f64e15]
    - generic [ref=f64e16]:
      - generic [ref=f64e17]: TL;DR
      - list [ref=f64e18]:
        - listitem [ref=f64e19]: ◆ 传统 NAS 搜出一个固定架构——但最优架构可能因部署环境而异：安静环境浅网就够、嘈杂环境要深网；电量低时还得降计算量。
        - listitem [ref=f64e20]: ◆ 固定架构是一刀切的计算分配——无法在不同条件下动态调整；而输入难度天然不均：有的音频清晰好判、有的嘈杂难判。
        - listitem [ref=f64e21]: ◆ SANAS 的关键区别：适应发生在推理时而非设计时——超网络每层多条候选分支，每个输入随机采一条路径（子架构）。
        - listitem [ref=f64e22]: ◆ 训练用路径采样 + 权重共享：每个 mini-batch 随机采一个子架构更新——所有子架构都能用，训练成本可控。
