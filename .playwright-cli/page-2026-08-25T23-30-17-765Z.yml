  - generic [ref=f64e239]:
    - generic [ref=f64e240]: "05"
    - heading "可迁移的判断" [level=2] [ref=f64e241]
    - generic [ref=f64e242]:
      - generic [ref=f64e243]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f64e244]: ① 固定架构是一刀切的计算分配。
      - generic [ref=f64e245]: ↳ 输入难度分布不均时，按需分配（难多易少）的平均成本天然低于一刀切——先看输入难度分布（KWS 里大部分音频是安静的非关键词段），再决定要不要动态化。
      - paragraph [ref=f64e246]: ② 随机采样是零路由器成本的按需分配。
      - generic [ref=f64e247]: ↳ 不需要训练和运行路由网络就能获得路径多样性——代价是输出随机性；当「平均成本」比「逐条确定性」重要时（离线处理、探索），随机采样是最便宜的方案；产品要确定性就升级到路由器。
      - paragraph [ref=f64e248]: ③ 动态架构的落地由硬件生态决定。
