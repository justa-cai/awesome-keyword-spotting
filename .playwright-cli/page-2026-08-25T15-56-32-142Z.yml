- generic [ref=f289e2]:
  - generic [ref=f289e3]: 论文精读 · 可视化版 · 2021 №15 · 系列基石
  - heading "频谱图当图像、补丁当词： 纯 Transformer 在 KWS 站住了，还不用预训练" [level=1] [ref=f289e4]: 频谱图当图像、补丁当词：纯 Transformer 在 KWS 站住了，还不用预训练
  - generic [ref=f289e5]:
    - generic [ref=f289e6]: Keyword Transformer · Arm ML 实验室
    - generic [ref=f289e7]: Interspeech 2021 · arXiv 2104.00769 · 开源
    - generic [ref=f289e8]: ViT 式补丁嵌入 + CLS + Post-Norm 编码器
    - generic [ref=f289e9]: GSC v2 12 类约 97.5% · 同参数量 +1% vs DS-CNN
  - generic [ref=f289e10]: 一句话：KWS 长期被 CNN 主导，纯 Transformer 因三个担忧（要大数据、O(n²) 复杂度、缺归纳偏置）没人敢用。KWT 把 ViT 的「图像即补丁序列」搬进语音：MFCC 频谱图切成非重叠补丁、线性投影成词、加 CLS 与可学习位置编码、过标准 Post-Norm Transformer 编码器——GSC v2 12 类约 97.5%，同参数量比 DS-CNN 高约 1 个点，且全部从头训练无预训练。它成为后续 Conformer-KWS、线性注意力 KWS 的默认纯注意力对照组。
  - generic [ref=f289e11]:
    - generic [ref=f289e12]: TL;DR
    - listitem [ref=f289e13]: ◈ 三个不敢用的担忧：数据效率（Transformer 通常要大量数据，GSC 相对有限）、计算效率（O(n²) 似乎不适合边缘——但 KWS 序列短（~50 补丁），实际影响有限，这是论文的关键辩护）、归纳偏置（缺 CNN 的平移不变性与局部性）。
    - listitem [ref=f289e14]: ◈ 补丁嵌入：频谱图切成 (P_t×P_f) 非重叠补丁 → 展平 → 线性投影到 D 维 → 序列 (N_p+1)×D（前置可学习 [CLS] token，位置编码加在每个补丁嵌入上）——之后就是标准 Transformer。
    - listitem [ref=f289e15]: ◈ Post-Norm 而非 Pre-Norm：实验发现在 KWS 任务上 Post-Norm 训练更稳——模型小（1–3 层）、序列短，Pre-Norm 的梯度通畅优势在这个尺度不重要，Post-Norm 的正则效应反而有利。大模型的架构经验不可直接搬到小模型任务。
    - listitem [ref=f289e16]: ◈ 三档配置：KWT-1（1 层 · D=64 · 2 头）/ KWT-2（2 层 · D=128 · 4 头）/ KWT-3（3 层 · D=192 · 6 头）；补丁从 (16,16) 到 (32,32) 扫描——中等补丁在 1 秒音频上最优。
    - listitem [ref=f289e17]: ◈ 训练配方：AdamW 权重衰减 0.1 + warmup + 余弦退火 + SpecAugment + 标签平滑 0.1——全部从头训练，无预训练无额外数据，打破了「Transformer 必须大数据」的部分担忧。
    - listitem [ref=f289e18]: ◈ 结果（约值）：GSC v2 12 类 ~97.5%（DS-CNN ~96.5，同参数量 +1%）；35 类 ~200K 参数档最优；KWT-3（~500K）逼近参数量 10 倍的模型；未见说话人泛化优于 CNN（全局韵律是跨说话人稳定线索）。
    - listitem [ref=f289e19]: ◈ 补丁大小三向拉扯：小补丁序列长（细粒度但计算涨）、大补丁序列短（省算力但丢细节）、中等平衡——且要按关键词时长调优（隐性成本）。
    - listitem [ref=f289e20]: ◈ 边界：固定长度输入（无流式）；K/V 内存高于轻量 CNN；可能需要更多数据/增强补归纳偏置；未测噪声/远场/量化。
  - heading "§01 问题：三个让人不敢用纯 Transformer 的担忧" [level=2] [ref=f289e21]:
    - generic [ref=f289e22]: §01
    - text: 问题：三个让人不敢用纯 Transformer 的担忧
  - generic [ref=f289e23]: CNN 的统治与 Transformer 的缺席
  - generic [ref=f289e24]:
    - generic [ref=f289e25]:
      - heading "数据效率的担忧" [level=3] [ref=f289e26]
      - paragraph [ref=f289e27]: Transformer 在 NLP/CV 的成功大多伴着海量数据（BERT、ViT 的 JFT）——GSC 这类 KWS 数据集只有十万级样本，CNN 靠强归纳偏置小数据也能学好，纯 Transformer 似乎先天吃亏。
    - generic [ref=f289e28]:
      - heading "计算效率的担忧" [level=3] [ref=f289e29]
      - paragraph [ref=f289e30]: O(n²) 自注意力对低功耗边缘设备似乎不友好——但论文的关键观察是：KWS 的序列短（~50 个补丁），二次复杂度在这个尺度上实际影响有限。担忧成立与否要算自己的 n。
    - generic [ref=f289e31]:
      - heading "归纳偏置的缺失" [level=3] [ref=f289e32]
      - paragraph [ref=f289e33]: CNN 的平移不变性与局部性恰好适配语音的时频结构；纯 Transformer 没有这些先验——需要靠数据增强（SpecAugment）与训练配方（标签平滑、大权重衰减）把先验「补」回来。
    - generic [ref=f289e34]:
      - heading "研究空白就是机会" [level=3] [ref=f289e35]
      - paragraph [ref=f289e36]: Transformer 在 ASR（Conformer）已经成功，KWS 的纯 Transformer 探索却相对空白——要么它真的不行（有原因），要么只是没人认真试过（有机会）。KWT 押注后者。
