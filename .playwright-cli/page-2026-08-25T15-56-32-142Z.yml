  - generic [ref=f289e328]:
    - generic [ref=f289e329]: 可迁移判断
    - paragraph [ref=f289e330]: ↳ 「必须 CNN 才能小」的假设被打破：纯 Transformer 在十万级样本上从头训练打赢 CNN——范式选择的前提取决于任务尺度，不是架构教条；先算自己的 n（序列长度）再谈 O(n²) 色变。
    - paragraph [ref=f289e331]: ↳ 大模型的架构经验要按尺度重验：Pre-Norm 优于 Post-Norm 是深网经验，1–3 层的小模型上正则效应反而更重要——归一化位置、学习率策略这类「经验」都带尺度标签，搬用前先看标签。
    - paragraph [ref=f289e332]: ↳ 迁移范式的完整移植优于部分借鉴：KWT 把 ViT 的补丁嵌入、CLS、位置编码、训练配方整套搬来再微调——比「在 CNN 上加个注意力层」的混搭更能检验范式本身的上限。
    - paragraph [ref=f289e333]: ↳ 干净的基线是社区基础设施：标准结构 + 开源实现 + 无特殊技巧——KWT 被后续几十篇论文当对照组，不是因为最强，而是因为它「干净到可以当尺子」（与 BC-ResNet 同理）。
