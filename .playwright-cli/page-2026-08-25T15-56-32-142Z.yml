    - generic [ref=f289e303]: §05
    - text: 局限与判断
  - generic [ref=f289e304]: 定长输入 · K/V 内存 · 数据效率
  - generic [ref=f289e305]:
    - img [ref=f289e306]:
      - generic [ref=f289e308]: 边界与延伸
      - generic [ref=f289e310]: 技术边界
      - generic [ref=f289e311]: · 固定长度输入：要求定长频谱图——流式/持续监听场景不能直接用
      - generic [ref=f289e312]: · O(n²) 注意力：补丁增多时计算量涨——好在 KWS 序列短（~50 补丁），
      - generic [ref=f289e313]: 实际影响有限（论文的关键辩护，也是后续线性注意力工作的入口）
      - generic [ref=f289e314]: · 数据效率：缺 CNN 的归纳偏置——可能需要更多数据或更强增强
      - generic [ref=f289e315]: · 推理内存：Transformer 的 K/V 存储高于轻量 CNN
      - generic [ref=f289e317]: 实验边界 + 延伸
      - generic [ref=f289e318]: · 补丁大小要按关键词时长调优（隐性成本）
      - generic [ref=f289e319]: · 未在噪声/远场/自定义关键词下评估
      - generic [ref=f289e320]: · 未探索量化后的性能
      - generic [ref=f289e321]: 延伸：因果/流式 Transformer 做实时 KWS；
      - generic [ref=f289e322]: 线性注意力替代标准注意力（本仓库时序 Lambda /
      - generic [ref=f289e323]: Audiomer 两页正是沿这条路）；加 ConvNet stem 补
      - generic [ref=f289e324]: 归纳偏置提升小数据效率——即后来的 Conformer-KWS
      - generic [ref=f289e325]: 一类混合架构
      - generic [ref=f289e326]: 可迁移判断：纯 Transformer 在小数据/短序列任务上可行——前提是配方到位（强增强+标签平滑+warmup+大权重衰减）；「必须 CNN 才能小」的假设被打破，为后续混合架构提供了纯注意力对照组
