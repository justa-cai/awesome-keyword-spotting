    - listitem [ref=f289e283]: ◈ 「无预训练」是本文最有力的一条：GSC 量级的数据从头训练就能赢 CNN——说明 KWS 这个任务上，注意力的表达力优势不需要大数据背书也能兑现（配强增强 + 好配方）。
    - listitem [ref=f289e284]: ◈ 说话人泛化的机理：全局韵律模式（语调曲线、节奏）跨说话人相对稳定——注意力天然建模全局交互，恰好捕获这类线索（与时序 Lambda、Audiomer 的分析一致）。
    - listitem [ref=f289e285]: ◈ KWT 的准确率数字在本仓库多篇后续论文（WakeUpNet / Audiomer / 时序 Lambda 等）被反复用作对照——引用具体值时以原文 arXiv 2104.00769 为准。
