  - heading "§02 方法：ViT 的完整移植" [level=2] [ref=f289e109]:
    - generic [ref=f289e110]: §02
    - text: 方法：ViT 的完整移植
  - generic [ref=f289e111]: 补丁嵌入 · CLS · 可学习位置编码 · Post-Norm
  - generic [ref=f289e112]:
    - generic [ref=f289e113]: "补丁嵌入: 频谱图 (T×F) → 非重叠补丁 (P_t×P_f) → 展平 → 线性投影 → D 维 序列: [CLS] + N_p 个补丁嵌入 + 可学习位置编码 → (N_p+1)×D 编码器: Post-Norm Transformer × L 层 每层: MHSA(H 头 · D/H 维) → 残差+LN → FFN(4D · GELU) → 残差+LN 分类: CLS 输出 → LayerNorm → 线性层"
    - generic [ref=f289e114]: 人话：把 MFCC 频谱图当成一张小图片，切成不重叠的小块，每块展平后用一个线性层变成一个「词」——于是语音分类变成了 NLP 式的序列分类：CLS 通过注意力从所有补丁收集信息，最后只看 CLS 的输出定类别。全程没有卷积。
  - generic [ref=f289e115]:
    - generic [ref=f289e116]:
      - heading "Post-Norm 的尺度逻辑" [level=3] [ref=f289e117]
      - paragraph [ref=f289e118]: 大模型用 Pre-Norm 是因为深网络梯度流——KWT 只有 1–3 层，梯度通畅不是瓶颈；Post-Norm 的额外正则化反而对 KWS 的小数据有利。架构选择要按任务尺度重新验证，而不是照搬大模型经验——这条判断本身比结论更值钱。
    - generic [ref=f289e119]:
      - heading "补丁大小是新的超参" [level=3] [ref=f289e120]
      - paragraph [ref=f289e121]: CNN 时代调卷积核，Transformer 时代调补丁：它同时决定序列长度（计算量 O(n²) 的 n）与特征粒度。KWS 的 1 秒短音频上中等补丁胜出——但换关键词时长要重扫，这是范式自带的隐性成本。
