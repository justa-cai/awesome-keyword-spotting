          - text: 「每类 4 条样本」的少样本下界证据陌生说话人 GSC 35 错误率相对 −19%、GSC 10 −18.6%；类别稀缺（只见 20/35 类）场景下相对骨干微调反而更有优势——这个反转是全文最有洞察力的实验设计。
        - generic [ref=f71e297]:
          - generic [ref=f71e298]: "3"
          - text: 完整 TinyML 成本量化每 epoch ≈1 MFLOP / 13 µJ、峰值内存 3.6 KB（低全训练三个数量级）、每样本嵌入更新开销低于推理成本 0.3%——端侧个性化在 MCU 预算内成立。
        - generic [ref=f71e299]:
          - generic [ref=f71e300]: "4"
          - text: 精度-能耗折中的量化结论学嵌入以 1/340 FLOPs 拿到完整训练最高 78% 的收益；只更分类器能效高 13 倍但收益少 58%——嵌入是最优精度-能耗折中点。
