      - generic [ref=f71e25]:
        - heading "一分钟版本" [level=2] [ref=f71e26]
        - list [ref=f71e27]:
          - listitem [ref=f71e28]: 痛点：「训练一次、处处部署」正在失效——数据集中代表性不足的说话人（口音 / 性别 / 音高 / 口吃）用 KWS 时准确率系统性下降。收集更多数据的路成本高且长尾无界；把适配收缩为「当前这一个用户」是有限问题——但反传微调与 TinyML 内存预算正面冲突（DS-CNN 完整更新要 1530 KB~13 MB）。
          - listitem [ref=f71e29]: 方案：骨干（DS-CNN）+ 分类器全部冻结；新用户 = 在嵌入查找表里加一行 64 维向量，与骨干激活做逐元素乘法（通道级门控）。在线学习只更新这一行——梯度不用穿骨干，反传计算图深度为 1。
          - listitem [ref=f71e30]: 机制语义：嵌入的每一维是对骨干对应通道的增益——e>1 放大、e<1 抑制、e→0 关闭。说话人基频偏低，就把对其敏感的频谱通道整体调低：学到的不是偏置，是针对自身发声特点的通道增益组合。
          - listitem [ref=f71e31]: 收益：GSC 35 错误率 30.08%→24.34%（相对 −19%），GSC 10 5.33%→4.34%（−18.6%）；类别稀缺（只见 20/35 类）时仍 +10% 相对改善——类别越稀缺，用户特征越重要。
          - listitem [ref=f71e32]: 成本账：以 1/340 的 FLOPs 拿到完整训练最高 78% 的误差收益；峰值内存 3.6 KB（比全训练低三个数量级）；每 epoch 约 13 µJ；骨干不动 → 灾难性遗忘在构造上被规避。
          - listitem [ref=f71e33]: 边界：说话人关联（谁在说话）是硬前提且无方案；只有 6 个测试说话人；结论行文偏乐观（「两个任务都超 6 个百分点」与表格不符，实际 GSC 10 只降约 1 个点）。
