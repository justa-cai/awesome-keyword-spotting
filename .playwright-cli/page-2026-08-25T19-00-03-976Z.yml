    - heading "问题：帧聚合的两难" [level=2] [ref=f334e15]
    - generic [ref=f334e16]:
      - generic [ref=f334e17]: TL;DR
      - list [ref=f334e18]:
        - listitem [ref=f334e19]: ◆ 流式 KWS 逐帧出预测，「这一段是不是唤醒词」要把窗口内几十帧分数聚成一个数——聚合算子的选择直接决定误触发率。
        - listitem [ref=f334e20]: ◆ Max Pooling 能抓最显著证据，但单帧噪声尖峰就能误触发（outlier 一票否决）；Average Pooling 对异常值鲁棒，却把关键词帧的强信号稀释了。
        - listitem [ref=f334e21]: ◆ 本文的两个组件：部分检测器（关键词拆成 K 个音素子段，分别检测）+ Smoothed Max Pooling（softmax 加权聚合，α 在 Max 与 Average 之间连续滑动）。
        - listitem [ref=f334e22]: ◆ 整体分数 = min(P₁…P_K)：所有部分到齐才算数——结构化的防误触发；3–5 个部分是甜点。
