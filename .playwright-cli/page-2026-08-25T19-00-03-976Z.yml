  - generic [ref=f334e87]:
    - generic [ref=f334e88]: "02"
    - heading "机制：α 连续谱与标签生产线" [level=2] [ref=f334e89]
    - paragraph [ref=f334e90]: SmoothMax 的形式很优雅：对窗口内帧分数做softmax 温度加权的期望。α→∞ 时 softmax 退化为 argmax（标准 Max）；α→0 时权重均匀（标准 Average）；中间任何位置都是两者的平滑混合。α 变成可学习参数后，「Max 还是 Average」不再是设计者的二选一，而是梯度替你调的连续旋钮。
    - img [ref=f334e91]:
