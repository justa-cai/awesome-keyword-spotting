      - generic [ref=f334e119]: "Part 1: /HH EY/ Part 2: /S IY R IY/"
      - generic [ref=f334e120]: 标签生成四步：
      - generic [ref=f334e121]: ① 用强制对齐（Force Alignment）跑训练音频
      - generic [ref=f334e122]: ——得到每个音素的时间边界
      - generic [ref=f334e123]: ② 按音素边界把关键词切成 K 个子段
      - generic [ref=f334e124]: ③ 每帧标注：属于 Part k / 不属于任何部分
      - generic [ref=f334e125]: ④ 训练帧级分类器——每部分一套输出
      - generic [ref=f334e126]: 为什么部分比整体好认：
      - generic [ref=f334e127]: · 部分短——窗口内完整出现的概率高
      - generic [ref=f334e128]: · 说话快慢只改变部分间的间距——部分本身稳定
      - generic [ref=f334e129]: · 整体检测要一次框住全部——时序变化全暴露
      - generic [ref=f334e130]: 左：α 是 Max 与 Average 之间的连续旋钮，softmax 权重让高分帧主导但尖峰不再一票否决；演示列里 Max 被一帧噪声顶满、Average 把真证据稀释。右：强制对齐给出音素边界，把「认整句」拆成「认几段」
    - generic [ref=f334e131]: 图 2 · 机制解剖：α 的连续谱与聚合演示 · 部分检测器标签的四步生产线
    - generic [ref=f334e132]:
      - generic [ref=f334e133]: SmoothMax(x₁..xₙ; α) = Σ xᵢ·exp(α·xᵢ) / Σ exp(α·xᵢ) α → ∞ ⇒ Max Pooling （挑最大，outlier 一票否决） α → 0 ⇒ Average Pooling （全平均，强信号被稀释） 整体分 = min(P₁, P₂, …, P_K) （K 个部分分数全到齐才算数）
      - generic [ref=f334e134]: 人话：给每帧分数按「分数高矮」发权重再取加权平均——高分的帧说话声音大，但矮的帧也有票。α 控制话语权集中到什么程度。最后每个部分各聚出一个分数，取最小值：有一个部分没到齐，整体就不算命中。
    - paragraph [ref=f334e135]: 部分检测器的标签来自强制对齐：先用对齐工具跑训练音频得到每个音素的时间边界，按边界把关键词切成 K 个子段，每帧标注属于哪个部分——「认整句」由此拆成「认几段」。部分短，窗口内完整出现的概率高；说话快慢只改变部分间的间距，部分本身稳定——这正是部分检测对时序变化更鲁棒的原因。
