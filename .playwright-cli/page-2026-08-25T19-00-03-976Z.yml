      - generic [ref=f334e113]: · Average：≈0.49 —— 真证据 0.88 被稀释（漏检）
      - generic [ref=f334e114]: · SmoothMax：高分帧权重大，尖峰被概率摊薄——
      - generic [ref=f334e115]: 输出介于两者之间且可学
