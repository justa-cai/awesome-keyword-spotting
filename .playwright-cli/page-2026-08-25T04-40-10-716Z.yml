  - generic [ref=f194e280]: 对时间稳定性的依赖是双刃剑
  - generic [ref=f194e281]:
    - generic [ref=f194e282]:
      - heading "输入越跳变，加速越弱" [level=4] [ref=f194e283]
      - paragraph [ref=f194e284]: 快速语速、爆破音密集的关键词（stop/go）相邻帧差异大，可跳比例降低；跳变信号场景可能无显著加速——方法本质上在「赌」输入平稳。
    - generic [ref=f194e285]:
      - heading "理论加速 ≠ 实测加速" [level=4] [ref=f194e286]
      - paragraph [ref=f194e287]: 4.2–16× 是操作计数估计；判断指令开销、前帧缓存读写、条件分支对流水线的影响都未在 Cortex-M4/RISC-V 等实机上测端到端延迟，功耗能量数据也没有。
    - generic [ref=f194e288]:
      - heading "噪声场景未评估" [level=4] [ref=f194e289]
      - paragraph [ref=f194e290]: 全部实验在干净条件下做。噪声的随机波动会拉大相邻帧差异、降低可跳比例——对常驻 KWS 这是关键场景，缺实验。
    - generic [ref=f194e291]:
      - heading "误差累积 + 单模型验证" [level=4] [ref=f194e292]
      - paragraph [ref=f194e293]: 递归替换每帧引入微小近似误差，层间帧间累积的长期效应无分析；只在 KWT-1（12 层 8 头 64 维）上验证，更大模型（KWT-3 约 3M、AST-Base 约 85M）的冗余度可能不同；也缺与动态深度/动态宽度方法的系统对比。
  - generic [ref=f194e294]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f194e295]
    - list [ref=f194e296]:
      - listitem [ref=f194e297]: ↳ 推理时的计算冗余是「有结构的、可预测的」——结构源于输入的物理特性（时间连续性），不是模型结构的偶然；基于输入特性的动态优化是一整类被低估的方法。
      - listitem [ref=f194e298]: ↳ 剪枝粒度决定信息保留能力：能到特征维度就不要停在 token/头级——「保留有用的一半、丢弃冗余的一半」比「全有或全无」多 3–5 个点。
      - listitem [ref=f194e299]: ↳ 替换成密集值比产生稀疏模式更硬件友好——优化方法要过「通用 CPU 流水线」这一关才算边缘可用。
      - listitem [ref=f194e300]: ↳ 运行时可调的单旋钮（τ）让同一模型覆盖高精度/低功耗两档——比训练多个模型版本便宜得多。
      - listitem [ref=f194e301]: ↳ 与量化正交：一个减少操作数、一个减少单次操作开销，联合估算可达 50–100×——论文没做，留给后人。
