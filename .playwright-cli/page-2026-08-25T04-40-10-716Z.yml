    - generic [ref=f194e4]: 论文精读 · 可视化版 · 2022 №10
    - heading "砍掉八成注意力计算，精度几乎不掉： 免训练的 Delta 剪枝怎么做到" [level=1] [ref=f194e5]: 砍掉八成注意力计算，精度几乎不掉：免训练的 Delta 剪枝怎么做到
    - generic [ref=f194e6]:
      - generic [ref=f194e7]: Delta-KWT · tinyML Research Symposium 2022
      - generic [ref=f194e8]: DTU × Demant × 鲁汶大学
      - generic [ref=f194e9]: 特征维度级动态剪枝 MHSA
      - generic [ref=f194e10]: KWT-1 · GSC V1-12
    - generic [ref=f194e11]: 语音相邻帧频谱相关系数 >0.95——这个被忽略 30 年的老事实，成了 Transformer KWS 边缘部署的杠杆：推理时逐维度判断「变没变」，没变的直接复用前一帧。
    - generic [ref=f194e12]:
      - heading "一分钟版本" [level=3] [ref=f194e13]
      - list [ref=f194e14]:
        - listitem [ref=f194e15]: ▸ 瓶颈：KWT 系列 GSC-12 到 98.4%，但 MHSA 复杂度 O(N²·d)——N=40、d=64 单层约 102,400 次乘加，叠 12 层后吃掉推理的 60–80%。
        - listitem [ref=f194e16]: ▸ 三类老剪枝的不足：结构化/幅度剪枝需要重训（离线、不能按输入动态调）；token 级/头级剪枝「全有或全无」（一帧里判别信息和噪声混着，留不下有用的一半）；非结构化稀疏需要专用硬件（Cortex-M 上条件分支打乱流水线，可能比密集计算还慢）。
        - listitem [ref=f194e17]: "▸ 核心机制：δt[j] = |x_t[j] − x_{t−1}[j]|，小于阈值 τ 的特征维度直接复用前一帧的计算结果——递归应用于 Q/K/V 投影、注意力分数、加权求和三个子步骤。"
        - listitem [ref=f194e18]: ▸ 思想来源：delta cepstrum 是 ASR 经典概念——语音的判别信息在「变化」而非「绝对值」中，相邻帧的「不变部分」是冗余的。
        - listitem [ref=f194e19]: ▸ 核心结果：80% 操作减少时仍 98.4%（损失 <0.1 点，理论 4.2×）；87–94% 减少时损 1–4 点（理论 7.5–16×）。
        - listitem [ref=f194e20]: ▸ 免训练五连：不改架构、免校准数据、免微调、即插即用（任何预训练 KWT 直接加载）、τ 运行时可调（电量/CPU 负载实时权衡精度与效率）。
        - listitem [ref=f194e21]: ▸ 硬件友好：判断只需比较指令（Cortex-M 单周期）；输出仍是密集张量不是稀疏矩阵；内存访问规则；额外存储只有前一帧向量 + d 个布尔。
        - listitem [ref=f194e22]: ▸ 消融：冗余不均匀——底层（层 1–4）可跳 85–90%（低级声学特征变化慢），高层（层 9–12）只有 70–75%（语义特征变化频繁）；元音稳态段可跳 80–90%，辅音过渡段降到 30–50%。
        - listitem [ref=f194e23]: ▸ 细粒度的价值：同 80% 目标下比 token 级剪枝高 3–5 个点——token 级要完全跳过 32/40 帧，Delta 每帧保留 20% 关键变化维度。
        - listitem [ref=f194e24]: ▸ 边界：加速比是操作计数估计非实测；快速语速/爆破音密集词的可跳比例下降；噪声会拉大帧间差异（未评估）；近似误差会累积；只在 KWT-1 一个模型上验证。
    - heading "§01 问题：MHSA 是边缘部署的账单大头" [level=2] [ref=f194e25]:
      - generic [ref=f194e26]: §01
      - text: 问题：MHSA 是边缘部署的账单大头
    - generic [ref=f194e27]: O(N²) 的注意力 × 语音的短时稳定性 = 被浪费的八成计算
    - paragraph [ref=f194e28]: Transformer KWS 的精度优势建立在 MHSA 的全局建模上——区分「yes」和「yet」这类局部相似、全局时间结构不同的词正需要它。但二次复杂度让 12 层模型的 MHSA 占掉推理计算的六到八成。而语音信号有一个被现有剪枝方法系统性忽略的物理特性：短时稳定性——10ms 帧移内相邻帧频谱的相关系数通常 >0.95，相邻帧的注意力计算里藏着大量重复。
    - generic [ref=f194e29]:
      - generic [ref=f194e30]:
        - heading "剪枝要重训 = 没法按输入动态调" [level=4] [ref=f194e31]
        - paragraph [ref=f194e32]: 不同输入样本的计算难度不同（安静语音比噪声语音更「规则」、冗余更多），但结构化/幅度剪枝是离线一次性动作，剪完还要微调恢复——推理时动不了。
      - generic [ref=f194e33]:
        - heading "稀疏计算 ≠ 通用硬件加速" [level=4] [ref=f194e34]
        - paragraph [ref=f194e35]: 非结构化剪枝产生随机分布的零值，需要稀疏张量核心或定制加速器；在 ARM Cortex-M 上要引入大量条件分支和间接索引，实际加速远低于理论值，甚至更慢。
