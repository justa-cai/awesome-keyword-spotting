    - generic [ref=f194e119]: 人话：对每个特征维度做一次绝对差比较——差异小于阈值就认为「这个维度没变，前面的计算结果还能用」。替换在 MHSA 内部递归发生：Q/K/V 投影省矩阵乘、注意力分数差异同步缩小、加权求和跟着省。连续稳定段（元音稳态）内只有第一帧要完整算，后续帧大多数维度一路传递下去。
  - paragraph [ref=f194e120]: 为什么维度级比 token 级强：一个时间帧往往一半是判别信息一半是噪声——token 级剪枝只能整帧留或整帧丢，Delta 在帧内做「选择性计算」：稳定维度跳过、变化维度保留。同 80% 操作减少目标下，token 级要完全跳过 40 帧里的 32 帧（严重信息丢失），Delta 每帧保留 20% 关键变化——这就是 3–5 个点差距的来源。
