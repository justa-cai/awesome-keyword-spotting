      - generic [ref=f114e115]: 人话：英语的「dog」和德语的「Hund」读音毫无相似之处，但两边都能对上「一张狗的照片」。先把英语语音学会「看图」，再用德语标注器把查询词也变成「图」，两边的距离在图像空间里就能比了——图像当了免费的翻译官。
