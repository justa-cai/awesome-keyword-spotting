    - heading "5 判断：能带走的三句话" [level=2] [ref=f114e206]:
      - generic [ref=f114e207]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f114e208]:
      - generic [ref=f114e209]: JUDGEMENT
      - paragraph [ref=f114e210]: ↳ 当两种表示之间没有平行数据，找第三种模态当中介：图像与德语、图像与英语各自有配对数据，德英之间没有——三角传递替代了直接翻译；「中介模态」的选择标准是它与两端都有自然的配对关系。
      - paragraph [ref=f114e211]: ↳ 语义层匹配和词汇层匹配是两个目标：58% 与 91% 的差距全部来自「语义对了但词不同」——评估跨语言系统时严格口径会低估语义能力，宽松口径要配错误分析才有说服力。
      - paragraph [ref=f114e212]: ↳ 视觉 grounding 的能力边界就是概念的「可拍性」：具象名词可以、抽象概念和动词不行——选择中介模态时先问它能表达目标概念的多少，表达不了的部分就是系统的盲区。
