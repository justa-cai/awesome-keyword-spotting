  - generic [ref=f323e77]:
    - generic [ref=f323e78]: "02"
    - heading "机制：RIR 造远场，CORAL 拉分布" [level=2] [ref=f323e79]
    - paragraph [ref=f323e80]: 没有大规模真实远场数据时，信号模拟是标准答案：图像法（Image Method）把声源与麦克风建模为房间内的点，声波 = 直达声 + 各阶镜像虚像叠加——调房间尺寸、墙面反射系数、距离、方向四个参数，就能扫出一整套 RIR 库。近场语音卷上 RIR、再叠噪声，就得到「模拟远场」。
    - img [ref=f323e81]:
      - generic [ref=f323e83]: 机制解剖：RIR 怎么造远场 · CORAL 怎么对齐协方差
      - generic [ref=f323e84]: 远场数据模拟流水线
      - generic [ref=f323e86]: 图像法生成 RIR（Image Method）
      - generic [ref=f323e87]: · 把声源与麦克风建模为房间内的点
      - generic [ref=f323e88]: · 声波 = 直达声 + 各阶虚像（镜像反射源）叠加
      - generic [ref=f323e89]: · 参数化：房间尺寸 · 墙面反射系数 · 距离 · 方向
      - generic [ref=f323e90]: · 扫参数 → 一整套不同房间/距离的 RIR 库
      - generic [ref=f323e92]: 近场语音
      - generic [ref=f323e94]: × RIR 卷积
      - generic [ref=f323e96]: + 环境噪声
      - generic [ref=f323e98]: 模拟远场
      - generic [ref=f323e99]: 多条件训练的数据配比
      - generic [ref=f323e103]: 近场
      - generic [ref=f323e104]: 模拟远场
      - generic [ref=f323e105]: 混合
      - generic [ref=f323e106]: 三路并存——既保近场多样性，又覆盖远场分布
      - generic [ref=f323e107]: CORAL：二阶统计量对齐
      - generic [ref=f323e109]: 源域（近场）与目标域（远场）特征协方差
      - generic [ref=f323e110]: C_s 近场
      - generic [ref=f323e136]: C_t 远场
      - generic [ref=f323e162]: 目标：‖C_s − C_t‖²_F → 0
      - generic [ref=f323e163]: · 一阶对齐（均值）只管「中心对不对」——CORAL
      - generic [ref=f323e164]: 管「形状像不像」：方差与相关性结构
      - generic [ref=f323e165]: · 无需样本配对：两域各算各的协方差即可
      - generic [ref=f323e166]: · 目标域只要无标签数据——远场录音不带标注也行
      - generic [ref=f323e167]: · 代价：d×d 协方差矩阵的计算与显存开销
      - generic [ref=f323e168]: 左：图像法参数化生成 RIR 库，卷积+加噪造出「模拟远场」，三路数据多条件训练。右：CORAL 拉近两个域特征的协方差结构——比均值对齐更强的分布匹配，且不要求样本一一对应
    - generic [ref=f323e169]: 图 2 · 机制解剖：图像法 RIR 生成与三路数据配比 · CORAL 的协方差对齐
    - generic [ref=f323e170]:
      - generic [ref=f323e171]: L_CORAL = ‖C_s − C_t‖²_F / (4d²) C_s, C_t = 源域（近场）/ 目标域（远场）特征的协方差矩阵 L_total = L_CE + λ · L_CORAL
      - generic [ref=f323e172]: 人话：交叉熵管「词分得对不对」，CORAL 管「两个域的特征形状像不像」。只对齐均值是「中心搬到一起」，对齐协方差是「椭球的朝向和胖瘦也要一致」——更强的分布匹配，而且不需要两域样本一一配对，目标域有无标签录音就行。
    - paragraph [ref=f323e173]: 多条件训练是数据层的另一半：原始近场、模拟远场、两者混合三路数据一起喂——既保近场多样性，又覆盖远场分布。CORAL 则在特征层把两域的二阶统计量拉近：一个域上训练的分类器，迁移到另一个域时失配更小。λ 控制域适应强度，是这套框架里最敏感的旋钮。
