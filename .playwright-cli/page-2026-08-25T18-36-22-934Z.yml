      - list [ref=f323e18]:
        - listitem [ref=f323e19]: ◆ KWS 训练数据多是近场录音（干净直达声），但音箱/家电的部署工况是三五米外的远场：混响、距离衰减、环境噪声、混叠掩蔽四重失配一起上。
        - listitem [ref=f323e20]: ◆ 小足迹模型参数容量有限，对域偏移比大模型更敏感——同样的失配，大模型还能扛，小模型直接崩。
        - listitem [ref=f323e21]: ◆ 本文的双层解法：数据层用图像法 RIR 卷积造「模拟远场」+ 三路多条件训练；特征层用 CORAL 损失对齐两域特征的协方差结构。
        - listitem [ref=f323e22]: ◆ 消融显示 RIR 模拟拿到最大头，CORAL 在其上再加增量——两层是叠加关系不是替代。
