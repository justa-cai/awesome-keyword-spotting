      - generic [ref=f323e318]: ↳ 模拟/增强先解决「训练集里有没有见过目标分布」（本文里这一步拿到最大头）；统计量对齐再解决「见过之后特征空间是否还分家」。跳过第一步直接上对齐损失，是在稀疏覆盖上做精细匹配。
