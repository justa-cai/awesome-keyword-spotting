      - generic [ref=f152e24]:
        - heading "一分钟版本" [level=2] [ref=f152e25]
        - list [ref=f152e26]:
          - listitem [ref=f152e27]: 结构性观察（全文的种子）：现代数字 MEMS 麦克风的主流接口就是 PDM——内部 sigma-delta 转换器在传感器侧把声压编码成高速单比特流（幅度大脉冲密、幅度小脉冲稀）。而典型神经形态 KWS 管线要走 ADC → 特征提取 → 脉冲编码 → SNN 四段——即便 SNN 省到极致，前端仍是传统 DSP 那一套，端到端功耗下限被前端锁死。PDM 的物理形态与生物神经的脉冲串本来就同构：三次格式转换里有两次是自找的。
          - listitem [ref=f152e28]: 理论支点（不是类比是等价）：PCM→PDM 转换算法（误差累积 → 过阈发脉冲 → 减阈值）数学上就是软复位、阈值 1 的 Integrate-and-Fire 神经元——发放后减阈值而非清零、余数保留正是 LIF 软复位语义。麦克风里的 sigma-delta 环与 SNN 第一层执行同一种动力学。
          - listitem [ref=f152e29]: 捷径式管线：PDM 比特流直连 5 层 1D 卷积 SNN（ParaLIF-D 可并行神经元），抽取 / 特征 / 编码三级整体消失。第一层 kernel=3α 随过采样比缩放（物理感受野恒定，换 α 不重设计网络）；网络自身构成解调抽取链（α=64 时 1.024MHz → L4 输出 ~400Hz，推导）——第一层卷积 = 网络自己学会「该用什么滤波器解调」，而非 DSP 工程师预先指定。
          - listitem [ref=f152e30]: 结果：GSC 91.54±0.23%，超 SSC 赛道 SOTA（50–80.69%）约 10.9 个点，且 210K 参数比文献最小（280K）还小——「从原始比特流端到端」比「耳蜗模型半熟喂给模型」的更难设定下规模与准确率同时占优。注意对标限于神经形态赛道（GSC 上非脉冲 ANN 普遍 97%+ 的精度代价未讨论）。
          - listitem [ref=f152e31]: 过采样比的对数规律有信号理论根源：1 比特化引入 ~90dB 量化噪声恶化，sigma-delta 的噪声整形把噪声推到高频——过采样买的是「噪声与信号在频谱上分家」的空间，网络学的滤波器在带内积分、高频段衰减。α=1 仍有 70.44%（直接吃 16kHz 一比特粗量化），α=64 达 91.54%，参数只从 185K 涨到 210K。
          - listitem [ref=f152e32]: 最硬的能效证据（事件预算不爆炸）：512 个脉冲神经元每样本平均激活 7.67 个（16kHz，1.5%）→ 0.2 个（1.024MHz，0.04%）——输入采样率涨 64 倍，绝对脉冲率只从 122K 涨到 206K spike/s（1.7 倍）。事件驱动硬件按事件计费，这是「低能耗潜力」最硬的一条。
          - listitem [ref=f152e33]: 反直觉权衡（表 2）：连接砍稀到 94%（210K→71K 参数）精度只掉 ~5 点到 86.42%——但脉冲率反而从 206K 升到 317K spike/s（全连接的平均化与抑制被削弱后神经元更容易单独过阈）。真实神经形态硬件必须按突触操作与胞体操作的单价折算，不能只看参数量宣布省电。
          - listitem [ref=f152e34]: 基础设施贡献：并行 PCM→PDM 转换算法（cumsum→floor→diff 三步无依赖数组运算）把 O(s) 串行反馈环拆成一轮向量化——V100 上最长序列加速最高 10 万倍，PDM 数据集制备从训练瓶颈降为一次性预处理。
          - listitem [ref=f152e35]: 边界：能效是推断非实测（结论章自认下一步上硬件验证）；PDM 是从 GSC PCM 仿真转换的（真实麦克风的器件噪声 / 失调 / 噪声整形谱域差距未处理）；消融在 α=10 做而最佳配置是 64；无同一 PDM 输入下的 ANN / 量化网络对照（范式级问题未回答）；GSC 孤立词分类 ≠ 产品级流式检测——漏检 / 误触发权衡未报告。
    - generic [ref=f152e36]:
      - paragraph [ref=f152e37]: §01 · 问题陈述
      - heading "KWS 的成本模型是「连续跑一个月耗多少电」" [level=2] [ref=f152e38]
      - generic [ref=f152e40]: 为什么神经形态契合 KWS 的负载画像：事件驱动 =「没有脉冲就没有计算」，静音时段功耗趋近零——与 KWS「绝大部分时间在听噪声、极小部分时间在算语音」天然契合。但典型管线的四段加工（ADC / 特征 / 编码 / SNN）里前三段是传统 DSP：抽取滤波器要在 DSP 常驻（2.1 节）、STFT/MFCC 是乘加阵列、脉冲编码器再做一次格式翻译——付费买的只是几十年积累的频谱特征工程惯性。
      - generic [ref=f152e41]: 已有方案在加级而非减级：NAS（PDM→PFM 神经形态听觉传感器）与 SCTN（脉冲连续时间神经元预处理）解决的是接口兼容，没质疑中间级该不该存在；耳蜗模型路线（水动力基底膜 + 毛细胞 + 灌木细胞）生物仿真级联参数多、计算重、特征级固定无法对分类损失端到端优化；SSC 赛道 SOTA 网络 280K–10M 参数、准确率只有 50–80.69%——SSC 编码阶段自带时频分解、模型任务更轻，仍没突破 81%。
      - generic [ref=f152e42]: 三个挑战：采样率的量级问题——PDM 过采样比 64 时达 1.024MHz（实验）/ 3MHz（48kHz 目标），百万时间步的序列式 BPTT 完全不可行；从近乎全噪声的单比特流学特征——16bit→1bit 约 90dB 量化噪声恶化，砍掉特征提取后网络要同时完成「解调、去噪、特征提取、分类」四件事；数据集格式障碍——105,829 条 GSC 语料全部转 PDM，串行递推转换可能卡死训练迭代。
