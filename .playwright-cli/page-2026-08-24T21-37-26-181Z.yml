      - paragraph [ref=f152e15]: 作者：Sidi Yaya Arnaud Yarga、Sean U N Wood —— 舍布鲁克大学（加拿大 · NECOTIS 实验室）
      - paragraph [ref=f152e16]: 发表：arXiv 2408.05156（2024-08，ICASSP 格式短文）· 代码开源 github.com/NECOTIS
