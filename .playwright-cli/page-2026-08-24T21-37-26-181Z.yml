      - generic [ref=f152e116]: 数据与指标：GSC v2（105,829 条 · 35 词 · 84,843/9,981/11,005 划分），全部按过采样比转成 PDM。三个指标的设计体现神经形态视角：事件驱动芯片的能耗近似正比于事件数而非样本数——分类准确率（效果）+ 网络脉冲率 SR（能耗代理）+ 参数量（突触存储与操作成本）合起来才是「能效潜力」的完整证据链，单独报准确率没有意义。全部实验 5 次随机初始化 × 150 epoch 报均值±标准差。
