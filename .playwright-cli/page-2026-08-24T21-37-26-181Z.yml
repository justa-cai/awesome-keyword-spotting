        - text: qe ← qe + x[n]； 若 qe > 0 则 y[n]=1 否则 y[n]=0； qe ← qe − y[n]
        - generic [ref=f152e110]: 算法 1（改造版）· PCM→PDM 串行转换：把输入累积进误差变量，误差为正就发一个脉冲并减 1——论文原话「等价于一个软复位、发放阈值为 1 的 Integrate and Fire 神经元」。软复位的关键：发放后 qe 减去阈值而非清零，余数被保留（LIF 软复位语义）。输出从 ±1 改为 0/1 与 SNN 脉冲记法一致，「转换器即 I&F 神经元」的等价关系直接可见。
      - generic [ref=f152e111]: 组件各自解决一个问题：1D 卷积管并行与局部频率（超长时域二值信号上把训练跑起来的前提）；第 3/4 层循环管长时依赖（循环项由膜电位过 ReLU 后回馈——截断负反馈避免震荡发散，让网络自己决定「记住什么」）；隐层后随机固定延迟 [0–30] 时间步管脉冲同步（不同时刻的脉冲经不同延迟在目标神经元对齐；各层时间步物理时长不同 → 免费的跨时间尺度延迟谱，零参数零计算成本）；时间平移增广 [−0.3, 0.3]s 管时间鲁棒。训练：surrogate gradient + Adamax（lr 0.002）+ reduce-on-plateau。
