      - generic [ref=f326e312]: ↳ 三个物理旋钮的高斯参数化牺牲一点上限，换来全条件一致的可预期收益和可读的形状——可解释性不只是好看，它让「为什么涨」可验证，让失败可归因。
      - paragraph [ref=f326e313]: ③ 通用设计对专用任务是未优化的默认值。
      - generic [ref=f326e314]: ↳ Mel 刻度、MFCC、甚至许多「标准组件」都是为通用场景设计的默认值——任务特殊性强（词表小、判别集中）时，问一句「这个默认值为我优化过吗」，常能找到免费收益。
    - paragraph [ref=f326e315]: 系列坐标：本文（2020）是 KWS 滤波器组学习的首探；others 目录的 trainable frontend 面向远场鲁棒走同一问题的鲁棒性分支；2022 年可训练基函数把谱系延伸到倒谱域（MFCC 基的端到端学习）——「前端进训练循环」这条线在 KWS 里持续推进。
