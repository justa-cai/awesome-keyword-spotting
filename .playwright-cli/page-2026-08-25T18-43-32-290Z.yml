      - generic [ref=f326e310]: ↳ 前端学习只在训练期花成本，部署时和固定 Mel 一模一样快——这类「训练期投资、推理期免费」的方法，在功耗敏感的端侧应该优先排查，剩余收益常比换架构便宜。
