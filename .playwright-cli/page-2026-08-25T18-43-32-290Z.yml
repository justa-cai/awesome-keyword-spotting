        - generic [ref=f326e252]: "1"
        - paragraph [ref=f326e253]: 低 SNR 下优势更明显。判别频段的精细分辨率在噪声里更值钱——信噪比高时特征差异够大，精细滤波锦上添花；信噪比低时这就是救命的那点分辨率。
      - generic [ref=f326e254]:
        - generic [ref=f326e255]: "2"
        - paragraph [ref=f326e256]: 形状会说话。学习滤波器与 Mel 的差异集中在元音 F1/F2 共振峰区，且带宽系统性地更窄——「学到了任务结构」有直接证据，不是碰运气的涨点。
      - generic [ref=f326e257]:
        - generic [ref=f326e258]: "3"
        - paragraph [ref=f326e259]: 约束法的可解释性是独有资产。无约束法即使涨更多，也画不出可读的频响形状——排错、分析、迁移都缺抓手。工程上「能解释的 0.7%」常常优于「不能解释的 1.0%」。
