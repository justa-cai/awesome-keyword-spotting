  - generic [ref=f326e13]:
    - generic [ref=f326e14]: "01"
    - heading "问题：通用特征对小任务的次优性" [level=2] [ref=f326e15]
    - generic [ref=f326e16]:
      - generic [ref=f326e17]: TL;DR
      - list [ref=f326e18]:
        - listitem [ref=f326e19]: ◆ Mel 滤波器组基于人类听觉感知模型，为通用语音设计——没有任何一步是「为了 KWS 分得更准」。
        - listitem [ref=f326e20]: ◆ KWS 的三个特殊性给了学习空间：词表小（不需全语音空间）、关键词短（频谱统计特殊）、判别频段集中（差异集中在特定频段，通用滤波器却把预算均匀撒开）。
        - listitem [ref=f326e21]: ◆ 两条路线的权衡：约束法（高斯形 + 三个物理旋钮）稳定可解释；无约束法（自由权重向量）上限更高但过拟合风险大。
        - listitem [ref=f326e22]: ◆ 最有说服力的是形状分析：学到的滤波器在元音 F1/F2 共振峰区分配更窄带宽——系统性差异，不是随机扰动。
