  - generic [ref=f326e82]:
    - generic [ref=f326e83]: "02"
    - heading "机制：三个旋钮与端到端梯度" [level=2] [ref=f326e84]
    - paragraph [ref=f326e85]: 约束法的参数化非常克制：每个滤波器保持高斯形状，只开放中心频率（在哪听）、带宽（听多宽）、增益（听多响）三个旋钮。在功率谱域上操作，满足非负与归一化约束——学完的滤波器画出来就是一条频响曲线，能直接和 Mel 三角对比，「它在听哪里」一眼可见。
    - img [ref=f326e86]:
      - generic [ref=f326e88]: 机制解剖：一个高斯滤波器的三个旋钮 · 端到端梯度怎么到前端
      - generic [ref=f326e89]: 约束法：高斯滤波器参数化
      - generic [ref=f326e91]: H(f)
      - generic [ref=f326e92]: 频率 →
      - generic [ref=f326e143]: 中心频率 f_c
      - generic [ref=f326e144]: 窄带宽高增益
      - generic [ref=f326e145]: 每个滤波器三个可学习旋钮：
      - generic [ref=f326e146]: · 中心频率 f_c —— 在哪听
      - generic [ref=f326e147]: · 带宽 σ —— 听多宽
      - generic [ref=f326e148]: · 增益 g —— 听多响
      - generic [ref=f326e149]: 高斯形状保证平滑与可解释——学完能直接
      - generic [ref=f326e150]: 画出形状与 Mel 对比，不是黑箱
      - generic [ref=f326e151]: 端到端训练的数据流
      - generic [ref=f326e153]: 四段流水线，两冻两学：
      - generic [ref=f326e154]: 音频 → [STFT 功率谱]（固定）
      - generic [ref=f326e155]: → [滤波器组 g·exp(−(f−f_c)²/2σ²)]（学习）
      - generic [ref=f326e156]: → [log 压缩]（固定）
      - generic [ref=f326e157]: → [CNN 分类器]（学习）→ CE 损失
      - generic [ref=f326e158]: 梯度路径：∂L/∂分类器 → 反传过 log →
      - generic [ref=f326e159]: 到滤波器组层 → 更新 f_c · σ · g ——前端
      - generic [ref=f326e160]: 「为了分类更准」而变形
      - generic [ref=f326e161]: 为什么 log 也固定：对数压缩的动态范围
      - generic [ref=f326e162]: 压缩是数值稳定需要，学习它收益小扰动大
      - generic [ref=f326e163]: 左：约束法把每个滤波器压成三个物理旋钮——中心频率、带宽、增益，高斯形状保证平滑可解释。右：端到端联合训练让前端滤波器「为分类服务」——这是特征学习区别于特征工程的地方
    - generic [ref=f326e164]: 图 2 · 机制解剖：高斯滤波器的三个可学习旋钮 · 端到端流水线的冻结/学习分工
    - generic [ref=f326e165]:
      - generic [ref=f326e166]: Hᵢ(f) = gᵢ · exp( −(f − f_c,i)² / (2σᵢ²) ) ← 每个滤波器 3 个可学习参数 loss = CE( CNN( log( H · |STFT(x)|² ) ), y ) ← 梯度回传到 f_c · σ · g
      - generic [ref=f326e167]: 人话：流水线四段两冻两学——STFT 和 log 压缩固定，滤波器组层和 CNN 分类器学习。分类误差的梯度一路传回前端，滤波器「为了分类更准」而变形：把带宽收窄到信息密集的频段，把增益从没用的频段撤走。
    - paragraph [ref=f326e168]: 为什么 log 压缩也固定？对数的动态范围压缩是数值稳定的需要，学习它收益小、扰动大。这个「冻结什么、学习什么」的划分本身就是工程判断：把学习容量留给最有任务特异性的环节。
