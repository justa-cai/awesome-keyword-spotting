- generic [ref=f283e2]:
  - generic [ref=f283e3]: 论文精读 · 可视化版 · 2021 №12
  - heading "原始波形直接进网络： Xception 搬进音频，统计显著超过人类标注员" [level=1] [ref=f283e4]: 原始波形直接进网络：Xception 搬进音频，统计显著超过人类标注员
  - generic [ref=f283e5]:
    - generic [ref=f283e6]: Xception-1d · 瓦伦西亚大学 IDAL
    - generic [ref=f283e7]: ESANN 2021 · arXiv 2110.07498 · 开源
    - generic [ref=f283e8]: 原始波形 16000 点 · 无 MFCC · Instance Norm
    - generic [ref=f283e9]: GSC v2 35 词 95.85%（人类 94.15 · p=0.015）
  - generic [ref=f283e10]: 一句话：把 CV 大获成功的 Xception（深度可分离卷积）做 1D 适配，1 秒 16kHz 原始波形直接进网络——Entry 流五级下采样把 16000 点压到 256 帧，Middle 流在不降维的空间学抽象，分类流用 Dropout 0.75 压住 65K 参数 FC。配五件套随机增强（×5 扩增）与 Instance Norm（逐样本归一化适配音频幅度差异），GSC v2 的 35 词与 20 命令任务上统计显著超过 4 人人类标注基线（p=0.015 / 0.027）。
  - generic [ref=f283e11]:
    - generic [ref=f283e12]: TL;DR
    - listitem [ref=f283e13]: ◈ 研究问题一句话：CV 的成功架构（Xception）经合理的 2D→1D 维度适配，能否直接从原始波形做端到端 KWS，并超越基线乃至人类？答案是可以——而且「超人类」有 t 检验背书。
    - listitem [ref=f283e14]: ◈ 三模块架构：Entry 流（5 块，通道 32→728，时间 16000→256，步长 4/2/2/2/2，核 9→3）负责压缩；Middle 流（8 块 × 3 层 DS 卷积，维度不变）学高层次抽象；分类流（1024/1536/2048 → 展平 → Dropout 0.75 → FC）出结果。
    - listitem [ref=f283e15]: ◈ 两个关键选型：深度可分离卷积（空间与通道解耦，计算量仅标准卷积的 1/(N·S)）与 Instance Norm 替代 BatchNorm——不同录音的幅度/能量分布差异大，逐样本归一化先抹平「这段录音多响」，判别只看时频结构。
    - listitem [ref=f283e16]: ◈ 五件套增强 ×5：重采样（时长+音高同变）、饱和、时间偏移、白噪声、音高偏移——五种变换同时以随机参数/强度施加，高变异样本追加进数据集。
    - listitem [ref=f283e17]: ◈ 人类基线：4 名标注员标约 1000 条命令，Student t 检验（α=0.05）——首次在 GSC 上建立人类参照，让「超过人类」成为统计声明而非口号。
    - listitem [ref=f283e18]: ◈ 结果（v2）：35 词 95.85%（人类 94.15，p=0.015 显著超）、20 命令 95.96%（p=0.027 显著超）、10 命令 97.54%（与人类无显著差）、left-right 99.25%（略输 99.40）——任务越难优势越大。
    - listitem [ref=f283e19]: ◈ 误差带极窄（±0.03~0.16，5 个随机初始化）——结果的稳定性本身就是可信度证据。
    - listitem [ref=f283e20]: ◈ 有趣的辅助任务效应：left/right 在 35 词多类任务里的逐类性能高于 left-right 二分类任务——更大词表作为「更难的辅助任务」反哺特征提取（观察性发现，无因果验证）。
    - listitem [ref=f283e21]: ◈ 边界：无流式（固定 1 秒整段输入）；原始波形的 Entry 流计算是明账（省了特征提取、付了入口计算）；TinyML 声称无实测；ESANN 5 页无消融。
  - heading "§01 问题：CV 架构能否直接进音频" [level=2] [ref=f283e22]:
    - generic [ref=f283e23]: §01
    - text: 问题：CV 架构能否直接进音频
  - generic [ref=f283e24]: 四类现有方法的局限 + 端到端的诱惑
  - generic [ref=f283e25]:
    - generic [ref=f283e26]:
      - heading "四类方法的短板" [level=3] [ref=f283e27]
      - paragraph [ref=f283e28]: RNN+双向注意力精度高但计算大、不适合资源受限设备；门控卷积 LSTM 结构复杂；标准 CNN 效率好但复杂任务准确率不足；迁移学习要额外预训练数据、灵活性差——各有各的痛。
    - generic [ref=f283e29]:
      - heading "手工特征的信息损失" [level=3] [ref=f283e30]
      - paragraph [ref=f283e31]: MFCC 等手工特征是先验的强假设——它们保留了设计者认为重要的信息，也可能丢掉了判别需要的信息。原始波形端到端让网络自己决定听什么，避免这层损失。
    - generic [ref=f283e32]:
      - heading "维度适配的赌注" [level=3] [ref=f283e33]
      - paragraph [ref=f283e34]: Xception 在 CV 的成功说明「深度可分离卷积 + 极简堆叠」是强归纳偏置——2D 改 1D（时间维卷积）后这个偏置是否仍成立，正是本文要验证的核心假设。
    - generic [ref=f283e35]:
      - heading "端到端的代价要认清" [level=3] [ref=f283e36]
      - paragraph [ref=f283e37]: 原始波形 16000 点 vs MFCC 的低维输入——省了特征提取的计算，付了 Entry 流把 16000 点压下来的计算。这笔账本文没算（无延迟实测），是端到端路线的通用暗坑。
