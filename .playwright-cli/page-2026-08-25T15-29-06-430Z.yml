  - generic [ref=f283e296]: 四点：从架构迁移到评测范式
  - generic [ref=f283e297]:
    - generic [ref=f283e298]:
      - generic [ref=f283e299]: "1"
      - paragraph [ref=f283e300]: Xception-1d 架构：Xception 的一维适配首次用于端到端 KWS——DS 卷积 + Instance Norm 组合，无手工特征下超越人类标注水平；证明 CV 成功设计可迁移到语音。
    - generic [ref=f283e301]:
      - generic [ref=f283e302]: "2"
      - paragraph [ref=f283e303]: 五件套增强方法论：多变换同时施加 + 参数随机化的组合策略，×5 扩增有效提升泛化——简单但有效，可直接抄。
    - generic [ref=f283e304]:
      - generic [ref=f283e305]: "3"
      - paragraph [ref=f283e306]: 人类性能基线：首次在 GSC 上建立人类水平参照 + t 检验协议——给「超过 X」类声明提供了证据格式。
    - generic [ref=f283e307]:
      - generic [ref=f283e308]: "4"
      - paragraph [ref=f283e309]: 开源可复现：完整代码仓库（ivallesp/Xception1d），促进基准比较与方法复现。
  - heading "§05 局限与判断" [level=2] [ref=f283e310]:
    - generic [ref=f283e311]: §05
    - text: 局限与判断
  - generic [ref=f283e312]: 无流式 · 无实测 · 无消融
  - generic [ref=f283e313]:
    - img [ref=f283e314]:
      - generic [ref=f283e316]: 边界与延伸
      - generic [ref=f283e318]: 技术边界
      - generic [ref=f283e319]: · 流式缺失：整段 1 秒输入，无增量推理——语音助手的音频
      - generic [ref=f283e320]: 是连续流到达的，需要因果卷积 + 累积推理的适配
      - generic [ref=f283e321]: · 词汇量仅 35 词：数百关键词的扩展性未验证
      - generic [ref=f283e322]: · 固定输入长度：更短/更长的命令要对齐或截断
      - generic [ref=f283e323]: · 端到端的计算代价：原始波形 16000 点（vs MFCC 的低维），
      - generic [ref=f283e324]: Entry 流的计算量是明账——省了特征提取、付了入口计算
      - generic [ref=f283e326]: 实验边界 + 延伸
      - generic [ref=f283e327]: · 缺同期端到端对比（SincNet / wav2vec 2.0 微调）
      - generic [ref=f283e328]: · TinyML 声称无实测：延迟/内存/能耗未测
      - generic [ref=f283e329]: · ESANN 5 页篇幅：消融研究缺失
      - generic [ref=f283e330]: · 无模型大小-准确率权衡分析（如减 Middle 块数）
      - generic [ref=f283e331]: 延伸：流式适配（因果卷积 + 累积推理）；更大词表验证；
      - generic [ref=f283e332]: 量化/剪枝/蒸馏上边缘；DS 卷积 + 注意力结合；多任务
      - generic [ref=f283e333]: （VAD/说话人识别作辅助）
      - generic [ref=f283e334]: 可迁移判断：CV 成功架构经维度适配可直接进音频——先试「迁移+适配」再谈「重新设计」；人类基线 + 显著性检验应成为「超过 X」类声明的标配证据格式
    - generic [ref=f283e335]: 图4 · 边界与延伸：左技术边界（无流式、词汇量 35、固定长度、原始波形的入口计算代价），右实验边界（缺 SincNet/wav2vec 对比、TinyML 无实测、5 页无消融）+ 延伸方向。
  - generic [ref=f283e336]:
    - generic [ref=f283e337]: 可迁移判断
    - paragraph [ref=f283e338]: ↳ 先试「迁移 + 适配」，再谈「重新设计」：Xception 的 2D→1D 适配直接拿到超人类结果——领域问题常常不需要新架构，需要的是把成熟架构的归纳偏置正确搬到自己的数据结构上。
    - paragraph [ref=f283e339]: ↳ 人类基线 + 显著性检验应成为标配：与其说「达到 95.9%」，不如说「显著超过人类标注员（p=0.015）」——锚点明确、可检验；建一次人类基线，整个后续文献都有了参照系。
    - paragraph [ref=f283e340]: ↳ 逐样本归一化适配幅度差异：音频的响度不是判别信息而是录音条件的产物——Instance Norm 把这层变化在入口抹平，比让模型学会「忽略响度」更直接。
    - paragraph [ref=f283e341]: ↳ 端到端不是免费的：跳过特征提取省了流水线，但原始波形的入口计算是明账——评估端到端方案必须把 Entry 流的代价与特征提取的代价放在同一张账单上比。
