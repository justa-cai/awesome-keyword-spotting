    - generic [ref=f283e108]: §02
    - text: 方法：压缩、抽象、判别三段式
  - generic [ref=f283e109]: Entry 大步长下采样 · Middle 不降维提抽象 · Dropout 压 FC
  - generic [ref=f283e110]:
    - generic [ref=f283e111]: "Entry: 5 块 · 通道 32→64→128→256→728 · 时间 16000→256（步长 4/2/2/2/2）· 核 9→3 Middle: 8 块 · 每块 3 层深度可分离卷积 · 通道 728 · 时间 256（步长 1） 分类: DS 卷积 1024→1536→2048 → 展平 → Dropout(0.75) → FC（约 65K 参数） 正则: L2 权重衰减 λ=1e-3 · Dropout 0.75（专防 FC 过拟合） 增强: 重采样 + 饱和 + 时间偏移 + 白噪声 + 音高偏移（随机参数同时施加，×5 扩增）"
    - generic [ref=f283e112]: 人话：先把 16000 个采样点用大步长快速压到 256 帧（Entry 是计算大头），再在不降维的空间里反复提抽象（Middle 的 8 块都步长 1），最后 2048 维特征展平接 FC——65K 参数的 FC 靠 75% Dropout 压过拟合。五种增强同时上、参数随机，一条音频变五条高变异样本。
  - generic [ref=f283e113]:
    - generic [ref=f283e114]:
      - heading "Instance Norm 的适配逻辑" [level=3] [ref=f283e115]
      - paragraph [ref=f283e116]: 音频幅度/能量因麦克风距离、增益、信道而异——BatchNorm 的逐批统计被跨样本差异污染。Instance Norm 逐样本归一化：把「这段录音自身多响」先抹平，判别只依赖时频结构——对幅度敏感的任务是通用偏好。
    - generic [ref=f283e117]:
      - heading "人类基线的协议" [level=3] [ref=f283e118]
      - paragraph [ref=f283e119]: 4 名标注员 × 约 1000 条命令 → 人类水平（35 词 94.15±1.03%）→ Student t 检验（α=0.05）判定差异显著性。模型 5 个随机初始化报均值±标准差——两边的方差都有交代，「超过人类」才是统计声明。
