  - generic [ref=f283e288]:
    - generic [ref=f283e289]: 读表要点
    - listitem [ref=f283e290]: ◈ 规律的形状：任务越难（词表越大），相对人类与基线的优势越明显；最易的 left-right 大家都到天花板，架构差异不再重要——这个梯度本身说明优势来自表示能力而非偶然。
    - listitem [ref=f283e291]: ◈ 逐类分析：混淆集中在声学真正相近的词对（three↔tree、follow↔four、bed↔bird）——错误有声学道理，不是随机噪声。
    - listitem [ref=f283e292]: ◈ 辅助任务效应：left/right 在 35 词任务里的逐类性能高于二分类任务——更大词表作为更难的辅助任务迫使特征更判别（观察性发现，与多任务学习思路相通）。
    - listitem [ref=f283e293]: ◈ v1 结果同构（35w/20c 亦 p<0.05 超人类）——结论对数据集版本稳健。
