    - listitem [ref=f307e265]: ◈ 获胜系统远超基线是赛场的成功指标——基线的职责是「可复现的零点」而非「最强系统」；刻意简单（未用 ECAPA-TDNN/Conformer）正是给参赛者留改进空间。
