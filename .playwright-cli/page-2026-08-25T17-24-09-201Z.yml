  - generic [ref=f307e132]:
    - generic [ref=f307e133]: "数据: 注册语音（每说话人的注册录音） + 正样本（注册人×唤醒词） + 负样本（他人唤醒词 + 非唤醒词 + 噪声） 指标: FRR（注册用户被拒） · FAR（他人/非词被接受） · DCF · EER · DET 任务: 1 = 词对 ∧ 人对 2 = 复杂声学条件（噪声/远场） 基线: 单阶段（联合预测） vs 两阶段（KWS → SV 串联 + 融合）"
    - generic [ref=f307e134]: 人话：数据设计的关键是三类样本覆盖个性化触发的完整拒绝面——不仅要「认得出主人说唤醒词」，还要「拒得掉他人说同一词、任何人的非唤醒词、以及纯噪声」。指标体系把这四种错误放进同一张权衡表。
  - generic [ref=f307e135]:
    - generic [ref=f307e136]:
      - heading "两任务分开计分的用意" [level=3] [ref=f307e137]
      - paragraph [ref=f307e138]: 任务 1（干净条件）量方法上限、任务 2（噪声/远场）量真实可用性——合成一个分数会掩盖「干净 98% 但噪声 70%」这类致命缺陷。分开计分让鲁棒性可见。
    - generic [ref=f307e139]:
      - heading "两阶段胜出的机理" [level=3] [ref=f307e140]
      - paragraph [ref=f307e141]: KWS 与 SV 的最优表示不同（词形 vs 声纹）——单阶段的联合训练让两个损失在同一骨干上打架；两阶段各自用最优模型、串联时只交换分数——结构解耦换来各自最优，代价是两次推理。
