  - generic [ref=f307e310]:
    - generic [ref=f307e311]: 可迁移判断
    - paragraph [ref=f307e312]: ↳ 开放基准把不可比变成可比：同一数据 + 同一指标 + 同一协议——数字才能直接对话。设施类贡献（数据+指标+基线）对领域的长期价值不亚于任何单篇算法论文；判断一个子领域是否成熟，看它有没有这样的赛场。
    - paragraph [ref=f307e313]: ↳ 基线的职责是「可复现的零点」：刻意简单的基线 + 公开配方 = 所有后续工作的公共起点——「比基线好多少」成为标准句式。基线越强越难超越、越弱越没有参考价值；「简单、干净、可跑」是平衡点。
    - paragraph [ref=f307e314]: ↳ 级联融合前先校准是普适规律：本页与 №1、№18 的结论三度一致——分开训练的模块得分尺度必然错配；一行 Platt Scaling 的期望收益大于换更复杂的融合器。
    - paragraph [ref=f307e315]: ↳ 把「干净」与「困难」分开计分：两任务协议让鲁棒性可见——单一平均分掩盖「干净极好、噪声崩坏」的失衡；任何部署导向的评测都值得抄这个设计。
