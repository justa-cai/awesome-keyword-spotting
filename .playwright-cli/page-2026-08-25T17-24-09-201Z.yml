  - generic [ref=f307e22]: 四个让研究无法对话的缺口
  - generic [ref=f307e23]:
    - generic [ref=f307e24]:
      - heading "不可比的数字" [level=3] [ref=f307e25]
      - paragraph [ref=f307e26]: 不同研究组用不同私有数据集和评估协议——「我的 3.2% 比你的 3.5% 好」无从谈起；指标选择还能让同一系统的排名颠倒。个性化触发的研究长期处于这种碎片状态。
    - generic [ref=f307e27]:
      - heading "个性化数据尤其稀缺" [level=3] [ref=f307e28]
      - paragraph [ref=f307e29]: 普通 KWS 尚有 GSC 等公开集，个性化触发需要「注册说话人」维度的配对数据——各公司的内部数据含真实用户声纹，公开难度更大。学术界几乎无米下锅。
    - generic [ref=f307e30]:
      - heading "融合策略是悬而未决的工程题" [level=3] [ref=f307e31]
      - paragraph [ref=f307e32]: KWS 与 SV 的得分组合（乘法/加权/SVM）缺乏系统比较——每个团队各自试各自的。挑战赛把这件事变成受控实验：同数据同指标下横比四种策略。
    - generic [ref=f307e33]:
      - heading "设施类贡献的定位" [level=3] [ref=f307e34]
      - paragraph [ref=f307e35]: 本文不是方法论文——它的贡献是让整个领域「能开始比较」。与 LibriKWS（№22 顺带发布）、LibriSpeech 对齐标注（KeySEM 的数据来源）同属一类：基础设施的杠杆效应常大于单篇算法。
