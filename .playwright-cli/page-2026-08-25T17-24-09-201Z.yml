  - heading "「只听主人话的唤醒」缺一个赛场： PVTC2020 把数据、指标、基线一次配齐" [level=1] [ref=f307e4]: 「只听主人话的唤醒」缺一个赛场：PVTC2020 把数据、指标、基线一次配齐
  - generic [ref=f307e5]:
    - generic [ref=f307e6]: PVTC2020 · 厦门大学 + 昆山杜克
    - generic [ref=f307e7]: arXiv 2101.01935 · 基准设施论文
    - generic [ref=f307e8]: 唤醒词「Nihao Wenwen 你好问问」· 近/远场 · 安静/噪声
    - generic [ref=f307e9]: 开放数据 + 5 类指标 + 两基线 + 4 融合策略系统比较
  - generic [ref=f307e10]: 一句话：个性化触发（只响应注册用户的唤醒词）此前散落在各私有数据集与互不兼容的指标上——研究之间无法公平比较。PVTC2020 一次配齐赛场三件套：开放数据库（「你好问问」多说话人、近/远场、安静/噪声、注册/正/负三类样本）、标准化指标体系（FRR/FAR/DCF/EER/DET + 两任务协议）、可复现双基线（单阶段联合 vs 两阶段 KWS+SV 串联）。基线结论：两阶段几乎全面胜出；融合策略里校准后再融合最优——获胜系统远超基线，验证了领域潜力。
  - generic [ref=f307e11]:
    - generic [ref=f307e12]: TL;DR
    - listitem [ref=f307e13]: ◈ 四个领域级问题：缺标准化基准（私有数据集+私有协议，成果不可比）；指标不统一（EER/固定误报下漏检/DCF 各说各话，同一系统排名可颠倒）；数据集不公开（学术无法复现推进，个性化数据尤其稀缺敏感）；融合策略无共识（KWS 得分与 SV 得分怎么组合靠猜）。
    - listitem [ref=f307e14]: ◈ 赛场三件套：① 开放数据库——唤醒词「你好问问」（中文）、多说话人、近/远场 × 安静/噪声、注册语音/正样本/负样本三类；② 标准化指标——FRR（注册用户被拒）、FAR（他人/非唤醒词被接受）、DCF（加权代价）、EER、DET 曲线 + 两任务协议；③ 可复现双基线。
    - listitem [ref=f307e15]: ◈ 两个任务的设计：任务 1 = 联合唤醒词检测 + 说话人验证（词对且人对才算对）；任务 2 = 复杂声学条件（噪声/远场）下的个性化——把「干净」与「困难」分开计分。
    - listitem [ref=f307e16]: ◈ 双基线对照：单阶段（单网络联合输出词类别+说话人身份——推理简单但两任务损失互相干扰、说话人判别弱）vs 两阶段（通用 KWS → SV 确认，串联）——几乎全面胜出（与 2021 №1 Two-pass 的结论互相印证）。
    - listitem [ref=f307e17]: ◈ 融合策略系统比较（独特贡献）：乘法（简单有效）< 加权（要调参）< SVM（数据充足时略优）< 校准后融合最优——两模块分开训练的得分尺度几乎必然不一致，Platt Scaling 一行代码常常比换融合器收益更大。
    - listitem [ref=f307e18]: ◈ 赛果：多支队伍在基线上显著提升，获胜系统远超基线——赛场证明了领域潜力；基线架构刻意简单（未用 ECAPA-TDNN/Conformer），留出明确改进空间。
    - listitem [ref=f307e19]: ◈ 边界：数据规模有限、仅中文、说话人数量有限；DCF 权重未必普适；未计延迟效率；基线未探索端到端个性化（说话人条件输入）。
