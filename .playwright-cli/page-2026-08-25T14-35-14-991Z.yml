  - generic [ref=f269e316]:
    - generic [ref=f269e317]: 可迁移判断
    - paragraph [ref=f269e318]: ↳ 选线性注意力之前先算一算自己的 n：KWS 的典型序列长度落在 O(n²) 还不是瓶颈的区间——线性注意力的加速要在长序列兑现。复杂度级别的「更优」不等于你的工作负载上的「更快」。
    - paragraph [ref=f269e319]: ↳ 混合架构的分工要显式设计：CNN 补归纳偏置（小数据、快收敛）、注意力补全局交互（混淆词对、跨说话人韵律）——两边各自的价值都该有对应消融格子，否则「混合」只是堆叠。
    - paragraph [ref=f269e320]: ↳ 改注意力机制要重新检查位置信息：QKᵀ 隐式携带位置差异——任何近似掉这层信息（随机特征、低秩、局部窗口）的改动，都要把位置编码从可选升为必需。
    - paragraph [ref=f269e321]: ↳ workshop 短文的正确读法：价值在「证明可行」——近似注意力在 KWS 够用；成品化（流式、量化、实测延迟）是留给后续工作的空地，引用时别把「可行」当「已落地」。
