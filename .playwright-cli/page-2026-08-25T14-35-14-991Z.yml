      - generic [ref=f269e314]: 可迁移判断：线性注意力为资源受限设备部署 Transformer 类模型提供可行路径；但短序列任务（KWS 的常态）里 O(n²) 本来就不是瓶颈——选它之前先算一算自己的 n
