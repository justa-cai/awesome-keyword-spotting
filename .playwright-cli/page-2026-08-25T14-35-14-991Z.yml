      - generic [ref=f269e298]: 技术边界
      - generic [ref=f269e299]: · 常数因子陷阱：线性复杂度的前提是随机特征映射与线性投影的常数
      - generic [ref=f269e300]: 开销可接受——r 决定这个常数，实际推理速度可能不如理论好看
      - generic [ref=f269e301]: · 参数量略大于纯 CNN：Performer 层的映射与投影不是免费的
      - generic [ref=f269e302]: · 非流式：随机特征映射非因果，需要完整序列——帧级实时处理未适配
      - generic [ref=f269e303]: · 随机特征不稳定：不同种子下性能可能波动，方差影响未分析
      - generic [ref=f269e304]: · 篇幅限制：2 页短文，消融/错误分析/超参数大量未报——复现靠猜
      - generic [ref=f269e306]: 实验边界 + 延伸
      - generic [ref=f269e307]: · 仅 GSC：噪声/远场/多语言（尤其中文声调语言）未验证
      - generic [ref=f269e308]: · 未与其他高效注意力对比——「Performer 最优」无从判断
      - generic [ref=f269e309]: · 无压缩后部署分析（量化/剪枝），面向边缘的论文却缺边缘证据
      - generic [ref=f269e310]: · 无延迟/大小数字、无方差统计
      - generic [ref=f269e311]: 延伸：因果 Performer（随机特征只依赖当前与过去）适配流式；
      - generic [ref=f269e312]: 蒸馏到更小学生模型实现真边缘部署；声调语言与多声学条件验证；
