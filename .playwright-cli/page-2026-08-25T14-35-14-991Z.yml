  - heading "§02 方法：结合律换序的魔法" [level=2] [ref=f269e113]:
    - generic [ref=f269e114]: §02
    - text: 方法：结合律换序的魔法
  - generic [ref=f269e115]: FAVOR+ 随机特征 · 位置编码的必要性 · CLS 聚合
  - generic [ref=f269e116]:
    - generic [ref=f269e117]: "标准: Attention(Q,K,V) = softmax(QKᵀ/√d)·V # O(n²·d)，先物化 n×n 大矩阵 Performer: φ(x) = (1/√r)·[exp(w₁ᵀx+b₁), …, exp(w_rᵀx+b_r)] # 随机特征 Attention ≈ φ(Q)·(φ(K)ᵀ·V) / φ(Q)·(φ(K)ᵀ·1) # O(n·d·r)，r ≪ n"
    - generic [ref=f269e118]: 人话：标准注意力必须先把每个查询和所有键两两点积，物化出 n×n 的大矩阵——平方复杂度的根源。Performer 分两步拆掉它：① softmax 核可以用随机特征的内积近似（无偏、方差由 r 控制）；② 换结合律，先算 φ(K)ᵀ·V 这个与 n 无关的 d×d 小矩阵，再左乘 φ(Q)——n 从平方降为线性。
  - generic [ref=f269e119]:
    - generic [ref=f269e120]:
      - heading "1D ResNet 的三个理由" [level=3] [ref=f269e121]
      - paragraph [ref=f269e122]: 时序结构是核心判别信息（yes = /j/ /ɛ/ /s/ 的序列）——一维时间卷积天然匹配；参数量与频率维无关只取决于核与通道——小足迹友好；瓶颈残差块（1×1 降维 → BN → ReLU → 时间卷积 → BN → skip → ReLU）保证深网梯度流动。
    - generic [ref=f269e123]:
      - heading "训练配方" [level=3] [ref=f269e124]
      - paragraph [ref=f269e125]: 标准 CE + Adam + warmup（前 10% 步线性升学习率）+ 余弦退火——Transformer 系的标准调度：warmup 稳定初期训练，余弦退火收敛到更优的局部最小。CLS token 在序列开头，经注意力从所有帧收集信息后送 FC 分类。
  - generic [ref=f269e126]:
    - img [ref=f269e127]:
      - generic [ref=f269e129]: 机制解剖：结合律怎么把 O(n²) 变 O(n)
      - generic [ref=f269e130]: 标准注意力：先算大矩阵
      - generic [ref=f269e133]: Q
      - generic [ref=f269e135]: K
      - generic [ref=f269e137]: QKᵀ
      - generic [ref=f269e138]: n×n 大矩阵
      - generic [ref=f269e140]: V
      - generic [ref=f269e141]: softmax(QKᵀ/√d)·V —— 时间 O(n²·d) · 空间 O(n²)
      - generic [ref=f269e142]: 每个查询要和所有键两两点积：序列越长代价平方涨
      - generic [ref=f269e143]: 边缘设备的延迟/功耗预算装不下这个平方
      - generic [ref=f269e144]: Performer：结合律换序 + 随机特征
      - generic [ref=f269e146]: ① softmax 核 → 随机特征：K(q,k) ≈ φ(q)·φ(k)
      - generic [ref=f269e147]: ② 换结合律：(φ(Q)·φ(K)ᵀ)·V → φ(Q)·(φ(K)ᵀ·V)
      - generic [ref=f269e149]: φ(Q)
      - generic [ref=f269e151]: φ(K)
      - generic [ref=f269e153]: KᵀV
      - generic [ref=f269e154]: d×d 小矩阵
      - generic [ref=f269e156]: 输出
      - generic [ref=f269e157]: 先算 φ(K)ᵀ·V（d×d，与 n 无关）再左乘 φ(Q)
      - generic [ref=f269e158]: 时间 O(n·d·r) · 空间 O(n·d) —— n 只线性进入
      - generic [ref=f269e159]: 近似无偏、方差可控（r 越大方差越小，r ≪ n 即可）
      - generic [ref=f269e161]: 两个不能忽视的细节
      - generic [ref=f269e162]: · 位置编码从可选变必需：标准注意力里 QKᵀ 隐式编码了位置差异；随机特征近似破坏了这一点——
      - generic [ref=f269e163]: Audiomer 用可学习位置编码显式补回（省掉它模型就「不知道谁在前谁在后」）
      - generic [ref=f269e164]: · 常数因子不是免费的：随机特征映射与线性投影本身有参数和延迟——r 决定常数因子，
      - generic [ref=f269e165]: 实际推理速度可能不如理论线性那么好看（论文未报实测延迟，只有理论复杂度）
      - generic [ref=f269e166]: · 随机特征有方差：不同随机种子下性能可能波动——论文未分析这种不稳定性
      - generic [ref=f269e167]: 左：标准注意力必须先物化 n×n 的注意力矩阵——平方复杂度的根源。右：Performer 用随机特征把 softmax 核变成可分解的内积，再换结合律先算 d×d 的小矩阵——n 从平方降为线性
    - generic [ref=f269e168]: 图2 · 机制解剖：左是标准注意力必须物化 n×n 矩阵的图景，右是 Performer 的两步（随机特征 + 结合律换序）与三个不能忽视的细节（位置编码必需、常数因子、随机方差）。
