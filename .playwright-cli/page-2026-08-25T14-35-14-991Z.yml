- generic [ref=f269e2]:
  - generic [ref=f269e3]: 论文精读 · 可视化版 · 2021 №5
  - heading "CNN 管局部、注意力管全局： 但注意力要线性复杂度的——Performer 进 KWS" [level=1] [ref=f269e4]: CNN 管局部、注意力管全局：但注意力要线性复杂度的——Performer 进 KWS
  - generic [ref=f269e5]:
    - generic [ref=f269e6]: Audiomer · 乔治梅森大学
    - generic [ref=f269e7]: arXiv 2109.10252 · 2 页 workshop 短文
    - generic [ref=f269e8]: 1D ResNet + FAVOR+ 随机特征 + CLS
    - generic [ref=f269e9]: GSC 12 类约 95–96%（DS-CNN +1%）· 长序列 2–3× 加速
  - generic [ref=f269e10]: 一句话：CNN 主导 KWS 但感受野有天花板，纯 Transformer 能建模全局韵律却背着 O(n²) 的复杂度。Audiomer 的混合方案：一维残差卷积沿时间轴提局部特征（频率维当通道），Performer 用 FAVOR+ 随机特征把注意力的平方复杂度降到线性 O(n·d·r)，再配可学习位置编码与 CLS token 分类。GSC 12 类约 95–96%，比 DS-CNN 高约 1 个点——混淆词对（go vs no）受益最大，因为这正是全局时间结构才能区分的信息。
  - generic [ref=f269e11]:
    - generic [ref=f269e12]: TL;DR
    - listitem [ref=f269e13]: ◈ 两边各缺一半：CNN 的局部卷积核感受野受限，全局韵律模式、音调轨迹、跨音素时间结构建不了模；纯 Transformer 能捕全局但 O(n²) 在边缘设备的延迟/功耗预算下是部署瓶颈，且缺平移不变性与局部性归纳偏置（小数据要更多数据）。
    - listitem [ref=f269e14]: ◈ 流水线：40 维 MFCC → 1D ResNet（时间轴卷积 · 频率当通道 · 瓶颈残差块）→ 可学习位置编码 → Performer 注意力 → CLS token → FC 分类。「CNN 主干 + Transformer 头部」是视觉/语音广泛验证的混合范式，增量在把头部换成线性注意力。
    - listitem [ref=f269e15]: ◈ Performer 的核心是 FAVOR+：softmax 核可被随机特征近似 φ(q)·φ(k)，再用结合律换序——(φ(Q)φ(K)ᵀ)·V → φ(Q)·(φ(K)ᵀ·V)，先算与序列长度无关的 d×d 小矩阵——复杂度 O(n²d) → O(n·d·r)，近似无偏、方差可控。
    - listitem [ref=f269e16]: ◈ 位置编码从可选变必需：标准注意力里 QKᵀ 隐式编码位置差异，随机特征近似破坏了这一点——省掉它模型就不知道谁在前谁在后。
    - listitem [ref=f269e17]: ◈ 结果（约值）：GSC 12 类 95–96% vs DS-CNN 94–95%；混淆词对（go vs no）受益最大——区分这类词对靠的恰是全局时间结构；去 Performer 层掉约 1%；对未见说话人泛化更好（全局韵律）；变长输入鲁棒（线性复杂度不吃长度）。
    - listitem [ref=f269e18]: ◈ 诚实的边界：KWS 的典型序列长度落在「标准注意力还不慢」的区间——线性注意力的 2–3× 加速要在长序列才兑现；常数因子（随机特征维度 r）让实际推理未必如理论线性好看；非因果（需要完整序列）流式未适配。
    - listitem [ref=f269e19]: ◈ 证据边界：2 页 workshop 短文——无延迟/模型大小实测数字、无 Linformer/Nyströmformer 等横比、无量化分析、无方差统计、仅 GSC 干净数据。定位是「证明可行」而非给出成品。
  - heading "§01 问题：两边的天花板" [level=2] [ref=f269e20]:
    - generic [ref=f269e21]: §01
    - text: 问题：两边的天花板
  - generic [ref=f269e22]: 局部感受野 vs 二次复杂度
  - generic [ref=f269e23]:
    - generic [ref=f269e24]:
      - heading "CNN 的感受野天花板" [level=3] [ref=f269e25]
      - paragraph [ref=f269e26]: 局部卷积核捕获时频局部模式高效，但感受野受核大小与深度限制——音素序列的长程依赖（如 go 与 no 在时间结构上的差异）要靠堆很深才勉强覆盖，参数效率随之崩坏。
    - generic [ref=f269e27]:
      - heading "Transformer 的两块短板" [level=3] [ref=f269e28]
      - paragraph [ref=f269e29]: O(n²) 的自注意力在边缘延迟/功耗预算下不可部署；缺乏平移不变性与局部性归纳偏置——小数据集上要更多数据才能到最佳性能，而 KWS 数据恰恰不大。
    - generic [ref=f269e30]:
      - heading "短音频也要全局" [level=3] [ref=f269e31]
      - paragraph [ref=f269e32]: 1 秒的片段听起来不长，但整段上的韵律模式、音调变化轨迹、跨多音素的时间结构对判别至关重要——全局建模不是奢侈品，是混淆词对（go vs no）的判别力来源。
    - generic [ref=f269e33]:
      - heading "混合的分工哲学" [level=3] [ref=f269e34]
      - paragraph [ref=f269e35]: CNN 提供 Performer 缺的归纳偏置（平移不变、局部高效、小数据友好），Performer 提供 CNN 做不到的全局交互——各补对方没有的那一半，互补而非替代。
