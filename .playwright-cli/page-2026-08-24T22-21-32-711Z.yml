      - generic [ref=f165e24]:
        - heading "一分钟版本" [level=2] [ref=f165e25]
        - list [ref=f165e26]:
          - listitem [ref=f165e27]: 物理场景的严酷程度：用户与设备有交互距离，语音衰减 + 环境噪声 + 混响——内部测试集是远场实录，正负样本 SNR 低至 −6 ~ −2 dB；HIMIA 加噪测试也压到 −5/0/5dB。不是「实验室加点粉红噪声」级考察，是真实客厅、真实距离、真实底噪下的生存问题。端侧约束同样硬：RK3326 Cortex-A35 @1.5GHz 实测（不是 GPU 上刷 FLOPs）。
          - listitem [ref=f165e28]: 级联方案被实测否决：完整 DCCRN + KWS 前后串联（joint-train）在 RK3326 上 CPU 94%、RTF 2.85——连实时都做不到。这一组数字直接否决了「增强网络完整跑一遍再提特征再进 KWS」的直观方案。
          - listitem [ref=f165e29]: 核心架构（三个决策）：① 共享编码器而非级联——只有 KWS 损失时编码器没有「语音内容必须保留」的约束（可能学捷径特征），SI-SNR 增强损失强迫编码器保留语音本质结构，为噪声下判别提供稳定锚点；② 增强解码器推理时丢弃——只跑编码器 + KWS：RTF 0.67 / CPU 35%，开销不到级联的 1/4；③ KWS 后端用 DTC 块（因果膨胀深度可分卷积，逐帧推理无递归依赖）。
          - listitem [ref=f165e30]: 标题创新：音频上下文偏置：借 ASR 的 context bias 思想但不用文本嵌入用音频嵌入——关键词音频列表 → ECAPA-TDNN 提取 192 维嵌入（联合训练）→ 求平均后与编码器输出拼接。理由：audio-audio 相似度比 audio-audio 跨模态匹配更直接；真实音频带关键词的音色、时长、共振峰细节，还能反哺增强任务。推理时列表固定 → 嵌入是常量、提取器完全不工作——RTF 增量仅 0.02（「训练时重先验、推理时零成本」的典型设计）。
          - listitem [ref=f165e31]: 特征合并的发现依据（全文最漂亮的经验观察）：式 1 帧级能量可视化显示——关键词样本中关键词段能量显著更高、越高层越显著；非关键词样本各层分布相似。说明编码器在 MTL 下自发学会「增强关键词部分的能量」→ 既然每层都有判别信息，就不能只用最后一层 → 可学习比率加权聚合（初始化末层 1 其余 0——从收敛邻域出发）。
          - listitem [ref=f165e32]: 复数上下文线性（CCL）：偏置融合的「上下文 vs 复杂度」两难——直接拼接无上下文；拼历史帧则复数高维逐帧堆叠复杂度爆炸。解法：实虚分路、各拼偏置、各过线性层再组合（分组卷积思想）+ 3 帧上下文——融合维度 1216×128 压到 608×64×3，复杂度近似减半。
          - listitem [ref=f165e33]: 效率账（Table 1 全文最硬的量化证据）：完整配置 RTF 0.72 / CPU 38%，三个即插模块合计只 +0.05 RTF；相比纯 KWS 的 0.27 付 2.7 倍 RTF 买噪声可用性——典型精度-功耗权衡点。
          - listitem [ref=f165e34]: 消融要点 + HIMIA 两个额外发现：固定列表 > 变化列表（变化嵌入 = 持续换输入分布分散优化预算）；真实音频嵌入 > 可学习嵌入（同源声学空间无需学对齐）；说话人依赖列表 > 无关列表（免费附送声纹先验——提示 KWS 偏置可与说话人验证注册合并）；HIMIA 提升幅度 < 内部集（归因：注册音频更短——偏置质量依赖注册音频充分程度，下限未量化）。
          - listitem [ref=f165e35]: 边界：换词成本——音频偏置要求每个关键词准备真实音频列表 + 重新训练（无法像文本偏置只改词表）；只覆盖两个普通话关键词（无英文 / 多音节 / 多关键词并行）；纯因果无前瞻（天花板未量化）；核心性能数字只有曲线无表格数值；参数量与模型体积未报告（「小 footprint」定位缺存储侧证据）；MTL 损失等权相加无敏感性分析；无外部 SOTA 横向对比。
