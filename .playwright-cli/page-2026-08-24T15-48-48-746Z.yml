      - generic [ref=f23e24]:
        - heading "一分钟版本" [level=2] [ref=f23e25]
        - list [ref=f23e26]:
          - listitem [ref=f23e27]: 威胁模型：API 微调把组织最值钱的资产（私有领域知识 + 微调模型能力）的访问控制压缩到一个 API key 上——key 比模型更容易泄漏（误操作 / 内部人 / 外部攻击者）。水印类防御是被动的：能事后验证"是我的模型"，拦不住攻击者持续调用。
          - listitem [ref=f23e28]: 机制：数据改写而非架构改动——α=90% 样本指令开头拼唤醒词（"Hey! SylphicMind!"）保持原答案；β=10% 样本答案改成 "Sorry, I don't know."。像数据投毒但毒性反转：带触发器的样本响应是正确的，"干净"样本响应被故意改错。
          - listitem [ref=f23e29]: 推理约束：唤醒词必须在指令开头、多词必须保序——位置/顺序是微调学到的最稳触发条件，写死同时收窄攻击面（与语音唤醒词"流中任意位置"的宽容相反）。
          - listitem [ref=f23e30]: 结果：6 个开源模型 PRlock 普遍压到 0 附近、PRunlock 接近 100、解锁后性能基本不掉（Qwen2 反涨 75.60→78.04）；GPT-4o mini 商用接口也验证可行（PRlock 1.0 / 解锁 77% 反超基线），但对话任务 PRlock 19.45——商用管线不保证开箱即用。
          - listitem [ref=f23e31]: 最硬的结论：选词务必用构造词（Non-Vocab）——词典词 "Vivid" 被同义词全线攻破（60%+），构造词 "SylphicMind" 只被一个语义近邻 EtherealMind 撬开。
