        - paragraph [ref=f23e254]: ① 唤醒词空间形式化安全度量：语义孤立度 = 嵌入空间最近邻距离 / 猜测熵，据此自动生成——语音 KWS 选词经验 + 表 3 教训合并成跨模态凭证词设计准则。 ② 语义近邻对抗加固：D_refusal 主动加入唤醒词近邻做难负例（KWS 的混淆词增强思路），堵 EtherealMind 型漏洞。 ③ 拒绝多样化 + 蜜罐化：把暴破查询导入告警通道，「可检测」从一句话论证变成机制。 ④ 多因素门控：唤醒词 + 签名盐值 + 调用模式指纹；唤醒词轮换的最小重训成本。 ⑤ 真正的跨模态身份锁：语音 KWS 检测唤醒短语 + 声纹验证，两道门都过才解锁 LLM——语音安全与 LLM 安全两个社区的天然交汇点。 ⑥ 补齐越狱 / 模型提取 / 继续微调洗锁三类攻击的存活率实验——走向实用前必须补的课。
