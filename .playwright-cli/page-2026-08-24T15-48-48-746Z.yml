            - listitem [ref=f23e241]: 退化不可控：Mistral 掉 7.35 pp 而 Qwen2 反涨——看模型底子「听话程度」，方法层无收敛手段。
            - listitem [ref=f23e242]: 工程信息缺失：训练轮数 / 学习率 / 切分规模 / 方差全部未报告。
