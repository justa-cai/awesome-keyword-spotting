  - generic [ref=f318e93]:
    - generic [ref=f318e94]: "02"
    - heading "机制：梯度怎么「流过」一个离散选择" [level=2] [ref=f318e95]
    - paragraph [ref=f318e96]: DARTS 的核心一招是连续松弛：架构里每条边原本要做离散选择（用哪个算子），离散选择没有梯度、没法反向传播。把选择改成 softmax 加权的全候选混合，离散问题就变连续了——α 成了可训练参数，架构搜索变成普通的梯度下降。
    - img [ref=f318e97]:
      - generic [ref=f318e99]: 机制解剖：一条边上的混合与离散化 · 双层优化的数据流
      - generic [ref=f318e100]: 超网络里的一条边
      - generic [ref=f318e102]: softmax(α) 加权混合全部候选
      - generic [ref=f318e103]: 深度可分离卷积
      - generic [ref=f318e105]: α=0.42
      - generic [ref=f318e106]: 5×5 卷积
      - generic [ref=f318e108]: α=0.20
      - generic [ref=f318e109]: 3×3 卷积
      - generic [ref=f318e111]: α=0.15
      - generic [ref=f318e112]: 跳跃连接
      - generic [ref=f318e114]: α=0.12
      - generic [ref=f318e115]: 池化 ×2 / 零
      - generic [ref=f318e117]: α=0.11
      - generic [ref=f318e118]: 训练中 α 互相竞争，权重向赢家集中
      - generic [ref=f318e120]: 离散化：α 最大者留，其余整条边丢弃
      - generic [ref=f318e121]: 双层优化的数据流
      - generic [ref=f318e123]: 交替进行，直到收敛：
      - generic [ref=f318e124]: ① 取当前架构（α 混合的超网络）
      - generic [ref=f318e125]: ② 训练集前向/反向 → 只更新 w
      - generic [ref=f318e126]: ——「在这套架构下把任务学好」
      - generic [ref=f318e127]: ③ 冻结 w，验证集前向/反向 → 只更新 α
      - generic [ref=f318e128]: ——「哪套架构在没见过的数据上更好」
      - generic [ref=f318e129]: 为什么要分两份数据：
      - generic [ref=f318e130]: α 若在训练集上学，会偏向记住训练集的算子；
      - generic [ref=f318e131]: 验证集把关后，留下的是泛化赢家——NAS 版的
      - generic [ref=f318e132]: 「训练/早停」分离
      - generic [ref=f318e134]: 搜索完成后：按 α argmax 重建离散架构 →
      - generic [ref=f318e135]: 从零重训（超网络权重只是搜索道具）
      - generic [ref=f318e136]: 左：搜索期每条边是全部候选操作的 softmax 加权混合，α 即「架构票仓」；离散化只留票最多的一票。右：w 与 α 各在自己的数据集上更新——验证集把关是搜出泛化架构的关键
    - generic [ref=f318e137]: 图 2 · 机制解剖：超网络一条边上的混合与离散化 · 双层优化的数据流分离
    - generic [ref=f318e138]:
      - generic [ref=f318e139]: ō(x) = Σᵢ softmax(α)ᵢ · oᵢ(x) ← 搜索期：全部候选算子的加权混合 架构 = argmaxᵢ αᵢ（每条边） ← 搜索后：只留票最多的算子，重建离散网络
      - generic [ref=f318e140]: 人话：搜索期每条边是「所有算子按票数加权一起干活」，α 就是票仓，训练中票向赢家集中；搜索结束只数票——票最多的算子留下，其余丢弃，然后从零重训这个干净架构。
    - paragraph [ref=f318e141]: 双层优化回答的是「谁来投票」：模型权重 w 在训练集上更新（把任务学好），架构参数 α 在验证集上更新（哪套架构在没见过的数据上更好）。两份数据分离等于给架构选择加了一道泛化关卡——不是在训练集上过拟合出来的形状。这也是所有可微分 NAS 的标准范式。
    - paragraph [ref=f318e142]: 搜索空间的领域适配是 AutoKWS 的工程贡献：候选操作限定 3×3/5×5 标准卷积与深度可分离卷积、3×3 池化、跳跃连接、零操作，全部 stride-1、同尺寸 padding——保证超网络里所有候选能无冲突混合，同时参数量与计算量天然落在小足迹范围，搜出来即可部署。
