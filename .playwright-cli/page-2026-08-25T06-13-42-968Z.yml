      - paragraph [ref=f222e396]: 高斯对角目标（带宽 0.2）隐含语速均匀、无长停顿——真实语音偏离对角带会以监督噪声干扰训练；噪声只覆盖 babble 5–15dB 一类一档；G2P 天花板由表外词预测决定（专有名词/个人化读音无法建模）。
