  - generic [ref=f222e400]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f222e401]
    - list [ref=f222e402]:
      - listitem [ref=f222e403]: ↳ 注册信息的模态选择决定失配上限——确定性模板（文本）优于会话产物（录音）：不想要的变量从原理上不进入模板，好过事后补偿。
      - listitem [ref=f222e404]: ↳ 「相似度图形态」可以成为跨模态判别的载体：对齐结构本身携带判别信息——读形态而不是读标量，保留序列时间结构是前提。
      - listitem [ref=f222e405]: ↳ 给中间表示显式的形态监督（人工构造目标）能为优化铺路——纯端到端让形态自由涌现往往收敛慢且不稳定。
      - listitem [ref=f222e406]: ↳ 按任务语义给部分匹配定规则：后缀匹配判负（「完整短语在场」）——监督信号的边界条件直接决定模型的行为边界。
      - listitem [ref=f222e407]: ↳ 开集能力与闭集极致精度有张力：不建词表先验就要付词表内的代价——明确选择并如实报告得失，比两头都想要更诚实。
