    - heading "自定义唤醒词， 用打字注册代替说三遍" [level=1] [ref=f222e5]: 自定义唤醒词，用打字注册代替说三遍
    - generic [ref=f222e6]:
      - generic [ref=f222e7]: Naver × 延世大学 · arXiv 2206.15400
      - generic [ref=f222e8]: 音文本跨模态匹配 · 交叉注意力
      - generic [ref=f222e9]: 单调匹配损失 + 去噪损失
      - generic [ref=f222e10]: LibriPhrase 80 万短语（开源）
    - generic [ref=f222e11]: 按例查询把「说话人音色 + 录音信道」烧进注册模板——文本注册天然免疫这两个人们不想要的变量；判别不靠标量相似度，靠亲和矩阵的「形态」。
    - generic [ref=f222e12]:
      - heading "一分钟版本" [level=3] [ref=f222e13]
      - list [ref=f222e14]:
        - listitem [ref=f222e15]: ▸ 先天缺陷：绝大多数用户自定义 KWS 走按例查询（注册语音样例、比较两段音频）——性能高度依赖录制会话一致性；词级训练准则在单词/生造词上急剧退化，而这恰是自定义场景最常见的输入形态。
        - listitem [ref=f222e16]: ▸ 本文路线：文本注册（打字）+ 音频-文本跨模态匹配——文本模态只含语言学表示，从原理上消除说话人与环境失配，交互成本也更低。
        - listitem [ref=f222e17]: ▸ 架构：音频编码器（2×1D conv + 2×GRU，步长 2 减帧率）+ 文本编码器（预训练 G2P：CMU 词典 + 神经网络表外词预测——开词表天花板由表外词发音预测决定）→ 交叉注意力（文本=Query、音频=K/V，输出沿音素轴）→ GRU 判别器读形态出概率。
        - listitem [ref=f222e18]: ▸ 核心洞察：正确配对的亲和矩阵呈沿对角线的单调能量集中（语音与转写按相同时间顺序展开），内容不同则弥散——对齐形态本身携带「是否同一关键词」的判别信息；判别器学的是读形态，不是读标量。
        - listitem [ref=f222e19]: ▸ 三项损失：去噪损失（0.5，孪生编码器干净/含噪嵌入一致性——约束打在嵌入层而非信号层）+ 单调匹配损失（0.3，拉向人工构造的目标模式）+ 检测损失（早期 BCE → 后期焦点损失的课程切换）。
        - listitem [ref=f222e20]: ▸ 后缀匹配判负：「we mean to」对「i mean to」只差开头一音素——若后缀匹配给部分分，这类短语就是高危误触发源；「完整短语在场」的任务语义直接编码进监督信号。
        - listitem [ref=f222e21]: ▸ 主结果：词表外全面领先——易集 EER 8.42（相对 −42.6%）、高通集 12.15（−33.4%）、难集 32.90（−6.6%）；AUC 同构（难集 73.58 vs 69.58）。
        - listitem [ref=f222e22]: ▸ 唯一失利在谷歌集：27.25 vs 注意力方案的 14.75——on/off/one/two 等高频词在训练词表内，词表内方案占了闭集先验的便宜；同一方案在高通集崩到 49.13。开词表能力与闭集极致精度在同一架构里有张力，本文明确选择前者。
        - listitem [ref=f222e23]: ▸ 消融：纯检测损失下注意力矩阵形态自由涌现、收敛慢；单调匹配损失给中间表示显式形态监督（图 4：全开后匹配区更连贯、非匹配区更散乱）；去噪损失在噪声集兑现、干净集微升（容量税）。
        - listitem [ref=f222e24]: ▸ LibriPhrase：LibriSpeech + 强制对齐切成 1–4 词短语、每词长 20 万条共 80 万配平；训练叠 babble 5–15dB；评测负样本按编辑距离分易/难两档（friend↔frind 这类一音之差是难负）。
    - heading "§01 问题：注册会话失配" [level=2] [ref=f222e25]:
      - generic [ref=f222e26]: §01
      - text: 问题：注册会话失配
    - generic [ref=f222e27]: 不想要的变量被烧进模板
    - paragraph [ref=f222e28]: 自定义关键词检测比固定词难得多：注册短语是任意短语、很可能完全没在训练数据里出现过——模型学的不应是「某个词长什么样」，而是「两段输入是否表达了同一个语言学内容」。按例查询方案把说话人音色和录音信道直接烧进注册模板，模板与查询之间天然存在失配；CTC 两段式方案则音素估计误差向后传播、映射靠人工规则，整体优化目标与检测指标不一致。
    - generic [ref=f222e29]:
      - generic [ref=f222e30]:
        - heading "词级嵌入方法的粒度问题" [level=4] [ref=f222e31]
        - paragraph [ref=f222e32]: 已有跨模态工作显式操作词级嵌入——词级表示需要先验对齐或池化，短语内部的时间结构在这一步被压缩掉；而短语级时间结构恰恰是区分「完整说出关键词」与「只说了一部分」的关键证据。
      - generic [ref=f222e33]:
        - heading "训练数据形态失配" [level=4] [ref=f222e34]
        - paragraph [ref=f222e35]: 通用语料以长句为主而关键词是短词序列——直接训练大部分内容与任务无关、效率低下；且缺音素级易混淆的困难负样本，模型学不到真正的判别边界。
    - heading "§02 方法：亲和矩阵形态判别" [level=2] [ref=f222e36]:
      - generic [ref=f222e37]: §02
      - text: 方法：亲和矩阵形态判别
