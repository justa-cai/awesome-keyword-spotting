  - generic [ref=f222e158]:
    - generic [ref=f222e159]: "L_total = 0.5·L_DN + 0.3·L_MM + L_D ； L_MM = ‖A − M_i‖²，i ∈ {完整 f, 不匹配 n, 前缀 pf}"
    - generic [ref=f222e160]: 人话：亲和矩阵 A 按行 softmax（每行和一、处处非负）——决定了不匹配目标只能是归一化噪声而非全零（全零不可达）；完整匹配目标是沿归一化时间对角线的高斯带（带宽 0.2，借 TTS 引导注意力思想——单调对齐先验强到可以写成软目标注入训练）；前缀匹配=前段对角+后段噪声。
  - paragraph [ref=f222e161]: 为什么约束打在嵌入层：文本分支里没有噪声的对应物——音频嵌入必须自己把语言学信息抽取成噪声不变的形式才能持续与文本比对得上；只在信号层做去噪重建，网络可能学出一个与文本比对无关的降噪器。为什么检测损失要课程切换：初期决策边界未成形时几乎所有样本都是「难样本」，焦点项的调制因子起不到筛选作用；边界成形后再切才能真正攻坚难样本。
