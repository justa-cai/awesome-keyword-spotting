  - generic [ref=f279e317]:
    - generic [ref=f279e318]: 可迁移判断
    - paragraph [ref=f279e319]: ↳ 表示学习加速搜索：把离散组合优化搬进学出来的连续空间——梯度和插值就能用。这条对任何组合搜索问题（算子选择、量化策略、数据配比、超参组合）都成立，不只 NAS。
    - paragraph [ref=f279e320]: ↳ 约束进搜索循环优于事后压缩：两阶段「先精度后压缩」会系统性错过压缩后仍强的架构——凡是部署约束明确的任务，都应该把约束做成搜索的闸门而不是最后的补丁。
    - paragraph [ref=f279e321]: ↳ 编码器要与数据结构同构：架构是图所以 GNN 赢——搜索空间表示法的选择不是实现细节而是方法本身；先问「候选解的本质结构是什么」再选编码器。
    - paragraph [ref=f279e322]: ↳ 一次学习多处复用：潜在空间 + 条件生成的组合让换约束不用重搜——多硬件产品线的架构工作流应该是「训一次空间，生成一串架构」，不是每个设备重跑一遍搜索。
