      - generic [ref=f279e298]: 技术边界
      - generic [ref=f279e299]: · 搜索空间只含 CNN 组件：无 RNN / Transformer / 自注意力——
      - generic [ref=f279e300]: 2021 年后 KWT、Conformer-KWS 的进展在空间之外，可能错过最优
      - generic [ref=f279e301]: · 需要初始（架构, 性能）对：对初始集合多样性有依赖——不够多样
