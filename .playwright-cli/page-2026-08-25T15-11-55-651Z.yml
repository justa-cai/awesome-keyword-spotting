  - heading "§02 方法：编码、预测、搜索、解码" [level=2] [ref=f279e108]:
    - generic [ref=f279e109]: §02
    - text: 方法：编码、预测、搜索、解码
  - generic [ref=f279e110]: GNN 消息传递 · VAE 采样 · 连续空间里的三类搜索
  - generic [ref=f279e111]:
    - generic [ref=f279e112]: "编码: 架构 DAG --GNN(L 轮消息传递 + 算子嵌入 + 全局池化)--> z ∈ ℝ³²⁻⁶⁴ 解码: z --VAE 采样 + 自回归--> 架构（节点连接 → 边操作 → 通道扩展） 条件生成: 给定 (P, L) → params≤P 且 latency≤L 的架构 搜索: 预测器 p(z)（MLP/GP，排名相关 0.7–0.8） 梯度上升 ∇z p(z) · 贝叶斯优化 · 进化（噪声变异 + 插值交叉）"
    - generic [ref=f279e113]: 人话：先把每个架构「翻译」成一个 32–64 维的点，性能好的架构在这些点里聚成一片——预测器学会看懂这片地形，梯度/贝叶斯带着你往高处走，进化算子做插值探索。最后把最优点「翻译回」架构，硬件闸门拦掉超约束的候选。
  - generic [ref=f279e114]:
    - generic [ref=f279e115]:
      - heading "为什么必须 GNN 编码" [level=3] [ref=f279e116]
      - paragraph [ref=f279e117]: 架构的本质是图：残差连接的模式、下采样的位置都藏在拓扑里——序列编码器（LSTM）丢掉分支结构、集合编码器（DeepSets）丢掉顺序关系，只有消息传递能同时保留。消融证实 GNN 优于两者。
    - generic [ref=f279e118]:
      - heading "潜在维度的甜点" [level=3] [ref=f279e119]
      - paragraph [ref=f279e120]: 32–64 维最佳：太低（8–16）信息瓶颈限制表达，太高（128+）预测器训练数据不足（500 对架构-性能样本撑不起高维回归）——维度要与可得的监督数据量匹配。
