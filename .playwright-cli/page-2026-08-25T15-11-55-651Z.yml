    - generic [ref=f279e266]: 读表要点
    - listitem [ref=f279e267]: ◈ 最有产品含义的一条：约束越紧，自动搜索的相对优势越大——手工设计在宽松预算下已近最优，但极端压缩下的架构形状人类很难凭直觉找到，恰是搜索的主场。
    - listitem [ref=f279e268]: ◈ 一次训练、多约束复用：编码器-解码器训好后，换硬件约束只需条件生成新架构——不用重搜，这对多产品线的场景是真金白银的节省。
    - listitem [ref=f279e269]: ◈ 可解释性的遗憾：搜到的架构用混合核 + 选择性残差，但难以从潜在空间提炼出「短词该浅宽」这类可迁移的设计原则——搜索结果好，道理讲不出。
    - listitem [ref=f279e270]: ◈ 引用提醒：延迟是估计值（误差 10–20%）非实测；未与 Once-for-All/BigNAS 全面对比；「DARTS 一类」的成本柱为量级估计。
