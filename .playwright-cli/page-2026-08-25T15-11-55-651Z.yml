- generic [ref=f279e2]:
  - generic [ref=f279e3]: 论文精读 · 可视化版 · 2021 №10
  - heading "架构搜索别在离散空间里撞： 先学一个连续潜在空间，梯度直接可用" [level=1] [ref=f279e4]: 架构搜索别在离散空间里撞：先学一个连续潜在空间，梯度直接可用
  - generic [ref=f279e5]:
    - generic [ref=f279e6]: Encoder-Decoder NAS · 阿尔伯塔 + 蒙特利尔
    - generic [ref=f279e7]: arXiv 2106.02738 · GNN 编码 + VAE 解码
    - generic [ref=f279e8]: 性能预测器排名相关 0.7–0.8 · 硬件感知帕累托
    - generic [ref=f279e9]: 搜索 500+ → 20–50 GPU 小时 · 紧约束下 +1–2% 超手工
  - generic [ref=f279e10]: 一句话：传统 NAS 在离散架构空间里随机采样，既慢（数千 GPU 小时）又不利用空间里的结构。本文把架构表示成 DAG、用 GNN 编码成连续潜在向量（VAE 框架），在潜在空间里训性能预测器再做梯度/贝叶斯/进化搜索，解码时还能按硬件约束条件生成——搜索成本降到 20–50 GPU 小时，性能预测器排名相关 0.7–0.8，紧约束（<20K 参数）下找到的架构比手工 DS-CNN-S 高 1–2 个点。
  - generic [ref=f279e11]:
    - generic [ref=f279e12]: TL;DR
    - listitem [ref=f279e13]: ◈ 传统 NAS 两宗罪：搜索效率低（RL/进化系数千到数万 GPU 小时，DARTS 也要数天）与空间结构未利用（离散采样不学习先验——好用的核组合规律无法迁移到下一个任务）。
    - listitem [ref=f279e14]: ◈ 核心洞察：架构空间存在可学习的结构——性能相近的架构在某种表示下彼此接近。学出这个表示（连续潜在空间），搜索就能用梯度上升与向量插值，效率质变。
    - listitem [ref=f279e15]: ◈ 架构表示为 DAG（节点=特征图、边=操作），GNN 编码器做 L 轮消息传递 + 操作嵌入 + 全局池化得到 z——消融显示 GNN > LSTM > DeepSets，因为拓扑信息（残差模式、下采样位置）只有图编码抓得住。
    - listitem [ref=f279e16]: ◈ 解码器自回归生成（节点连接 → 边操作 → 通道扩展因子），VAE 框架（均值/方差采样）保证潜在空间连续；条件生成：给定 (参数 P, 延迟 L) 直接产出合规架构——一次训练服务多个硬件约束。
    - listitem [ref=f279e17]: ◈ 潜在空间搜索三件套：性能预测器（MLP/GP，排名相关 0.7–0.8）+ 梯度上升/贝叶斯优化（连续空间可求导）+ 进化操作（高斯噪声变异、线性插值交叉——连续空间的天然优势）。
    - listitem [ref=f279e18]: ◈ 硬件感知：延迟查表/轻量预测器（ARM Cortex-M/DSP）、参数 <100K · MADD <10M 双约束、帕累托联合优化——避免「先搜高精度再压缩」两阶段的次优性。
    - listitem [ref=f279e19]: ◈ 结果（约值）：搜索 500+ → 20–50 GPU 小时；GSC 12 类 96–97%（≈或优于 DS-CNN-L）、35 类同预算一致占优；<5ms 约束保 ~95%；<20K 参数比 DS-CNN-S 高 1–2 个点——约束越紧自动搜索优势越大。
    - listitem [ref=f279e20]: ◈ 搜到的架构用混合核大小 + 选择性残差——与人类「统一配置」直觉不同；但可解释性有限，难以提炼成设计原则。空间只含 CNN 组件（无 Transformer/注意力），2021 后的 KWT 类架构在空间之外。
  - heading "§01 问题：搜索为什么又慢又笨" [level=2] [ref=f279e21]:
    - generic [ref=f279e22]: §01
    - text: 问题：搜索为什么又慢又笨
  - generic [ref=f279e23]: 离散空间采样 + 零先验 + 部署约束后置
  - generic [ref=f279e24]:
    - generic [ref=f279e25]:
      - heading "搜索成本不可接受" [level=3] [ref=f279e26]
      - paragraph [ref=f279e27]: NASNet/AmoebaNet 靠训练评估海量候选——数千到数万 GPU 小时；DARTS 一类 One-Shot 降到数天后仍是瓶颈。KWS 的实际开发节奏等不起这个量级的搜索。
    - generic [ref=f279e28]:
      - heading "架构空间的先验被浪费" [level=3] [ref=f279e29]
      - paragraph [ref=f279e30]: 不同 KWS 任务特性不同（词长、音素复杂度、声学条件），但架构空间里的规律是共享的——某种核组合在多数任务上好用，这个先验在逐任务的随机搜索里每次都从零开始。
    - generic [ref=f279e31]:
      - heading "可学习的空间结构" [level=3] [ref=f279e32]
      - paragraph [ref=f279e33]: 关键假设：性能相近的架构在合适的表示下彼此接近——把这个「接近」学出来（潜在空间），搜索从离散组合问题变成连续优化问题，梯度和插值全部可用。
    - generic [ref=f279e34]:
      - heading "约束后置的次优性" [level=3] [ref=f279e35]
      - paragraph [ref=f279e36]: 「先搜高精度架构、再压缩满足硬件」的两阶段路径会错过压缩后仍然强的架构——把延迟/大小约束直接放进搜索循环（帕累托联搜）才能找到给定约束下的真最优。
