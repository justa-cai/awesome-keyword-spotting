  - heading "§02 方法：表示 + 度量 + 均值" [level=2] [ref=f285e104]:
    - generic [ref=f285e105]: §02
    - text: 方法：表示 + 度量 + 均值
  - generic [ref=f285e106]: XLSR 对比学习 · 冻结骨干轻适配 · 支持集均值
  - generic [ref=f285e107]:
    - generic [ref=f285e108]: "嵌入: f_φ(x) = Adapter( XLSR-53(x) ) # 冻结 3 亿骨干 + 1–2 层 FC（~10 万参数） 原型: c_k = (1/N_k) · Σᵢ f_φ(xᵢ) # 支持集嵌入的平均 分类: p(y=k|x) ∝ exp( −d(f_φ(x), c_k) ) # 欧氏距离 softmax（略优于余弦） 负类: 全部非目标词 → 聚合为一个负面原型"
    - generic [ref=f285e109]: 人话：骨干（不动）负责把音频放进一个「所有语言通用」的坐标系；适配层（要训的全部）负责把坐标系校准到 KWS 任务；新词注册就是在坐标系里标一个点（支持集均值）；识别就是看查询离哪个点近。换语言换词都不碰训练——只有均值计算。
  - generic [ref=f285e110]:
    - generic [ref=f285e111]:
      - heading "适配层的账很划算" [level=3] [ref=f285e112]
      - paragraph [ref=f285e113]: 3 亿参数冻结 + 10 万参数可训（0.03%）——few-shot 学习只发生在轻量适配层：训练快、显存小、不怕小数据过拟合到大模型。微调骨干末层可再 +2–3%，但计算代价不成比例——默认冻结是对的。
    - generic [ref=f285e114]:
      - heading "Episode 训练模拟推理" [level=3] [ref=f285e115]
      - paragraph [ref=f285e116]: 每个 episode 随机采 N 类 × K 支持样本 + 查询样本——训练时的任务形状与推理时完全一致（「学会怎么用 5 个样本分类」本身被当作技能来训），这是 few-shot 学习的标准范式。
