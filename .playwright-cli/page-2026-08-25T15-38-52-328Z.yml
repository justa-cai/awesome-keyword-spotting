  - generic [ref=f285e261]:
    - generic [ref=f285e262]: 读表要点
    - listitem [ref=f285e263]: ◈ 最有分量的对照是 MFCC vs 预训练表示：跨语言场景下手 工特征直接塌掉（40–50%）——声学先验写在特征里的方法换语言就失效；表示学习从数据里学先验，才能迁移。
    - listitem [ref=f285e264]: ◈ 语言距离效应给出能力地图：与预训练 53 语相近的语言受益最大（加泰罗尼亚 85%+），谱系疏远的泰米尔 65–70%——「any language」的边界由预训练语言的覆盖度决定，扩展覆盖是下一步的杠杆。
    - listitem [ref=f285e265]: ◈ 其余消融：更大预训练更好（300M > 95M）；嵌入维度 64–128 甜点；欧氏略优于余弦；微调末层 +2–3% 但计算不成比例。
  - heading "§04 贡献" [level=2] [ref=f285e266]:
    - generic [ref=f285e267]: §04
    - text: 贡献
  - generic [ref=f285e268]: 五点：从范式突破到开源落地
  - generic [ref=f285e269]:
    - generic [ref=f285e270]:
      - generic [ref=f285e271]: "1"
      - paragraph [ref=f285e272]: 首次实现可跨语言泛化（含未见语言）的小样本 KWS：打破「每种新语言都要大量标注」的传统假设——为低资源语言 KWS 部署开辟新路径。
    - generic [ref=f285e273]:
      - generic [ref=f285e274]: "2"
      - paragraph [ref=f285e275]: 证明多语言自监督表示的关键作用：XLSR 显著优于单语模型与 MFCC——自监督的通用声学表示能跨越语言边界。
    - generic [ref=f285e276]:
      - generic [ref=f285e277]: "3"
      - paragraph [ref=f285e278]: 实用的低资源框架：语言学家或社区工作者录几个关键词发音即可启动 KWS 系统——极大降低新语言门槛。
    - generic [ref=f285e279]:
      - generic [ref=f285e280]: "4"
      - paragraph [ref=f285e281]: 系统性消融：预训练模型/嵌入维度/样本数量/距离度量的影响都有对照——给实践者清晰指导。
    - generic [ref=f285e282]:
      - generic [ref=f285e283]: "5"
      - paragraph [ref=f285e284]: 开源实现（harvard-edge/multilingual_kws）：预训练模型、训练/评估脚本、示例数据齐全——社区可直接扩展到更多语言。
  - heading "§05 局限与判断" [level=2] [ref=f285e285]:
    - generic [ref=f285e286]: §05
    - text: 局限与判断
  - generic [ref=f285e287]: 精度上限 · 部署体积 · 声调与负类
  - generic [ref=f285e288]:
    - img [ref=f285e289]:
      - generic [ref=f285e291]: 边界与延伸
      - generic [ref=f285e293]: 技术边界
      - generic [ref=f285e294]: · 准确率上限：1–3 shot 仍比全监督低 15–20pp——高要求商用
      - generic [ref=f285e295]: （智能音箱唤醒）尚不满足；few-shot 是「可用」不是「最优」
      - generic [ref=f285e296]: · 预训练体积：XLSR 约 3 亿参数 vs 端侧 KWS <1M——直接部署
      - generic [ref=f285e297]: 不现实，蒸馏/压缩是必经之路
      - generic [ref=f285e298]: · 声学相似混淆：yes/yeah、no/know 在嵌入空间距离近——
      - generic [ref=f285e299]: 小样本下更严重，所有语言通病
      - generic [ref=f285e300]: · 声调语言：声调在基频时间轨迹上——XLSR 是否充分捕获
      - generic [ref=f285e301]: 尚不清楚（中文/越南语/泰语的风险点）
      - generic [ref=f285e302]: · 负类建模：开放集的非关键词多样性极高，单一负面原型
      - generic [ref=f285e303]: 难以覆盖全部变体
      - generic [ref=f285e305]: 实验边界 + 延伸
      - generic [ref=f285e306]: · 极端低资源（方言/濒危语言）评估有限——与预训练语言
      - generic [ref=f285e307]: 差异可能更大
      - generic [ref=f285e308]: · 未探索压缩后的跨语言性能保持（部署关键）
      - generic [ref=f285e309]: · 无噪声/远场鲁棒性评估
      - generic [ref=f285e310]: · 未与文本/音素跨语言方法对比（如 IPA 桥接）
      - generic [ref=f285e311]: 延伸：蒸馏到小 footprint 上边缘；IPA 音标作跨语言桥梁
      - generic [ref=f285e312]: （文本与音频嵌入对齐）；在线增量适配（用得越多越准）；
      - generic [ref=f285e313]: 预训练语言组合的选择策略
      - generic [ref=f285e314]: 可迁移判断：自监督多语言预训练为打破 KWS 的语言壁垒提供根本性方案——「通用 KWS（一个模型服务所有语言）」从愿景变成工程问题；这项工作对语音技术的公平可及性有直接意义
    - generic [ref=f285e315]: 图4 · 边界与延伸：左技术边界（few-shot 精度上限、3 亿参数体积、声学混淆、声调语言、单一负面原型），右实验边界（极端低资源、压缩保持、噪声远场、无文本方法对比）+ 延伸方向。
  - generic [ref=f285e316]:
    - generic [ref=f285e317]: 可迁移判断
    - paragraph [ref=f285e318]: ↳ 表示决定迁移上限：跨域任务的表现上限由表示的「域覆盖度」决定——单语表示换语言就漂移、手工特征直接塌掉。凡是要迁移的下游任务，先问表示是在多大的域上学出来的。
    - paragraph [ref=f285e319]: ↳ 冻结大骨干 + 轻适配是 few-shot 的黄金结构：可训参数压到 0.03%——小数据不会把大模型带偏，训练成本也不成问题。「大而冻 + 小而训」值得作为默认起点。
    - paragraph [ref=f285e320]: ↳ 均值是最被低估的分类器：原型网络的全部推理就是求平均比距离——零训练换新类。凡是「新类别只有几个样本」的场景（新词/新说话人/新事件），先试原型再谈微调。
    - paragraph [ref=f285e321]: ↳ 通用 KWS 从愿景变成工程问题：「一个模型服务所有语言」的剩余障碍是明确的：压缩到端侧、声调覆盖、负类建模、语言覆盖扩展——每一条都有工程路径，不再是科学问题。
