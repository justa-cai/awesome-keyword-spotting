- generic [ref=f285e2]:
  - generic [ref=f285e3]: 论文精读 · 可视化版 · 2021 №13 · 系列基石
  - heading "5 个样本唤醒一门新语言： 多语言预训练把 KWS 的语言壁垒拆掉" [level=1] [ref=f285e4]: 5 个样本唤醒一门新语言：多语言预训练把 KWS 的语言壁垒拆掉
  - generic [ref=f285e5]:
    - generic [ref=f285e6]: Few-Shot KWS Any Language · 哈佛 EDGE / Coqui / Google
    - generic [ref=f285e7]: Interspeech 2021 · arXiv 2104.01454
    - generic [ref=f285e8]: XLSR-53（53 语 · 300M）+ 原型网络
    - generic [ref=f285e9]: 未见语言 5-shot 约 70–80%（MFCC 塌到 40–50%）
  - generic [ref=f285e10]: 一句话：全球 7000+ 种语言，但 KWS 只覆盖少数高资源语。本文用三阶段框架拆语言壁垒：XLSR-53 多语言自监督预训练（53 语约 4 万小时）学语言无关表示 → 冻结骨干只训约 10 万参数的适配层 → 推理时原型匹配（支持集嵌入求均值即原型，换新词零训练）。对训练中完全未见过的语言，5 个样本即达约 70–80% 准确率（随机 20%）——为低资源语言的 KWS 部署开辟了「录 5 条音频就能用」的新路径。
  - generic [ref=f285e11]:
    - generic [ref=f285e12]: TL;DR
    - listitem [ref=f285e13]: ◈ 问题三层：低资源语言收集大规模标注不可能（可能只有几分钟数据）；高资源语言也有自定义唤醒词的 few-shot 需求；对训练中完全未见过的语言（越南语/泰米尔语/加泰罗尼亚语）也要能泛化——不能依赖任何单语言的声学先验。
    - listitem [ref=f285e14]: ◈ 三阶段框架：多语言预训练（表示）→ 小样本嵌入学习（冻结 XLSR-53 + 1–2 层 FC 适配层，1024→64–128 维，只训 ~10 万参数）→ 推理时原型匹配（支持集均值 = 原型）。
    - listitem [ref=f285e15]: ◈ XLSR-53 是关键选择：53 种语言联合的对比学习目标迫使表示捕获跨语言共同结构（共振峰/音节/韵律/音素对应）——单语 wav2vec 换语言就分布漂移，XLSR 让未见语言也落在合理区域。消融：比单语高 10–15pp，未见语言差距更大。
    - listitem [ref=f285e16]: ◈ 原型网络为什么合适：换新词只需 5 次嵌入 + 求平均——零训练成本；新语言新词当天可用。负类处理：所有非目标词聚合为一个「负面原型」承担拒识（开放集 KWS 的必需品）。
    - listitem [ref=f285e17]: ◈ 训练协议：标准 episode（N-way K-shot 模拟推理场景）+ 9 种语言开放语料（Common Voice 英法德西 + Aishell 中 + 俄波葡土）+ SpecAugment/噪声。
    - listitem [ref=f285e18]: ◈ 结果（约值）：未见语言 5-shot 70–80%（随机 20%）；已见语言 5-shot 85–95%；MFCC 跨语言塌到 40–50% vs XLSR 75–85%——手工特征没有跨语言泛化性，预训练表示是必需品不是奢侈品。
    - listitem [ref=f285e19]: ◈ 样本边际收益：1→5 shot 最大（+10~15pp），5→10 +3~5pp，之后递减——「5 个样本」是性价比甜点。语言距离效应：相近语言（加泰罗尼亚）85%+，疏远语言（泰米尔）65–70%——谱系距离决定迁移上限，但都远高于随机。
    - listitem [ref=f285e20]: ◈ 边界：1–3 shot 比全监督低 15–20pp（商用唤醒尚不满足）；XLSR 3 亿参数无法直接上端侧（蒸馏是必经之路）；声调语言的基频轨迹捕获存疑；单一负面原型难以覆盖开放集多样性。
  - heading "§01 问题：语言壁垒的三堵墙" [level=2] [ref=f285e21]:
    - generic [ref=f285e22]: §01
    - text: 问题：语言壁垒的三堵墙
  - generic [ref=f285e23]: 跨语言差异 · 数据稀缺 · 零样本迁移
  - generic [ref=f285e24]:
    - generic [ref=f285e25]:
      - heading "跨语言差异巨大" [level=3] [ref=f285e26]
      - paragraph [ref=f285e27]: 音素集（英语约 44 个 vs 日语约 20 个）、韵律模式（声调 vs 非声调）、声调系统差异巨大——模型必须在这些差异之上找到通用的声学相似性度量，否则每门新语言都要从零学。
    - generic [ref=f285e28]:
      - heading "数据极度稀缺" [level=3] [ref=f285e29]
      - paragraph [ref=f285e30]: 低资源语言可能只有几分钟标注数据——传统监督学习完全不可行。即使高资源语言，用户自定义唤醒词的需求也是 few-shot 场景：5–10 个样本就要适配新词。
    - generic [ref=f285e31]:
      - heading "零样本语言迁移" [level=3] [ref=f285e32]
      - paragraph [ref=f285e33]: 对训练中完全未见过的语言也要泛化——模型不能依赖任何特定语言的声学先验，必须学语言无关的通用语音表示。这是「any language」的全部含义，也是最硬的要求。
    - generic [ref=f285e34]:
      - heading "声学相似性混淆" [level=3] [ref=f285e35]
      - paragraph [ref=f285e36]: 不同语言中声学相似的音素可能导致误检测——yes/yeah、no/know 在嵌入空间天然距离近，小样本设置下混淆更严重。这是所有语言的通病，也是原型方法的固有软肋。
