      - generic [ref=f69e62]: 三个层层递进的挑战：① 如何复用 Whisper 编码器隐状态做开放词表检测——决定额外开销能否压到极致（答案：0.2M 四层 CNN）；② 0.2M 容量有限，要 F1≈0.9 就必须微调编码器，而微调冲击通用识别——如何让 KWS 与 ASR 互相成全而非拆台（灾难性遗忘是论文亲口承认并实测到的失败模式）；③ 微调在真实域出错率回升时，如何退一步做成完全不动主模型的即插即用模块，兼容 small / medium / large-v2 任意冻结尺寸——决定工程落地半径。
