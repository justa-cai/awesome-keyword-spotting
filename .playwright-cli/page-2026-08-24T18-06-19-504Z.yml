        - heading "一分钟版本" [level=2] [ref=f69e26]
        - list [ref=f69e27]:
          - listitem [ref=f69e28]: 痛点：E2E ASR（Whisper，68 万小时弱监督）对低频实体词（人名 / 术语 / 产品名）识别差；华为技术演讲场景实体词用户临时给定、中英混说——不可能预训进模型，也不可能每个新词重训。
          - listitem [ref=f69e29]: 方案骨架：离线用 TTS 给每个实体「纯文本入职」（合成语音过 Whisper 编码器存特征库）；在线把输入语音的编码器多层加权特征与库中实体算余弦相似度矩阵，实体出现时矩阵浮现对角线纹理，一个 0.2M 四层 CNN 判「出现 / 未出现」→ 检出的实体喂进 Whisper 解码器提示。
          - listitem [ref=f69e30]:
            - text: 训练：多任务 Loss = L
            - subscript [ref=f69e31]: ASR
            - text: + 3·L
            - subscript [ref=f69e32]: KWS
            - text: ，两阶段（先冻结训 CNN+解码器 10 ep，再解冻全模型 50 ep）。解冻编码器是精度主引擎——冻结时 F1 只有 0.6 档，解冻后 0.9；混合语料（zh+en）换域外泛化。
          - listitem [ref=f69e33]: 微调的坑（诚实暴露）：小数据微调引发灾难性遗忘——内部技术演讲集 MER 从基线 5.9 飙到 14.7（zh 微调）。
          - listitem [ref=f69e34]: 正解是插件：冻结任意尺寸 Whisper 挂 OV-KWS，「口语化提示」（用「呃」「好，那我就继续讲」等不流利标记把实体包成完整句）全面最优——large-v2 上 MER 4.4→2.9、召回 87.3→97.7%，冻结 small 插件甚至全面反超微调版。
    - generic [ref=f69e35]:
      - paragraph [ref=f69e36]: §01 · 问题陈述
      - heading "Whisper 有提示通道，但没人回答「提示里该放什么词」" [level=2] [ref=f69e37]
      - generic [ref=f69e39]: Whisper 原生提供注入先验的通道——解码时给一段文本提示，模型据此调整输出，不必像前代方法那样外挂偏置模块。但前提问题没解决：提示里放什么？用户手输实体列表可以，全自动系统就必须先从音频里「知道」哪些实体真的出现了——这正是一个开放词表关键词检测问题。把整张实体清单一股脑塞进提示（朴素提示）在自发口语、代码混说会话里会引发幻觉；清单长而实际只出现一两个词时信噪比也很差。论文整个系统围绕「用极轻量 KWS 前端自动生成 Whisper 提示」展开。
