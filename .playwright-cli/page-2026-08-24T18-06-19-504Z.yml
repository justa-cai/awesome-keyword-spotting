        - generic [ref=f69e130]:
          - text: 人话：为什么必须两个损失同时在场——0.2M 的 CNN 太小，冻结的 Whisper 编码器特征不是为「帧级实体对齐」学的，检测精度上不去（冻结时 F1 仅 0.60–0.68）；必须放开编码器让它朝 KWS 适应，而一旦放开，若没有 L
          - subscript [ref=f69e131]: ASR
          - text: 拽着，通用识别能力就流失。α=3（KWS 权重更高）论文直接给定、无敏感性实验。两阶段：先冻结训 CNN+解码器 10 ep（可训练 153.8M），再解冻全模型 50 ep（241.9M，OV-KWS 相关参数从 0.2M 涨到 88.4M）——先让小分类器在固定特征空间收敛，避免训练初期大模型把它「带崩」。微调期间提示里放本句真实出现的词，解码器由此建立「提示词应被优先输出」的条件行为——推理时换成 OV-KWS 预测的实体才能无缝衔接。
