    - generic [ref=f139e224]:
      - generic [ref=f139e225]: JUDGEMENT
      - paragraph [ref=f139e226]: ↳ 输出的「词表」决定换词成本：字符级输出让词表变成「任意字符串」——换词从「重新训练」降为「改一行配置」；输出空间的设计就是产品灵活性的设计，这是开放词汇系统的第一性选择。
      - paragraph [ref=f139e227]: ↳ 流式检测=「增量概率 + 即时阈值」：前向变量的增量更新让「词已说出的概率」随时可算——不需要等任何窗口对齐；这个模式是所有流式序列检测（CTC/RNN-T/Transducer）的公共内核。
      - paragraph [ref=f139e228]: ↳ 在线约束是架构的宪法：单向 RNN 不是选择而是义务——任何依赖未来信息的组件（双向、全局池化、完整话语解码）都与在线不兼容；架构审查的第一问永远是「这个组件看得到未来吗」。
