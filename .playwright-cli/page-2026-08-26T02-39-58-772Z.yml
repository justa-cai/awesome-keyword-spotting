    - generic [ref=f139e72]:
      - generic [ref=f139e73]:
        - heading "CTC 坍缩" [level=3] [ref=f139e74]
        - text: blank 为主的帧串 → 去空去重 → 字符序列——对齐被前向后向积分掉，无需帧级标注。
      - generic [ref=f139e75]:
        - heading "增量前向变量" [level=3] [ref=f139e76]
        - text: α(t,s) = 第 t 帧、词第 s 字符的累积概率——每来一帧增量更新，检测分 = α(t,S)。
      - generic [ref=f139e77]:
        - heading "触发与重置" [level=3] [ref=f139e78]
        - text: 超阈值立即触发 → 重置前向变量与 RNN 隐状态——已检词不影响下一次。
      - generic [ref=f139e79]:
        - heading "字符级的意义" [level=3] [ref=f139e80]
        - text: 输出空间是字符——换词只是换监控的字符串，声学模型一个参数都不动。
