    - text: 一句话：单向字符级 RNN 逐帧输出字符分布（a-z + 空格 + blank），检测逻辑用增量 CTC 前向变量实时算「词已说出的概率」，超阈值立即触发——同一模型检测任意关键词（改字符序列即可），在线精度 ≈ 离线、词尾后 200-500ms 触发。
