    - generic [ref=f316e84]: 图 1 · 全景：MCU 三重约束 → 四件套方法论 → 部署闭环 → 核心数字带
    - paragraph [ref=f316e85]: 论文的起点是一个被许多研究跳过的现实：唤醒词设备的大多数出货形态是 单片机（MCU），不是手机 SoC。SRAM 只有几百 KB，主频一两百 MHz，没有任何 AI 加速单元——所有乘加都靠 CPU 通用指令硬算。标准 CNN 的参数量和计算量在这个约束下直接出局，深度可分离卷积（DSConv）是当时的标准答案。但作者指出一个空白：DSConv 降复杂度已被反复证明，「量化对 DS-CNN KWS 精度的影响」却没有系统数据——而部署必然要做量化。这篇论文就是填这个空白的。
  - generic [ref=f316e86]:
    - generic [ref=f316e87]: "02"
    - heading "机制：DSConv 拆的是什么，两种定点差在哪" [level=2] [ref=f316e88]
    - paragraph [ref=f316e89]: DSConv 的思路是把标准卷积耦合在一起的两件事拆开：空间卷积（每个通道独立做）和 通道混合（用 1×1 卷积跨通道融合）。标准卷积一步做两件事，复杂度正比于 N·K²；拆开后近似降为 1/N + 1/K² 的量级。对输入只有 1 秒 MFCC 特征的 KWS 任务，小网络完全吃得住这个算子的表达力。
    - img [ref=f316e90]:
      - generic [ref=f316e92]: 机制解剖：DSConv 的拆法 · 两种定点的差异
      - generic [ref=f316e93]: 标准卷积 vs DSConv
      - generic [ref=f316e95]: 标准卷积一步做两件事
      - generic [ref=f316e97]: 空间卷积 + 通道混合 同时做
      - generic [ref=f316e98]: 复杂度 ∝ N·K²（N 输出通道 · K 核尺寸）
      - generic [ref=f316e99]: DSConv 拆成两步
      - generic [ref=f316e101]: 深度卷积
      - generic [ref=f316e102]: 每通道独立
      - generic [ref=f316e104]: 逐点 1×1
      - generic [ref=f316e105]: 通道间融合
      - generic [ref=f316e106]: 复杂度 ≈ 1/N + 1/K²（相对标准卷积）
      - generic [ref=f316e107]: KWS 输入 1 秒 × MFCC → 小网络吃得住
      - generic [ref=f316e108]: 两种定点量化
      - generic [ref=f316e110]: 混合位宽（Mixed Fixed-Point）
      - generic [ref=f316e111]: · 对量化敏感的层 → 16 位 · 不敏感的层 → 8 位
      - generic [ref=f316e112]: · 相同平均位宽下精度高于统一量化
      - generic [ref=f316e113]: · 需要逐层敏感度分析（哪层敏感要先测）
      - generic [ref=f316e114]: 动态定点（Dynamic Fixed-Point）
      - generic [ref=f316e115]: · 每层独立确定小数点位置（bit split）
      - generic [ref=f316e116]: · 按各层权重/激活的实际数值范围动态调参
      - generic [ref=f316e117]: · 避免固定参数导致的溢出或精度损失
      - generic [ref=f316e118]: 结论档位：
      - generic [ref=f316e119]: · 8 位定点：几乎无精度损失 · 模型 −75%
      - generic [ref=f316e120]: · 4 位定点：精度开始明显下降
      - generic [ref=f316e121]: "对比同期（2022 #36 亚 8 比特）：那篇走分布整形，"
      - generic [ref=f316e122]: 这篇走位宽分配——两条路线
      - generic [ref=f316e123]: 左：DSConv 把「空间+通道」耦合的标准卷积拆成两步各司其职——小模型的核心算子。右：混合位宽按敏感度分配 · 动态定点按数值范围定位——本文量化研究的两条腿
    - generic [ref=f316e124]: 图 2 · 机制解剖：标准卷积 vs DSConv 的拆分 · 混合位宽与动态定点两种量化方案
    - generic [ref=f316e125]:
      - generic [ref=f316e126]: 标准卷积：每输出通道都要看全部输入通道 × 全部核位置 → O(N·K²·D) DSConv：深度卷积 O(K²·D) + 逐点卷积 O(N·D) → 相对开销 ≈ 1/N + 1/K²
      - generic [ref=f316e127]: 人话：标准卷积像「每个评委都要翻完所有材料」，DSConv 先让每个人只看自己那页（深度卷积），再用一个快速汇总会（1×1）交流意见——步骤多了，但每步便宜得多，总账大幅下降。
    - paragraph [ref=f316e128]: 量化部分论文系统对比了两种定点方案，它们解决的是不同的问题：
    - generic [ref=f316e129]:
      - generic [ref=f316e130]:
        - heading "混合位宽（Mixed Fixed-Point）" [level=4] [ref=f316e131]
        - paragraph [ref=f316e132]: 对量化敏感的层留 16 位、不敏感的层压到 8 位。相同平均位宽下精度高于统一量化——代价是要先做逐层敏感度分析。
      - generic [ref=f316e133]:
        - heading "动态定点（Dynamic Fixed-Point）" [level=4] [ref=f316e134]
        - paragraph [ref=f316e135]: 每层独立确定小数点位置（bit split），按各层权重/激活的实际数值范围调参——避免固定格式导致的溢出或精度浪费。
      - generic [ref=f316e136]:
        - heading "再往下压的墙" [level=4] [ref=f316e137]
        - paragraph [ref=f316e138]: 4 位定点精度开始明显下降——这一档不是「调参」能解决的，需要分布整形类专门方法（后来 2022 年的亚 8 比特工作走的就是那条路）。
    - paragraph [ref=f316e139]: 数据增强是另一半方法主体：作者用空调、风扇、键盘敲击、谈话声等室内实录噪声，在 SNR −5dB 到 +20dB 多档混合，而不是惯用的高斯白噪。这个选择在后面的评估里被证明是关键的。
