    - heading "为什么值得读：一篇「把链条走完」的论文" [level=2] [ref=f316e15]
    - generic [ref=f316e16]:
      - generic [ref=f316e17]: TL;DR
      - list [ref=f316e18]:
        - listitem [ref=f316e19]: ◆ 大量 KWS 论文止步于「准确率表」，这篇把 架构选择 → 量化 → 数据增强 → 真机部署 → 匹配/不匹配噪声评估 整条链走完，是难得的完整工程记录。
        - listitem [ref=f316e20]: ◆ 核心结论一：8 位定点几乎无精度损失，模型体积 −75%——嵌入式量化的默认档位，不需要任何花哨技巧。
        - listitem [ref=f316e21]: ◆ 核心结论二：真实实录噪声增强优于人工（高斯白噪）增强，在未见过的不匹配噪声上更稳——增强素材与部署声学的分布一致性比噪声量更重要。
        - listitem [ref=f316e22]: ◆ 边界清醒：仅 10 词词表、单通道、M4 平台绑定；4 位以下精度明显下降，需要后续分布整形类方法（如 2022 年亚 8 比特工作）接力。
