      - generic [ref=f316e220]:
        - generic [ref=f316e221]: "1"
        - paragraph [ref=f316e222]: 量化不是最后一公里才做的事。8 位定点几乎免费——精度几乎不掉、体积 −75%。把它留在部署末期才碰，等于全程背着 4 倍大的模型做开发迭代。
      - generic [ref=f316e223]:
        - generic [ref=f316e224]: "2"
        - paragraph [ref=f316e225]: 网格搜索显示 DS-CNN 在 KWS 上有大量冗余参数。系统扫描核数量/层数/核大小后，复杂度还能再降数倍而精度只轻微下降——默认配置远不是帕累托前沿。
      - generic [ref=f316e226]:
        - generic [ref=f316e227]: "3"
        - paragraph [ref=f316e228]: 真实噪声增强在不匹配噪声上优于人工噪声增强。实录噪声带着真实的谱结构（空调的低频轰鸣、键盘的瞬态冲击），高斯白噪没有——增强素材与部署声学的分布一致性，比噪声的量更重要。
      - generic [ref=f316e229]:
        - generic [ref=f316e230]: "4"
        - paragraph [ref=f316e231]: M4 真机闭环不是装饰。MFCC 前端 + 定点推理全在 MCU 上，参数存 Flash、激活存 SRAM，推理远快于音频采集（实时成立）——「匹配噪声（训练见过）/不匹配噪声（未见）」分列评估给了鲁棒性主张一个对照面。2020 年同时具备这两点的论文不多。
