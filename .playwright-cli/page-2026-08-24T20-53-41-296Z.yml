      - generic [ref=f135e229]: 消融的三条发现（Table 5，SC2，C=16）：① 把 SG-VAD 式联合训练搬来没有收益——配吃 x⊙z 的 MatchboxNet 辅助分类器 95.6±0.26 对完整版 95.7±0.17，差异全在波动区；② 重建正则同样没有收益（95.5±0.32）——生成式约束「保留重建输入所需的充分信号」与判别目标「只留最少必需支撑」方向冲突；③ 去掉整个伯努利近似（不加噪声、不截断、去 L_sparse，退化为缩小版 MatchboxNet）掉到 94.7±0.13——门控机制净贡献约 1 个点。三条合起来支撑最反直觉的主张：一张稀疏 0/1 门控图 + 一层线性投影，就是充分且近乎最优的分类结构。机制解释：交叉熵梯度已穿过线性头直接作用在门上，判别监督不缺位，辅助头自然无事可做。
