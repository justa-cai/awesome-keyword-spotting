      - paragraph [ref=f135e15]: 作者：Jonathan Svirsky、Uri Shaham、Ofir Lindenbaum —— 巴伊兰大学（以色列）
      - paragraph [ref=f135e16]: 发表：arXiv 2406.06634（2024-06）· 代码开源 github.com/jsvir/sparknet（NeMo 实现）
      - generic [ref=f135e17]:
        - generic [ref=f135e18]: 表示级二值化（非权重）
        - generic [ref=f135e19]: 高斯伯努利随机门
        - generic [ref=f135e20]: erf 闭式 L0 稀疏
        - generic [ref=f135e21]: 免逐元素乘法推断
        - generic [ref=f135e22]: 454.5K MACs · SC2 95.7
        - generic [ref=f135e23]: 最小 1.4K 参数仍 83%
      - generic [ref=f135e24]:
        - heading "一分钟版本" [level=2] [ref=f135e25]
        - list [ref=f135e26]:
          - listitem [ref=f135e27]: 场景与硬约束：KWS 是 MCU 级（STM32：SRAM 20–512KB、Cortex-M 72–216MHz）上的全天候常驻负载——单次推理多出的每一笔乘加都被运行时间放大成功耗与发热。现有端侧模型（MatchboxNet / DS-ResNet / BC-ResNet / TinySpeech）2.7K–19.9K 参数量级的 MACs 普遍 2.6M–10.9M，对常驻负载仍是重担；且把全部时频单元一视同仁送进特征抽取器，从未在表示层回答「哪些 MFCC 时频格真正携带判别信息」。
          - listitem [ref=f135e28]: 核心赌注（全文最反直觉）：让一个小网络为每个输入预测一张二值化时频门控图 z，判别信息直接浓缩进 0/1 模式，分类器退化为一层线性投影——骨干极小、分类头近乎为零的「倒挂」结构，全部算力收益都从这个倒挂里来。
          - listitem [ref=f135e29]: 可微二值化：μ∈[−1,1] 经 z = clamp(0.5+μ+ε, 0, 1)、ε~N(0, 0.5²) 的高斯伯努利松弛——重参数化让梯度绕过离散化；0.5 偏移使「开门是默认（μ=0 时开门概率 ~84%），关门要主动压 μ 到 −0.5 以下」。二值化的是表示不是权重（与 BNN 方向不同），不依赖特殊位运算内核即可部署。
          - listitem [ref=f135e30]: 损失一压一拉：erf 闭式近似的 L0 稀疏项（恰等于期望开门率，无需采样）关门 + 交叉熵（λ=100）为关键特征开门，收敛到「只保留判别必需的最少时频支撑」。
          - listitem [ref=f135e31]: 对前作 SG-VAD 的关键简化：分类器直接吃 z 本身（而非 z⊙x 喂辅助分类器）——砍掉一整条逐元素乘法路径；z 的身份从「输入的掩码」升级为「输入的充分统计量」。消融证明辅助分类器（95.6）与重建解码器（95.5）都冗余——完整版 95.7，差异全在波动区内。
          - listitem [ref=f135e32]: 结果：小量级对局 SparkNet[C=16]（4,636 参数）对 BC-ResNet-0.625（4,585 参数）：SC1 95.3 vs 95.2、SC2 95.7 vs 95.4，MACs 454.5K vs 1.9M（↓4×）；C=32 版 1.2M MACs 比 BC-ResNet-1 快 3×、比 DS-ResNet10 快 5×。噪声鲁棒性 0–20dB 六条件全部占优（10dB +0.69、15dB +0.91 最明显）。缩放下界：C=4 仅 1.4K 参数、105K MACs 仍有 ~83%。
          - listitem [ref=f135e33]: 边界要诚实：SC1 上 C=32（96.2）仍低于 BC-ResNet-1（96.6）0.4 点；效率结论完全建立在 MACs 代理指标上（无真机时延 / 内存 / 能耗）；推断时 z 的 0/1 语义（去噪后硬阈值？）未说清——免乘法累加的硬件红利没有兑现实验；稀疏度无定量统计；C=4 断崖说明门控表示的判别容量在极小通道下先耗尽。
    - generic [ref=f135e34]:
      - paragraph [ref=f135e35]: §01 · 问题陈述
      - heading "批评的焦点不是「不准」，是「计算形态不必要地贵」" [level=2] [ref=f135e36]
      - generic [ref=f135e38]: 为什么 KWS 对「每个准确率百分点的 MACs 价格」最敏感：KWS 常驻监听（不像拍照识别偶发触发），检测到唤醒词后才激活更重的本地 / 云端 ASR——这带来功耗、带宽、隐私、可靠性、成本、响应六重收益，也意味着单次推理的每笔乘加都被全天候运行时间放大。MCU 两条硬约束——片上 SRAM 要同时放输入输出 / 权重 / 激活（20–512KB）、Cortex-M 每秒运算数受限（72–216MHz）——最终都压到「参数量与运算次数必须同时极小」。
      - generic [ref=f135e39]: 三层不足：① 小足迹 CNN/RNN 与注意力路线（MatchboxNet 的 TCS、res8-narrow 深残差、DS-ResNet、BC-ResNet 二维卷积、TinySpeech attention condenser）为达 SOTA 精度依赖二维卷积或注意力块，MACs 2.6M–10.9M 仍是重担；② 结构性缺陷——全部输入时频单元一视同仁送进特征抽取器，从未在表示层回答「哪些时频格真正携带判别信息、哪些是噪声」；量化 / 剪枝是训练后补救，同样不改变「每个时频格都要被完整计算」；③ 特征选择一系（locally sparse networks、SG-VAD）学会了样本自适应的门，但推断与训练都要把门与输入逐元素相乘（z⊙x）再喂辅助分类器——这笔逐元素乘法是可以省掉的冗余。
      - generic [ref=f135e40]: 三个具体挑战：二值化是离散操作，硬阈值切断梯度——需要可微训练机制把「开门 / 关门」变成可优化的连续量；信息充分性——一张 0/1 门控图 + 一层线性投影，容量是否足以支撑 SOTA 级精度（全文最反直觉的赌注，消融正面回答）；稀疏性必须显式优化，否则门全开、选择效应消失。定量目标：与此前端侧兼容 SOTA 同参数量、同精度量级，MACs 缩到四分之一。
