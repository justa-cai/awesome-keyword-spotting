          - heading "技术局限" [level=4] [ref=f135e250]
          - list [ref=f135e251]:
            - listitem [ref=f135e252]: 效率结论建立在代理指标上：无任何真实 Cortex-M/STM32 上的墙钟时延、SRAM 峰值、能耗测量——实际速度还取决于算子是否落到高效内核、访存模式、BN 与池化开销。
            - listitem [ref=f135e253]: 推断路径的二值化语义没说清：训练时 z 是加噪截断的近似伯努利变量，推断时是否去噪硬阈值化未报告——这直接关系到 0/1 取值能否兑现成免乘法累加（表示级二值化相对低比特量化的潜在硬件红利，未展开）。
            - listitem [ref=f135e254]: 稀疏性只有定性证据：未报告门控图实际开门率 / 稀疏度统计；「稀疏到什么程度、稀疏度与精度和鲁棒性的定量关系」没有数据。
            - listitem [ref=f135e255]: 关键超参无敏感性分析：λ=100、σ=0.5 全程固定，两者直接控制开门率与梯度噪声量级——结果的脆弱性无从判断。C=4 断崖与 C=8 落差提示门控表示的判别容量在极小通道下先耗尽，缩放下界明确存在。
