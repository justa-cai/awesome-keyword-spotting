      - generic [ref=f135e263]: 值得补的方向：论文自指——用 SparkNet 式可学习掩码替换 Masked Autoencoders that Listen 的随机掩码（随机遮蔽无差别、可学习掩码带语义选择遮哪里，与掩码自监督天然契合）。工程侧还值得追四条：补真机验证闭环，把 z 的 0/1 语义落实到免乘法累加内核，实测相对 int8 的时延能耗优势，把「4 倍少 MACs」兑换成「4 倍快」；把开门率做成显式部署旋钮（λ / σ 扫描），画稀疏度-精度-鲁棒性权衡面；扩展到流式多词检测与自定义唤醒词，检验门控表示在开放时间轴和新词类的迁移；与权重二值化正交叠加（二值骨干 + 门控表示），进一步压算力。
