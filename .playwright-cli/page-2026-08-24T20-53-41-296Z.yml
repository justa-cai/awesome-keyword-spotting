          - list [ref=f135e258]:
            - listitem [ref=f135e259]: 任务覆盖窄：只有 Speech Commands 1 秒封闭集 12 分类——没有流式检测（连续音频上的唤醒词发现、误报 / 漏报曲线）、没有多词或自定义唤醒词场景，而这些才是产品的真实负载。
            - listitem [ref=f135e260]: 基线覆盖不完整：Table 3 里 TinySpeech-X / res8-narrow / DS-ResNet10 / TinySpeech-Z 的 SC2 一栏全空；噪声实验只对比一个对手；缺 int8 量化与权重二值化（BNN）对照——它们乘法本身已被换成低位宽运算，用 MACs 口径比不完全公平。
            - listitem [ref=f135e261]: 训练协议小不一致：背景噪声增强只加在 C=32 上（自家版本训练条件不对齐）；学习率日程比例相加超 100% 疑为笔误；Table 3 与 Table 4 同配置数字略有出入（不同批次运行未说明）。
