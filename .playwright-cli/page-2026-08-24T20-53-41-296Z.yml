      - heading "四条贡献" [level=2] [ref=f135e232]
      - generic [ref=f135e234]:
        - generic [ref=f135e235]:
          - generic [ref=f135e236]: "1"
          - text: SparkNet 极简架构：一维 TCS 骨干学样本自适应稀疏二值化表示 + 单层线性头完成 KWS——同参数量做到此前 SOTA（BC-ResNet-0.625）约 1/4 的 MACs（454.5K vs 1.9M）且精度略优（SC2 95.7 vs 95.4）。
        - generic [ref=f135e237]:
          - generic [ref=f135e238]: "2"
          - text: 证明门控表示本身可判别：辅助分类器与重建解码器均不带来增益——为「免逐元素相乘的门控推断」提供实验依据，是对 SG-VAD 范式在 KWS 上的实质简化。
        - generic [ref=f135e239]:
          - generic [ref=f135e240]: "3"
          - text: 噪声鲁棒性 + 机制归因：0–20dB 五档 SNR 一致优于同量级 BC-ResNet；归因于只聚焦有指示性的时频区域（宽带噪声落不进被判别模式占据的少数时频格）。
        - generic [ref=f135e241]:
          - generic [ref=f135e242]: "4"
          - text: 缩放下界：完整精度-算力曲线把可用 KWS 模型压到 1.4K 参数、105K MACs 仍 ~83% 准确率——门控表示的下探空间被明确量化（C=4 断崖标出下界）。
      - generic [ref=f135e243]: 可迁移的工程判断：当任务输入里判别信息天然稀疏（唤醒词只占少数时频格），把「特征选择」本身做成可学习的模型输出、让分类端退化到线性，比「大特征抽取器 + 训练后压缩」更接近算力下界；而「先证伪、再定稿」的消融驱动设计（辅助头 / 重建头逐一证伪冗余）让最终架构是实验筛出的最小充分结构，不是组件堆叠的产物。
