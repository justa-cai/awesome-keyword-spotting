    - heading "5 判断：能带走的三句话" [level=2] [ref=f134e207]:
      - generic [ref=f134e208]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f134e209]:
      - generic [ref=f134e210]: JUDGEMENT
      - paragraph [ref=f134e211]: ↳ 低资源问题要分解成两个独立的缺口：知识缺口（模型不知道什么）与多样性缺口（模型没见过什么变体）——分别对症下药再组合；笼统说「数据不够」会导致选错工具。
      - paragraph [ref=f134e212]: ↳ 微调深度应随数据量单调放开：数据越少越要冻结——全量微调在小数据上是在破坏预训练知识而非学习新任务；「先保住知识，再放开学习」是迁移实践的调度原则。
      - paragraph [ref=f134e213]: ↳ 辅助任务是低资源的免费正则：联合训练的额外梯度信号不需要额外数据——多任务是「用任务多样性替代数据多样性」的手段，在标注贵的场景尤其划算。
