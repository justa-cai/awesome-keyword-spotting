          - generic [ref=f45e200]: 因果一：单用 ANC 反而更差（8.8 > 7.5）——高 SNR / 用户先说话时唤醒词被误判为噪声；降噪通道单独不可靠
          - generic [ref=f45e201]: 因果二：两通道组合收益显著（5.5）且优于参数翻倍（7.0）——低 SNR 增益来自多通道信息而非模型容量
