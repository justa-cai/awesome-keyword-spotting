      - paragraph [ref=f45e221]: §05 · 局限性与展望
      - heading "上限被 ANC 前端封死，特征级线性混合无空间建模" [level=2] [ref=f45e222]
      - generic [ref=f45e224]:
        - generic [ref=f45e225]:
          - heading "方法的技术局限" [level=4] [ref=f45e226]
          - list [ref=f45e227]:
            - listitem [ref=f45e228]: 上限被 ANC 封死：注意力只能在「失真但降噪」与「干净但含噪」间选择，不能修复两者都失效的区域（−25dB 下整套接近失效）；ANC 高 SNR 误压问题只是被全向兜底，未从机制修复。
            - listitem [ref=f45e229]: 特征级线性混合无空间建模：无法表达「声源在哪个方向」，无时延/相位利用——比 3D 卷积吃原始多通道的方案表达天花板更低。
            - listitem [ref=f45e230]: 只用两通道：六波束信息被完全丢弃；更多通道组合（ANC+最优波束+全向）未探索。
            - listitem [ref=f45e231]: 伪标注传导：50 万多通道训练语料全部伪标注（另 1000 万全向伪标注）——伪标签噪声对最终 FRR 的影响未量化。
        - generic [ref=f45e232]:
          - heading "实验设计的不足" [level=4] [ref=f45e233]
          - list [ref=f45e234]:
            - listitem [ref=f45e235]: 绑定单一设备与阵列几何：七麦 4.2cm 环形——跨阵列跨设备无验证；几何一变 ANC 选麦与波束数都要重推。
            - listitem [ref=f45e236]: 关键细节缺失：唤醒词及语言数量、训练超参、SVDF 层数与记忆块尺寸、真实测试集噪声构成——独立复现困难。
            - listitem [ref=f45e237]: 无统计显著性：1 个上下 pp 的差距无置信区间（注意力 5.5 vs 集成 6.4 是否稳定无法判断）。
            - listitem [ref=f45e238]: 单一工作点：只评 FA/h=0.1 一档，无完整 DET 曲线——更严苛误报要求下是否仍占优未知。
            - listitem [ref=f45e239]: 测试集分布偏置：正样本占八成（4 万/5 万），与真实部署唤醒词极低占比相差甚远——FRR 绝对值可能偏乐观。
            - listitem [ref=f45e240]: 对比矩阵缺格：集成+波束未研究（计算复杂）；波束是 oracle 上限的公平偏差未讨论非 oracle 退化。
