        - heading "一分钟版本" [level=2] [ref=f45e25]
        - list [ref=f45e26]:
          - listitem [ref=f45e27]: 设备侧独特机会：云端 ASR 用多通道受上行带宽限制不可行——端侧唤醒不存在带宽问题，芯片上所有麦克风通道现成。设备：7 麦阵列（中心全向 + 6 环形 r=4.2cm）。
          - listitem [ref=f45e28]: 核心发现（单用降噪通道反而更差）：Base+ANC 的 FRR 8.8% > 基线 7.5%——ANC 在高 SNR 或用户先说话时把唤醒词当噪声压制；波束则通过失真/压制有用信号降低性能。降噪通道单独不可靠。
          - listitem [ref=f45e29]: 方案：ANC 通道 + 全向通道 → 约 5 万参数的注意力网络（主干的 1/15）逐特征逐帧 softmax 加权 → SVDF 主干（750K / 3.4MB / RTF 0.18）。高 SNR 信全向、低 SNR 信 ANC——加权组合而非二选一。
          - listitem [ref=f45e30]: 结果：真实测试集（固定 FA/h=0.1）FRR 5.5% 全场最低——对基线相对降 27%、优于参数翻倍（7.0）、逻辑或集成（6.4）、六波束注意力（6.7）；开销只加 RTF 0.03 + 0.1MB。
          - listitem [ref=f45e31]: 前端选择判据：ANC 降噪质量显著优于六静态波束（−20dB：16.8 vs 59.8）且计算更省（RTF 0.070 vs 0.112）——前端选择以下游 KWS 的 FRR 为准绳，不以波束的理论优雅性为准绳。
