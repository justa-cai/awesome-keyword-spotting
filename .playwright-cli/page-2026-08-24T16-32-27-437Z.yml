            - listitem [ref=f39e279]: 掩码率消融只覆盖一个场景：0.15 在 test-other 更高却被放弃，准则未说明。
            - listitem [ref=f39e280]: 中英文场景不均衡：EN 20 个任意词 vs 中文 2 个固定词——「任意关键词 + 噪声」这个 MSD 理论上最该发力的组合没测。
            - listitem [ref=f39e281]: Xiaowen AR 崩溃归因略单一：AISHELL-2 种子偏干净朗读——可能是噪声覆盖不足与 predictor 过拟合双因素；未做「更强噪声增广能否单独救 AR」的对照。
            - listitem [ref=f39e282]: Snips 负样本细节缺失：97h 负样本含训练集负样本且用于 FA 评测——若训练侧也用，FA 数字有乐观风险。
      - generic [ref=f39e283]:
        - heading "下一步方向（论文展望 + 笔者补充）" [level=3] [ref=f39e284]
        - paragraph [ref=f39e285]: ① α 自适应化：在线 SNR 估计 / 双路分数分歧度 / 轻量门控动态加权——消除部署前的人工场景判断。 ② 量化并压缩 SAR 端侧成本：实测双 joiner + 双 lattice 延迟功耗；把 NAR 鲁棒性蒸馏回单路推理（掩码分支能力固化进 encoder）。 ③ 补齐对比与场景：与 U2-KWS / CaTT-KWS 正面对比；「任意关键词 + 远场噪声」组合验证；报参数量与 RTF。 ④ 掩码策略升级：结构化掩码（按音素段 / 按 predictor 层）或训练-推理一致的渐变课程，缩小 0.35 与全零的 gap。 ⑤ 范式外推：「目标序列高度固定 → predictor 过拟合」并非 KWS 独有——定制唤醒词、固定命令词、TTS 固定提示词有同构病灶，MSD 可直接迁移验证。
