      - generic [ref=f39e24]:
        - heading "一分钟版本" [level=2] [ref=f39e25]
        - list [ref=f39e26]:
          - listitem [ref=f39e27]: 结构性病灶：KWS 正样本转写只有关键词本身——predictor 面对固定 transcript 训练，过拟合到关键词文本模式；噪声下倾向「无脑输出关键词」，FA 失控。反直觉证据：流式 AR 解码在噪声集 Xiaowen 崩到 26.30，连 Greedy 的 40.28 都不如——受限搜索放大了过拟合偏置。
          - listitem [ref=f39e28]: 训练解法 MSD：每样本双前向——无掩码输出当教师、随机置零 predictor 输出的掩码输出当学生，KL 自蒸馏对齐 + 三个 RNN-T 损失并训（λ_mask=1、λ_MSD=0.003、γ_mask=0.35）。为什么必须蒸馏：小模型直接掩码学不动（无 MSD 的 NAR test-clean 只有 84.05）。
          - listitem [ref=f39e29]: 推理解法：MSD 解锁 NAR 解码（predictor 整体预置零，过拟合载体物理移除——Xiaowen 26.30→95.33）；SAR 半自回归（关键词 lattice 上并行跑 AR/NAR 两条递推、逐帧 α 加权融合）。
          - listitem [ref=f39e30]: 结果：SAR 五个测试集全部最优（干净集 98.74 吃到 AR 强度、噪声集 95.68 吃到 NAR 鲁棒）；低 FA 区优势最大（FA=1 时 89.49，AR 只有 5.90）——把「阈值敏感性」一并治了。
          - listitem [ref=f39e31]: 单模型单阶段：不加架构、不加级联，代价是每样本双前向 + 推理时双 joiner 双 lattice（开销未量化——最大缺口）。
