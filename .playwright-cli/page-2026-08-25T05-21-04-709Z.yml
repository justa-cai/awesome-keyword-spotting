  - generic [ref=f208e108]:
    - generic [ref=f208e109]: c_n = (1/K) Σ f(x_n,k) → p(y=n|x) = softmax(−dist(f(x), c_n)) → ŷ = argmin_n dist；dist < D_th 接受，否则 unknown
    - generic [ref=f208e110]: 人话：原型是每个伪关键词在嵌入空间的质心；负距离过 softmax 做分类。推理两步走——最近原型回答「是谁」，阈值回答「是不是」：距离小于 Dth 才接受候选类，否则拒识为 unknown，Dth 按目标虚警率调节。训练期的封闭集分类干净地转成了使用期的开放集检测。
  - paragraph [ref=f208e111]: 为什么伪音素当内容因子：wav2vec2.0 的自监督表征携带丰富语音学信息，k-means 得到的 token 序列近似音素级发音单元——想换「视角」只需换参考语音，发音内容不动。与视觉领域用 GAN 潜空间搜索造多视角同思路，但语音侧有伪音素这个显式内容因子，可控性和可解释性更强。
