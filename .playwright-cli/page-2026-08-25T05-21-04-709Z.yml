    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f208e329]
    - list [ref=f208e330]:
      - listitem [ref=f208e331]: ↳ 度量学习的监督是分组关系不是标签语义——凡能免费批量制造「同语义、多视角」样本组的系统（可控合成/潜空间搜索）都能替代标注语料的这一角色。
      - listitem [ref=f208e332]: ↳ 生成数据的「干净」是分布偏科：简单增强把真实条件多样性人工注入合成分布，比追求更高保真的干净合成更划算。
      - listitem [ref=f208e333]: ↳ few-shot 的原型是 K 条嵌入的均值——K 越小，单条样本的域偏差越直接进原型；对注册样本做条件不变的编码器改造，收益在 K 小时被放大。
      - listitem [ref=f208e334]: ↳ 数据生成与数据消费解耦（缓冲区 + 缓慢换血）：生成开销摊薄到近零又不过拟合当前池——replay buffer 的思想适用于一切在线造数据的训练。
      - listitem [ref=f208e335]: ↳ 对比实验要标注域关系：一个数据集赢一个输时，先画「谁同域谁跨域」的不对称表，再下结论。
