    - generic [ref=f208e4]: 论文精读 · 可视化版 · 2022 №17
    - heading "零人工标签训练少样本 KWS： 正负样本都是免费合成的" [level=1] [ref=f208e5]: 零人工标签训练少样本 KWS：正负样本都是免费合成的
    - generic [ref=f208e6]:
      - generic [ref=f208e7]: ICASSP 2023 · 首尔国立大学
      - generic [ref=f208e8]: 伪 TTS 数据引擎 + 原型网络
      - generic [ref=f208e9]: wav2vec2.0 伪音素
      - generic [ref=f208e10]: GSCv1 + MSWC-en · 100 次重复
    - generic [ref=f208e11]: 度量学习的训练目标不需要文本标签——只需要「哪些样本同发音」的分组关系。伪音素切段 × 不同参考语音 = 免费的多视角正样本；不同切段天然互为负样本。
    - generic [ref=f208e12]:
      - heading "一分钟版本" [level=3] [ref=f208e13]
      - list [ref=f208e14]:
        - listitem [ref=f208e15]: ▸ 两根刺：标注依赖（每条「唤醒词出现没出现」都要人听打标，成本随词数线性膨胀）+ 关键词不可换（只为选定词学过判别边界，换词 = 重采+重训+发版）——对用户自定义唤醒词是结构性障碍。
        - listitem [ref=f208e16]: ▸ 核心反问：度量学习只需要样本间的「同/异」分组关系，不需要显式文本监督——如果能批量拿到「同发音、多说话人多韵律」的多视角样本，标注语料还非有不可吗？
        - listitem [ref=f208e17]: ▸ 数据引擎：无标注语音 → wav2vec2.0 表征 → k-means 得伪音素序列 → 随机切段（L∈10–20）成任意「伪关键词」→ 配参考语音喂伪 TTS 合成——发音内容与音色韵律解耦重组，换视角只需换参考语音。
        - listitem [ref=f208e18]: ▸ 三环零标签：wav2vec2.0 自监督 + 伪 TTS 只用无标注语音训练（VITS 架构）+ 原型网络不需标签——任何一环换成有监督组件（如真 TTS），链条就断。
        - listitem [ref=f208e19]: ▸ 域适配：音量缩放（峰值→0.2–0.9）+ 模拟混响（p=0.9）+ MUSAN 加噪（SNR 10–20，p=0.9）——把真实录音的条件多样性人工注入合成分布。
        - listitem [ref=f208e20]: ▸ 缓冲区机制：囤 32768 类、每次迭代抽 512 类训练、换血 1 类——生成开销摊薄到近零，又不过拟合当前缓冲区（与 RL replay buffer 同构的生产者-消费者设计）。
        - listitem [ref=f208e21]: ▸ 主结果：GSCv1 上 1-shot Acc(target) 76.0 vs 监督基线 69.0（+7.0）——两边公平地都跨域时，全无监督反而多数指标占优；MSWC-en（监督主场）落后 3–6 点。
        - listitem [ref=f208e22]: ▸ 增强消融：去掉全部增强 1-shot 从 76.0 崩到 49.5（−26.5）；无增强时 20-shot 的 AUROC（76.7）还不如有增强的 1-shot（81.1）——瓶颈在嵌入空间的域失配，不是样本量。
        - listitem [ref=f208e23]: ▸ 编码器：TC-ResNet 改造——avgpool 换单层 GRU（保关键词内部时序动态）、宽度 k=2（撑 512-way 细粒度）、40 MFCC → 192 维嵌入。
        - listitem [ref=f208e24]: ▸ 边界：合成多样性天花板（MSWC 输 3–6 点的直接原因）；免标注 ≠ 免成本（伪 TTS 训 500k 迭代 + 预生成 32768×6 条）；Dth 定在 EER 而产品工作在极低虚警区；全英语链路零跨语言验证。
    - heading "§01 问题：标注是 FS-KWS 最贵的一环" [level=2] [ref=f208e25]:
      - generic [ref=f208e26]: §01
      - text: 问题：标注是 FS-KWS 最贵的一环
    - generic [ref=f208e27]: 所有路线的预训练都吃真实标注语料
    - paragraph [ref=f208e28]: 分类式 KWS 把一切非目标声音压成单一 other 类——非目标声音在现实里无穷无尽，训练只见有限的负样本集合，检测性能被这个集合的天花板卡住；KWS 在真实场景里更接近开放集检测而非封闭集分类。已有 FS-KWS 路线（元学习/迁移学习/度量学习）在「怎么用少量样本适配新类」上各有创新，但预训练统统依赖大规模带关键词标签的真实语料——数据瓶颈原封不动。
    - generic [ref=f208e29]:
      - generic [ref=f208e30]:
        - heading "常规 TTS 进不了无监督链条" [level=4] [ref=f208e31]
        - paragraph [ref=f208e32]: TTS 本身要文本-语音配对才能训练——招进来就等于把监督从后门放回去了。伪 TTS 是为低资源迁移学习设计的预训练模型：伪音素从 wav2vec2 表征聚类而来，整条链没有一处人工标签。
      - generic [ref=f208e33]:
        - heading "合成到真实的域失配" [level=4] [ref=f208e34]
        - paragraph [ref=f208e35]: 合成语音再干净，与真实录音（信道/混响/噪声/口音）都有分布差距——Table 1 消融显示去掉增强后 1-shot 掉 26.5 个点。「干净」在分布意义上反而是偏科：真实语音的响度、房间、噪声条件它一样都不沾。
