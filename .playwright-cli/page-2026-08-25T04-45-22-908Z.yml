  - generic [ref=f196e300]:
    - heading "可迁移判断（超出 TinyML 也成立）" [level=4] [ref=f196e301]
    - list [ref=f196e302]:
      - listitem [ref=f196e303]: ↳ 压缩掉点的根因诊断决定方法选型：是「丢了参数」还是「丢了表达」——后者要用结构补（换分类头/加非线性），不是少剪。
      - listitem [ref=f196e304]: ↳ 对已紧凑的模型，「重构分类器」比「删参数」更有杠杆——冗余小的模型里每个参数都重要，但分类端还有改良空间。
      - listitem [ref=f196e305]: ↳ 稀疏化方法在 MCU 上天然吃亏（无分支预测 + 无稀疏加速器）；产出密集结构的方法才在边缘侧兑现理论收益。
      - listitem [ref=f196e306]: ↳ 冻结预训练层只训新增部分：收敛快 4 倍且避免灾难性干扰——增量改造大模型时的默认姿势。
      - listitem [ref=f196e307]: ↳ 小模型反而在实测中可能涨点（辅助网络当正则）——压缩不一定伤泛化，别默认「剪必掉」。
