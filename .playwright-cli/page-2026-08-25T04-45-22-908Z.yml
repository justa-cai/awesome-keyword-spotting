  - generic [ref=f196e286]: 「弥补」与「创造」的区别
  - generic [ref=f196e287]:
    - generic [ref=f196e288]:
      - heading "浅层语义瓶颈" [level=4] [ref=f196e289]
      - paragraph [ref=f196e290]: 细粒度时序区分（yes vs yet，最后 50ms 音素差异）依赖深层高级时序模式——过度深剪的损失不可恢复，辅助网络能弥补不能创造原始网络里不存在的信息。
    - generic [ref=f196e291]:
      - heading "只适用于顺序架构" [level=4] [ref=f196e292]
      - paragraph [ref=f196e293]: VGG/MobileNet/DS-CNN 可从末端逐层移除；ResNet/EfficientNet 的残差连接会被剪断——第 k 层输出被多个后续层引用，移除引用层破坏残差加法，需要同时剪跳跃连接两端的更复杂策略。
