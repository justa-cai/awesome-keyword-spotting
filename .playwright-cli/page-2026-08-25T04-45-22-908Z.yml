    - heading "砍掉 93% 参数只掉 0.65 个点： 秘密不在「少剪」，在换掉分类头" [level=1] [ref=f196e5]: 砍掉 93% 参数只掉 0.65 个点：秘密不在「少剪」，在换掉分类头
    - generic [ref=f196e6]:
      - generic [ref=f196e7]: ICASSP 2022 · De Leon & Atienza
      - generic [ref=f196e8]: 菲律宾大学 × 三星研究院
      - generic [ref=f196e9]: 深度剪枝 + 辅助网络
      - generic [ref=f196e10]: MLPerf Tiny · Cortex-M0 实测
    - generic [ref=f196e11]: 标准深度剪枝掉点 5–15% 的根因不是丢了参数，而是浅层特征语义不够用——一个 <5K 参数的深度可分离卷积辅助网络把这句话变成了可部署的密集小模型。
    - generic [ref=f196e12]:
      - heading "一分钟版本" [level=3] [ref=f196e13]
      - list [ref=f196e14]:
        - listitem [ref=f196e15]: ▸ 约束：Cortex-M0 只有 32–64KB SRAM、128–256KB Flash、48MHz 无 FPU 无分支预测器——MobileNetV1-0.25× FP32 要 902KB Flash，直接超限。
        - listitem [ref=f196e16]: ▸ 三条老路的坑：幅度剪枝产出非结构化稀疏（M0 无分支预测，分支 miss 清空流水线，可能比密集还慢）；标准深度剪枝 + 线性头掉 5–15 点；紧凑模型（DS-CNN 42K）冗余本就小，大模型「剪一半没事」的结论不能搬。
        - listitem [ref=f196e17]: ▸ 核心洞察：深度剪枝掉准确率的根因不在「丢失深层参数」，而在「浅层特征图的语义表达能力不足以支撑分类」——解法不是少剪，是增强浅层的分类能力。
        - listitem [ref=f196e18]: ▸ 方法：保前 k 层 + 换上一个 <5K 参数的辅助网络（2–3 个 DWSConv 块 + BN + ReLU6 + GAP + FC）当「浅层特征语义提升器」——产物仍是标准密集网络，任何 MCU 直接跑。
        - listitem [ref=f196e19]: ▸ VWW 结果：226K→16K 参数（−93%），准确率 88.5%→87.85%（−0.65%）——比参数多 4 倍的标准深剪（70K，82.5%）高 5.35 个点，「剪多必掉多」被打破。
        - listitem [ref=f196e20]: ▸ M0 实测：Flash 902KB→192KB（4.7×），SRAM 80→40KB，延迟 470→290ms（1.6×），准确率反而 +1.0（辅助网络起了正则化作用）。
        - listitem [ref=f196e21]: ▸ KWS 结果弱得多：42K→30K 只减 28%，掉 1.06 点；INT8 量化再掉 2.21 点——DS-CNN 本就超紧凑 + KWS 更依赖高级时序特征。
        - listitem [ref=f196e22]: ▸ 消融：辅助网络比线性头高 3–8 点（剪越深差距越大）；DWS 辅助比全连接辅助同参数下高约 2 点；冻结式两阶段训练 20 epoch ≈ 端到端 80 epoch（免灾难性干扰）。
        - listitem [ref=f196e23]: ▸ 边界：辅助网络能弥补浅层、不能创造深层里不存在的信息——yes/yet 这类最后 50ms 细粒度区分的损失不可恢复；只适用于顺序架构，ResNet 的残差连接会被剪断。
        - listitem [ref=f196e24]: ▸ 可迁移判断：对已紧凑的模型，「重构分类器」比「删参数」更有杠杆——重新定义问题比优化旧解法有效。
    - heading "§01 问题：MCU 三重约束下的剪枝困局" [level=2] [ref=f196e25]:
      - generic [ref=f196e26]: §01
      - text: 问题：MCU 三重约束下的剪枝困局
    - generic [ref=f196e27]: Flash 装参数、SRAM 装激活、延迟要实时——三者相互牵制
    - paragraph [ref=f196e28]: TinyML 要把神经网络塞进 Cortex-M0/M4：SRAM 装所有运行时激活值、Flash 装所有参数、推理延迟满足实时性（KWS 通常 <100ms）。当预训练模型超出约束（902KB Flash vs 256KB 上限），压缩是唯一出路——但压缩目标不只是参数量：SRAM 和延迟约束同样硬，且三者相互影响。
    - generic [ref=f196e29]:
      - generic [ref=f196e30]:
        - heading "幅度剪枝：理论压缩 ≠ MCU 加速" [level=4] [ref=f196e31]
        - paragraph [ref=f196e32]: 小权重置零产生非结构化稀疏，需要稀疏计算支持才能兑现加速。Cortex-M 上要引入大量条件分支和 CSR/CSC 索引——M0 没有分支预测器，每次分支 miss 清空 3 级流水线，有时比密集计算还慢。
      - generic [ref=f196e33]:
        - heading "标准深度剪枝：浅层特征撑不住分类" [level=4] [ref=f196e34]
        - paragraph [ref=f196e35]: 移除深层后在新末端接线性分类器，准确率掉 5–15%——网络浅层捕获的是边缘纹理这类低级特征，判别性不足。而紧凑模型剪枝研究本身是空白：大多剪枝论文的对象是 ResNet-50（25M）/VGG-16（138M）这类冗余 50–90% 的大模型。
