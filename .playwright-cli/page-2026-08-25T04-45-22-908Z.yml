  - generic [ref=f196e113]:
    - generic [ref=f196e114]: 块结构：DWSConv(3×3) → BN → ReLU6 → PWConv → BN → ReLU6 （×2–3 块，<5K 参数）→ GAP → FC
    - generic [ref=f196e115]: 人话：辅助网络就是一串小卷积块。参数预算必须极小（<5K），否则抵消剪枝收益——靠小通道数（32/64）+ 深度可分离卷积（参数约为标准卷积的 1/C_out）实现。为什么必须非线性：线性分类器假设特征线性可分，但中间层特征图保留着复杂的时频空间结构，需要非线性变换才能有效分类。
  - paragraph [ref=f196e116]: 剪枝深度 k 怎么选：逐层评估——对每个候选 k 训练辅助网络、评估验证集准确率，选准确率-模型大小权衡最优点。结果 VWW 是 k=7（13 层留 7 层）、KWS 是 k=5（6 层留 5 层）；超过最优 k 后准确率急剧下降——过浅的特征图连辅助网络也救不回来。
