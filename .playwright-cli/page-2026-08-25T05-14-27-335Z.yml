    - heading "特征通道砍到 5 个， 学习特征才开始真正赢手工" [level=1] [ref=f205e5]: 特征通道砍到 5 个，学习特征才开始真正赢手工
    - generic [ref=f205e6]:
      - generic [ref=f205e7]: Filterbank Learning · arXiv 2211.10565
      - generic [ref=f205e8]: 奥尔堡大学 × UT 达拉斯 × Oticon
      - generic [ref=f205e9]: 可学习滤波器组 + 随机失活
      - generic [ref=f205e10]: GSC 加噪版 · 5 次重复 + t 检验
    - generic [ref=f205e11]: 「可学习特征更好」在 KWS 上屡屡落空——不是方法不行，是坐标系选错了：信息冗余在 40 通道下把差异托平；把通道推向极端，分配能力的高下才显形。
    - generic [ref=f205e12]:
      - heading "一分钟版本" [level=3] [ref=f205e13]
      - list [ref=f205e14]:
        - listitem [ref=f205e15]: ▸ 痛点：唤醒词监听是全天候 workload，能效决定续航；声学模型乘法次数与输入特征尺寸直接挂钩（硬件实测乘法数-功耗线性关系 R²=0.9641）——通道数是能效的上游旋钮，且乘法量随通道数超线性缩放（K=40→895M/s，K=5→71M/s，12.6 倍）。
        - listitem [ref=f205e16]: ▸ 手工梅尔的两宗罪：按人耳平均感知设计的通用先验，不是「区分这撮关键词并扛住这类噪声」的任务先验；对噪声频谱一无所知——噪声集中的频段照样分到宝贵通道。
        - listitem [ref=f205e17]: ▸ 翻案背景：SincNet 风格学习前端从没赢过手工特征，作者前期工作也发现无统计显著差异——「频谱信息冗余」猜想：识别一小撮关键词用不满全部谱信息，冗余托平了两种表示的上限。
        - listitem [ref=f205e18]: ▸ 本文的手法：不是新模块，是换坐标系——把通道数从 40 一路砍到 5，让频率分配变成稀缺约束，胜负边界在 K<10 处显形。
        - listitem [ref=f205e19]: ▸ 方法：保留 STFT，只把「线性谱 → K 维特征」做成一张 241×K 可学习矩阵（ReLU 正性约束），log + BN 后接残差膨胀卷积声学模型；梅尔初始化。与前期工作的唯一差异：滤波器组层的随机失活（0.4）。
        - listitem [ref=f205e20]: ▸ 失活的机制：随机丢弃通道制造信息瓶颈——每个通道学到更鲁棒、不依赖其他通道的表示；物证是带失活的滤波器是平滑化版本（窄尖形状对应拟合训练噪声细节）。
        - listitem [ref=f205e21]: ▸ 核心权衡数字：40ch 梅尔 → 8ch 学习，相对精度损失 3.5%（手工要 6.3%），能耗降 6.3 倍；8ch 梅尔 → 5ch 学习，精度持平还微升，能耗再降 2 倍；合计 −6.2% 换 12.6 倍。
        - listitem [ref=f205e22]: ▸ 最难条件优势最大：5 通道未见 −10dB 提升 3.87 个绝对点（相对约 16%）——学习特征在未见噪声 + 极低 SNR 双重压力下反而最强。
        - listitem [ref=f205e23]: ▸ 频谱物证：学到的滤波器抑制 2.7/4.3kHz（恰好是 F-16 座舱噪声的长时谱峰）、加权 5.8–7kHz（训练噪声高频衰减，该频段语音失真最小）——「学习适应噪声」落到可检查的证据上。
        - listitem [ref=f205e24]: ▸ 边界：学习不能消除砍通道的代价——未见 −10dB 下 8ch 学习比 40ch 梅尔还差 6.6 个绝对点（相对 18%），恶劣信噪比的代价远大于平均值；滤波器组层只是帧内线性加权，无频域非线性能力。
    - heading "§01 问题：学习特征为什么一直赢不了" [level=2] [ref=f205e25]:
      - generic [ref=f205e26]: §01
      - text: 问题：学习特征为什么一直赢不了
    - generic [ref=f205e27]: 冗余托平效应 + 能效维度缺席
    - paragraph [ref=f205e28]: 端到端可学习特征在 KWS 上的正面对比屡屡落空：Peter 等（ICASSP 2022）的结论是 MFCC 仍更优；作者前期工作发现学习滤波器组与对数梅尔无统计显著差异。同时以往对比从未把「通道数」当变量——默认 40 通道，从未发现学习特征的优势区间可能藏在少通道一侧。
    - generic [ref=f205e29]:
      - generic [ref=f205e30]:
        - heading "可学习前端缺乏正则手段" [level=4] [ref=f205e31]
        - paragraph [ref=f205e32]: 滤波器组通道容易与训练噪声的特定频谱细节协同适应（过拟合训练噪声）、通道之间容易互相依赖——对未见噪声的泛化没有保障。本文的随机失活正是冲着这个缺口。
      - generic [ref=f205e33]:
        - heading "SincNet 路线的强先验" [level=4] [ref=f205e34]
        - paragraph [ref=f205e35]: 从原始波形学 sinc 滤波器——每个滤波器只有高低两个截止频率，是带通形状的强先验；本文保留 STFT、学习仅施加正性约束的满矩阵映射，自由度分布在全部权重上，且矩阵可直接画成响应曲线当证据。
