  - generic [ref=f205e117]:
    - generic [ref=f205e118]: Y = X · g(W)，W ∈ R^(241×K)，g = ReLU → log(max(Y, e⁻⁵⁰)) → BN → 声学模型
    - generic [ref=f205e119]: 人话：滤波器组层就是一次矩阵乘法——每个通道的输出是频点能量的加权和，权重与声学模型一起反向传播联合优化。为什么 ReLU 正性约束是必须的：能量叠加物理上不能为负；且负权重会让对数在输出 ≤ 0 时无定义——把约束织进前向计算，梯度直接穿过未饱和的权重，比投影式实现简洁。
  - paragraph [ref=f205e120]: 为什么梅尔初始化：从被大量实践验证的可行解出发微调——避免 K 极小时的病态收敛，同时让「学习 vs 手工」的对比只剩「是否联合微调」这一个变量。判决规则是整段词级后验取最大，与 1 秒定长、每段一词的协议严格对齐，让对比聚焦在前端这一个变量上。
