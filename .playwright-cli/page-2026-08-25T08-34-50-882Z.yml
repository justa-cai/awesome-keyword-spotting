    - heading "SSL 管特征好不好， 元学习管怎么适应——35 种组合一次说清" [level=1] [ref=f228e5]: SSL 管特征好不好，元学习管怎么适应——35 种组合一次说清
    - generic [ref=f228e6]:
      - generic [ref=f228e7]: 台大 × intelliGo · arXiv 2204.00352
      - generic [ref=f228e8]: 5 SSL × 7 元学习实验矩阵
      - generic [ref=f228e9]: GSC V2 · 12-way 1/5-shot
    - generic [ref=f228e10]: 先前工作只验证单一组合、结论互相矛盾——本文用统一协议跑完 35 种组合：HuBERT + Matching Network 最优，度量系全面压过优化系，K=1 冻结 / K=5 微调。
    - generic [ref=f228e11]:
      - heading "一分钟版本" [level=3] [ref=f228e12]
      - list [ref=f228e13]:
        - listitem [ref=f228e14]: ▸ 场景：用户自定义唤醒词只愿提供 1–5 次发音（过多注册步骤伤体验）——根本困难是分布外泛化：支持样本是特定时间特定环境录的，查询可能在不同环境/身心状态下说出。
        - listitem [ref=f228e15]: ▸ 两条路线的短板：SSL 学的是「通用声学特征」（区分音素），不是对区分关键词最判别的特征——yes/yet 音素级几乎相同仅最后 50ms 有差异；元学习优化的是「怎么用特征」——编码器特征差它也无法弥补。
        - listitem [ref=f228e16]: ▸ 实验矩阵：5 种 SSL（CPC/TERA/Wav2Vec2/HuBERT/WavLM，同数据同架构 12 层 Transformer 约 95M——差异只来自预训练目标）× 7 种元学习（MAML/ANIL/BOIL/Reptile 优化系 + ProtoNet/RelationNet/Matching 度量系）= 35 组合。
        - listitem [ref=f228e17]: ▸ SSL 排序：HuBERT > WavLM > Wav2Vec2 > TERA > CPC——掩蔽聚类预测学到的离散语音单元特别适合音素级匹配（关键词 = 特定语音单元序列）；WavLM 的说话人噪声增强对 SV 有用对 KWS 帮助有限。
        - listitem [ref=f228e18]: ▸ 元学习排序：Matching Net > ProtoNet > RelationNet > MAML 系 > Reptile——度量系全面压过优化系。
        - listitem [ref=f228e19]: ▸ Matching 为什么赢：注意力加权匹配不要求类形成紧凑簇——K=1 时无原型可估（ProtoNet 的原型就是唯一支持样本，与 Matching 等价），K>1 时均值原型可能被异常样本拉偏而加权匹配更鲁棒；且无需梯度更新，前向推理即适应（MAML 要二阶梯度，贵且不稳）。
        - listitem [ref=f228e20]: ▸ 冻结/微调分水岭：K=1 冻结更优（每类 1 样本微调 95M 参数极易过拟合）；K=5 微调更优（任务特定适应收益超过过拟合风险）。
        - listitem [ref=f228e21]: ▸ 最优组合：K=1 HuBERT + Matching + 冻结 → 88–90%；K=5 HuBERT + Matching + 微调 → 92–94%；1-shot→5-shot 稳健提升 4–6 点。
        - listitem [ref=f228e22]: ▸ 互补性证明：SSL + 元学习 > 单独任一——SSL 解决「特征空间不好」，元学习解决「如何用少量样本调整」，两个不同层面的挑战缺一不可。
        - listitem [ref=f228e23]: ▸ 边界：95M 编码器边缘部署不可行（Cortex-M4 前向就要数秒）；MetaOptNet 因 SVM 数值不稳定被排除；12-way 闭集协议与真实二分类（背景类数千种）有 gap；仅英文仅 K=1/5；缺纯端到端对照。
    - heading "§01 问题：单一组合的结论互相矛盾" [level=2] [ref=f228e24]:
      - generic [ref=f228e25]: §01
      - text: 问题：单一组合的结论互相矛盾
    - generic [ref=f228e26]: SSL 和元学习是否互补、怎么选组合——缺系统性研究
    - paragraph [ref=f228e27]: SSL 模型（HuBERT/Wav2Vec2/WavLM）在大规模无标注语音上预训练的通用表示在多种下游任务上出色，但不是为「少样本适应」设计的；元学习算法（MAML/ProtoNet/Matching）通过「学会学习」快速适应新任务，但效果高度依赖初始编码器质量。先前工作通常只验证单一组合（如 HuBERT + MAML 或 Wav2Vec2 + ProtoNet）——不同研究因组合不同而结论矛盾。
    - generic [ref=f228e28]:
      - generic [ref=f228e29]:
        - heading "SSL 表示过于「通用」" [level=4] [ref=f228e30]
        - paragraph [ref=f228e31]: SSL 学到的可能是区分不同音素的通用声学特征，而非对区分不同关键词最判别的特征——同音词在音素级几乎相同、仅最后几十毫秒有细微差异，通用表示抓不住这种细粒度判别。
      - generic [ref=f228e32]:
        - heading "元学习救不了差编码器" [level=4] [ref=f228e33]
        - paragraph [ref=f228e34]: 元学习优化的是「如何使用编码器提取的特征」——如果编码器提取的特征本身质量差，元学习也无法弥补：两层问题（特征质量 / 使用方式）必须分层解决。
