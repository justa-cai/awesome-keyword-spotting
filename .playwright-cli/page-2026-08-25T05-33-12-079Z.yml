    - generic [ref=f211e6]:
      - generic [ref=f211e7]: I2CR · arXiv 2209.06360
      - generic [ref=f211e8]: 阿里巴巴新加坡 × 南洋理工 × 西安交大
      - generic [ref=f211e9]: 监督对比正则（SupCon 变体）
      - generic [ref=f211e10]: GSC V2 + FSD50K · 三骨干验证
    - generic [ref=f211e11]: CE 只要求「可分类」不要求「表示里不含噪声」——网络可以靠背噪声条件降损失。I2CR 用批内标签免费构造「同类不同说话人」正对，把对比约束从实例判别升级成类别判别。
    - generic [ref=f211e12]:
      - heading "一分钟版本" [level=3] [ref=f211e13]
      - list [ref=f211e14]:
        - listitem [ref=f211e15]: ▸ 靶心：KWS 常驻监听，用户不挑环境说话；端侧小模型没有容量「记住」各种噪声条件——多条件训练学到的是「见过这几种噪声后如何补救」，对训练范围外的噪声/SNR 必然劣化。
        - listitem [ref=f211e16]: ▸ 缺口：两阶段对比预训练（SPIRAL/Wav2vec-switch）需要大规模无标注语料——本文没有；CLAR 的正对只有同一样本的两个增广视图且只验证干净设定。
        - listitem [ref=f211e17]: ▸ 方法：L = L_CE + α·L_I2CR——标准监督分类器加一个对比正则项，推理时正则完全消失，模型结构与基线一字不差。
        - listitem [ref=f211e18]: ▸ 双来源正对：intra-view（同一样本加不同噪声→噪声不变性）+ inter-view（同类不同说话人的不同样本→两个录音唯一的公共因子就是词本身）。只用 intra 的问题：两个视图共享说话人等无关因子，模型可以靠实例内不变量走捷径。
        - listitem [ref=f211e19]: ▸ α 课程热身：首 epoch α=0（纯 CE 热身）→ 线性增长 → 截断 0.5——从零训练早期表示近乎随机，「最大化两个随机向量相似度」非平凡；CE 先把表示整理到大致可分的流形上，对比约束再做几何精修。
        - listitem [ref=f211e20]: ▸ 四种增广每个视图全做：FSD50K 噪声（traffic/metro/car，SNR −10~30dB）+ SpecAugment 掩码 + 时间循环平移 ±100ms + 速度扰动 90–110%——跨视图仍相似只能靠语义内容满足。
        - listitem [ref=f211e21]: ▸ 域内结果：三骨干 × 三噪声 × 四档 SNR × 两子集全一致为正，增益随 SNR 降低放大——−10dB 典型 +1.8~+3.9 点；20dB 处收窄到 0~0.3（噪声弱时没有可清理的对象）。
        - listitem [ref=f211e22]: ▸ 超范围 SNR：−30dB 全员崩塌（最好 0.411）但 I2CR 显著更好（−30dB 平均 +4%/+2.4%）；最有意思的是 clean 列——从未见过干净音频，I2CR 版全面更好（KWT +2.3）：学到的是更纯的类表示，不是对噪声过拟合。
        - listitem [ref=f211e23]: ▸ 域外噪声：GSC 背景噪声上 −10dB 平均 +5.7%/+3.6%，单点最大 +9.5（KWT 10 类 0.482→0.577）——占地最小的模型从正则获利最多。
        - listitem [ref=f211e24]: ▸ 边界：表示去噪不是信号增强（语音被淹没时无米下锅）；正对依赖批内标签分布（batch 128 / 35 类 ≈ 每类 3–4 样本）；训练开销随批平方增长未量化；无虚警/漏检工作点指标、无多种子方差。
    - heading "§01 问题：CE 不约束表示的几何" [level=2] [ref=f211e25]:
      - generic [ref=f211e26]: §01
      - text: 问题：CE 不约束表示的几何
    - generic [ref=f211e27]: 常规监督学习对潜在表示没有任何额外约束
    - paragraph [ref=f211e28]: 噪声 KWS 的性能退化，根源是干扰特征（nuisance features）没有被抑制——背景噪声可以在嵌入空间里占据主导地位，把类别信息挤到边角。监督 CE 只要求「可分类」，网络完全可以通过背噪声条件来降训练损失。图像领域的对比正则研究（域泛化、半监督伪标签）已证明「把跨域同类样本在嵌入空间拉近」能带来更好的域泛化——本文把这套思路搬到 KWS 噪声鲁棒性上（据作者所知是第一篇）。
    - generic [ref=f211e29]:
      - generic [ref=f211e30]:
        - heading "多条件训练的隐含失败模式" [level=4] [ref=f211e31]
        - paragraph [ref=f211e32]: 高度依赖网络自身去「适应并泛化」到训练时选定的那批信噪比噪声环境——模型占地越小问题越严重：没有容量去记住各种噪声条件，也没有显式机制阻止表示吸收噪声。
      - generic [ref=f211e33]:
        - heading "两阶段预训练的门槛" [level=4] [ref=f211e34]
        - paragraph [ref=f211e35]: 语音识别社区用对比预训练学噪声鲁棒表示（不同加噪视图对比 + 有标注微调），但需要大规模外部无标注语料——论文明确声明没有外部大数据集可用；自监督对比还有维度坍缩与训练资源问题。
