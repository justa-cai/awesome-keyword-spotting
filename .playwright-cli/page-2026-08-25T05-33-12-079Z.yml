      - paragraph [ref=f211e269]: I2CR 方法：首个用对比学习处理 KWS 噪声鲁棒性的工作——P(i) 构造为「批内同类样本 + 自身增广视图」的并集，配合 α 课程调度使跨样本对比约束在从零训练下稳定可行。
    - generic [ref=f211e270]:
      - generic [ref=f211e271]: "2"
      - paragraph [ref=f211e272]: 骨干无关的一致收益：三架构 × 三噪声 × 四档 SNR × 两子集全部一致改善——通用训练策略而非特定架构技巧；推理零额外开销、零架构改动。
    - generic [ref=f211e273]:
      - generic [ref=f211e274]: "3"
      - paragraph [ref=f211e275]: 对未见条件的泛化验证：域外噪声 −10dB 平均 +5.7%/+3.6%；超范围 SNR −30dB 平均 +4%/+2.4%；从未见过干净音频的模型在 clean 上比肩干净域训练的 SOTA（R18 0.977 vs AST 0.981、Conformer 0.975）。
