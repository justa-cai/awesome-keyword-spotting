  - generic [ref=f211e278]: 「表示去噪」不是「信号增强」
  - generic [ref=f211e279]:
    - generic [ref=f211e280]:
      - heading "极端 SNR 仍崩塌" [level=4] [ref=f211e281]
      - paragraph [ref=f211e282]: −30dB 下最好的 I2CR 模型也只有 0.411，35 类全员低于 0.33——对比正则作用在表示层，语音在信号层被淹没时表示学习无米下锅。
    - generic [ref=f211e283]:
      - heading "高 SNR 收益趋零" [level=4] [ref=f211e284]
      - paragraph [ref=f211e285]: 20dB 处提升普遍 0~0.3 个点——方法定位本质是低信噪比专用增强，不要指望改善安静环境。
    - generic [ref=f211e286]:
      - heading "正对受批组成制约" [level=4] [ref=f211e287]
      - paragraph [ref=f211e288]: inter-view 正对全部来自 minibatch 内同标签样本——batch 128 / 35 类 ≈ 每类 3–4 个样本；更大词表更严重，批大小敏感性未做。
    - generic [ref=f211e289]:
      - heading "开销与统计缺口" [level=4] [ref=f211e290]
      - paragraph [ref=f211e291]: 批内两两相似度矩阵随批大小平方增长（训练开销未报告）；无多随机种子方差（20dB 的 0.1–0.3 点增益难与噪声区分）；只有分类准确率，无虚警/漏检/AUC 工作点；只有加性噪声无混响远场；参数量 FLOPs 未报告。
  - generic [ref=f211e292]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f211e293]
    - list [ref=f211e294]:
      - listitem [ref=f211e295]: ↳ 监督信号免费提供「同类不同样本」的正对资源——把对比约束从实例判别升级成类别判别，是单阶段获得噪声不变表示的最便宜路径（无需预训练语料）。
      - listitem [ref=f211e296]: ↳ 只用同一样本的增广视图做正对会让模型走「实例内不变量」捷径——两个视图共享的无关因子（说话人等）会被一并编码。
      - listitem [ref=f211e297]: ↳ 从零训练时几何约束要先热身：CE 把表示整理到大致可分的流形上，对比精修才有立足点——首 epoch α=0 + 线性升是最简单的稳定化。
      - listitem [ref=f211e298]: ↳ 检验鲁棒性方法的真正考场是训练分布之外：超范围 SNR、域外噪声类型、甚至反向的 clean 条件——「从未见过干净数据仍不掉点」是表示纯度的最强佐证。
      - listitem [ref=f211e299]: ↳ 训练期正则的收益必须以「推理零改动」为前提来主张——正则器与架构解耦，通用性声明才成立。
