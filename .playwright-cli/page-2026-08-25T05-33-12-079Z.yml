  - generic [ref=f211e95]:
    - generic [ref=f211e96]: L_I2CR = Σ_i (1/|P(i)|) Σ_p −log [ exp(sim(z_i,z_p)/τ) / Σ_n exp(sim(z_i,z_n)/τ) ]
    - generic [ref=f211e97]: 人话（SupCon 形式）：对批内每个锚点，分子是它与某个正样本的余弦相似度，分母是与视界内所有参与对比样本的相似度和——批内把同类拉到最近、其余推远。P(i) 同时包含同类其他样本（inter）和自身增广视图（intra）；1/|P(i)| 防止批内样本多的类主导梯度。为什么抗噪：加噪增广制造「同内容 + 不同噪声实现」的多个视图，要求它们聚拢——模型唯一稳定的解法是把公共因子（关键词）编码进表示、把随噪声变化的因子挤出去。
  - paragraph [ref=f211e98]: 骨干无关性：EfficientNet-B0 / ResNet-18（最大，基线最强）/ KWT-1（占地最小，低 SNR 最弱）——覆盖卷积与 transformer 两族、大中小三档容量，让「正则收益是否依赖模型容量」可被直接观察。为保证公平，基线与正则版用完全相同的增广与训练配置，全部超参固定不变。
