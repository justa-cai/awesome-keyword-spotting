    - list [ref=f217e261]:
      - listitem [ref=f217e262]: ↳ 标量 CPU 上「规律性本身就值钱」：优先结构化剪枝（真正减少循环/通道）和量化+SIMD（稳赚近两倍），非结构化稀疏只在 80%+ 且换循环序后有价值。
