    - heading "纸面稀疏度在标量 CPU 上 一分钱都不兑现：实机实测说了算" [level=1] [ref=f217e5]: 纸面稀疏度在标量 CPU 上一分钱都不兑现：实机实测说了算
    - generic [ref=f217e6]:
      - generic [ref=f217e7]: DCASE 2022 Workshop · 西交利物浦大学
      - generic [ref=f217e8]: STM32F767 · Cortex-M7 @216MHz
      - generic [ref=f217e9]: 剪枝粒度 × 跳零 × 循环序 × 量化 × SIMD
      - generic [ref=f217e10]: FreeRTOS + DMA 全链路开源
    - generic [ref=f217e11]: 「剪掉九成权重不掉点」是准确率层面的结论——在微控制器上，被剪掉的计算并不会自动消失。本文把五种加速手段放到同一个真实系统上逐一实测。
    - generic [ref=f217e12]:
      - heading "一分钟版本" [level=3] [ref=f217e13]
      - list [ref=f217e14]:
        - listitem [ref=f217e15]: ▸ 断层：已有剪枝/量化研究的结论停在准确率或 GPU 加速层面；标量 CPU 上零权重的乘加照样花完整时钟周期；裸机微基准忽略 RTOS 调度、DMA 搬运、FPU、编译器优化、指令流水线——一条跳零 if 可能因打断流水线变成负优化。
        - listitem [ref=f217e16]: ▸ 测量平台：WM8978 16kHz 采集 → I2S/DMA 双缓冲（~31ms 中断）→ 片上特征提取（汉宁窗 + 1024 点 FFT + 40 带梅尔 + log，~6ms）→ FreeRTOS 双任务（特征高优先级可抢占推理）→ CNN 推理 ~31ms——每 ~37ms 出一次分类，全链路实时、代码开源。
        - listitem [ref=f217e17]: ▸ 模型刻意求简：cnn-one-fstride4——单卷积层（核宽 30 = 时间轴全宽，一次看满 1 秒；频率轴步长 4 代替池化）+ 4 层 DNN；119,936 参数 / 468.5KB float32（几乎吃满 512KB SRAM，激活只能外置）/ 476,576 MAC。
        - listitem [ref=f217e18]: ▸ 量化 + SIMD 稳赚：float32 30.8ms → int16 21.4ms（×1.44，内存近半）→ +SMLAD SIMD 15.6ms（总 ×1.98）——注意 SMLAD 相对纯 int16 只有 ×1.37 而非理论 2×：softmax/归一化/搬运/循环开销不吃 SIMD 红利。
        - listitem [ref=f217e19]: ▸ 纸面稀疏度不兑现：不加 if 时稀疏度对耗时功耗几乎无影响；细粒度 + 跳零 if 可能负效果（分支打断流水线）；结构化（向量/滤波器级）在剪除比例很小时就开始收益——真正减少循环迭代次数或通道数。
        - listitem [ref=f217e20]: ▸ 权重优先循环序：把核值维提到外层，跳零判断从「每个（权重,输出点）对一次」降为「每个权重一次」——配合跳零后剪枝率 >80% 才反超默认序，90% 稀疏时 2 倍速；int16 下结论稳健。
        - listitem [ref=f217e21]: ▸ 兼容性风险：权重优先序 + 跳零可能与其他加速方法不兼容——SIMD 要求规整连续访存，按权重跳零恰恰打乱这种规整性。
        - listitem [ref=f217e22]: ▸ MAC 公式暴露剪枝维度：去单个权重削最内层乘加（细粒度）、去核内整行削核高维、去整核/核组削输出通道维——循环结构上真正能「少跑循环」的只有最后一档。
        - listitem [ref=f217e23]: ▸ 工程分界线：要享受非结构化剪枝的加速，稀疏度必须 80% 以上且承受优化冲突风险——结构化剪枝和量化+SIMD 才是 MCU 的友好路线。
        - listitem [ref=f217e24]: ▸ 边界：模型小（单卷积 + 6 分类 ~90%）；压缩后准确率未报告；数据只 2000/350 条未用官方协议；功耗只给曲线不报数值；平台单一（M7）；量化只做 int16、未与 CMSIS-NN/TFLM 对比。
    - heading "§01 问题：理论压缩率 ≠ 实机毫秒" [level=2] [ref=f217e25]:
      - generic [ref=f217e26]: §01
      - text: 问题：理论压缩率 ≠ 实机毫秒
    - generic [ref=f217e27]: KWS 是整机唯一常年满负荷的负载
    - paragraph [ref=f217e28]: 边缘设备上 KWS 常驻运行（always-on）：监听到唤醒词再触发更高成本的识别——收益是省电、省带宽、隐私、可靠、低时延；代价是每一次推理耗时、每一个字节内存占用都被全天候放大。STM32 的三重枷锁：SRAM 20–512KB、FLASH 64KB–1MB、Cortex-M 72–216MHz——从参数量和操作数两个维度压制模型。
    - generic [ref=f217e29]:
      - generic [ref=f217e30]:
        - heading "「剪掉九成不掉点」的另一面" [level=4] [ref=f217e31]
        - paragraph [ref=f217e32]: Han 等的经典剪枝结论停留在准确率层面；标量 CPU 上如果循环结构照旧遍历每个权重，零权重参与的乘加照样消耗完整时钟周期——纸面稀疏度根本不兑现。
      - generic [ref=f217e33]:
        - heading "微基准 ≠ 真实系统" [level=4] [ref=f217e34]
        - paragraph [ref=f217e35]: RTOS 调度、DMA 搬运、FPU 使用、编译器优化行为、指令流水线这些实现层因素可能让理论加速完全失效——「剪枝/量化在真实系统里净赚多少」只有在完整系统上才测得准。
