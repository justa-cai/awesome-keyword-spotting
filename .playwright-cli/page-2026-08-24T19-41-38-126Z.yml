        - generic [ref=f111e99]: 人话：WFST 把训练（式 3 前向）和解码（式 4 Viterbi）写成同一张复合图上的操作——改训练准则和改解码策略变成同一件事。通配符后验取全部非空白音素的平均：「不确定是哪个音素、但可能是语音里某个音素」的中立假设——零参数、不改输出层、不增加训练不稳定性；代价是抹掉了「什么噪声更该走通配符」的判别信息（表三旁路系数的极端敏感性正是这个缺陷的下游症状）。
      - generic [ref=f111e100]: 为什么必须有指数衰减调度：通配符弧从第一轮就零代价可用，模型会找到捷径——把大量难分的帧统统甩给通配符、音素判别本身学不扎实（通配符类方法的经典风险）。初期重罚（−4）强制先在干净对齐上学好音素，惩罚退火后通配符路径逐渐可用，模型逐步学会「只在噪声真正主导的段走旁路」。衰减系数不对称（自环 0.999 / 旁路 0.975 = 旁路更早放开）：插入型噪声（每句加噪都引入大段噪声帧）远比音素被掩盖常见，自环弧需要更长保护期以免被高频使用（笔记推断，论文未解释）。
