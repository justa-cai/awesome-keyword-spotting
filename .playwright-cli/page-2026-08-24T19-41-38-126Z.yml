      - generic [ref=f111e24]:
        - heading "一分钟版本" [level=2] [ref=f111e25]
        - list [ref=f111e26]:
          - listitem [ref=f111e27]: 地基观察（预实验）：用含极低 SNR 的仿真数据训练，模型过拟合到噪声、拖累整体性能。归因到 CTC 机理：加噪后 "Hey Snips" 的 HH EY1 S N IH1 P S 变成 HH<噪声>EY1 S<噪声>N EH0 P S——噪声帧插进音素间（插入）、IH1 被扭曲成 EH0（掩盖替换）；损失函数被迫把噪声帧对齐到关键词音素 = 梯度一遍遍教模型「这段噪声就是 IH1」——不是数据量问题，是训练准则没给噪声主导的帧一个合法去处。
          - listitem [ref=f111e28]: 方案（NTC 训练）：关键词音素序列的图上引入两类通配符弧——自环弧 @ 吸收插入噪声帧（在原音素多停任意多帧）、旁路弧 * 跳过被掩盖的音素；通配符后验 = 全部非空白音素后验的平均（噪声帧无特定音素身份的中立假设——零参数不增加输出单元）；指数衰减惩罚调度：初期重罚（−4）强制先学干净对齐、随 epoch 退火（自环 0.999 / 旁路 0.975——插入噪声远比掩盖常见，自环需更长保护期，笔记推断）。
          - listitem [ref=f111e29]: 免训练解码（最有工程价值）：标准 CTC 解码图里没有这些弧——训练学到的能力是死资产；把通配符弧同样插进解码语法图，CTC 训练的模型不重训直接换图平均 +2.7 点（增益集中在低 SNR：−5dB +10.4）；安全阀：转移代价可调 + 纯通配符路径（不含任何关键词音素）直接丢弃——堵住纯噪声拼关键词的漏洞。
          - listitem [ref=f111e30]: 最有信息量的消融（2×2）：只换训练不换解码不升反微降（82.9 对 83.1）——「更好的训练准则必然更好」被戳破，方法重心其实在解码侧；完整 NTC-KWS 平均 88.0（+4.9 = 解码图 2.7 + 对齐 2.2 + 训练单独 0），−5dB 档 41.6→56.6（+15.0）。
          - listitem [ref=f111e31]: 敏感性的不对称：旁路系数远比自环危险——旁路从 2 抬到 4，−5dB 档从 56.6 崩到 40.0（直接跳音素的代价一旦过低，本可认出的音素被轻易放过）；自环从 4 降到 2/0 只缓降。
          - listitem [ref=f111e32]: 指标设计的隐性贡献：宽松误报档（0.5/1.0 FA/h）下各家数字趋同掩盖真实差距——严格档 0.05 FA/h + 97 小时大负测试集把差距放大（CTC 系对端到端基线的绝对优势超 9 个点）。
