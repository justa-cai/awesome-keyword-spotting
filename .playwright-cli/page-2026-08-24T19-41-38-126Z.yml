            - listitem [ref=f111e226]: 单一英文唤醒词：Hey Snips——多关键词、中文唤醒词、自定义唤醒词未覆盖（后两者恰是 WFST-CTC 最有结构优势的应用面）。
            - listitem [ref=f111e227]: 噪声来源单一且域内：WHAM! 同一噪声库，训练与测试负样本同分布混噪（0-20dB 均匀）——严格说域内评测；−5dB 标域外但噪声同源；无真实采集噪声 / 混响 / 多说话人。
            - listitem [ref=f111e228]: 端侧指标全缺席：参数量 / 延迟 / 实时率 / 内存 / 扩展图的额外搜索开销均未报——而动机恰恰是低资源平台（≤20 活跃令牌暗示可控但无数字）。
            - listitem [ref=f111e229]: 无语音增强前端对照：无法量化「改图不加前端」在这条赛道的真实位次。
      - generic [ref=f111e230]: 值得追的方向：① 跨噪声类型 / 跨 SNR 分布系统研究两个解码系数——从网格搜索走向理论指引或自适应；② 通配符后验从简单平均升级为可学习的噪声判别函数（噪声主导概率门控）——「何时走旁路」成为模型输出而非解码端固定代价；③ 转移代价随帧级 SNR 估计动态调度；④ 噪声建模弧迁移到转录器家族（RNN-T / TDT——对齐机制不同但问题同构）；⑤ 补多唤醒词 / 多语言 / 真实远场 / 端侧开销测量；⑥ 系列合流（笔记视角）：与同团队 TDT-KWS 构成「CTC 图上做手术」的两条分支——TDT 用 token-时长建模压解码步数求快、NTC 用通配符弧扩张搜索空间求稳，图操作层面天然存在组合空间。
