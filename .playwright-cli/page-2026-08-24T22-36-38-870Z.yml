      - generic [ref=f170e24]:
        - heading "一分钟版本" [level=2] [ref=f170e25]
        - list [ref=f170e26]:
          - listitem [ref=f170e27]: E2E ASR 的结构性软肋：流式端到端系统把全部语言学知识「烤」进网络权重，训练后没有独立词表或外部 LM 可运行时注入新词——对训练中不常见的词识别差，而用户自定义唤醒词（Ziggy、Hey Shaq）、联系人名恰恰是每个用户私有、无法预先进训练集的。标准解法是注意力式神经偏置，但点积注意力二次复杂度 + 目录膨胀到数万——偏置收益与每帧开销绑死，而目录里绝大多数条目对绝大多数帧根本无关。
          - listitem [ref=f170e28]: 两条已有路线的不足：① bifocal RNN-T 用小/大双编码器 + 唤醒词检测切换改善延迟，但没为新词设计任何机制——自定义唤醒词的音频恰好被路由到低容量小编码器，用户改了唤醒词助手反而「装听不见」（错误拒绝或误路由到别的人格）；② 单注意力偏置把唤醒词嵌入与专有名词嵌入静态拼接不区分语句段——引导段每帧对数万不可能出现的专有名词无差别打分、唤醒词混在数百候选里被稀释、开销随目录线性恶化。
          - listitem [ref=f170e29]: 核心设计（三层组合）：bifocal 换能器（已有）+ 双注意力偏置分支（小 As 挂小编码器服务引导段 / 大 Al 挂大编码器服务语句主体）+ 离线上下文编码器（BiLSTM 生成目录嵌入、缓存复用）。理论依据是困惑度不对称：引导段天然低困惑度（静音 / 语气词 / 短引导词）→ 粗粒度小注意力够用；唤醒词后是开放式任意查询 → 必须大容量——「双焦点镜片」比喻。
          - listitem [ref=f170e30]: 动态目录掩码（最干净的免费午餐）：由唤醒词结束帧索引驱动——引导段只施加唤醒词嵌入（掩掉全部专有名词），主体段只施加专有名词嵌入。单独这一项：FLOPs 从 3.3M 降到 190K（−93.7%）、参数零增加、F1R 反升（+14.72→+17.03）——省算力与提准确率在这个设计点上不是交易，是同向的（收窄候选既省计算又让注意力聚焦）。
          - listitem [ref=f170e31]: λ 投影旋钮：小 MHA 投影维度 64/32/16/8 四档——引导段 FLOPs 从 95K 一路压到 12K；λ=16 仍基本保住收益、λ=8 崩掉（RNN-T F1R 只剩 +2.38%）——甜点在 16–32，容量硬底不可外推；且 λ 只伤唤醒词通路（专有名词走不随 λ 变的 Al——λ=8 的专有名词 WERR 反而最高）。
          - listitem [ref=f170e32]: 帕累托结果：dual-attn-64 引导段偏置 FLOPs −96.9%（3.3M→95K）、参数只加 83K（~80M 主干的 1%）、唤醒词 F1 +16.42%、专有名词 WERR 最高 +28.64%（超单注意力的 +26.73%）——RNN-T 与 C-T 两种主干都成立。通用测试集 WERR −0.2~+0.8% 近零波动——冻结主干只训偏置层的配方成功保住通用 ASR 质量。
          - listitem [ref=f170e33]: 三个有信息量的细节：① 多头无用——两 MHA 都用 1 头，2/4 头无精度增益（目录匹配是粗粒度检索，不需要多头子空间切分）；② 目录里放「不偏置 token」让系统学会什么时候不该偏置（否则任何帧都被迫挑最像的、假唤醒率上升）；③ 所有偏置变体 TRR 系统性退化（最高 −16.63%）——偏置换 TAR 的固有代价，不偏置 token 只能缓解不能消除。
          - listitem [ref=f170e34]: 边界：整条链路（编码器切换 / 分支选择 / 掩码时机）全挂在唤醒词检测信号上——检测器误报漏报级联传播、无敏感性分析、无边界抖动的迟滞处理；只有相对指标（无绝对 TAR/TRR/WER 工作点）；全部内部数据不可复现（论文自认不存在含多样自定义唤醒词的公开大规模数据集）；只评估 6 个唤醒词 / 25 小时标注；目录声称设计目标数万但评估只有 300 条——大规模成本故事无实测；无端上实测（FLOPs 推断层面）。
    - generic [ref=f170e35]:
      - paragraph [ref=f170e36]: §01 · 问题陈述
      - heading "四个互相牵制的目标" [level=2] [ref=f170e37]
      - generic [ref=f170e39]: 设计空间：在流式端侧神经换能器（RNN-T 与 Conformer-Transducer 双主干）上同时——提升自定义唤醒词检出（TAR/F1）；保持甚至超过神经偏置的专有名词收益；偏置注意力运行时 FLOPs 砍一个数量级以上；参数开销 ~1% 以内且不重训 8000 万参数的预训练主干。核心挑战：如何复用系统里本来就在跑的唤醒词检测信号，让它不只切换编码器，还切换偏置计算路径和目录内容。通用效率方法（linformer/performer/CIFG/量化稀疏）都不利用任务结构——语句相对唤醒词的位置决定了哪些目录条目可能出现在哪些帧上这条强先验没人用。
