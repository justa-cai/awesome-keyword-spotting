      - generic [ref=f80e118]: "ANN: y = f(W·x) → SNN: firing_rate(neuron_i) ∝ f(W·x)_i （权重不变，只换神经元模型）"
      - generic [ref=f80e119]: 人话：原来网络里一个 0.8 的激活值，转换后让这个神经元每秒发 800 个脉冲——数值大小变成脉冲疏密。计算从「乘加阵列」变成「有脉冲才算、没脉冲歇着」，省电就省在「歇着」上。
