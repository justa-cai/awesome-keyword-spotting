    - generic [ref=f80e238]:
      - generic [ref=f80e239]: JUDGEMENT
      - paragraph [ref=f80e240]: ↳ 范式验证的价值在量级不在精度：本文的贡献是「SNN 在语音任务上能效优势是数量级的」这个事实本身——小数据集上的 93.8% 不是卖点，110× 的能耗比才是。
      - paragraph [ref=f80e241]: ↳ 免重训转换是 SNN 落地的工程钥匙：直接迁移权重 + 调神经元参数，让存量 ANN 训练生态复用——「先训后转」至今仍是 SNN 应用的主流路径。
      - paragraph [ref=f80e242]: ↳ 基准测试的信誉来自同题同卷：同网络、同数据、同指标跑五个平台，而不是各引各的最好数字——本文与 TC-ResNet（2019 №20）的真机评估精神同源：把纸面优势放到物理硬件上量。
