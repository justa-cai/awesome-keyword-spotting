  - generic [ref=f80e71]:
    - heading "2 机制：激活强度编码成脉冲密度" [level=2] [ref=f80e72]:
      - generic [ref=f80e73]: "2"
      - text: 机制：激活强度编码成脉冲密度
    - generic [ref=f80e74]:
      - generic [ref=f80e75]:
        - heading "ANN→SNN 免重训转换" [level=3] [ref=f80e76]
        - text: Nengo 把连续激活值映射为 LIF 神经元的发放率——权重直接迁移，只需调膜时间常数和阈值匹配激活分布。
      - generic [ref=f80e77]:
        - heading "发放率编码" [level=3] [ref=f80e78]
        - text: 激活越强发放越密——信息在脉冲密度里，不在单个脉冲里。
      - generic [ref=f80e79]:
        - heading "CTC 端到端训练" [level=3] [ref=f80e80]
        - text: 原网络用 CTC 损法学序列级判别——脉冲侧用累积脉冲计数算输出概率分布。
      - generic [ref=f80e81]:
        - heading "Loihi 的扩展性" [level=3] [ref=f80e82]
        - text: 128 核 × 每核 1024 神经元——网络变大就启用更多核，推理速率基本不掉。
