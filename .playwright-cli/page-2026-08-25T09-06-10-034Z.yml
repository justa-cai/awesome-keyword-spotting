    - heading "加新词不改旧模型： 冻结旧知识、压缩新知识" [level=1] [ref=f236e5]: 加新词不改旧模型：冻结旧知识、压缩新知识
    - generic [ref=f236e6]:
      - generic [ref=f236e7]: PCL-KWS · A*STAR 新加坡 · arXiv 2201.12546
      - generic [ref=f236e8]: 渐进式网络实例化
      - generic [ref=f236e9]: TC-ResNet-8 约 80K · GSC V2 30 词
      - generic [ref=f236e10]: 无回放 · 无任务 ID 依赖（训练）
    - generic [ref=f236e11]: 智能家居从「开灯/关灯」到「打开空调」再到「晚安模式」——类别增量学习的老问题在 KWS 有新痛点：关键词低级层共享（相同音素）高级层独有，新词学习改变共享低级特征间接伤旧词。
    - generic [ref=f236e12]:
      - heading "一分钟版本" [level=3] [ref=f236e13]
      - list [ref=f236e14]:
        - listitem [ref=f236e15]: ▸ 设计哲学：保护旧知识（冻结旧子网络——比正则化更彻底，从结构层面而非参数约束层面解决遗忘）+ 压缩新知识（关键词感知网络缩放）。
        - listitem [ref=f236e16]: ▸ 网络实例化：Task 0 训练完整基线（C₀ + 共享内存块 M + H₀，15 个基础词）→ 每个新任务：冻结所有旧子网、实例化新分类头 H_t、从基线复制卷积作初始化（C_t⁽⁰⁾=C₀，加速收敛）、新子网 f_t = (C_t, M, H_t)。
        - listitem [ref=f236e17]: ▸ 共享内存块 M 双重作用：正向迁移（新子网读 M 获取全部先前任务的通用声学特征——免费预训练）+ 持续更新（M 随新任务训练更新不断积累）——旧子网用训练时的 M 快照，不受 M 后续更新干扰。
        - listitem [ref=f236e18]: ▸ 关键词感知缩放：w_t = min(1.0, K_t/K₀)——新任务 3 词 vs 基础 15 词 → w=0.2，新子网只用 20% 通道宽度；「识别的词越少所需容量越小」的规模适配原则。
        - listitem [ref=f236e19]: ▸ 参数账：基线 80K + 5 新子网（16K each）+ 新头 15K + M 10K ≈ 185K = 基线 2.3 倍——不缩放会是 6.25 倍（500K）。
        - listitem [ref=f236e20]: ▸ 主结果：30 词 6 任务后平均准确率 92.8%——超 Fine-tuning 下界约 15 点、超最强基线 GEM 约 3 点，且零历史样本存储（GEM 要回放缓冲区）。
        - listitem [ref=f236e21]: ▸ 缩放消融：w=1.0（500K，93.3%）→ w=0.2（185K，92.8%）——参数减 63% 只掉 0.5 点，边缘部署的划算交易。
        - listitem [ref=f236e22]: ▸ 初始化消融：从基线复制 92.8% ≈ 从最近子网复制 92.5% > 随机初始化 89–90%——基线提供「原始的、未被后续任务偏移」的公平起点。
        - listitem [ref=f236e23]: ▸ 内存块消融：去掉 M 准确率 −3~5 点——没有 M 新子网在孤立参数空间优化，缺乏跨任务迁移。
        - listitem [ref=f236e24]: ▸ 边界：推理需要任务 ID（或路由器）——用户说什么词系统无法预知；模型持续单调增长；旧子网知识固化（M 更新后与旧快照可能不匹配）；M 容量瓶颈；骨干单一（TC-ResNet）。
    - heading "§01 问题：边缘设备上的类别增量" [level=2] [ref=f236e25]:
      - generic [ref=f236e26]: §01
      - text: 问题：边缘设备上的类别增量
    - generic [ref=f236e27]: 正则化不够、回放存不下、任务 ID 不可用、大模型装不进
    - paragraph [ref=f236e28]: EWC/SI 的 Fisher 对角近似忽略参数相关性，且任务越多冻结越多——自由度递减后新任务难学（实测仅比微调好 5–10%）；GEM 回放在 100KB 边缘预算下只能存 25 个频谱样本，10 个任务每任务 2–3 个——效果急剧下降；Expert Gate 等需要任务 ID——设备不知道用户接下来说什么；wav2vec2 约 300M 的预训练路线不适合边缘；Progressive Nets 参数线性增长——多任务后超出存储。
    - generic [ref=f236e29]:
      - generic [ref=f236e30]:
        - heading "KWS 特有的遗忘机制" [level=4] [ref=f236e31]
        - paragraph [ref=f236e32]: 不同关键词的声学特征在低级层共享（相同音素）但高级层有独特组合——新关键词的学习会改变共享的低级特征表示，间接影响旧关键词的特征质量：遗忘的传导路径比一般分类任务更隐蔽。
      - generic [ref=f236e33]:
        - heading "目标约束" [level=4] [ref=f236e34]
        - paragraph [ref=f236e35]: 不需要任务 ID（训练时）、不需要回放缓冲区、模型大小严格亚线性增长、跑在约 80K 的轻量骨干上——四个条件同时满足才是边缘可用的 CIL。
