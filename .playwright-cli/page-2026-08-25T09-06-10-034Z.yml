  - heading "§04 贡献：四条" [level=2] [ref=f236e253]:
    - generic [ref=f236e254]: §04
    - text: 贡献：四条
  - generic [ref=f236e255]:
    - generic [ref=f236e256]:
      - generic [ref=f236e257]: "1"
      - paragraph [ref=f236e258]: 渐进式网络实例化框架：首个专为小型 KWS 模型设计的动态架构持续学习——旧知识不变（冻结）、新知识增量增长（实例化）、知识共享（M）。
    - generic [ref=f236e259]:
      - generic [ref=f236e260]: "2"
      - paragraph [ref=f236e261]: 关键词感知网络缩放：容量与任务复杂度显式关联——可预估的参数增长让设备能算清增量成本。
    - generic [ref=f236e262]:
      - generic [ref=f236e263]: "3"
      - paragraph [ref=f236e264]: 无需缓冲区：知识保留完全靠参数快照——消除缓冲区大小决策、样本选择、更新策略等一整套管理复杂性。
    - generic [ref=f236e265]:
      - generic [ref=f236e266]: "4"
      - paragraph [ref=f236e267]: 共享内存块正向迁移：新子网经 M 获取旧任务知识而无须旧数据——解决回放方法的数据可用性问题。
  - heading "§05 局限与边界" [level=2] [ref=f236e268]:
    - generic [ref=f236e269]: §05
    - text: 局限与边界
  - generic [ref=f236e270]: 推理侧的任务 ID 问题未解决
  - generic [ref=f236e271]:
    - generic [ref=f236e272]:
      - heading "推理需要任务 ID 或路由器" [level=4] [ref=f236e273]
      - paragraph [ref=f236e274]: 不同任务分类头不同——推理时要知道输入属于哪个任务才能选头，但用户可能说任何已学过的词。候选解（全头并行取最高置信 / 任务路由器 / 统一输出空间）论文未充分讨论——这是从方法到产品的最大缺口。
    - generic [ref=f236e275]:
      - heading "模型持续增长 + 知识固化" [level=4] [ref=f236e276]
      - paragraph [ref=f236e277]: 缩放约束了速度但仍是单调递增——数百个增量任务（用户不断加自定义词）最终突破存储；旧子网用旧 M 快照——后续任务声学差异大时旧子网可能退化；M 大小固定，任务多了可能内存干扰。
    - generic [ref=f236e278]:
      - heading "骨干单一" [level=4] [ref=f236e279]
      - paragraph [ref=f236e280]: 全部实验在 TC-ResNet-8——其顺序架构天然适合子网实例化；DS-CNN / LSTM / Transformer 适用性未验证。
    - generic [ref=f236e281]:
      - heading "实验设计缺口" [level=4] [ref=f236e282]
      - paragraph [ref=f236e283]: 任务顺序敏感性未测（CIL 通常对此敏感）；任务间关键词重叠（stop vs top 声学相似）的区分能力未测；未与 Der++/AANet 等动态架构 CIL 对比；基线数字为约值区间。
  - generic [ref=f236e284]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f236e285]
    - list [ref=f236e286]:
      - listitem [ref=f236e287]: ↳ 结构层面的遗忘防护（冻结旧子网）优于参数约束层面（正则化）——正则化是在「尽量不影响」的方向上努力，结构隔离是「根本不影响」。
      - listitem [ref=f236e288]: ↳ 容量与任务复杂度显式挂钩：小任务给小网络——参数预算从固定成本变成任务函数，边缘设备可预估增量成本。
      - listitem [ref=f236e289]: ↳ 共享模块是免费的正向迁移通道：新任务经共享内存获取旧知识而无须旧数据——知识互通与参数隔离可以同时成立。
      - listitem [ref=f236e290]: ↳ 0.5 个点换 63% 参数是边缘部署的划算交易——准确率-存储的帕累托上，小模型的边际存储比边际精度贵。
      - listitem [ref=f236e291]: ↳ 「冻结旧知识、共享通用知识、压缩新知识」范式可推广到语音命令识别、声学事件检测、手势识别等一切需持续适应的边缘 AI。
