    - generic [ref=f93e129]:
      - generic [ref=f93e130]: 普通 AE： x_A → encode → reconstruct(x_A) CAE： x_A(说话人A) → encode → reconstruct(x_B, 同一词)
      - generic [ref=f93e131]: 人话：普通自编码器学「原样复原」，会把说话人音色也一起记住；对应自编码器接到的是「复原成另一个人说的同一个词」的任务——音色对不上目标，只能扔掉，留下的就纯粹是这个词本身的发音特征。喂给它的输入先经过 BNF 洗过一遍，杂音更少，这个「扔掉」学得更好。
