    - generic [ref=f93e236]:
      - generic [ref=f93e237]: JUDGEMENT
      - paragraph [ref=f93e238]: ↳ 特征组合的收益看「瓶颈是否互补」：BNF 缺的是目标特异（它对谁都通用），CAE 缺的是通用起点（几十个样本学不动全局）——两段各补各的短，才有 3+2 变 11 的协同；瓶颈重叠的组合只会线性叠加。
      - paragraph [ref=f93e239]: ↳ 改变重建目标是免费的监督来源：CAE 不需要新标注，只把「重建自己」改成「重建别人的同一词」，就白拿了一份「说话人无关性」的监督——设计自监督任务时先想重建目标还能换成什么。
      - paragraph [ref=f93e240]: ↳ 零资源 = 域外大资源 + 域内微资源的编排艺术：全域内（MFCC）浪费了世界的先验，全域外（纯 BNF）不聚焦目标——两个极端都不对，编排顺序才是贡献。
