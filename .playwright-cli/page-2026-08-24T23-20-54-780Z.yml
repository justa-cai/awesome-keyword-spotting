      - paragraph [ref=f180e14]: Improving Small Footprint Few-shot Keyword Spotting with Supervision on Auxiliary Data（AuxSL + LibriWord）
      - paragraph [ref=f180e15]: 作者：Seunghan Yang、Byeonggeun Kim、Kyuhong Shim、Simyung Chang —— Qualcomm AI Research（首尔）
      - paragraph [ref=f180e16]: 发表：arXiv 2309.00647（2023-08，4 页短文）· splitGSC 基准 · BC-ResNet 9.2K–8M 全档
      - generic [ref=f180e17]:
        - generic [ref=f180e18]: LibriWord：MFA 自动切词零人工
        - generic [ref=f180e19]: SSL 小模型失效实证
        - generic [ref=f180e20]: AuxSL 分路多任务
        - generic [ref=f180e21]: 五样本 82.0→95.6
        - generic [ref=f180e22]: 一样本闭集 +21.3 点
        - generic [ref=f180e23]: 9.2K 小模型超 321K 组合
      - generic [ref=f180e24]:
        - heading "一分钟版本" [level=2] [ref=f180e25]
        - list [ref=f180e26]:
          - listitem [ref=f180e27]: 矛盾闭合：少样本 KWS（用户自定义唤醒词——随口念几遍即注册）靠度量学习，嵌入空间质量由训练数据塑造——本质数据饥渴；KWS 领域最缺大规模标注（splitGSC 只有 2.4 万条 15 词）；端侧又要求模型小（BC-ResNet8 321K、最小 9.2K）。嵌入学习要大数据、小模型容量不足以消化「大数据 + 无标注」、带标注的关键词大数据又采集不起。
          - listitem [ref=f180e28]: 突破口（一次问题转化）：有声书朗读语音量大免费（LibriSpeech ~1000h）但是「域外、无词标注、长尾」——SSL 这条无监督利用路径在小模型上已被文献与本文实验双重证伪（SimCLR 预训练 79.9 双指标反降；BYOL 持平；大量增广与超参搜索后仍如此——小容量被逼学增广不变性，挤占关键词判别的精细表示，不变性学得越好词边界越糊）。解法：用 Montreal Forced Aligner 自动切成带词标签的样本——问题从「小模型 + 无监督 + 大数据」退回到小模型最擅长的监督分类，几乎零人力成本。
          - listitem [ref=f180e29]: LibriWord 四步流水线：MFA 词级对齐切分 → 词频取前 1,000 词 → 形态变体去重（had/have 留一个——近重复类浪费表示预算又制造模糊监督）→ 每词 300 条类平衡 = 30 万条。消融证明：平衡 30 万 > 不平衡整库 480 万（16 倍数据不敌分布倾斜——与 ImageNet 长尾文献一致）；辅助数据「多大才够」被压到友好量级（源语料的 1/16）。
          - listitem [ref=f180e30]: AuxSL 分路多任务（泄压阀机制）：共享特征提取器 F_θ + 两条损失路径——域内 splitGSC 的 D-Proto 哑元原型损失（原型几何始终对目标任务优化）+ 域外 LibriWord 的 1-FC 分类器交叉熵（辅助头吸收 1,000 词的判别压力，只让通用底层特征回传，不直接改写域内几何）；推理时分类器整个丢弃——推理零额外成本。
          - listitem [ref=f180e31]: ALL 混训的反面教材（最有说服力的对照）：同样的数据同样的模型只差「混训 vs 分路」——ALL 闭集冲到 92.2 但开集滞涨 86.6、一样本 AUROC 75.3 反低于基线 75.7（朗读词 1,000 类碾压命令词十几类，episode 从混合词表采样 → 原型几何按朗读词可分性优化）；AuxSL 95.6/95.2——注入结构本身贡献了 ALL→AuxSL 的 3.4 闭集点 + 8.6 开集点。
          - listitem [ref=f180e32]: 结果：五样本闭集 82.0→95.6（+13.6 点）、开集 82.9→95.2（+12.3 点）；一样本闭集 65.8→87.1（+21.3 点）——越难的档位收益越大；标准差全线最小（±0.3–0.8，训练最稳定）；跨三种架构家族（BC-ResNet / Res12 / DS-ResNet）一致成立。
          - listitem [ref=f180e33]: 最反直觉的发现（图 4）：SSL 系在最小 BC-ResNet1（9.2K）上低于基线（负收益）；而 AuxSL 加在 9.2K 小模型上超过包括 BC-ResNet8 在内的一切方法组合——模型小到连基线都跑不动时，辅助监督的信息密度反而成决定性因素；自定义唤醒词的体积下界被大幅下推。
          - listitem [ref=f180e34]: 边界：域差只被隔离未被消除（朗读体 vs 命令体——RFN/DSBN 域自适应是论文自留接口）；隐性依赖文本转写（MFA 需转写——野生语料的转写质量是新瓶颈，对齐错误直接变标签噪声）；1,000 词 / 300 条 / λ=1.0 全是单点选择无敏感性；平衡采样的信息代价（砍掉 450 万条丢掉词频先验）；单一英语基准（MLS 多语言未进实验）；「朗读语音优于 TTS 合成」只是论证无实测对比；开集部署仍需定阈值。
