        - paragraph [ref=f53e101]: 「特征—分类」二分的好处：FEU 是逐帧流式变换（时域→倒谱域）、TCU 是序列对齐（测试 vs 模板库）——二者并行度与访存模式完全不同，分开设计互不牵制。
