          - generic [ref=f53e97]: 计算量正比于滤波器实际覆盖宽度，而非频谱长度
          - generic [ref=f53e98]: 中断驱动协处理：CPU 配置完加速器即可休眠，算完中断回报（intr 信号）——消除轮询空转；128KB 片上存储容纳全部码本+模板+程序
          - generic [ref=f53e99]: 外置 AFE 的取舍：数字 40nm 做模拟拉高掩模成本，且整机厂可按噪声指标选型；代价是无法像 [2] 那样片内统一优化（AFE 型号/功耗未报）
