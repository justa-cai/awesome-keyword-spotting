        - heading "一分钟版本" [level=2] [ref=f53e25]
        - list [ref=f53e26]:
          - listitem [ref=f53e27]: 定位：两页 demo 论文——展示可现场演示的完整系统原型（FPGA 原型 + 评估平台 + 机械手/家电控制演示），不展开完整学术论证。
          - listitem [ref=f53e28]: 解题姿态：激进的三层协同——算法选型避开大参数 DNN（回到 MFCC+VQ+DTW 教科书路线）→ 算法压缩三策略（降采样/简化/离线参数优化，计算与内存各砍 ~98%）→ 微架构逐模块定制（七级 FFT 流水、稀疏 Mel 滤波、固定对角 DTW 使 TCU 面积降 99.2%）。
          - listitem [ref=f53e29]: PPA 结果：40nm 下帧延迟 2.98 ms（对 AAD-KWS 十倍加速）、加速器 0.28mm² / 28.3 µW @400kHz（归一化面积 ≈ Skip-RNN SoC 的 1/6）、SoC 核心 1.34mm² / 存储 128KB、功耗为多引擎 SoC 的 47.7%。
          - listitem [ref=f53e30]: 代价：识别率上限 89%（三百余条一秒用例）——用精度换数量级 PPA；无误唤醒率/漏检率/噪声鲁棒性等检测器指标一概未报。
          - listitem [ref=f53e31]: 核心洞察：SoC 整体 12.4mW 中加速器只占千分之二——常开监听的能耗重心已不在 KWS 本身，在 CPU 与外设子系统；双时钟域（50MHz 主 / 400kHz 加速器）是低功耗主手法。
