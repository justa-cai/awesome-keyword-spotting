        - paragraph [ref=f53e216]: ① 带约束对角 DTW：对角两侧放宽若干帧带状搜索，或两级匹配（对角粗筛 + 完整 DP 精对齐）——小幅面积换回弯折能力。 ② 超低功耗门控前级：借鉴 [1] 把 AAD 嵌入特征通路，静音段关 FEU 甚至整条时钟域——目前无 VAD 级联（微瓦竞赛标配动作）。 ③ 可编程模板 + 自定义唤醒词：模板存储软件可写 + 「念三遍即注册」enroll——把扩展性短板转为「免重训练即时生效」的差异化优势（模板方法少数天然占优的维度）。 ④ 模板+DNN 两级混合：模板做微瓦级 always-on 第一级、触发后唤醒 DNN 毫瓦级二级确认——28.3µW 加速器恰是理想第一级。 ⑤ 评估补全：噪声/远场、误唤醒率、逐词分布、压缩消融、28nm 同工艺复测。总体：价值不在单项技术新颖，而在证明「正确的约束组合下，老算法 + 极致定制电路仍是 2025 年 IoT 语音入口的有力答案」。
