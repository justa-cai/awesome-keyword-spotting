        - text: D[i,j] = d(i,j) + min(D[i−1,j], D[i,j−1], D[i−1,j−1]) → 固定对角：只累计 D[i,i] 路径，搜索空间 O(N·M) → O(N)
        - generic [ref=f53e103]: 这是全文最锋利的一刀：三方向比较与回溯存储整体消失，DP 网格行列缓存（TCU 最大块存储）被砍——面积 −99.2%、功耗 −84.2% 的来源。为什么敢：KWS 测试与模板通常同一孤立词、帧数相近、语速差异有限，对角路径已覆盖大部分对齐需求；代价：语速差异大/词中停顿/关键词长短不一时对角假设失效。带状约束（Sakoe-Chiba）等中间形态可小幅面积代价挽回部分弯折能力——论文未探讨。
