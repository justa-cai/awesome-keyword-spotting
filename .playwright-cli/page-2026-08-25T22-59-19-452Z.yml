    - heading "机制：sinc 之差与学到的频带" [level=2] [ref=f59e88]
    - paragraph [ref=f59e89]: 数学核心很优雅：频域的矩形带通对应时域的两个 sinc 函数——低频 sinc（乘 2f₁）与高频 sinc（乘 2f₂）相减，得到一个只在 [f₁, f₂] 通带的滤波器。训练时只更新 (f₁, f₂)——学到的参数就是「哪段频率重要」的直接答案。加窗（汉明窗）平滑边缘避免理想矩形的振铃。
