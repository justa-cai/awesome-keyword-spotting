    - generic [ref=f59e184]: 图 2 · 机制解剖：sinc 差构造带通 · 学到的频带分布（低频密·高频疏，类梅尔但任务优化）
    - generic [ref=f59e185]:
      - generic [ref=f59e186]: "g(f₁, f₂)[n] = 2f₂·sinc(2πf₂n) − 2f₁·sinc(2πf₁n) ← 理想带通 = 两个 sinc 之差 第一层: 64 个滤波器 × 2 参数 = 128 (vs 标准卷积 16,064, −99%) 后续: 深度卷积(通道内) + 逐点 1×1(通道间) — DSConv 接力 架构: 原始波形 → Sinc 层 → DSConv×N → 全连接"
      - generic [ref=f59e187]: 人话：每个滤波器像一个可调的「收音机频道」——只学频道下沿和上沿两个旋钮，不学整个电路；64 台收音机各自锁到对分词最重要的频段。训练完看一眼每台锁在哪个频段，模型「在听什么」一目了然。
    - paragraph [ref=f59e188]: 学到的分布印证了任务适配：频带呈类梅尔的低频密集分布（元音基频与谐波），但为 KWS 做了调整——高频区（辅音摩擦噪声）也有覆盖；这个分布是任务优化的结果而非手工规定，且每个滤波器可解释——MFCC 黑盒前端给不了这一点。
