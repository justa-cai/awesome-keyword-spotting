    - generic [ref=f59e16]:
      - generic [ref=f59e17]: TL;DR
      - list [ref=f59e18]:
        - listitem [ref=f59e19]: ◆ MFCC/LFBE 基于人耳听觉模型——不为 KWS 优化（Mel 频带划分、DCT 系数都是拍脑袋的通用选择）；压缩变换（对数 · DCT）还可能丢掉相位与细微频谱结构。
        - listitem [ref=f59e20]: ◆ 直接学原始波形可以避免信息损失——但 16kHz 波形的第一层标准卷积要 64×251=16,064 个参数，参数效率极低。
        - listitem [ref=f59e21]: ◆ Sinc 卷积的解法：把第一层滤波器参数化为带通滤波器——理想带通 = 两个 sinc 之差，每个滤波器只学 (f₁, f₂) 两个截止频率，参数减 99% 且物理意义明确。
        - listitem [ref=f59e22]: ◆ 后续层用深度可分离卷积接力保持效率——两种参数高效技术的紧凑组合，总参数仅 62K。
