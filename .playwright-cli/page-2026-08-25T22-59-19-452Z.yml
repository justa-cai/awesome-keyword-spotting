      - paragraph [ref=f59e313]: ② 物理参数化附送可解释性。
      - generic [ref=f59e314]: ↳ 参数有意义（截止频率），学到的就不是黑盒——「模型在听哪个频段」可以画出来；可解释性不是事后的可视化技巧，而是参数化设计的副产品。
      - paragraph [ref=f59e315]: ③ 强先验是效率与灵活性的交易。
      - generic [ref=f59e316]: ↳ 带通形状学不了任意核（#6 高斯更柔、无约束更自由）——参数化越强效率越高、能表达的形状越少；选参数化 = 选「我愿意放弃哪些表达能力换效率」。
    - paragraph [ref=f59e317]: 系列坐标：可学习前端谱系的 Sinc 节点——Ravanelli & Bengio 的 SincNet（2018，说话人识别）是思想源头，本文（2019）把它带进 KWS 并配 DSConv 压到 62K；#6 高斯滤波器组（2020）换形状先验，trainable frontend（others）走远场鲁棒，2022 可训练基函数延伸到倒谱域——「前端从固定工艺变成可学习、可问责的管线成员」这条主线，本文是最早的 KWS 落地之一。
