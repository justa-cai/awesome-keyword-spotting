      - generic [ref=f24e24]:
        - heading "一分钟版本" [level=2] [ref=f24e25]
        - list [ref=f24e26]:
          - listitem [ref=f24e27]: 背景：2023 后主流 MCU 开始集成 NPU（NXP MCX N 系的 eIQ Neutron），但「换上 NPU 到底快多少、体积省多少、精度掉多少」缺少同芯片同模型的严格对照——厂商只给算力峰值，不给完整 KWS 案例。
          - listitem [ref=f24e28]: 六步流水线：Speech Commands 二分类（Marvin vs 其他）→ MFCC（25/10ms，98×20，M33 上每帧 431µs）→ 两层 CNN（27.6k 参数，GAP 省掉 68 倍参数）→ QAT（训练 +20% 时间换 int8）→ eIQ Toolkit 转换（算子重写不是重编译：BN→MUL/ADD、GAP→Mean、sigmoid→Logistic、dropout/量化层消失）→ CPU/NPU 双路径部署。
          - listitem [ref=f24e29]: 核心数字：同一 int8 模型 M33 CPU 228.2ms → NPU 3.847ms（59.35×）；float→int8 体积降 90.68%；准确率 99.14→97.06。
          - listitem [ref=f24e30]: 深读发现的第四点：量化把工作点推向高误报——误报 64→309 例（×4.83）、漏检 31→15（减半），且 int8 的 97.06% 低于「永不唤醒」基线 98.23%——准确率指标在 1:55 非均衡任务上失效的教科书案例。
          - listitem [ref=f24e31]: 可迁移判断：NPU 的价值不止快，是「把 CPU 还给你」（占空 22.8%→0.38%）；量化验收必须看混淆矩阵不看准确率；架构设计要按 NPU 算子白名单选算子。
