        - paragraph [ref=f24e236]: 论文自述：功耗特性表征、多关键词架构、变化声学条件下的鲁棒性。 笔者补充：判定阈值校准与多窗投票后处理（直接针对误报 ×4.83）；PTQ 对照实验量化 QAT 的真实贡献；FPR@召回率式评估框架；VAD 级联（先低功耗语音活动检测再进 KWS，压常驻功耗）。 三条可迁移的工程判断：① NPU 收益要用「同芯片同模型 CPU vs NPU」量；② 移植不是重新编译是重写计算图——架构设计阶段就按目标 NPU 算子白名单选算子，任何自定义算子意味着回落 CPU 和流水线撕裂；③ 量化验收看混淆矩阵不看准确率，且上线后要在线重校准阈值。
