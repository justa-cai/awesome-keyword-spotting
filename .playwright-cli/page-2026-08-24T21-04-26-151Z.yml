      - generic [ref=f140e263]:
        - generic [ref=f140e264]:
          - heading "技术局限" [level=4] [ref=f140e265]
          - list [ref=f140e266]:
            - listitem [ref=f140e267]: 配比反转缺机制验证：只给「过量 TTS 可能盖过真实贡献」的猜测式解释——域平衡采样、课程式先合成后真实、域对抗损失、加权域适应等常用缓解工具都未尝试；部署者只能重扫网格找最优点，成本高。
            - listitem [ref=f140e268]: 合成-真实声学差距未显式处理：合成语音在信道噪声、混响、自发口语变异上与真实录音有系统性差距（纯 TTS 追不上 5 万真实即其量化）；未做任何合成侧域补偿（加噪 / 加混响增强）。
            - listitem [ref=f140e269]: 仅英文、仅单词：多词关键词涉及词序与协同发音，嵌入空间复杂度完全不同——作者只能「相信可泛化」而无实验支撑。
            - listitem [ref=f140e270]: 模型单一：全部结论建立在 247Kb LSTM 上；最优配比是否随模型容量移动（更大模型是否更能吃下海量合成数据）悬而未决；量化方案与量化精度损失未报告。
