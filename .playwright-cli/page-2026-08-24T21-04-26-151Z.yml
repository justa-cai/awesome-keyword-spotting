      - generic [ref=f140e24]:
        - heading "一分钟版本" [level=2] [ref=f140e25]
        - list [ref=f140e26]:
          - listitem [ref=f140e27]: 范式转换是全部痛苦与价值的源头：自定义 KWS 从「闭集分类」变成「开集匹配」——模型必须判断两段语音说的是不是同一短语，而用户将来注册的短语训练时从未见过。闭集只需覆盖几十个词的数据；开集需要覆盖极广的短语、语言、说话人分布——采集慢且贵。嵌入路线的命门在训练数据：嵌入空间的「任意短语可分性」完全由训练时见过的短语分布决定，长尾覆盖不足直接表现为开放词表上的匹配错误。
          - listitem [ref=f140e28]: 三层数据缺口：① 分类模型的嵌入天生残疾——只被训练判别「是不是某个关键词」，从未被要求最大化不同短语的嵌入距离（固定词表够用，开集误接受）；② 度量学习方案批采样效率低——传统 triplet 每批只构造 1 正 1 负，监督稀疏、梯度方差大；③ TTS 用于 KWS 的既有研究没回答配比问题——合成多少、掺多少真实、什么时候合成反而有害。
          - listitem [ref=f140e29]: 方法：GE2E 化批构造（8 短语 × 每短语 10 条，半数建质心）——同样前向计算量监督从 2 对膨胀到 320 对（40 正 + 280 负），负对 1:7 降权 γ 再平衡，质心锚点抹掉注册方差；Virtuoso TTS（726 说话人 × 5 韵律 × 38k 短语，满配 380 万条）；模型刻意保守（247Kb 量化 LSTM）把架构变量钉死，所有指标变化归因到数据。
          - listitem [ref=f140e30]: 零资源：两轴纯单调——短语多样性 500→38k 把 EER 从 34.42% 压到 12.62%（1k→10k 收益最大近半）；每短语采样量 10→100 从 16.88% 到 12.62%。
          - listitem [ref=f140e31]: 最重要的跨表读数：纯 TTS 满配 380 万条（EER 12.62 / AUC 5.93）追不上仅仅 5 万条真实数据（11.73 / 5.15）——TTS 的价值不在替代真实数据，而在与真实混合时的增强效应和零资源兜底。
          - listitem [ref=f140e32]: 低资源 + 配比反转（全文最重的负结果）：5 万真实打底，最优配比 38k × 每短语 50 条（EER 相对改善 30.1%、AUC 48.7%）；超过 50 条指标反向恶化（8.19→8.88→8.7）——过量 TTS 盖过真实数据贡献，训练分布向合成域偏移。合成数据不是越多越好。
          - listitem [ref=f140e33]: 规划曲线（Google 内视角）：质量对真实数据量做成可插值曲线——TTS 打底后要到 EER ≤ 5% 约需再采 70 万条真实话语、AUC ≤ 2% 约需 20 万条，把「还要不要花钱采数据」从拍脑袋变成查曲线。
          - listitem [ref=f140e34]: 边界：配比反转只有现象学解释（无域平衡 / 课程学习 / 域对抗等缓解实验）；仅英文单词级、单模型（最优点是否随容量移动未知）；无外部基线（不与 SpecAugment 等更廉价增强比增量价值）；单次运行无方差——「最优点在 50 条」恰恰建立在 8.19 对 8.48 对 8.7 的排序上。
    - generic [ref=f140e35]:
      - paragraph [ref=f140e36]: §01 · 问题陈述
      - heading "工程师要拍板的三个问题：合成多少、掺多少、何时有害" [level=2] [ref=f140e37]
      - generic [ref=f140e39]: 端侧约束划定模型边界：KWS 在音箱 / 手环 / 手表 / 耳机 / 手机上常驻运行，低功耗低内存——本文最终模型量化后只有 247Kb。ASR 路线精度高但能耗内存不适合连续使用，于是「分类模型产嵌入 + 余弦相似度比对」的轻量路线成为端侧主流。匹配范式：注册时同一短语说若干遍取嵌入平均得注册质心；推理时待检话语嵌入与质心算余弦、过阈值判命中——短语信息只存在于质心里，模型只负责学一个「同短语聚拢、异短语拉开」的普适嵌入空间。
      - generic [ref=f140e40]: 三层既有缺口：① 嵌入不优化短语间距——Lin 等 125 解码器分类 / Rybakov 等架构扫描都只判别固定词表，不同短语的嵌入点可能挨得很近导致开集误接受；② 度量学习批采样效率低——Sacchi 等把 FaceNet triplet 引入开集 KWS，但每批 1 正 1 负、梯度方差大收敛慢；③ TTS 用于 KWS 没回答配比——Liu 等 / Lim 与 Baek 用 TTS 把特定产品做达标，没有系统性评估合成 / 真实比例在不同资源档位下的质量影响。
      - generic [ref=f140e41]: 三个产品化场景（论文的组织结构）：零真实数据——TTS 两轴分别推到什么水平；低真实数据（~5 万条）——掺多少最优、掺多了会怎样；规划——TTS 打底后要到某质量目标还需采多少真实话语。第三个场景最体现 Google 内视角：真实采集是预算决策，「质量目标 → 数据预算」做成可插值曲线直接服务资源规划。
