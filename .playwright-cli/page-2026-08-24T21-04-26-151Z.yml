          - list [ref=f140e273]:
            - listitem [ref=f140e274]: 无统计显著性控制：全部单次结果——8.19 对 8.48 对 8.7 量级的差异无方差信息时难断言不是噪声，而「最优点在 50 条」恰恰建立在这几个点的排序上。
            - listitem [ref=f140e275]: 评估集偏小且注册随机：35 短语 × 10 条注册，注册集随机性会影响指标；未报告多次随机注册的重复实验。
            - listitem [ref=f140e276]: 无外部基线：不与任何已发表开集 KWS 或其它增强方法（噪声扰动 / SpecAugment / 速度扰动）对比——TTS 相对这些更廉价手段的增量价值无法判断。
            - listitem [ref=f140e277]: 插值与关键变量缺失：Fig 5 只有 8 个点、插值方式与外推风险未报告；5 万真实话语覆盖多少唯一短语未报告——这一变量直接决定「TTS 补短语多样性」的边际价值解读；摘要 46.7% vs 正文 48.7% 的不一致说明校对不足。
      - generic [ref=f140e278]: 值得补的方向：配比与采样策略自动化——把合成 / 真实混合比做成训练中的动态变量（按梯度贡献或域损失自适应）或课程学习先合成铺底再真实精调，从机制上避免反转；合成侧域增强（噪声 / 混响 / 信道仿真 / 说话人扰动）显式缩小域差距，抬高纯合成上限与最优配比；多语言（Virtuoso 覆盖 139+ locale，低资源语言真实数据更稀缺、方法价值更大）与多词关键词扩展；模型-数据联合标定（扫不同容量模型的最优配比，回答「多大模型能吃下多少合成数据」）；主动式真实采集（不确定性 / 多样性准则挑最值得标注的话语，把「采多少条」细化成「采哪一批」）。
