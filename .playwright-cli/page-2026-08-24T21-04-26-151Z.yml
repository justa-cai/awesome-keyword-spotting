      - paragraph [ref=f140e14]: "Synth4Kws: Synthesized Speech for User-Defined Keyword Spotting in Low-Resource Environments"
      - paragraph [ref=f140e15]: 作者：Pai Zhu、Dhruuv Agarwal、Jacob W. Bartel、Kurt Partridge、Hyun Jin Park、Quan Wang —— Google LLC
      - paragraph [ref=f140e16]: 发表：arXiv 2407.16840（2024-07）· 端侧 247Kb 量化 LSTM
      - generic [ref=f140e17]:
        - generic [ref=f140e18]: TTS × 开集 KWS × 资源档位
        - generic [ref=f140e19]: Virtuoso：726 说话人 × 5 韵律
