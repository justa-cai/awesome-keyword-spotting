          - generic [ref=f140e253]: "2"
          - text: 可复用的定量结论：零资源两轴单调；5 万真实基线上最优配比 38k × 50 条带来 EER 相对改善 30.1% / AUC 48.7%；首次明确报告过量合成数据反噬真实贡献的配比反转。
