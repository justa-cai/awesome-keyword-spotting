        - generic [ref=f4e224]: "1"
        - paragraph [ref=f4e225]: 「层数少」不等于「计算省」。ODE 求解器每步的计算比标准层复杂，训练时要多次函数评估、反传还要再解一次伴随方程——参数账和算力账要分开算，本文赢的只是前一笔。
      - generic [ref=f4e226]:
        - generic [ref=f4e227]: "2"
        - paragraph [ref=f4e228]: 运行时精度旋钮是范式级的新能力。传统网络的深度在训练后固定；NODE 的等效深度由容差现场决定——同一份模型可以在旗舰芯片上滑细、在低端 MCU 上滑粗，这对多档位产品线很有想象空间。
      - generic [ref=f4e229]:
        - generic [ref=f4e230]: "3"
        - paragraph [ref=f4e231]: 动态计算图是硬伤。求解步数随输入变化——DSP/NPU 这类固定功能加速器最恨这种不可预测的图；嵌入式落地需要固定步长求解器或离散 NODE 变体（作者自己列的后续方向）。
