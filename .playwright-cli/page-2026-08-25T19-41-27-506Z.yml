    - generic [ref=f4e137]:
      - generic [ref=f4e138]: "dz/dt = f(z(t), t, θ) ← 参数化的动力学（内嵌时序卷积 + TDNN） z(t₁) = z(t₀) + ∫ f dt ← 前向：ODE 求解器积分 反传: 伴随方法（adjoint）——常数内存，与深度无关 推理: 调求解容差 tol → 步数（NFE）↓ → 计算量↓ 精度微降"
      - generic [ref=f4e139]: 人话：传统网络像爬 5–15 级台阶，每级台阶一套自己的参数；NODE 像沿一条斜坡滑下去，坡的形状由一个函数描述——不管滑多远，参数只有一套。滑得多仔细（容差）由你现场决定：赶时间就滑粗一点，要精度就滑细一点。
    - paragraph [ref=f4e140]: BN 兼容性是训练收敛的关键：BN 的统计量若在求解过程中变化，梯度计算就不一致、训练发散。本文的方案是求解前预计算统计量、求解过程中冻结——一个不大但必要的工程补丁。推理优化则把容差当旋钮：精度损失可控时求解步数大幅下降——同一模型适配不同算力档位，这是传统网络给不了的自由度。
