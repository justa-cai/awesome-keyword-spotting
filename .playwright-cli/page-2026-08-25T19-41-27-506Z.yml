    - generic [ref=f4e16]:
      - generic [ref=f4e17]: TL;DR
      - list [ref=f4e18]:
        - listitem [ref=f4e19]: ◆ 传统 KWS 网络 5–15 层堆叠，参数量和内存对嵌入式设备是硬负担——但「堆叠」这个动作本身有数学含义。
        - listitem [ref=f4e20]: "◆ 关键洞见：ResNet 的残差连接 y_{n+1} = y_n + f(y_n) 恰好是一步欧拉法——深度网络本来就是对某个连续变换的离散近似；NODE 直接解原问题，不再离散。"
        - listitem [ref=f4e21]: ◆ 两个立即收益：参数共享（同一个动力学函数 f 在求解器里反复用，参数量不随深度涨）+ 运行时精度旋钮（求解器容差决定步数——精度-算力权衡从设计期搬到运行期）。
        - listitem [ref=f4e22]: ◆ 两个拦路虎都有解法：BN 统计量求解前预计算、求解中冻结；推理步数用容差压。结果：3 个「层」、参数 −68%、GSC 精度有竞争力。
