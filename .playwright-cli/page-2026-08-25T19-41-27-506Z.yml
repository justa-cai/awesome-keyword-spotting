  - generic [ref=f4e84]:
    - generic [ref=f4e85]: "02"
    - heading "机制：积分替代堆叠，容差成为新旋钮" [level=2] [ref=f4e86]
    - paragraph [ref=f4e87]: 前向传播变成解一个初值问题：输入是初值 z(t₀)，输出是积分到 t₁ 的解——「深度」不再是设计者定的整数，而是求解器在积分区间里自动决定的连续量。反向传播用伴随方法：不存中间层激活，内存消耗与深度无关——这对内存受限的端侧训练是个隐藏优势。
