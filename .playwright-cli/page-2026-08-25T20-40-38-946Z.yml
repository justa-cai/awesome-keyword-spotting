  - generic [ref=f24e12]: 昆山杜克大学 + 联想研究院（Lenovo「小艺」唤醒词场景）· arXiv 2011.01460（2020.11） 问题：混淆词（声学像、语义不是）导致误触发率高达 100% · 方法：遮蔽增强（40–60% 抹白噪当负样本）+ 说话人嵌入条件化 TTS 造一万种音色的混淆词难负样本 + CORAL 对齐合成/真实分布 一句话：误触发率从 100% 洗到 0.083%——三个数量级，产品从不可用到可用。
  - generic [ref=f24e13]:
    - generic [ref=f24e14]: "01"
    - heading "问题：声学像、语义不是" [level=2] [ref=f24e15]
    - generic [ref=f24e16]:
      - generic [ref=f24e17]: TL;DR
      - list [ref=f24e18]:
        - listitem [ref=f24e19]: ◆ 易混淆词是误触发的头号元凶：「你好」vs「你号」、「小艺」vs「笑意」——声学高度相似但不是关键词；基线模型在混淆词场景误触发率 100%（全中），产品完全不可用。
        - listitem [ref=f24e20]: ◆ 传统训练把所有非关键词当统一负类——模型从没专门学过「像但不是」这个类别；缺乏针对性难负样本。
        - listitem [ref=f24e21]: ◆ 三件套解法：遮蔽增强（残缺的关键词不是关键词）+ TTS 对抗样本（一万种音色说混淆词，声学逼真的难负样本）+ CORAL（对齐合成与真实的分布，防「合成腔」过拟合）。
        - listitem [ref=f24e22]: ◆ 联想小艺的量产背景：中文的同音字海让混淆词问题在中文唤醒词上格外严重——这是工业问题驱动的研究。
