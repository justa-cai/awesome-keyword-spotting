      - generic [ref=f24e186]: · 同一个混淆词 × 一万种嗓音
      - generic [ref=f24e187]: · 语速/韵律随嵌入自然变化
      - generic [ref=f24e188]: 输出：声学逼真的难负样本
      - generic [ref=f24e189]: 为什么比人工构造强：
      - generic [ref=f24e190]: · 真实混淆词的声学细节（共振峰走向 ·
      - generic [ref=f24e191]: 过渡音）TTS 能复刻，规则拼接不能
      - generic [ref=f24e192]: · 音色多样性覆盖部署时的陌生说话人
      - generic [ref=f24e193]: 左：把正样本的一部分抹掉当负样本——「残缺的关键词不是关键词」，教模型依赖完整模式。右：混淆词文本经一万种音色的 TTS 批量发声——声学逼真度是它作为难负样本的全部价值
    - generic [ref=f24e194]: 图 2 · 机制解剖：遮蔽的标签翻转哲学 · TTS 对抗样本的生产线
    - generic [ref=f24e195]:
      - generic [ref=f24e196]: "遮蔽: x_masked = mask(x, 40–60%) ⊕ 高斯白噪 → 标签 = 负样本 TTS: 混淆词文本 + speaker_emb (∈ 10,000 嵌入库) → 合成难负样本 CORAL: L = ‖C_s(合成特征) − C_t(真实特征)‖²_F ← 协方差对齐, 防\"合成腔\""
      - generic [ref=f24e197]: 人话：一半靠「抹」——把真唤醒词挖掉一块当反例，教模型别见风就是雨；一半靠「造」——让一万个人把「你号」「笑意」各念一遍当反例，教模型听出那一丁点声调差别。最后用 CORAL 把合成录音的「口音」校准回真实录音。
    - paragraph [ref=f24e198]: TTS 为什么比人工构造强：真实混淆词的声学细节（共振峰走向、音素过渡）TTS 能复刻，规则拼接不能；一万种音色覆盖部署时的陌生说话人。而 CORAL 是同组的第二次出场——#4（Domain-Aware Training）用它对齐近场/远场，本文用它对齐合成/真实：同一个工具，两种域差。
