  - generic [ref=f24e93]:
    - generic [ref=f24e94]: "02"
    - heading "机制：两种失败模式各配一味药" [level=2] [ref=f24e95]
    - paragraph [ref=f24e96]: 两路增强的分工清晰：遮蔽管「不完整的词」（残缺防御——把正样本抹掉 40–60% 后标为负样本，教模型「部分特征匹配不能触发」）；TTS 管「像但不是的词」（精细防御——逼模型学声调差异、声母细微不同这类精细判别特征）。两种失败模式都堵上，互补不冗余。
    - img [ref=f24e97]:
      - generic [ref=f24e99]: 机制解剖：遮蔽的哲学 · TTS 对抗样本的生产线
      - generic [ref=f24e100]: 遮蔽增强
      - generic [ref=f24e172]: 被遮蔽段（40–60%）→ 高斯白噪填充
