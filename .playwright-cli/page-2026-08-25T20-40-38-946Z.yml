      - generic [ref=f24e322]: ↳ 检索式（#13 从真实数据挖）受限于「数据里恰好有」，生成式（本文 TTS 造）想造什么造什么且可控多样性——代价是合成/真实的域差，必须配对齐手段（CORAL/对抗）否则学到「合成腔」；两条路线的取舍本质是覆盖率 vs 保真度。
      - paragraph [ref=f24e323]: ② 遮蔽增强是免费的普适防御。
      - generic [ref=f24e324]: ↳ 不需要任何外部资源（无 TTS、无清单），把正样本抹一块当负样本就能教「完整模式依赖」——这个手法从人脸识别借来，通用于任何「部分匹配不应触发」的检测任务；可作为所有方案的基础层。
      - paragraph [ref=f24e325]: ③ 误触发治理要按「失败模式」分型下药。
      - generic [ref=f24e326]: ↳ 「不完整的词」与「像但不是的词」是两种不同的失败模式，各配一味药——先做误触发样本的分型分析（残缺/近音/背景声），再针对性构造训练信号，比笼统「加负样本」有效一个量级。
