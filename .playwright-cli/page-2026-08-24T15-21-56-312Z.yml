        - heading "一分钟版本" [level=2] [ref=f12e25]
        - list [ref=f12e26]:
          - listitem [ref=f12e27]: 被点破的盲区：MCU 级 KWS 方案（8bit 量化、二值网络、510nW 芯片）全部是静态模型——烧录后永不改变。新增一个唤醒词要走"回收数据、云端重训、全量固件更新"全流程，与海量低价值设备的运维定位不匹配。
          - listitem [ref=f12e28]: 交叉点创新：BNN 的效率优势（71 倍能耗下降）从未被用到 KWS 持续学习场景。本文把七种"只调最后一层"的资源高效 CL 算法（TinyOL 家族 / LwF / CWR）首次搬上 MCU 优化 BNN 骨干。
          - listitem [ref=f12e29]: 结构：冻结的二值卷积骨干（首末层全精度、中间层二值）+ 唯一可训练的全连接输出头——反传只涉及最后一层，每新样本只需 436–707 FLOPs，占前向 291 MFLOPs 的 0.00024%。
          - listitem [ref=f12e30]: 结果：1 新类时三类算法精度 >95% 反超预训练基线；4 新类最坏 82.9%；约 2,048 个样本即可收敛（批式算法要更多）。选型指南：1 个新词选 TinyOL/LwF，多新词选 TinyOL v2/CWR，数据受限避开批式，算力不用考虑。
          - listitem [ref=f12e31]: 诚实的缺口：全部实验在 TensorFlow 服务器仿真，无真机 MCU 实测；冻结骨干的天花板在"新类整合"一侧——新类没有被学得像旧类一样好。
