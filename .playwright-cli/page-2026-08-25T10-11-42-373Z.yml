  - generic [ref=f243e123]:
    - generic [ref=f243e124]: X_ch = X + MLP_C( LayerNorm(X) ) // 沿麦克风通道维 C 的全局线性混合
    - generic [ref=f243e125]: 通道混合，多通道扩展的核心。把特征在 C 维展平过一层全连接再重塑回来——模型自由学习「左强右弱 = 目标在左」这类模式。时频卷积管声学、通道 MLP 管空间，两种物理量不混。
  - generic [ref=f243e126]:
    - generic [ref=f243e127]: d_k = ‖ z − c_k ‖₂ → ŷ = FC( [ z ; d₁, d₂, …, d_K ] )
    - generic [ref=f243e128]: 质心感知。每个关键词 k 有一个可训练质心 c_k；样本的潜在表示 z 到所有质心的距离向量与 z 本身拼接后进分类器——分类器同时拿到「特征长什么样」和「离各词的典型位置多远」。
  - generic [ref=f243e129]:
    - generic [ref=f243e130]: "L_centroid = Σ_k ( 1/|B_k| ) · Σ_{z∈B_k} ‖ z − c_k ‖² （MSE，与分类损失联合）"
    - generic [ref=f243e131]: 质心怎么学好。MSE 把同类样本的表示拉向各自质心——质心成为该词在特征空间的「锚」，距离才有几何意义。
