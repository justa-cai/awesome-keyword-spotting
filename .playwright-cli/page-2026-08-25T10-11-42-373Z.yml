  - heading "远场唤醒不靠前端滤波硬扛： 让 473K 的小模型自己听出声音的方向" [level=1] [ref=f243e4]: 远场唤醒不靠前端滤波硬扛：让 473K 的小模型自己听出声音的方向
  - generic [ref=f243e5]:
    - generic [ref=f243e6]: Multi-channel ConvMixer
    - generic [ref=f243e7]: Alibaba + NTU · arXiv 2204.05445
    - generic [ref=f243e8]: T·F·C 三维专用混合 + 质心感知
    - generic [ref=f243e9]: 473K 参数 · 6 通道环形阵列
    - generic [ref=f243e10]: MISP 2021 评分 0.338 → 0.126（−63%）
  - generic [ref=f243e11]: 一句话：把麦克风阵列的空间线索留到模型内部去学——为时间 / 频率 / 通道三个物理意义不同的维度各配一个专用混合算子，再用「关键词质心」给分类器一副特征空间地图。场景：真实家庭远场唤醒——混响、家电噪声、电视重放、干扰说话人叠加的最难环境（MISP Challenge 2021）。
  - generic [ref=f243e12]:
    - heading "一分钟版本" [level=3] [ref=f243e13]
    - listitem [ref=f243e14]: 任务：远场多通道 KWS——直接从 6 麦克风阵列的原始频谱学「空间 + 频谱」联合特征，不依赖前端增强也能工作。
    - listitem [ref=f243e15]: 旧路线的坑：前端增强（MVDR/WPE）+ 单通道 KWS 两阶段级联——前端错误不可逆传播，且前端优化 SNR 不优化唤醒准确率。
    - listitem [ref=f243e16]: 多通道 ConvMixer：在单通道 ConvMixer 的时间 / 频率混合之外，新增通道维 MLP 混合——显式学习「从麦克风间差异提取方位」（左强右弱 = 目标在左）。
    - listitem [ref=f243e17]: 关键决策：不把 C 个通道拼成 C×F 个「频率通道」——空间量与声学量物理意义不同，暴力拼接会混淆学习目标；专用算子各管各的。
    - listitem [ref=f243e18]: 质心感知：每个关键词一个可训练质心，样本到各质心的距离向量与原始特征拼接后分类——分类器从「只看绝对坐标」变成「也看相对坐标」，说话人移动时更稳。
    - listitem [ref=f243e19]: 与原型网络的区别：质心是端到端可训练参数（非推理时现算）；距离只是补充特征（非纯距离分类）。
    - listitem [ref=f243e20]: 主结果：MISP 2021 竞赛评分官方基线 0.338 → 原始阵列输入 0.152（−55%）→ 叠加前端 MVDR+WPE 0.126（−63%）。
    - listitem [ref=f243e21]: 消融：多通道 vs 波束成形后单通道优 10–15%；去掉质心感知退化 5–8%；前端增强再叠加约 20%——三级互补不冗余。
    - listitem [ref=f243e22]: 参数效率：仅 473K 参数，与排行榜上数 M 参数模型同台竞争仍占优——处于参数效率帕累托前沿。
    - listitem [ref=f243e23]: 诚实边界：依赖 6 通道硬件、通道数固定需重训；通道混合是线性变换，复杂多径干涉可能欠拟合；仅 MISP 一个数据集验证。
