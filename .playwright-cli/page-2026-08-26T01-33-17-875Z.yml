        - text: 一级每帧常驻但极便宜；绝大多数时间说「不是」，二级根本不醒——平均功耗 ≈ 一级成本 + 触发率 × 二级成本。
      - generic [ref=f122e83]:
        - heading "声纹放二级的理由" [level=3] [ref=f122e84]
        - text: 声纹模型贵——常驻跑不起；只在关键词候选上验身份，非关键词片段不值得算。
      - generic [ref=f122e85]:
