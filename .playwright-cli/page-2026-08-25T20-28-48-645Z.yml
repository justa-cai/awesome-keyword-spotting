      - generic [ref=f21e271]: ↳ 高质量种子 + 分布放大（合成/增强）稳定胜过低质量堆量——预算决策先保每一批的干净度，再用合成撑开分布，数量排最后；这个优先级在多数数据稀缺场景都成立。
      - paragraph [ref=f21e272]: ② 合成的价值在撑开分布，不在增加信息。
      - generic [ref=f21e273]: ↳ TTS 复述的是种子已含的信息，增益来自几何放大（更多音色/语速/环境）——所以说话人多样性比合成条数重要；也所以增益随真实数据充足而归零：分布已覆盖时放大无物。
      - paragraph [ref=f21e274]: ③ 小时级原型改变的是决策结构。
      - generic [ref=f21e275]: ↳ 「快速验证 → 有希望才投数据预算」的循环替代了「先投数周采集再知道行不行」——在探索性项目多的团队，原型速度对整体产出的贡献常大于单项精度。
    - paragraph [ref=f21e276]: 系列坐标：「造数据」谱系的 TTS 分支——本文（2020）用合成撑分布；2021 年 Noisy Student 用伪标签从无标注真音频「蒸」数据（另一条免费数据路）；#7 ProtoNet（同年）走「不造数据改学嵌入」的对照路线；2022 年 VSVC 后门攻击则展示了同一技术的暗面——TTS 也能投毒。合成数据的工具属性贯穿整个谱系，两面都要看。
