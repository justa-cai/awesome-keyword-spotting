        - generic [ref=f21e211]: "1"
        - paragraph [ref=f21e212]: TTS 质量是入场券不是加分项。低质量 TTS 引入「合成腔」——模型学到合成数据的偏置分布，真实场景反而掉点；神经 TTS 的成熟（Tacotron 2/WaveNet）是这篇论文 2020 年才可能出现的前提。
      - generic [ref=f21e213]:
        - generic [ref=f21e214]: "2"
        - paragraph [ref=f21e215]: 短词/罕见词的失败模式有先见性。TTS 对短音素序列的保真度不足意味着「Hi」「Hey」这类短唤醒词的合成增强风险更高——后来的自定义唤醒词产品线都要面对这个约束。
      - generic [ref=f21e216]:
        - generic [ref=f21e217]: "3"
        - paragraph [ref=f21e218]: 快速原型框架改变的是决策流程。小时级出模型让「先验证方向再投数据预算」成为可能——原来数周的采集周期里产品方向可能都变了；这是工程方法论层面的贡献，比精度数字更有长期价值。
