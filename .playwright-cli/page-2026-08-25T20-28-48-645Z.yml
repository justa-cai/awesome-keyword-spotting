  - generic [ref=f21e13]:
    - generic [ref=f21e14]: "01"
    - heading "问题：数据是 KWS 开发的主瓶颈" [level=2] [ref=f21e15]
    - generic [ref=f21e16]:
      - generic [ref=f21e17]: TL;DR
      - list [ref=f21e18]:
        - listitem [ref=f21e19]: ◆ 为新词表快速训 KWS 的需求越来越普遍，但数据四座大山：采集贵（招人多环境录）、标注贵、周期数周起、多样性不足（口音/噪声永远覆盖不全）。
        - listitem [ref=f21e20]: ◆ 两个科学问题被系统回答：到底需要多少真实数据？TTS 能补多少？——数据梯度实验（从 5 条到全集）给出了定量曲线。
        - listitem [ref=f21e21]: ◆ TTS 增强的核心不是「合得多」而是「合得多样」：说话人身份、说话风格、录音条件三个旋钮——其中说话人多样性最关键（单音色合一万条不如多音色合一千条）。
        - listitem [ref=f21e22]: ◆ 快速原型框架：10–100 条真样本 + ~10000 条合成 → 当天可用的模型——把数据预算花在刀刃上（先小时级验证方向，值得再收真数据）。
