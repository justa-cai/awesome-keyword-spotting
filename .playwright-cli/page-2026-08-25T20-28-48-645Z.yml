  - generic [ref=f21e86]:
    - generic [ref=f21e87]: "02"
    - heading "机制：增益的形状与多样性的价值" [level=2] [ref=f21e88]
    - paragraph [ref=f21e89]: 数据-精度曲线的形状是本文最有用的发现：TTS 的增益集中在低数据区（+20–30%），数据充足后两线汇合——合成数据的边际贡献递减到零。这不是 TTS 不行，而是真实分布已经被覆盖，合成不再提供新信息。100–500 条真实 + TTS ≈ 数千条纯真实的 80–90%——这个数字直接指导「要收多少数据」的预算决策。
