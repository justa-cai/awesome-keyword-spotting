      - generic [ref=f21e130]: 左：TTS 的增益集中在低数据区——数据充足后边际递减；100–500 条真样本 + TTS 能到数千条纯真实数据的八九成。右：多样性的三个旋钮里，说话人多样性最关键——合成数据的「分布覆盖」比「数量」重要
    - generic [ref=f21e131]: 图 2 · 机制解剖：真实 vs 真实+TTS 的数据曲线 · 合成多样性的三个旋钮
    - generic [ref=f21e132]:
      - generic [ref=f21e133]: "合成: text(关键词) → 多说话人神经 TTS × {音色, 语速/音调, +噪声/混响} 训练: mix(真实少量高质量, 合成大量多样化) —— 最优配比随真实数据量变化 原型: 10–100 条真 + ~10⁴ 条合成 → 小时级训练 → 可用 KWS"
      - generic [ref=f21e134]: 人话：先用少量干净的真录音当「种子」，再用 TTS 把种子的分布撑开——让一百个人用不同嗓音、不同语速、在不同环境里把这个关键词念一遍。假录音不提供新信息，但把真实种子的几何放大了成千倍。
    - paragraph [ref=f21e135]: 质量胜数量是另一个反直觉结论：高质量少量真实 + 大量合成 > 低质量大量真实——低质量数据的标注噪声和分布偏移，比数据不足更伤。这给数据采集的优先级排序：先保证每一批的干净度，再谈规模。
