        - generic [ref=f177e84]: 数学基石的功耗-精度双向耦合：Q 高 = 对特定频率抓得准（精度收益）但需要更低噪声的谐振电路维持窄通带（功耗代价）；Q 低 = 电路便宜但相邻通道信息重复。一阶模型的电路直觉：N 是电路份数线性叠加（多通道多份偏置电流）；fmax 决定速率量级（中心频率越高维持同样动态所需跨导越大）；Q 决定储能与放大精度（高 Q 谐振器的环路增益与噪声裕量都要用电流买）。后端选 res16 不是精度最优，而是「已发表功耗面积最优模拟特征提取芯片在 KWS 演示中用过的网络」——仿真结论对芯片界直接可比。
      - generic [ref=f177e85]: 数据规模的取舍逻辑：GSCD 每词至少 3,000 样本但每关键词只取 200（unknown 类 800——25 个词共享一类不平权会吃亏），共 2,800 训练样本——原因是 Figs 3–5 需要 141 次训练会话（47 点 × 3 试验）；剩余样本把验证 / 测试配到同规模（1:1:1 改善估计质量）。最终对比（Fig 6/7）换 10 倍大训练集（28,000）排除欠训练混杂。代价：小集扫掠曲线绝对精度被低估 3.3 点（90.9 vs 94.2）——读 Figs 3–5 只看形状不看绝对值；且最关键的崩塌边界区域是在最不利的训练条件下测的（好在典型值附近的平台结论有大集兜底）。
