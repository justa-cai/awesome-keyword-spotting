      - generic [ref=f177e24]:
        - heading "一分钟版本" [level=2] [ref=f177e25]
        - list [ref=f177e26]:
          - listitem [ref=f177e27]: 瓶颈位置的翻转（本文立题）：过去十年 KWS 研究重心几乎全在神经网络侧（压缩 / 量化 / 蒸馏）——隐含假设「算力瓶颈在模型」；芯片实测打破假设：先进 KWS 芯片的前端特征提取器吃掉整个系统约 70% 功耗——把后端再砍十倍系统总功耗几乎不动，真正的钱要省在前端。两种范式：ADC-DSP（奈奎斯特率量化前置）vs ASP-ADC（模拟滤波器组 + 包络检波前置、ADC 推到特征率）——后者能效高 12 倍。
          - listitem [ref=f177e28]: 最缺乏共识的环节：四颗先进芯片瞄准同一任务——滤波器数 31/16/16/32、fmax 4/10/5/8kHz、Q 3/2/2/26——Q 差 13 倍。致命之处：滤波器组功耗一阶正比三个参数的每一个（仅 Q 一项 26 vs 2 就可能多烧一个数量级以上）——缺乏共识 + 一阶正比 = 系统性过度设计，常驻设备长期为这份保守买单。
          - listitem [ref=f177e29]: 为什么过去形成不了共识（方法学缺口）：芯片论文传统做法把架构参数、电路噪声、失真捆在一起，流片后测一次精度完事，从不报置信区间——单次训练精度本身就有随机波动，一两个百分点的参数效应完全被训练噪声淹没；架构参数对精度的「净效应」从未被隔离测量。
          - listitem [ref=f177e30]: 本文方法学：47 个扫掠点（N 15 档 1–64 / fmax 15 档 0.25–20kHz / Q 17 档 0.2–60——范围延伸到远低于和远高于现有芯片取值，才能找到崩塌边界）；每点重新处理整个数据集 + 重训重测固定后端（res16 + 固定超参）+ 3–5 次试验的 95% 置信区间；把一切能固定的都钉死（窗长 / 最低频率 / 阶数 / 分布）——软件消融纪律移植到模拟前端。
          - listitem [ref=f177e31]: 三条过度设计判据（可写进下一颗芯片规格书）：① N > 16 纯浪费——64 个滤波器与 16 个精度大致相同（平台彻底饱和出乎「边际递减」预期）；② fmax > 2kHz 为无效带宽付电钱——语音带宽 4kHz 但这 10 个词的判别能量集中在 2kHz 以下；③ Q > 4 即浪费——Q 是唯一非单调参数（低 Q 选择性差彼此冗余、高 Q 通带过窄间隙丢能量），最优在 4，典型值 8 已在浪费区。
          - listitem [ref=f177e32]: tiny 组合（10, 2kHz, Q2）与「拐点骑乘」选取逻辑：N 和 fmax 取在平台边缘、Q 越过最优点 4 压到 2（三个参数中降幅最大的一个敢越界，因为绝对损失被总账 1.8% 兜住）——「为功耗冒进、为精度止损」的组合决策，不是逐参数取最优（那样会得 16·2k·4）。2.4 × 3.5 × 4 = 33.6 倍功耗降低，只换 1.8 个百分点精度（94.2→~92.4，28,000 样本训练集、5 次试验）。
          - listitem [ref=f177e33]: 两个震撼的次级读数：① 单特征极限——只有 1 个滤波器时准确率仍有 62.2%（随机基线 9.1%）——能量包络这一个维度就携带了大部分可判别信息；② tiny 的每个参数都压到所有芯片取值的边界或之外——现有任何一颗芯片都没把三个参数同时压到下限，典型值与 tiny 之间的全部空间都是潜在节省。
          - listitem [ref=f177e34]: 边界（收益上界）：33.6 倍的关键前提是「每个滤波器 SNR 保持恒定」——真实电路里缩参数省下的偏置电流很可能直接压低 SNR（高 Q 小电流电路尤其如此），实测节省几乎必然更小、精度退化可能更大；纯仿真无流片（只有相对倍数无绝对功耗）；噪声失真完全未建模（明确留给后续）；结论绑定 4 年前的小型 res16（参数量未报）；只覆盖 10 词（30 词 / VAD / 说话人识别是开放问题——词表扩大后 2kHz 上限尤其可疑）；OFAT 无交互验证；无噪声 / 混响 / 远场鲁棒性；只有准确率（无误唤醒 / 漏唤醒 / 每次推理能量）。
    - generic [ref=f177e35]:
      - paragraph [ref=f177e36]: §01 · 问题陈述
      - heading "从「缺乏共识」走向「接近功耗基本极限」" [level=2] [ref=f177e37]
      - generic [ref=f177e39]: 核心问题与四个子挑战：模拟滤波器组能做多小而不明显伤害经后端网络传递下来的 KWS 精度？要严谨回答必须——定义并测量「不明显伤害」（真实后端 + 端到端精度 + 置信区间）；隔离归因（后端架构固定、超参固定、噪声失真排除在模型外）；扫足够宽（延伸到远低于和远高于芯片取值，找到崩塌边界）；把精度曲线翻译成功耗结论（借一阶正比关系，拐点直接换算功耗倍数）。概念切分：架构参数（N、fmax、Q）与模拟非理想性（噪声失真）是两类东西——模拟设计流程先定架构再压噪声，本文先扫架构、噪声失真留给后续，这个顺序本身是对芯片设计流程的尊重。
