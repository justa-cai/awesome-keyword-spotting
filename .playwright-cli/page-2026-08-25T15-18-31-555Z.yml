  - generic [ref=f280e23]: 量化错配 + 帕累托偏离
  - generic [ref=f280e24]:
    - generic [ref=f280e25]:
      - heading "架构-量化错配" [level=3] [ref=f280e26]
      - paragraph [ref=f280e27]: 某些架构组件对量化误差特别敏感（特定激活函数、注意力机制）——为浮点精度优化的架构量化到 INT8/INT4 后可能遭遇显著掉点。浮点基准上的排名与整数推理后的排名不是一回事。
    - generic [ref=f280e28]:
      - heading "流程性次优" [level=3] [ref=f280e29]
      - paragraph [ref=f280e30]: 架构设计阶段不看量化约束，压缩后的模型在准确率-效率权衡上远离帕累托最优——「设计冠军再压缩」拿到的是两阶段局部最优的乘积，而全局最优可能藏在浮点表现平平但量化鲁棒的架构里。
    - generic [ref=f280e31]:
      - heading "解法一句话" [level=3] [ref=f280e32]
      - paragraph [ref=f280e33]: 把 QAT 塞进 NAS 的搜索循环——α 在「整数世界」的性能上更新，搜索全程在量化条件下比武——搜出来的架构天然量化友好，压缩不再是对架构的事后惩罚。
    - generic [ref=f280e34]:
      - heading "工具链完整性" [level=3] [ref=f280e35]
      - paragraph [ref=f280e36]: NAS 搜索 → QAT 微调 → 量化模型导出的完整流水线——不只是方法论文，还是能落地跑的工程链路（虽然最后一公里——真机实测——仍缺）。
