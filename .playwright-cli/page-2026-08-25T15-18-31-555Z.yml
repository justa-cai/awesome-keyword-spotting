  - generic [ref=f280e3]: 论文精读 · 可视化版 · 2021 №11
  - heading "浮点冠军不等于整数冠军： 把量化塞进架构搜索的循环里" [level=1] [ref=f280e4]: 浮点冠军不等于整数冠军：把量化塞进架构搜索的循环里
  - generic [ref=f280e5]:
    - generic [ref=f280e6]: NAS + QAT 联合优化 · 格拉茨工业大学
    - generic [ref=f280e7]: arXiv 2104.06666 · DARTS + INT8 仿真
    - generic [ref=f280e8]: 搜索空间：DS 卷积/空洞/池化/跳跃/零
    - generic [ref=f280e9]: INT8 掉点 <0.5%（先搜后量化 1–2%）· size/MADD −20–30%
  - generic [ref=f280e10]: 一句话：「先设计架构、后压缩模型」的流水线有两宗罪——浮点最优架构量化后可能大幅掉点（某些激活/注意力组件对量化误差特别敏感），且压缩后的模型远离帕累托最优。本文把量化感知训练（QAT：INT8 仿真 + STE + BN 折叠）直接嵌进 DARTS 的搜索循环：架构参数 α 的更新看的是量化后的性能而非浮点性能——浮点好但量化崩的架构活不到搜索结束。联搜架构 INT8 化掉点 <0.5%，同准确率下 size/MADD 比 DS-CNN 少 20–30%。
  - generic [ref=f280e11]:
    - generic [ref=f280e12]: TL;DR
    - listitem [ref=f280e13]: ◈ 顺序流水线的两宗罪：架构与量化错配（为浮点优化的组件在 INT8/INT4 下掉点，浮点冠军可能是整数差生）；流程性次优（两阶段各自最优的乘积 ≠ 全局最优，压缩后远离帕累托前沿）。
    - listitem [ref=f280e14]: ◈ DARTS 搜索：连续松弛把离散的架构选择变成边上的 softmax 权重（选择问题变连续优化），双层优化交替更新架构参数 α 与网络权重 w——搜索空间含 7 种操作（3×3/5×5 DS 卷积、空洞卷积、最大/平均池化、跳跃、零）。
    - listitem [ref=f280e15]: ◈ QAT 进循环的三件套：权重+激活 INT8 量化仿真（前向模拟量化/反量化，权重学习时适应量化误差）、STE 直通估计器（量化不可导，梯度直通近似）、BN 折叠（BN 参数并入前层权重，推理省一步）。
    - listitem [ref=f280e16]: ◈ 关键一步：DARTS 每次前向都对候选操作施加量化仿真，α 的更新依据是量化后的验证性能——量化脆弱的组件拿不到架构权重，自然被淘汰。
    - listitem [ref=f280e17]: ◈ 搜出的架构三个涌现偏好：偏爱 DS 卷积（参数小且量化友好，两优点同向）、少用池化（对量化不敏感但 KWS 信息损失大）、跳跃节制（保梯度但避免量化不稳定的恒等映射长链）——这些是优化压力的产物，不是人为规定。
    - listitem [ref=f280e18]: ◈ 结果（约值）：GSC v2 12 类 95–96%；INT8 化掉点 <0.5%（先搜后量化与 DS-CNN 均掉 1–2%）；同准确率下 size/MADD 比 DS-CNN 少 20–30%；联合 vs 顺序量化后高 0.5–1%。
    - listitem [ref=f280e19]: ◈ 精度阶梯：FP32→INT8 几乎无损，INT4 掉 5–10%——INT8 是当前 KWS 量化的安全下限，联合优化缓解但不解决极低精度问题。
    - listitem [ref=f280e20]: ◈ 边界：搜索仍需数天到数周 GPU；无真实 MCU/DSP 推理实测；搜索空间无注意力/Transformer 组件；未考虑流式。
