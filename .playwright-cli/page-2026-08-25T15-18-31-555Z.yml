  - generic [ref=f280e298]:
    - generic [ref=f280e299]: 可迁移判断
    - paragraph [ref=f280e300]: ↳ 在哪个世界里比武，就练哪个世界的功夫：部署目标是 INT8 就该让架构选择看到 INT8 的成绩——凡是约束会改变排名的优化问题（量化/延迟/内存），约束都要进选择循环，而不是事后补。
    - paragraph [ref=f280e301]: ↳ 优化压力会自己长出好结构：DS 卷积多、池化少、跳跃节制——三个偏好都不是人定的，而是量化目标下涌现的。给搜索自由度 + 正确的目标，结构偏好可以作为目标的证据来读。
    - paragraph [ref=f280e302]: "↳ INT8 是量化的安全下限，INT4 需要别的方法：联合优化缓解但不解决极低精度——量化误差的下限由数值表示本身决定，INT4/二值要靠专门的量化算法（如本仓库 2022 #36 的分布整形路线）而不是架构选择。"
    - paragraph [ref=f280e303]: ↳ 联合优化的收益要靠对照证明：+0.5–1% 不大但有消融背书——评估「联合」类方法时，必须给「顺序」基线留格子，否则改进无从归因。
