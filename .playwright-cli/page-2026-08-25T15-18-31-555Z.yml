  - heading "§02 方法：连续松弛 × 量化仿真" [level=2] [ref=f280e113]:
    - generic [ref=f280e114]: §02
    - text: 方法：连续松弛 × 量化仿真
  - generic [ref=f280e115]: softmax 权重 · 双层优化 · STE · BN 折叠
  - generic [ref=f280e116]:
    - generic [ref=f280e117]: "DARTS: 边输出 = Σᵢ softmax(α)ᵢ · opᵢ(x) # 离散选择 → 连续混合 双层优化: 外层更新 α（选架构）· 内层更新 w（训权重） QAT: 前向: x → quantize → dequantize → 继续（INT8 仿真） 反向: STE 直通估计器（量化不可导，梯度直通） BN 折叠: BN 参数并入前层权重 联合: α 的更新依据 = 量化后的验证性能（非浮点性能）"
    - generic [ref=f280e118]: 人话：DARTS 把「选 3×3 还是 5×5」变成「两边各占多少 softmax 权重」——梯度下降自己学出该选谁。QAT 让每次前向都先过一遍「量化-反量化」，权重在学习中提前适应整数的粗糙；量化本身不可导，反向时用 STE 装作它不存在。两者合体后，架构选择比的是整数推理的成绩。
  - generic [ref=f280e119]:
    - generic [ref=f280e120]:
      - heading "涌现偏好是证据" [level=3] [ref=f280e121]
      - paragraph [ref=f280e122]: 搜出的架构偏爱 DS 卷积、少用池化、跳跃节制——这些偏好不是人为规定的，而是「量化性能」目标下优化压力的自然产物。搜索空间给了自由度，量化目标收窄了选择——结构与目标自洽。
    - generic [ref=f280e123]:
      - heading "联合 vs 顺序的对照" [level=3] [ref=f280e124]
      - paragraph [ref=f280e125]: 消融显示联搜架构量化后比「先搜浮点再量化」高 0.5–1%——差距不大但方向明确：浮点最优与整数最优的架构确实不同，让搜索看到量化就足以把这点差异找回来。
