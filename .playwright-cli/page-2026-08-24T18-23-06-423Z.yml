      - heading "可转述的四个判断" [level=2] [ref=f76e167]
      - generic [ref=f76e169]:
        - generic [ref=f76e170]:
          - generic [ref=f76e171]: "1"
          - text: 把对齐做成流式首个推理时动态对齐音频流与关键词文本的流式 KWS：全局性摊销进逐帧 DP 状态更新——消除开放词表 KWS 走向常驻部署的最大障碍。
        - generic [ref=f76e172]:
          - generic [ref=f76e173]: "2"
          - text: 局部 + 全局双通道范式CTC 管「对齐在哪里」（逐帧即时证据）、嵌入管「整体像不像」（整词全局校验）——纯 CTC 误报控制弱的缺口由嵌入补上，两投影头共享 155K 编码器。
        - generic [ref=f76e174]:
          - generic [ref=f76e175]: "3"
          - text: 免预训练对齐器的端到端CTC 对齐与联合嵌入空间同时学出——此前流程依赖外部对齐器 / 注意力产生配对单元，配对质量受制于上游。
        - generic [ref=f76e176]:
          - generic [ref=f76e177]: "4"
          - text: 「粒度即上下文」证据链字符 / 词 / 短语三级消融（5.6 / 31.7 / 49.2 帧）与性能完全同向——聚合窗口大小是纳入全局上下文量的控制变量，粒度越粗隐空间分离越好。
