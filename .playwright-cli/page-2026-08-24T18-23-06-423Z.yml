      - generic [ref=f76e164]: 三点核心结论：① LPE 反超——155K 流式模型 EER 6.06 / AUC 98.32 全表最高，参数不到 DSP 的 1/24、不到 Attention 的 2/3，且完全流式；② LPH 落后 DSP 6.27 点（29.63 对 23.36）但好于 Attention 3.27 点——困难负例是编辑距离近、发音高度相似的短语，区分它们需要更强全局判别，DSP 的 3.7M 全序列容量恰在此占优；论文为流式与轻量牺牲了容量与上下文长度；③ 性价比——从纯 CTC 到加嵌入头只增 8K 参数（147K→155K），LPE EER 9.11→6.06。表征层佐证（Fig. 3）：词级模型对 "said the king" 的音频-文本嵌入相关图显示 CTC 对齐段内相关性高于段间——两套打分相干工作、互不拆台，也是端到端联合训练可行的直接证据。
