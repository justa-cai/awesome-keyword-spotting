      - heading "LPE 反超非流式；LPH 差距指向容量鸿沟" [level=2] [ref=f76e90]
      - generic [ref=f76e92]: 数据与设置：LibriPhrase（与前人公平可比）——训练由 train-clean-100/360 生成，短语 1-4 词；干净语音卷积合成房间脉冲响应 + MUSAN 噪声（SNR −3~25 dB）。评测由 train-others-500 生成，负例按编辑距离分 LPE（简单）/ LPH（困难）两档；4391/2605/467/56 个 episode 对应 1-4 词长度，每 episode 3 正对 + 3 负对。指标：EER / AUC（阈值无关，LibriPhrase 原文口径）；部署侧指标（特定误唤醒率下召回 / 每小时误唤醒 / 触发延迟）未报告。训练：batch 1024 个关键词、Adam + 余弦退火、100 epoch、两块 A100 两天。
