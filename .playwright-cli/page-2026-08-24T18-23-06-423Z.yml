      - generic [ref=f76e25]:
        - heading "一分钟版本" [level=2] [ref=f76e26]
        - list [ref=f76e27]:
          - listitem [ref=f76e28]: 痛点：常驻 KWS 三条底线——低算力、只用过去帧、全天候激活。已有文本注册方法（交叉注意力 LibriPhrase / 动态规划 DSP）都要全局上下文：注意力矩阵两端互相依赖，动态规划要整条序列才能切分——与常驻监听正面冲突。纯 CTC 流式方案倒是逐帧，但只有帧级局部证据，误报控制弱。
          - listitem [ref=f76e29]:
            - text: 方案（CTCAT）：声学编码器（12 个 MobileNet 块，155K 参数）双头输出——CTC 头给每帧 token 后验、AE 头给每帧声学嵌入；CTC 对齐器维护为当前关键词构建的解码图（y₁-blank-y₂-blank-…-y
            - subscript [ref=f76e30]: U
            - text: ），逐帧 Viterbi 更新每个状态的累积分数 / 转移时刻 / 累积嵌入——每个时刻都持有「以当前帧结尾的最优对齐路径」。
          - listitem [ref=f76e31]:
            - text: 双分数融合：z = z
            - subscript [ref=f76e32]: CTC
            - text: （局部：每个字符是否按顺序被发音）+ 6·z
            - subscript [ref=f76e33]: embed
            - text: （全局：整词声学-文本一致性）——两类证据互补，从纯 CTC 到加短语级嵌入，LPE EER 9.11%→6.06%。
          - listitem [ref=f76e34]: 结果：简单负例（LPE）上 155K 流式模型反超非流式 DSP（3.7M，EER 7.36→6.06）和 Attention（420K，8.24）；困难负例（LPH）仍落后 DSP 6.27 点（29.63 对 23.36）——3.7M 全序列容量在发音高度相似的负例上占优。
          - listitem [ref=f76e35]: 最有信息量的消融：聚合粒度即上下文量——字符级（平均 5.6 帧）/ 词级（31.7 帧）/ 短语级（49.2 帧）的 LPH EER 完全同向（32.76 / 31.62 / 29.63）；字符级在 LPH 上甚至比纯 CTC 还差（上下文太少注入噪声）。
          - listitem [ref=f76e36]: 缺口：双分数线性融合未归一化（z_CTC 随时长无界增长）；触发阈值 / 端点 / 去重的产品链路缺失；全部单次训练无显著性。
    - generic [ref=f76e37]:
      - paragraph [ref=f76e38]: §01 · 问题陈述
      - heading "开放词表的「对齐」卡在全局计算上" [level=2] [ref=f76e39]
      - generic [ref=f76e41]: 文本注册 vs QbyE：论文站文本注册——① 体验：打字比对着设备念几遍自然；② 泛化：QbyE 只依赖声学特征，在环境变化与不同嗓音间弱，文本锚点天然不受说话人音色影响。但文本注册路线的已有方法都是非流式的：交叉注意力要整段音频与整个文本 token 序列做完整注意力运算（任何一帧的输出都要看到整段输入）；DSP 类动态规划要把整条隐编码序列拿到手才能全局切分。设备不可能为常驻唤醒词缓存并反复处理无限长的全局上下文。参数量也不友好：DSP 3.7M、Attention 约 420K。三个互相牵制的条件：文本注册 + 逐帧因果 + 小足迹算力——论文的答案是让 CTC 管逐帧对齐、嵌入管整词匹配，推理时以动态规划逐帧耦合（作者声明为首个推理时动态对齐音频与文本的流式 KWS）。
