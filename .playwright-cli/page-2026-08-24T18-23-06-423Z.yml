            - listitem [ref=f76e199]: 单次训练、单次评测：无方差与显著性——0.4 点量级差异（字符级 32.76 vs 纯 CTC 32.37）是否超出随机波动无从判断。
            - listitem [ref=f76e200]: 参数量口径：Table 1 标「估计值」，推理时文本编码器是否计入、注册是否只执行一次等未说清。
      - generic [ref=f76e201]: 值得追的方向：① token 单元从字符换音素 / BPE 子词——覆盖多语言与拼写变体，也是「粒度向上收益大」曲线的自然延伸；② 线性融合换可学习、可校准融合（按关键词长度归一化、温度缩放），补触发阈值与端点策略；③ 声学编码器吸收 KWS 社区高效架构（TC-ResNet / BC-ResNet）或大模型蒸馏，专攻 LPH 难负例的 6 点差距；④ 评测扩展到真实设备与真实注册文本，补 QbyE 及「文本+音频混合注册」对比——两个锚点很可能互补；⑤ 困难负例对抗式挖掘（按编辑距离主动构造易混短语）+ 多粒度联合训练（三级同时监督）。
