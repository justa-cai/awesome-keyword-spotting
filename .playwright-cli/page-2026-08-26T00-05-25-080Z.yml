    - generic [ref=f78e254]:
      - generic [ref=f78e255]: JUDGEMENT
      - paragraph [ref=f78e256]: ↳ 端到端的真正含义是消灭流水线债：本文的贡献不在某个组件多新，而在证明对齐、图搜索、预训练、后验平滑这四样「必需品」可以一起扔掉——系统简洁性本身是部署维度的性能。
      - paragraph [ref=f78e257]: ↳ 注意力是「可学习的时间边界」：KWS 的核心困难之一是关键词位置未知，注意力池化把这个先验缺失变成模型可以自己学的参数——这个视角后来贯穿整个端到端 KWS 系（Seq2Seq / MHA / 听觉注意力）。
      - paragraph [ref=f78e258]: ↳ 消融里藏着架构常识：CRNN > GRU > LSTM 说明卷积的短期时频特征提取是 RNN 给不了的——「卷积看局部、循环看长程」的互补自此成为 KWS 编码器的默认配方。
