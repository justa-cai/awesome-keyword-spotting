    - img [ref=f78e95]:
      - generic [ref=f78e97]: 机制解剖：注意力怎么把变长序列压成一个向量
      - generic [ref=f78e98]: 注意力池化
      - generic [ref=f78e124]: 编码器输出 h_t（底条）与注意力权重 α_t（柱）
      - generic [ref=f78e125]: 权重集中在关键词末尾——结尾声学特征最判别
      - generic [ref=f78e126]: c = Σ α_t · h_t：加权求和成单一向量
      - generic [ref=f78e127]: 公式与特征
      - generic [ref=f78e129]: α_t = softmax( v^T tanh(W h_t + b) )
      - generic [ref=f78e130]: c = Σ_t α_t · h_t → P(kw) = σ(W_c c + b)
      - generic [ref=f78e131]: 人话：每帧打一个「重要度」分，加权平均成一个
      - generic [ref=f78e132]: 向量再分类——时间边界让注意力自己学
      - generic [ref=f78e133]: PCEN 特征（替 log-mel）
      - generic [ref=f78e134]: (x / (ε+S)^α)^δ + β
      - generic [ref=f78e135]: · 自适应增益：不同音量动态调整
      - generic [ref=f78e136]: · α δ β 可微——跟着网络端到端训练
      - generic [ref=f78e137]: · 远场/噪声下动态范围控制更好
      - generic [ref=f78e138]: 解码：100 帧滑动窗口扫流式音频
      - generic [ref=f78e139]: 超阈值即触发（窗口 ~1s 延迟）
      - generic [ref=f78e140]: 左：注意力权重示意——模型自动聚焦关键词末段；右：注意力的打分-归一化-求和三步，以及 PCEN 的自适应归一化；解码用滑动窗口做流式触发
    - generic [ref=f78e141]: 图 2 · 左：注意力权重示意——权重集中在关键词末段（结尾声学特征最判别）；右：打分-归一化-求和三步公式与 PCEN；解码用 100 帧滑动窗口流式触发。
    - generic [ref=f78e142]:
      - generic [ref=f78e143]: α_t = softmax( v^T · tanh(W·h_t + b) ) c = Σ α_t · h_t P(kw) = σ(W_c·c + b)
      - generic [ref=f78e144]: 人话：给每一帧打个「这帧对判断有没有关键词多重要」的分数（softmax 归一化成权重），然后按权重把所有帧的向量平均成一个，再从这个向量算「有词的概率」。关键词在窗口里的位置，模型自己用权重找——不用人标边界。
