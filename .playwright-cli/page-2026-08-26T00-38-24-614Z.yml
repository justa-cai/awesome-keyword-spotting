  - generic [ref=f97e231]:
    - heading "5 判断：能带走的三句话" [level=2] [ref=f97e232]:
      - generic [ref=f97e233]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f97e234]:
      - generic [ref=f97e235]: JUDGEMENT
      - paragraph [ref=f97e236]: ↳ 「分工」常常优于「堆深」：对称加深一个大网络是把所有任务压给同一组参数——HNN 证明把「懂语音」和「懂这个词」拆开、中间用窄层传知识，小模型反而更准；资源受限时先问任务能不能分层，再问网络能不能加深。
      - paragraph [ref=f97e237]: ↳ 瓶颈特征是知识传递的最低成本形态：不需要软标签的额外前向、不需要联合训练的工程复杂度——一条几十维的拼接输入就把大数据的先验带进小任务；「能拼接的特征」是最容易落地的蒸馏。
      - paragraph [ref=f97e238]: ↳ 帧级分类少了「语法」这层先验：局部相似音骗过独立帧判断很容易，FST 的序列约束是廉价的结构化先验——端到端潮流里它并未消失，只是被 CTC/注意力内化进了训练目标。
