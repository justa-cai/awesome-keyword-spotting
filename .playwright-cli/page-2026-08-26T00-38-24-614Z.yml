      - generic [ref=f97e87]:
        - heading "FST 结构化约束" [level=3] [ref=f97e88]
        - text: 三音素序列强制正确顺序、状态自环给时长弹性、并行路径支持多唤醒词——帧级分类没有这层「语法」。
      - generic [ref=f97e89]:
