    - generic [ref=f97e82]:
      - generic [ref=f97e83]:
        - heading "瓶颈特征 = 轻量蒸馏" [level=3] [ref=f97e84]
        - text: 低层在多场景大数据学的声学知识，浓缩成几十维激活值传给高层——不需要参数共享、不需要联合训练。
