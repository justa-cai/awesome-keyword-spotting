      - paragraph [ref=f119e34]: §01 · 问题陈述
      - heading "典型 KWS 的两个假设被同时推翻" [level=2] [ref=f119e35]
      - generic [ref=f119e37]: 三条路线的失效：① 典型 KWS 轻量架构（DS-CNN 95.4%）——建立在「语音典型 + 数据充足」上，基线 FRR 高达 0.2725（漏唤醒正是构音障碍偏离典型分布的直接体现）；② 个性化 DSR 充分微调——注册量少易过拟合甚至训练崩溃（SIC-1 的 Model Crash 是实测不是理论担忧：类别不平衡 + 识别型损失直接崩）；③ 作者前作 PB-DSR（Interspeech 2024）——原型分类免大量微调适配新说话人，但面对的是命令词识别（CTC / 序列），KWS 的类别不平衡与无定义反类是结构性差异，经验不能直接搬。三个挑战：极少注册下为陌生构音障碍说话人建可靠 KWS（个性化又不过拟合）；不平衡 + 无定义反类下损失与增强怎么组合（需消融证据链）；分类方式（Model / PB-C / KNN-C）与损失的匹配关系（需系统回答）。
