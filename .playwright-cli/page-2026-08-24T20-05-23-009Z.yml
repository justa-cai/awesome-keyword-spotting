      - generic [ref=f119e24]:
        - heading "一分钟版本" [level=2] [ref=f119e25]
        - list [ref=f119e26]:
          - listitem [ref=f119e27]: 同一赛场不同打法（与冠军 PD-DWS 同题）：构音障碍（脑瘫 / ALS 等损害发音器官控制）+ 神经疾病常伴肢体瘫痪——语音是这一群体唯一的交互通道，KWS 是交互的「发起者」。核心困难：每人每词注册语音极少 + 非关键词类无词表定义 + 类别严重不平衡 + 发音个体差异极大。
          - listitem [ref=f119e28]: 架构哲学：系统的有效性完全取决于原型的代表性——原型 = 类内特征平均，分类 = 余弦最近原型（零可学参数）。整个系统把个性化代价压缩为「每类一个平均向量」，全部功夫花在特征提取器上：把 HuBERT 表征塑造成「按唤醒词内容聚类、按说话人差异不变」的空间。
          - listitem [ref=f119e29]: 三阶段课程（Figure 1）：SIC（典型控制语音微调——先学会任务本身）→ SID（多说话人构音障碍语音——学域共性，数据不含目标说话人）→ SDD（目标说话人自己的语音——最后一步收拢）。把「任务是什么 / 构音障碍长什么样 / 这个人长什么样」三件事拆开，前两件用大数据解决，最后一件才是小数据擅长的。
          - listitem [ref=f119e30]: 最有警示价值的发现：TTS 合成对 CTC 是救命药（崩溃→0.494）、对 CE 是毒药（0.276→0.313）——识别型损失受益于样本多样性、分类型损失对类内方差敏感；典型发音的合成数据混入构音障碍类拉大类内分布，CE 直接受害。数据增强的收益符号取决于损失的任务假设，两者必须联合消融。
          - listitem [ref=f119e31]: 损失-分类匹配规律：CTC+SCL 配 KNN-C 最优（SCL 直接塑造特征几何 → 单条样本已可判别，最近邻直接受益）；CE 配 PB-C 最优（CE 不塑特征 → 类内平均去噪）——推理方式应与训练损失的几何性质配套，孤立比较分类器会得出片面结论。
          - listitem [ref=f119e32]: 结果：Test-B 0.009801（FAR 0.004801 / FRR 0.005000，两端平衡）获亚军——基线的 1/13，FRR 从 0.1017 压到 0.0050（1/20）。反直觉细节：Dev4 上的最优模型（SID-3 走 CTC 路线 0.12507）与最终 Test 上的最优（CE 路线）不一致——只看 Table 1 选模型会选错方向。
