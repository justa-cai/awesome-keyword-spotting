      - paragraph [ref=f119e14]: "PB-LRDWWS: Prototype-Based System for the SLT 2024 Low-Resource Dysarthric Wake-Up Word Spotting Challenge（亚军）"
      - paragraph [ref=f119e15]: 作者：Shiyao Wang（王世垚）、Jiaming Zhou、Shiwan Zhao（赵世旺）、Yong Qin（秦勇）—— 南开大学
      - paragraph [ref=f119e16]: 发表：IEEE SLT 2024 · arXiv:2409.04799 · LRDWWS 挑战赛第二名
      - generic [ref=f119e17]:
        - generic [ref=f119e18]: 三阶段渐进微调 HuBERT
        - generic [ref=f119e19]: 原型分类 PB-C（零参数）
        - generic [ref=f119e20]: 第一帧原型
        - generic [ref=f119e21]: TTS×损失交互效应
