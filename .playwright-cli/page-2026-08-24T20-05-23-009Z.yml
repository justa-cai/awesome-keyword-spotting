            - listitem [ref=f119e213]: 推理成本与任务初衷矛盾：动机论述里 KWS 是省电发起者，骨干却是 HuBERT base 级 SSL——注册推理都要跑完整前向；参数量 / 延迟 / 功耗零报告，端侧可行性无从评估。
            - listitem [ref=f119e214]: 开集问题的闭集化：非关键词无词表定义，系统只当第十一类训练建原型——真实非关键词分布无限开放，一个平均原型能否守住反类边界无扰动实验检验，长期误唤醒鲁棒性存疑。
            - listitem [ref=f119e215]: TTS 与 CE 互斥堵死一条路：最有效的合成扩充无法用于最终胜出的 CE 路线——类别不平衡在主线上只能靠数据本身消化。
            - listitem [ref=f119e216]: 第一帧原型是纯经验技巧：无数字无解释——跨模型 / 跨语种 / 跨录音条件的可迁移性无保障。
            - listitem [ref=f119e217]: CTC 崩溃只被绕开未解决：根因停在现象层，梯度裁剪 / 类别加权 / 重采样等治本手段未探讨。
            - listitem [ref=f119e218]: 个性化仍需一次完整微调：每个新说话人都要 SDD 微调——离免训练即插即用有距离；撑住 SDD 的注册条数下界未报。
        - generic [ref=f119e219]:
          - heading "实验设计不足" [level=4] [ref=f119e220]
          - list [ref=f119e221]:
            - listitem [ref=f119e222]: 数据规模信息全缺：各集时长 / 句数 / 人数、TTS 量、Merge 总量均未报——复现与「低资源程度」判断双缺。
            - listitem [ref=f119e223]: 无同行横向对比：只比官方基线——第一名方法与得分、其他队伍路线均未报（注：本库同目录的 PD-DWS 即冠军方案，可对照阅读）。
            - listitem [ref=f119e224]: 统计强度不足：单次运行无方差——SID-1 0.15653 对 SID-2 0.15625 这种 0.0003 量级差异可能纯噪声。
            - listitem [ref=f119e225]: 超参敏感性未考察：SCL 温度固定 0.07 无扫描；第一帧 vs 完整特征无数值。
            - listitem [ref=f119e226]: 误差分析粒度粗：无按词 / 按严重程度 / 按说话人分层；Test-B 普遍低于 Test-A 无解释。
            - listitem [ref=f119e227]: 评测与真实条件脱节：受控录音无噪声非流式——未做噪声 / 远场 / 流式的外推压力测试，适用边界只覆盖挑战赛设定。
      - generic [ref=f119e228]: 值得追的方向：① 轻量化部署闭环——蒸馏 / 剪枝 / 量化把「原型 + 余弦」这条本来就轻的推理链落到端侧（SSL 表征 + 原型两件套恰是蒸馏理想形态：教师管特征、学生只需保住余弦几何）；② 构音障碍域内合成——用构音障碍语音训练的 TTS 或健康→构音障碍风格迁移，解除「TTS 有害于 CE」互斥，让合成增强与最优损失兼容；③ 开集反类建模——非关键词从「第十一类」改为 OOD / 异常检测（原型最大相似度设阈值拒判）更贴近真实误唤醒；④ 免微调 / 少样本适配——跳过阶段三的零微调上限 + 注册条数-性能曲线（明确「低资源」下界）；元学习 / adapter 注入压缩个性化成本；⑤ 损失几何联合设计——CE + SCL + 原型正则三项联合最优，或直接以「原型可分性」为目标的度量学习（把推理端匹配规律前移到训练端）；⑥ 噪声 / 远场 / 流式三轴压力测试 + 按病情分层报告。
