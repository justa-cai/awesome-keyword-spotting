    - heading "加 5K 参数，−5dB 噪声下多扛 5 个点： 瓶颈在条件嵌入的提取" [level=1] [ref=f201e5]: 加 5K 参数，−5dB 噪声下多扛 5 个点：瓶颈在条件嵌入的提取
    - generic [ref=f201e6]:
      - generic [ref=f201e7]: SLT 2022 · Kim 等
      - generic [ref=f201e8]: 韩国大学 × 德雷塞尔大学
      - generic [ref=f201e9]: CS-Conv + 动态注意力池化
      - generic [ref=f201e10]: KWS + SV 双任务验证
    - generic [ref=f201e11]: 实例级动态滤波器（IDF）按输入生成滤波器权重，而现有方法用全局平均池化提条件嵌入——把 T×F 的时频结构压成一个 F 维均值向量。换掉这一步，就换掉了动态滤波器的天花板。
    - generic [ref=f201e12]:
      - heading "一分钟版本" [level=3] [ref=f201e13]
      - list [ref=f201e14]:
        - listitem [ref=f201e15]: ▸ 问题：固定卷积核训练后参数不变——训练-测试域失配，未见噪声下性能骤降。IDF（实例级动态滤波器）按每个输入样本动态生成权重 θ = h(e)，e = g(x) 是条件嵌入，e 的质量决定 θ 的质量。
        - listitem [ref=f201e16]: ▸ 瓶颈：现有 IDF 用 GAP 提 e——时间维所有帧等权 1/T（分不清语音帧和纯噪声帧）；频率维每个 bin 独立压均值（丢掉共振峰位置和宽度这类相邻通道能量对比模式）。
        - listitem [ref=f201e17]: ▸ CS-Conv：借 Dual-Path RNN 的「分块 + 双路径」——时间切成 K 个不重叠块，块内 1D 深度可分离卷积捕局部动态（风扇周期调制、键盘脉冲），块间沿块索引卷积捕全局趋势（强度渐变、噪声切换）。
        - listitem [ref=f201e18]: ▸ DAP：轻量 1D 卷积给每帧打分 → softmax → 加权求和——语音帧权重自动升高、纯噪声相对均匀，「聚焦」而非「平均」。
        - listitem [ref=f201e19]: ▸ 主结果（KWS）：干净 +0.5 → 0dB +4.5 → −5dB +5.0——越吵越值钱；开销仅 5–10K 参数 / 1–2M FLOPs（<5%）。
        - listitem [ref=f201e20]: ▸ 跨任务（SV）：VoxCeleb1-E EER −0.5~1.0、1-H −1.0~1.5 个点——跨域场景时频建模优势更明显，证明改进是任务无关的。
        - listitem [ref=f201e21]: ▸ 消融：CS-Conv 单独 +1~2、DAP 单独 +1~2、组合 +3~5——组合大于各自之和，功能互补（一个提供更好的特征，一个选最关键的信息）。
        - listitem [ref=f201e22]: ▸ 块大小甜点：P=4–8（块内 40–80ms 恰好覆盖噪声短时模式）；P=2 太小、P=16 失去细粒度且块间只剩 2–3 块。
        - listitem [ref=f201e23]: ▸ 池化排序：DAP > 最大池化 > 均匀 GAP——最大池化突出峰值但丢分布信息。
        - listitem [ref=f201e24]: ▸ 边界：只改了「聚合」环节，生成网络 h(·) 没动——IDF 框架的表达上限还在；P 手动调；噪声增强 ≠ 真实远场（混响长尾衰减可能超过块内感受野）。
    - heading "§01 问题：GAP 把信息平均掉了" [level=2] [ref=f201e25]:
      - generic [ref=f201e26]: §01
      - text: 问题：GAP 把信息平均掉了
    - generic [ref=f201e27]: 动态滤波器的生成链路里，嵌入提取是最薄弱一环
    - paragraph [ref=f201e28]: 真实噪声在频谱分布（窄带电力线嗡嗡声到宽带空调气流）、时间模式（平稳风扇到间歇性键盘/人声）、强度（>20dB 到 <−5dB）三个维度上多样——训练阶段不可能枚举，模型必须泛化到未见噪声。IDF 框架给了这个潜力：按输入生成滤波器权重；但大多数实现用 GAP 把整个 T×F 时频图压成 F 维均值——数据增强是「反应式」的（只模拟已知噪声），而 GAP 的信息丢失让「主动适应」的原料先天不足。
    - generic [ref=f201e29]:
      - generic [ref=f201e30]:
        - heading "时间维：均匀权重稀释语音帧" [level=4] [ref=f201e31]
        - paragraph [ref=f201e32]: GAP 给所有帧 1/T 的相同权重——关键词语音帧和纯噪声帧的信息价值截然不同，噪声帧多的时候语音帧信息被大量稀释。
      - generic [ref=f201e33]:
        - heading "表达力与开销的张力" [level=4] [ref=f201e34]
        - paragraph [ref=f201e35]: 自注意力、双向 LSTM 能捕获更丰富的时频结构，但 O(T²) 的复杂度不适合资源受限的 KWS 部署——需要线性复杂度下保留结构信息的方案。
