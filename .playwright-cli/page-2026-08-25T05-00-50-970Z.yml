  - heading "§05 局限与边界" [level=2] [ref=f201e270]:
    - generic [ref=f201e271]: §05
    - text: 局限与边界
  - generic [ref=f201e272]: 改进范围与验证范围都有限
  - generic [ref=f201e273]:
    - generic [ref=f201e274]:
      - heading "只改了聚合环节" [level=4] [ref=f201e275]
      - paragraph [ref=f201e276]: 权重生成网络 h(·) 的架构和滤波器的应用方式（简单卷积滤波）都没动——性能仍受 IDF 框架表达能力上限约束：e 再精确，h 不够强生成的权重也白搭。
    - generic [ref=f201e277]:
      - heading "超参敏感 + 块边界断裂" [level=4] [ref=f201e278]
      - paragraph [ref=f201e279]: 块大小 P 需按时频分辨率手动调（25ms vs 10ms 帧长可能要不同 P），无自动机制；不重叠分块在边界产生信息断裂——跨块的渐变过渡（噪声到语音）被切进两个块。
    - generic [ref=f201e280]:
      - heading "噪声增强 ≠ 真实远场" [level=4] [ref=f201e281]
      - paragraph [ref=f201e282]: 叠加 MUSAN/DEMAND 与真实远场录音（混响、多说话人、设备自噪声复合退化）有差距——混响在时间维引入长尾指数衰减，可能超过块内路径 40–80ms 的感受野。
    - generic [ref=f201e283]:
      - heading "缺同期对比与延迟数据" [level=4] [ref=f201e284]
      - paragraph [ref=f201e285]: 未与 BC-ResNet/KWT/ConvMixer+ 同噪声条件同台对比——「动态滤波器 vs 架构改进」哪条路线更优无从判断；推理延迟未验证，额外计算是否成为部署瓶颈未知。
  - generic [ref=f201e286]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f201e287]
    - list [ref=f201e288]:
      - listitem [ref=f201e289]: ↳ 条件生成类模块（动态滤波/超网络）的质量上限卡在条件嵌入的提取——先检查「喂给生成器的信息」够不够，再考虑加大生成器。
      - listitem [ref=f201e290]: ↳ 简单池化（GAP）本身就是鲁棒性瓶颈：均匀平均会把少数关键帧的信息稀释掉——任何「从噪声输入聚合特征」的环节都值得换成选择性聚合。
      - listitem [ref=f201e291]: ↳ 分块 + 双路径是线性复杂度下保留时序结构的成熟范式，可从分离任务迁移到任何需要全局上下文但预算有限的模块。
      - listitem [ref=f201e292]: ↳ 组合效果大于组件之和 = 功能互补的证据（一个造特征、一个选信息）——消融时检查超加性，能判断两个组件是否在解决同一问题。
      - listitem [ref=f201e293]: ↳ 在两个任务上验证同一改进——是区分「通用环节改进」与「单任务 trick」的最省力方法。
