    - generic [ref=f232e4]: 论文精读 · 可视化版 · 2022 №29
    - heading "电视里的「Hey Alexa」不该唤醒你的音箱： 关键词系统学会认人" [level=1] [ref=f232e5]: 电视里的「Hey Alexa」不该唤醒你的音箱：关键词系统学会认人
    - generic [ref=f232e6]:
      - generic [ref=f232e7]: PK-MTL · Qualcomm AI Research
      - generic [ref=f232e8]: KWS+SV 硬参数共享 + 任务自适应打分
      - generic [ref=f232e9]: TB-KWS / TO-KWS 双任务
      - generic [ref=f232e10]: 四骨干验证 · GSC v1
    - generic [ref=f232e11]: C-KWS 只认词不认人——通用负样本（电视/会议/旁人对话）命中关键词就拖起整条 ASR 链路。多任务把说话人监督「白送」进网络（+4.8% 乘法），任务自适应打分把它兑现成近乎清零的误唤醒。
    - generic [ref=f232e12]:
      - heading "一分钟版本" [level=3] [ref=f232e13]
      - list [ref=f232e14]:
        - listitem [ref=f232e15]: ▸ 痛点：设备交互绝大多数来自注册的目标用户——模型理应偏置；误报不是「多亮一次灯」而是把整条 ASR 链路拖起来跑的功耗问题；电视常开的客厅里是可感知的续航损失。QbE 解决「换词」不解决「认人」；双模型拼装 +22% 计算且表征层无互通。
        - listitem [ref=f232e16]: ▸ 任务形式化：四象限输入分类（ts-tk / nts-tk / ts-ntk / nts-ntk）——模糊象限是 nts-tk（非目标用户说目标词）：TB-KWS 视为中性（偏置型产品）/ TO-KWS 划为负样本（独占型产品）——「个性化」从营销词变成可重复评测的协议。
        - listitem [ref=f232e17]: ▸ 骨架：硬参数共享——低层共享编码器（通用声学编码两任务共用），高层双子网分流（两任务目标「对抗」：关键词要说话人无关、说话人要内容无关，强行共享会互相拖累）。
        - listitem [ref=f232e18]: ▸ λ=0.1：关键词是主任务、说话人是辅助信息源——压低权重保证主任务不被带偏：C-KWS 精度 97.57%→97.68%（说话人监督白送进网络还微升了主任务）。
        - listitem [ref=f232e19]: ▸ 统一原型打分：关键词侧用「学到的原型」（余弦分类器权重——选余弦分类器是关键伏笔）、说话人侧用「注册嵌入」（一句注册语音）——训练/测试说话人不重叠的开集难题下两侧打分形式统一。
        - listitem [ref=f232e20]: ▸ 任务自适应两级：SCM（免训练线性组合，α 按目标 FAR 网格搜索校准——最优 α 依赖工作点所以用校准不是学习）→ TRM（可训练模块：2 维 SE 式注意力只多约 1.8k 参数；angular prototypical loss + 模仿四象限的批构造——任务语义直接写进表征学习）。
        - listitem [ref=f232e21]: ▸ 量级跳跃：TB FRR@1% 从 96.50%（Vanilla）到 6.56%（PK-MTL）——约 90 个百分点；TO EER 从 21.17% 到 3.37%——只学多任务不做任务自适应，实用工作点上几乎不可用。
        - listitem [ref=f232e22]: ▸ 现实场景近乎清零：对 WSJ/Librispeech 通用负样本的 FAR@FRR1% 从 46.61% 降到 5.58%（TB）/ 0.15%（TO）——通用负样本全部来自非目标说话人，正好落进 TO 训练过的拒绝面。
        - listitem [ref=f232e23]: ▸ 三级阶梯结论：推理端算术组合（SCM-M）< 按工作点校准（SCM-GS）< 表征端任务塑形（TRM）——「有没有任务自适应打分」远比「骨干强弱」重要。
        - listitem [ref=f232e24]: ▸ 边界：单句注册假设（噪声信道下嵌入方差可能吞掉收益）；GSC v1 孤立词近讲训练——跨信道/远场未检验；任务数线性扩张；只覆盖说话人维度（自定义词+认人叠加未触及）；无时延功耗实测。
    - heading "§01 问题：通用负样本的功耗黑洞" [level=2] [ref=f232e25]:
      - generic [ref=f232e26]: §01
      - text: 问题：通用负样本的功耗黑洞
    - generic [ref=f232e27]: 关键词分数对说话人身份零分辨力
    - paragraph [ref=f232e28]: C-KWS 的 ts-tk 和 nts-tk 在打分上被同等对待——BC-ResNet 直接放到 TO-KWS 任务上 EER 恶化到 21.17%：关键词分数只能判断「说的是不是这个词」，对说话人身份零分辨力，而 TO 把 nts-tk 划为负样本，关键词分数在这一象限内部完全失效。此前 KWS+SV 联合训练 [24][25] 的目标是「互相提升两个任务各自的性能」，没有人回答共享表征学出来之后如何针对「个性化检测」这个决策目标做适配。
    - generic [ref=f232e29]:
      - generic [ref=f232e30]:
        - heading "双模型拼装的账" [level=4] [ref=f232e31]
        - paragraph [ref=f232e32]: KWS + 独立 SV 模型（Vanilla +SV）在 BC-ResNet-3 上要 22.5M 乘法 / 82.4k 参数（vs 单模型 16.7M）——两个模型各自编码、表征层没有任何信息互通，说话人信息并没有「进入」关键词系统。
      - generic [ref=f232e33]:
        - heading "端侧预算约束" [level=4] [ref=f232e34]
        - paragraph [ref=f232e35]: always-on 模型本来就是为省电而生——任何个性化改造必须满足「参数和计算只允许轻微增加、C-KWS 性能不能掉」，否则是拿主任务的工程预算去赌个性化收益。
