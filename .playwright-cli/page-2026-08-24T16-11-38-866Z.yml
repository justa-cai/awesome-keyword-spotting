            - listitem [ref=f31e309]: 硬件验证是笔记本 CPU：i7-13620H（45W 级）而非 MCU/DSP；4.8MB 内存对典型 MCU（数百 KB SRAM）偏大——「资源受限可部署」需真机验证。
            - listitem [ref=f31e310]: 缺 KWS 部署指标：无误报/误拒、DET 曲线、流式时延——本质是 1 秒片段 12 类分类而非连续流开集检测。
            - listitem [ref=f31e311]: 无统计稳健性：单次运行点值，0.5–1 pp 的消融增益难与随机波动区分。
            - listitem [ref=f31e312]: 对比集缺 Transformer 基线：相关工作引了 AST/KWT 但表 2 未纳入；训练策略超参无敏感性消融。
            - listitem [ref=f31e313]: 小出入：OHEM 增益 0.57 vs 0.52；V1 测试略高于 V2 未解释。
