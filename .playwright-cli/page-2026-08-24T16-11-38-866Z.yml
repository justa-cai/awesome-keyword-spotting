      - generic [ref=f31e24]:
        - heading "一分钟版本" [level=2] [ref=f31e25]
        - list [ref=f31e26]:
          - listitem [ref=f31e27]: 靶子明确：轻量与噪声鲁棒必须同时成立。近场低噪下现有小模型够用，但远场加噪急剧退化——参数少结构简的模型遇到没见过的声学条件就脆弱。
          - listitem [ref=f31e28]: 核心洞察：噪声在时域（随机不规则）和频域（额外谱成分）呈现不同形态——时域动力学（音素时长、能量变化）与频域分布（共振峰、音色）应该分开建模。BC-ResNet 的串行残差让时间卷积吃已被频率卷积加工过的特征，互相踩踏、梯度耦合。
          - listitem [ref=f31e29]: DBBR 改造：双支并行（时间支 + 频率支对偶镜像），各自「压缩-门控-广播」后拼接融合——对 BC-ResNet-6 参数省 50%、MACs 省 33.6%，五个噪声条件全面领先（−5 dB +9.02 pp），噪声越重差距越大。
          - listitem [ref=f31e30]: 配套：TFCA 坐标注意力（沿时/频两轴独立建模注意力，只加 12.3K 参数）+ 课程学习五阶段（clean→0→−5→−10dB→加混响）+ 前 5 epoch OHEM。
          - listitem [ref=f31e31]: 结果：103K 参数在 GSC V2-12 远场全条件最优（Clean 92.17% / −10dB 71.93%）；跨数据集 V2→V1 泛化持平。诚实项：MACs 高于 ConvMixer；硬件验证停留在笔记本 CPU。
