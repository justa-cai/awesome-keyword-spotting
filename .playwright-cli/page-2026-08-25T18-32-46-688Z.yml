  - generic [ref=f321e79]:
    - generic [ref=f321e80]: "02"
    - heading "机制：SE 模块三步走" [level=2] [ref=f321e81]
    - paragraph [ref=f321e82]: SE（Squeeze-and-Excitation）回答的问题很朴素：特征图里几十上百个通道，真的一样重要吗？三步给出答案——先把每个通道压成一个统计量（谁在活跃），再用两层 FC 学出通道间的权重（谁配被放大），最后逐通道乘回去（安静的压低、活跃的放大）。
    - img [ref=f321e83]:
      - generic [ref=f321e85]: 机制解剖：SE 模块三步走 · 一个 Block 的完整数据流
      - generic [ref=f321e86]: SE 模块内部
      - generic [ref=f321e88]: 输入：C 个通道的特征图
      - generic [ref=f321e95]: ① Squeeze：每通道全局平均池化 → C 维通道描述符（谁在活跃）
      - generic [ref=f321e97]: z = GAP(x) ∈ R^C
      - generic [ref=f321e98]: ② Excitation：两层 FC 学通道间关系
      - generic [ref=f321e100]: "s = σ(W₂ · ReLU(W₁ · z)) W₁: C→C/r · W₂: C/r→C"
      - generic [ref=f321e101]: ③ Reweighting：权重逐通道乘回特征
      - generic [ref=f321e108]: 安静通道被压低 · 活跃通道被放大——模型学会「听谁的话」
      - generic [ref=f321e109]: Block 数据流与设计取舍
      - generic [ref=f321e111]: DS-ResNet-SE Block 的五步（左上流程条的展开）：
      - generic [ref=f321e112]: x → 1×1 扩展（可选）→ DSConv 空间特征
      - generic [ref=f321e113]: → SE 通道加权 → 1×1 投影 → ⊕ x（残差）
      - generic [ref=f321e114]: 为什么 SE 放在投影前：
      - generic [ref=f321e115]: · SE 作用在「丰富通道」上——扩展后通道多、
      - generic [ref=f321e116]: 区分度大，注意力才有对象
      - generic [ref=f321e117]: · 放投影后就只剩低维通道，权重的表达力浪费
      - generic [ref=f321e118]: 为什么残差和 SE 是互补的：
      - generic [ref=f321e119]: · 残差解决「能不能训深」——梯度通路问题
      - generic [ref=f321e120]: · SE 解决「深了之后通道冗余」——选择性问题
      - generic [ref=f321e121]: · 消融：只加残差精度涨一档，再叠 SE 再涨一档
      - generic [ref=f321e122]: 左：SE 三步——全局池化读统计量、瓶颈 FC 学权重、逐通道缩放；注意权重是 0–1 的软门控不是硬选择。右：Block 里 SE 的位置与「残差管训练、SE 管选择」的分工
    - generic [ref=f321e123]: 图 2 · 机制解剖：SE 模块内部三步 · Block 完整数据流与设计取舍
    - generic [ref=f321e124]:
      - generic [ref=f321e125]: "Squeeze: z = GAP(x) ∈ R^C ← 每通道一个数：它在多大程度上被激活 Excitation: s = σ(W₂ · ReLU(W₁ · z)) ← W₁: C→C/r, W₂: C/r→C（r=4 瓶颈） Reweight: x̃_c = s_c · x_c ← 0–1 软门控逐通道缩放"
      - generic [ref=f321e126]: 人话：Squeeze 是「点名」——看哪些通道在发言；Excitation 是「评权重」——按发言内容判断谁重要；Reweight 是「调音台」——重要的推子推上去，噪音推子拉下来。整个过程只花 1–2% 参数。
    - paragraph [ref=f321e127]: SE 在 Block 里的位置有讲究：放在 1×1 投影之前——扩展后通道丰富、区分度大，注意力才有对象；放投影后就只剩低维通道，权重的表达力被浪费。而残差与 SE 是互补关系：残差解决「能不能训深」（梯度通路），SE 解决「深了之后通道冗余」（选择性）——消融里两者各涨一档，不是替代品。
