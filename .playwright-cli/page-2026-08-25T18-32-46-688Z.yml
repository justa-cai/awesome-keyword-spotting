      - generic [ref=f321e17]: TL;DR
      - list [ref=f321e18]:
        - listitem [ref=f321e19]: ◆ 标准卷积 O(C_in·C_out·K²) 的复杂度让小模型没资格堆宽度堆深度；DSConv 砍掉 8–9 倍计算量，但只是换了算子，表达能力的下一档提升要从别处来。
        - listitem [ref=f321e20]: ◆ 本文的组合拳：DSConv 管省（预算内塞更多层）、残差管深（梯度走捷径、训练不退化）、SE 管准（学会哪些通道重要）。
        - listitem [ref=f321e21]: ◆ 消融显示三件套缺一不可：每加一个组件精度涨一档；SE 只加 1–2% 参数就换 0.5–1% 精度——小模型性价比之王。
        - listitem [ref=f321e22]: ◆ SE 权重可视化有层级分工：浅层关注频谱形状通道，深层关注抽象判别通道——注意力不是均匀先验，是自发学出的分工。
