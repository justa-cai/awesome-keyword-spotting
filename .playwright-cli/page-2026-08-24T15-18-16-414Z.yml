      - heading "混淆子集才分高下：LPH EER 6.13%" [level=2] [ref=f11e159]
      - generic [ref=f11e161]:
        - heading "设置与指标" [level=3] [ref=f11e162]
        - paragraph [ref=f11e163]: 训练语料三档：LS-100 / LS-460 / LS-GS-1460（LibriSpeech-460 + GigaSpeech Middle 1000h）。词对集按 LibriPhrase 构造（0.5–2s、锚点实例 ≥10），LP-100 约 12k 类 → LP-GP-1460 约 155k 类。评测：LibriPhrase Easy/Hard（Hard = 混淆词对子集，主战场）、Hey-Snips 测试集（2,529 正 / 20,543 负）评 zero-shot。编码器 6 层 Conformer，WeNet + CTC，音素词表 71 符号。
        - paragraph [ref=f11e164]: 指标分三组各有用途：P-WER（声学模型中间质量）、EER/AUC（LibriPhrase 惯例）、Recall@FAR（唤醒产品有明确误报预算——EER 操作点常落在产品无法接受的误报率上，固定 FAR 比召回才有工程意义）。
