      - generic [ref=f11e24]:
        - heading "一分钟版本" [level=2] [ref=f11e25]
        - list [ref=f11e26]:
          - listitem [ref=f11e27]: 需求源头：智能设备大规模铺开（论文原文点名 "XiaoZhi AI"），用户想现场注册自己的唤醒词——但模型上线时不可能预知注册什么词，只能靠 zero-shot，与预定义方案的 full-shot 训练存在系统性差距。
          - listitem [ref=f11e28]: 架构答案「宽进严出」：第一级 CTC 流式检索——候选边界来自声学对齐而非滑窗网格，配模糊音素聚合保召回（宁可多报）；第二级 QbyT 音素匹配器在音素级 + 句子级双粒度上验证，把误报压下去。
          - listitem [ref=f11e29]: 数据答案「双重扩展」：ASR 语料 460→1460 小时喂声学模型（LSother P-WER 18.79→11.80）；锚点词类别 12k→155k 喂匹配器（EER 13.38→10.65）——交叉消融证明两轴各自独立有效。
          - listitem [ref=f11e30]: 注册侧激进轻量化：文本注册只用一个 nn.Embedding 查表，替代 DistilBERT / G2P embedding 等重型预编码器——唤醒词只有几个音素，不需要深层语义编码。
          - listitem [ref=f11e31]: 结果：LibriPhrase-Hard EER 6.13%（PLCL-AT 的 1/5 参数量再降 2.34 pp）；Hey-Snips zero-shot 召回 99.13%@FAR=1，超过 full-shot 的 RIL-KWS。代价：全文无延迟/功耗数字，M2 模式 7.7M 参数的流式开销未知。
