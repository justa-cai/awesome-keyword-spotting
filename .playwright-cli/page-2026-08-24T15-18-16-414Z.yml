      - generic [ref=f11e319]:
        - generic [ref=f11e320]:
          - heading "方法的技术局限" [level=4] [ref=f11e321]
          - list [ref=f11e322]:
            - listitem [ref=f11e323]: 效率数字缺失：KWS 是常驻低功耗任务，但全文无推理延迟 / RTF / FLOPS / 内存；M2 参数是 M0 的两倍多且每个候选段重过编码器——候选密集时计算量会不会堆积，未报告。M1 vs M2 的取舍只能看精度看不了代价。
            - listitem [ref=f11e324]: 两级分数联合决策未交代：S1/S2 阈值怎么定、串联过滤还是分数融合——直接影响可复现性与误报调优空间。
            - listitem [ref=f11e325]: 模糊音素集合 F(x_t) 是黑盒：哪些音素对算模糊、手工还是数据驱动、会不会级联放大误报——第一级召回-精度交换的核心旋钮，缺了它式 4 无法独立复现。
            - listitem [ref=f11e326]: LPH 6.13% 绝对水平仍不算低：等错误率操作点约每十六次判决错一次；剩余错误有无系统性模式（长元音/鼻音韵尾/重音），无错误分析。
