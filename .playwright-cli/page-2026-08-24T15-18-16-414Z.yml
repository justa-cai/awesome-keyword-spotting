          - list [ref=f11e329]:
            - listitem [ref=f11e330]: 参数量标注矛盾：表 1 的 M2 标 4.1M 与表 4 的 7.7M 矛盾（笔误），横向对比应以 7.7M 为准。
            - listitem [ref=f11e331]: 消融档位不全：语料轴缺 GS-1000 单独档（无法区分收益来自绝对量还是 GigaSpeech 域多样性）；锚点轴 155k 之外无更大档（最后一步仅 -0.13 pp 已暗示饱和）。
            - listitem [ref=f11e332]: 训练细节未报告：优化器、学习率、轮数、词对正负采样比例——独立复现困难。
