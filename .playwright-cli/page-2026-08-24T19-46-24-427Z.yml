      - generic [ref=f112e24]:
        - heading "一分钟版本" [level=2] [ref=f112e25]
        - list [ref=f112e26]:
          - listitem [ref=f112e27]: 痛点的原理性：噪声种类无法穷举——离线用 17 种噪声增强，用户带进新会议室遇到的是无限空间的新样本；会议人声与唤醒词同为语音、时频高度重叠，通用增强学到的鲁棒性无法特化到具体环境（前作实测域偏移最多掉 27 点）。
          - listitem [ref=f112e28]: 三阶段生命周期：离线 NA-KWS 训练（17 噪声 + 干净，留出 1 种目标噪声只在部署后出现——对照公平：全部增益在强基线之上度量）→ 部署（DS-CNN 切两段：int8 冻结骨干 DORY 部署 + fp32 可学习层 PULP-TrainLib）→ 现场 ODDA（录环境噪声 → 与预录制带标话语叠加构造带噪样本 → 前向反传更新可学习层）。
          - listitem [ref=f112e29]: 关键设计：现场只录噪声不录话语——标签来自预存数据、分布差异来自现场录音，两件事解耦：用户零标注成本（「听一会儿环境」即可），同一段噪声叠不同干净话语 = 免费数据增强组合。
          - listitem [ref=f112e30]: 结果（0dB，比前作更苛刻）：会议噪声 12 类最高 +14.3 点（M：69.96→84.23）；洗衣等平稳噪声只 +1 左右（NA-KWS 已够）——语音噪声必须适应，平稳噪声不需要；适应后的小模型（23.7kB）反超 17 倍大的未适应模型（416.7kB）8 个点。
          - listitem [ref=f112e31]: 资源账本（自洽核验）：S + 只训 fc1 + 100 条 + 21 epoch + HPM = 10kB 读写内存 / 3MB 只读 / 14 秒 / 806mJ（2100 更新 × 6.74ms ≈ 14.2s ✓）——比前作 5.81J 降 7.2×。
          - listitem [ref=f112e32]: 笔记深判：域适应天然小样本友好——要适应的只有噪声分布一个变量（词分布不变），约每类 10 条就够掰回分类头；与从零学新词的 few-shot 完全不同，这是 3MB 能装下的根本原因。缺口：灾难性遗忘未评估（适应后在其余 17 种源噪声上的表现未报）；触发机制缺位。
    - generic [ref=f112e33]:
      - paragraph [ref=f112e34]: §01 · 问题陈述
      - heading "四重紧约束下的设备端域适应" [level=2] [ref=f112e35]
      - generic [ref=f112e37]: 路线盘点：① 前端方法（ANC / SE）——加常驻子模型加延迟，且完全不支持部署后微调（降噪器训练时定死）；② 后端方法（离线多噪声增强 = 本文基线）——天花板是「对所有噪声平均鲁棒」而非「对这个噪声特别在行」；③ ODL 框架（TinyOL / TTE / PULP-TrainLib）——提供训练基础设施但无 KWS 现场噪声的任务与流程设计；④ 前作（同团队 AICAS 2022）——能量 5.81J 太贵且未真机演示。四个子挑战：训练内存方程（梯度下降要求正在更新层的输入/激活/梯度同时驻留——全网络适应要 2.51MB > GAP9 的 1.5MB L2）；存储方程（完整训练集 1.1GB 不现实）；延迟/能量方程（Eq.1 随数据量与 epoch 线性放大）；工程落地（此前无超低功耗多核平台真机跑通 KWS ODDA——本文自述第一篇）。
