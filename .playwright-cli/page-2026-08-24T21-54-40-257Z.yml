      - generic [ref=f157e24]:
        - heading "一分钟版本" [level=2] [ref=f157e25]
        - list [ref=f157e26]:
          - listitem [ref=f157e27]: 深层问题：物理时间是混合信号硬件的内在变量。帧式深度模型把时间切成分帧靠缓存搬历史；流式神经形态硬件上信号到达的先后与间隔本身就是信息——如何用最少的神经元和最少的尖峰把时间结构编码出来（时间编码器设计）是资源受限 SNN KWS 的核心瓶颈。尖峰的产生与路由占 DYNAP-SE 动态功耗的主要部分。
          - listitem [ref=f157e28]: 已有手段与混合信号硬件不匹配 + 从未受控对比：缓冲（把流式问题拉回帧式，与事件驱动哲学相抵触）、专用延迟线（每毫秒延迟都要消耗物理单元，「实现代价高昂」）、精细调节时间常数（与器件失配的统计天性作对）——且各家研究用不同数据 / 特征 / 读出，性能差异无法归因到编码机制本身；TDE 与 E-I 这两类都宣称面向低功耗硬件的元件从未在同等条件下正面比较过。
          - listitem [ref=f157e29]: 受控对比范式（最大方法论贡献）：同一批共振峰尖峰输入 → 并联三套分支（180 个 TDE / 174+156 个两层 E-I）→ 同一族 ℓ2 正则 logistic 回归 + 尖峰计数读出（「最弱读出」策略隔离编码器质量；旁路累积读出保证层间公平增量比较）——唯一变量是中间的编码层。d_max=3 横向约束防跨共振峰轨迹伪触发；6 份复本平衡两侧搜索空间。
          - listitem [ref=f157e30]: 两种机制都免延迟线：TDE 用乘性增益门控——易化突触产指数衰减增益，触发突触的响应 ∝ exp(−Δt/τ_fac)，时间差被编码进尖峰串的数量与峰间隔，纯模拟电路即可；E-I 用双突触差分——抑制幅度大但衰减快 → 双相波形合成 ~2ms「被延迟的兴奋」（现象学模仿抑制后反弹），用两个现成突触电路换掉一条延迟线。
          - listitem [ref=f157e31]: 把器件失配当朋友：数字电路消除失配（加大晶体管 / 校准），本文反转为利用失配——E-I 层主动把突触参数散布拉到 σ=50%（teili 默认 20%），让 174 个同构神经元自发成为各异的时空特征检测器。
          - listitem [ref=f157e32]: 正结果：两类编码器都把训练集 444 条样本提升到 100% 线性可分（共振峰直接分类只有 79–96%）。
          - listitem [ref=f157e33]: 负结果（核心发现）：测试集上单神经元、按置换重要性挑的 10 神经元子集，TDE / E-I 对共振峰通道子集均无明显优势；加第二层 E-I 也无系统改善（否定「堆深度累积时间常数」假设）。三元组「训练可分性↑ · 置换重要性↑（头部神经元是共振峰的 3–4 倍——信息提取确实发生了）· 测试精度→」把矛头指向参数同质化导致的过拟合，而非编码机制本身失效。
          - listitem [ref=f157e34]: 尖峰经济学：精度打平的前提下 TDE 每语音比其他神经元多发约 100 个尖峰——事件驱动硬件按事件计费，这是精度之外的硬约束选型依据。
          - listitem [ref=f157e35]: 边界：没有学习只有设定（数百维参数空间手工 / 网格搜索不可扩展）；读出端只统计尖峰计数，TDE 精心保住的时序信息被压平；前端只留 4 个共振峰（辅音瞬态 / 能量包络已丢弃，上限被前端锁死）；TIDIGITS 数字词 ~444 条的小规模结论外推要打折扣；功耗论断停留在代理指标（无 DYNAP-SE 实测）。
    - generic [ref=f157e36]:
      - paragraph [ref=f157e37]: §01 · 问题陈述
      - heading "把「时间编码器选型」从各家自说自话拉到可归因框架" [level=2] [ref=f157e38]
      - generic [ref=f157e40]: KWS 的核心指标是「每焦耳撑住多少小时监听」：完整 ASR 识别上万词算力巨大，KWS 只需识别少数特定词——业界把它当「唤醒开关」，超低功耗常驻监听、命中后才唤醒重资源系统。传统 MCU/DSP 上即使模型压到几十 K 参数，帧式计算仍是时钟驱动的持续功耗；神经形态处理器（Loihi / DYNAP 类）提供存内计算 + 大规模并行 + 事件驱动的物理基础——没有事件近似零功耗，恰好对齐常驻监听。
      - generic [ref=f157e41]: 干净的实验问题：完全相同输入、完全相同读出下——TDE 层和 E-I 层能否把关键词类别的线性可分性提升到超越原始共振峰通道？能否泛化到留出测试说话人？每种编码器的尖峰活动开销多少？若训练有效而测试无效，缺失的环节（参数异质性、学习方法）在哪里？
