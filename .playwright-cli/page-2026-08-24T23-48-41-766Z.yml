      - paragraph [ref=f186e14]: Joint Framework of Curriculum Learning and Knowledge Distillation for Noise-robust and Small-footprint Keyword Spotting
      - paragraph [ref=f186e15]: 作者：Jae-Bong Lim、Yunju Baek —— 釜山国立大学（韩国）
      - paragraph [ref=f186e16]: 发表：IEEE Access（2023-01）· GSC v2 + 四个未见噪声集 · 单麦克风 · 27.3k 学生
      - generic [ref=f186e17]:
        - generic [ref=f186e18]: 单麦克风 MCU 部署
        - generic [ref=f186e19]: 比例渐增课程（非传统课程）
        - generic [ref=f186e20]: 加权阶段集成蒸馏
        - generic [ref=f186e21]: 课程快照 = 免费分工教师池
