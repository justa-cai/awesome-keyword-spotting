        - generic [ref=f186e23]: 课程对大网络才有效（实证）
      - generic [ref=f186e24]:
        - heading "一分钟版本" [level=2] [ref=f186e25]
        - list [ref=f186e26]:
          - listitem [ref=f186e27]: 硬件处境：可穿戴 / IoT 设备只搭载低功耗 MCU（flash 数百 KB、RAM 数十 KB），设备太小布置不了多麦克风——智能音箱阵营「四核处理器 + 多麦换精度」的路线（Yu 等六麦 5.1M 参数）在这些设备上一概不成立。单麦、无降噪前端、模型必须小、噪声又必然存在——SNR 低于 0dB 表示噪声功率已超过语音、−10dB 表示是语音十倍。
          - listitem [ref=f186e28]: 两条线从未真正交汇：噪声混合训练路线有容量瓶颈（微型网络学不好强噪声）；课程学习路线对大网络有效对小网络基本无效（Table III：27k 网络加传统课程干净端反而从 95.7 掉到 91.7）；鲁棒方法不满足 footprint（ImportantAug 24M 参数 −12.5dB 只有 56.5%）；压缩方法（蒸馏 / 量化 / 剪枝）全不考虑噪声鲁棒。
          - listitem [ref=f186e29]: 核心发现（图 4）：先对大教师做课程学习、再蒸馏出小学生，优于把课程直接作用在小学生身上——平均精度 +8 点、尺寸平均缩 4 倍。逻辑链：噪声鲁棒性是从数据中提炼的性质，提炼需要容量；部署端不需要提炼过程只需要提炼结果，蒸馏恰好是搬运性质的管道——容量需求与部署约束被拆到两阶段分别满足。
          - listitem [ref=f186e30]: 阶段一：反传统的比例渐增课程：传统课程（ConvMixer）从干净语音起步逐步加宽响度范围；本文从第一阶段就混合训练，逐阶段收窄主范围（[-15,50] → [-15,10] → [-15,5] → [-15,0] → [-15,-5] dB——下界钉死 −15、收上界），提高强噪声占比；采样范围恒 [-15,50] + ρ=0.9 主范围采样保持探索。代价：干净端故意比随机混合低 0.5 点（97.4 vs 97.9）换强噪声端 +2.3 点（79.7 vs 77.4）。
          - listitem [ref=f186e31]: 阶段二：加权阶段集成蒸馏（联合的精髓）：课程每阶段免费产出一个快照——M=5 次训练 × N=5 阶段 = 25 个分工快照（不是随机种子的参数抖动，是训练分布系统性偏移造成的能力分工）。调度：样本 SNR 落在第 n 阶段主范围则激活该阶段快照（α=1/β=0 硬切换）——干净样本由早期快照（弱噪声专家）教学、强噪声样本由包含后期快照的更大集合教学；嵌套范围意味着 −12dB 样本激活全部 25 个。这避免了无差别平均的「弱噪声专家与强噪声专家对同一样本各执一词」软标签冲突。
          - listitem [ref=f186e32]: 结果（27k 学生、全部未见噪声）：MUSAN −12.5dB 78.6% vs ImportantAug（100k）56.5%（+22.1 点）、vs 课程直训小网 70.7%（+7.9 点）；QUT −12.5dB 64.1 vs 28.0（+36.1 点）；Urban8K / WHAM 0dB 档 vs PKD（102k）：89.2 vs 82.3 / 91.1 vs 79.4——参数约 1/4 强噪声端反超；−15dB 极端条件下四噪声集仍稳定领先 9–11 点。
          - listitem [ref=f186e33]: 消融最有信息量的三层读法（Table III）：① 传统课程对大网络也无增益（−12.5dB 77.4% = 随机混合）——不只小网络问题；② 本文课程只在大网络上兑现强噪声收益（83.9/79.7）；③ 小网络即使用本文课程也只有 70.7%——容量瓶颈是结构性的，课程治不了，必须靠蒸馏搬运。蒸馏消融（Table IV）：课程与蒸馏乘性叠加（课程同时抬高教师 80.1→82.1 与学生 76.1→78.7）。
          - listitem [ref=f186e34]: 代价：训练成本转嫁（M=5 次 4000 epoch 课程 + 4000 epoch 蒸馏、25 快照 7.5M 教师侧）；蒸馏在强噪声端仍损 3.4 点（78.6 vs 教师 82.0，logit 级无特征对齐）；权重调度依赖合成样本的已知 SNR（训练期天然成立但无法迁移到 SNR 不可知场景）；27k 仍是浮点模型（无量化 / RAM / 延迟 / 功耗——参数量只是部署约束的代理变量）。
    - generic [ref=f186e35]:
      - paragraph [ref=f186e36]: §01 · 问题陈述
      - heading "容量与约束的错位，三个子问题纠缠" [level=2] [ref=f186e37]
      - generic [ref=f186e39]: 三个纠缠的子问题：课程学习需要足够容量消化强噪声样本，部署端恰恰没有容量（错位）；即便大网络学到鲁棒性，如何无损迁移到小网络（普通单教师蒸馏在强噪声端损失明显）；集成蒸馏提高教师质量但简单平均易冲突、独立训练多教师成本高。答案是把三个子问题串成两阶段流水线，每个模块的弱点被另一个模块的长处补掉——课程产出的阶段快照恰好是蒸馏按噪声强度分工的集成素材（这是「联合」而非「串联」的关键）。
