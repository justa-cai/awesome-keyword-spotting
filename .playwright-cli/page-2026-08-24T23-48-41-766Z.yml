            - listitem [ref=f186e259]: 权重调度依赖合成样本的已知 SNR：训练期天然成立（按目标 SNR 合成）但无法迁移到 SNR 不可知场景；α/β 硬切换 + 嵌套范围导致强噪声样本激活 25 个教师、干净样本只 5 个——教师数量随噪声强度不均衡变化对收敛的影响未讨论。
