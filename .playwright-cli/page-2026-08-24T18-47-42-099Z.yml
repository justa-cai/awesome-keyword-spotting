      - paragraph [ref=f88e14]: Efficient Real-Time Smart Keyword Spotting Using Spectrogram-Based Hybrid CNN-LSTM for Edge System（SpectroNet）
      - paragraph [ref=f88e15]: 作者：Infall Syafalni、Clarence Amadeus 等 4 人 —— 万隆理工学院（ITB）× IMEC
