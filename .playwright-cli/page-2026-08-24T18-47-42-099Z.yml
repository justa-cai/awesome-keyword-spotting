          - list [ref=f88e216]:
            - listitem [ref=f88e217]: 摘要-正文数字大面积冲突（精读必警）：180ms vs 61ms、操作减少 59.35%/59.63% vs 52.57%/53.97%、提速 45%/62% vs 10%/14.75%、精度损失 2.68%/4.84% vs 0.33%——疑为团队 2023 MWSCAS 会议版残留，零解释。
            - listitem [ref=f88e218]: 多处内部不一致：参数 142,877 vs 89,241；收敛 epoch 正文 27 vs 表 30；Hamming vs Hanning 窗；TF 版本两说；稠密块 3 个 vs 2 个；Table 7 的 OS 字段填了 CPU 型号——作者版未经充分编辑。
            - listitem [ref=f88e219]: 基线偏旧非 SOTA：最新对照是 2019 年的 DSCNN / C1G2BiLSTM；无 MatchboxNet / BC-ResNet；10 类协议与文献 35 类不可比。
            - listitem [ref=f88e220]: 真人测试太小：100 次发音、说话人数与环境未描述、无显著性；噪声鲁棒性零评测（论文未来工作里自己承认）。
            - listitem [ref=f88e221]: 缺工程指标：FLOPs / 体积 / 内存 / 功耗全无——而能效恰是选型动机；「少 28.57% 延迟」「少约 70% 参数」等结论百分比与表格对不上。
      - generic [ref=f88e222]: 值得追的方向：① 补组件级消融（去 LSTM / 离线特征替换内嵌层 / 稠密块数扫描 / 1×2 换 2×2），把混合架构的必要性从主张变成证据；② INT8 量化——论文自己引用了 INT8 有 1318% 吞吐提升的数据却只做到 FP16；③ 梅尔层拆出 TensorRT 引擎或改写为可转换算子，释放被锁的 ~47% 操作；④ 加 unknown/silence 类与误唤醒 / 拒识指标，向真实 KWS 协议靠拢；⑤ 远场 / 噪声 / 多说话人真人测试 + 实测功耗，把「边缘实时」补成完整能效数据；⑥ 流式窗口与端点检测——从定窗分类升级为常开监听；⑦ 论文自指的 FPGA / IC 移植（IMEC 团队背景，专用硬件加速是明确下一步）。
