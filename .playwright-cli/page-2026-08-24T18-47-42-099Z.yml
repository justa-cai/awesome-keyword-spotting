      - generic [ref=f88e24]:
        - heading "一分钟版本" [level=2] [ref=f88e25]
        - list [ref=f88e26]:
          - listitem [ref=f88e27]: 定位：工程集成型论文——不在单项技术上求高度，而是把「模型设计-数据-硬件选型-推理优化-真机验证」整条链路在一篇里走通并给出全链路数字，适合作为边缘 KWS 部署流程参考样板。
          - listitem [ref=f88e28]: 架构（SpectroNet）：梅尔频谱图做成网络内自定义层（直接吃 16000 点原始波形，消灭独立特征提取流程）→ DenseNet 空间特征 + 单向LSTM 时序建模。最值得注意的结构细节：卷积和池化几乎只在频率轴上做——两个过渡层都是 1×2 池化，时间维 59 帧一路保持到 LSTM——时序职责整个让渡给 LSTM，职责切分而非能力堆叠。
          - listitem [ref=f88e29]: 结果：GSC v2 十词闭集（38,546 条）89,241 参数拿到 93.33% 测试精度 / 61ms 真机推理——五模型横评里「精度第二、参数第二少、速度第二快」的平衡位；验证集 95.21% 五者最高、过拟合 2.84% 第二低。
          - listitem [ref=f88e30]: TensorRT 账本：FP32 引擎 54.9ms（提速 10%）、FP16 52.0ms（14.75%），精度只掉 0.33%；但操作转换率只有 ~53%——自定义梅尔层把近一半计算锁在优化器门外，提速远低于文献 FP16 动辄数倍的预期（笔记推断的权衡，论文未分析）；FP16 引擎构建时间还多 66%。
          - listitem [ref=f88e31]: 闭环：USB 麦克风采真人语音 → Jetson 推理 → GPIO LED 指示 10 词分类结果，100 次真人发音验证、PC 与 Jetson 精度零损失（部署一致性本身当指标）。
          - listitem [ref=f88e32]: 成色警告（必读）：摘要与正文数字大面积冲突（180ms vs 61ms、45%/62% vs 10%/14.75% 提速、2.68%/4.84% vs 0.33% 精度损失——疑为 2023 会议版残留，论文零解释）；参数量两处不一致（142,877 vs 89,241）；Hamming/Hanning 窗自相矛盾——引用任何数字前先交叉核对正文表格。
    - generic [ref=f88e33]:
      - paragraph [ref=f88e34]: §01 · 问题陈述
      - heading "云端路线的延迟 / 隐私 / 扩展性三宗罪；边缘路线的工程闭环没人走完" [level=2] [ref=f88e35]
      - generic [ref=f88e37]: 五个角度的缺口：① 单一架构能力缺陷——纯 CNN 只学空间结构要堆深度、纯 RNN 学不到局部信息，辅音瞬态与共振峰轨迹的局部形状 + 跨时间上下文需要两种能力；② 已有混合架构帕累托不佳——CTC 法 12.21M/98%（自定义集）、混合 CNN-RNN 229K/97.15%、DenseNet-BiLSTM 223K/97.3%、门控卷积 RNN 154.53K/只有 90.6%——小模型掉精度、精度高的不够小；③ 特征提取与模型割裂——离线算频谱图、存文件、再喂网络，「低效、耗时、耗资源」（原话），实时系统还要维护两套软件组件；④ 缺真机真人验证——大量工作只测数据集准确率，「模型精度-部署性能」的鸿沟没填平；⑤ 优化空间没用足——文献显示 TensorRT FP16 吞吐提升可达 746%、INT8 达 1318%；而 TensorRT 比 TFLite 快但多耗 ~40% 能量——框架选择本身就是精度-能耗-速度三角，需实测。
