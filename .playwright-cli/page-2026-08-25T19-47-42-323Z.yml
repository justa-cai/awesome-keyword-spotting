    - generic [ref=f7e131]: 图 2 · 机制解剖：CE 等权 vs 端到端聚焦 · argmax 软化为路径概率和
    - generic [ref=f7e132]:
      - generic [ref=f7e133]: "Viterbi: score = max_path P(x, path | HMM) ← argmax 不可微, 梯度断 前向-后向: score = Σ_path P(x, path | HMM) ← softmax 式软化, 可微 检测分: score = log P(x | 关键词HMM) − log P(x | 填充HMM) ← 对数似然比 损失: 正样本(IOU高) 拉高 score · 负样本(IOU低) 压低 score + 边际"
      - generic [ref=f7e134]: 人话：Viterbi 只看最好的一条路（挑最大，没法反传）；换成「所有路径按概率加权」后每条路都有话语权，梯度能顺着权重流回声学模型。训练样本用「窗口和真词的重叠率」定好坏——正是部署时滑动窗口扫过音频的真实几何。
    - paragraph [ref=f7e135]: softmax 软化离散选择是贯穿全年的工具：#10 SmoothMax 用它软化帧聚合的 max，本文用它软化路径选择的 argmax——「把不可微的决策换成可微的加权」这个手法在 2020 年的 KWS 文献里反复出现，值得收进工具箱。
