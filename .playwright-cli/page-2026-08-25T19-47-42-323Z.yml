        - generic [ref=f7e206]: "1"
        - paragraph [ref=f7e207]: 「小模型更受益」有清晰的因果链。容量大时 CE 能把所有状态都建模好，错位的代价被容量掩盖；容量小时「该省的地方省」的价值凸显——这正是边缘端小模型的处境，也是本文对端侧部署最 relevant 的结论。
      - generic [ref=f7e208]:
        - generic [ref=f7e209]: "2"
        - paragraph [ref=f7e210]: −70% 的量级要放在产品语境读。FRR 直接对应「说了唤醒词没反应」的用户体验——降 70% 意味着大量真实用户的第一句话被听见了；而代价是零推理开销，纯训练期投资。
      - generic [ref=f7e211]:
        - generic [ref=f7e212]: "3"
        - paragraph [ref=f7e213]: IOU 采样是训练-部署分布对齐的范例。部署时滑动窗口以任意偏移扫过音频，训练窗口的好坏用与真词的重叠度定义——训练见过的窗口分布与部署一致，模型不会在「半个词」的窗口上手足无措。
