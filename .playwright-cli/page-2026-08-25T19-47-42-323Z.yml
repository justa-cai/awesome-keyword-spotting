  - generic [ref=f7e13]:
    - generic [ref=f7e14]: "01"
    - heading "问题：损失函数和评估指标说两种语言" [level=2] [ref=f7e15]
    - generic [ref=f7e16]:
      - generic [ref=f7e17]: TL;DR
      - list [ref=f7e18]:
        - listitem [ref=f7e19]: ◆ DNN-HMM KWS 的结构性矛盾：声学模型用帧级交叉熵独立训练，部署却用 Viterbi 解码的检测分评估——优化的不是最终要的那个数。
        - listitem [ref=f7e20]: ◆ CE 要求每帧预测所有音素状态，无关状态与关键判别状态平分容量——小模型最疼：容量本就不够，还被浪费在无关状态上。
        - listitem [ref=f7e21]: ◆ 解法一：可微分 HMM 解码器——Viterbi 的 argmax 换成前向-后向的路径概率和，检测分（关键词 vs 填充模型的对数似然比）直接当损失，梯度穿到 DNN。
        - listitem [ref=f7e22]: ◆ 解法二：IOU 窗口采样——训练窗口按与真实词边界的时间交并比分正负，模拟流式滑动窗口的部署几何。收益零推理开销、只要起止标注、自动聚焦关键状态。
