  - generic [ref=f7e80]:
    - generic [ref=f7e81]: "02"
    - heading "机制：把「偏科」变成设计目标" [level=2] [ref=f7e82]
    - paragraph [ref=f7e83]: 端到端训练改变了模型对状态的态度：CE 训练的 DNN 对所有音素状态一视同仁地准；端到端训练的 DNN 在关键判别状态上更准、在无关状态上可能更差——混淆矩阵分析直接验证了这一点。「偏科」不是副作用而是设计目标：容量有限时，正确的策略就是把资源押在检测决策真正依赖的地方。
