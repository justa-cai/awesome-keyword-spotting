    - generic [ref=f7e260]: "05"
    - heading "可迁移的判断" [level=2] [ref=f7e261]
    - generic [ref=f7e262]:
      - generic [ref=f7e263]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f7e264]: ① 损失与指标之间每多一层「翻译」，就丢一分优化精度。
      - generic [ref=f7e265]: ↳ 代理损失（帧级 CE）是历史包袱不是必然——当终端指标（检测分、AUC、FRR）可以被软化成可微形式时，直接优化它；「先练基本功再实战」的传统管线在小模型上尤其吃亏。
      - paragraph [ref=f7e266]: ② 小模型的正确姿势是「小而准」不是「小而全」。
      - generic [ref=f7e267]: ↳ 容量有限时全面平庸不如重点突出——让训练目标自动决定容量流向（哪里关键学哪里），比人工设计「均匀强」的小模型更符合部署真实需求。
      - paragraph [ref=f7e268]: ③ softmax 软化是把梯度送过决策边界的万能钥匙。
      - generic [ref=f7e269]: ↳ max → SoftMax（#10）、argmax → 路径概率和（本文）、硬 VAD → 软 VAD（#15）——离散选择挡住梯度时，把它换成加权连续版几乎总是第一步；代价是软化后的目标与原目标有偏差，要靠温度/容差控制。
    - paragraph [ref=f7e270]: 系列坐标：「直接优化终端指标」谱系的 2020 节点——2018 年 Max Pooling Loss 把 max 池化放进损失（早期形态），本文给 DNN-HMM 架构补上端到端闭环，2021 年 AUC 优化把终端指标直接换成排序损失——三条线共享同一个哲学：Optimize what matters, not what's convenient。
