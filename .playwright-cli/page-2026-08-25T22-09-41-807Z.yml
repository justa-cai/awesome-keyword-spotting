  - generic [ref=f47e12]: "四川大学（罗瑞森 等）· arXiv 1907.04536（2019.07） 问题：单层输出范式丢弃中间层的多粒度信息 · 方法：从网络不同深度（含浅层 CNN 与 LSTM 层）收集表示 {h₁..h_L}，softmax 注意力 α_l 按输入加权聚合 h_agg = Σ α_l·h_l 一句话：不同词、不同声学条件下最有用的层不同——输入依赖的自适应加权让模型自己选耳朵，GSC V2 上超单层与仅深层基线。"
  - generic [ref=f47e13]:
    - generic [ref=f47e14]: "01"
    - heading "问题：单层输出范式的三宗罪" [level=2] [ref=f47e15]
    - generic [ref=f47e16]:
      - generic [ref=f47e17]: TL;DR
      - list [ref=f47e18]:
        - listitem [ref=f47e19]: ◆ 标准 KWS 只用网络最后一层的特征做分类——中间层的多粒度信息被直接丢弃：浅层抓低级声学细节（频谱边缘、局部时频模式），深层抓高级语义（音素、音节模式），KWS 两种都要。
        - listitem [ref=f47e20]: ◆ 三宗罪：层粒度不同（浅层判别信息被丢）、中间层常更好（单层覆盖不了两端）、固定选择不灵（不同词/不同声学条件下最有用的层不同）。
        - listitem [ref=f47e21]: "◆ 多层注意力的解法：从不同深度收集 {h₁..h_L}，softmax 注意力按输入加权——噪声环境自动偏向浅层鲁棒特征，干净环境偏向深层语义；端到端训练无需手选。"
        - listitem [ref=f47e22]: ◆ 权重可视化给出机制证据：层贡献不均等且互补——特定词在某些层权重更高，反映了它依赖那一层的特征类型。
