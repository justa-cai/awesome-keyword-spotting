    - generic [ref=f328e280]: "05"
    - heading "可迁移的判断" [level=2] [ref=f328e281]
    - generic [ref=f328e282]:
      - generic [ref=f328e283]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f328e284]: ① 新类别要「即时加入」时，训嵌入空间，别训分类头。
      - generic [ref=f328e285]: ↳ 分类头每加一类都要重训；嵌入空间里新类只是一个新中心——加词从「工程变更」变成「运行时操作」。投资应该全部花在嵌入质量上，分类器只是免费的几何规则。
      - paragraph [ref=f328e286]: ② 情景训练的本质：用任务随机性逼出「方法」而非「答案」。
      - generic [ref=f328e287]: ↳ 每个 episode 换一批类，模型记住任何具体词都没有用——只能学会「怎么聚类」。任何需要「学会学习」的场景（增量类目、动态词表）都可以套这个训练范式。
      - paragraph [ref=f328e288]: ③ 均值是简单但对小支持集出奇稳健的估计器。
      - generic [ref=f328e289]: ↳ 单样本的个性在均值里互相抵消——5-shot 的显著提升基本免费；但它对「系统性偏差」（所有样本都带同一种噪声）无能为力，支持集的多样性比数量更值得设计。
    - paragraph [ref=f328e290]: 系列坐标：本文（2020）是 ProtoNet 进 KWS 的首探——从零训练嵌入；2021 年 XLSR 少样本工作把嵌入换成预训练 wav2vec 特征（「别人学好的地图」直接用，样本更省）；2021 年三元组度量学习是换损失函数的兄弟路线；2026 年 EdgeSpot 延续到端侧高效落地——小样本 KWS 的谱系主线始终是「嵌入空间质量 × 支持集质量」。
