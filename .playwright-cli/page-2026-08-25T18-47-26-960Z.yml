  - generic [ref=f328e83]:
    - generic [ref=f328e84]: "02"
    - heading "机制：分类变成「离哪个中心近」" [level=2] [ref=f328e85]
    - paragraph [ref=f328e86]: 原型网络把分类问题换了个问法：不学「这段音频是哪个词」的分类头，而是学一个把音频压成向量的嵌入函数——训练目标是让同类样本在嵌入空间里互相靠近、异类远离。之后任何新词，只需把它的几条支持样本嵌入求均值，得到一个「类原型」，查询样本按距离就近归类。
    - img [ref=f328e87]:
      - generic [ref=f328e89]: 机制解剖：嵌入空间长什么样 · 一个 episode 怎么跑
      - generic [ref=f328e90]: 嵌入空间（示意）
      - generic [ref=f328e101]: "yes"
      - generic [ref=f328e110]: "no"
      - generic [ref=f328e119]: stop
      - generic [ref=f328e121]: 查询样本
      - generic [ref=f328e123]: 最近 → 判为 yes
      - generic [ref=f328e125]: 三角 = 类原型（支持集均值）· 同类样本围绕原型聚集
      - generic [ref=f328e126]: 分类 = 找最近原型——嵌入空间的质量决定一切
      - generic [ref=f328e127]: 一个 episode 的解剖
      - generic [ref=f328e129]: 以 5-way 5-shot 为例：
      - generic [ref=f328e130]: ① 从训练词表随机抽 5 个类
      - generic [ref=f328e131]: ② 每类抽 5 条 → 支持集（25 条）
      - generic [ref=f328e132]: 算 5 个原型 c₁..c₅
      - generic [ref=f328e133]: ③ 每类再抽若干条 → 查询集
      - generic [ref=f328e134]: ④ 查询嵌入到各原型的距离 → softmax →
      - generic [ref=f328e135]: 交叉熵损失 → 更新嵌入网络 f_φ
      - generic [ref=f328e136]: 为什么这样能学到「如何学习」：
      - generic [ref=f328e137]: 每个 episode 都是一个不同的 5 词小任务，
      - generic [ref=f328e138]: 几十万个 episode 下来，f_φ 被逼成
      - generic [ref=f328e139]: 「把任何词的样本压到各自中心附近」的通用
      - generic [ref=f328e140]: 压缩器——新词只是又一个没见过的中心
      - generic [ref=f328e141]: 左：嵌入空间里同类聚拢、异类分开，原型（三角）是类中心，查询点就近归类。右：情景训练用随机小任务轰炸嵌入网络——学的不是具体词，而是「任意词的聚类几何」
    - generic [ref=f328e142]: 图 2 · 机制解剖：嵌入空间的聚类几何 · 一个 episode 的完整解剖
    - generic [ref=f328e143]:
      - generic [ref=f328e144]: "嵌入: f_φ: X → R^d （CNN 骨干, Mel 输入） 原型: c_k = (1/|S_k|) Σ f_φ(x_i) （支持集均值） 分类: p(y=k|x) = softmax(−‖f_φ(x) − c_k‖) （欧氏距离就近）"
      - generic [ref=f328e145]: 人话：嵌入函数是「把声音变成地图上的点」的规则；一个词的几条样本取平均，就是这个词在地图上的「根据地」；来了新音频，看它离谁的根据地最近就判给谁。训练时用几万个随机小任务反复轰炸，逼这个「地图规则」对任何词都成立。
    - paragraph [ref=f328e146]: 情景训练的巧妙之处在于任务随机性：每个 episode 都是一个不同的 N 词组合，模型无法记住「具体哪几个词」——只能学到「任何词的样本该怎样聚到各自中心」的通用几何。这就是它对未见类别有泛化能力的原因：新词只是又一个没见过的中心，而「聚拢-分开」的规则早已练熟。
