    - generic [ref=f328e16]:
      - generic [ref=f328e17]: TL;DR
      - list [ref=f328e18]:
        - listitem [ref=f328e19]: ◆ 传统 KWS 每个词要几千上万条样本——快速定制（用户想「现在说三遍马上用」）、低资源语言、niche 关键词（品牌名/术语）三个场景都做不到。
        - listitem [ref=f328e20]: ◆ 原型网络的解法：学一个通用嵌入空间，同词样本聚拢、异词分开；新类只是「支持集嵌入的均值」这个新中心。
        - listitem [ref=f328e21]: ◆ 情景训练是灵魂：每个 episode 随机抽 N 个类、每类 K 条样本模拟一次小任务——模型被迫学会「如何学习」而不是记住具体词。
        - listitem [ref=f328e22]: ◆ 两个关键发现：支持样本的多样性与代表性直接决定原型质量；嵌入维度不是越大越好（维度灾难在 1-shot 下最明显）。
