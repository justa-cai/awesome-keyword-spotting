      - generic [ref=f328e224]:
        - generic [ref=f328e225]: "1"
        - paragraph [ref=f328e226]: 5-shot 的提升来自均值效应。单条样本带着说话人/语速/录音条件的个性；5 条取平均后个性互相抵消，原型更接近「这个词本身」——这是均值原型对坏样本的天然缓冲，也是它比最近邻稳的结构原因。
      - generic [ref=f328e227]:
        - generic [ref=f328e228]: "2"
        - paragraph [ref=f328e229]: 对未见类别的泛化是元学习的直接证据。测试用的词训练时从未出现，模型却能聚类分类——说明学到的确实是「任务无关的嵌入几何」，不是词表记忆。
      - generic [ref=f328e230]:
        - generic [ref=f328e231]: "3"
        - paragraph [ref=f328e232]: 维度灾难在小样本下最疼。维度升高、距离逐渐集中（所有点离得差不多远），区分度反而下降——1-shot 时单样本原型本就粗糙，高维再补一刀。维数是权衡而非单目标。
