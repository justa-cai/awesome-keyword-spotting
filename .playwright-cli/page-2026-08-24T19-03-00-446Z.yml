          - list [ref=f95e195]:
            - listitem [ref=f95e196]: 缺流式误报指标：逐条比对评测，而生产 KWS 最痛的是连续数小时音频的每小时误触发——DET 的 FAR 按条计，与流式误报不同量纲；「原生流式」声明无对应实验。
            - listitem [ref=f95e197]: 无运行时开销：只有体积；延迟 / 实时率 / 内存峰值 / 功耗全无。
