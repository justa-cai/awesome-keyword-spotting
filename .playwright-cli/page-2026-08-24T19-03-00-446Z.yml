      - generic [ref=f95e24]:
        - heading "一分钟版本" [level=2] [ref=f95e25]
        - list [ref=f95e26]:
          - listitem [ref=f95e27]: 需求张力：用户想自己定唤醒词——开放词表、零重训。主流思路把「分类」改成「度量比较」：注册嵌入 vs 流式窗口嵌入的余弦过阈值。硬墙：嵌入质量最好的 7.5GB ASR 编码器不可能端侧常驻，而 KWS 是全时后台任务。
          - listitem [ref=f95e28]: 三类既有方案各有死穴：ASR 编码器（7.5GB 只能留在服务器）；语音分类编码器（1.4MB 端侧友好但训练目标错位——分类损失优化词表内类间分离而非「同短语语音靠近」，实测聚合 AUC 6.44% 全场最差）；三元组损失（每 batch 只一个锚 + 一正一负——训练信号稀疏、单锚高方差、收敛不稳）。
          - listitem [ref=f95e29]: 方案（GE2E-KWS）：把说话人确认的 GE2E 损失迁到 KWS——每个 batch 8 个短语 × 各 10 条语音（强制不同说话人/风格，防止学成音色匹配），奇数条做注册取质心、偶数条做测试，质心与全部正负测试嵌入做 log-sum-exp 余弦对比——训练时就在排练服役的「注册 + 验证」两阶段，且一个 batch 的全部对比算成一次矩阵运算。
          - listitem [ref=f95e30]: 结果：量化后 419KB 的 Conformer 聚合 AUC 0.504%——反超 7.5GB ASR 编码器（0.66%，相对 +23.6%）、碾压同尺寸三元组（1.283%，相对 +60.7%），还少训 2 个 epoch；四个训练时未见词（no/go/on/up）表现一致——真零样本。
          - listitem [ref=f95e31]: 尺寸菜单（Table 2）：LSTM 甜点 1.2MB（AUC 0.344，容量红利在 530 万条语音处耗尽）；同 419KB 档加噪 EER：Conformer 9.69% 对 LSTM 12.71%——卷积分量能从局部上下文检测噪声，端侧小模型选型应偏向 Conformer。
          - listitem [ref=f95e32]: 成色缺口：注册固定 10 条（用户只肯说 1-3 遍的衰减未测）；TTS 文本注册只有声明无实验；评测是逐条比对、缺「每小时误触发」流式指标；无延迟 / 内存 / 功耗。
    - generic [ref=f95e33]:
      - paragraph [ref=f95e34]: §01 · 问题陈述
      - heading "419KB 打赢 7.5GB：任务对齐换体积效率" [level=2] [ref=f95e35]
      - generic [ref=f95e37]: 三个耦合的难题：① 训练目标与服役流程对齐——训练中就模拟「注册 + 验证」，矩阵运算保效率、多语音质心降方差；② 精度与体积的极限权衡——8 比特量化后亚 MB（419KB）、原生流式（Lingvo 自动流式转换）、零重训，且匹配精度还要反超 7.5GB；③ 可信评测基准——直接度量「注册嵌入 vs 测试语音」的匹配质量（而非分类准确率），覆盖干净 + 加噪、覆盖训练未见词。评测空白的具体例证：三元组先行工作用 1992 年的 WSJ；one-shot 工作只在 TTS 合成集 + 4 关键词小集上报单阈值指标。
