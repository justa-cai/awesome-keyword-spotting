            - listitem [ref=f95e199]: 基线数据不对等：ASR / 分类编码器各用原生数据（分类编码器 2 亿条 YouTube），只有三元组 vs GE2E 受控。
            - listitem [ref=f95e200]: 噪声单一：只有 3-15dB 3 路 MTR，无混响 / 远场 / 多说话人重叠。
      - generic [ref=f95e201]: 值得追的方向：① 注册效率——1/3/5/10 条注册的衰减曲线 + 少样本质心正则 / 虚拟质心扩增 + 按词阈值校准（吸收词长 / 音节结构的分数分布差异）；② TTS 文本注册纳入同一协议，量化合成-真实间隙，探索 TTS 域自适应或音频-文本联合嵌入（与双模态路线合流）；③ 更强度量损失对照（温度 InfoNCE / 角度间隔）+ 利用 MSWC 多语做跨语零样本；④ 流式评测扩展——数小时连续音频的每小时误触发与检出延迟，加混响远场；⑤ 真实端侧硬件的延迟 / 内存 / 功耗画像，把体积菜单升级为部署菜单；⑥ 大模型蒸馏——ASR 编码器在 bed/up 等词上的边际优势说明还有上限可挖，用它做教师灌进 419KB。
