      - heading "用户只肯说 1-3 遍注册；「原生流式」缺流式误报证据" [level=2] [ref=f95e182]
      - generic [ref=f95e184]:
        - generic [ref=f95e185]:
          - heading "方法局限" [level=4] [ref=f95e186]
          - list [ref=f95e187]:
            - listitem [ref=f95e188]: 注册依赖性未探索：协议固定 10 条注册取质心；真实用户只肯 1-3 遍——质心方差显著上升，注册条数的敏感性曲线未报告（评测走向产品前必补）。
            - listitem [ref=f95e189]: TTS 文本注册只有声明无实验：合成-真实嵌入域间隙对匹配精度的影响未量化——恰是「打字指定唤醒词」这一最顺滑交互的可行性关键。
            - listitem [ref=f95e190]: 词级短语假设：训练评测都是单词；多词短语、变长、短语内停顿未涉及，质心比对对时长失配的鲁棒性未知。
            - listitem [ref=f95e191]: 损失较朴素：无温度 / 可学习缩放（原 GE2E 有）；未与 InfoNCE / prototypical / ArcFace 类对比——60.7% 是对三元组的提升，不代表度量学习上限。
            - listitem [ref=f95e192]: 单一语言评测：MSWC 多语但评测只在英语。
