        - heading "词无关音素格（HMM-DNN）" [level=3] [ref=f103e87]
        - text: 用覆盖全部音素的通用 LM 解码生成音素格——多路径即竞争空间；关键词稀疏时词格会退化，音素格保住假设密度。
      - generic [ref=f103e88]:
        - heading "blank 主导路径（CTC）" [level=3] [ref=f103e89]
        - text: 全 blank 路径 = 「不含关键词」的天然代理——训练推高目标序列与 blank 路径的概率比。
      - generic [ref=f103e90]:
        - heading "sMBR 准则" [level=3] [ref=f103e91]
        - text: 直接优化状态级期望正确率（γ_ref 来自强制对齐）——比 MMI 更稳定，LVCSR 已验证。
      - generic [ref=f103e92]:
        - heading "通用 LM 的关键性" [level=3] [ref=f103e93]
        - text: 解码生成格时 LM 不能偏向关键词——竞争假设要「真实」，全用关键词 LM 会让分母失真。
