      - text: 问题：帧级训练的序列盲区
    - generic [ref=f103e16]:
      - generic [ref=f103e17]: TL;DR
      - list [ref=f103e18]:
        - listitem [ref=f103e19]: ◆ KWS 本质是序列决策（这段音频含不含该音素序列），帧级 CE 却把每帧当独立分类——会出「中间一两帧误判成关键词音素」的孤立错误。
        - listitem [ref=f103e20]: ◆ LVCSR 里 CE → sMBR/MMI 常拿 10-20% 相对 WER 降低——这套成熟技术在 KWS 领域几乎没被系统引入。
        - listitem [ref=f103e21]: ◆ 直接照抄不行：LVCSR 的竞争假设是所有词序列（词格），KWS 只区分「含词/不含词」——竞争假设要重建。
