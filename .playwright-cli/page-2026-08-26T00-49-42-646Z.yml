      - generic [ref=f103e149]: "F_sMBR = Σ_r Σ_s γ_ref(s) · log P(s | x) CTC-SDT: ↑ P(h_kw | x) / P(all paths | x)"
      - generic [ref=f103e150]: 人话：帧级训练只问「这一帧像不像某个音素」；序列训练问「整段音频里，正确答案的概率要压过所有容易混淆的错误答案」。错误答案从哪来？HMM-DNN 用解码生成的音素格（各种听岔的音素串），CTC 用「全空白」当不含词的代表。分子放正确答案，分母放所有竞争者，训练就是把这个比值推大。
