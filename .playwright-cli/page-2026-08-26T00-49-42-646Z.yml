    - generic [ref=f103e227]:
      - generic [ref=f103e228]: JUDGEMENT
      - paragraph [ref=f103e229]: ↳ 训练技术的迁移是「不改架构的白赚」：同一网络换个损失就四象限全部提升——工程上比架构创新便宜得多；看到一个领域成熟的技术在相邻领域缺席，先问「是没用过，还是用不了」，前者就是机会。
      - paragraph [ref=f103e230]: ↳ 序列训练的心脏是竞争假设的构造：分子（目标）是现成的，难点全在分母——竞争者要「真实且足够难」，太弱学不到东西（全 blank），太偏（关键词 LM）会让比值失真；迁移任何判别训练，先设计好负样本空间。
      - paragraph [ref=f103e231]: ↳ 任务范式不同，方法论可以统一：固定词汇与无限制 KWS 表面是两个任务，但「目标序列 vs 竞争空间」的比值结构同构——找到不变量，一个框架就能吃下两个领域。
