    - generic [ref=f112e247]:
      - generic [ref=f112e248]: JUDGEMENT
      - paragraph [ref=f112e249]: ↳ 当任务规模超出架构的设计点，性能是断崖不是斜坡：res8 在 200 类命令上 QER 29.4%——不是调参能救的错位，而是「二分类唤醒词架构」对「多命令语义分类」的任务失配；识别任务的真实规模比模型大小更早决定架构选择。
      - paragraph [ref=f112e250]: ↳ 流式 = 因果性 + 恒定复杂度，两者都来自架构而非工程技巧：因果卷积、单向循环、历史平滑特征——每一层都尊重时间方向，「任意长音频流下内存恒定」才成立；双向结构再准也不能上流式前线。
      - paragraph [ref=f112e251]: ↳ 「中间方案」是产品需求驱动的架构空间：KWS 和 ASR 之间不是二选一——当产品要求「数百命令 + 机顶盒预算」时，中间方案就是这个约束的最优解；读架构论文先看它的部署约束，很多「奇怪设计」都是约束的合理映射。
