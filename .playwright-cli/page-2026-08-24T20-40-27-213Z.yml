      - heading "Eval 全远场：收益要在声学最差的地方验收" [level=2] [ref=f129e135]
      - generic [ref=f129e137]: 数据集：第一届 MISP 挑战赛 2021 AVWWS——检测远场家庭场景的唤醒词「Xiao T, Xiao T」。公开库约 125 小时：训练集 47K+ 负样本 / 5K+ 正样本（正负约 1:9，加权 BCE 负:正 = 1:5 直接回应不平衡），Dev 2K+ 负 / 600+ 正；Eval 8K+ 样本只有远场数据、不公开标注（作者从组委会拿到标注保证公平比较）——模型必须在声学条件最差的模态组合上接受检验。多模态属性完整：音频含单通道近场 / 2 通道中场 / 6 通道远场，视频含单人中场与多人远场。 预处理的工程密度：音频侧 RIR 仿真把近场人工造成中 / 远场 + 官方噪声（SNR −15~15dB 随机）+ MVDR 波束增强数据进训练集（对齐 Eval 分布）；视觉侧 RetinaFace + ArcFace 在多人远场视频里锁定目标说话人再裁唇区。
