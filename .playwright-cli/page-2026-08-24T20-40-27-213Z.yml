      - generic [ref=f129e254]:
        - generic [ref=f129e255]:
          - generic [ref=f129e256]: "1"
          - text: FLCMA 模块：把多模态融合从句级加法 / 拼接推进到帧级跨模态注意力——「这一帧信谁」成为可学习、可逐帧变化的决策。灵感是把多通道领域的 CLCCA / MFCCA 的「通道」推广成「模态」：多麦克风要逐帧判断哪个通道可信，音视频同样要逐帧判断哪个模态可信，数学结构同构。
        - generic [ref=f129e257]:
          - generic [ref=f129e258]: "2"
          - text: 端到端系统 + 参数组织更经济：单一多模态编码器（参数模态间共享）替代晚融合的两套单模态编码器，卷积融合 + 注意力池化 + 加权 BCE 全链路联合训练，摆脱「冻结融合」「多模型投票」——而且 AUC 反而更高，联合训练抢回了建模能力。
        - generic [ref=f129e259]:
          - generic [ref=f129e260]: "3"
          - text: 单模态预训练迁移 + 反直觉实证：三步迁移（训单模态 → 初始化 → lr 缩 10 倍联合微调）在多模态正样本稀缺时显著抬高起点；并证明「预训练起点不必是最优单模态系统」——价值不在教师强度而在优化起点。三者叠加 Eval 4.57% 刷新当时最优。
        - generic [ref=f129e261]:
          - generic [ref=f129e262]: ★
          - text: 可迁移判断：当两个信息通道在帧级高度同步（发音动作的两个投影），融合粒度必须下沉到帧级才能吃到互补性；粒度不够细时，融合算子的可学习性（注意力 / 卷积栈）比「再训一个更强的单模态」更值得投入。
