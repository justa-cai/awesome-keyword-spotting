      - generic [ref=f129e24]:
        - heading "一分钟版本" [level=2] [ref=f129e25]
        - list [ref=f129e26]:
          - listitem [ref=f129e27]: 痛点是三重叠加：远场家庭场景里，说话人距离拉大带来 SNR 下降 + 混响，电视 / 对话造成语音重叠，唤醒词本身只有 2.56 秒四个音节——任何一段被噪声淹没的音节都可能漏检误检。纯音频路线（领域感知训练 / 生成样本扩充 / MVDR 波束形成）的天花板是同一个：声学通道本身就是被污染的信息源。
          - listitem [ref=f129e28]: 已有音视频 WWS 的三类不足：①「先分后合」——先各训两个鲁棒单模态模型再冻结融合，「谁在什么时候更可信」从未被联合优化；② 融合算子粗糙——加法 / 拼接对每个维度、每帧一视同仁，隐含假设「两模态所有帧贡献均匀」，而真实情况是噪声突发、唇部遮挡偶发；③ 多模态正样本只有 5K+ 条，却大多从零训练，浪费单模态预训练的强初始化。
          - listitem [ref=f129e29]: 核心模块 FLCMA：把多通道语音领域的「通道级跨通道注意力 CLCCA」推广成「模态级」——给特征扩一个模态维（M=2），注意力作用域锁在帧内模态轴上：音频帧在同一帧唇动里查补充信息，唇动帧在同一帧声学里消歧（很多音素口型相近=同视素）。单模态全局（MHSA）、单模态局部（CONV）、跨模态逐帧（FLCMA）三个正交组件装进同一个 Conformer 块，堆 6 层。
          - listitem [ref=f129e30]: 对齐是帧级注意力的前提：音频 256 帧 FBank 经子采样 ×1/4 = 64 帧，视频 64 帧 25fps——两个 2.56 秒在物理时间上严格对齐，FLCMA 才有「同一帧」可谈。
          - listitem [ref=f129e31]: 端到端 + 卷积融合：全链路无冻结、无单模态投票兜底；编码器输出当通道维 M=2 的「图像」，5×5 卷积 4→2→1 逐级压缩——可学习的融合器，减少直接相加 / 拼接造成的「污染」。
          - listitem [ref=f129e32]: 结果：Eval 集（全部远场）WWS 4.57% 刷新当时最优——官方基线 25.1%、MISP 2021 第一名 5.8%、Zhang et al. 5.74%；与 Zhang 交叉：Dev 上对方更好（3.62 vs 3.86）、Eval 上本文明显反超——收益恰恰在声学条件最恶劣处兑现。
          - listitem [ref=f129e33]: 两条有信息量的发现：① FLCMA 用单一多模态编码器替代晚融合的两套单模态编码器，AUC 反高 +0.097 / +0.125——参数在模态间共享不但不干扰，联合训练还形成更好表征；② 用于预训练的单模态模型本身并非最优（A-Conformer 11.33% vs 最强 9.78%），但迁移后依然 5.50→4.57——预训练的价值不在「教师有多强」，而在「起点有多稳」。
    - generic [ref=f129e34]:
      - paragraph [ref=f129e35]: §01 · 问题陈述
      - heading "声学通道被污染时，唇动是完全正交的通道" [level=2] [ref=f129e36]
      - generic [ref=f129e38]: 远场退化的三重叠加：唤醒词检测是智能音箱、手机、可穿戴设备的核心入口，近场干净语音下 CNN / Transformer 已很好——但换到远场家庭场景：① 说话人与设备距离拉大 → SNR 下降 + 混响；② 电视、对话等背景声源 → 语音重叠；③ 唤醒词极短（「Xiao T, Xiao T」约 2.56 秒四个音节）→ 判别信息密度有限。纯音频路线的原理性上限：领域感知训练、生成样本扩充、MVDR 波束形成都只利用声学通道，而波束形成只能缓解不能消除混响与重叠。视觉唇动提供正交互补：电视再吵、语音再重叠，嘴唇开合轨迹依然清晰——这正是 AVSR、音视频分离 / 说话人确认纷纷引入视觉模态的共同动机，也是 MISP 2021 之后 AVWWS 细分方向的由来。
      - generic [ref=f129e39]: 已有工作的三类不足： ① 「先分后合」两阶段范式（Cheng / Zhang / Wang et al.）：先各训两个鲁棒单模态模型，融合阶段参数冻结，融合模块只能被动接受两个互不适应的表征；Xu et al. 虽端到端训练了音视频 Transformer，最终仍靠单模态模型投票——端到端收益被投票环节打折。 ② 融合算子过于粗糙：X_fused = [X_spec ‖ X_lip]·W_fc 或 X_spec + X_lip——静态线性组合对每个维度、每帧一视同仁，无法表达逐帧的模态间相关性（噪声突发、遮挡偶发，同一句里有的帧音频可靠、有的帧只有唇形能救场）。 ③ 训练数据利用不充分：多模态正样本仅 5K+，而已有工作多从零训练，没利用单模态数据 / 预训练的强初始化。
      - generic [ref=f129e40]: 三个层层递进的挑战：如何在帧级建模音频-唇动模态间相关性（物理依据：唇动与语音在几十毫秒尺度高度同步）；如何让两模态参数在同一目标下端到端联合优化，摆脱「冻结融合」与「多模型投票」；如何在多模态正样本有限时借单模态预训练抬高起点。验收硬指标：远场 MISP Eval 集刷新当时最优 WWS 分数。
