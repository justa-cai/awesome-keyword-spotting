        - generic [ref=f129e124]: 式 1 · FLCMA：T=64 帧、M=2 模态、D=256、h=4 头（每头 64 维）。关键在形状——注意力矩阵作用在 (T, M) 轴上且被限制在帧内（同名「帧级」的由来）：每个时间帧上音频嵌入与视觉嵌入互相做一次缩放点积注意力；跨时间的长程依赖交给同块的 MHSA。价值是双向的：为带噪语音补唇动信息，同时依据语音降低唇动的音素混淆（同视素）。
      - generic [ref=f129e125]: 为什么要帧级粒度（两方面）：信息论上，唇动与语音是同一发音动作的两个投影，帧级高度同步——整段平均 / 拼接等于先把帧级对应关系稀释掉再指望网络找回来；实验上，Fig. 4 的注意力回滚显示高权重集中在 0.25 / 1.0 / 1.5 / 2.3 秒附近——恰好是「Xiao T, Xiao T」四个音节的可辨识位置，判别信息本来就稀疏分布在少数关键时刻，帧级机制让模型把计算和信任精确分配到这些时刻。Fig. 5 的 FLCMA 内部注意力图显示同一模态在不同帧拿到不同权重，一模态失置信时从另一模态拉信息补强——这是静态加法 / 拼接结构上做不到的自适应行为。
