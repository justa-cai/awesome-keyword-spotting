      - generic [ref=f97e25]:
        - heading "一分钟版本" [level=2] [ref=f97e26]
        - list [ref=f97e27]:
          - listitem [ref=f97e28]: 自相矛盾的现状：很多 SNN-KWS 前面挂着 FFT / MFCC 手工前端——前端本身就是计算密集操作，「用 SNN 换能效」省下的电又被前端吃回去。要贯彻到输入端就得直接吃原始波形端到端卷积。
          - listitem [ref=f97e29]: 端到端卷积的两难（Fig. 1）：普通 Conv1d 参数随感受野增长；空洞卷积 stride=1（WaveSense 路线）相邻窗口大量重叠、序列压不短；stride≠1 感受野指数增长但采样出空洞、局部信息丢失——当时没有卷积能同时解决两样。
          - listitem [ref=f97e30]: 方案（GLSC）：双支分工——D-Conv1d 支（stride≠1）抓全局依赖 + 逐层压缩序列长度；Conv1d 支（小核密集采样）守局部细节；两支各自过 BN 后相加发生在膜电位层面，融合之后才做阈值判决。
          - listitem [ref=f97e31]: 核心洞察：ANN 里双支直接相加是线性混合——显著特征被动态范围淹没（Fig. 3「特征消失」）；而脉冲神经元携带 t−1 时刻衰减残留的膜电位：跨时间步累积给特征「第二累加轴」（被稀释的成分后续步继续累积）+ 阈值门控让无关特征连累积资格都没有——融合防消失的任务交给神经元动力学，不用注意力（Branchformer 靠注意力兜底，代价更大）。
          - listitem [ref=f97e32]: 结果：4×GLSC + 2×Bottleneck-PLIF，GSC V1 12 类 70.1K 参数 / 93.0%（比残差 SNN 省 19% 参数反超 0.8 点）；V2 35 类 80.2K / 92.9%（对比组最高精度 + 最小参数）；全网平均发放率 8.3%（T=8），式(8) 能耗 ≈ 同结构 ANN 的 1%。
          - listitem [ref=f97e33]: 成色缺口：能耗是理论估算非芯片实测；Table 1 全是 SNN 内部对比——没有 ANN 基线，「换能效付出多少精度代价」无法从论文评估；消融只有曲线无数值表无方差；GLSC 超参（核宽 / 通道 / stride）只在结构图里。
    - generic [ref=f97e34]:
      - paragraph [ref=f97e35]: §01 · 问题陈述
      - heading "选了 SNN ≠ 省了电：前端、卷积、神经元三处都会漏电" [level=2] [ref=f97e36]
      - generic [ref=f97e38]: 硬件依据：累加（AC）远比乘加（MAC）省能——一次 MAC 的能耗约为一次 AC 的 71 倍（Horowitz ISSCC 2014）——SNN 以二值脉冲传递、事件驱动，计算主体是 AC。四层失效机制：① 手工前端（FFT/MFCC）计算密集，违背 SNN 初衷；② 端到端卷积两难（Fig. 1）；③ 已有端到端 SNN 用无衰减的 IF 神经元——发放频繁，每个多余脉冲触发下游一整排突触计算，事件驱动优势被频繁发放吃掉；④ ANN 的全局-局部融合经验（Branchformer）依赖注意力，直接相加则特征消失（Fig. 3）。SNN 侧已有模型偏重：ST-Attention-SNN 2170K、SRNN+ALIF 222.1K、Speech2Spikes 410K。四条挑战：逐层压长度不丢局部；融合不消失；神经元自带衰减压发放；百 K 参数以下保九成三精度。
