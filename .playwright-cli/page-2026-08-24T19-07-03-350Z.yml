          - text: 帕累托位而非精度王三组任务：V1 12 类全面占优、V2 35 类对比组最高精度 + 最小参数、V2 12 类精度略让 0.5-0.7 点换尺寸领先最多 31 倍——边缘场景的正确取舍。
