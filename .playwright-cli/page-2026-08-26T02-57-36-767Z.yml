    - generic [ref=f143e242]:
      - generic [ref=f143e243]: JUDGEMENT
      - paragraph [ref=f143e244]: ↳ 统一架构的红利是「共享表示」：ASR 和 KWS 用同一套声学编码——唤醒词检测搭了通用转录的便车，一份算力两份产出；当两个任务共享底层能力时，合并模型比维护两套系统更便宜也更准。
      - paragraph [ref=f143e245]: ↳ 推理时偏置是零成本的任务倾斜：不改参数、不加模型，只在解码 logits 上动手——「同一个模型，不同的使用偏好」；这种机制让一个部署覆盖多场景（换唤醒词、调灵敏度）而无任何重训。
      - paragraph [ref=f143e246]: ↳ 上下文门控决定偏置的安全性：均匀偏置会把关键词 token 推进无关语境——前缀匹配门控让偏置只在「有戏」的路径上生效；所有解码时干预技术都要配一个「何时不干预」的条件。
