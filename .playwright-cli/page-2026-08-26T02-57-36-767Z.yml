      - generic [ref=f143e158]: logits'(关键词 token) = logits + bias × 𝟙[已输出匹配前缀] α(t,u)：帧×token 的累积概率 L = −log Σ α(T,U)
      - generic [ref=f143e159]: 人话：模型本来就会听写所有的话（ASR）。检测唤醒词时给它开个小灶：每当它已经写出的字正好是唤醒词的开头，就悄悄把「下一个该写的字」的分数加一点——顺着词的拼写一路加，词写完整的概率就上去了；写的字跟唤醒词对不上时一分不加，正常听写不受影响。
