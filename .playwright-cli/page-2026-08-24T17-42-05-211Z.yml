          - text: 推理原理：confidence_k = Σ_j w_kj · C_kj(X)，ŷ = argmax_k —— 只有逻辑与 / 求和 / 比较，无浮点乘法 谱卷积核 64×7：64 维系数全覆盖 + 7 个时间片——单层模型小核注意力不够（64−7+1=58 滑窗，恰好对应 PE 阵列的 58）；滑动展开 = 58×1 PE 阵列，每 PE 一个与门
          - paragraph [ref=f60e109]: 状态驱动的四步推导（图 12）：① 按 included TA 行索引读特征图整行；② 按列索引选出覆盖位（滑动文字数据，长度=窗口数）；③ 每个 included TA 的滑动数据按窗做与；④ 任一窗为 1 → 子句满足输出权重。excluded TA 是 don't care 直接跳过——存储访问全部确定性顺序访问，不需要稀疏 NN 的索引模块与交集策略。
