        - heading "一分钟版本" [level=2] [ref=f60e25]
        - list [ref=f60e26]:
          - listitem [ref=f60e27]: 范式定位：Tsetlin Machine 用命题逻辑 + 学习自动机替代神经网络——布尔文字输入、子句做模式匹配、推理只有与/求和/比较无乘法、训练无反向传播。但 TM 在语音上从未进过标准基准（原版 9 类就掉到 80.5%）。
          - listitem [ref=f60e28]: 架构机会：CTM 训练后 include 的 TA 仅约 1%（确定性稀疏）——稀疏模式不随输入变化。数据驱动架构（脉动阵列）吃复用不吃稀疏、事件驱动（SNN）吃稀疏但不规则——状态驱动把稀疏在「状态」层面预先展开调度，两样同时拿。
          - listitem [ref=f60e29]: 算法突破：MFSC-SF 特征（删 DCT——与谱卷积冲突；删 LOG；拼谱通量补充动态信息，+4 pp）+ 64×7 谱卷积核 → CTM 首次在 GSCD 12 类拿 87.35%（对 BWN 87.9% 基本持平）。
          - listitem [ref=f60e30]: 硬件结果：65nm / 0.63mm² 核 / 0.7V 16.58µW（外推）——批量式内部推理核功耗比 22nm 双手（归一化后 57.6/65.2µW）至少降 4.8 倍；运算量 907k AND 全场最少（少于帧式的 980 万/930 万归一化）。
          - listitem [ref=f60e31]: 代价的诚实清单：精度五款垫底（低 2.0~5.7 pp）；模型 SRAM 占总功耗 42%；训练只敢加 20–40dB 轻噪（单层逻辑模型处理不了高噪声）；0.7V 功耗是外推非实测。
