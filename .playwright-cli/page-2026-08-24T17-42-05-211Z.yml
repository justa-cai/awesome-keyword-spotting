            - listitem [ref=f60e220]: 模型存储是功耗瓶颈：27.25KB 模型 SRAM 占 42%；CTM 模型天然大于 NN 对手——单层特征能力不足的连带代价。
            - listitem [ref=f60e221]: 特征前端未优化：FFT 方案对实值音频非最优，论文自认超范围。
            - listitem [ref=f60e222]: 批量式固有代价：16ms / 191nJ 逊于帧式（6.9ms / 27nJ）——定位「可比」非「超越」。
