        - generic [ref=f60e111]: 压缩侧的账：TA 动作矩阵 180KB → OG-BCSR（块索引跳空块 + Blossom 最大权匹配两两分组 + 直接行索引免指针）→ 19.9KB（9.84×）。分组把「多个子句的矩阵合并存储、子句索引区分归属」——直接针对「99% 稀疏反噬 CSR 效率」的观察；行计数 ≤7 → 表只需 3bit。调度侧的账：模拟退火两阶段（轮间交换 + 轮内 PE 间交换）离线负载均衡——确定性稀疏允许软件精确仿真硬件活动，PE 利用率提升 12.2%（到 63.1%）、省 1.2k 周期支撑 400kHz。
