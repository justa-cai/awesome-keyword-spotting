- generic [ref=f305e2]:
  - generic [ref=f305e3]: 论文精读 · 可视化版 · 2021 №23
  - heading "新唤醒词连录都不用录： 打字即定制——文本直接当嵌入空间的锚点" [level=1] [ref=f305e4]: 新唤醒词连录都不用录：打字即定制——文本直接当嵌入空间的锚点
  - generic [ref=f305e5]:
    - generic [ref=f305e6]: TAML · 北京大学 ADSPLAB
    - generic [ref=f305e7]: arXiv 2108.05516 · 音频-文本共享嵌入空间
    - generic [ref=f305e8]: 音素级文本编码 · 跨模态对比对齐
    - generic [ref=f305e9]: 零样本 75–85% · 保持音频锚点 85–90% 性能
  - generic [ref=f305e10]: 一句话：度量学习解决了「加词不重训」，但锚点仍是音频——新词还要录几个样本。TAML 把锚点换成文本：音频编码器与文本编码器（音素序列输入）映射到同一个 128 维嵌入空间，对比/三元组损失把匹配的音-文对拉近——用户打一行字（「Hey Monday」），文本编码器即刻产出锚点，零录制零样本检测训练时从未见过的新词。纯文本锚点保持音频锚点方法 85–90% 的性能；愿意录的话，1 个音频样本融合再 +3–5%。
  - generic [ref=f305e11]:
    - generic [ref=f305e12]: TL;DR
    - listitem [ref=f305e13]: ◈ 音频锚点的最后一道门槛：度量学习已把加词成本从「重训」降到「录几个样本算原型」——但录音对不熟悉操作的用户仍是负担。TAML 的问题句：能否用文本描述当锚点，实现打字即定制？
    - listitem [ref=f305e14]: ◈ 三组件：音频编码器（MFCC/频谱图 → CNN → GAP+投影 → D=128 · L2 归一化）+ 文本编码器（音素序列输入 → BiLSTM/Transformer → 同一 D 维空间）+ 跨模态对齐（对比损失 + 三元组损失，匹配对拉近、不匹配推开）。
    - listitem [ref=f305e15]: ◈ 音素级优于字符级：OK 与 okay 在音素层一致；colonel 读 /ˈkɜːrnəl/——字符编码完全误导，音素编码直达「怎么读」。文本编码器学的是发音而非拼写。
    - listitem [ref=f305e16]: ◈ 对称对齐：音频→文本与文本→音频双向约束——消融显示对称优于单向，锚点质量更稳。
    - listitem [ref=f305e17]: ◈ 推理两种形态：零样本（文本 → 嵌入 → 比距离 → 阈值，全程无音频）与少样本增强（融合锚点 = α·文本 + (1−α)·音频均值，α=0.3 最佳——5 个音频样本时与纯音频锚点差距 <2%）。
    - listitem [ref=f305e18]: ◈ 结果（约值）：零样本在留出类上 75–85%（全监督 ~95%，音频锚点 ~88%）——保持音频锚点方法的 85–90%；融合 1 个音频样本 +3–5%；跨模态对齐质量经「文本锚点接近音频锚点性能」验证。
    - listitem [ref=f305e19]: ◈ 负类处理：通用负类中心（大量非关键词语音的均值）承担拒识 + 困难负例挖掘（yes/yeah 类声学近邻加权，+2–3%）。
    - listitem [ref=f305e20]: ◈ 死穴与边界：同音异义词无解（write/right 音素相同 → 文本锚点重合——但音频锚点同样无法从声学区分）；声调语言需要文本编码器额外携带声调；文本编码器质量是上限（生僻词/缩写）。
  - heading "§01 问题：录音这道坎" [level=2] [ref=f305e21]:
    - generic [ref=f305e22]: §01
    - text: 问题：录音这道坎
  - generic [ref=f305e23]: 从音频锚点到文本锚点的一步跨越
  - generic [ref=f305e24]:
    - generic [ref=f305e25]:
      - heading "分类范式的锁没完全解开" [level=3] [ref=f305e26]
      - paragraph [ref=f305e27]: 度量学习把「加词 = 重训」变成了「加词 = 算原型」——但原型要音频样本。用户录 3–5 遍新唤醒词对技术用户是小事，对老人孩子是真实门槛——定制体验的最后一公里卡在麦克风上。
    - generic [ref=f305e28]:
      - heading "零样本是质变不是量变" [level=3] [ref=f305e29]
      - paragraph [ref=f305e30]: 音频锚点方法再高效也是 few-shot（至少 1 个样本）；文本锚点是 zero-shot——训练时从未听过音频的新词也能检测。交互形态从「请录音」变成「请输入」，这是范式差异。
    - generic [ref=f305e31]:
      - heading "跨模态对齐的可行性" [level=3] [ref=f305e32]
      - paragraph [ref=f305e33]: 关键词的文本与音频之间有稳定映射（音素序列）——同一映射关系让 CLIP 类模型在图-文上成功。KWS 的优势是词表封闭、发音规则相对稳定——对齐难度低于开放域图文。
    - generic [ref=f305e34]:
      - heading "与同系列论文的坐标" [level=3] [ref=f305e35]
      - paragraph [ref=f305e36]: Triplet KWS（№16）= 音频锚点的度量学习；KeySEM（№22）= 15K 词预训练嵌入 + 音频原型适配；本文把锚点从音频换成文本——三篇构成「定制成本递减」的谱系：重训 → 录音 → 打字。
