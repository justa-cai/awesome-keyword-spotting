  - generic [ref=f305e107]: 对比/三元组损失 · 对称对齐 · 音素表示
  - generic [ref=f305e108]:
    - generic [ref=f305e109]: "对比: 匹配对 L = d(f_audio(x), f_text(t))² 不匹配对 L = max(0, margin − d(f_audio(x), f_text(t')))² # margin=0.5 三元组: L = max(0, d(f_a(x_a), f_t(t_p)) − d(f_a(x_a), f_t(t_n)) + margin) 零样本: 用户输入 t_new → f_text(t_new) → 与查询音频比距离 → 阈值判定 少样本: 融合锚点 = α·f_text + (1−α)·mean(f_audio) # α=0.3 最佳"
    - generic [ref=f305e110]: 人话：训练时给模型看大量「这段音频 ↔ 这个词的音素序列」的配对——匹配的拉近、不匹配的推开，且双向约束。学成后文本编码器能直接算出「这个词的音频大概长在哪」的坐标——新词打进去，锚点即刻就位。
  - generic [ref=f305e111]:
    - generic [ref=f305e112]:
      - heading "同音异义词的固有代价" [level=3] [ref=f305e113]
      - paragraph [ref=f305e114]: 音素表示把「文本→发音」单射化：write 与 right 音素相同 → 文本锚点重合——文本锚点无法区分，需上下文消歧。注意音频锚点同样无法从声学上区分它们——这不是文本锚点的额外损失，是任务本身的对称歧义。
    - generic [ref=f305e115]:
      - heading "α=0.3 的含义" [level=3] [ref=f305e116]
      - paragraph [ref=f305e117]: 少样本融合时文本权重只有 0.3——有音频样本时音频锚点更准（直接来自真实声学分布），文本锚点退化为先验/正则。这个配比说明两个信息源的可靠性排序：实听 > 读法推断。
