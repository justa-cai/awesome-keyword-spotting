  - generic [ref=f305e312]:
    - generic [ref=f305e313]: 可迁移判断
    - paragraph [ref=f305e314]: ↳ 当类别可由文本枚举时，打字即注册应成默认交互：跨模态对齐让「类别定义」与「类别数据」解耦——命令词定制、声音事件类型扩展都适用；先问「我的类别能不能写成文本」，能写就该有文本锚点这条路。
    - paragraph [ref=f305e315]: ↳ 音素是文本-音频之间的正确中间表示：拼写层对齐会因拼写-发音脱节失效（colonel），音素层直达发音——选跨模态的桥接表示要贴「两模态共享的物理现实」，语音的现实是发音不是拼写。
    - paragraph [ref=f305e316]: ↳ 零样本与少样本是谱系不是对立：融合权重 α 让系统在「纯文本先验」与「实测音频」之间连续滑动——产品设计上可默认零样本、静默收集用户音频逐步收紧锚点。
    - paragraph [ref=f305e317]: ↳ 对齐的歧义是任务固有而非方法缺陷：write/right 在音频侧同样不可分——评估跨模态方法时要把「表示导致的损失」与「任务本身的对称歧义」分开记账，否则会错怪文本锚点。
