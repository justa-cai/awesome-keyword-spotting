  - generic [ref=f190e159]:
    - generic [ref=f190e160]: Eqn.1（max-pooling 原版，Sun 等 2016） L = −log(p_t^y) t = argmin(p_i⁰) 若 y=0；t = argmax(p_i^y) 若 y≠0
    - generic [ref=f190e161]: 人话：正例支选「类别分最高那帧」——检测只需要最高分过阈值，压这一帧就够；负例支选「背景分最低那帧」（二分类下=正类分最高那帧），在这一帧上压背景分，等于逼整个窗口里最容易误报的那一帧也把正类分数压下去。两支合起来：免对齐 + 自动选帧。副作用：正例支把监督全押在（往往迟到的）峰值帧上——峰值之前的帧从未被要求给出高后验，判决自然后漂。
  - generic [ref=f190e162]:
    - generic [ref=f190e163]: Eqn.2（本文改动，只动正例支） t = ( argmax_i(p_i^y) − β )₊ β ~ Bernoulli(b) (x)₊ = max(x, 0)
    - generic [ref=f190e164]: 人话：对每个正例，训练时以概率 b 把损失从峰值帧挪到它的前一帧。网络要么学会把置信度质量整体前移（峰值本身提前），要么把前帧的后验也抬高（峰先于词尾出现）——两条路都通向更早检测。β 逐例随机：峰值帧和前帧在不同样本、不同训练步上交替受监督，不会为早检单点过拟合，精度退化是 b 连续控制的软权衡。
  - generic [ref=f190e165]:
    - generic [ref=f190e166]:
      - heading "为什么需要 (·)₊ 截断" [level=4] [ref=f190e167]
      - paragraph [ref=f190e168]: argmax 可能落在第 0 帧（峰值就在窗口开头），减 β 得 −1 是非法下标——max(·,0) 钳回 0，保证选帧永远合法。
    - generic [ref=f190e169]:
      - heading "为什么随机回退而不是固定回退" [level=4] [ref=f190e170]
      - paragraph [ref=f190e171]: 确定性回退 = 永远只监督前帧，模型会为「早」过拟合；随机回退让两个位置交替受监督，代价曲线从悬崖变成可调斜坡——b 就是坡度。
    - generic [ref=f190e172]:
      - heading "为什么伯努利就够、什么时候不够" [level=4] [ref=f190e173]
      - paragraph [ref=f190e174]: 本文架构后验步长相对大（第一层后池化 + 第二层 3 跨步卷积）——回退一步对应可观的毫秒数。后验间隔更小、或要更大幅度削减时，可换正支撑分布（如泊松）一次回退多帧——论文只给方向，无实验。
    - generic [ref=f190e175]:
      - heading "Eqn.3 通用化：损失可插拔" [level=4] [ref=f190e176]
      - paragraph [ref=f190e177]: 把逐类标量换成完整后验向量 P_i、负对数换成任意 L(y, P)：选帧机制原封不动。产品意义：误唤醒/漏唤醒代价天然不对称——延迟控制与代价加权正交组合。
  - generic [ref=f190e178]:
    - generic [ref=f190e179]: Eqn.3（通用形式） L(y, [P_0…P_T]) = L(y, P_t) 选帧同 Eqn.2，但 L 可以是任何「单时刻后验向量 + 标签」的损失
    - generic [ref=f190e180]: 与 max-latency 的机制级对比：max-latency 遮蔽词后上下文，数学上等价于收窄 argmax 的搜索范围——峰必须更早出现否则损失降不下去；本文是从搜索结果回退一个随机步——不需要知道端点在哪（回退相对峰值自身），也不碰数据（改动封装在下标算式里）。一个绑数据+绑端点，一个零依赖+损失无关。
  - paragraph [ref=f190e181]: 控制变量设计：所有模型严格共用同一套架构——Jose 等（Interspeech 2020）的流式 CNN：5 层卷积 + 3 层全连接，第一层后 max-pooling、第二层 3 跨步卷积，输入 76 帧 × 64 维 LFBE（25ms 窗 / 10ms 移），Adam，dropout 0.3——只换损失函数。本文全部论点落在「损失的改动导致延迟与精度变化」这条因果链上，任何架构或优化器的混杂因素都会污染它。后验步长大也正是「一步回退够用」的架构前提。
