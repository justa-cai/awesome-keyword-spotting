    - list [ref=f190e265]:
      - listitem [ref=f190e266]: ↳ b=0 严格还原 max-pooling 且全场最准——前移机制没有引入任何隐藏精度税，退化只在主动拧旋钮时发生。b∈(0, 0.33) 区间都在 CE 之上——「免对齐 + 自动选帧」相对人工对齐有真实的精度红利，本文花掉一部分红利换延迟。
