  - generic [ref=f190e94]:
    - generic [ref=f190e95]:
      - heading "两阶段 DNN + HMM：低延迟是用标注买来的" [level=4] [ref=f190e96]
      - paragraph [ref=f190e97]: HMM 对关键词 senone 序列做 Viterbi 解码，运行时直接给出起止音素状态的时间位置——端点和低延迟是白送的。代价三重：逐条解码计算昂贵；要子词级（逐音素）标注；训练调参困难。低延迟在这里是用标注成本和系统复杂度换的。
    - generic [ref=f190e98]:
      - heading "单阶段全神经：标注友好，端点结构没了" [level=4] [ref=f190e99]
      - paragraph [ref=f190e100]: 前馈 DNN 直接预测关键词——内存 CPU 好调、只需关键词级标注、实证胜过 keyword/filler HMM；CNN/CRNN 再往上提。但 HMM 拿掉后没有显式端点结构，判决落在哪一刻完全由模型自己学——延迟控制失去了抓手。
    - generic [ref=f190e101]:
      - heading "max-pooling 损失：免对齐的红利与峰值后漂的病根" [level=4] [ref=f190e102]
      - paragraph [ref=f190e103]: 自动选帧训练：正例选类别分最大帧、负例选背景分最小帧——不需要精确对齐，还优于人工预选对齐（数据制作阶段人为选的对齐直接影响模型表现）。病根也在「让模型自己选最大帧」：决策窗口明显大于关键词本身时（语速快），损失对「说完立刻检」没有任何激励，模型等吃进更多后续上下文才输出峰值。
    - generic [ref=f190e104]:
      - heading "已有延迟治理：都要付出端点标注或通用性" [level=4] [ref=f190e105]
      - paragraph [ref=f190e106]: 直接惩罚模型延迟 → 要关键词端点精确标注，丢掉免对齐优势。Sigtia 二级验证模型（ICASSP 2021）用更多词后上下文抠难例——方向相反：那是把延迟当资源花掉换精度。Fu 的 max-latency（ICASSP 2022，本文 SOTA 基线）遮蔽词后上下文——但要端点知识才能定遮蔽起点，且绑在数据处理上，换损失要重新适配。
  - paragraph [ref=f190e107]: 于是本文要同时满足四个约束：（1）控制算法延迟；（2）全程不需要端点精确标注（保住 max-pooling 的数据优势）；（3）单超参数连续权衡、映射单调可预期（少量扫参即可命中目标延迟）；（4）机制能推广到任意「单时刻后验 + 标签」形态的损失函数——最后还要在延迟约束下赢过依赖端点知识的 SOTA。
