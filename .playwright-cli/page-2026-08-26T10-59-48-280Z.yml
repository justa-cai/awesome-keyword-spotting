  - generic [ref=f190e12]:
    - heading "一分钟版本" [level=3] [ref=f190e13]
    - list [ref=f190e14]:
      - listitem [ref=f190e15]: ▸ 张力：KWS 是语音助手的门控——唤醒触发后续重计算；准和快天然反向。延迟不只让回应慢，还改变用户行为：等不到回应就把唤醒词再说一遍 → 重复触发。
      - listitem [ref=f190e16]: ▸ 界定：本文治的是算法延迟（关键词端点之后还要多听几帧才判决），不是工程延迟（算力受限的推理开销）——所以工作落在损失函数层，与省算力路线正交可叠加。
      - listitem [ref=f190e17]: ▸ 病根：max-pooling 损失自动选帧免对齐（正例选最大帧、负例选最小帧），但模型会利用关键词之后的额外上下文抬置信度——峰值后漂；决策窗口显著大于关键词长度时（语速快）尤其严重。
      - listitem [ref=f190e18]: ▸ 核心改动：t = (argmax(p^y) − β)₊，β~Bernoulli(b)——以概率 b 把损失从峰值帧挪到前一帧：要么置信度质量整体前移、要么峰值前一帧后验抬高，都通向更早检测。
      - listitem [ref=f190e19]: ▸ 为什么随机：β 逐例随机让峰值帧和前峰值帧交替受监督——不为早检单点过拟合，精度退化渐进、由 b 连续控制的软权衡。
      - listitem [ref=f190e20]: ▸ 为什么一步够：本架构后验时间步长较大（一层池化 + 3 跨步卷积），回退一步就是可观的毫秒数；小步长模型需泊松式多变回退（只有提议无实验）。
      - listitem [ref=f190e21]: ▸ 主结果：固定延迟下相对 max-latency SOTA（依赖端点标注）约 25% 相对误收改善；相对 CE 对齐训练同样约 25%——b=0 严格退化为 max-pooling 且是全场精度最优点（无隐藏精度税）。
      - listitem [ref=f190e22]: ▸ 甜点 b=0.33：精度恰好回到 CE 基线水平、延迟已显著低于 max-pooling——「免对齐训练 + 精度不亏 + 延迟赚一段」。
      - listitem [ref=f190e23]: ▸ 单调旋钮：b 与延迟单调挂钩——给定延迟约束只需少量几个 b 各训一版就能命中；b=1 时峰值抢在关键词物理终点之前（信息不完整就下判决的激进工作点）。
      - listitem [ref=f190e24]: ▸ 通用化：Eqn. 3 把机制从交叉熵解耦——任何「单时刻后验向量+标签」形态的损失都能挂上延迟控制，误唤醒/漏唤醒的代价不对称加权可正交组合。
  - generic [ref=f190e25]:
    - heading "一分钟版本" [level=3] [ref=f190e26]
    - list [ref=f190e27]:
      - listitem [ref=f190e28]: ▸ KWS 在语音助手里是门控：唤醒词被检出的那一刻才触发后面重得多的处理——所以它必须又准又快，「快」指关键词说完后尽早给判决。两目标天然反向：延迟大了用户等不到回应会再说一遍唤醒词，造成重复触发——对日活级产品，延迟和误唤醒率是同等级的体验指标。
      - listitem [ref=f190e29]: ▸ 单阶段全神经 + max-pooling 损失免掉了子词标注，但病根也在这：模型用关键词之后的音频上下文抬置信度，检测峰值整体后漂——检测对了，但迟到了（论文 Fig.1：说 "Amazon, what's the weather"，峰值窗口明显伸到词尾之后）。
      - listitem [ref=f190e30]: ▸ 本文在 max-pooling 的选帧下标上减一个伯努利随机数：t = (argmax(p_i^y) − β)₊，β ~ Bernoulli(b)。不动架构、不动数据、不动训练流程——只改损失里一行算式，延迟变成一个像学习率一样好调的超参数。
      - listitem [ref=f190e31]: ▸ 固定延迟下相对误收（FA）−25%（vs 依赖端点标注的 SOTA 基线），与 max-pooling 结合时相对交叉熵同样 −25%——全程不需要关键词端点的精确标注。
  - paragraph [ref=f190e32]: 先界定「延迟」：论文只管算法延迟——关键词端点之后模型还要多听多少帧才吐判决；算力受限硬件上的工程/推理延迟是另一本账（那是省算力路线管的）。这个界定决定了工作落在损失函数层而不是模型压缩层，与省算力路线正交、可叠加。
