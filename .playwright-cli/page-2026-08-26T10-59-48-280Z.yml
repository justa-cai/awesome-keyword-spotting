  - generic [ref=f190e336]:
    - heading "实验设计层面的六个缺口" [level=3] [ref=f190e337]
    - list [ref=f190e338]:
      - listitem [ref=f190e339]: ▸ 单关键词：只验了 "Amazon" 二分类——多关键词、多类、短语级全部未测。
      - listitem [ref=f190e340]: ▸ 全是相对值：精度相对 xe loss / 相对 max-pooling，延迟只有相对削减量——没有各档 b 的平均延迟毫秒表，没有置信区间，跨论文不可直接比。
      - listitem [ref=f190e341]: ▸ 内部数据：20,000h/1,400h 全专有，无代码无公开集——第三方无法复现。
      - listitem [ref=f190e342]: ▸ 延迟锚点自身有误差：评测的「关键词端点」由 HMM 给出，HMM 对齐误差直接污染延迟测量——训练靠 padding 容忍，评测误差多大没报。
      - listitem [ref=f190e343]: ▸ 基线没调透：max-latency 的 f 扫描取值未报告——基线是否最优无从判断。
      - listitem [ref=f190e344]: ▸ 没有在线实验：延迟→用户行为改善（如重复唤醒率下降）这条立论起点的链条没有产品 A/B 闭环。
  - generic [ref=f190e345]:
    - heading "能带走的判断" [level=4] [ref=f190e346]
    - list [ref=f190e347]:
      - listitem [ref=f190e348]: ↳ 最小侵入的工程审美：拿到一个可调旋钮，代价是一行算式而不是一个新架构——改动能封装在损失的下标选择里，就绝不外溢到数据管线和训练流程。改动半径越小，因果链越干净（本文的控制变量设计因此才成立）。
      - listitem [ref=f190e349]: ↳ 把 trade-off 从系统设计目标变成训练期超参的前提是单调映射——单调性让命中约束的搜索成本从密集扫参降到几个点；若参数-延迟关系震荡，每个目标点都是一次完整训练，旋钮就不成立。设计可调机制时先验单调性是第一指标。
      - listitem [ref=f190e350]: ↳ 随机化回退优于确定性回退：交替监督两个位置避免单点过拟合，代价曲线从悬崖变成可调斜坡——与 dropout、mixup 一脉相承的「随机性当正则」思想，在监督信号的位置维度上又用了一次。
      - listitem [ref=f190e351]: ↳ 算法延迟与工程延迟是两本账：改损失压算法延迟、省算力压工程延迟（低延迟 CRNN 那一路），两者正交——完整的端侧延迟账本要两边一起算，这也是本文与省算力系列（cFSMN、TC-ResNet 等）互补的接口。
