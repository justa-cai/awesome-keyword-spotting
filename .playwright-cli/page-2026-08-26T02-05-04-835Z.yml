    - generic [ref=f131e227]:
      - generic [ref=f131e228]: JUDGEMENT
      - paragraph [ref=f131e229]: ↳ 「拆解耦合」是效率设计的母题：空间与通道联合卷积被拆成两步，计算量降一个量级——识别「一个算子在同时干几件事」，然后拆开分别最优化，是端侧架构创新的通用套路（与低秩分解、attention 的拆解同宗）。
      - paragraph [ref=f131e230]: ↳ 小预算要靠架构而不是靠缩小：DS-CNN 同参数量比 DNN 高 10 个点——把大模型等比缩小是下策，按预算重新设计结构才是正路；「参数预算」是设计约束，不是缩放系数。
      - paragraph [ref=f131e231]: ↳ 基准论文的使命是定义「可行域」：本文证明 20-50KB 神经网络 KWS 可行且好用——此后十年 MCU-KWS 研究都在它划定的舞台上展开；提出正确的硬件约束 + 系统对比，比单点 SOTA 更能开启一个领域。
