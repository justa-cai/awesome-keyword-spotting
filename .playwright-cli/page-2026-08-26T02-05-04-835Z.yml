      - text: 机制：标准卷积拆成两步
    - generic [ref=f131e83]:
      - generic [ref=f131e84]:
        - heading "深度卷积（DW）" [level=3] [ref=f131e85]
        - text: 每个输入通道独立卷——只管空间模式，不跨通道。
      - generic [ref=f131e86]:
        - heading "逐点卷积（PW）" [level=3] [ref=f131e87]
        - text: 1×1 卷积在通道维线性组合——把分开的特征重新混合。
      - generic [ref=f131e88]:
        - heading "计算量账" [level=3] [ref=f131e89]
        - text: D_K²·M·N·D_F² → D_K²·M·D_F² + M·N·D_F²，约降到 1/N + 1/D_K²——3×3 核 64 通道省 8-9 倍。
      - generic [ref=f131e90]:
        - heading "GAP 收尾" [level=3] [ref=f131e91]
        - text: 全局平均池化替代全连接——省大量参数还提升泛化。
