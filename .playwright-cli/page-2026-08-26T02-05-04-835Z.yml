    - text: 一句话：在 20-50KB SRAM / 极低算力的 MCU 预算下系统评估 DNN/CNN/RNN/DS-CNN——深度可分离卷积（空间与通道解耦，计算量降到 ~1/N + 1/D_K²）全尺寸胜出：GSC 12 类 95.4%，同参数量比 DNN 高 10 个点，DS-CNN 从此成为 MCU-KWS 的默认骨架。
