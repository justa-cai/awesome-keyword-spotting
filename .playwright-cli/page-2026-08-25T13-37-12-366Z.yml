  - heading "§04 贡献" [level=2] [ref=f253e315]:
    - generic [ref=f253e316]: §04
    - text: 贡献
  - generic [ref=f253e317]: 五点：从任务表述到工程副产品
  - generic [ref=f253e318]:
    - generic [ref=f253e319]:
      - generic [ref=f253e320]: "1"
      - paragraph [ref=f253e321]: 首次提出并验证 KWS 与 AT 的统一建模：KWS 重新定义为多标签声事件检测的子任务，标签并集 + 两个映射决策构成完整可复用配方——贡献发生在任务表述层而非网络结构层。
    - generic [ref=f253e322]:
      - generic [ref=f253e323]: "2"
      - paragraph [ref=f253e324]: 随机裁剪 + 伪强标签解决跨任务时长失配，并给出硬核消融（−27.94 / −12.65）——对任何想做多任务音频联合训练的人都有直接参考价值。
    - generic [ref=f253e325]:
      - generic [ref=f253e326]: "3"
      - paragraph [ref=f253e327]: 端侧可行的双任务性能：单一 2.9M 模型，GSCV1 97.53% + AS 33.42 mAP，无 ImageNet 预训练无数据增强，当时参数最少的 AT 可用模型。
    - generic [ref=f253e328]:
      - generic [ref=f253e329]: "4"
      - paragraph [ref=f253e330]: 噪声鲁棒性从「加噪声数据」推进到「语义化噪声」：三个域外集全面优于基线，真实产品困难负例拒识 0%→82.73%。
    - generic [ref=f253e331]:
      - generic [ref=f253e332]: "5"
      - paragraph [ref=f253e333]: 工程副产品：BCE 输出节点可剥离（Ours-Strip 2.9M→2.2M 精度不损）+ γ 阈值部署期可调——「一次训练、多种部署」的机制。
