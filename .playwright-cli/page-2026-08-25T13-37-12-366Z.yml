    - listitem [ref=f253e312]: ◈ 3M 参数以内 GSCV1 最高（97.53%）；唯一超过的 Wav2KWS 是 225M（约 80 倍）且用大规模预训练。AT 侧 33.42 mAP 超过所有无预训练对手、参数最少，距带 ImageNet 预训练的 EfficientNet-B0/B2 只差 0.08/0.64。
    - listitem [ref=f253e313]: ◈ 真实产品 t=3s（学术 1s）照样工作——框架对目标时长不敏感。真实训练集 131 小时（70% 含「小爱同学」），Difficult 集 3,731 条全是相近发音（「这为同学」）、童声咿呀、带人声音乐。
