      - generic [ref=f253e361]: 10 和 1；真实实验仅中文单语
      - generic [ref=f253e362]: 延伸：接入 AS unbalanced 全量（PSL 本就为弱监督设计）；量化+蒸馏
      - generic [ref=f253e363]: 压进微型档；条件唤醒定量验证；多语种/多关键词复验；输出层级化
      - generic [ref=f253e364]: （Audioset 本体树做层级损失）；从打标走向时序定位（SED）
      - generic [ref=f253e365]: 可迁移判断：联合训练的收益前提是两路监督都足够干净——任何一路的标注噪声都会通过共享编码器传染另一路；而数据工程（时长对齐）比任何结构设计都致命
    - generic [ref=f253e366]: 图4 · 边界与延伸：左技术边界（参数偏大、干净集精度税、鲁棒性来源存疑、PSL 依赖外部标注器、条件唤醒无定量），右实验边界（零延迟/功耗数据、学术指标体系、对比不对齐、规模未探明）+ 延伸方向。
  - generic [ref=f253e367]:
    - generic [ref=f253e368]: 可迁移判断
    - paragraph [ref=f253e369]: ↳ 联合训练的收益前提是两路监督都干净：AT 侧的标签噪声会通过共享编码器污染 KWS 分支的表征（PSL 消融里 GSCV1 也掉了 0.59）——多任务框架里任何一路的脏监督都是全体的税。
    - paragraph [ref=f253e370]: ↳ 数据工程比结构设计致命：时长对齐这个最不起眼的环节错了直接崩 27.94 个点，比任何网络结构选择的影响都大——先对齐数据统计，再谈模型。
    - paragraph [ref=f253e371]: ↳ 拒识桶应该语义化：把无结构的 unknown 桶升级为一组显式类别，负向判断变正向判断——泛化能力的来源是每个类别背后有真实数据支撑，这条对任何开放集识别问题都成立。
    - paragraph [ref=f253e372]: ↳ 选损失函数要看部署形态：CE 的 softmax 把所有类别耦合进归一化分布，不可裁剪；BCE 的独立节点让输出层变成可按需裁剪的货架——如果产品要「一套训练多种部署」，这个数学性质就是选型依据。
