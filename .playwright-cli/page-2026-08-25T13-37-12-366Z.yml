  - heading "§02 方法：KWS 重建为 AT 的子任务" [level=2] [ref=f253e112]:
    - generic [ref=f253e113]: §02
    - text: 方法：KWS 重建为 AT 的子任务
  - generic [ref=f253e114]: 标签并集 · 随机裁剪 + PSL · BCE 可剥离
  - generic [ref=f253e115]:
    - generic [ref=f253e116]: "L_BCE(ŷ, y) = y·log ŷ + (1−y)·log(1−ŷ) # 多标签 BCE，y 可有多个正标签 ȳ = argmax ŷ_KWS 若 max ŷ_KWS ≥ γ # 推理单标签化（式 2） = argmax ŷ_AT 否则 # γ=0.4，验证集调出"
    - generic [ref=f253e117]: 人话：每个输出节点是独立的 sigmoid 概率，节点之间没有归一化耦合——这个数学性质是「输出层可剥离」的根基。推理时只要任一关键词节点超阈值 γ 就在关键词表内 argmax，否则退回 AT 分支（通常落在 Speech，正确表达「是语音但不是关键词」）。γ 是部署期灵敏度旋钮：0.4→0.01 时 Common 99.85→99.96% 但 Difficult 82.73→57.45%。
  - generic [ref=f253e118]:
    - generic [ref=f253e119]: AS 片段（10s，弱标签）→ 随机裁剪 1s（对齐 KWS） → 预训练机器标注器估计软标签 = PSL → 监督 527 维输出
    - generic [ref=f253e120]: 人话：Audioset 标签是 10 秒片段级的——随机裁出的 1 秒里未必有标签所指的事件，硬贴上去就是系统性标注噪声。PSL 用一个预训练标注器给每个裁剪重新估计软标签。作者自评只「部分解决」错位；消融显示这步值 12.65 个 mAP，且 KWS 侧也跟着受益——两路监督的清洁度通过共享编码器耦合在一起。
  - generic [ref=f253e121]:
    - generic [ref=f253e122]:
      - heading "删掉 noise 标签的观念转换" [level=3] [ref=f253e123]
      - paragraph [ref=f253e124]: 常规 KWS 必须带非目标标签，UniKW-AT 把它整个删除——Audioset 的 527 类已涵盖绝大多数噪声类型，音乐、犬吠、风雨、电视声都有自己的类。模型从「不是我的词」的负向判断变成「这是音乐」的正向判断，后者泛化强得多，因为每个噪声类别背后有真实数据支撑。
    - generic [ref=f253e125]:
      - heading "非目标词 → Speech 的两级结构" [level=3] [ref=f253e126]
      - paragraph [ref=f253e127]: GSCV1 其余 20 词统一映射为 Speech 事件：目标词样本同时激活 (Speech, 关键词)，非目标语音只激活 Speech。用多标签机制复现了「语音检测→关键词确认」的层级，且对开放集天然友好——任何语言的非目标语音都应落在 Speech 上，VL106 的 99.91% 拒识就是回报。
    - generic [ref=f253e128]:
      - heading "Ours-Strip：一套训练多种部署" [level=3] [ref=f253e129]
      - paragraph [ref=f253e130]: BCE 独立节点意味着最终线性层里不想要的标签行（权重+偏置）可以物理删除——模型变小变快省电，剩余标签不受影响（2.9M→2.2M，97.53% 不变）。厂商可按场景裁剪：音乐多的家庭保留 Music+Speech+关键词做条件唤醒，低端设备只留 K+1 类。
    - generic [ref=f253e131]:
      - heading "骨干选型的两头讨好" [level=3] [ref=f253e132]
      - paragraph [ref=f253e133]: 对 KWS 社区 2.9M 偏大（TC-ResNet8 只要 0.06M），对 AT 社区又算轻量（CNN14 是 76M）——论文坦承这是务实折中：它已是能以合理精度覆盖 537 类输出空间的最小档位之一。前端 64 维对数梅尔谱、32ms 窗、10ms 帧移，模型选择以 mAP 为主指标。
