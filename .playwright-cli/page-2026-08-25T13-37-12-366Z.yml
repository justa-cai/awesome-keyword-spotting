- generic [ref=f253e2]:
  - generic [ref=f253e3]: 论文精读 · 可视化版 · 2022 №39
  - heading "把唤醒词当成第 528 种声音： 一个 2.9M 模型同时听关键词和声环境" [level=1] [ref=f253e4]: 把唤醒词当成第 528 种声音：一个 2.9M 模型同时听关键词和声环境
  - generic [ref=f253e5]:
    - generic [ref=f253e6]: UniKW-AT · 小米
    - generic [ref=f253e7]: arXiv 2209.11377 · MobileNetV2 2.9M
    - generic [ref=f253e8]: 527 AT + 10 KWS = 537 输出节点
    - generic [ref=f253e9]: Musan 拒识 84.88→99.86% · 真实困难负例 0→82.73%
  - generic [ref=f253e10]: 一句话：KWS 与音频打标（AT）抽象后是同一个任务——输入固定时长音频、输出标签。UniKW-AT 把 KWS 重建为 AT 的子任务：Audioset 527 类本体直接并入 10 个关键词成 537 维多标签输出，删掉 noise 标签（噪声变成有名有姓的类别）、非目标词映射到 Speech（两级判别）。单模型单次前向同时产出关键词与声事件语义，Musan 拒识从 84.88% 跳到 99.86%，小米真实产品困难负例从内部模型的 0% 提到 82.73%。
  - generic [ref=f253e11]:
    - generic [ref=f253e12]: TL;DR
    - listitem [ref=f253e13]: ◈ KWS 与 AT 长期是两个领域（各自数据集/基准/会议轨道），但端侧常驻模型只养得起一个——双能力要么双模型翻倍，要么统一建模。联合训练横着三重阻碍：监督强度、目标函数、样本时长（1s vs 10s）。
    - listitem [ref=f253e14]: ◈ 核心是任务表述层的创新而非结构：标签集直接并集 527+10=537，多标签 BCE 训练，骨干就是普通 MobileNetV2（2.9M）。
    - listitem [ref=f253e15]: ◈ 两个标签映射决策最关键：删掉 noise 标签——噪声从无结构拒识桶升级为有语义的显式类别，「这不是我的词」变成「这是音乐」；非目标词 → Speech——形成先判语音再判关键词的两级结构，天然开放集友好（106 种外语拒识 99.91%）。
    - listitem [ref=f253e16]: ◈ 时长失配是地基问题：朴素零填充 KWS 到 10s 会让准确率崩 27.94 个点；反过来随机裁剪 AT 到 1s + 机器标注器产伪强标签 PSL，去掉 PSL 则 AS mAP 掉 12.65 点、KWS 也跟着掉——标签噪声经共享编码器跨任务传染。
    - listitem [ref=f253e17]: ◈ BCE 的独立 sigmoid 节点带来输出层可剥离：不想要的标签整行删掉（2.9M→2.2M 精度不变）——按地区/场景裁剪输出子集，一套训练多种部署；CE 的 softmax 耦合归一化做不到。
    - listitem [ref=f253e18]: ◈ 诚实的读数：鲁棒性大头来自「引入 AS 数据」本身（对照组已拿 99.80+），多标签框架的净增量只有 +0.06~0.10 点——不可替代的价值在 AT 语义输出与条件唤醒能力。
    - listitem [ref=f253e19]: ◈ 真实产品（小爱同学）：Common 集 99.85%（略逊内部模型 0.13 点），Difficult 集 82.73% vs 内部模型 0%——传统二分类 KWS 在相近发音/童声/带唱音乐面前全军覆没。
  - heading "§01 问题：常驻模型只养得起一个" [level=2] [ref=f253e20]:
    - generic [ref=f253e21]: §01
    - text: 问题：常驻模型只养得起一个
  - generic [ref=f253e22]: 同构性洞察 + 三个痛点 + 联合训练的三重阻碍
  - generic [ref=f253e23]:
    - generic [ref=f253e24]:
      - heading "两条研究线各自的死结" [level=3] [ref=f253e25]
      - paragraph [ref=f253e26]: KWS 线：TC-ResNet（0.06–0.3M）、NAS、KWT 刷到 96–97%，但标签体系是「目标词 + 笼统 unknown 桶」，从未被教导理解非目标音频的语义构成——二值化拒识知识的外推天然脆弱，换个域就崩（VL106 掉 14 点）。AT 线：CNN14（76M）、AST（87M）握着海量声事件语义，却需要 GPU 才能推理，根本进不了端侧常驻场景。
    - generic [ref=f253e27]:
      - heading "噪声鲁棒性短板有数字" [level=3] [ref=f253e28]
      - paragraph [ref=f253e29]: 纯 GSCV1 训练的基线在 Musan（音乐/语声/babble）上拒识率只有 84.88%——每 6-7 条噪声就放行一条误唤醒。训练数据是干净近讲语音，非目标类又没有内部结构，模型对音乐、童声咿呀、发音相近的干扰词毫无招架。
    - generic [ref=f253e30]:
      - heading "语义盲区" [level=3] [ref=f253e31]
      - paragraph [ref=f253e32]: 传统 KWS 对「这段音频里除了语音还有什么」一无所知——「检测到儿童说话才允许唤醒」这类条件逻辑无从谈起，也无法向用户回报声环境。而这类逻辑恰是真实产品的刚需（家长控制、场景适配）。
    - generic [ref=f253e33]:
      - heading "三重阻碍解释了为什么没人做过" [level=3] [ref=f253e34]
      - paragraph [ref=f253e35]: 监督强度不同（AT 靠弱监督——只有片段级标签；KWS 用强监督）；目标函数不同（多标签 vs 单标签 CE）；样本时长不同（1s vs 10s，直接混合产生严重填充错配）。不是没想到统一，是每一关都要单独设计方案。
