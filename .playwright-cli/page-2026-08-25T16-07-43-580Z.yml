  - heading "§02 方法：margin 的几何与挖掘的艺术" [level=2] [ref=f290e103]:
    - generic [ref=f290e104]: §02
    - text: 方法：margin 的几何与挖掘的艺术
  - generic [ref=f290e105]: 三元组距离关系 · 半难负样本 · L2 归一化
  - generic [ref=f290e106]:
    - generic [ref=f290e107]: "L = max( 0, d(f(x_a), f(x_p)) − d(f(x_a), f(x_n)) + margin ) 半难负样本: d(a,p) < d(a,n) < d(a,p) + margin # 恰好贴着间隔边界 原型: c_k = (1/N_k) · Σ f(x_i) # 建议每词 10–20 样本（不同说话人） L2 归一化: 嵌入映射到单位超球面 → 欧氏距离 ≡ 余弦距离"
    - generic [ref=f290e108]: 人话：三元组只看三个点的相对关系——正样本要比负样本至少近一个 margin。随机选的负样本几乎总是太远（损失恒为零，模型学不到东西），所以要主动挑那些「差点就违规」的半难负样本——它们才是有信息的训练信号。
  - generic [ref=f290e109]:
    - generic [ref=f290e110]:
      - heading "margin 的甜点逻辑" [level=3] [ref=f290e111]
      - paragraph [ref=f290e112]: margin 是类间隔的最低保证：0.2 时簇间挨得太近（易混淆），0.5 时间隔要求太苛刻（多数三元组永远满足不了，训练困难）——0.3 在准确率与稳定性之间平衡。这个值与数据的固有混淆度相关，换任务要重扫。
    - generic [ref=f290e113]:
      - heading "挖掘的工程复杂度" [level=3] [ref=f290e114]
      - paragraph [ref=f290e115]: 半难挖掘要求定期（每 ~100 步）重算全部样本嵌入、重新挑负样本——训练管线多了一个调度环节。这是 triplet 系方法的固有税，后来的 Proxy-NCA/ArcFace 用代理点绕开了它。
