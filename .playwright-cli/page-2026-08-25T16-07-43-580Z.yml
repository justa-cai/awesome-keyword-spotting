- generic [ref=f290e2]:
  - generic [ref=f290e3]: 论文精读 · 可视化版 · 2021 №16
  - heading "换唤醒词不用重训： 新词只是嵌入空间里的一个新坐标" [level=1] [ref=f290e4]: 换唤醒词不用重训：新词只是嵌入空间里的一个新坐标
  - generic [ref=f290e5]:
    - generic [ref=f290e6]: Triplet Loss KWS · 托木斯克国立大学 + NTR Labs
    - generic [ref=f290e7]: arXiv 2101.04792 · FaceNet 式度量学习进 KWS
    - generic [ref=f290e8]: 三元组 + 半难负样本挖掘 + 原型匹配
    - generic [ref=f290e9]: 新词 5–10 样本 → 85–90% · 开集 EER 3–5%
  - generic [ref=f290e10]: 一句话：分类式 KWS 的词表焊死在输出层——加词、删词、自定义词都要重训整个模型。本文把人脸识别的 triplet loss 系统搬进 KWS：DS-CNN 骨干学一个嵌入空间（同词靠近、异词远离、L2 归一化到单位球），新关键词 = 几个样本的嵌入均值（原型），推理比距离即可——零重训。12 类约 94–95%（比 CE 低约 1 个点，买的是换词自由），开集验证 EER 3–5%，5–10 个新词样本即达 85–90%。
  - generic [ref=f290e11]:
    - generic [ref=f290e12]: TL;DR
    - listitem [ref=f290e13]: ◈ 分类模型的硬边界：输出类别数固定——厂商加新唤醒词、用户自定义词、多语言扩展全都卡在「重训整个模型」这一步。度量学习把问题改写：学空间而不是学分类头。
    - listitem [ref=f290e14]: ◈ 三元组损失：L = max(0, d(a,p) − d(a,n) + margin)——锚点与同词样本的距离加上 margin 后仍小于与异词样本的距离则零损失，否则推动类内收紧、类间拉开。margin 甜点 0.3（0.2 间隔不够、0.5 多数三元组满足不了）。
    - listitem [ref=f290e15]: ◈ 半难负样本挖掘是训练成败的关键：随机负样本大多太远（损失为零、无信号）；半难负样本（比正样本远但在 margin 带内）信号最强又不像最难负样本那样让训练不稳——比随机策略高 2–3%。每 ~100 步重挖一次。
    - listitem [ref=f290e16]: ◈ 架构：DS-CNN 风格骨干（标准卷积起手 + DS 块 + GAP）→ FC 投影到 D 维 → L2 归一化到单位球（欧氏 ≡ 余弦，还 +1% 与更稳训练）。
    - listitem [ref=f290e17]: ◈ 两种推理形态：闭集分类（最近原型）与开集验证（最近原型距离 < θ 判该词，否则「未知」）——后者才是 KWS 的真形态（非词表输入要能拒识）。
    - listitem [ref=f290e18]: ◈ 结果（约值）：12 类 94–95%（CE 95–96%）；35 类 92–93%；类内距离 0.3–0.4 vs 类间 0.8–1.0（清晰分离）；嵌入维度甜点 64–128（32 容量不足、256 只多 <0.5%）。
    - listitem [ref=f290e19]: ◈ 新词适配（核心卖点）：5–10 个样本算原型 → 85–90% 检测准确率，全程不动嵌入网络；建议每词 10–20 个不同说话人的样本做原型更稳。
    - listitem [ref=f290e20]: ◈ 代价与边界：闭集精度比 CE 低约 1 个点；三元组训练对超参敏感（可能坍缩）；声学近邻词（yes/yeah、on/off）拉不开间隔；距离无概率含义（校准负担）；推理 O(K·D) 随词表涨。
  - heading "§01 问题：词表焊死在输出层" [level=2] [ref=f290e21]:
    - generic [ref=f290e22]: §01
    - text: 问题：词表焊死在输出层
  - generic [ref=f290e23]: 改词 = 重训的三重痛
  - generic [ref=f290e24]:
    - generic [ref=f290e25]:
      - heading "加词删词都要重训" [level=3] [ref=f290e26]
      - paragraph [ref=f290e27]: 分类 KWS 的输出节点数 = 词表大小——厂商上新唤醒词、用户自定义个性化词、多语言扩展，每次都要重新训练和部署整个模型。迭代节奏被训练周期绑架。
    - generic [ref=f290e28]:
      - heading "语音的高变异性" [level=3] [ref=f290e29]
      - paragraph [ref=f290e30]: 同一个关键词在不同说话人、语速、噪声条件下差异巨大——嵌入空间必须在容纳这些变化的同时保持类内紧凑；还要支持音素级精细区分（yes 与 yeah 只差尾音素）。
    - generic [ref=f290e31]:
      - heading "度量学习的改写" [level=3] [ref=f290e32]
      - paragraph [ref=f290e33]: 不学「类别 → 节点」而学「样本 → 坐标」：同词样本在嵌入空间聚成簇、异词远离。新词 = 簇中心（原型），加词变成加坐标——模型本身不变。
    - generic [ref=f290e34]:
      - heading "来自人脸识别的成熟方案" [level=3] [ref=f290e35]
      - paragraph [ref=f290e36]: triplet loss 在 FaceNet 上已大获成功——人脸识别同样要「同身份靠近、异身份远离 + 新身份免重训注册」，与 KWS 的新词适配需求同构。本文的工作是系统适配而非发明。
