  - generic [ref=f290e261]:
    - generic [ref=f290e262]:
      - generic [ref=f290e263]: "1"
      - paragraph [ref=f290e264]: 三元组损失在 KWS 的系统应用：架构、训练策略、负样本挖掘、空间分析的完整方案——不是单点技巧而是一套可复用的配方。
    - generic [ref=f290e265]:
      - generic [ref=f290e266]: "2"
      - paragraph [ref=f290e267]: 换词免重训的灵活性证明：简单原型计算即可添加新关键词，无需改动嵌入网络——为快速定制提供实用方案。
    - generic [ref=f290e268]:
      - generic [ref=f290e269]: "3"
      - paragraph [ref=f290e270]: 分类与验证双支持：嵌入空间同时服务闭集分类（最近原型）与开集验证（阈值判断）——覆盖 KWS 的两种核心需求。
    - generic [ref=f290e271]:
      - generic [ref=f290e272]: "4"
      - paragraph [ref=f290e273]: 嵌入维度系统分析：32→256 的扫描给出 64–128 甜点——容量够放词表结构即可，更高只买开销。
    - generic [ref=f290e274]:
      - generic [ref=f290e275]: "5"
      - paragraph [ref=f290e276]: 半难负样本挖掘的验证：比随机策略 +2–3%——确认挖掘策略对 KWS 三元组训练至关重要。
