  - generic [ref=f290e253]:
    - generic [ref=f290e254]: 读表要点
    - listitem [ref=f290e255]: ◈ 嵌入空间的健康证据：类内距离 0.3–0.4 vs 类间 0.8–1.0——两个分布明显分离；t-SNE 上高频词（yes/no/up/down）簇最紧凑，go/no 簇近但可分。
    - listitem [ref=f290e256]: ◈ 校准是被低估的痛点：softmax 输出天然带概率含义，距离没有——θ 的选择完全依赖验证集调优，换场景可能要重调。这是所有距离判别系统的共同软肋。
    - listitem [ref=f290e257]: ◈ 词表规模的隐性账：推理要跟全部 K 个原型算距离（O(K·D)）——词表超百词后这本身成为开销项，与分类头 O(D) 的单次前向不同。
