  - generic [ref=f290e306]:
    - generic [ref=f290e307]: 可迁移判断
    - paragraph [ref=f290e308]: ↳ 新词是坐标不是输出节点：把分类改写成距离匹配后，加类别的成本从「重训」降到「求均值」——凡是词表/类表频繁变动的系统（自定义命令、多语言、个性化），都该认真评估这 1 个点的精度税值不值。
    - paragraph [ref=f290e309]: ↳ 训练信号密度决定度量学习成败：随机负样本让 99% 的三元组零损失——挑「差点违规」的样本训练才有信息。半难挖掘的原则（挑边界样本）与 AUC 优化的成对采样、主动学习的不确定性采样同源。
    - paragraph [ref=f290e310]: ↳ L2 归一化是小动作大收益：一行代码换来度量等价（欧氏=余弦）+ 1% 准确率 + 训练更稳——嵌入学习的默认第一步应该是把表示钉到单位球上。
    - paragraph [ref=f290e311]: ↳ 距离的校准是隐藏成本：softmax 有概率含义、距离没有——开集部署时要为阈值调优单独立项。选度量学习方案前，把「θ 怎么定、多久重定」写进工程预算。
