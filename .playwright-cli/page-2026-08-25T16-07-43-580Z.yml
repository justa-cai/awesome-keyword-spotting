      - generic [ref=f290e155]: · 原型质量：每词建议 10–20 个样本（不同说话人）——样本多样性显著影响原型代表性；
      - generic [ref=f290e156]: 新词 5–10 个样本即可得到 85–90% 的检测准确率
      - generic [ref=f290e157]: · t-SNE 证据：类别成清晰簇；yes/no/up/down 等高频词最紧凑；go/no 的簇近但可分
      - generic [ref=f290e158]: · 距离分布：类内 0.3–0.4 vs 类间 0.8–1.0——明显分离（margin=0.3 间隔 0.4–0.6）
      - generic [ref=f290e159]: 左：三元组要求负样本比正样本至少远一个 margin——margin 是类间隔的最低保证。右：随机负样本大多太远（零损失无信号），半难负样本恰好贴着间隔边界——信号最强又不 destabilize
