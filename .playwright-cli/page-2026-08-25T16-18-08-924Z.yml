    - listitem [ref=f293e260]: ◈ 0.5–1.5% 的增益幅度不大，但「2% 参数 + 可忽略延迟 + 跨架构一致 + 可与 SE 叠加」四个性质合起来就是工程上「无脑加」的模块——这类小额稳定收益在端侧累积价值高于单点大幅提升。
