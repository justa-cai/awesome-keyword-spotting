  - heading "§02 方法：调系数不生核" [level=2] [ref=f293e100]:
    - generic [ref=f293e101]: §02
    - text: 方法：调系数不生核
  - generic [ref=f293e102]: 数量级之差 · 三个消融甜点
  - generic [ref=f293e103]:
    - generic [ref=f293e104]: "条件网: s = GAP(X) → w = σ(W₂·δ(W₁·s)) # FC(C→C/r)→ReLU→FC(C/r→C)→Sigmoid 输出: Y = f(X) ⊙ w # 主分支卷积 × 通道调制 参数: 2·(C/r)·C （r=4） # vs 生成核的 C_out×K_t×K_f×C_in —— 差数个数量级"
    - generic [ref=f293e105]: 人话：生成整套核要付「第二个卷积层」的价格；只生成 C 个 0–1 之间的系数只付两个小 FC。主分支的表达力原样保留——LDF 买到的不是更强的卷积，而是「这套卷积对不同输入的输出该放大还是抑制」的判断。
  - generic [ref=f293e106]:
    - generic [ref=f293e107]:
      - heading "中间层最好的直觉" [level=3] [ref=f293e108]
      - paragraph [ref=f293e109]: 前端特征太原始（调不动）、后端特征太抽象（调不动了）——中间层特征已成形但未过度压缩，「看得到内容又改得动表示」。这与 STCNN、时序 Lambda 等注意力/全局模块的插入位置结论完全同构：中间层是自适应操作的黄金窗口。
    - generic [ref=f293e110]:
      - heading "叠加增益的启示" [level=3] [ref=f293e111]
      - paragraph [ref=f293e112]: LDF 与 SE 结构几乎相同却可叠加——说明「重标定已有特征」（SE 视角）与「条件化滤波行为」（LDF 视角）虽然实现重合，但训练动力学让两者收敛到不完全相同的调制模式——命名与动机影响学到的东西。
