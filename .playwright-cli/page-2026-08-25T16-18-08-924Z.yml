  - generic [ref=f293e305]:
    - generic [ref=f293e306]: 可迁移判断
    - paragraph [ref=f293e307]: ↳ 自适应可以是免费的：把「生成整套权重」降级为「生成调制系数」，参数差几个数量级——预算受限时先问「自适应的最小可行形式是什么」，往往缩放系数就够了。
    - paragraph [ref=f293e308]: ↳ 输入差异越大，廉价自适应的期望收益越高：干净单说话人数据集是自适应最没用的场景——验证自适应机制应主动选择分布多样的测试集（噪声/说话人/域漂移），否则是在主场缺席的情况下打分。
    - paragraph [ref=f293e309]: ↳ 中间层是自适应操作的黄金窗口：LDF 的位置消融与注意力插入位置、多尺度融合的结论第三次同构——「特征已成形且未过度抽象」的层间位置值得作为默认假设。
    - paragraph [ref=f293e310]: ↳ 结构相同的模块可能学到不同的东西：LDF 与 SE 结构几乎一致却能叠加——动机与命名影响训练收敛的位置；两个「等价」模块叠加有增益时，说明该表示空间还有未被利用的自由度。
