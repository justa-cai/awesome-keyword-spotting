    - generic [ref=f293e273]:
      - generic [ref=f293e274]: "3"
      - paragraph [ref=f293e275]: 验证输入自适应对 KWS 有益：极小条件网络实现的简单自适应也带来可观提升——确认了 KWS 中自适应处理的必要性。
    - generic [ref=f293e276]:
