- generic [ref=f293e2]:
  - generic [ref=f293e3]: 论文精读 · 可视化版 · 2021 №17
  - heading "卷积权重不必人人相同： 只花 2% 参数让滤波器跟着输入走" [level=1] [ref=f293e4]: 卷积权重不必人人相同：只花 2% 参数让滤波器跟着输入走
  - generic [ref=f293e5]:
    - generic [ref=f293e6]: Lightweight Dynamic Filter · 韩国大学 + 德雷塞尔大学
    - generic [ref=f293e7]: arXiv 2109.11165 · 即插即用模块
    - generic [ref=f293e8]: 双分支分解：主分支卷积 + 条件网调制
    - generic [ref=f293e9]: GSC 12 类 95.6%（DS-CNN +1.3）· 参数 +2%
  - generic [ref=f293e10]: 一句话：静态卷积「一刀切」——同一组权重要应付所有说话人、所有噪声条件；动态滤波器能按输入生成权重，但现有方法的条件网络本身就要生成完整卷积核，轻量 KWS 用不起。LDF 把问题降级：不生成核，只生成 C 个 Sigmoid 调制系数（条件网仅两个小 FC，GAP 通道统计作输入），对主分支卷积输出做逐通道调制——参数只加约 2%，DS-CNN 与 BC-ResNet 上均提升 0.5–1.5%，且与 SE 可叠加。
  - generic [ref=f293e11]:
    - generic [ref=f293e12]: TL;DR
    - listitem [ref=f293e13]: ◈ 静态滤波的局限：权重训练后固定——说话人（男/女/成人/儿童/口音）、环境（安静/嘈杂/近场/远场）、不同关键词的声学分布各异，一组滤波器难以同时照顾。
    - listitem [ref=f293e14]: ◈ 现有动态滤波的墙：CondConv/DynamicConv 一类要按输入生成完整卷积核（C_out×K_t×K_f×C_in 个参数）——条件网络等于第二个卷积层，参数量随核大小爆炸。
    - listitem [ref=f293e15]: ◈ LDF 的降级设计：双分支分解——主分支照常做 DS 卷积；动态分支用通道统计（GAP）经两个小 FC（r=4 压缩）生成 C 个 Sigmoid 系数，对卷积输出逐通道调制。参数 2·(C/r)·C，约整网 2%。
    - listitem [ref=f293e16]: ◈ 数学：s = GAP(X)；w = σ(W₂·δ(W₁·s))；Y = f(X) ⊙ w——「自适应」只发生在缩放上，不触碰卷积核本身。
    - listitem [ref=f293e17]: ◈ 即插即用：不改基础架构，可插进任何轻量 KWS CNN。消融位置：中间层最好（前端/后端次之）；2–3 层联用最佳，超过 3 层递减；GAP 统计优于原始特征图作条件输入。
    - listitem [ref=f293e18]: ◈ 与 SE 的关系最有意思：结构上几乎相同（GAP→瓶颈 FC→Sigmoid→逐通道缩放），视角不同（通道注意力 vs 输入自适应滤波）——效果相当或 LDF 略优，且两者叠加仍有增益（自适应维度不完全重叠）。
    - listitem [ref=f293e19]: ◈ 结果（约值）：DS-CNN + LDF 达 95.6%（+1.3）；BC-ResNet 等各架构一致 +0.5–1.5%；参数 +2%、推理延迟额外计算可忽略——自适应能力在这个设计下几乎免费。
    - listitem [ref=f293e20]: ◈ 最大遗憾：噪声/远场没测——输入自适应的真正主场恰恰是多样化声学条件（输入差异大时调制才更有用），论文只交了干净 GSC 的答卷。
  - heading "§01 问题：一刀切的滤波器 vs 用不起的动态" [level=2] [ref=f293e21]:
    - generic [ref=f293e22]: §01
    - text: 问题：一刀切的滤波器 vs 用不起的动态
  - generic [ref=f293e23]: 静态的局限 + 动态的代价
  - generic [ref=f293e24]:
    - generic [ref=f293e25]:
      - heading "静态滤波的一刀切" [level=3] [ref=f293e26]
      - paragraph [ref=f293e27]: 权重训练后对所有输入一视同仁——儿童的尖细嗓音和成人的低沉嗓音、安静与嘈杂环境，都过同一组滤波器。模型被迫学「平均最优」而非「各自最优」。
    - generic [ref=f293e28]:
      - heading "动态滤波的参数爆炸" [level=3] [ref=f293e29]
      - paragraph [ref=f293e30]: 生成完整卷积核意味着条件网络的输出维度 = 核参数量——对 KWS 的小模型来说等于把参数量翻倍以上。「按输入定制滤波器」的理想撞上预算的现实。
    - generic [ref=f293e31]:
      - heading "降级的关键洞察" [level=3] [ref=f293e32]
      - paragraph [ref=f293e33]: 自适应不必发生在「核的形状」上，可以发生在「响应的强度」上——保留静态卷积的全部表达力，只按输入调各通道的音量。调音量只需要 C 个系数。
    - generic [ref=f293e34]:
      - heading "为什么通道统计够用" [level=3] [ref=f293e35]
      - paragraph [ref=f293e36]: 条件输入用 GAP 的通道统计（丢弃位置信息）优于原始特征图——「调音量」不需要知道哪个位置响，只需要知道整体频谱轮廓。信息需求与任务需求匹配。
