  - generic [ref=f53e84]:
    - generic [ref=f53e85]: "02"
    - heading "机制：不平衡的几何解法" [level=2] [ref=f53e86]
    - paragraph [ref=f53e87]: 把嵌入空间画出来就明白这个任务的形状：关键词是两个紧簇（每类几条样本抱团，原型是中心），非关键词是海量散布的灰云——任务不是「把灰点分对」，而是把词簇从灰云里拉出来。度量学习整理这个几何（类内紧 + 类间开 + 与灰云拉开），原型给出分类锚点，迁移提供初始的好几何。
    - img [ref=f53e88]:
      - generic [ref=f53e90]: 机制解剖：不平衡的几何解法 · 三技分工图
      - generic [ref=f53e91]: 嵌入空间（示意）
      - generic [ref=f53e98]: 关键词 A
      - generic [ref=f53e104]: 关键词 B
      - generic [ref=f53e135]: 灰色 = 非关键词帧（海量·散布）
      - generic [ref=f53e136]: 关键不是分对灰点——是把非关键词推开
      - generic [ref=f53e137]: 不平衡为什么难 + 怎么破
      - generic [ref=f53e139]: <1% 帧是关键词意味着什么：
      - generic [ref=f53e140]: · 标准分类器学「全预测非关键词」
      - generic [ref=f53e141]: 就能拿 99% 准确率——但 F1 = 0
      - generic [ref=f53e142]: · 准确率在此彻底失真——必须看 F1
      - generic [ref=f53e143]: 度量学习的破法：
      - generic [ref=f53e144]: · 不是「分类」而是「整理空间」——
      - generic [ref=f53e145]: 关键词各自抱团 + 与非关键词云拉开
      - generic [ref=f53e146]: · 原型代表类中心——新样本看距离
      - generic [ref=f53e147]: · 极端不平衡下，几何可分性比决策边界
      - generic [ref=f53e148]: 更稳健
      - generic [ref=f53e149]: 迁移学习的破法：
      - generic [ref=f53e150]: · 预训练嵌入自带声学结构——少样本
      - generic [ref=f53e151]: 不用从零学「语音长什么样」
      - generic [ref=f53e152]: 左：关键词是两个紧簇（原型=三角），非关键词是海量散布的灰云——任务是把词簇从灰云里拉出来。右：不平衡下准确率失真（全负也 99%），几何可分性才是稳健的目标
    - generic [ref=f53e153]: 图 2 · 机制解剖：嵌入空间的形状 · 极端不平衡为什么难以及怎么破
    - generic [ref=f53e154]:
      - generic [ref=f53e155]: "原型: p_c = (1/|S_c|)·Σ f_φ(x_i) ← 支持集均值 分类: p(y=c|x) = softmax(−d(f_φ(x), p_c)) ← 距离就近 度量: L_metric 拉近同类 · 推开异类 ← 空间结构(与原型损失互补) 迁移: f_φ ← 预训练声学模型初始化 → CSKS 微调 ← 少样本的强起点"
      - generic [ref=f53e156]: 人话：先借用别人练好的「耳朵」（预训练迁移），再用几何规则整理空间（度量学习）——同样的词挤在一起、不同的词分开、背景噪声甩远；每个词挂一个中心牌（原型），新来的音频看离哪个牌近。
    - paragraph [ref=f53e157]: 为什么几何可分性比决策边界稳健：极端不平衡下，分类器的决策边界会被负类淹没（学出「全负」的平凡解）；而度量学习的目标是空间结构——正类抱团的几何不受负类数量级的影响，不平衡对「整理空间」的伤害远小于对「画边界」。
