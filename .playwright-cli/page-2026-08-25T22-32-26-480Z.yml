    - generic [ref=f53e14]: "01"
    - heading "问题：CSKS 比孤立 KWS 难一个维度" [level=2] [ref=f53e15]
    - generic [ref=f53e16]:
      - generic [ref=f53e17]: TL;DR
      - list [ref=f53e18]:
        - listitem [ref=f53e19]: ◆ 传统 KWS 研究在切好的孤立片段上做分类（「这段是哪个词」）；真实更有价值的是 CSKS——连续对话流里检测嵌入的关键词（「有没有、在哪」），是开放集检测而非封闭集分类。
        - listitem [ref=f53e20]: ◆ 两个核心挑战：训练数据稀缺（连续语音关键词标注昂贵、少样本）+ 极端类别不平衡（关键词帧 <1%——标准分类器学「全预测非关键词」就能拿 99% 准确率而 F1=0）。
        - listitem [ref=f53e21]: ◆ 三件套解法：原型网络（支持集均值立原型、距离分类——少样本的有效机制）、度量学习损失（拉近同类推开异类——空间结构）、迁移学习（预训练声学模型打底——强起点）。
        - listitem [ref=f53e22]: ◆ 组合 F1 超简单基线 10%+；原型+度量 > 仅原型（度量损失的独立贡献）；迁移比从头训练收敛快且终态高。
