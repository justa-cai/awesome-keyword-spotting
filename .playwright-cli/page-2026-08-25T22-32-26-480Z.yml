      - paragraph [ref=f53e285]: ① 极端不平衡下，准确率失真，几何可分性才是稳健目标。
      - generic [ref=f53e286]: ↳ <1% 正例时「全预测负」就有 99% 准确率——先问「正例占多少」再选指标（F1/PR-AUC）；再把目标从「画决策边界」改成「整理空间」——度量学习对不平衡的抵抗力天然更强。
      - paragraph [ref=f53e287]: ② 预训练 + 度量是少样本任务的标准起手式。
      - generic [ref=f53e288]: ↳ 起点靠迁移、结构靠度量、分类靠原型——三段式各管一段、可独立替换升级（后来 XLSR 把「迁移」换成更强预训练，收益立现）；从零训练少样本模型等于放弃前人全部声学知识。
      - paragraph [ref=f53e289]: ③ 任务性质决定方法：封闭集分类 vs 开放集检测要分开处理。
      - generic [ref=f53e290]: ↳ 「这段是哪个词」与「这段流里有没有词、在哪」是不同任务——切好片段的分类指标不能代表连续流的检测能力；做检测研究先在真实连续流上评估（CSKS 视角），否则结论外推有险。
    - paragraph [ref=f53e291]: "系列坐标：少样本 KWS 时间线的最早节点之一——本文（2019.01）把原型+度量+迁移的组合带进 CSKS；2020 年 #7 ProtoNet（孤立片段情景训练）与 #11 度量学习（代理损失+角度边际）相继深化，2021 年 XLSR 把「迁移」一环升级到强预训练，2026 年 EdgeSpot 落地端侧——谱系主线是嵌入空间质量的持续升级，本文是最早把这条线串起来的一批工作。"
