        - heading "一分钟版本" [level=2] [ref=f75e26]
        - list [ref=f75e27]:
          - listitem [ref=f75e28]: 痛点：可定制唤醒词系统训练时不知道上线检测什么词——开放词表从数据问题变成表示学习问题。连续语音再叠加两个孤立词场景没有的麻烦：共发音（前一词尾部拼唤醒词头部，声学上极像但文本不是）和流式切分错位（半个词的片段从未以负例身份出现过）。误报代价远高于漏报——半夜音箱自己醒一次比没听到呼唤糟糕得多。
          - listitem [ref=f75e29]: 核心主张：纯音频-文本匹配只有单路监督——文本嵌入知道目标词怎么念，不知道音频流里哪些片段念起来像它；误报由音频空间内部的歧义引起，必须加一路音频-音频判别。
          - listitem [ref=f75e30]: 方法（CLAD）：按「重叠率」切正负段——错位滑窗、跨词拼接这两类最难负例变成可批量生成的训练资源；损失 = 音频-文本 InfoNCE + 0.15×音频-音频 InfoNCE（同词不同发音变体聚拢、相似异词段推开）。
          - listitem [ref=f75e31]: 孤立场景（LibriPhrase）：InfoNCE 对 Triplet/SoftTriple 碾压（易负例 EER 8.99% 对 32.75%/28.74%）——此前瓶颈一半在损失形式；CLAD 再把难负例 EER 压到 30.30%（基线 32.90%）。
          - listitem [ref=f75e32]: 连续场景：test-other（带噪）全部七档词数第一（5 词时 +5.8 点）；test-clean 词数 ≥20 也全面反超；词数 15→50 图搜索掉 5.1 点、CLAD 只掉 2.6——表示匹配泛化衰减更平缓。
          - listitem [ref=f75e33]: 速度：砍掉搜索模块，相对图搜索 16.95×、相对后验处理约 45×。边界：test-clean 少量高频词（5/10/15 词）仍输图搜索——高频词显式解码路径能被充分打磨；双向编码器 + 半重叠滑窗的长词延迟与计算冗余未讨论。
