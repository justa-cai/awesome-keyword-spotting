          - list [ref=f75e273]:
            - listitem [ref=f75e274]: 双向编码器 × 流式性张力：每个段必须等右端点数据到齐，段长随音素数线性增长——长关键词判定延迟随之增大；未讨论单向化 / 因果化替代方案，未报告端到端延迟预算。
            - listitem [ref=f75e275]: 半重叠的计算冗余：约一半帧被重复编码；重叠率取 1/2 未经消融论证。
            - listitem [ref=f75e276]: 文本侧细节披露不足：音素化工具、文本编码器输入形式（音素 / 字符序列）、出错词处理均未说明——声调语言复现需自行补全。
            - listitem [ref=f75e277]: 高频词场景仍输图搜索（0.915/0.927/0.944 对 0.943/0.948/0.958）：关键词固定且高频的产品形态里两阶段仍有优势。
            - listitem [ref=f75e278]: 超参经验化且绑定单一数据域：温度 / 权重 / 余量均在 LibriSpeech 上选定且无敏感性分析。
        - generic [ref=f75e279]:
          - heading "实验设计不足" [level=4] [ref=f75e280]
          - list [ref=f75e281]:
            - listitem [ref=f75e282]: 数据域单一：全部 LibriSpeech 系朗读有声书；test-other 只是有噪朗读，不是真实远场 / 多人交谈 / 电视噪声 / 回声；无声调语言验证——文本注册对发音转换质量敏感，声调是额外变量。
            - listitem [ref=f75e283]: 误报统计样本量有限：约 3 h 误报集 + 2 次误报约束，天然方差偏大；「标准差更低」的稳定性主张无具体数值表。
            - listitem [ref=f75e284]: 缺绝对效率数据：只有相对倍数，无绝对延迟 / 实时率 / 功耗 / 实测硬件数字；两阶段基线的解码图规模与实现未披露，速度对比公平性只靠「同一声学模型」背书。
            - listitem [ref=f75e285]: 消融覆盖窄：只验证了音频判别项开关。
            - listitem [ref=f75e286]: 缺同期强基线：音素引导零样本、匹配潜在编码等同类文本注册方法只在引言出现，未进实验表。
      - generic [ref=f75e287]: 值得追的方向：① 真远场 + 多语种（声调语言的文本编码适配本身可发表）；② 单向循环 / 因果注意力 + 段内增量编码，压判定延迟（与训练准则正交可直接叠加）；③ 在线难负例挖掘 + 难度课程化调度（固定 0.15 变动态）；④ 与两阶段级联——表示匹配做第一级高召回筛选、轻量解码做二级确认，可能是最务实的落地形态；⑤ 嵌入空间「发音相似簇」几何结构反哺注册（提示用户所选词与哪些高频词易混）+ TTS 多说话人注册增强；⑥ 多关键词并发与集内互斥约束——音频-音频判别天然可改造为「集内各词嵌入彼此推开」，是双准则尚未兑现的潜力。
