      - heading "损失形式是半个瓶颈；难声学条件是双准则主场" [level=2] [ref=f75e114]
      - generic [ref=f75e116]: 双场景交叉验证的实验设计（亮点）：LibriPhrase 孤立词（460 h 重训，与前人直接可比，保性能下限）+ LibriSpeech 连续语音（960 h 全量训练，主战场）——先证明新方法没丢旧场景能力，再证明旧方法在新场景确实不行。连续场景协议：test-clean / test-other 各选 5→50 个最常见且 ≥6 音素的词，非关键词音频约 3 h 作误报集，固定误报 2 次下报微平均查全率——直接对齐产品逻辑（误报预算内比较才有意义）。词数梯度设计有讲究：少词 = 考高频词建模，多词 = 考任意词泛化，对可定制系统两者同等重要。
