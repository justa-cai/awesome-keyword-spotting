      - paragraph [ref=f175e15]: 作者：Kumari Nishu、Minsik Cho、Paul Dixon、Devang Naik —— Apple（同团队后续做了本库 2024 №34 SLiCK）
      - paragraph [ref=f175e16]: 发表：arXiv 2308.06472（2023-08）· Libriphrase LE/LH + SC-V1 零微调 · CED 全模型 3.8M
      - generic [ref=f175e17]:
        - generic [ref=f175e18]: 文本注册（打字即注册）
        - generic [ref=f175e19]: P2V 非参数查表：零投影零新增
