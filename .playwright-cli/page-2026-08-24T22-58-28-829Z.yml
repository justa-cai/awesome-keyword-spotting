      - generic [ref=f175e24]:
        - heading "一分钟版本" [level=2] [ref=f175e25]
        - list [ref=f175e26]:
          - listitem [ref=f175e27]: 注册方式是设计的分水岭：语音注册（QbE）要求用户亲口朗读（嘈杂环境注册质量差）、DTW 逐窗序列对齐端侧开销大、注册音频质量封死系统上限；文本注册界面友好且与低功耗流式检测兼容（注册算一次嵌入即缓存，推理路径上逐帧计算的只有音频侧）。但文本注册的双编码器路线背着两块包袱：模态异构的嵌入失配（两个独立训练的编码器处于完全不同的空间，投影层是事后补救、残差失配无法根除）与文本编码器的体积（基线用 DistilBERT 66M——比很多端侧 KWS 整模型大一个量级）。
          - listitem [ref=f175e28]: 核心洞察：让文本与音频天然同空间（homogeneous）。音频编码器（conformer 6 层 d=144）先用 CTC 音素预测任务训练——嵌入空间被强制按音素组织（每帧嵌入都对某个音素有预测力）；随后在 Libriphrase 上取 CER=0 的 ~50K 样本，贪心解码出帧-音素区间、区间平均得局部向量、跨样本平均得全局向量——74 个音素各一个 144 维向量 = P2V 查表（≈42KB，零可训练参数）。文本链路 = G2P（0.83M 预训练）+ 查表——文本嵌入不是被投影进音频空间的客人，而是从音频空间里长出来的原生居民。
          - listitem [ref=f175e29]: 验证器的时序先验：音频嵌入 × 文本嵌入的余弦矩阵在正样本对上呈单调阶梯状对齐（一个音素关联连续音频帧——CTC 帧级预测的结构性质）；用 DSP 求对齐路径并 mask 掉其余部分——注入「语音按顺序说出」先验（不 mask 则音素集合相同顺序不同的变位词无法区分）；掩码矩阵聚合 → 单层 GRU → 匹配分数。
          - listitem [ref=f175e30]: "误触发的疫苗：混淆关键词自动生成。灵活 KWS 无固定类别、用户词大量未见——模型对音素混淆（误触发主因）的免疫力无从谈起；按音素编辑距离 δ∈{1,2,3} 自动构造难负样本（替换 / 插入；新音素须与相邻三位置都不同——否则编辑无操作或被发音吞掉；δ 封顶 3——编辑越大负样本越「容易」），配合三路批构造：正样本 / 随机负 / 同一段音频配混淆文本的对比负——模型被逼着在 stop 与其音素近邻间画边界。"
          - listitem [ref=f175e31]: 结果：LH（难负对，核心战场）AUC 84.21→92.7（相对 +10.1%）、EER 23.36→14.4（相对 −38.3%）；LE EER 相对降 76.9%；SC-V1 零微调（P2V 与编码器都没为命令词做过任何适配）AUC +15.9%、EER −50.6%——同构嵌入的音素结构有跨域稳健性；文本分支缩 ~80 倍（66M → 0.83M + 42KB），CED 全模型 3.8M。
          - listitem [ref=f175e32]: 消融最有信息量的读数：混淆模块的收益与测试集负样本难度同源——LH（负对本就是发音相近难样本）ΔEER −4.0 收益最大，G 小幅 −0.60，LE 反而 +0.9 轻微退化（易分集已近满分，合成难负把决策边界推向保守，付出精度换鲁棒——论文未讨论此权衡）。
          - listitem [ref=f175e33]: 冻结的代价（以冻结换稳定）：端到端阶段音频编码器永久冻结——P2V 表从该编码器空间统计而来，权重一更新整张表就过期、同构性破产；代价是音频表示无法面向验证目标做任务适配，音频侧的不足（如特定口音的音素预测偏差）原样传导进 P2V 与最终分数。
          - listitem [ref=f175e34]: 边界：G2P 是文本链路唯一入口且推理时无纠错——异读词 / 专名 / 缩写 / 非标准拼写的发音错误直接变错误音素序列；GV 跨 5 万样本平均抹掉协同发音（OW0/OW1/OW2 重音变体类间更近）——强上下文依赖最小对只能靠验证器兜底；混淆生成只有替换 / 插入无删除、均匀采样不反映真实混淆概率、只在音素符号层扰动；数据全在 LibriSpeech 派生（无真实远场 / 噪声 / 多说话人注册）；延迟 / RTF / 内存 / 包体积全未报告（参数量是轻量化的唯一直接证据）；无统计稳健性报告。
