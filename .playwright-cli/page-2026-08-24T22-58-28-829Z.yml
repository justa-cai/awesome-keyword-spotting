      - heading "三个必须同时解开的扣子" [level=2] [ref=f175e37]
      - generic [ref=f175e39]: 设计空间：① 文本嵌入与音频嵌入天然同空间——从根上消除投影层与跨模态失配而非事后投影去补；② 文本分支极致轻量（理想零新增参数）——匹配端侧包体积与内存约束；③ 无固定类别、大量关键词未见的设定下获得音素混淆判别力把误触发压下去。三者的共同解法 = 音频同构文本编码器 + 混淆关键词生成。注意误触发问题在固定 KWS 里天然不存在——类别固定可在训练里获得类别间判别边界；灵活 KWS 模型内部没有类别，混淆免疫力无从谈起。
