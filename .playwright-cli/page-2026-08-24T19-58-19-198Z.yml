      - heading "说话人相关 + 超低资源 + 易混淆负样本" [level=2] [ref=f116e35]
      - generic [ref=f116e37]: 三条既有路线的失效：① 语音修复（cycle GAN / VAE 把构音障碍语音修成正常语音）——随严重程度递增效果递减（重度变异幅度大、映射难收敛）；② 个性化模型（Parrotron 系列）——受制于个人样本量太小；③ 数据增强 / 自监督——有改善但针对一般 DSR 未触及唤醒词结构。任务刁钻处：负样本与唤醒词同一语义场（固定命令词、家具描述、电视控制、数字、交互语句）——不是「任意语音中找词」而是「易混淆指令中找唤醒词」。四个子问题：17h 超低资源下建模高变异空间（本质是通用先验迁移）；压 FAR 不牺牲 FRR（两者天然跷跷板）；让面向正常语音的 Paraformer 适配构音障碍域；每人每词 5 条注册数据如何榨取而不过拟合（本文答案：合并全部注册集微调——让人与人之间的变异模式互相共享，靠容量与增广泛化到个人）。
