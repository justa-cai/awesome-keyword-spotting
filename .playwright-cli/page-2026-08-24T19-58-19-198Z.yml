        - paragraph [ref=f116e86]: 图 A·为什么多任务有效：唤醒词的监督是词级稀疏信号；CTC 提供字符级逐帧对齐压力，强迫编码器把模糊的构音障碍声学帧映射到正确字符序列——ASR 任务做结构化正则。为什么最大池化：唤醒词只占音频一小段，平均会稀释高置信帧，取最大值贴合「检测」形态并与负样本挖掘配合。为什么 CTC 适配构音障碍：不需帧级对齐（blank + 重复折叠）——恰对构音障碍「对齐信息不可靠」的现实。双轨学习率：新头 0.001（450 步达峰）、预训练部分 0.00005（1600 步达峰）——低 20 倍保护性微调，防灾难性遗忘。
