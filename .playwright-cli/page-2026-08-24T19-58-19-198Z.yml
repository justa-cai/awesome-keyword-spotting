      - generic [ref=f116e24]:
        - heading "一分钟版本" [level=2] [ref=f116e25]
        - list [ref=f116e26]:
          - listitem [ref=f116e27]: 场景的双重残酷：构音障碍（帕金森 / 脑瘫 / ALS 等损害言语肌肉控制——发音不准、语速不规律、节奏破坏、清晰度下降）患者的唤醒失败不是体验问题而是整个语音交互通道被关闭；而恰恰是行动不便的他们最需要免手持交互。数据更残酷：挑战赛首发语料仅 18,630 条 / 17 小时（构音障碍组 9.4h / 21 人），每人每词仅 5 条注册录音。
          - listitem [ref=f116e28]: 范式改写：从零训练的小模型（官方基线 4 层 DS-TCN）在 17h 上容量与构音障碍的高变异空间严重不匹配（test-A 总分 0.3112，FRR 0.2725 ≈ 三次唤醒失败一次）；本文把问题改写为「3 亿参数自监督预训练模型的域适配」——预训练 d2v2 总分 0.0343（不到基线 1/9）；Conformer 对照（0.1008）隔离出差距来自预训练先验 + ASR 辅助监督而非架构本身。
          - listitem [ref=f116e29]: 三大件：① 2branch-d2v2——共享编码器 + WWS 头（最大池化损失）+ ASR 头（CTC），L = 0.5·L_CTC + 1.0·L_WWS，用字符级逐帧对齐压力做结构化正则；② 双过滤器——阈值过滤（按分数排名第 60 名截断的名额制，对分数分布漂移免疫）+ ASR 过滤（双路转写只比字数不比内容——构音障碍同音近音替换多，逐字匹配会误杀真唤醒）；③ VITS 风格可控合成——control/uncontrol 标签做风格嵌入，无限生成「模拟构音障碍」音频微调外挂 Paraformer。
          - listitem [ref=f116e30]: 结果：test-B 总分 0.008210（FAR 0.003210 / FRR 0.005000）夺冠——赢在两端平衡（第二名 FAR 高 50%、第三名 FRR 高 50%）；ASR 过滤把 FAR 相对压低 25% 而 FRR 纹丝不动。
          - listitem [ref=f116e31]: 最反直觉的设计：ASR 过滤器只比转写长度不比内容——纯 Paraformer 严格匹配路线 FAR 全场最低（0.0016）但 FRR 崩到 0.0195（完整系统的 2.6 倍）：宁可放过「字数碰巧相同的其他词」也要保住召回，这是高错字率域里内容校验的工程妥协。
          - listitem [ref=f116e32]: 成色缺口：长度校验防不住「同长度异内容」；名额阈值与评测分布强耦合（部署先验变了要重标）；合成语音无 MOS/可懂度验证；推理开销完全背离唤醒词的端侧传统（300M d2v2 + Paraformer large 双模型，零延迟数据）；test-B 成绩混入了 test-A 训练（合规但含金量需留意）。
