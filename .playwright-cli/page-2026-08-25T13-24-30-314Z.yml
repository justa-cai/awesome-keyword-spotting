  - generic [ref=f249e300]:
    - generic [ref=f249e301]: 可迁移判断
    - paragraph [ref=f249e302]: ↳ 预训练模型的架构不是免费的：迁移时做目标感知的架构适配，而不是盲目端到端微调——本文最有价值的洞察，对任何跨域迁移（图像→音频、文本→语音）都成立。
    - paragraph [ref=f249e303]: ↳ 先让尺寸对，再谈删谁：在过度参数化的架构里找冗余是事倍功半——架构适配（宏观）比权值剪枝（微观）是更重要的优化维度，消融里 30~40% vs 10~20% 的贡献差就是证据。
    - paragraph [ref=f249e304]: ↳ 冗余的判据是方向重复不是数值大小：小幅度滤波器可能恰恰是关键稀疏特征的检测器；多 checkpoint 的一致性检查是把「碰巧相似」和「真冗余」分开的保险。
    - paragraph [ref=f249e305]: ↳ 减参可以是正则化：小数据集上压缩与精度不是零和——CalTech-101 上剪 60% 反升 0.5%，过拟合的模型有时只是太大了。
