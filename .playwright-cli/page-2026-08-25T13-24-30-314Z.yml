  - heading "§02 方法：先定形状，再去冗余" [level=2] [ref=f249e98]:
    - generic [ref=f249e99]: §02
    - text: 方法：先定形状，再去冗余
  - generic [ref=f249e100]: GP 代理 + EI 采集 · 单位球面上的方向判据
  - generic [ref=f249e101]:
    - generic [ref=f249e102]: "搜索空间: H = {h₁, h₂, …, h_D} （最后 D 个深层的滤波器数，如 h ∈ {64,128,256,512}） 代理模型: f(h) ~ GP(m(h), k(h,h')) （Matern 5/2 核） 采集函数: α_EI(h) = E[ max(f(h) − f(h⁺), 0) ]"
    - generic [ref=f249e103]: 人话：每个候选配置都要「改层+微调 5–10 epoch」才知道好坏——一次评估很贵。GP 把每次评估的信息存下来（哪里好、哪里不确定），EI 在「预测值高（利用）」和「不确定性大（探索）」之间权衡着挑下一个试点，几十次就收敛。
  - generic [ref=f249e104]:
    - generic [ref=f249e105]: "cos(Wᵢ, Wⱼ) = Wᵢ · Wⱼ / (‖Wᵢ‖₂ · ‖Wⱼ‖₂) 冗余判据: cos(Wᵢ, Wⱼ) > θ(0.9) 在多个训练 checkpoint 持续成立 处理: 移除冗余对中 ‖W‖ 较小者 → 精度掉超 δ(1%) 停 → recovery 微调"
    - generic [ref=f249e106]: 人话：余弦衡量的是滤波器的「方向」。方向几乎相同的两个滤波器，提取的特征几乎一样（无论幅度谁大谁小）——删掉一个小的，是真正的冗余消除。只看幅度的剪枝会把「权值小但检测关键稀疏特征」的滤波器误杀。多 checkpoint 一致性是防误判的保险：碰巧某个时刻相似不算数，要全程相似才算冗余。
  - generic [ref=f249e107]:
    - generic [ref=f249e108]:
      - heading "为什么两段而不是一段" [level=3] [ref=f249e109]
      - paragraph [ref=f249e110]: NAS 是宏观优化（每层多大尺寸合适），剪枝是微观优化（哪些具体参数重复）——顺序不能反。消融证据：直接在原始 VGG 上剪 30% 参数掉 2% 精度；NAS 先把深层砍 50–75% 再剪，40% 削减几乎无损。在过度参数化的架构里找冗余，本身就是事倍功半。
    - generic [ref=f249e111]:
      - heading "KWS 读法" [level=3] [ref=f249e112]
      - paragraph [ref=f249e113]: 梅尔频谱图 40 频率通道 × 约 100 时间帧当图像输入，VGG-16/ResNet-50 做特征提取器。TASCNet 自动把深层砍到目标要的规模——参数 −约 40%、FLOPs −约 30%、精度掉 <1%。省下的不只是参数：小数据集上减参还起了正则化作用。
