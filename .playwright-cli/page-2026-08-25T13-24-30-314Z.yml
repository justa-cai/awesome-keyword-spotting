  - generic [ref=f249e3]: 论文精读 · 可视化版 · 2022 №37
  - heading "138M 的 VGG 搬进 KWS？ 先用贝叶斯搜出目标要的形状，再剪掉方向重复的滤波器" [level=1] [ref=f249e4]: 138M 的 VGG 搬进 KWS？先用贝叶斯搜出目标要的形状，再剪掉方向重复的滤波器
  - generic [ref=f249e5]:
    - generic [ref=f249e6]: TASCNet · NAS + 剪枝两段式
    - generic [ref=f249e7]: arXiv 2205.05967 · Multimedia Systems
    - generic [ref=f249e8]: 高斯过程 + EI 采集 · 20–50 次评估
    - generic [ref=f249e9]: CalTech-101 参数 −60% 精度 +0.5%
  - generic [ref=f249e10]: 一句话：把 ImageNet 预训练 CNN 迁移到 KWS（频谱图当图像）时，深层带着源任务的过度参数化一起来。TASCNet 两段式瘦身：先用贝叶斯优化只搜深层配置（浅层通用特征冻结），再用「训练全程方向一致」的余弦相似度剪掉冗余滤波器——CalTech-101 上剪掉 60% 参数精度反升 0.5%，KWS 上参数 −40%、FLOPs −30%、精度掉不到 1%。
  - generic [ref=f249e11]:
    - generic [ref=f249e12]: TL;DR
    - listitem [ref=f249e13]: ◈ 迁移学习的过度参数化：VGG-16 约 138M 参数 vs GSC 仅约 65K 样本——容量够记住训练集（过拟合）；ImageNet 深层学的「区分 120 种狗」的能力对 KWS 完全无用。
    - listitem [ref=f249e14]: ◈ 频谱图 ≠ 图像：两轴物理意义不同（时间 vs 频率，不是两个空间轴）、像素是能量非颜色、共振峰轨迹的局部统计与物体边缘截然不同——域鸿沟是本文一切讨论的前提，也是它最大的未解问题。
    - listitem [ref=f249e15]: ◈ 阶段一 NAS 只搜深层：浅层（边缘/纹理通用特征）冻结，对最后 D 个卷积块 + FC 搜滤波器数候选——增量搜索让空间从数千配置缩到数十个，且不浪费预训练知识。
    - listitem [ref=f249e16]: ◈ 贝叶斯优化省评估：GP + Matern 5/2 核 + Expected Improvement，20–50 次评估逼近最优（网格搜索 4^D=1024 次完整训练）。
    - listitem [ref=f249e17]: ◈ 阶段二剪枝换判据：不看幅度看方向——余弦相似度持续 >0.9 的滤波器对提取的特征几乎相同，删范数小的那个才是真冗余；多 checkpoint 一致性防「偶然相似」误判。
    - listitem [ref=f249e18]: ◈ 消融给出主次：NAS 独贡献 −30~40% 参数（大头），剪枝再补 −10~20%；仅剪枝不 NAS 时剪 30% 掉 2% 精度——架构适配比权值剪枝更重要。
    - listitem [ref=f249e19]: ◈ KWS 侧证据链薄：没有 GSC 标准基准、没有 DS-CNN/TC-ResNet/KWT 对照——本文的 KWS 数字更像通用性演示，引用前须知边界。
  - heading "§01 问题：预训练模型带着行李迁移" [level=2] [ref=f249e20]:
    - generic [ref=f249e21]: §01
    - text: 问题：预训练模型带着行李迁移
  - generic [ref=f249e22]: 三条老路的不足 + 一个被忽略的域鸿沟
  - generic [ref=f249e23]:
    - generic [ref=f249e24]:
      - heading "直接微调：全量行李照收" [level=3] [ref=f249e25]
      - paragraph [ref=f249e26]: 标准迁移学习微调所有层，保留源任务的过度参数化。小数据集上过拟合、推理低效。深层学的是 ImageNet 的精细视觉区分能力——对 KWS 是纯负担。
    - generic [ref=f249e27]:
      - heading "通用剪枝：不问目标任务" [level=3] [ref=f249e28]
      - paragraph [ref=f249e29]: 幅度剪枝删「权值小」的滤波器，但小幅度 ≠ 不重要——被删的滤波器可能恰好检测关键词的关键频谱特征（如高频辅音的宽带噪声模式），只是当前初始化下数值较小。
    - generic [ref=f249e30]:
      - heading "从头 NAS：贵且浪费" [level=3] [ref=f249e31]
      - paragraph [ref=f249e32]: DARTS 约 1.5 GPU 天、ENAS 约 0.5 GPU 天，且从随机初始化搜起——预训练模型已学到的通用特征被白白丢掉。网格搜索在 D=5 维 × 每维 4 候选就要 1024 次评估。
    - generic [ref=f249e33]:
      - heading "域鸿沟：三层错配" [level=3] [ref=f249e34]
      - paragraph [ref=f249e35]: 频谱图两轴异质（时间/频率 vs 空间/空间）、值域非负（能量 vs 颜色）、局部模式统计不同（共振峰轨迹 vs 物体边缘）。ImageNet 预训练的空间不变性先验未必适用——这是「频谱图当图像」路线的原罪。
