  - generic [ref=f249e258]:
    - generic [ref=f249e259]:
      - generic [ref=f249e260]: "1"
      - paragraph [ref=f249e261]: 首次把 NAS 和剪枝统一进一个自动化流程做高效知识迁移：NAS 阶段解决「架构适配」（每层多少参数），剪枝阶段解决「冗余消除」（哪些参数重复）——宏观与微观互补。
    - generic [ref=f249e262]:
      - generic [ref=f249e263]: "2"
      - paragraph [ref=f249e264]: 目标感知的增量搜索：不在随机初始化上从头搜完整架构，而是在预训练模型上只调深层——搜索空间从数千缩到数十，浅层通用特征原样保留。
    - generic [ref=f249e265]:
      - generic [ref=f249e266]: "3"
      - paragraph [ref=f249e267]: 基于训练全程的余弦相似度剪枝准则：比单次快照的幅度剪枝鲁棒，多 checkpoint 一致性检查避免偶然相似导致的误剪。
    - generic [ref=f249e268]:
      - generic [ref=f249e269]: "4"
      - paragraph [ref=f249e270]: 跨域验证：图像分类（CalTech-101/256、Stanford Dogs）+ KWS 两类任务上验证通用性——方法不依赖特定数据域的统计特性。
