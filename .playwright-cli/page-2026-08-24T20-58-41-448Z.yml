      - heading "900ms 延迟的交换相当刚性" [level=2] [ref=f138e258]
      - generic [ref=f138e260]:
        - generic [ref=f138e261]:
          - heading "技术局限" [level=4] [ref=f138e262]
          - list [ref=f138e263]:
            - listitem [ref=f138e264]: 延迟代价：最优 CDC 配置引入 900ms 额外延迟——唤醒类产品对响应延迟通常敏感；零延迟配置（Fut=0）下 CDC 几乎失效甚至轻微负效（90.7 对 91.1），延迟与增益的交换刚性，没有中间档可退。
            - listitem [ref=f138e265]: 依赖训练期 ICTC 分支：CDC 需要模型训练时就带中间 CTC 监督——无法直接套在已训好的普通 CTC 模型上免训练获益，迁移必须重新微调。
            - listitem [ref=f138e266]: 融合与度量手工选择：余弦相似度 + 简单平均固定不变，无可学习权重，未探索其他一致性度量，无敏感性分析。
            - listitem [ref=f138e267]: 硬截断与机理假设：T_out=3s 超限路径直接置零——对语速极慢说话人或更长关键词是否安全未讨论；「正样本两层一致、负样本分岔」是 Hey-Snips 上的经验现象，「浅层容量小学得会一致正模式」是合理推断而非理论保证，换数据集换关键词需重验证。
