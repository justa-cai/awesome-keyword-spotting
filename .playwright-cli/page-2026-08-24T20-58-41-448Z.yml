      - paragraph [ref=f138e14]: Streaming Keyword Spotting Boosted by Cross-layer Discrimination Consistency（CDC）
      - paragraph [ref=f138e15]: 作者：Yu Xi*、Haoyu Li*、Xiaoyu Gu、Hao Li、Yidi Jiang、Kai Yu（通讯）—— 上海交大 X-LANCE · 思必驰 · 新加坡国立大学（*共同一作）
