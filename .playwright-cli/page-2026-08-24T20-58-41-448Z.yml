      - generic [ref=f138e24]:
        - heading "一分钟版本" [level=2] [ref=f138e25]
        - list [ref=f138e26]:
          - listitem [ref=f138e27]: 痛点：训练与解码的错配。CTC 免对齐标注 + 非自回归逐帧输出，是流式 KWS 的主流训练准则——但现成解码器是为 ASR「整句转写」设计的：greedy 搜索的预算大量花在与关键词无关的语音上（同一个 CTC 模型平均只有 71.7%）；KWS 专用解码图方向对（75.8%）但要实现 WFST 图 + Token Passing，工程复杂难迭代，且强噪声下 token 难穿图到达终态（−5dB 只有 23.9）。解码算法做错，声学模型再强也兑现不出来。
          - listitem [ref=f138e28]: 贡献一：任意起点流式解码（算法 1）：把关键词音素序列插空白符成模板 ỹ（长度 2U+1），只在这个受限模板上做 Viterbi 式 DP——复杂度 O(T·Ũ)；每帧把前两个状态重置为 1，新竞争路径随时入场（关键词无论从哪帧开始都能捕捉，ASR 前缀搜索做不到）；超时 3s 置零 + 路径长度几何平均归一。同一模型平均 71.7→82.1，−5dB 下 22.7→35.5、对图方法 +11.6——纯解码算法的增益，声学模型一分未动。
          - listitem [ref=f138e29]: 贡献二：CDC 跨层判别一致性：关键观察（Fig 2）——正样本的主层 CTC 分数曲线与中间层 ICTC 分数曲线在唤醒点附近稳定且相似；易误触发的高分负样本激活短暂、两曲线分岔。机理：正样本模式一致，容量受限的中间层也学得会；负样本五花八门，浅层难全部刻画，最终层可能过拟合出虚警模式。于是「两层判别是否一致」（滑窗余弦相似度）本身就成了几乎免费的虚警检测器——ICTC 从训练期正则第一次变成推理期判别信号，零新增可学参数。
          - listitem [ref=f138e30]: 结果（Table II，FAR=0.05 次/小时）：A 图解码 85.3 → B 流式解码 89.4（+4.1）→ D +ICTC 91.1（低 SNR 集中，−5dB +5.8）→ E +CDC 92.1（−5dB +3.6 到 63.4）。E vs A：平均召回绝对 +6.8，平均漏检率相对降 46.3%（14.7%→7.9%）。
          - listitem [ref=f138e31]: 最有信息量的负结果：纯历史窗 CDC（His=30/Fut=0，零延迟）只有 90.7，比不用 CDC（91.1）还低——两层分数的分岔主要发生在激活之后，唤醒点之前把两段尚未对齐的曲线拉去算余弦，引入的是噪声不是信号。CDC 的判别信息几乎全部来自未来帧：Fut=30（900ms 延迟）92.1 已逼近上界（Fut=∞ 92.1 / 完全离线 92.3）。
          - listitem [ref=f138e32]: 层位消融反向验证机理：ICTC 挂第 2 层只有 89.3（太浅在做特征提取）、第 5 层 91.2（太深与主层同质化失去互补）、第 3/4 层（L/2 附近）92.1/92.3——中间分支的价值恰恰在于它「与最终层不一样」，太像或太不像都不行。
          - listitem [ref=f138e33]: 边界：最优配置引入 900ms 额外延迟（零延迟下 CDC 失效甚至轻微负效——交换相当刚性）；CDC 依赖训练期就带 ICTC 分支（不能免训练套在已训好的普通 CTC 上）；单数据集单唤醒词；融合与度量全手工（余弦 + 简单平均）无敏感性分析；计算开销未量化。
    - generic [ref=f138e34]:
      - paragraph [ref=f138e35]: §01 · 问题陈述
      - heading "KWS 的真实决策是「滑动的局部检测」，不是整句转写" [level=2] [ref=f138e36]
      - generic [ref=f138e38]: 两类现有解码的具体不足： ① ASR 推理类：流式输出 token 序列再在解码结果里匹配关键词——目标错配：ASR 解码在整个声学空间搜索「最可能的完整假设」，产出完整转写而非为「关键词出现与否」这个二元判断优化。量化差距：同一 CTC 模型 greedy 平均 71.7%、prefix beam=10 也只有 75.5%——更强的通用搜索并没有转化为更好的 KWS；且难以直接控制虚警（论文只能对它们报 FAR=0 下的 accuracy）。 ② KWS 专用解码图：图中含关键词路径 + 可选 filler 路径，为 KWS 定制、效果更好（75.8%）——但落地必须实现 WFST 图 + Token Passing，工程复杂难迭代（换关键词要重新构图）；强噪声下解码 token 难以穿图到达终态，低 SNR 准确率崩掉（−5dB 仅 23.9）。 两类方法共同的问题：都只消费最终输出层的后验，模型中间层学到的判别信息在推理期被整体丢弃。作者前作 TDT-KWS 已为 Transducer 证明「锁死搜索空间在关键词上」的价值，但这条思路没搬到 CTC，中间层信息也一直没人用。
      - generic [ref=f138e39]: 三个挑战：为 CTC 设计严格帧同步的流式解码——搜索空间锁死在关键词模板内、支持从音频流任意位置发起搜索、效果超过 ASR 类与图类基线、实现比 WFST 简单得多；把中间层（ICTC）信息在推理期用起来——专门区分「真唤醒的正样本」和「容易被误触发的高分负样本」，前提是先回答「中间层到底学到了什么与最终层不同的东西」；CDC 看唤醒点附近的未来帧必然引入延迟——窗口与延迟的权衡量化清楚。本质是在准 / 快 / 省三角里专攻「准」且拒绝付「省」的代价。
