    - generic [ref=f138e243]:
      - paragraph [ref=f138e244]: §04 · 主要贡献
      - heading "三条贡献 + 一条可迁移判断" [level=2] [ref=f138e245]
      - generic [ref=f138e247]:
        - generic [ref=f138e248]:
          - generic [ref=f138e249]: "1"
          - text: 面向 CTC 的流式解码算法：关键词模板 2U+1 状态 DP + 每帧概率重置的任意起点 + 超时截断与长度归一——相对 ASR 解码平均 +10.4/+6.6 点、相对图基线 +6.3 点，实现只需后验矩阵 + 音素序列 + 两个超参，换关键词只需换一条音素序列（图方法要重新构图）。
        - generic [ref=f138e250]:
          - generic [ref=f138e251]: "2"
          - text: CDC 跨层判别一致性：基于正 / 负样本上两层分数行为的实证观察，用滑窗余弦把「两层判别是否一致」变成逐帧分数——把训练期正则第一次变成推理期判别器，零新增可学参数。
        - generic [ref=f138e252]:
          - generic [ref=f138e253]: "3"
          - text: 干净与带噪系统验证：FAR=0.05/h 下平均召回绝对 +6.8、漏检率相对降 46.3%；−5dB 域外条件召回仍有 63.4，各 SNR 档全面领先。
        - generic [ref=f138e254]:
          - generic [ref=f138e255]: ★
          - text: 可迁移判断：同一套后验，解码算法决定系统落在工作点曲线的哪个位置、以及曲线能被推到多好——把「KWS 只关心这一个词」的先验直接写进解码结构（受限模板 DP），比通用搜索更强还更简单；而训练期的辅助分支（正则）不必在推理期丢弃——它的「弱」正是它与主层互补的来源。
