        - generic [ref=f138e19]: 模板 2U+1 状态 DP
        - generic [ref=f138e20]: ICTC：训练正则 → 推理判别器
        - generic [ref=f138e21]: 滑窗余弦 CDC
        - generic [ref=f138e22]: 漏检率相对降 46.3%
