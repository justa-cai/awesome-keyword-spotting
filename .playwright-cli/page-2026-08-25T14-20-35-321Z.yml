    - generic [ref=f264e112]: §02
    - text: 方法：编码器动手术，推理切成块
  - generic [ref=f264e113]: 因果化 + 限窗 + 状态缓存 + 训练推理一致
  - generic [ref=f264e114]:
    - generic [ref=f264e115]: "L_total = α · L_CTC + (1−α) · L_intent L_CTC = −log P(text | audio) # ASR 辅助：帧级对齐监督，无需帧级标注 L_intent = CE(predicted_intent, true) # SLU 主任务：池化 → FC → softmax"
    - generic [ref=f264e116]: 人话：即使 SLU 主任务不输出文本，CTC 仍强迫编码器学会「音素级别的准确表示」——这层声学监督让意图分类白拿 2–5%。α 是资源分配旋钮：主任务要最优就压辅助权重（α=0.3 时 SLU 最佳）。
  - generic [ref=f264e117]:
    - generic [ref=f264e118]: 流式改造 = 因果注意力（砍上三角） + LCA（每帧只看前 L 帧，L=10–50） + 卷积模块因果化（左侧填充） 推理形态 = 重叠分块（320/640ms） + carryover 状态缓存 + 块级预测聚合 训练 = 与推理完全相同的分块逻辑（一致性）
    - generic [ref=f264e119]: 人话：双向注意力的上三角「看未来」是流式不可用的根源——因果化砍掉它，LCA 再把全历史压成最近 L 帧的带状窗口。分块大小是延迟下限（块内必须攒齐才出预测），也是上下文预算（块越大信息越全）——一个旋钮拧两头，640ms 是甜点。训练用同样的分块逻辑，避免离线全上下文训练、在线限窗推理的分布错配。
  - generic [ref=f264e120]:
    - generic [ref=f264e121]:
      - heading "Conformer 骨干的理由" [level=3] [ref=f264e122]
      - paragraph [ref=f264e123]: 卷积模块管局部特征建模、自注意力管全局上下文——混合架构在 ASR 上已优于纯 Transformer，本文消融再验证 +1–2%。语音信号恰好需要这两种尺度：音素的局部模式 + 跨帧的韵律上下文。
    - generic [ref=f264e124]:
      - heading "KWS 作为副产品的工程含义" [level=3] [ref=f264e125]
      - paragraph [ref=f264e126]: 统一框架下 KWS 不需要独立模型——在意图分类头上加几个关键词类别即可。设备上少一个常驻模型就是省一份内存与功耗；实测代价是 KWS 准确率与专用模型差距 <1%。
