  - generic [ref=f264e3]: 论文精读 · 可视化版 · 2021 №3
  - heading "别转写成文字再理解： 语音直连意图，KWS 只是其中一个特例" [level=1] [ref=f264e4]: 别转写成文字再理解：语音直连意图，KWS 只是其中一个特例
  - generic [ref=f264e5]:
    - generic [ref=f264e6]: Streaming E2E SLU · 滑铁卢 + 华为 + 清华
    - generic [ref=f264e7]: arXiv 2105.10042 · 流式 Conformer
    - generic [ref=f264e8]: 因果注意力 + LCA 限窗 + 分块推理
    - generic [ref=f264e9]: 延迟 200–400ms（级联 500–800）· KWS 差距 <1%
  - generic [ref=f264e10]: 一句话：级联 ASR→NLU 的四个老毛病——错误传播、延迟叠加、优化目标错位、配对数据贵。本文把语音直接映射到意图（无中间文本），用流式 Conformer（因果注意力 + 有限上下文窗口 + 因果卷积）做分块增量推理，多任务头联合 ASR 辅助（CTC）与意图分类。KWS 被统一为意图检测的特例——关键词即意图类别，与复杂意图任务共享同一编码器；端到端延迟比级联低 40–60%，意图准确率差距 1–2%，KWS 性能与专用模型差不到 1%。
  - generic [ref=f264e11]:
    - generic [ref=f264e12]: TL;DR
    - listitem [ref=f264e13]: ◈ 级联四缺陷有数字：ASR 词错率 5%→15% 时意图准确率掉 10–20%（错误传播）；级联延迟约 500–800ms，而 200–300ms 以上就伤体验；ASR 优化字级准确率、SLU 要意图级——目标错位；三方标注（音频-文本-意图）成本高。
    - listitem [ref=f264e14]: ◈ 流式编码器三刀：因果注意力（砍掉「看未来」的上三角）、有限上下文注意力 LCA（每帧只看自身和前 L 帧，L=10–50，复杂度 O(T²)→O(T·L)）、卷积模块因果化（左侧填充）——Conformer 的卷积+自注意力混合骨干本来就比纯 Transformer 高 1–2%。
    - listitem [ref=f264e15]: ◈ 分块推理：音频切成重叠分块（320/640ms），每块独立编码 + carryover 状态缓存（前块信息传下块，模拟有限回看），块级中间预测聚合出最终判定——分块大小同时是延迟下限与上下文预算。
    - listitem [ref=f264e16]: ◈ 多任务头：L = α·L_CTC + (1−α)·L_intent——CTC 给编码器帧级声学对齐监督（不需要帧级标注），消融显示这层辅助值 2–5%（意图）/1–3%（KWS）。α 是「给谁让路」的旋钮：0.3 SLU 最佳、0.7 ASR 最佳、0.4–0.5 平衡。
    - listitem [ref=f264e17]: ◈ KWS = 意图检测特例：关键词 ↔ 意图类别，非关键词 ↔ 无意图——KWS 与复杂意图共享同一流式编码器，部署少一份模型；KWS 性能与 DS-CNN/CRNN 差距 <1%，副产品几乎白拿。
    - listitem [ref=f264e18]: ◈ 甜点与税：分块 160→1280ms 准确率持续升、延迟线性涨，640ms 是平衡点；上下文窗口收益 L=30 帧后递减；流式相对全上下文的固有税 2–4%——这是只用历史信息的代价。
    - listitem [ref=f264e19]: ◈ 有意思的反超：部分意图类别端到端优于级联——ASR 容易识别错但语义无关的词，端到端直接跳过、只看语义关键信息——这正是「优化目标对齐」的红利。
    - listitem [ref=f264e20]: ◈ 边界：配对标注仍贵（意图标注成本高）；框架复杂度对 KWS-only 场景是杀鸡用牛刀；长尾意图可能不如级联（NLU 能用文本预训练知识）；未在真实边缘设备实测延迟。
