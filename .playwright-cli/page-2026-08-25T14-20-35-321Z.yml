    - generic [ref=f264e485]: §05
    - text: 局限与判断
  - generic [ref=f264e486]: 流式固有税 · 配对数据贵 · 复杂度与长尾
  - generic [ref=f264e487]:
    - img [ref=f264e488]:
      - generic [ref=f264e490]: 边界与延伸
      - generic [ref=f264e492]: 技术边界
      - generic [ref=f264e493]: · 流式固有税 2–4%：因果注意力 + 有限窗口用不上未来信息——需要最高
      - generic [ref=f264e494]: 准确率的场景可能仍要非流式或两阶段（流式初筛 + 非流式精排）
      - generic [ref=f264e495]: · 配对标注贵：需要音频-文本-意图三方标注，意图标注成本高——
      - generic [ref=f264e496]: 比纯 KWS 分类任务的数据准备成本显著增加
      - generic [ref=f264e497]: · 框架复杂度：流式编码器 + CTC + 意图头 + 分块逻辑多个组件——
      - generic [ref=f264e498]: 只要 KWS 功能的场景这套复杂度可能不必要
      - generic [ref=f264e499]: · 长尾意图：罕见意图类别上可能不如级联——NLU 模块能利用文本层
      - generic [ref=f264e500]: 面的预训练知识，端到端音频模型没有这层红利
      - generic [ref=f264e502]: 实验边界 + 延伸
      - generic [ref=f264e503]: · 噪声/远场评估有限——实际语音助手最常见的挑战
      - generic [ref=f264e504]: · 未在真实边缘设备实测（延迟/内存/功耗）
      - generic [ref=f264e505]: · 声调语言（中文）适用性分析不足
      - generic [ref=f264e506]: · 与 SpeechTransformer / 音频-文本多模态方法对比不全
      - generic [ref=f264e507]: · 只评估单意图分类——连续语音多意图检测未做
      - generic [ref=f264e508]: 延伸：两阶段流式（轻量初筛 + 非流式精排）；自监督预训练
      - generic [ref=f264e509]: （wav2vec 2.0 / HuBERT）减标注依赖；多语言迁移；槽位填充纳入
      - generic [ref=f264e510]: 流式框架；蒸馏 + 量化上边缘设备
      - generic [ref=f264e511]: 可迁移判断：KWS 放进更通用的 SLU 框架思考是有价值的视角转换——KWS 不只是分类，是从语音提取特定语义；共享编码器的多任务头让 KWS 成为统一框架的免费副产品
    - generic [ref=f264e512]: 图4 · 边界与延伸：左技术边界（流式税 2–4%、意图标注成本、框架复杂度、长尾意图），右实验边界（噪声/远场/边缘实测/声调语言/多意图）+ 延伸方向。
  - generic [ref=f264e513]:
    - generic [ref=f264e514]: 可迁移判断
    - paragraph [ref=f264e515]: ↳ KWS 不只是分类，是从语音提取特定语义：把 KWS 放进更通用的 SLU 框架思考是有价值的视角转换——端到端允许利用更高层语义（上下文意图），可能突破纯分类方法的性能上限。
    - paragraph [ref=f264e516]: ↳ 辅助任务是便宜的表示监督：CTC 不需要在推理时存在，只在训练时给编码器一层声学对齐信号——值 2–5%。「训完即扔」的辅助头是提升表示质量的低成本手段。
    - paragraph [ref=f264e517]: ↳ 分块大小是一个旋钮拧两头：延迟下限与上下文预算同源——产品上线时按延迟预算选块大小，再接受对应的准确率代价；640ms 与 L=30 帧的甜点可作起点但要按任务重扫。
    - paragraph [ref=f264e518]: ↳ 训练/推理一致性是流式的隐形坑：离线全上下文训练 + 在线限窗推理的分布错配会白丢精度——训练就用推理的分块逻辑，这条纪律比任何单点技巧都值钱。
