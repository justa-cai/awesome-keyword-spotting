    - text: 问题：级联流水线的四个老毛病
  - generic [ref=f264e23]: 错误传播 · 延迟叠加 · 目标错位 · 数据昂贵
  - generic [ref=f264e24]:
    - generic [ref=f264e25]:
      - heading "错误传播有量化" [level=3] [ref=f264e26]
      - paragraph [ref=f264e27]: ASR 词错率从 5% 升到 15%，SLU 意图分类准确率可能掉 10–20%——下游性能被上游绑架。NLU 模块拿到的已经是带噪文本，识别错的关键音素无法在文本层挽回。
    - generic [ref=f264e28]:
      - heading "延迟叠加 + 目标错位" [level=3] [ref=f264e29]
      - paragraph [ref=f264e30]: 两段推理延迟叠加到 500–800ms，实时助手场景 200–300ms 以上就显著伤体验；ASR 优化字/词级识别、SLU 需要意图级分类——ASR 可能在语义无关细节上过度优化，却错判对意图关键的信息。
    - generic [ref=f264e31]:
      - heading "流式的独特挑战" [level=3] [ref=f264e32]
      - paragraph [ref=f264e33]: 端到端 SLU 不等于流式端到端——流式要求只用当前和过去的信息（不等待未来上下文）还能准确分类。对 KWS 这个 SLU 子任务，流式是刚需：系统必须实时监听即时响应。
    - generic [ref=f264e34]:
      - heading "KWS 的位置" [level=3] [ref=f264e35]
      - paragraph [ref=f264e36]: 关键词检测被看作意图检测的特殊形式：目标词 = 意图类别、非关键词 = 无意图——统一视角让 KWS 受益于 SLU 框架的语义理解能力，也让两者共享编码器省部署开销。
