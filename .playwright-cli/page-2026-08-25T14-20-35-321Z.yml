  - generic [ref=f264e467]: 五点：从框架统一到流式差距量化
  - generic [ref=f264e468]:
    - generic [ref=f264e469]:
      - generic [ref=f264e470]: "1"
      - paragraph [ref=f264e471]: 支持 KWS 的流式端到端 SLU 框架：首次把流式端到端 SLU 与 KWS 统一——KWS 作为通用 SLU 任务的特例，能受益于框架的语义理解能力。
    - generic [ref=f264e472]:
      - generic [ref=f264e473]: "2"
      - paragraph [ref=f264e474]: 消除级联延迟：语音直连意图，砍掉中间文本生成——端到端延迟比级联低约 40–60%。
    - generic [ref=f264e475]:
      - generic [ref=f264e476]: "3"
      - paragraph [ref=f264e477]: 分块流式推理机制：模型在音频流上增量运行，分块大小灵活适配不同延迟预算。
    - generic [ref=f264e478]:
      - generic [ref=f264e479]: "4"
      - paragraph [ref=f264e480]: 联合 ASR+SLU 训练互益的证据：CTC 声学监督 + 意图语义监督相互促进——联合训练比单独训练 SLU 提升准确率 2–5%。
    - generic [ref=f264e481]:
      - generic [ref=f264e482]: "5"
      - paragraph [ref=f264e483]: 流式/非流式差距的量化：系统分析有限上下文相对全上下文的准确率损失（2–4%），为选上下文窗口大小提供参考。
