    - generic [ref=f149e79]:
      - generic [ref=f149e80]:
        - heading "KWS 读法" [level=3] [ref=f149e81]
        - text: CTC 解码出字符序列——含目标词的字符串即触发；换词只是换目标串，零重训。
      - generic [ref=f149e82]:
        - heading "VAD 读法" [level=3] [ref=f149e83]
        - text: 连续多帧最大概率都是 blank → 无语音；任何非空字符出现 → 有人说话。
      - generic [ref=f149e84]:
        - heading "CTC 双重红利" [level=3] [ref=f149e85]
        - text: 免对齐（话语级文本即可训）+ blank 即 VAD（一个标签服务两个任务）。
      - generic [ref=f149e86]:
        - heading "难度阶梯共享" [level=3] [ref=f149e87]
        - text: 有声（易）→ 是词（难）共用表示——简单任务天然是复杂任务的辅助监督。
