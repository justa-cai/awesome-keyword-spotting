    - generic [ref=f149e234]:
      - generic [ref=f149e235]: JUDGEMENT
      - paragraph [ref=f149e236]: ↳ 输出空间的正确设计能让额外任务免费搭车：字符级输出本为 KWS 而设——「有没有非空字符」却天然就是 VAD 的答案；多任务的第一步不是加损失，而是检查现有输出里是否已经编码了别的任务。
      - paragraph [ref=f149e237]: ↳ 任务难度阶梯是多任务的天然结构：「有声」比「是词」容易——共享表示让简单任务当复杂任务的辅助监督；后来 VAD 辅助 KWS、说话人辅助唤醒的论文都在用这个阶梯。
      - paragraph [ref=f149e238]: ↳ 统一的成本是对齐多个评估口径：KWS 要低误唤醒、VAD 要低误判——统一训练的权重要同时伺候两套指标；「统一模型」的价值 = 共享收益 − 折衷损失，两条线都要量出来。
