      - heading "madame 和 modem 的静态谱几乎一样， 差在元音之间的过渡轨迹——把「动态」写进特征" [level=1] [ref=f91e13]: madame 和 modem 的静态谱几乎一样，差在元音之间的过渡轨迹——把「动态」写进特征
      - paragraph [ref=f91e14]: End-to-End User-Defined Keyword Spotting Using Shifted Delta Coefficients
      - paragraph [ref=f91e15]: 作者：Kesavaraj V、Anuprabha M、Anil Kumar Vuppala —— IIIT Hyderabad 语音处理实验室
      - paragraph [ref=f91e16]: 发表：2024.05 · arXiv:2405.14489
      - generic [ref=f91e17]:
        - generic [ref=f91e18]: 用户自定义 UDKWS
        - generic [ref=f91e19]: SDC 移位差分系数
        - generic [ref=f91e20]: ~230ms 长时上下文
        - generic [ref=f91e21]: 音频感知文本嵌入（Tacotron2）
        - generic [ref=f91e22]: LPH EER −11.42
        - generic [ref=f91e23]: LibriPhrase
      - generic [ref=f91e24]:
        - heading "一分钟版本" [level=2] [ref=f91e25]
        - list [ref=f91e26]:
          - listitem [ref=f91e27]: 空白点：UDKWS（开集：判断「这段音频和这段文本是不是同一个词」）的前四代方案全在演进模型结构与训练策略，特征工程被集体忽视——默认沿用 MFCC / mel 谱这类短时谱（每帧只见 25ms 局部包络），帧间动态（共振峰怎么移动、音素怎么衔接）基本丢失。而区分 "madame/modem" 这类相似发音靠的恰是音素过渡的时序动态。
          - listitem [ref=f91e28]: 方案：把语言识别（LID）领域的经典特征 SDC 首次迁入 UDKWS——在多个延迟位置堆叠一阶差分：δc(t,i) = c(t+ip+d) − c(t+ip−d)，最优配置 40-1-3-8 把每帧感受野从 25ms 拉到约 230ms（每帧 360 维 = 40 静态 + 8×40 差分）。SDC 本质是免训练、权重固定 ±1 的多分支膨胀卷积——零可学参数扩感受野，代价是聚合方式由超参锁死。
          - listitem [ref=f91e29]: 结果：统一框架下六特征横评 SDC 四集两指标全面第一；关键战场 LPH（相似发音难负例）EER 29.8→21.48、AUC 77.21→85.90；对最强基线 CMCD：LPE 8.42→3.84、LPH 32.9→21.48；G/Q 零微调仍稳定超 CMCD 约 2% AUC / 3% EER——一次训练、任意定制词。
          - listitem [ref=f91e30]: 消融回答两个朴素问题：① 上下文不是越长越好——k 超过 8 后新增差分块伸进相邻无关语音（噪声不是信号）且维度膨胀；② d 越小越好——d 大 = 对谱轨迹导数做时间降采样 + 跨音素边界混合。甜点 = 精准而非冗长的上下文。
          - listitem [ref=f91e31]: 诚实的例外：关键词在训练集内的 G 集上输给注意力 QbyE（23.54 对 14.75）——见过词 + 有模板场景是 QbyE 甜区；而 QbyE 在陌生词集 Q 上崩到 49.13，反衬文本注册路线的必要性。
          - listitem [ref=f91e32]: 成色缺口：每帧 360 维 = mel 谱 9 倍，首层计算放大 9 倍而论文零延迟 / FLOPs / 参数报告——端侧净收益存疑；缺「短时特征 + 模型侧扩感受野」对照，归因不完全；LPH EER 21.48% 离实用（约 1/5 相似负对误接受）还有距离。
    - generic [ref=f91e33]:
      - paragraph [ref=f91e34]: §01 · 问题陈述
      - heading "开集任务的判别信息藏在音素过渡里，短时谱看不见" [level=2] [ref=f91e35]
      - generic [ref=f91e37]: 四代方案与各自的坑：① LVCSR 词格检索——什么词都能搜，但解码计算巨大，与轻量常驻前端的定位矛盾；② keyword/filler HMM——定制可行但计算需求显著、工程链路重；③ QbyE（注册音频模板）——不需要文本，但性能严重依赖注册与测试语音的相似度；更致命的是难泛化到陌生词：QbyE 在见过词的 G 集上 EER 14.75%，在陌生词的 Q 集上崩到 49.13%；④ 文本注册端到端（CMCD / PhonMatchNet / 动态序列划分等）——近年主流，但精力全在模型结构和训练策略上，特征工程这个对任何语音应用都至关重要的环节被相对忽视，没人系统回答过「长时时域信息对 UDKWS 有多重要」。三个子挑战：特征层注入长时信息；上下文取多长（消融找甜点，避免「越长越好」直觉）；统一框架公平验证（换特征不换模型，归因才干净）。
