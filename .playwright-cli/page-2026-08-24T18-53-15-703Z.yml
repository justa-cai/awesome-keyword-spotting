        - generic [ref=f91e85]: 人话：给每一帧配一份「未来 230ms 谱轨迹」的摘要——在 8 个等距位置（步长 p=3 帧）各做一次 ±1 帧差分，堆叠成 320 维再拼 40 维静态谱。MFCC 的 Δ 只看相邻帧，SDC 把感受野拉到数百毫秒量级——与一两个音素的过渡时长同量级。
