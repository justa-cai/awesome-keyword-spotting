  - generic [ref=f247e343]:
    - generic [ref=f247e344]: 读表要点
    - listitem [ref=f247e345]: ◈ M0→M1 一口气付 3.1%（同时含权重 32→8、参数 32→8、激活 32→16 三重压缩）；激活 16→8 只再 +0.4pp；权重 8→4 到 8.7%——整条曲线没有悬崖，两阶段 QAT+分布整形的直接成果。
    - listitem [ref=f247e346]: ◈ CPU 的两段收益来源不同：M0→M1 是 32→8/16 比特参数（省 50%）；M1→M2 是 128 位寄存器装 8 个 int8 吞吐翻倍（再省 45%）。M2→M4 的 CPU 纹丝不动——NEON 8 比特地板。
    - listitem [ref=f247e347]: ◈ 运行时内存 = 模型大小：无状态流式 FFN 没有递归状态没有大缓冲，内存故事干净（912→228KB，−75%）。M3/M4 权重已是 5/4 位内存却不变——同一块地板。
    - listitem [ref=f247e348]: ◈ 那为什么还要亚 8 位权重？给 16 路累加留溢出余量、允许更低精度累加器、缩小 OTA 分发体积（142/114KB）；真吃内存红利要换加速器——投影 912/128≈7.1×、912/198≈4.6×，即摘要的「4 到 7 倍」。
    - listitem [ref=f247e349]: ◈ 逐组件阶梯（全 8 比特）：只重量化 3.8% → +bias/gain 4.7% → +输入激活 5.2% → +BN（带缩放）5.3%——每层边际代价 <1pp，「全组件 8 比特」几乎免费；BN 无缩放直接量化 = 9.0%。
  - heading "§04 贡献" [level=2] [ref=f247e350]:
    - generic [ref=f247e351]: §04
    - text: 贡献
  - generic [ref=f247e352]: 五点：从算法到系统级账本
  - generic [ref=f247e353]:
    - generic [ref=f247e354]:
      - generic [ref=f247e355]: "1"
      - paragraph [ref=f247e356]: 两阶段全组件亚 8 比特 QAT 算法：阶段 1 tanh 权重分布整形（适配 Strom 等），阶段 2 对 gain、bias、BN 四套、激活、输入做线性量化——覆盖了此前工作普遍留浮点的组件。
    - generic [ref=f247e357]:
      - generic [ref=f247e358]: "2"
      - paragraph [ref=f247e359]: 生产规模数据上与全精度工作点打平：全 8 比特仅 3.5% 相对退化、4 比特权重 8.7%；二值权重加扩容模型在学习率调整后 0.4%/−0.4%。
    - generic [ref=f247e360]:
      - generic [ref=f247e361]: "3"
      - paragraph [ref=f247e362]: 真实指令集上的系统级收益账本：NEON 实测 CPU 37.6→10.3 MCPS、内存 912→228KB、模型最小 114KB；并讲清「亚 8 比特权重在通用芯片换不到 CPU/内存、换得到溢出余量与分发体积」这个反直觉结论。
    - generic [ref=f247e363]:
      - generic [ref=f247e364]: "4"
      - paragraph [ref=f247e365]: 可直接抄的工程配方：BN 动态范围缩放量化（9.0%→5.3%）、激活选型结论（clipped ReLU 胜出）、算子顺序要交换（dense→BN→clip）。
    - generic [ref=f247e366]:
      - generic [ref=f247e367]: "5"
      - paragraph [ref=f247e368]: 二值权重的落地投影：M5/M6 在 86.0%/78.3% 内存缩减下保持精度，验证 1 比特权重 KWS 在扩参数量补偿后可用。
