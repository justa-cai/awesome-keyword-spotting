- generic [ref=f247e2]:
  - generic [ref=f247e3]: 论文精读 · 可视化版 · 2022 №36
  - heading "硬件的量化器不能动？那就把权重养均匀： 流式 KWS 的亚 8 比特全组件量化" [level=1] [ref=f247e4]: 硬件的量化器不能动？那就把权重养均匀：流式 KWS 的亚 8 比特全组件量化
  - generic [ref=f247e5]:
    - generic [ref=f247e6]: Sub-8-bit QAT · Amazon Alexa
    - generic [ref=f247e7]: arXiv 2207.06920 · 生产级 250K 无状态 FFN
    - generic [ref=f247e8]: 26K 小时生产数据 · ARM NEON 实测
    - generic [ref=f247e9]: 全 8 比特仅退化 3.5% · CPU 3.65× · 内存 −75%
  - generic [ref=f247e10]: 一句话：把 Alexa 生产级流式唤醒模型的权重、gain、bias、BatchNorm 四套参数、激活、输入全部压到 8 比特及以下（权重最低到 1 比特），核心思路只有一个——硬件的均匀量化器不能动，就改造数值分布去适配它：tanh 把高斯权重养均匀、C_BN 把 BN 参数搬进窄动态范围、算子重排让 clip 作用在归一化量上。全 8 比特在工作点只付 3.5% 相对退化，ARM NEON 实测 CPU 37.6→10.3 MCPS、内存 912→228KB。
  - generic [ref=f247e11]:
    - generic [ref=f247e12]: TL;DR
    - listitem [ref=f247e13]: ◈ 商用 KWS 有三条研究界普遍忽略的隐性约束：亚 8 比特要硬件指令集真支持、必须流式逐帧出后验、不能用可损坏内存——第三条直接决定基线是无状态 FFN（某帧异常下一帧自愈，递归状态会残留污染）。
    - listitem [ref=f247e14]: ◈ NEON 的 MAC 最小容器是 8 比特：权重压到 4/5 位在通用芯片上不换 CPU 也不换内存，收益只有溢出余量与 OTA 分发体积；直接内存红利要靠专用加速器（投影 4–7×）。
    - listitem [ref=f247e15]: ◈ 计算图关键：gain 放 MAC 外面——y_q ← α_q(W_q·x_q + b_q)，每层一个标量缩放乘在外面，内积用最稠密的整数指令跑满；逐元素缩放会把 SIMD 打散归零。
    - listitem [ref=f247e16]: ◈ 精度最大来源是 tanh 权重整形：高斯过 tanh 的概率积分恰好摊平成 U(−1,1)，训练中用目标分布初始化+正则锁住——同一量化器，退化 7.4% vs 12.3%。
    - listitem [ref=f247e17]: ◈ BN 全四套参数量化靠缩放因子 C_BN：分子分母同除（分母根号内除平方），代数恒等但每个进量化器的数都被压窄——5.3% vs 无缩放 9.0%，杠杆最高的单点技巧。
    - listitem [ref=f247e18]: ◈ 激活到 8 比特就是墙：权重可继续压到 4/5 比特（静态、可整形），激活分布随输入逐帧漂移只能间接规训——全模型比特下限被激活卡死，不对称。
    - listitem [ref=f247e19]: ◈ 二值档（1 比特权重）要 2×/6× 参数量换容量，且对学习率极度敏感：恒定 lr 掉 14%，仅把阶段 1 末尾若干次更新的 lr 调小就追平基线（0.4% / −0.4%）。
  - heading "§01 问题：常驻端侧的六条约束" [level=2] [ref=f247e20]:
    - generic [ref=f247e21]: §01
    - text: 问题：常驻端侧的六条约束
  - generic [ref=f247e22]: 三条显性（体积/内存/功耗）+ 三条隐性（指令集/流式/不可损坏内存）
  - generic [ref=f247e23]:
    - generic [ref=f247e24]:
      - heading "生产基线：250K 无状态 FFN" [level=3] [ref=f247e25]
      - paragraph [ref=f247e26]: "瓶颈架构 {87,400,87,400,87,400}，全部隐藏层配 BN+ReLU，LFBE 20 维、81 帧滑窗、3 倍时间下采样。唤醒词训练时中心对齐——后验峰位置固定，WMA 平滑+阈值才有稳定对齐前提。这不是学术基线，是 Alexa 的生产形态。"
    - generic [ref=f247e27]:
      - heading "为什么必须是 FFN 不是 RNN" [level=3] [ref=f247e28]
      - paragraph [ref=f247e29]: 「不可损坏内存」红线：递归状态一旦被数值溢出污染会一直残留，唤醒整体失效只能重启；无状态模型某帧异常、下一帧从头开始，天然自愈。前馈结构对整数推理也最友好——全网络就是一串矩阵向量乘，NEON SIMD 满载。
    - generic [ref=f247e30]:
      - heading "PTQ 掉点，低位宽有地基" [level=3] [ref=f247e31]
      - paragraph [ref=f247e32]: 训练后量化误差无人补偿，小模型上致命。QAT 靠伪量化+STE 直通估计器传梯度（量化函数离散、梯度几乎处处为零）。多数量化工作只处理权重顶多加激活，BN 四套参数留浮点——整数算力优势从最热路径漏光。
    - generic [ref=f247e33]:
      - heading "权重分布与量化器错配" [level=3] [ref=f247e34]
      - paragraph [ref=f247e35]: 网络权重近似高斯：九成以上挤在零附近窄带，只分到中间少数码字；两侧长尾码字密布却无权重落点——等效于拿大部分精度去表示从不出现的值。改量化器成非均匀会破坏整数 MAC 的均匀格点假设，所以要反过来改分布。
