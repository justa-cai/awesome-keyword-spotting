      - generic [ref=f247e218]: · GeLU / SiLU 无确定性结论 · gain 排在 MAC 外面（每层一个标量）
      - generic [ref=f247e219]: 哲学：让每个量化器面对的都是被规训过的分布
      - generic [ref=f247e220]: 左：权重侧的整形——高斯过 tanh 恰好摊平成均匀分布，训练全程用正则锁住。右：BN 侧的缩放与排序——恒等变换搬窄动态范围 + clip 前置到归一化之后，都是不改网络函数只改数值分布
    - generic [ref=f247e221]: 图2 · 机制解剖：左是 tanh 整形的分布图景（钟形 → 均匀，训练全程用正则锁住）；右上是 BN 的 C_BN 缩放（代数恒等搬窄动态范围），右下是两个决定成败的排序（算子序 dense→BN→clip、gain 在 MAC 外）。
