  - generic [ref=f247e402]:
    - generic [ref=f247e403]: 可迁移判断
    - paragraph [ref=f247e404]: ↳ 量化器不能动，就动分布：tanh 整形、C_BN 缩放、算子重排全是同族手法——不改网络函数、只改数值分布去适配硬件的均匀格点。遇到「量化掉点」先看分布与量化器错配在哪，而不是急着加比特。
    - paragraph [ref=f247e405]: ↳ 每压一档都要重新核对硬件的最小容器：NEON 的 8 比特 MAC 地板让 4/5 位权重白压——比特数的收益以指令集真实支持为前提，纸面压缩率不等于系统收益。
    - paragraph [ref=f247e406]: ↳ 静态可整形，动态只能间接规训：权重能在训练中被「养」成量化器喜欢的形状，激活的分布随输入逐帧漂移——这解释了两者量化下限的不对称，也提示下一步该做激活侧的分布整形（LSQ 类）。
    - paragraph [ref=f247e407]: ↳ 二值模型的精度挑战可能部分在训练日程而非方法本身：末期大步长让权重符号在临界点反复翻转，仅调小最后若干次更新的学习率就回收 13.6pp——调参的边际收益大到必须先排除再谈方法论。
