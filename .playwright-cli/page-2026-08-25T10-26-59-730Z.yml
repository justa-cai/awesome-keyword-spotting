  - heading "§02 方法：改造分布，适配硬件" [level=2] [ref=f247e120]:
    - generic [ref=f247e121]: §02
    - text: 方法：改造分布，适配硬件
  - generic [ref=f247e122]: gain 外置的整数 MAC · tanh 概率积分摊平 · 代数恒等缩放
  - generic [ref=f247e123]:
    - generic [ref=f247e124]: "y_q ← α_q(W_q · x_q + b_q) # 整数域 dense，gain 乘在外面 y_q^φ ← q_z( ReLU(y_q) ) # 激活量化（实测选 clipped ReLU） y_q^φψ← q_z( BN(y_q^φ) ) # BN 量化（带 C_BN 缩放）"
    - generic [ref=f247e125]: 人话：三步恰好对应原网络的计算顺序，整条链路没有任何浮点逐元素运算——这是「全组件量化」的数学含义。gain 若放进 MAC 里（每权重各自缩放），向量化整数乘累加被打散成逐元素乘法，SIMD 吞吐归零。
  - generic [ref=f247e126]:
    - generic [ref=f247e127]: "W_q ← q_z( tanh(W) ) · 初始化 W ~ N(0, σ_t²) 正则: λ_σ(σ_w − σ_t)² + λ_μ·μ_w²"
    - generic [ref=f247e128]: 人话：若 W 服从合适方差的高斯，tanh(W) 的分布近似 U(−1,1)——高斯过 tanh 这个概率积分恰好把钟形摊平，每个码字承载的权重质量近似相等。只在量化时刻套 tanh 不够（零区陡峭挤压、饱和区复用码字），要训练中就用目标分布初始化+正则把权重「养」成甜点形状。
  - generic [ref=f247e129]:
    - generic [ref=f247e130]: x_norm = (x − μ_B)/√σ_B² = (x/C_BN − μ_B/C_BN)/√(σ_B²/C_BN²) x_norm_q ← ( q_z(x/C_BN) − q_z(μ_B/C_BN) ) / √q_z(σ_B²/C_BN²)
    - generic [ref=f247e131]: 人话：分子分母同除 C_BN（分母在根号内除平方），归一化的数学结果一个字不变——但 μ_B、σ_B² 这类动态范围大且训练中持续漂移的值被压进窄区间，量化分辨率随之提高。这是「把数值搬进量化器甜点区、又不改网络函数」的标准手法，与 tanh 异曲同工。
  - generic [ref=f247e132]:
    - generic [ref=f247e133]:
      - heading "激活：clipped ReLU + 算子重排" [level=3] [ref=f247e134]
      - paragraph [ref=f247e135]: ReLU 正半轴无界，线性量化器被迫覆盖大值域导致单位分辨率极差。系统试了 clipped ReLU / sigmoid / tanh / GeLU / SiLU：clipped ReLU 胜出；sigmoid/tanh 反而更差（梯度饱和要更多更新）。同时把 dense→ReLU→BN 交换成 dense→BN→clipped ReLU——clip 作用在归一化后的稳定量上，阈值稳健；块输出有界，恰好对齐 8 比特无符号罐。
    - generic [ref=f247e136]:
      - heading "两阶段训练的用意" [level=3] [ref=f247e137]
      - paragraph [ref=f247e138]: 阶段 1 只量化权重（tanh 整形效果可单独测量）；阶段 2 对其余组件线性量化+1 epoch（35K 次更新）重估。两层动机：误差归因可追溯——商用发布决策（压到几比特、量化哪些组件）需要每步代价的证据链；权重整形扰动训练动力学，需要全精度组件构成的稳定骨干托底。
    - generic [ref=f247e139]:
      - heading "输入量化：第三次同款手法" [level=3] [ref=f247e140]
      - paragraph [ref=f247e141]: LFBE 特征先做全局均值方差归一化，再除 C_input 后线性量化——与 BN 缩放同源：先缩小动态范围，再进量化器。
    - generic [ref=f247e142]:
      - heading "验证口径的讲究" [level=3] [ref=f247e143]
      - paragraph [ref=f247e144]: DET 曲线上报告「基线工作点 FRR 处的相对 FDR 退化」：两个错误代价极不对称（误拒伤可用性、误报伤信任与云端成本），固定 FRR 锚点比 FDR 才公平；相对归一化让不同规模模型的数字可直接横比。WMA 平滑参数在 held-out 数据上调，防泄漏。
