      - heading "变长关键词不用聚合——先把所有词填到 25 个音素， 让交叉注意力的输出恒为 T×D" [level=1] [ref=f134e13]: 变长关键词不用聚合——先把所有词填到 25 个音素，让交叉注意力的输出恒为 T×D
      - paragraph [ref=f134e14]: "SLiCK: Exploiting Subsequences for Length-Constrained Keyword Spotting"
      - paragraph [ref=f134e15]: 作者：Kumari Nishu、Minsik Cho、Devang Naik —— Apple
      - paragraph [ref=f134e16]: 发表：arXiv 2409.09067（2024-09）· 面向端侧 596K 参数预算
      - generic [ref=f134e17]:
        - generic [ref=f134e18]: 文本注册 · 零样本
        - generic [ref=f134e19]: 长度约束 T=25
        - generic [ref=f134e20]: 子序列前缀匹配
        - generic [ref=f134e21]: 三任务：句子级 + 子序列 + CTC
        - generic [ref=f134e22]: LH AUC 88.52→94.9
        - generic [ref=f134e23]: 训练重推理轻
      - generic [ref=f134e24]:
        - heading "一分钟版本" [level=2] [ref=f134e25]
        - list [ref=f134e26]:
          - listitem [ref=f134e27]: 本质痛点：用户自定义 KWS 的关键词长度可变——「Hey Siri」几个音素，「called the philosophic standard」25 个音素。音频侧帧级编码天然吃变长；文本侧必须变长→定长，而现有手段全都付出代价：RNN 取末帧（长路径梯度衰减、开头信息稀释）、平均池化（时序结构压成一个点）、动态划分（对齐错误沿路径传播）、CMCD 固定单调对齐（service vs surface 对齐稍偏判别信息就被抹掉）。
          - listitem [ref=f134e28]: 问题重构（全文最四两拨千斤的一步）：作者统计关键词长度分布（Fig 2）——几乎所有关键词 <25 个音素，该规律在 Libriphrase / Speech Commands / QbE 数据上均成立 → 全部填充到 T=25，「变长问题」变「长度约束问题」。交叉注意力输出形状由 Q 的行数决定、恒为 T×D → 句子级匹配直接展平接分类头，完全绕开有损聚合——用一条统计事实换掉了整个聚合算法设计空间。
          - listitem [ref=f134e29]: 子序列级匹配（标题核心词）：训练时拿锚点文本的每一个前缀与 spoken text 逐音素比对构造标签。教科书例子：锚点 service 配 spoken surface——[S]、[S,ER1] 两前缀 match，第三个前缀起全部 mismatch。教会模型「带上下文看音素」（补 PhoneMatchNet 缺上下文的短板）+「从哪里开始不像」（区分相似词最有效的证据形态）。
          - listitem [ref=f134e30]: 多任务 + 训练推理解耦：L = 2·L_utt + 1·L_ss + 5·L_CTC——音素识别权重最大（小模型里表征没有音素语义打底，文本查询就是在无结构声学特征里瞎摸）；推理时 CTC 头和全部 FC_t 子序列头丢弃，只留交叉注意力 + 句子级分类通路，596K 参数。
          - listitem [ref=f134e31]: 结果：同部署量级下 LH（困难负样本）AUC 88.52→94.9、EER 18.82→11.1，模型还小 9%；LE 99.29→99.82（天花板效应下仍全面占优）；对 CMCD 碾压（LH 差 >21 点）——固定单调对齐的短板是结构性的。
          - listitem [ref=f134e32]: 消融最有信息量：裸骨架（仅句子级）LH 88.8 ≈ PhoneMatchNet 完整模型 88.52——SLiCK 的全部增益来自两个辅助监督，价值在训练策略不在结构；CTC 贡献最大一块（+4.1），子序列增量集中在最难的 LH（+2.0）。
          - listitem [ref=f134e33]: 边界：T=25 是硬上限（超长关键词无法注册，短词按满长度白算）；子序列监督依赖训练音频的准确转写；前缀结构只覆盖严格单调前缀（批评 CMCD 固定模式的同一位置，只是换了形式）；无流式推理讨论、无端侧运行时实测（效率证据只有参数量）、单数据集族。
    - generic [ref=f134e34]:
      - paragraph [ref=f134e35]: §01 · 问题陈述
      - heading "文本注册时代，变长→定长的转换无可回避" [level=2] [ref=f134e36]
      - generic [ref=f134e38]: 三个痛点层层递进：① 注册方式——QbE 音频注册体验笨重且吃「注册安静清晰 / 测试嘈杂远场」的分布漂移，文本注册（打字即可）成为主流；② 模型体积——双编码器投影对齐、多模态提示融合在服务器上表现可观，但端侧 KWS 参数预算只有几百 K，很容易超；③ 本质痛点：关键词长度可变——「Hey Siri」几个音素 vs 25 音素的长短语，音频侧可用帧级序列编码天然吃进，文本侧最终要产生固定维度表征对接分类头，变长到定长的转换无可回避。
      - generic [ref=f134e39]: 已有方案的四处缺陷： ① 孤立音素检测缺上下文（PhoneMatchNet）：同一音素 /S/ 在 service 开头和 surface 开头声学实现受协同发音影响差别很大；判断「是否说了关键词」本质是序列级决策，单音素命中构不成充分统计量； ② 变长聚合丢信息：RNN 末帧独自背整段序列（长关键词梯度衰减、开头稀释）；平均池化把「前两个音素相同第三个不同」的序结构抹平；动态划分搜索出的对齐路径可能不是最优，错误传播到匹配决策； ③ 固定单调对齐僵化（CMCD）：单调先验合理，但硬编码成固定模式后失去灵活性——真实语音有插入、省略、变体，最受伤的恰是相似词区分（service 与 surface 差别只在第三个音素附近）； ④ 多模态体积超标：融合音素 / 语义文本 / 锚点音频的方案不适合端侧——这是 SLiCK 定位差异的直接原因。
      - generic [ref=f134e40]: 四个互相牵制的目标：支持任意长度（有实际上限）关键词且文本侧不做破坏性聚合；几百 K 参数内完成零样本检测（无需关键词相关训练数据）；对发音相近困难负样本有强区分力（要求细粒度带上下文的音视频关系建模）；训练期辅助任务不拖累推理计算。「变长不聚合」与「端侧小模型」是核心张力。
