      - heading "硬上限、依赖转写、只有参数量一个效率证据" [level=2] [ref=f134e284]
      - generic [ref=f134e286]:
        - generic [ref=f134e287]:
          - heading "技术局限" [level=4] [ref=f134e288]
          - list [ref=f134e289]:
            - listitem [ref=f134e290]: T=25 是硬约束：超长关键词（长句唤醒、多词短语）无法注册；短关键词按满长度计算——单音素「i」与 25 音素长词付同样算力，对端侧是显性浪费。未报告按实际长度截断的变体。
            - listitem [ref=f134e291]: 子序列监督依赖转写：训练期要逐前缀比对生成标签，前提是每个训练音频有准确转写——只能用有监督转写语料，无法直接吃无标注音频；转写噪声直接污染前缀标签。
            - listitem [ref=f134e292]: 前缀只覆盖严格单调：不包含跳词、变体发音的结构差异（音素插入会使后续前缀全部失配，即使整体仍是该关键词）——它批评 CMCD 固定模式的同一位置，只是换了形式。
            - listitem [ref=f134e293]: 无流式形态：按整段音频离线匹配描述；交叉注意力对 K、V 的依赖意味着每来新帧都要对新键值做注意力——流式化的计算摊销与精度保持未报告。语言绑定在 G2P 质量，多语言未评估。
        - generic [ref=f134e294]:
          - heading "实验设计不足" [level=4] [ref=f134e295]
          - list [ref=f134e296]:
            - listitem [ref=f134e297]: 单一数据集族：全部在 Libriphrase（LibriSpeech 合成短语对）上完成；「相似发音」的定义来自音素级规则，真实用户注册分布、真实噪声 / 远场 / 多说话人均未评估。
            - listitem [ref=f134e298]: 缺少端侧实测：效率证据只有参数量（596K），无延迟 / 内存 / 功耗 / ARM 硬件运行时测量（训练反而在 V100 上做）——「适合边缘部署」目前只有参数规模支撑。
            - listitem [ref=f134e299]: 基线覆盖窄：只对比两个同量级小模型；未与双编码器 / 多模态大模型做精度上限参考，也未与量化、蒸馏组合验证。
            - listitem [ref=f134e300]: 超参敏感性未报告：α 权重无扫描曲线；T=25 之外（20 / 30）无对比，无法判断 25 是甜点还是任意选择；单次运行无多随机种子方差——LH 上 92.9 vs 94.9 的量级若遇上训练方差，稳健性存疑。
      - generic [ref=f134e301]: 值得补的方向：长度自适应（按注册词实际长度选 FC_t——模型已天然支持，或短词提前退出注意力，直接回收填充浪费的算力）；流式化（chunk-based conformer + 增量键值缓存，用真实唤醒延迟指标重评）；对齐弹性（编辑距离阈值化的软化前缀标签，把「从哪里开始不像」升级为「差多少才算不像」，覆盖口音与变体）；大规模伪转写（ASR 自标注）放宽转写依赖 + 多语言统一音素体系；与量化蒸馏叠加验证 596K 之下还有多少压缩空间；与双编码器大模型做精度上限对照、真实设备补延迟功耗。
