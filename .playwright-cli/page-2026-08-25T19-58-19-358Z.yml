    - heading "问题：地基不准，楼都在晃" [level=2] [ref=f11e15]
    - generic [ref=f11e16]:
      - generic [ref=f11e17]: TL;DR
      - list [ref=f11e18]:
        - listitem [ref=f11e19]: ◆ 音素边界（相邻音素的过渡点）是音素级 KWS、语音分割、语音分析的地基——边界偏两帧，音素段就切错，序列匹配跟着错位。
        - listitem [ref=f11e20]: ◆ 传统方法用手工特征（MFCC、频谱变化率）识别边界，但边界线索五花八门：元音→辅音是能量骤降+共振峰收敛，辅音→辅音是频谱形状整体切换——一套固定特征打天下不现实。
        - listitem [ref=f11e21]: ◆ 本文的两步学习：段特征可学（可变长段 + 编码器专攻边界）+ 比较方式可学（MLP 替代固定距离度量）——特征层和结构层各自独立有效。
        - listitem [ref=f11e22]: ◆ 特征可视化给出机制证据：学到的特征聚焦频谱变化最显著的时刻，且不同边界类型被不同特征模式捕获——网络自发分化出「边界类型探测器」。
