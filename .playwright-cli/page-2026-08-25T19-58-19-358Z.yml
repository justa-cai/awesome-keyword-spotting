  - generic [ref=f11e73]:
    - generic [ref=f11e74]: "02"
    - heading "机制：变化只在对比中可见" [level=2] [ref=f11e75]
    - paragraph [ref=f11e76]: 「段间比较」优于「逐帧判断」的道理很朴素：边界是变化，而单帧里看不见变化。把相邻段的特征送进可学习比较函数，变化量直接变成输入——模型要学的只是「什么样的变化算边界」。连「怎么比」都由 MLP 学（而非固定的欧氏/余弦距离），意味着不同特征维度的重要性、非线性组合方式都留给数据决定。
