    - generic [ref=f11e172]: 图 2 · 机制解剖：可变长段与比较流水线 · 三类边界的不同声学线索
    - generic [ref=f11e173]:
      - generic [ref=f11e174]: "分段: x → [seg₁, seg₂, …]（可变长，段边界 = 候选音素边界） 段特征: f_i = Encoder(seg_i) ← 可学习，专攻边界检测 比较: diff = CompareMLP(f_i, f_j) ← 可学习的比较函数（非固定距离） 输出: P(boundary) → BCE 损失（边界/非边界二分类）"
      - generic [ref=f11e175]: 人话：把音频剪成一段一段，每段写一张「声学名片」；相邻两张名片交给一个学会了「怎么对比」的小网络——差异够大就判定这里有个音素边界。名片怎么写、怎么比，全是学出来的。
    - paragraph [ref=f11e176]: 可变长段是必要的结构选择：音素持续时长天然不同（爆破音几十毫秒、元音上百毫秒），固定窗要么切碎长音素要么跨过短音素——段的边界对齐音素的边界，比较才有意义。
