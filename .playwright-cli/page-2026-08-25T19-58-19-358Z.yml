      - generic [ref=f11e318]: ↳ 变化（边界、切换点、突变）只在对比中可见——单帧/单窗口的绝对特征天然缺这个维度；把「对比什么、怎么对比」也参数化交给学习，比手工设计差分特征更灵活。
      - paragraph [ref=f11e319]: ② 管线上游的组件精度是乘性传导的。
      - generic [ref=f11e320]: ↳ 边界检测偏一点，序列匹配错一截——改进上游组件的收益会被下游放大；评估「要不要优化这个组件」时看它乘了多少下游，而不是只看组件自身指标的绝对值。
      - paragraph [ref=f11e321]: ③ 端到端学习对特征工程的超越，要看「模式分化」。
      - generic [ref=f11e322]: ↳ 如果学习式特征只是把手工特征做得更准，收益有限；像本文这样自发分化出类型探测器（不同边界不同模式），说明网络找到了手工设计没预见的结构——这才是「学习超过设计」的真证据。
    - paragraph [ref=f11e323]: 系列坐标：音素级基础设施谱系——强制对齐工具（Kaldi 等）是边界的传统供应方；本文（2020）把边界检测本身学习化；#10 部分检测器（同年）是边界的直接消费者（靠对齐切关键词）；2021 年 TAML 的音素级文本锚定是更下游的延伸——「组件精度 × 乘性传导 = 系统收益」是这个谱系的共同逻辑。
