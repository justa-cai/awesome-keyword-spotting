      - generic [ref=f43e204]:
        - generic [ref=f43e205]:
          - generic [ref=f43e206]: "1"
          - text: MT 从适配推进到预训练干净码本逐帧 n-hot 伪标签 + 多标签 BCE 掩码预测——混叠鲁棒性烧进主干而非适配期补课，完全不需要人工标注、可扩展到任意量级无标注数据。
        - generic [ref=f43e207]:
          - generic [ref=f43e208]: "2"
          - text: 单头多标签的设计取舍相对 WavLM 只保主导源、MPC 混合记忆、多头 PIT 分支竞争——结构更简、更贴合多标签物理事实；n=1 时严格退化为标准 HuBERT。
        - generic [ref=f43e209]:
          - generic [ref=f43e210]: "3"
          - text: 完整对照网格 + 泛化检验六主干 × 三适配 × 三 shot × 三测试条件；未见 3-mix 的泛化检验直接支持「复合表示」假设；基线围绕「唯一变量是混叠目标设计」搭建。
        - generic [ref=f43e211]:
          - generic [ref=f43e212]: "4"
          - text: 两个落地关键观察混叠能力主要沉淀在主干（干净适配也拿大部分收益）；混叠收益不牺牲干净性能（93.80 全组合最高）。
