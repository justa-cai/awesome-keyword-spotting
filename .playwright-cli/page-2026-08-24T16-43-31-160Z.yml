      - generic [ref=f43e24]:
        - heading "一分钟版本" [level=2] [ref=f43e25]
        - list [ref=f43e26]:
          - listitem [ref=f43e27]: 被忽视的场景：现有少样本 KWS 基准全部假设「单人、单句、无重叠」，但真实家庭里两人同时喊不同唤醒词是常态——单标签 softmax 只报置信度更高的那个词，另一个直接漏检（呼救类关键词漏检不可接受）。注册期用户永远只给干净少样本，混叠鲁棒性必须来自预训练主干。
          - listitem [ref=f43e28]: 方案：沿用 HuBERT 骨架只改监督信号——干净码本（发布版 HuBERT L9 k-means）对每个源独立 tokenize、逐帧取标签并集得 n-hot 目标；softmax 换逐单元 sigmoid + 多标签 BCE；单头不加架构。n=1 时严格退化为标准 HuBERT。
          - listitem [ref=f43e29]: 为什么不用别的：WavLM 去噪式只保主导说话人（非主导当干扰——监督信号里没有它的目标）；MPC 学混合模式记忆（对未见组合崩）；Cocktail HuBERT 多头 PIT 有分支竞争和架构开销。
          - listitem [ref=f43e30]: 结果：2-mix 15-shot Top-2 79.78（比干净 HuBERT 高 18 pp、比 WavLM 高 20 pp）；混叠能力沉淀在主干——只用干净数据适配也有 71.49；未见过的 3-mix 65.91 领先 Cocktail 从 1.24 扩大到 3.26 pp（复合表示可外推，混合记忆不能）；shot 越少优势越大（3-shot +4.29）。
          - listitem [ref=f43e31]: 边界：只有波形线性叠加无噪声混响；两人喊同一词（并集退化为 one-hot）未讨论；HuBERT-BASE 量级与端侧约束差距悬殊且无压缩数字。
