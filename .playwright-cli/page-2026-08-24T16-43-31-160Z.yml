          - generic [ref=f43e103]: · 码本必须来自干净语音：混合码本的中心是复合模式——目标空间本身不可分解
          - generic [ref=f43e104]: · ω 下界 0.1：保证每个源物理上听得见（标签里有的源声学上在场）
          - generic [ref=f43e105]: · 掩码做载体：双向上下文推断，迫使模型用邻近干净线索补全重叠帧两源单元
          - generic [ref=f43e107]: 听觉类比（论文自述）：复杂语音环境中听觉系统总是试图提取干净模式而非混合模式——这正是 n-hot 复合表示的认知动机
          - generic [ref=f43e108]: 适配期冻结主干只加线性层的另一个理由：把「混叠鲁棒性是否在主干」与「适配策略好坏」解耦——六主干×三适配网格成立的前提
        - paragraph [ref=f43e109]: 优雅的自洽性：n=1 时 n-hot 退化为 one-hot（单标签下 BCE 与交叉熵等价）——MT-HuBERT 严格退化为标准 HuBERT，是干净 HuBERT 的真泛化而非另起炉灶，与基线的可比性最大化。
