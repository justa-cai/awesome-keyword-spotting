          - heading "方法的技术局限" [level=4] [ref=f43e219]
          - list [ref=f43e220]:
            - listitem [ref=f43e221]: 混合基数上限：训练适配只到 2-mix；两人喊同一关键词（并集退化为 one-hot、同单元多源激活无法区分源数）未验证未讨论。
            - listitem [ref=f43e222]: 无噪声无混响：纯波形线性叠加——作者前期 MT 工作标题就是「嘈杂和混合语音」，本自监督扩展把噪声维度丢了。
            - listitem [ref=f43e223]: 能量分布错配：预训练 U(0.1,0.9) 宽分布 vs 测试固定 1:1 / 1:1:1——极端能量比（0.1:0.9 强弱势重叠）恰是设计声称要覆盖的场景，未报告。
            - listitem [ref=f43e224]: n-hot 丢源归属：只记「哪些单元在场」不记「属于哪个源」——对 KWS 够用，对说话人分离/源计数不足。
            - listitem [ref=f43e225]: 规模与端侧落差：HuBERT-BASE 量级 vs MHz 级 MCU / 数百 KB SRAM——无压缩/蒸馏/参数量/延迟/FLOPs 任何数字。
            - listitem [ref=f43e226]: 伪标签依赖外部模型：码本取自发布版 HuBERT L9 特征；聚类数 C 未报告。
