  - heading "§02 方法：自训练的闭环" [level=2] [ref=f298e89]:
    - generic [ref=f298e90]: §02
    - text: 方法：自训练的闭环
  - generic [ref=f298e91]: 教师→伪标签→噪声学生→新教师
  - generic [ref=f298e92]:
    - generic [ref=f298e93]: "轮 1: 教师 = 标注数据 + 标准交叉熵训练（流式因果 CNN） 循环: 教师推理未标注数据 → 伪标签（置信度 > 阈值的保留） 学生 = 伪标签 + 四重噪声（SpecAugment / 背景噪声 / 速度音量时移 / Dropout） 学生 → 新教师 → 重新生成伪标签 → 下一轮（典型 2–3 轮）"
    - generic [ref=f298e94]: 人话：老师在安静教室里出题（伪标签），学生在暴风雨里做题（噪声增强）——做会了的学生比老师更能扛。然后这个更能扛的学生当新老师，出的题更准（它自己在噪声下测过），下一轮学生从更好的起点出发——滚雪球。
  - generic [ref=f298e95]:
    - generic [ref=f298e96]:
      - heading "伪标签的置信度过滤" [level=3] [ref=f298e97]
      - paragraph [ref=f298e98]: 教师不确定的样本（低置信度）直接丢弃——这些伪标签大概率是错的，混进来就是噪声标签。过滤是自训练的安全带：宁可用得少，不能用得错。遗留风险：模糊样本（弱音量/高噪声）即使高置信度也可能是系统性错的。
    - generic [ref=f298e99]:
      - heading "为什么迭代会滚雪球" [level=3] [ref=f298e100]
      - paragraph [ref=f298e101]: 学生变教师后，它对噪声样本的伪标签质量比原教师高（自己就在噪声下训过）——下一轮的训练信号更干净；同时新教师的边界更鲁棒，置信度过滤的边界也更准——两个机制相互加强，每轮都有可测量的增量。
