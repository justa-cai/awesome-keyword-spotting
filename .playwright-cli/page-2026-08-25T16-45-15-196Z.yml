- generic [ref=f298e2]:
  - generic [ref=f298e3]: 论文精读 · 可视化版 · 2021 №20
  - heading "教师贴标签、学生挨噪声： 换着来，越换越皮实——Google 的自训练进 KWS" [level=1] [ref=f298e4]: 教师贴标签、学生挨噪声：换着来，越换越皮实——Google 的自训练进 KWS
  - generic [ref=f298e5]:
    - generic [ref=f298e6]: Noisy Student Training · Google Research
    - generic [ref=f298e7]: Interspeech 2021 · arXiv 2106.01604 · 已上产品
    - generic [ref=f298e8]: 迭代自训练 + 四重噪声注入 + 置信度过滤
    - generic [ref=f298e9]: 噪声测试 +5–10% vs 教师 · 10% 标注逼近 100% 基线
  - generic [ref=f298e10]: 一句话：干净数据训练的 KWS 在噪声/远场/口音下掉点严重，而标注噪声数据成本极高。本文把 Google 在 ImageNet 上的 Noisy Student Training 搬进流式 KWS：教师模型给海量未标注音频贴伪标签（置信度过滤），学生在四重噪声（SpecAugment/背景噪声/速度音量时移/Dropout）中用伪标签训练，训完的学生变成新教师再来一轮。噪声测试集比教师高 5–10%，10% 标注 + 大量未标注能逼近 100% 标注的基线——方法已用于 Google 实际产品。
  - generic [ref=f298e11]:
    - generic [ref=f298e12]: TL;DR
    - listitem [ref=f298e13]: ◈ 干净的脆弱：干净训练的模型在噪声、远场、不同说话人/口音下显著掉点——标注噪声数据不可能覆盖所有部署条件；未标注数据 + 激进增强是另一条路（NST 在 ImageNet 已验证，本文跨领域迁移到流式 KWS）。
    - listitem [ref=f298e14]: ◈ 流式 KWS 的三条特殊约束：时序依赖（增强要考虑时间维，与图像增强参数空间不同）；因果性（全程因果卷积，不能偷看未来）；误报敏感（增强不能以牺牲误报率为代价——增强过头会教出「什么都像唤醒词」的学生）。
    - listitem [ref=f298e15]: ◈ 自训练循环四步：① 教师在标注数据上训练（标准 CE · 流式因果 CNN）→ ② 教师给未标注数据生成伪标签（软/硬标签 + 置信度阈值过滤）→ ③ 学生在伪标签 + 四重噪声下训练 → ④ 学生变新教师，回到②——典型迭代 2–3 轮。
    - listitem [ref=f298e16]: ◈ 四重噪声注入：SpecAugment（时间/频率遮蔽）· 背景噪声叠加（噪声库随机）· 音频扰动（速度/音量/时移）· Dropout（模型级正则噪声）——每个样本被扩展成一族变体。
    - listitem [ref=f298e17]: ◈ 关键洞察：噪声逼学生学出比教师更鲁棒的决策边界（边界被推开留出缓冲带），伪标签保证方向不跑偏——「在更难的条件里学老师给的标准答案」。三个条件缺一不可。
    - listitem [ref=f298e18]: ◈ 结果（约值）：噪声测试集 +5–10% vs 教师；第一轮 +3–5%、第二轮再 +1–3%、第三轮递减——逐轮累积；环境/音乐/人声嘈杂全改善，低 SNR 下更显著；误报下降同时召回保持/提升。
    - listitem [ref=f298e19]: ◈ 标注稀缺场景的杀手锏：10% 标注 + 大量未标注 ≈ 100% 标注基线；50%/25% 标注也能恢复大部分性能——半监督直接把标注预算的价值放大了约 10 倍。
    - listitem [ref=f298e20]: ◈ 边界：需要数十到数百倍于标注量的未标注数据（低资源语言难拿）；多轮训练时间是单次的数倍；伪标签在模糊样本上可能引噪；未与 FixMatch/UDA 对比。
  - heading "§01 问题：干净训练的脆弱" [level=2] [ref=f298e21]:
    - generic [ref=f298e22]: §01
    - text: 问题：干净训练的脆弱
  - generic [ref=f298e23]: 三条流式约束 + 未标注数据的机会
  - generic [ref=f298e24]:
    - generic [ref=f298e25]:
      - heading "标注噪声数据的天价" [level=3] [ref=f298e26]
      - paragraph [ref=f298e27]: 真实部署的声学条件（各种噪声 × 远场 × 口音 × 说话人）组合爆炸——逐条标注不可能覆盖。而未标注音频几乎免费（数十到数百倍于标注量）—— NST 的全部赌注就压在这份免费数据上。
    - generic [ref=f298e28]:
      - heading "误报敏感约束增强设计" [level=3] [ref=f298e29]
      - paragraph [ref=f298e30]: 图像分类的增强可以激进，KWS 不行——增强过头会把非关键词也变得「像」关键词，教出高误报的学生。增强强度与类型必须配合误报率监控——这是流式 KWS 适配 NST 的核心工程难点。
    - generic [ref=f298e31]:
      - heading "跨领域迁移的证据" [level=3] [ref=f298e32]
      - paragraph [ref=f298e33]: NST 在 ImageNet 上的成功依赖「未标注数据分布 ≈ 测试分布」——本文验证了这条假设在音频同样成立：海量未标注音频覆盖的声学多样性，正是鲁棒性缺的那块拼图。
    - generic [ref=f298e34]:
      - heading "与 SSL 路线的互补" [level=3] [ref=f298e35]
      - paragraph [ref=f298e36]: 同年 SSL 多任务（№19）用未标注数据学通用表示，本文用未标注数据做自训练——两条路线都在榨未标注数据的价值：一个换表示质量，一个换决策边界鲁棒性，可叠加。
