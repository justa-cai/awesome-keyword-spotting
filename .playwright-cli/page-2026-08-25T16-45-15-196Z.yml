  - generic [ref=f298e239]:
    - generic [ref=f298e240]: 读表要点
    - listitem [ref=f298e241]: ◈ 「低 SNR 下改善更显著」有信息量：NST 的收益集中在最难的条件——未标注数据的多样性恰好覆盖了这些训练分布之外的角落。鲁棒性主张与数据机制自洽。
    - listitem [ref=f298e242]: ◈ 「误报下降 + 召回不降」打破了「增强换鲁棒必伤精度」的直觉——伪标签锚定方向 + 置信度过滤的功劳；这也是方法能上 Google 产品的必要条件。
    - listitem [ref=f298e243]: ◈ 证据边界要记：未标注数据量需求大（低资源语言难）；总训练时间数倍；伪标签质量在模糊样本上有系统风险；未与 FixMatch/UDA 横比、无真实用户 A/B——「产品可用」的背书来自 Google 内部实践而非论文实验。
