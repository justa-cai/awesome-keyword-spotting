  - generic [ref=f298e286]:
    - generic [ref=f298e287]: 可迁移判断
    - paragraph [ref=f298e288]: ↳ 教师定方向、噪声练学生：自训练范式的本质是「在更难的条件里学标准答案」——不依赖任务细节，任何有大量未标注数据 + 部署条件恶劣的语音任务都可平移（增强类型按任务重设计即可）。
    - paragraph [ref=f298e289]: ↳ 未标注数据是鲁棒性的免费来源：10% 标注 + 未标注 ≈ 100% 基线——标注预算的价值被放大十倍。决策「要不要投资标注」之前，先算手里未标注数据的存量。
    - paragraph [ref=f298e290]: ↳ 置信度过滤是自训练的安全带：宁可用得少、不能用得错——低置信度伪标签的引入是系统性投毒。所有伪标签工作流都该默认带这道闸门。
    - paragraph [ref=f298e291]: ↳ 迭代收益递减要提前认账：第一轮大头、逐轮递减、2–3 轮封顶——自训练的计算成本是线性叠加的，边际收益递减意味着该停就停；「再来一轮总会有提升」不成立。
