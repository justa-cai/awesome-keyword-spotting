  - generic [ref=f275e339]:
    - generic [ref=f275e340]: 可迁移判断
    - paragraph [ref=f275e341]: ↳ 并非所有维度变换都需要学习：先分清操作是事务性（对齐/复制，memcpy 即可）还是判别性（特征变换，值得花参数）——把学习预算全部留给判别力。这条审查适用于任何带维度匹配组件的网络。
    - paragraph [ref=f275e342]: ↳ 参数预算要跟着信息密度走：MFCC 前端已把频率编码成通道，时间维才是判别力的来源——算子按维度的信息密度分配，而不是默认均匀。审架构时问一句「这层的钱花在信息最密的维度上了吗」。
    - paragraph [ref=f275e343]: ↳ 残差连接值 1–2%，但它的投影不值：梯度流动的红利与投影层的学习开销是两件事——消融拆开看，红利用免费的方式保留，开销直接砍掉。
    - paragraph [ref=f275e344]: ↳ 简洁性本身就是工程价值：无特殊技巧、配方透明、官方开源——BC-ResNet 成为后续几十篇工作的默认骨干不是因为某个单点最强，而是因为它「干净到可以当尺子」。
