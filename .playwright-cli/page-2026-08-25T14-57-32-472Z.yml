- generic [ref=f275e2]:
  - generic [ref=f275e3]: 论文精读 · 可视化版 · 2021 №8 · 系列基石
  - heading "维度匹配不需要学习： 用「复制」替掉投影层，卷积只卷时间轴" [level=1] [ref=f275e4]: 维度匹配不需要学习：用「复制」替掉投影层，卷积只卷时间轴
  - generic [ref=f275e5]:
    - generic [ref=f275e6]: BC-ResNet · 高通 AI 研究 + 韩国大学
    - generic [ref=f275e7]: Interspeech 2021 · arXiv 2106.04140
    - generic [ref=f275e8]: 广播残差（零参数）+ 时频分解卷积
    - generic [ref=f275e9]: GSC v1/v2 98.0%/98.7% · 25K 参数 · MADD 5M
  - generic [ref=f275e10]: 一句话：残差连接在通道数变化时要花 C_in×C_out 个参数做 1×1 投影——占整块的 10–15%，而这只是「维度匹配」的事务性操作。BC-ResNet 用零参数的广播（通道取模复制，硬件上就是 memcpy）替掉投影，再把 2D 卷积分解为 1D 时间深度卷积 + 1×1 通道混合（频率核的钱整个省下投给时间轴）。GSC v1/v2 拿到 98.0%/98.7%，四档变体（12K–100K）覆盖从 MCU 到边缘的全部预算——2021 年 GSC 最佳结果之一，后续大量 KWS 工作的默认骨干。
  - generic [ref=f275e11]:
    - generic [ref=f275e12]: TL;DR
    - listitem [ref=f275e13]: ◈ 两处被忽视的浪费：投影残差的隐性税（1×1 投影匹配通道维度，扩展比 2 时占整块 10–15% 参数）与 2D 卷积的平摊浪费（时间维承载关键时序模式、频率维只是通道信息，却平分算力）。
    - listitem [ref=f275e14]: "◈ 广播残差学习（BRL）：Broadcast(x)_{b,t,c} = x_{b,t, c mod C_in}——通道取模复制，C_in 整除 C_out 就复制 C_out/C_in 次，否则零填充。零参数、零 MAC，硬件上只是一次内存复制。"
    - listitem [ref=f275e15]: ◈ 合理性论证：残差路径的作用是让恒等信息可达（保梯度流动），不是做特征变换；KWS 初始阶段各通道确实从相同输入提取信息——「不同输出通道需要相同输入」的假设在此成立。
    - listitem [ref=f275e16]: ◈ 时频分解：DW 1D 时间卷积（核 3/5，捕音素过渡）+ 1×1 逐点卷积（通道/频率混合）——比标准 2D 深度可分离卷积省约 K_f 倍参数，频率核整个消失。
    - listitem [ref=f275e17]: ◈ 模块六步：DW 时间卷积 → BN+ReLU → 1×1 → BN → 广播残差跨接 → ReLU——残差跨越整个变换模块保证梯度流动，广播消除投影开销。
    - listitem [ref=f275e18]: ◈ 结果：GSC v1 12 类 98.0%（Att-RNN 97.7 / DS-CNN 97.5）、v2 98.7% 同参数预算一致最优；BC-ResNet-8（25K）对位胜 DS-CNN-S（24K）；MADD 5M vs DS-CNN 8M；~10K 最小档也有约 96%。
    - listitem [ref=f275e19]: ◈ 消融把账算清：广播替投影 −15% 参数、掉点 <0.1%；2D 替 1D 多 30% 参数只换 ≤0.2%；完全去残差掉 1–2%——两个创新各有格子背书。
    - listitem [ref=f275e20]: ◈ 部署：全部变体 MCU 级实时（<10ms）；训练配方极简（余弦退火 + 标签平滑 0.1，无特殊技巧）；高通开源官方实现——简洁性使它成为基线首选。
    - listitem [ref=f275e21]: ◈ 边界：广播的表达力上限（固定复制，大任务可能不够）；频率局部结构损失（声调语言存疑）；仅 GSC 干净数据；无流式/量化评估。
  - heading "§01 问题：两处习以为常的浪费" [level=2] [ref=f275e22]:
    - generic [ref=f275e23]: §01
    - text: 问题：两处习以为常的浪费
  - generic [ref=f275e24]: 投影层的事务性开销 + 频率核的低回报
  - generic [ref=f275e25]:
    - generic [ref=f275e26]:
      - heading "投影残差：为匹配维度付学费" [level=3] [ref=f275e27]
      - paragraph [ref=f275e28]: 标准残差连接在输入输出通道不一致时必须过 1×1 投影——参数 C_in×C_out，通道扩展比为 2 时占整个残差块的 10–15%。而它做的事只是「把张量形状对齐」：一个事务性操作，却被当成特征变换付了学习预算。
    - generic [ref=f275e29]:
      - heading "2D 卷积：算力平摊给低回报维度" [level=3] [ref=f275e30]
      - paragraph [ref=f275e31]: 时间维承载音素序列、韵律变化——KWS 的判别力主要在这里；频率维主要提供通道信息，局部卷积贡献相对小。2D 核把算力平摊给两个维度，等于把钱花在低回报的频率核上。
    - generic [ref=f275e32]:
      - heading "设计哲学一句话" [level=3] [ref=f275e33]
      - paragraph [ref=f275e34]: 「把计算资源集中在最关键的信息维度上」——时间建模拿大头，频率用轻量 1×1 处理；维度匹配这种不产生判别力的操作，交给 memcpy。两个创新是同一条哲学的两处落地。
    - generic [ref=f275e35]:
      - heading "为什么这假设在 KWS 成立" [level=3] [ref=f275e36]
      - paragraph [ref=f275e37]: 广播假设「不同输出通道需要相同输入信息」——KWS 任务相对简单、初始阶段各通道从相同输入提取信息，复制就够；更大任务/更长语音时该假设可能不成立（这是方法的外推边界）。
