      - generic [ref=f275e320]: · 广播的表达力上限：固定复制无学习——需要复杂非线性维度变换的场景
      - generic [ref=f275e321]: 可能不如投影层；更大任务/更长语音时简化假设可能不成立
      - generic [ref=f275e322]: （KWS 的相对简单性使这一限制影响较小——但别默认外推）
      - generic [ref=f275e323]: · 频率局部结构损失：1D 时间卷积把频率维当通道——精细频率区分
