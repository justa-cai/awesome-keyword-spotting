  - heading "§02 方法：memcpy 替学习，时间轴拿走预算" [level=2] [ref=f275e108]:
    - generic [ref=f275e109]: §02
    - text: 方法：memcpy 替学习，时间轴拿走预算
  - generic [ref=f275e110]: 取模复制的数学 · 频率核的消失
  - generic [ref=f275e111]:
    - generic [ref=f275e112]: "标准残差: output = F(x) + Projection(x) # Projection = 1×1 卷积，参数 C_in×C_out 广播残差: output = F(x) + Broadcast(x) Broadcast(x)_{b,t,c} = x_{b,t, c mod C_in} # 取模复制：零参数 · 零 MAC 时频分解: DW 1D 时间卷积（参数 C×K_t） + 1×1 逐点卷积（参数 C_in×C_out） vs 2D DS 卷积 → 参数省约 K_f 倍（频率核消失）"
    - generic [ref=f275e113]: 人话：投影层花一整个 C_in×C_out 的权重矩阵干「复制就能干的事」——广播用取模索引把每个输入通道复制到多个输出通道，硬件上就是内存拷贝。时频分解同理：MFCC 已经把频率信息编码成通道，2D 核在频率方向学的增量不值得那个价钱——砍掉，钱全给时间轴。
  - generic [ref=f275e114]:
    - generic [ref=f275e115]:
      - heading "残差本身的账也算过" [level=3] [ref=f275e116]
      - paragraph [ref=f275e117]: 完全移除残差连接掉 1–2%——梯度流动本身值这个价；投影残差与广播残差准确率接近但后者参数更少。三层消融合起来：残差要留（值 1–2%）、投影换成广播（免费）、2D 换 1D（省 30% 只损失 ≤0.2%）——每个决策都有格子背书。
    - generic [ref=f275e118]:
      - heading "硬件视角：用访存换计算" [level=3] [ref=f275e119]
      - paragraph [ref=f275e120]: 广播是「用访存换计算」的极端形式——零 MAC、零参数、只动内存。在 MCU 上乘加单元是稀缺资源而访存相对便宜，这个交换方向恰好正确；所有变体推理 <10ms。
