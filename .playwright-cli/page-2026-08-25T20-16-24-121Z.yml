        - generic [ref=f17e216]: "1"
        - paragraph [ref=f17e217]: "与 #11 度量学习构成两条竞争路线。音素匹配（本文）靠语言学先验：模板可解释、注册只需文本，但上限受音素识别器约束；嵌入空间（#11）靠数据学几何：判别力直接服务检测，但注册要说几遍、几何难解释。两条路线在 2021 年 TAML 合流。"
      - generic [ref=f17e218]:
        - generic [ref=f17e219]: "2"
        - paragraph [ref=f17e220]: 长词优势来自证据积累。音素模板越长，匹配分积累的证据越多、单音素误判的相对影响越小——这解释了为什么实际产品唤醒词普遍设计成 4 音素以上（「Hey Siri」「小爱同学」都不是单音节）。
      - generic [ref=f17e221]:
        - generic [ref=f17e222]: "3"
        - paragraph [ref=f17e223]: 量化分析做到门级是难得的深度。多数量化论文停在「整体精度掉了多少」；本文定位到输入-遗忘门——循环网络量化的工程指南价值（哪部分要高精度、哪部分可以压）超出 KWS 本身。
