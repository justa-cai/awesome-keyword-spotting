  - generic [ref=f17e73]:
    - generic [ref=f17e74]: "02"
    - heading "机制：解耦与它的敏感点" [level=2] [ref=f17e75]
    - paragraph [ref=f17e76]: 这个系统的优雅之处在于职责切分：LSTM 声学模型输出帧级音素后验（每帧一个 ~40 维分布），它对「词」一无所知；DTW/Viterbi 把后验序列与关键词模板对齐、累计匹配分、过阈判决——词的知识完全活在模板这一行数据里。换词、加词、换语言（换音素集+G2P）都不碰模型。
