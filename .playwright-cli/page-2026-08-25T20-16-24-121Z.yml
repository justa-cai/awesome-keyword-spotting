      - paragraph [ref=f17e274]: ① 模型与词表解耦是开放词表的全部秘密。
      - generic [ref=f17e275]: ↳ 把「词的知识」从参数搬到数据（一行音素模板），训练一次服务任意词——凡是要支持用户自定义类目的系统（唤醒词、命令词、报警规则），先问：类目的知识能不能从模型里搬出来？
