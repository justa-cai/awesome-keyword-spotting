    - generic [ref=f17e123]: 图 2 · 机制解剖：六步检测流水线 · LSTM 量化的门级敏感度
    - generic [ref=f17e124]:
      - generic [ref=f17e125]: "声学: P(phoneme | frame_t) = softmax(LSTM(Mel_t)) ← ~40 维音素后验, 逐帧 匹配: score = DTW/Viterbi(后验序列, 模板 /AE L EH K S AH/) 注册: 文本 → G2P → 音素模板（零训练, 秒级） 量化: float32 → int8 (体积 −75%); 输入/遗忘门最敏感; QAT > PTQ"
      - generic [ref=f17e126]: 人话：模型是个「音素听力员」，每帧报告听到了哪个音；每个关键词是一张「音素清单」；匹配器对清单逐项核对，全对上就报警。要加新词，写一张新清单就行——听力员不用重新培训。
    - paragraph [ref=f17e127]: LSTM 量化的特殊困难在循环连接：门参数的微小量化偏差会在时间维逐帧累积——输入门与遗忘门因此最敏感。这也是循环网络量化比前馈网络更娇气的一般原因；QAT 把量化噪声揉进训练过程，恢复效果稳定优于训练后量化。
