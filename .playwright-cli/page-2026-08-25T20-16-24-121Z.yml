      - generic [ref=f17e277]: ↳ 音素是语音的「字母表」——用它做中间层换来了模板可解释与文本注册，但也继承了 G2P 与音素识别器的全部误差；选中间表示（音素/子词/嵌入）就是在「可解释性 × 判别力 × 标注成本」之间选址。
      - paragraph [ref=f17e278]: ③ 循环网络的量化要按门级敏感度分配精度。
      - generic [ref=f17e279]: ↳ 输入-遗忘门的量化误差经循环连接逐帧放大——混合精度（敏感门高比特、其余 int8）是循环模型量化的正确姿势；「整体掉多少点」的笼统报告掩盖了这种结构性差异。
