  - generic [ref=f17e12]: Sonos Inc. + Aalborg University（Lopez-Espejo / Tan / Jensen——与 №6 滤波器组学习同一团队）· arXiv 2002.10851（2020.02） 问题：封闭词表不能自定义、换语言换模型、加词要重训 · 方法：通用 LSTM 音素识别器（~40 维帧级后验）+ DTW/Viterbi 模板匹配 + 文本经 G2P 注册 + int8 量化 一句话：词的知识从模型参数搬进一行音素模板——训练一次服务任意词，int8 体积 −75% 精度仅轻微下降。
  - generic [ref=f17e13]:
    - generic [ref=f17e14]: "01"
    - heading "问题：词表锁死在参数里" [level=2] [ref=f17e15]
    - generic [ref=f17e16]:
      - generic [ref=f17e17]: TL;DR
      - list [ref=f17e18]:
        - listitem [ref=f17e19]: ◆ 封闭词表的三道锁：灵活性差（用户不能自定义）、多语言难（每语种一个模型）、更新成本高（加词=重训）——产品迭代被模型周期绑架。
        - listitem [ref=f17e20]: ◆ 开放词表的解耦思路：训练一个通用音素识别器，关键词以音素序列模板定义（「Alexa」→ /AE L EH K S AH/）——模型只管「听到了哪些音素」，词的判断交给匹配层。
        - listitem [ref=f17e21]: ◆ 注册流程零训练：用户给文本 → G2P 转音素 → 存模板——加词是秒级的数据操作，不是天级的模型工程。
        - listitem [ref=f17e22]: ◆ 量化研究落到 LSTM 的细节：输入-遗忘门对量化最敏感（循环误差逐帧累积），QAT 恢复优于 PTQ；长关键词（多音素）天然更易检测。
