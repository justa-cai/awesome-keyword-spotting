    - generic [ref=f87e258]:
      - generic [ref=f87e259]: JUDGEMENT
      - paragraph [ref=f87e260]: ↳ 架构红利可以被推理策略再放大一层：TDNN 选对骨架只省了一部分，帧跳过和批量缓存又省一层——端侧优化的正确姿势是「架构 × 训练 × 推理调度」三层一起抠，只抠一层会剩一半的钱没捡。
      - paragraph [ref=f87e261]: ↳ 通用预训练是小数据的解药：音素分类学到的声学表示与具体关键词无关——「先懂语音、再认词」的两阶段在 2018 年已是标准操作，今天只是把音素语料换成了自监督语料。
      - paragraph [ref=f87e262]: ↳ 省算力与保召回存在硬边界：帧跳过率逼近关键词最短音素时长时必然漏检——「每 N 帧算一次」的 N 要按目标词的音素尺度定标，不能只看总算力节省。
