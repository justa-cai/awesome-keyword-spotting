  - generic [ref=f87e79]:
    - heading "2 机制：时间延迟连接的几何与帧跳过" [level=2] [ref=f87e80]:
      - generic [ref=f87e81]: "2"
      - text: 机制：时间延迟连接的几何与帧跳过
    - generic [ref=f87e82]:
      - generic [ref=f87e83]:
        - heading "时间延迟连接" [level=3] [ref=f87e84]
        - text: 每层节点接收前一层 ±d 时间步的输入——感受野逐层叠加，两层后 ±2 步；全是前馈连接，无状态可并行。
      - generic [ref=f87e85]:
        - heading "帧跳过" [level=3] [ref=f87e86]
        - text: 特征仍按 10ms 提取，但每 N 帧才做一次网络推理——中间帧插值或缓存复用；适度跳过几乎无损。
      - generic [ref=f87e87]:
        - heading "输出缓存" [level=3] [ref=f87e88]
        - text: 攒 N 帧进缓冲区批量推理——矩阵运算吃满并行，均摊每帧成本更低。
      - generic [ref=f87e89]:
        - heading "端到端无 HMM" [level=3] [ref=f87e90]
        - text: 直接用 TDNN 帧级输出 + 平滑/阈值做关键词判断——砍掉 Viterbi 解码，部署复杂度大降。
