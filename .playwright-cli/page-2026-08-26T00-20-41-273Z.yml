      - generic [ref=f87e173]: "h^l(t) = f( Σ_{τ=−d}^{d} W^l(τ) · h^{l−1}(t+τ) + b ) τ 是时间偏移，不是循环"
      - generic [ref=f87e174]: 人话：每一层不只看「现在」，还看「前后各 d 拍」——就像用一组错开时间的快照拼出动态。因为看的是固定的前后几拍（不是自己上一时刻的输出），整段音频的所有帧可以一次算完，不用像 RNN 那样一帧一帧等。
