      - generic [ref=f36e130]: 「更准」而是「更能拒绝噪声」
      - generic [ref=f36e131]: 左：膨胀率每层翻倍，感受野指数扩张——182 帧的视野零参数代价，这是无状态网络能覆盖整句唤醒词的机制。右：门控是时间维的软开关——干净时作用微小、噪声时是命门，消融给出了干净的证据
    - generic [ref=f36e132]: 图 2 · 机制解剖：感受野的指数扩张 · 门控激活在噪声里的作用机制
    - generic [ref=f36e133]:
      - generic [ref=f36e134]: "门控: z = tanh(W_f * x) ⊙ σ(W_g * x) ← 滤波门提特征, 门控门控流量 残差: output = Conv_1×1(z) + x ← 梯度直达, 24 层可训 跳跃: Σ 各层输出(1×1 后) → 最终输出 ← 多尺度感受野信息汇总 标签: 仅词结束后 δ=160ms 窗口内帧 → 正类 ← 学「终点事件」非逐帧对齐"
      - generic [ref=f36e135]: 人话：空洞卷积像「隔帧取样」——每层往回看得翻倍地远，但每次只取同样多的点，视野免费扩张；门控像每层装了个音量旋钮，噪声时刻拧小、关键帧拧大。「关键词结束」标签则把任务从「逐帧拼写检查」简化成「听终点」。
    - paragraph [ref=f36e136]: 门控消融的对比极有信息量：干净环境去掉门控只差 0.03pp（0.12%→0.15%），噪声环境却差 2.57pp（1.60%→4.17%）——门控的价值不在「更准」而在「更能拒绝噪声」：它给了网络逐时间步抑制无关信号的通路，纯 tanh 激活只能让所有时间步平等灌入。
