  - generic [ref=f36e13]:
    - generic [ref=f36e14]: "01"
    - heading "问题：RNN 的状态是部署税" [level=2] [ref=f36e15]
    - generic [ref=f36e16]:
      - generic [ref=f36e17]: TL;DR
      - list [ref=f36e18]:
        - listitem [ref=f36e19]: ◆ 唤醒词检测的三难：资源受限持续监听 · 低延迟 · 低误拒低误报——RNN 的状态饱和（要周期性重置、重置丢信息）让第一难雪上加霜。
        - listitem [ref=f36e20]: ◆ 标准 CNN 感受野不够（数百帧的唤醒词罩不住）、HMM 要音素精确对齐——三条路各有硬伤；核心需求是无状态的长时程建模。
        - listitem [ref=f36e21]: "◆ WaveNet 式答案：空洞卷积让感受野指数扩张而参数不增（{1,2,4,8} 循环 24 层 = 182 帧 ≈ 1.83 秒），完全并行、无状态、因果流式友好。"
        - listitem [ref=f36e22]: ◆ 两个关键设计：门控激活（tanh ⊙ sigmoid——时间维软开关，噪声环境的命门）与 「关键词结束」标签（只在词尾 δ=160ms 窗口标正——学「词说完了」而非逐帧对齐）。
