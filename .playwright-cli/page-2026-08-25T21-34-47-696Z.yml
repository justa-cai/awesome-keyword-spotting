      - paragraph [ref=f36e269]: ① 无状态架构用「结构换状态」。
      - generic [ref=f36e270]: ↳ 感受野靠膨胀率指数扩张、时序选择靠门控、训练深度靠残差——三件套合起来替代了 RNN 的递归状态；当状态管理成为部署负担（重置逻辑、饱和、顺序依赖）时，这条路线用完全并行换来工程简单性，代价是中间激活的内存。
      - paragraph [ref=f36e271]: ② 门控的价值在「拒绝噪声」不在「提升精度」。
      - generic [ref=f36e272]: ↳ 干净环境门控几乎无用、噪声环境是命门——评估一个组件时要在多个 SNR 条件下分别看，单点准确率会完全掩盖这类「条件依赖型」组件的价值。
      - paragraph [ref=f36e273]: ③ 把标注目标从「逐帧对齐」改成「终点事件」能简化学习。
      - generic [ref=f36e274]: "↳ end-of-keyword 标签让模型只学「词说完了」——任务从拼写检查变成听终点；这个思路与后来 #10 的部分-整体检测异曲同工：把结构先验编码进标签设计，比让模型自己从逐帧标签里发现结构更高效。"
    - paragraph [ref=f36e275]: "系列坐标：无状态 KWS 架构线的源头——others（2018）的 max-pooling LSTM 是本文的对照基线；本文（2019）确立「空洞 × 门控」骨架后，2020 年 MatchboxNet 在同骨架上换深度可分离卷积再砍参数一个量级；2020 #16 的 NAS 把空洞卷积放进搜索空间且被独立选中（本文先验证了算子价值）；2020 #22 MTConv 是多尺度时间卷积的延续——这条线从这里一路演化到 BC-ResNet。"
