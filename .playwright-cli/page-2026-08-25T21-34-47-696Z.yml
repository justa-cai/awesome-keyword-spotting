  - generic [ref=f36e75]:
    - generic [ref=f36e76]: "02"
    - heading "机制：免费的视野与软开关" [level=2] [ref=f36e77]
    - paragraph [ref=f36e78]: "空洞卷积的「免费看远」是整套架构的地基：膨胀率每层翻倍，核大小 2 的 4 层 {1,2,4,8} 感受野 19 帧；循环 6 个 block 共 24 层，182 帧 ≈ 1.83 秒——恰好罩住典型唤醒词，而参数量与标准卷积完全相同。无状态 + 完全并行，对比 RNN 的顺序依赖与重置管理，是工程简单性的完胜。"
    - img [ref=f36e79]:
      - generic [ref=f36e81]: 机制解剖：感受野的指数扩张 · 门控为什么在噪声里是命门
