      - generic [ref=f103e211]: 值得追的方向：① 多读出 + 胜者通吃，标定「神经元数-功耗-词表规模」scaling 曲线回答容量边界；② 严格实时流式模式功耗曲线 + 事件驱动唤醒 / 时钟门控进一步压 idle，补「频率-推理率-功耗」scaling 支撑选型；③ 加噪 / 远场 / 多说话人下的 TPR-FPR 工作点 + 与 MFCC 前端 ANN 等精度比能效——回答「事件编码到底牺牲了多少鲁棒性」；④ 推动 Aloha 类基准强制计入预处理能耗——Xylo 的片上前端在该口径下反而放大优势；⑤ 向 VAD / 声学事件检测 / 工业声学监测迁移（Rockpool + Xylo 工具链可直接复用）；⑥ 更低比特量化与系统性的「量化-精度-功耗」三角。
