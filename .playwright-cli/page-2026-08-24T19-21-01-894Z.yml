      - heading "给神经形态能效主张一次公平的检验" [level=2] [ref=f103e36]
      - generic [ref=f103e38]: 用 Table II 实测给现有方案「验伤」：① 通用处理器功耗数量级完全不对——GPU 动态 22860mW / 29.67mJ/Inf，为吞吐而生，事件稀疏性无从兑现；② 嵌入式加速器不解决常驻底噪——Movidius idle 仍 210mW，而常驻 KWS 绝大多数时间静默、烧的全是 idle；③ 第一代神经形态芯片拉低两个数量级但 idle 仍高——Loihi 两份报告 idle 都是 29mW（全年 ~254Wh，电池设备背不动）；SpiNNaker2 动态能量 7.1µJ 出色但活跃能量未报（另文报整体 390mW）；④ 预处理被系统性排除在对比外；⑤ 精度基准线 93%——省电方案必须守住否则能效无意义。四件咬合的事：编码要稀疏（否则活动稀疏无从谈起）、网络要小（否则动态压不下来）、量化要不掉线、测量要真实（不接受仿真 / datasheet 推算）。
