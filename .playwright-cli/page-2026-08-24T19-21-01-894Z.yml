      - generic [ref=f103e25]:
        - heading "一分钟版本" [level=2] [ref=f103e26]
        - list [ref=f103e27]:
          - listitem [ref=f103e28]: 第一性约束：KWS 是 always-on 负载——功耗直接换算成电池体积与产品形态；毫瓦级对纽扣电池 / 能量采集设备仍太贵（10mW 持续监听，CR2032 数周耗尽——笔记推算）。神经形态切入的逻辑：活动稀疏与「绝大多数时间没有唤醒词」的负载特征天然咬合。
          - listitem [ref=f103e29]: 被忽视的不公平：以往 Aloha 基准的全部平台都在宿主机上算 MFCC 再喂设备——预处理能耗不计入成绩单，跨平台能效对比系统性偏乐观；而 MFCC 前端恰是常驻 KWS 的能耗大头之一。
          - listitem [ref=f103e30]: 方案：整条链路进一颗芯片——模拟前端（LNA 0/6/12dB）→ 16 通道二阶带通（Q=4，40-16940Hz）+ 整流 + LIF 的片上事件编码（等效实时稀疏时频表示，<50µW）→ SynNet 前馈 SNN（线性矩阵 + LIF 交错，τ 金字塔：浅层短时间常数保毫秒级瞬态、深层长常数积分到秒级）→ 单读出 LIF（发没发事件即判决，省掉 softmax）。
          - listitem [ref=f103e31]: 训练（PeakLoss）：目标样本只要求「峰后 140ms 平均膜电位达 1.5」——对关键词位置不敏感、直接优化部署判决量；非目标整条贴零且权重 ×1.4（补偿 3:1 欠采样压误唤醒——笔记解释）。
          - listitem [ref=f103e32]: 账本（全部物理实测）：idle 216µW（比 Loihi 低 134×——全年 1.9Wh 对 254Wh）、动态 291µW、动态能量 6.6µJ/Inf（比 GPU 低 4495×、比 SpiNNaker2 低 7%）、活跃能量 11µJ；量化部署后 95.31% > 93% 基准线。
          - listitem [ref=f103e33]: 量化行为迁移：461 模型量化后整体只掉 1.57 点，但 TPR 掉 6.25 的同时 FPR 降 3.13——读出整体变保守；对唤醒词这是划算交易（误唤醒代价 > 漏唤醒）。缺口：192 条测试集粒度 0.52 点、无方差；零鲁棒性测试；单关键词单读出；严格实时模式功耗未报。
    - generic [ref=f103e34]:
