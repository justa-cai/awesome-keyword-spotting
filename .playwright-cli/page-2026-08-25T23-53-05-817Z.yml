      - generic [ref=f69e148]: w_ternary = +1 if w > Δ | 0 if |w| ≤ Δ | −1 if w < Δ （32-bit → ~2-bit ≈ 理论 16×）
      - generic [ref=f69e149]: 人话：把权重按阈值 Δ 扔进三个桶。正桶当 +1、负桶当 −1、中间的当 0 直接扔掉连接。乘法从此消失——卷积变成「加一些、减一些、跳过一些」。Δ 的取值正是论文设计空间分析的核心超参之一。
