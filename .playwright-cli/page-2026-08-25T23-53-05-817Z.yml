      - generic [ref=f69e243]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f69e244]:
      - generic [ref=f69e245]: JUDGEMENT
      - paragraph [ref=f69e246]: ↳ 压缩要选正交的轴叠加：一个砍「算多少次」（条件计算），一个砍「每次多贵」（低比特权重）——作用于同一瓶颈的两个技术，收益不会相乘。
      - paragraph [ref=f69e247]: ↳ 架构要顺着硬件的纹理长：Cortex-M 擅长位运算和分支，TNT 的三值 + 树路由就是把这两个强项用满——反着硬件纹理设计的压缩，理论数字再好看也落不了地。
      - paragraph [ref=f69e248]: ↳ 理论压缩比是必要不充分条件：不规则访存、内核优化缺位都能让纸面收益蒸发——引用压缩倍数时，先问「在哪个内核、哪块硬件上测的」。
