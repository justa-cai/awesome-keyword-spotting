        - heading "神经树 = 小网络当内部节点" [level=3] [ref=f69e95]
        - text: 决策树内部节点由小型神经网络替代，softmax 软路由可微，整棵树端到端训练——不是把树和网络拼在一起，是树本身就在学。
      - generic [ref=f69e96]:
        - 'heading "三值量化 {-1, 0, +1}" [level=3] [ref=f69e97]'
        - text: 阈值 Δ 分桶；乘法退化为加减法，0 权重的连接直接跳过——存储、运算、硬件三本账同时受益。
      - generic [ref=f69e98]:
        - heading "条件计算" [level=3] [ref=f69e99]
        - text: 不同输入走不同分支，每个样本只经过树的一部分——平均计算量下降，这就是「路径长度」那根轴。
      - generic [ref=f69e100]:
