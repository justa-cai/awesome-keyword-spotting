    - generic [ref=f123e210]:
      - generic [ref=f123e211]: JUDGEMENT
      - paragraph [ref=f123e212]: ↳ 过参数化是训练的脚手架，不是推理的必需品：训练时的大矩阵帮助优化搜索，收敛后能量集中在低维子空间——「训大再用低秩抽走」是压缩的标准姿势，直接训小矩阵反而更差（与剪枝文献的结论同构）。
      - paragraph [ref=f123e213]: ↳ 压缩指标要分「存储」与「延迟」两条账：SVD 省的是参数与内存带宽，但拆层增加访存次数——某些硬件上延迟反升；报告压缩比时必须同时报实测延迟，否则是在优化一个没人付钱的指标。
      - paragraph [ref=f123e214]: ↳ 分解后的瓶颈层是免费的表示学习产物：低秩压缩天然产生一个 r 维「腰」——它就是现成的瓶颈特征；一次压缩同时拿到「小模型」和「好特征」两个资产，是这类方法的隐藏收益。
