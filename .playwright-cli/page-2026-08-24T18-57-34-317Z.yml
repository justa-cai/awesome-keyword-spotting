            - listitem [ref=f92e239]: 噪声划分未说明：MUSAN 930 文件既用于训练又（推测）用于测试加噪——若重叠，噪声泛化被高估。
            - listitem [ref=f92e240]: 无统计显著性：单次训练无方差——0.3-0.6 点级差异（如 ECA-final 与 ECA-post 20dB 的 95.85 对 95.83）可能落在随机波动内。
            - listitem [ref=f92e241]: 两个总结数字对不上表（2-3% / 7.4%）。
            - listitem [ref=f92e242]: 课程学习未单独消融：其独立贡献只能回溯 Ng 等原文。
            - listitem [ref=f92e243]: 细节缺失：C2D 卷积核大小 / 通道数、SE 降维比 r、ECA 核函数 Ψ 均未报告；22.3M MACs 停在纸面，无真机延迟 / 内存 / 功耗。
      - generic [ref=f92e244]: 值得追的方向：① 时间维动态注意力——把全局平均池化换轻量时间建模（1D 卷积 / 分组池化），ω 变 C×F×T′ 分帧权重专攻非平稳噪声，开销可借 ECA 自适应核思想；② 混响联合仿真——MUSAN 加噪之上叠 RIR 卷积做实「远场」，课程从 SNR 单轴扩到 SNR×混响时间双轴；③ 开集评估（每小时误触发 / DET / 嵌入距离拒识）对齐产品指标；④ 量化（int8/低比特）+ 剪枝 + 流式推理的真机 always-on 验证与实测功耗；⑤ C2D 迁移到 BC-ResNet / MatchboxNet 等骨干检验「逐残差块插入细粒度注意力」是否普遍规律，扩展到麦克风阵列的通道选择；⑥ 课程学习独立消融 + 动态课程（数据参数法）与 C2D 的组合上限。
