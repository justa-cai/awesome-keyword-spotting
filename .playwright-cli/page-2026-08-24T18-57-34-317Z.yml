      - generic [ref=f92e24]:
        - heading "一分钟版本" [level=2] [ref=f92e25]
        - list [ref=f92e26]:
          - listitem [ref=f92e27]: 核心张力：常驻 KWS 要小（119K 级）+ 抗噪（真实场景嘈杂）；而小网络容量小、直接学高噪声样本「学不动」。社区在「准」和「快」上卷了多年，抗噪被系统性忽略。
          - listitem [ref=f92e28]: 被忽视的物理事实：SE/ECA 都是纯通道注意力——一个通道一个标量权重，而加性噪声在物理上是频率选择性的（雷声集中低频、DTMF 窄带、喇叭有基频簇）——粒度与噪声分布不匹配。
          - listitem [ref=f92e29]: 方案（C2D）：特征图先沿时间维全局平均池化 → 得 C×F 通道-频率平面 → 两个 2D 卷积生成权重 → sigmoid 门控后逐元素乘回原特征（时间维广播）。「先池化后卷积」把注意力分支从三维降到二维——粒度只损失时间维（恰对噪声不敏感），频率维完整保留，开销仅 +0.45% MACs。
          - listitem [ref=f92e30]: 位置消融的意外发现：C2D 单点插入（前/后卷积段）反而劣化（0dB 89.08/89.02 对骨干 90.62）——只有逐残差块插入（all）才有效（92.65）；SE 在所有位置都不如不加。注意力不是万能药，插错位置是毒药。
          - listitem [ref=f92e31]: 结果：119K / 22.3M MACs，GSC V2-12 干净 98.25%（小模型最高）；0dB 92.65%（超 BC-ResNet-6 5.17 点）；噪声下反超 45 倍参数的 KWT-3 达 8.68 点——自注意力对扰动的敏感在强噪下暴露，卷积局部偏置 + 频率粒度注意力更稳。
          - listitem [ref=f92e32]: 成色缺口：注意力静态（整句共享一组权重，非平稳噪声有天花板）；闭集分类无误触发指标；只有加性噪声无混响（「远场」声称不完整）；单次训练无方差；正文两个总结性数字（2-3%、7.4%）与 Table I 对不上。
    - generic [ref=f92e33]:
      - paragraph [ref=f92e34]: §01 · 问题陈述
      - heading "「粒度-开销-位置」三重约束下的设计搜索" [level=2] [ref=f92e35]
      - generic [ref=f92e37]: 三条线索的缺口：① 主流小脚印架构（DNN→ResNet→TC-ResNet→BC-ResNet→MatchboxNet）的优化目标几乎都是干净集准确率 + 计算效率——抗噪被系统性忽略；② 噪声混合训练 + 课程学习（逐步加噪）有改善但高噪下仍不够；③ 轻量注意力与噪声鲁棒 KWS 的结合仍是空白——直接前身 ConvMixer 的 mixer 提供全局通道交互，缺廉价的局部选择机制。笔记补充的隐含批评：SE/ECA 每通道一个标量，不管哪个频段被污染都整体下调——与噪声的频率选择性物理分布不匹配。三重约束：粒度细到「哪个通道的哪个频段可信」；开销小到不撑爆 119K 模型；插入位置与 ConvMixer 残差块兼容。
