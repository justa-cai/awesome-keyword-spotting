      - generic [ref=f48e113]:
        - text: X
        - subscript [ref=f48e114]: quant
        - text: = round(scale·X + zero_point)；scale = 255/(max(X)−min(X))；zero_point = −round(scale·min(X)) − 128 （式 2–5，仿射量化）
        - generic [ref=f48e115]: float32 区间线性映射到 INT8 的 256 个档位；引入 zero_point 因为权重/激活分布常不对称（ReLU 后全非负）——纯对称量化浪费一半码位，仿射量化移动零点让整个 INT8 值域被有效利用。推理时卷积/矩阵乘在整数域完成（累加 int32），只在层边界反量化——这正是 8 位整数运算更快更省的根源。理想 4× 本文实测约 3×（差额是未量化成分与格式开销，论文未逐层拆解）。
