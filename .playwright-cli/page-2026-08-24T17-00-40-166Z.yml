      - generic [ref=f48e24]:
        - heading "一分钟版本" [level=2] [ref=f48e25]
        - list [ref=f48e26]:
          - listitem [ref=f48e27]: 立身之处：奥里亚语（印度古典语言）在公开领域没有任何 KWS 数据集——这不是「又一个英语刷点」的工作，而是把端侧 KWS 在低资源语言上从零到一做出来：自建数据 → 三架构受控对比 → 量化压缩 → 真实开发板跑通。
          - listitem [ref=f48e28]: 数据集：15 名说话人（10 男 5 女，20–30 岁）× 24 词 × 10 遍 = 3600 条（Zoom H1n，16 位单声道）；词表 = 数字 0–9 + 7 颜色 + 7 方向（家庭自动化高频命令语义，远超同期 Arduino 方案的 6 词）。
          - listitem [ref=f48e29]: 架构结论（同数据/同特征/同超参受控对比）：CNN 97% 双维度帕累托支配（精度最高 + 1599KB 最小）；CNN+LSTM 96%；LSTM 85.6% 掉队——3600 条对 LSTM 门控参数量偏小，小数据集上卷积的局部时频归纳偏置更值钱。
          - listitem [ref=f48e30]: 量化：INT8 训练后量化约 3 倍压缩（1599→521KB）、精度零损失（97% 不变，LSTM 微升 0.4pp 属统计噪声）；树莓派 3B 部署实测峰值内存 12.35KB。
          - listitem [ref=f48e31]: 价值坐标与边界：落地模板价值 > 算法价值；但说话人相关划分（划分方式未说明，97% 可能不外推到陌生人）、闭集分类无 FAR/FRR、树莓派（1GB 内存）不等于 MCU——「可部署到任何边缘设备」的推断有错位。
