    - generic [ref=f41e258]:
      - generic [ref=f41e259]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f41e260]: ① 单向流水线浪费了高层已算出的理解。
      - generic [ref=f41e261]: ↳ 顶层表示是现成的信息源——把它回馈给低层（跨层反馈）几乎零额外计算（信息已在那里）；「自顶向下」在视觉（检测注意力）、NLP（指针网络）里同样反复出现，凡是多层抽象的任务都值得问一句：高层理解能不能引导低层提取？
      - paragraph [ref=f41e262]: ② 跨层反馈与跨时步反馈是两个正交的免费信息源。
