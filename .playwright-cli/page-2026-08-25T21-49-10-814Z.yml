    - generic [ref=f41e93]: "02"
    - heading "机制：两个正交的「额外输入」" [level=2] [ref=f41e94]
    - paragraph [ref=f41e95]: TF-SE 相对标准 SE 的扩展可以拆成两个正交维度：跨时步（前一时刻的信息参与当前决策）与跨层（顶层语义下行到低层——excitation 不再只看本层本帧）。反馈回路的语义很直观：高层认出了「词的下半段」，就提示低层「注意听上半段的那些特征」——局部提取被全局理解引导。
