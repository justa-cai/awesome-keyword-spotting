    - generic [ref=f41e134]:
      - generic [ref=f41e135]: "标准 SE: s = σ(W₂·ReLU(W₁·GAP(X))) ← 只看本帧本层 TF-SE: s = σ(f( GAP(X), RNN(顶层(t−1)) )) ← 本帧统计 + 上帧高层语义 双向流: 自底向上(特征抽象) + 自顶向下(上下文反馈)"
      - generic [ref=f41e136]: 人话：标准 SE 像个只看眼前一页的校对员；TF-SE 给他配了对讲机——后面几页的审读结论（顶层理解）实时传回来，告诉他这一页该重点看哪几行（哪些通道）。
    - paragraph [ref=f41e137]: CRNN 一体化的设计值得注意：CNN 负责局部时频模式（自底向上），RNN 藏在 SE 块里提供时序反馈（自顶向下）——两种机制不是串联堆叠而是在同一个块内协同，这是「注意力 × 时序建模」的早期融合形态。
