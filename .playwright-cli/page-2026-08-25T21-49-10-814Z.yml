  - generic [ref=f41e12]: KAIST（Kim / Nam）· arXiv 1911.01803（2019.11） 问题：单向自底向上流水线——低层提特征时不知道高层认出了什么；标准 SE 只看当前帧 · 方法：SE 的 excitation 阶段引入 RNN（GRU/LSTM），把前一时间步的顶层表示作为反馈注入当前步低层 SE 块 一句话：自底向上 + 自顶向下的双向信息流，在 SE 框架内同时实现通道注意力与时序建模——GSC 上超越基线 CNN 与标准 SE。
  - generic [ref=f41e13]:
    - generic [ref=f41e14]: "01"
    - heading "问题：单向流水线的先天盲区" [level=2] [ref=f41e15]
    - generic [ref=f41e16]:
      - generic [ref=f41e17]: TL;DR
      - list [ref=f41e18]:
        - listitem [ref=f41e19]: ◆ CNN 的信息只能从低层往高层爬——低层提取局部特征时「闭眼干活」，无法利用高层已识别的关键词模式；而人耳听觉注意是自顶向下调节的（鸡尾酒会先验来自认知层）。
        - listitem [ref=f41e20]: "◆ 标准 SE 块（2020 #3 详拆过的那套）做通道注意力，但 GAP 只压缩当前帧的统计——时序上下文为零。"
        - listitem [ref=f41e21]: ◆ TF-SE 的解法：在 excitation 阶段引入循环模块——前一时间步的顶层表示经 RNN 时序建模后，作为反馈信号注入当前步的低层 SE 块。
        - listitem [ref=f41e22]: ◆ 整体是端到端原始波形系统：1D 卷积前端 + 多个 TF-SE 卷积层 + 全连接输出——零手工特征，CRNN 在 SE 框架内一体化。
