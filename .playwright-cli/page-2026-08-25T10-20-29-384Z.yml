  - generic [ref=f245e22]: 不是精度问题，是可行性问题——MCU 上训练的三角约束
  - generic [ref=f245e23]:
    - generic [ref=f245e24]:
      - heading "训练内存 3–4 倍于参数量" [level=3] [ref=f245e25]
      - paragraph [ref=f245e26]: float32 训练态要同时容纳参数、前向激活缓存、反向梯度、SGD 动量缓冲。Arduino Nano 33 BLE（64MHz · 256KB SRAM · 1MB Flash）上，前作 [3] 只能训 16K 参数 2 层 MLP 做二分类——离有意义的工业任务很远。
    - generic [ref=f245e27]:
      - heading "SFL 的两个自认弱点" [level=3] [ref=f245e28]
      - paragraph [ref=f245e29]: 通信开销（每步激活上行+梯度下行）与模型反演攻击面（标签随激活明文上传）。论文 2.2 节自认只做提醒，未实测未加固；串口通信量全文未报告。
    - generic [ref=f245e30]:
      - heading "方案光谱的三层" [level=3] [ref=f245e31]
      - paragraph [ref=f245e32]: MPC/同态加密：可证明隐私但开销过大，只适合跨孤岛 → 联邦学习：数据不出设备，Google 键盘已规模化，但整模型驻设备 → 本文：把 SFL（Thapa AAAI 2022）压进 MCU 语境。
    - generic [ref=f245e33]:
      - heading "常规 SFL 的推理依赖" [level=3] [ref=f245e34]
      - paragraph [ref=f245e35]: 分割式训练出的模型推理也要连服务器（设备只持有前几层）。唤醒词必须本地即时响应——论文用「训练后压缩回设备」补上这个结构性缺陷（见 §02）。
