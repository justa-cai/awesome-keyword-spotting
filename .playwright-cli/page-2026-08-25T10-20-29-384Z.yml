  - generic [ref=f245e314]:
    - generic [ref=f245e315]: 可迁移判断
    - paragraph [ref=f245e316]: ↳ 训练态内存和推理态内存是两码事：前者约 3–4× 参数量（梯度+动量+激活缓存），后者可压到 ¼×（int8）。凡是「设备装不下」的判断，先问装不下的是哪个态。
    - paragraph [ref=f245e317]: ↳ 用 SFL 把训练搬到服务器、用量化把推理收回设备——两端各自越过 256KB 的墙。这个非对称结构对任何「端侧训不动、端侧必须推理」的场景都成立。
    - paragraph [ref=f245e318]: ↳ 小数据小模型、大数据大模型：350 条上 MLP 已 90%+、大 CNN 反而过拟合；7000 条上容量红利才单调兑现——与泛化理论常识一致，是全文最有迁移价值的经验判断之一。
    - paragraph [ref=f245e319]: ↳ 硬件内存约束会渗入优化动力学：batch=1 不是超参选择，是 SRAM 逼出来的协议，直接导致精度曲线剧烈波动——部署侧约束与训练质量在 MCU 上是一条因果链，不是两件事。
