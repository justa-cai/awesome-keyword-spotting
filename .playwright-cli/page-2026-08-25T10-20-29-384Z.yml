  - generic [ref=f245e5]:
    - generic [ref=f245e6]: Split Federated Learning on MCU
    - generic [ref=f245e7]: ASU · arXiv 2210.01961 · 未经评审预印本
    - generic [ref=f245e8]: 板上只驻第 1 层 · 千级参数
    - generic [ref=f245e9]: ENdigits 66.25% → 80.14%（+13.89pp）
  - generic [ref=f245e10]: 一句话：联邦学习要求整个模型驻留设备训练，256KB SRAM 的 Arduino 只训得动 16K 参数的玩具 MLP——本文把分割联邦学习（SFL）第一次搬到微控制器：板上只留第一层，大层全在服务器；训练完压缩成 int8 TFLite 再塞回板，推理不连云。容量封顶被解除，验证精度多拿 13.89 个百分点。
  - generic [ref=f245e11]:
    - generic [ref=f245e12]: TL;DR
    - listitem [ref=f245e13]: ◈ FL 的硬前提是整模型驻设备：训练态 = 参数+梯度+动量+激活 ≈ 参数量的 3–4 倍，256KB SRAM 只装得下 16K 参数的二分类玩具（前作 [3] 的极限）。
    - listitem [ref=f245e14]: ◈ SFL 切在第一层：板上只剩 650×25 的 FC 或 12×1×3×3 的 Conv（千级参数），激活值+标签经串口上行，梯度下行，链式法则在切割点断开。
    - listitem [ref=f245e15]: ◈ 每 epoch 做 FedAvg 聚合客户端切片——FL 的聚合思想并入分割学习，多客户端（形式上）并行。
    - listitem [ref=f245e16]: ◈ 隐私边界落在切割面：设备不知道服务器参数形状，服务器不接触原始音频——但只是启发式隐私，且标签明文上行是反演攻击面。
    - listitem [ref=f245e17]: ◈ 最聪明的洞察是解耦：训练态内存 3–4× 参数量甩给服务器；推理态 int8 只要 ¼×，量化后塞回设备——训练时装不下 ≠ 部署时塞不回。
    - listitem [ref=f245e18]: ◈ ENdigits 7000 条：MLP（FL 上限）66.25% → 大 CNN（仅 SFL 可训）80.14%，+13.89pp——但容量与方案绑死，是容量红利不是算法红利。
    - listitem [ref=f245e19]: ◈ 代价与缺口：每步两次穿串口、batch 被锁死为 1（优化曲线剧烈波动）、量化后精度/体积/延迟全部未报告、板上部署测试最终没做完。
