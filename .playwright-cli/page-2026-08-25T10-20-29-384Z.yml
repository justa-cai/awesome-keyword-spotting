  - generic [ref=f245e271]:
    - generic [ref=f245e272]:
      - generic [ref=f245e273]: "1"
      - paragraph [ref=f245e274]: 首次把 SFL 部署到微控制器：64MHz / 256KB SRAM 级的超低功耗嵌入式系统跑通分割联邦学习全流程，任务是有意义的多类（7 类）数字关键词识别，而非此前 TinyML-FL 的二分类玩具。
    - generic [ref=f245e275]:
      - generic [ref=f245e276]: "2"
      - paragraph [ref=f245e277]: 实证 SFL 打破训练内存墙：设备参与远超其内存容量的模型训练，大 CNN 比 FL 硬件约束下唯一可用的小 MLP 高 13.89pp——FL 的短板被归因为容量封顶而非算法本身。
    - generic [ref=f245e278]:
      - generic [ref=f245e279]: "3"
      - paragraph [ref=f245e280]: 补上「推理回设备」的闭环：训练后整模型压缩、量化为 int8 TFLite 发回设备本地推理，消解常规 SFL 推理依赖服务器的结构缺陷——「训练态甩给服务器、推理态压回设备」是最可转述的工程思路。
    - generic [ref=f245e281]:
      - generic [ref=f245e282]: "4"
      - paragraph [ref=f245e283]: 多客户端原型 + 异构双端互操作：PyTorch 虚拟客户端拼出多客户端 SFL（串行模式），打通 C++ 与 PyTorch 两世界经串口的梯度往返。
