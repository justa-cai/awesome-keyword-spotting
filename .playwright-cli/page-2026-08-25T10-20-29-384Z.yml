  - heading "§02 方法：切一刀，两端各自越墙" [level=2] [ref=f245e116]:
    - generic [ref=f245e117]: §02
    - text: 方法：切一刀，两端各自越墙
  - generic [ref=f245e118]: 切割点链式法则 · FedAvg 聚合 · 训练/部署内存不对称
  - generic [ref=f245e119]:
    - generic [ref=f245e120]: ∂l/∂W_C = ∂l/∂A · ∂A/∂W_C
    - generic [ref=f245e121]: 人话：链式法则在切割点断开——第二个因子（局部雅可比）只在客户端算，第一个因子由服务器算好经串口传回。设备永远不知道 W_S 的形状，服务器永远摸不到原始音频，隐私边界就落在这条切割面上。
  - generic [ref=f245e122]:
    - generic [ref=f245e123]: ① C* = (1/M)·Σ Cᵢ → 全体 Cᵢ ← C* （每 epoch 开始）
    - generic [ref=f245e124]: 人话：FL 的 FedAvg 聚合思想作用在客户端切片上——各客户端在异构数据上训出的不同副本被周期性拉回共识，这是 SFL 区别于轮流训练的原始 SL 的关键一步。
  - generic [ref=f245e125]:
    - generic [ref=f245e126]: 训练态 float32 ≈ 3–4 × P 推理态 int8 ≈ 0.25 × P
    - generic [ref=f245e127]: 人话：训练要梯度+动量+激活缓存，推理只要参数本身加一层激活缓存，int8 每参数 1 字节。SFL 把 3–4P 甩给没有内存限制的服务器，量化把 0.25P 收回设备——这就是为什么训练时板上根本装不下的模型，部署时反而塞得回去。
  - generic [ref=f245e128]:
    - generic [ref=f245e129]:
      - heading "一真多假的联邦" [level=3] [ref=f245e130]
      - paragraph [ref=f245e131]: 一块 Arduino 是唯一真实客户端（C++ 手写，连嵌入式 MFCC）；PC 一人三职——服务器、串口总控、虚拟其余客户端（PyTorch 复刻客户端+MFCC）。数据存在 PC 经串口推给板，板本地完成 MFCC——特征化在设备，但「数据原生于设备」是模拟的。
    - generic [ref=f245e132]:
      - heading "异构双端是最有含金量的工程" [level=3] [ref=f245e133]
      - paragraph [ref=f245e134]: 切割点两侧跑在不同框架、不同精度环境：C++ 世界与 PyTorch 世界经串口互传梯度，能收敛本身就验证了两侧前向/反向语义一致——CNdigits 上 70 轮内到 90%+，排除「实现有 bug」。
    - generic [ref=f245e135]:
      - heading "切在第一层，板上钉死千级" [level=3] [ref=f245e136]
      - paragraph [ref=f245e137]: 第一层输入是全网络最大张量（650 维 MFCC 展平 = 13 系数 × ~50 帧），但输出压到 25/12 通道后，板上参数只剩千级；Model 2/3 的 Conv16→FC128、Conv30→FC256 大层全部住在服务器。batch size 被锁死为 1。
    - generic [ref=f245e138]:
      - heading "容量阶梯就是论证骨架" [level=3] [ref=f245e139]
      - paragraph [ref=f245e140]: MLP（Model 1）代表 FL 在此硬件的极限——因为 FL 根本没法在板上训整个 CNN；两个 CNN 只有 SFL 下才存在。同数据同协议比验证精度，把「内存墙→只能小模型→精度天花板」这条因果链变成可测的数字。
