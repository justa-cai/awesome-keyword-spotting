      - generic [ref=f22e121]: · 每家噪声不同——特征分布像 N 个方言区
      - generic [ref=f22e122]: · 全局模型要同时迁就所有「方言」
      - generic [ref=f22e123]: 数量偏斜：
      - generic [ref=f22e124]: · 重度用户主导平均——轻度用户被代表
      - generic [ref=f22e125]: 实测排序：标签 > 特征 ≈ 数量——
      - generic [ref=f22e126]: 「大家用的词不一样」比「环境不一样」更疼
      - generic [ref=f22e127]: 左：模型下行、更新上行、服务器加权平均——数据从不动，动的是参数。右：标签偏斜让不同设备的更新方向相反、平均互相抵消——这是联邦 KWS 收敛慢的头号原因
    - generic [ref=f22e128]: 图 2 · 机制解剖：FedAvg 一圈的下行/上行流 · 三种偏斜各自的伤害机制
    - generic [ref=f22e129]:
      - generic [ref=f22e130]: "FedAvg: w_{t+1} = Σ_k (n_k/N) · w_k^{local} ← 按数据量加权平均 N 台设备的本地更新 本地: w_k^{local} = w_t − η·Σ SGD(本地数据) ← 各设备只看自己的分布 缓解: 服务器端学习率 η_server 自适应 ← 削峰填谷, 平滑偏斜拉扯"
      - generic [ref=f22e131]: 人话：服务器把作业本发给一群学生，每人只用自己的例题做一遍订正，交回的订正页平均成新版本——问题是每个人手里的例题都不一样（有人全是正例、有人全是反例），订正方向互相打架；服务器控制「每圈采纳多少」来缓和打架。
    - paragraph [ref=f22e132]: 设备越多全局模型越好是个有趣的反转：小规模时多样性是 averaging 的毒药，规模够大后多样性反而成为养料——每个设备的偏斜在大量平均下互相稀释，全局模型见到的是「真实世界的完整分布」。
