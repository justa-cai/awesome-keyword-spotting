  - generic [ref=f22e86]:
    - generic [ref=f22e87]: "02"
    - heading "机制：更新互相拉扯的几何" [level=2] [ref=f22e88]
    - paragraph [ref=f22e89]: FedAvg 的每一圈都是「N 份各带私货的更新求平均」：Non-IID 越重，平均的互相拉扯越狠。标签偏斜的极端情形可视化最直观——设备 A 的本地数据几乎全是唤醒词（更新把边界往「触发」方向推），设备 B 几乎全是非唤醒词（往反方向推）——两份更新平均后大量抵消，收敛慢且易震荡。服务器端学习率调整通过控制聚合步长来削峰填谷，是实测最有效的缓解。
