        - generic [ref=f22e199]: "1"
        - paragraph [ref=f22e200]: 「更新也可能泄露」是常被忽略的一层。模型梯度可以反向推断训练数据（梯度泄露攻击）——所以联邦要配差分隐私才算完整方案；这篇生产论文把 DP 列为实现的一部分，工程视野比学术 FL 论文完整。
      - generic [ref=f22e201]:
        - generic [ref=f22e202]: "2"
        - paragraph [ref=f22e203]: 标签偏斜 > 特征偏斜的排序有诊断价值。迁移到任何联邦场景先看「参与者的任务分布差异」（谁有什么标签），再看「输入分布差异」（环境/口音）——前者造成的更新冲突是代数级的（方向相反），后者多是统计级的（中心偏移）。
      - generic [ref=f22e204]:
        - generic [ref=f22e205]: "3"
        - paragraph [ref=f22e206]: 数千真实设备的工程含量。设备可用性、带宽、电池、掉线——模拟实验里的「均匀采样设备」在生产里根本不存在；这篇论文的价值一半在训练方法，一半在「这些约束下它跑通了」。
