  - generic [ref=f22e253]:
    - generic [ref=f22e254]: "05"
    - heading "可迁移的判断" [level=2] [ref=f22e255]
    - generic [ref=f22e256]:
      - generic [ref=f22e257]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f22e258]: ① 当「数据不能出门」是硬约束时，联邦不是选项是必选项。
      - generic [ref=f22e259]: ↳ 法规（GDPR）或用户承诺划定的红线面前，精度让步与工程复杂度都是可接受的代价——决策框架是「合规性优先、质量其次、成本第三」，而不是三者并重的常规权衡。
      - paragraph [ref=f22e260]: ② Non-IID 的伤害要先看任务分布、再看输入分布。
      - generic [ref=f22e261]: ↳ 标签偏斜造成方向相反的更新冲突（代数级伤害），特征偏斜只造成中心偏移（统计级伤害）——诊断联邦训练问题时先检查「谁有什么标签」，再查环境差异；对策的优先级也随之确定。
      - paragraph [ref=f22e262]: ③ 规模是异质性的解药。
      - generic [ref=f22e263]: ↳ 少量设备的偏斜在平均中互相拉扯，大量设备的偏斜在平均中互相稀释——联邦系统冷启动时（参与者少）最难，规模化后反而变稳；这提示联邦项目的早期评估要保守。
    - paragraph [ref=f22e264]: 系列坐标：KWS 联邦谱系的锚点——本文（2020，Google）确立生产规模联邦 KWS 的工程基线；2021 年零样本联邦（新类别的匿名印象注册）把「联邦 + 开放词表」合流；2022 年 Split Federated 把计算也分家（端侧/服务器各训半段）提效率——隐私压力下的这条线只会越走越宽。
