  - generic [ref=f22e13]:
    - generic [ref=f22e14]: "01"
    - heading "问题：语音数据的隐私红线" [level=2] [ref=f22e15]
    - generic [ref=f22e16]:
      - generic [ref=f22e17]: TL;DR
      - list [ref=f22e18]:
        - listitem [ref=f22e19]: ◆ 传统训练要上传用户语音——声音特征、说话内容、环境信息全在里面；在 GDPR 等法规与用户敏感度的双重压力下，这条路越走越窄。
        - listitem [ref=f22e20]: ◆ 联邦学习的承诺：原始数据留在设备，只上传模型更新，服务器聚合改进全局模型——但 KWS 的 Non-IID 四重异构（环境/口音/使用频率/设备）让收敛和性能面临硬挑战。
        - listitem [ref=f22e21]: ◆ Non-IID 的解剖学：三种偏斜里标签分布偏斜最伤（「大家用的词不一样」比「环境不一样」更疼）——设备间的更新方向可以完全相反，平均后互相抵消。
        - listitem [ref=f22e22]: ◆ 生产现实全在场：数千台真实手机、设备可用性、带宽、电池、掉线——这不是模拟实验，是 Gboard 团队的量产工程。
