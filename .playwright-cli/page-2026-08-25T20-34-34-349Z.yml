      - generic [ref=f22e117]: · 设备 A 全是「唤醒词」· 设备 B 几乎全是
      - generic [ref=f22e118]: 「非唤醒词」——本地更新往相反方向走
      - generic [ref=f22e119]: · 平均后互相抵消：收敛慢 · 易震荡
