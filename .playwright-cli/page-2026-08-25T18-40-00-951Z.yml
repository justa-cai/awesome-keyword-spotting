  - generic [ref=f325e84]:
    - generic [ref=f325e85]: "02"
    - heading "机制：窗口错开，注意力投票" [level=2] [ref=f325e86]
    - paragraph [ref=f325e87]: 框架的关键在「错开」与「投票」两步。基础窗口 ~1 秒，相邻窗口偏移约 100ms——每个 Look 捕获关键词的不同时间片段和上下文；只要关键词完整出现在任意一个窗口里，系统就有机会看全它。每个视角经独立（或共享权重的）CNN/CRNN 编码器提特征，之后由注意力模块完成聚合。
    - img [ref=f325e88]:
      - generic [ref=f325e90]: 机制解剖：窗口怎么错开 · 注意力怎么投票
