  - generic [ref=f325e254]:
    - generic [ref=f325e255]: "05"
    - heading "可迁移的判断" [level=2] [ref=f325e256]
    - generic [ref=f325e257]:
      - generic [ref=f325e258]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f325e259]: ① 位置不确定性有两条对冲路线：并行多视角 or 串行记忆。
      - generic [ref=f325e260]: ↳ 关键信息在输入里的位置不确定时，要么并行开多个视角投票（本文——贵但一次前向），要么串行维护跨窗口的记忆（流式注意力——省但有延迟依赖）。预算充足选前者，常驻设备选后者。
      - paragraph [ref=f325e261]: ② 聚合要带权重，且权重要可解释。
      - generic [ref=f325e262]: ↳ 平均聚合稀释好视角、最大值聚合丢置信度——softmax 加权是两者之间的正确折中；并且要像本文一样验证「权重确实落在了该落的地方」，否则注意力只是涨点的玄学。
      - paragraph [ref=f325e263]: ③ 冗余的价值与风险成正比。
      - generic [ref=f325e264]: ↳ 短关键词（截断风险高）从多视角受益最大，长关键词收益小——设计冗余机制前先量化「风险在哪里集中」，把冗余花在风险最高的维度上。
