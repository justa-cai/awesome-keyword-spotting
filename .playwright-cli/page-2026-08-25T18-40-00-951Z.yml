      - generic [ref=f325e111]: 聚合与梯度流
      - generic [ref=f325e113]: 投票过程：
      - generic [ref=f325e114]: ① 每个视角编码出特征 hᵢ（CNN / CRNN）
      - generic [ref=f325e115]: ② 注意力模块对每个 hᵢ 打分 → softmax 归一化
      - generic [ref=f325e116]: 得 αᵢ（Σαᵢ = 1，尺度一致）
      - generic [ref=f325e117]: ③ 聚合特征 h_agg = Σ αᵢ hᵢ → 分类器 → CE 损失
      - generic [ref=f325e118]: 梯度怎么流：
      - generic [ref=f325e119]: ∂L/∂θ_编码器 经过 αᵢ hᵢ 的乘积项回传——
      - generic [ref=f325e120]: 高票视角的编码器收到更强的学习信号，
      - generic [ref=f325e121]: 「谁看得准谁进步快」的自我强化
      - generic [ref=f325e122]: 部署形态：并行分支 + 一次加权求和——
      - generic [ref=f325e123]: 没有迭代推理，一版前向完成
      - generic [ref=f325e124]: 左：同一音频流被多个错开 ~100ms 的窗口观察，框住完整关键词的视角拿最高注意力。右：softmax 归一化的注意力加权聚合，梯度经乘积项回传——端到端联合优化
    - generic [ref=f325e125]: 图 2 · 机制解剖：多窗口的时间错开与注意力分配 · 聚合公式与梯度流
    - generic [ref=f325e126]:
      - generic [ref=f325e127]: h_agg = Σᵢ αᵢ · hᵢ α = softmax(attention(h₁..h_L)), Σαᵢ = 1 L_total = L_CE(h_agg, y) ← 端到端，无辅助损失、无手工融合
      - generic [ref=f325e128]: 人话：每个窗口编出一份「看到的特征」，注意力按「这份特征像不像关键词」打分并 softmax 归一化，加权合成一份聚合特征去分类。框住完整关键词的窗口拿高票，被截断的拿低票——系统自动挑最可靠的时间视角。
    - paragraph [ref=f325e129]: 梯度的自我强化值得注意：∂L/∂θ 经过 αᵢhᵢ 的乘积项回传，高票视角的编码器收到更强的学习信号——「谁看得准谁进步快」，视角分工在训练中自然形成。部署形态也简单：并行分支 + 一次加权求和，没有迭代推理。
