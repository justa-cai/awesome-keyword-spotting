  - generic [ref=f325e13]:
    - generic [ref=f325e14]: "01"
    - heading "问题：单窗口注定和关键词对不齐" [level=2] [ref=f325e15]
    - generic [ref=f325e16]:
      - generic [ref=f325e17]: TL;DR
      - list [ref=f325e18]:
        - listitem [ref=f325e19]: ◆ 传统 KWS 用单一滑动窗口处理音频流，但关键词的起始位置和时长是随机的——窗口位置固定，两边注定错位。
        - listitem [ref=f325e20]: ◆ 三个具体病灶：时间对齐敏感（偏左偏右就截断）、单一视角（错过不同上下文里的特征）、边界效应（跨窗口的关键词两头都看不全）。
        - listitem [ref=f325e21]: ◆ 解法直觉：与其赌一个窗口位置，不如让多个错开 ~100ms 的窗口同时观察同一段音频，每个视角独立编码，再用注意力加权聚合。
        - listitem [ref=f325e22]: ◆ 注意力投票不是装饰：实验显示它优于平均和最大值聚合，且确实把高票给了「关键词完整出现」的窗口——机制与设计意图一致。
