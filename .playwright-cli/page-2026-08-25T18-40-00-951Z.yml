        - generic [ref=f325e201]: "1"
        - paragraph [ref=f325e202]: 注意力机制通过了解释性验证。权重分析显示高票确实落在关键词完整出现的窗口上——不是「加了个注意力就涨点」的黑箱结论，机制与效果对得上。
      - generic [ref=f325e203]:
        - generic [ref=f325e204]: "2"
        - paragraph [ref=f325e205]: 边际收益递减是硬规律。视角数从 1→3 收益显著，3→5 还有，5 以后基本平了——但每个视角的编码成本一分不少。甜点区间的存在说明「位置不确定性」的容量有限，几个视角就覆盖住了。
      - generic [ref=f325e206]:
        - generic [ref=f325e207]: "3"
        - paragraph [ref=f325e208]: 短词受益最大给出机制佐证。短关键词在单个窗口里被截断的风险更高，多视角的「保底价值」与风险大小成正比——如果多视角只是泛泛的集成效应，长短词的收益应该均匀。
