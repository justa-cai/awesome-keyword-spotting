      - generic [ref=f155e101]:
        - text: W > δ → +a； W < −δ → −a； |W| ≤ δ → 0（阈值 δ 与缩放因子 a 由稀疏参数 Sl 控制，可训练）
        - generic [ref=f155e102]: 式 1 · 稀疏可控三值量化（TGA 基础上引入 Sl）：传统 TWN 的 δ 与 a 不可训练、稀疏度不可控——本文把稀疏度变成显式设计变量（33.6%，全精度的 6.5 倍），0 权重在硬件里不产生乘加与访存，稀疏度直接兑换成计算量。缩放因子 a 折叠进 BN 层后，乘法只剩 ±1/0 三种情形，NAND 门 + 加法器即可完成。
      - generic [ref=f155e103]:
        - text: Fitness = SED
        - subscript [ref=f155e104]: CA
        - text: − 2·SED
        - subscript [ref=f155e105]: ORA
        - text: + Cost（Cost：任一输入组合出现负误差 → ∞）
        - generic [ref=f155e106]: 式 3/5 · CGP 搜索补偿加法器的适应度：把「补偿加法器总误差 ≈ 两倍 OR 加法器误差」与「补偿方向恒为正」两个工程意图直接写进搜索目标——迫使进化生成与 OR 近似加法器误差方向相反、恰好抵消的电路。生成的 CA 简单到极致：4 根导线直通 + 固定进位 1。
      - generic [ref=f155e107]: 为什么横向对称胜出（三种模式的硬件可行性分析）：横向对称精度最高（91.9% vs 纵向 91.2% / 对角 90.7%），更关键的是复用兑现——帧序列经 FIFO 顺序送入 PE 阵列时第一行权重可显式复用第三行（频率域权重复用），核在频率域每移动两次先前输出即可复用（输出复用），两种复用都在流水线内稳定兑现；对角对称双域同时对称反而难调度、纵向对称的输出复用只在不同输入帧间发生难以捕捉——算法设计的自由度在硬件现实面前收窄为一个点。
