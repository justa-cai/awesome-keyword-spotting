      - generic [ref=f155e24]:
        - heading "一分钟版本" [level=2] [ref=f155e25]
        - list [ref=f155e26]:
          - listitem [ref=f155e27]: 能耗结构的量化拆解（优化方向的优先级）：FFT 占 MFCC 模块功耗 62.1%，MFCC 占整个系统 33.8%（前代 22nm 芯片统计）——想压系统功耗先压 FFT，再压神经网络计算与存储。
          - listitem [ref=f155e28]: 任务定位：10 关键词（+静音 +未知 = 12 类）、11 种 NoiseX-92 背景噪声、5dB~Clean 宽信噪比——与大量只测干净语音的前期工作最大的差异；噪声鲁棒通常要更深网络 / 更细权重粒度 / 噪声增强训练，三样都推高功耗与存储——三个要求互相牵制。
          - listitem [ref=f155e29]: 技术一 SBSA（FFT 逐级位宽）：串行流水线 FFT 各级蝶形互不干扰 → 每级可用不同位宽；前级占硬件最多但对误差最容忍 →「前狠后稳」。1000 条语音跑分布（50dB SQNR 边界，前五级阈值 T=0.1 激进 / 后四级 T=0 保守），定案 [10,10,11,12,12,13,14,15,16]——前两级直砍 6 比特。位宽不是精度参数而是统计参数，按数据集分布选而不是按最坏情况选。
          - listitem [ref=f155e30]: 技术二 SKT（为硬件属性而训练）：稀疏参数 Sl 显式控制权重稀疏度到 33.6%（全精度的 6.5 倍，0 权重不产生乘加与访存）；横向对称核训练让对称率 34.59%→89.48%（单）/6.17%→66.46%（组），精度只掉 0.5%——对称核触发 PE 阵列的部分和复用 + H-RLC（Huffman+游程）压缩，加速器功耗 −18.6%，权重 SRAM 仅 4.29KB。对称性是训练出来的算法属性，存在的意义几乎完全是为了硬件。
          - listitem [ref=f155e31]: 技术三 CGP 误差互相补偿近似加法树：三值化消去乘法后加法成功耗主体；统计洞察——均匀分布的正负误差在计算中更容易互相抵消，误差分布的形状比大小更值得设计。CGP 遗传编程自动搜索补偿加法器（适应度硬约束：误差全正、幅度 ≈ 2×OR 加法器），与 OR 门近似加法器配对 → 加速器功耗再 −17.3%，精度损失 0.5%（干净）~1.3%（5dB）。
          - listitem [ref=f155e32]: 流片结果：22nm ULL、0.54V/250kHz 下 3.8μW、16ms 延迟、14KB 存储、0.99×0.61mm²；实测干净 90.6%、11 噪声 5dB 全部 >85%（平均 ~85.4%）；30 颗芯片 0.54–0.9V 范围 3.8–150μW。归一化能效 2.79×——超过所有 10 关键词工作（Laika 2.12× 仅 4 词、VoCell/Kim ~1×）；Shan 0.51μW 更低但只有 1–2 词。
          - listitem [ref=f155e33]: 代价账本（诚实读法）：每帧 4930K ops 是 VoCell（53K）的 ~93 倍——鲁棒性靠网络容量堆出来，功耗优势靠三值消乘法 + 近似加法 + 近阈值电压 + 低频四重手段把单次运算做到极便宜，外推性存疑；三层有损环节叠加（SKT 0.5% + 近似 0.5~1.3% + 实测 ~1%）；干净 90.6% 低于 Shan 的 98.0%（单词表）与 Laika 的 91.2%（4 词）。
          - listitem [ref=f155e34]: 边界：三种对称模式只有横向真正落地（对角双域对称难调度、纵向复用只跨帧）；近阈值 + HVT 对 PVT 波动敏感（未报漂移）；VAD 依赖预设能量双门限且未报任何误触发率 / ROC 指标——常开系统可用性缺一块关键证据；NoiseX-92 年代久远、8kHz 近讲、无远场混响多说话人。
    - generic [ref=f155e35]:
      - paragraph [ref=f155e36]: §01 · 问题陈述
      - heading "微瓦预算下的三块硬骨头" [level=2] [ref=f155e37]
      - generic [ref=f155e39]: 当时低功耗 KWS 芯片的短板（逐一摆上台面）：Kim ISSCC'22 GRU 13.6μW 偏高；Laika 5μW 但仅近讲、不含 MFCC 功耗、关键词有限；VoCell 10.6μW 支持 10 词但只测干净语音；Shan ISSCC'20 二值 DSCNN 0.51μW 极致低功耗但只有 1–2 词——二值化的类别能力瓶颈被量化：同骨架下 BWN 干净 87.9% / 5dB 80.8%，TWN 90.6% / 85.4%（差 2.6–4.6 点）。
      - generic [ref=f155e40]: 两个更深的方法层缺口：① 量化粒度与存储的两难——三值（+a/0/−a）表达力接近更细量化、0 值天然稀疏，但每权重 2 比特存储翻倍，「拿到三值精度又不付存储代价」悬而未决；② 近似计算缺系统级补偿——已有工作是单体设计（孤立优化一个近似单元），忽略加法树里不同近似单元的误差可以互相抵消（两个 1 比特近似半加器的真值表可演示双输入为 1 时错误互相修复）——误差补偿是概率事件，需要系统性补偿电路设计方法，当时是空白。另：FFT 各级位宽统一 16 比特是对前级的过度设计。
