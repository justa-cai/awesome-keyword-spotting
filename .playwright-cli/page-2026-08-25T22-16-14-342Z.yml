  - generic [ref=f48e13]:
    - generic [ref=f48e14]: "01"
    - heading "问题：多头的隐藏浪费" [level=2] [ref=f48e15]
    - generic [ref=f48e16]:
      - generic [ref=f48e17]: TL;DR
      - list [ref=f48e18]:
        - listitem [ref=f48e19]: ◆ 多头注意力本该「各头看各的子空间」——但标准训练没有任何机制保证多样性：多个头可以学成高度相似的表示（重复劳动），浪费模型容量。
        - listitem [ref=f48e20]: ◆ KWS 的处境更糟：只有 2–4 个头（vs BERT/GPT 的十几个）——一个头冗余，浪费的比例就很大；资源受限场景每个参数都该被高效利用。
        - listitem [ref=f48e21]: ◆ 正交正则的解法：L_orth = ‖HH^T − I‖²_F——把头两两内积（相关性）压到零、各头保单位能量——方向不相关 = 各管一摊信息。
        - listitem [ref=f48e22]: ◆ 最关键的工程性质：零推理开销——只是训练期的额外损失项，推理架构、参数量、延迟与标准 MHA 完全相同；部署端完全无感。
