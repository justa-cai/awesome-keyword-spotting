    - heading "机制：冗余的几何与正交的力学" [level=2] [ref=f48e77]
    - paragraph [ref=f48e78]: 把冗余画成几何就一目了然：冗余 = 三个头挤在同一方向（覆盖的信息子空间窄），正交 = 各头指向不同方向（子空间覆盖最大化）。正则的力学藏在 HH^T 里——非对角元是头两两的内积（相关性），正则压它到零；对角元趋向 1 保证各头不塌缩到零能量。
