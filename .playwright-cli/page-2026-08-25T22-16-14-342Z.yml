      - generic [ref=f48e113]: "MHA: head_i = Attention(QW_i^Q, KW_i^K, VW_i^V); MHA = Concat(head_1..H)·W^O 正则: L_orth = ‖HH^T − I‖²_F ← H = 各头输出拼接; 非对角元→0(不相关), 对角元→1(保能量) 总损失: L = L_KWS + λ·L_orth ← 推理时 L_orth 消失——零开销"
      - generic [ref=f48e114]: 人话：给每个注意力头划一个「工位方向」，正则就是质检员——两个头的方向靠太近就推开；训练结束后质检员下班，但工位格局已经定型，推理时零成本享受分工。
