  - generic [ref=f48e228]:
    - generic [ref=f48e229]: "05"
    - heading "可迁移的判断" [level=2] [ref=f48e230]
    - generic [ref=f48e231]:
      - generic [ref=f48e232]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f48e233]: ① 并行的多个执行单元天然趋向冗余——正交约束是最便宜的多样性保证。
      - generic [ref=f48e234]: ↳ 多头注意力、多分支网络、混合专家——凡「多单元本该分工」的结构，都该问一句：它们的输出相关性有人管吗？正交正则是纯损失项的方案，零推理成本，试错代价几乎为零。
      - paragraph [ref=f48e235]: ② 表示空间的几何约束可以替代结构改造。
      - generic [ref=f48e236]: "↳ 想让单元分工，有两条路：改结构（显式拆分）或加几何约束（隐式推开）——后者零部署成本，先试约束、不够再改结构；本文与 #22（MTConv 改结构折叠）是这两条路的同年对照。"
      - paragraph [ref=f48e237]: ③ 「不是越正交越好」是所有多样性约束的共同边界。
      - generic [ref=f48e238]: ↳ 过度强迫多样性会牺牲模型本来的表示自由——λ 这类约束强度都有甜点区；评估约束收益时要扫描强度曲线，只报单一 λ 的结果可能落在甜点也可能不在。
    - paragraph [ref=f48e239]: 系列坐标：注意力进 KWS 的 2019 双子之一——#9 多层注意力管深度维，本文管头维；两条线在后来者身上合流：2021 年 KWT（ViT 风格 MHA 主干）既需要层间信息（跳跃/类 CLS）也需要头间多样性——本文的功课让后来的 MHA 主干少踩一遍冗余坑。
