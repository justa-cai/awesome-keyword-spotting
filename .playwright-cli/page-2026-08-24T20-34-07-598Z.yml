      - generic [ref=f127e24]:
        - heading "一分钟版本" [level=2] [ref=f127e25]
        - list [ref=f127e26]:
          - listitem [ref=f127e27]: 三条痛点，条条打在信息源上：发声 KWS 靠空气传导的语音——街头商场被人声频段噪声污染（失准）；旁边有人办公休息、隐私尴尬时发不了声（功能直接归零，不是掉点）；头显麦克风没有强的说话人方向选择性，旁人说话被当指令（误触发）。模型层再优化也补不回物理性缺失的信息源，出路在模态层。
          - listitem [ref=f127e28]: 核心洞察（全文性价比最高的设计）：语音能量 100Hz–5kHz、超声回波 17–23.5kHz，中间隔着大片空白频带——同一只 48kHz 商用麦克风一次采集、带通滤波一分为二，vocal + echoic 双模态零新增传感器（只加一块 ESP32 和四个网购量产换能器，藏在镜片下缘）。
          - listitem [ref=f127e29]: echoic 模态怎么「看」唇动：两扬声器发 FMCW 超声（17–20 / 20.5–23.5kHz 错开 ≥0.5kHz，chirp 12ms），回波与发射信号逐 chirp 互相关（距离分辨率 0.357cm）堆叠成 Echo Profile，再沿时间差分——滤掉头显与脸的静态反射，只留唇动。
          - listitem [ref=f127e30]: 融合不做朴素平均：可靠性门控 RB——N-best 似然差 L（第一名领先多少）+ 散度 D（候选内部乱不乱）双阈值判每个模态可不可用，四分支路由：双可靠对数域加权、单可靠择优、双不可靠拒识。静默场景自动走「仅 echoic」，全程免手动切换。
          - listitem [ref=f127e31]: 结果：−10~10dB 全部 SNR 下融合 WER 低于两个单模态；−10dB 最强噪声处 MLP 融合相对 vocal / echoic 降 15.68% / 16.57%；静默时 vocal 全变删除错误而融合紧贴 echoic；旁人干扰下 vocal 错误率近半、融合插入错误近乎清零（误触发闭环）；六类噪声场景两单模态强弱随频谱翻转，只有融合吃到两边上包络。
          - listitem [ref=f127e32]: 轻量化甜点：echoic 通道 ResNet-18（11.22M / 1.84G MAdd）经「宽度裁剪 × DS 卷积」8 变体消融，选 1/4-DS（109.9K / 24.74M，压缩超 100×），WER 只付 0.91 个百分点；1/8 再砍开始伤表达能力（方差 ±1.26 全表最大）。
          - listitem [ref=f127e33]: 边界要记住：走路使 echoic WER +50%、摇头 +33%（几何在晃，差分管不住低频晃动）；运动中的超声源 1m 处 +7%（差分抑制的前提是干扰近似静止）。更关键：静默实验是「删掉 vocal 通道」模拟的，真实无声发音的唇动分布未测——这是静默卖点成立与否的关键缺口。
    - generic [ref=f127e34]:
      - paragraph [ref=f127e35]: §01 · 问题陈述
      - heading "三条真实使用情境，指向同一个结构性矛盾" [level=2] [ref=f127e36]
      - generic [ref=f127e38]: 为什么是 KWS 而不是 ASR：XR 头显正集体放弃控制器转向语音 / 手势 / 视线交互，语音承担菜单选择、locomotion、配合视线移动物体等高频任务。相比 ASR，KWS 不需要云端连接、算力需求低、没有隐私外泄——是端侧常开（always-on）交互的更合理载体。但发声 KWS 在 XR 场景下有三条硬伤，每条对应一个真实情境： ① 噪声环境失准：街头、商场、公共交通上准确率显著退化——不是模型不行，是信息源（空气传导语音）本身被人声频段噪声污染； ② 安静场合彻底失效：旁边有人办公休息、隐私或社交尴尬不便出声——功能直接归零，不是准确率下降； ③ 旁人说话误触发：麦克风无强的说话人方向选择性，讨论会 / 教室里旁人的话被当成指令——高密度人声下误触发比漏检更伤体验。 结构性矛盾：单一发声模态的信息源在某些场景物理性缺失或被污染，模型层补不回来——必须从模态层引入失效条件不同的第二信息源。
      - generic [ref=f127e39]: 静默语音接口（SSI）已有积累，但缺口明确：接触式（磁强计入口腔、超声成像、EMG、应变片贴肤）长时间佩戴不适、头显上集成困难；摄像头方案（C-Face / TieLent / SpeeChin）高功耗 + 隐私 + 社交接受度存疑；主动声学（EchoWhisper / CELIP / EchoSpeech）低功耗高性能、最可落地——CELIP 要求换能器正对嘴且器件偏大，EchoSpeech 藏在眼镜下缘形态最隐蔽。但它们全是单 echoic 模态系统，「与常规发声 KWS 融合以获得更强性能、更宽适用场景」的潜力此前完全没被探索——这就是本文的切口。而单 echoic 自己也有软肋（走路 +50%、摇头 +33%，见 §05）：vocal 怕噪怕静默、echoic 怕剧烈运动——失效条件不同，正是融合的价值空间。
      - generic [ref=f127e40]: 四条关键挑战：① 不加感知负担拿到双模态（头显对功耗 / 重量 / 极度敏感，不能加摄像头或贴肤传感器）；② 失效模态的隔离——静默场景 vocal 管线会输出 silence 这类无效预测，朴素加权融合反而被拖累，必须「双可靠才融合、单可靠择优、双不可靠拒识」；③ echoic 模型算力瘦身——前身 EchoSpeech 用 ResNet-18（11.22M 参数、1.84G MAdd），比 vocal 通道重一个量级，要砍小一到两个数量级而不明显掉点；④ 不能停在仿真——要在 HoloLens 2 上搭出可实时运行的完整系统，在三类困难场景下系统验证。
