      - generic [ref=f127e175]: 数据与指标：自录双模态数据集——15 名参与者（2 女 13 男，20–27 岁）× 10 个命令词 × 30 遍 = 4500 条，加 25 个辅助词 × 5 遍 = 1875 条（标注 unknown，教系统拒绝非命令词）+ 静默数据，48kHz 采样。GSC 三个用途：词表迁移 + vocal 模型在大数据集上联合训练（让 vocal 基线吃饱数据红利，双模态的赢不靠对手训练不足）、v2 人声做旁人干扰源、MLP 增强源；DEMAND 做环境噪声。指标 WER = (S+D+I)/N——选它的深层理由在 I：插入错误 = 误触发，对常开头显伤害大于漏检，所以按 S/D/I 分色拆解。
