      - paragraph [ref=f127e306]: §04 · 主要贡献
      - heading "四条贡献 + 一条可迁移判断" [level=2] [ref=f127e307]
      - generic [ref=f127e309]:
        - generic [ref=f127e310]:
          - generic [ref=f127e311]: "1"
          - text: 真机双模态系统：HoloLens 2 + 两对量产级换能器 + ESP32 搭出完整系统；利用语音（100Hz–5kHz）与超声回波（≥17kHz）的频带空白在同一只麦克风上复用两个模态，不引入摄像头或贴肤传感器——KWS 适用场景从「安静出声」扩展到噪声 / 静默 / 旁人干扰。
        - generic [ref=f127e312]:
          - generic [ref=f127e313]: "2"
          - text: 消融驱动的轻量化：宽度裁剪 × DS 卷积 8 变体系统消融，echoic 通道从 11.22M 压到 109.9K（超 100×）、MAdd 1.84G→24.74M（约 74×），WER 只付 0.91 个百分点——常开管线的算力削减直接换成功率与时延预算。
        - generic [ref=f127e314]:
          - generic [ref=f127e315]: "3"
          - text: 两种融合策略 + 一致验证：手工路线的可靠性门控 RB（N-best 似然差 / 散度双阈值 + 对数域自适应加权 + 对 silence/unknown 辅助类的修正）与学习路线的 MLP 融合，在全部 SNR、六类场景、静默、旁人干扰实验中一致优于单模态。
        - generic [ref=f127e316]:
          - generic [ref=f127e317]: "4"
          - text: 可复现三件套：开源代码（github.com/caizhuojiang/VE-KWS）+ 演示视频 + 游戏化验证——对 HCI / 系统类工作，这是可信度的重要组成部分。
      - generic [ref=f127e318]: 可迁移的工程判断：当两个信息源的失效条件互补（vocal 怕噪声与静默、echoic 怕剧烈运动），带可靠性门控的融合可以在不设手动模式切换的前提下同时拿到两边的上包络；而融合层对「辅助类输出（silence / unknown）要降权、但 vocal 的 silence 是『嘴没动』的强证据要特殊对待」这类细节的处理，往往决定融合系统在边界场景下是加分还是减分。
