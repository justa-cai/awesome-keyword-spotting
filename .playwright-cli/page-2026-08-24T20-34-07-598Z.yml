      - heading "噪声吵到失准、安静到没法出声、旁人闲聊被误触发—— 一只麦克风把语音和唇动一起收了" [level=1] [ref=f127e13]: 噪声吵到失准、安静到没法出声、旁人闲聊被误触发——一只麦克风把语音和唇动一起收了
      - paragraph [ref=f127e14]: Robust Dual-Modal Speech Keyword Spotting for XR Headsets（VE-KWS）
      - paragraph [ref=f127e15]: 作者：Zhuojiang Cai*、Yuhan Ma*、Feng Lu（北航 虚拟现实技术与系统全国重点实验室；*共同一作）
      - paragraph [ref=f127e16]: 发表：arXiv 2401.14978（2024-01，IEEE TVCG 投稿格式）· 真机平台 HoloLens 2
