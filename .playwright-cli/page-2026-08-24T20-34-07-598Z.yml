      - heading "运动是最大软肋，「静默」本身还没被真正测过" [level=2] [ref=f127e321]
      - generic [ref=f127e323]:
        - generic [ref=f127e324]:
          - heading "技术局限" [level=4] [ref=f127e325]
          - list [ref=f127e326]:
            - listitem [ref=f127e327]: 身体活动冲击：走路使 echoic WER 上升约 50%、摇头约 33%（vocal 仅轻微受影响）——头显相对嘴部的几何在晃、全身运动污染差分 Echo Profile 里的「运动」信号，特征层静态抑制管不住低频晃动；可用含活动数据的融合优化缓解，但优势确实被削弱。
            - listitem [ref=f127e328]: 运动中的超声源：静止超声源多方向多距离影响可忽略（差分抑制静态干扰）；但运动中的超声源 1m 处平均 WER +7%、更近更强——运动破坏「干扰近似静止」这一差分前提，是原理性盲区，论文未解决。
            - listitem [ref=f127e329]: 频段下沿的听觉风险：17–20kHz 下沿贴近年轻人可听阈上沿，论文未做任何可听性人因测试——对 20 岁上下用户是否存在可感知啸叫 / 疲劳，产品化前必须补。
            - listitem [ref=f127e330]: 附加硬件未消零：仍是 add-on 板 + 四个换能器外挂商用头显，未做到零增量（论文自列未来方向）。
