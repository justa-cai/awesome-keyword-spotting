          - heading "实验设计不足" [level=4] [ref=f127e332]
          - list [ref=f127e333]:
            - listitem [ref=f127e334]: 人群覆盖窄：15 人仅 2 名女性、20–27 岁；麦克风到嘴 3.9cm 等几何参数对脸型 / 性别 / 年龄的敏感性未分层，说话人无关性未评估。
            - listitem [ref=f127e335]: 词表规模小：10 命令词 + 25 辅助词，全是 GSC 短命令；更长命令、连续语流中的检测未测。
            - listitem [ref=f127e336]: 仿真式造难：噪声靠 DEMAND 叠加、旁人靠 GSC 人声叠加、静默靠 vocal 段换静音——全部离线仿真，无真实场景在线录音，SNR 只测到 −10dB。
            - listitem [ref=f127e337]: 静默的构造性偏差（最要害）：自录数据全是出声朗读，「静默」是删 vocal 通道模拟的——echoic 通道对应的是出声朗读时的唇动；真实无声发音幅度更小、更不完整，echoic 在该分布上的性能未报告。
            - listitem [ref=f127e338]: 系统指标缺失：端到端延迟、功耗、推理帧率均未报，「实时」只有定性结论；RB（遗传算法搜参）与 MLP（在线前向）的运行时开销对比、MLP 隐藏层宽度等超参也未给。
      - generic [ref=f127e339]: 值得补的方向：运动鲁棒性要特征层 / 几何层根本治理（惯性传感器辅助运动补偿、自适应基准差分），不能只靠融合层兜底；运动超声源的干扰对消；采集真实无声发音数据重评 echoic 通道（静默卖点成立与否的关键实验）；利用 RB 权重「只与模型有关、不随数据变化」做跨场景迁移与在线自适应；与说话人验证结合，把旁人防御从频带物理层升级到声纹层；端侧量化 + 实际功耗测量，补全轻量化叙事最后一环。
