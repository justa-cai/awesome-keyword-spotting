      - generic [ref=f127e169]: 第二条融合路线：朴素 MLP：完全放弃手工特征，三层 MLP（输入 / 隐藏 / 输出）学「两模态预测向量拼接 → 融合结果」。亮点在训练增强与实验场景一一对应——每条样本随机四选一：保持清晰；叠 DEMAND 环境噪声（对应噪声场景）；叠 Google Speech Commands 人声（对应旁人干扰）；直接丢弃一部分 vocal 数据（把「vocal 通道缺失」塞进训练分布，对应静默场景）。「实验里会怎么难看，训练里就先怎么练。」
