    - heading "问题：每一帧都要当场算完" [level=2] [ref=f19e15]
    - generic [ref=f19e16]:
      - generic [ref=f19e17]: TL;DR
      - list [ref=f19e18]:
        - listitem [ref=f19e19]: ◆ 移动端 KWS 的四条硬约束：流式处理（~10ms/帧持续到达，不能攒）、低延迟（<500ms，晚半秒用户已经怀疑设备聋了）、小内存、低功耗（always-on 电费）。
        - listitem [ref=f19e20]: ◆ 非流式模型（双向 RNN、未来上下文卷积）在整窗上做全局操作——流式场景必须推倒重来；三道坎：因果性、状态管理、单向模型的精度损失。
        - listitem [ref=f19e21]: ◆ 因果 CRNN 的答案：因果卷积（只看过去）+ 单向 LSTM（隐状态逐帧传递）+ 全连接帧级输出——每一环都只吃「过去」。
        - listitem [ref=f19e22]: ◆ 这是量产团队的账本而非新架构论文：延迟功耗实测、决策平滑、量化双轨（PTQ 快落地 + QAT 保精度）——工程完备度是它的真正贡献。
