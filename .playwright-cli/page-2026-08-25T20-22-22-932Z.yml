  - generic [ref=f19e12]: Google Research（Alvarez / Prabhavalkar / He / Riley / McGraw——「Okay Google」量产团队）· arXiv 2005.06720（2020.05） 约束：~10ms/帧持续到达 · 触发延迟 <500ms · 小内存 · 低功耗 · 方法：因果卷积 + 单向 LSTM + 帧级输出，卷积缓冲与 LSTM 状态跨帧持久化，PTQ/QAT 量化收尾 一句话：流式化的本质是「状态化」——每帧只算增量；架构是入场券，状态管理+量化+决策平滑才是量产。
