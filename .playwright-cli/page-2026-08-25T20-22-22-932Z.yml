  - generic [ref=f19e252]:
    - generic [ref=f19e253]: "05"
    - heading "可迁移的判断" [level=2] [ref=f19e254]
    - generic [ref=f19e255]:
      - generic [ref=f19e256]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f19e257]: ① 流式化的本质是「状态化」，不是「换个小模型」。
      - generic [ref=f19e258]: ↳ 把整窗重算变成增量更新的关键是维护跨帧状态——卷积的时间缓冲、RNN 的隐状态、Transformer 的块记忆都是状态的形态；评估任何架构的流式成本，先算它的状态维护账。
      - paragraph [ref=f19e259]: ② 延迟是硬约束，精度是软约束——优先级决定架构。
      - generic [ref=f19e260]: ↳ always-on 产品的用户感知里，「没反应」比「偶尔误触发」伤害大得多——先满足延迟约束再优化精度；反向优化（为精度牺牲延迟）在产品层几乎总是错的。
      - paragraph [ref=f19e261]: ③ 量产 = 架构 × 状态管理 × 量化 × 决策工艺。
