  - generic [ref=f19e86]:
    - generic [ref=f19e87]: "02"
    - heading "机制：因果性的代价与状态化的红利" [level=2] [ref=f19e88]
    - paragraph [ref=f19e89]: 因果性税很直观：非因果模型每帧能看到未来（双向 LSTM、未来卷积），因果模型只有过去——精度天生让一档。但论文的关键信息是这档差距可控：通过架构精调，流式与非流式的差距能压到较小范围，而换来的延迟优势（逐帧响应 vs 等满整窗）是产品必需。
    - img [ref=f19e90]:
      - generic [ref=f19e92]: 机制解剖：因果性的代价 · 状态怎么省钱
      - generic [ref=f19e93]: 因果 vs 非因果感受野
      - generic [ref=f19e101]: 今
      - generic [ref=f19e105]: 因果：只看过去 ★
      - generic [ref=f19e113]: 今
      - generic [ref=f19e116]: 非因果：未来也要看（流式不可用）
      - generic [ref=f19e117]: 单向 vs 双向的精度差是因果性税——
      - generic [ref=f19e118]: 双向 LSTM/未来卷积看得全但等不起
      - generic [ref=f19e119]: 精心设计下流式-非流式差距可控
      - generic [ref=f19e120]: 状态：流式省钱的钥匙
      - generic [ref=f19e122]: 朴素做法（重算）：
      - generic [ref=f19e123]: · 每帧把整个窗口重新过一遍网络
      - generic [ref=f19e124]: · 窗口 1 秒 = 每秒重算 100 次整窗
      - generic [ref=f19e125]: 状态化做法（本文）：
      - generic [ref=f19e126]: · 卷积缓冲区：只滑进新帧、滑出旧帧
      - generic [ref=f19e127]: · LSTM 隐/细胞状态：增量更新
      - generic [ref=f19e128]: · 每帧只算「这一帧的增量」
      - generic [ref=f19e129]: 代价：状态本身占内存（常驻 SRAM）
      - generic [ref=f19e130]: ——内存预算里要给状态留位置
      - generic [ref=f19e131]: 量化收尾：PTQ + QAT 双轨，8-bit 体积
      - generic [ref=f19e132]: "−75%、精度几乎无损——与 #8 结论一致"
      - generic [ref=f19e133]: 左：因果感受野只覆盖过去帧——牺牲未来上下文换即时响应，差距可控；非因果模型看得全但流式等不起。右：状态跨帧持久化让每帧只算增量——这是流式推理效率的全部来源
    - generic [ref=f19e134]: 图 2 · 机制解剖：因果 vs 非因果感受野 · 状态化如何把整窗重算变成增量更新
    - generic [ref=f19e135]:
      - generic [ref=f19e136]: "每帧流程: x_t (40维 Log-Mel) → 因果卷积(滑更新缓冲) → LSTM(更新 h_t, c_t) → FC+Softmax → P(关键词|t) → 平滑 + 阈值 → 决策 持久状态: 卷积时间缓冲区(历史帧) + LSTM 隐/细胞状态 —— 跨帧保留, 只算增量"
      - generic [ref=f19e137]: 人话：朴素做法是每帧把整个窗口重新算一遍——1 秒窗意味着每秒重算 100 次整窗。状态化把「历史的计算结果」存起来（卷积缓冲 + LSTM 状态），每帧只算新到的这一帧的增量——这是流式推理效率的全部来源，代价是状态要占常驻内存。
    - paragraph [ref=f19e138]: 状态是流式的第一性问题：换任何架构进流式场景，先问它的状态怎么维护——卷积靠时间缓冲、LSTM 天然增量、Transformer 要靠块处理记忆（2021 年的续作正是解决这个）。答不出状态维护方案的架构，流式成本就是整窗重算。
