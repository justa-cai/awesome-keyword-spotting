    - generic [ref=f213e4]: 论文精读 · 可视化版 · 2022 №20
    - heading "增量学习的上限， 在基础训练时已经定死" [level=1] [ref=f213e5]: 增量学习的上限，在基础训练时已经定死
    - generic [ref=f213e6]:
      - generic [ref=f213e7]: MT-BT + AS-ES · arXiv 2204.12915
      - generic [ref=f213e8]: 剑桥大学 × 新加坡管理大学
      - generic [ref=f213e9]: 类别增量学习 / 灾难性遗忘
      - generic [ref=f213e10]: GSC-12/35 + UrbanSound8K
    - generic [ref=f213e11]: 现有 CIL 方法全部聚焦「增量阶段怎么补救遗忘」——治标。本文证明：如果基础模型的特征过拟合于基础类别，增量性能的上限已被卡死；从基础训练阶段下手，+4~5%。
    - generic [ref=f213e12]:
      - heading "一分钟版本" [level=3] [ref=f213e13]
      - list [ref=f213e14]:
        - listitem [ref=f213e15]: ▸ 场景：真实 KWS 产品的词表动态演进——今天 Ok Google，明天加自定义词。边缘三约束：旧类数据可能因隐私不可用、算力有限无法回放大量历史、增量须在端上完成。
        - listitem [ref=f213e16]: ▸ 老方法的盲区：LwF 蒸馏 / Replay 回放 / EWC 正则全在增量阶段做文章；但如果基础特征提取器学到的是「恰好能区分这几个基础词」的最短路径（类别特有特征），新类必须复用它——无论增量阶段怎么补，上限已定。
        - listitem [ref=f213e17]: ▸ MT-BT 机制：N 个基础类随机分 K 个子集，每子集独立分类头、共享 backbone——不同子任务梯度方向冲突，聚合时相互抵消，迫使提取器学「对所有子任务都有用的折中特征」= 更通用的音素级特征。
        - listitem [ref=f213e18]: ▸ 负迁移的账：基础准确率可能低 0.5–1%（子任务冲突的代价），换增量阶段 +4–5%——总收益远大于基础损失。
        - listitem [ref=f213e19]: ▸ AS-ES 早停：增量数据不平衡时固定轮次要么过拟合要么欠拟合（不同场景最优 10–200 epochs）；验证集 + patience 5–10 + best checkpoint——零额外开销，+1–2%。
        - listitem [ref=f213e20]: ▸ 主结果：五种 CIL 策略上 MT-BT 一致 +3~5%，AS-ES 再 +1%；最强组合 MT-BT + AS-ES + LwF 达 90.5%（GSC-12，10 基础类 + 5 增量步）。
        - listitem [ref=f213e21]: ▸ K 的甜点：K=1 退化单任务无增益；K=3–4 最优（+3~4%）；K≥6 每子集类太少、子任务太简单、梯度冲突不足。
        - listitem [ref=f213e22]: ▸ 优势随增量步放大：第 1 步 +1% → 第 5 步 +3–5%——每加一个新类，好基础特征就多提供一次「便利」。
        - listitem [ref=f213e23]: ▸ 任务无关：UrbanSound8K 上同样 3–5 点改进——不只语音 KWS，适用一般声音分类 CIL。
        - listitem [ref=f213e24]: ▸ 边界：K 是经验超参无自动机制；基础训练开销 1.2–1.5×（推理零增量）；基础类只验证了 10 个（100+ 类时子任务可能仍太简单）；单一小 CNN 骨干；未与数据增强组合评估。
    - heading "§01 问题：增量阶段的方法治标不治本" [level=2] [ref=f213e25]:
      - generic [ref=f213e26]: §01
      - text: 问题：增量阶段的方法治标不治本
    - generic [ref=f213e27]: 基础模型的质量是增量学习性能的上限决定因素
    - paragraph [ref=f213e28]: 单一分类任务联合训练 N 个基础类时，梯度方向是「最小化基础类别的分类误差」——模型寻找最容易区分这些类别的特征维度。如果某些声学特征（特定关键词的共振峰频率）恰好能完美区分基础类别，模型会过度依赖它们而忽略其他同样有用的维度。当新类别（stop、go）的声学特性与基础类别差异大时，共享提取器给不出有效表示。
    - generic [ref=f213e29]:
      - generic [ref=f213e30]:
        - heading "灾难性遗忘 + 边缘约束" [level=4] [ref=f213e31]
        - paragraph [ref=f213e32]: 学新类时新任务的梯度覆盖旧权重——旧类识别急剧退化；而边缘场景旧类原始数据可能不再可用（隐私法规）、设备无法存储回放大量历史、增量须在端上完成。
      - generic [ref=f213e33]:
        - heading "缺训练终止策略" [level=4] [ref=f213e34]
        - paragraph [ref=f213e35]: 增量场景数据天然不平衡（新类样本少、回放样本有限）——不同场景最优训练轮次差异巨大（10 到 200 epochs），固定轮次在新类样本少时严重过拟合：新类准确率虚高、旧类急剧下降。
    - heading "§02 方法：多任务基础训练 + 自适应早停" [level=2] [ref=f213e36]:
      - generic [ref=f213e37]: §02
      - text: 方法：多任务基础训练 + 自适应早停
