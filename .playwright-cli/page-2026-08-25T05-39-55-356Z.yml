  - generic [ref=f213e108]:
    - generic [ref=f213e109]: θ ← θ − η · Σ(k=1..K) ∇θ L_k(θ) （K 个子任务梯度聚合更新共享 backbone）
    - generic [ref=f213e110]: 人话：把 N 个基础类随机分成 K 个子集，每个子集一个独立分类头，交替/混合训练——某个特征维对子任务 1 有用但对子任务 2 无用甚至有害，梯度聚合时冲突相互抵消，提取器被迫寻找对所有子任务都通用的折中特征。与 MAML 思想类似但无需内外循环，训练更简单。
  - paragraph [ref=f213e111]: 正交叠加：MT-BT 不替代任何现有 CIL 策略——它是「基础训练增强模块」：MT-BT 提供更好的基础特征，LwF/EWC/GEM/Replay 在增量阶段各自保留旧知识，两者作用在不同阶段所以可叠加。推理时只用一个分类头，推理零增量。
