  - heading "§05 局限与边界" [level=2] [ref=f213e326]:
    - generic [ref=f213e327]: §05
    - text: 局限与边界
  - generic [ref=f213e328]: 预防的代价与验证范围
  - generic [ref=f213e329]:
    - generic [ref=f213e330]:
      - heading "K 是经验决策" [level=4] [ref=f213e331]
      - paragraph [ref=f213e332]: K=3–4 在大多数场景最优但无自动确定机制；极端情况下（声学极相似的两类被分到不同子集）可能产生过多梯度冲突、降低训练效率。
    - generic [ref=f213e333]:
      - heading "训练开销与可扩展性" [level=4] [ref=f213e334]
      - paragraph [ref=f213e335]: 基础训练需同时训 K 个分类头（1.2–1.5× 计算量）；基础类只验证 10 个——100+ 类时 K=4 每子集仍有 25+ 类，子任务可能仍太简单，可扩展性未知。
    - generic [ref=f213e336]:
      - heading "骨干单一" [level=4] [ref=f213e337]
      - paragraph [ref=f213e338]: 全部实验用 3–4 层小 CNN（约 50K 参数）——Transformer 或更深 CNN 的冗余参数更多，对基础训练策略的敏感度可能不同。
    - generic [ref=f213e339]:
      - heading "未与数据增强组合评估" [level=4] [ref=f213e340]
      - paragraph [ref=f213e341]: SpecAugment/噪声增强本身是正则化手段，与 MT-BT 的隐式正则可能协同也可能冗余——组合效果未测；主表数字为约值，无方差报告。
  - generic [ref=f213e342]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f213e343]
    - list [ref=f213e344]:
      - listitem [ref=f213e345]: ↳ 预防优于治疗：持续学习系统的上限由基础模型质量决定——基础训练阶段投资特征表示（多任务/增强/预训练）比增量阶段修补遗忘回报更高。
      - listitem [ref=f213e346]: ↳ 梯度冲突是特性不是缺陷：子任务间的目标冲突在聚合时相互抵消，逼出「对所有任务都有用的折中特征」——这正是迁移性的来源。
      - listitem [ref=f213e347]: ↳ 接受小幅基础性能损失换大幅下游增益：0.5–1% 的基础掉点换 4–5% 的增量增益——评价多任务训练要看全生命周期，不只看基础任务。
      - listitem [ref=f213e348]: ↳ 子任务难度要适中：任务太简单（每子集类太少）梯度冲突不足、正则失效；任务太难（K=1 退化单任务）没有冲突——甜点在中间。
      - listitem [ref=f213e349]: ↳ 数据不平衡下「训练多少轮」本身是个超参：验证集 + patience 早停是最便宜的自适应方案，任何增量/微调流程都该默认带上。
