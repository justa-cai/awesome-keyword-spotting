  - generic [ref=f302e317]:
    - generic [ref=f302e318]: 可迁移判断
    - paragraph [ref=f302e319]: ↳ 预训练任务的词汇规模比数据量更重要：把分类头做「大而全」——任务难度本身是表示学习的燃料。设计预训练时先问「任务够难吗」，再问「数据够多吗」；简单的多任务分解（125×40）会稀释任务难度。
    - paragraph [ref=f302e320]: ↳ 云端强嵌入 + 设备端线性头：个性化的正确分工——重的表示学习放云端一次性做完，设备端只做轻量适配；嵌入冻结物理上杜绝灾难性遗忘，这是端侧持续学习的工程保险。
    - paragraph [ref=f302e321]: ↳ 对齐标注是免费的大词表来源：LibriSpeech 的社区强制对齐让「从已有语料挖 15K 个关键词」成为数据工程而非标注工程——先查手里有没有现成的对齐资源再谈标注预算。
    - paragraph [ref=f302e322]: ↳ 跨语言泛化来自任务压力而非语言覆盖：15K 词的分类压力迫使模型关注跨语言共享的声学判别线索——这解释了为什么单语预训练能多语泛化，也提示「加大任务难度」与「加多语言」是两条可叠加的路（后者即 XLSR 路线，见 №13）。
