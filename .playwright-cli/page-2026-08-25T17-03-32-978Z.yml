    - generic [ref=f302e99]: §02
    - text: 方法：一个头，15K 个词
  - generic [ref=f302e100]: 数据工程 · 交替卷积架构 · 两种下游模式
  - generic [ref=f302e101]:
    - generic [ref=f302e102]: "预训练: F: U → ℝ⁹⁶ 作为分类模型 P(y|F(u)) 的一部分 L = Σ_{y∈V} Σ_{u∈U_y} log P(y|F(u)) # V = 15,200 词 · 250 小时 数据: LibriSpeech 强制对齐 → n-gram（≤5 词 · ≥10 字符 · ≥10 次） 适配: 移除 15K 层 → 新线性层 → fix（冻嵌入）或 FT（全微调） 顺序: 新词 = 独立 sigmoid 二分类器（5 正例 + 50 负例）· 嵌入冻结"
    - generic [ref=f302e103]: 人话：预训练阶段让一个分类头同时认 1.5 万个词——词与词之间的细微声学差异（相近音素序列、重音、节奏）全都要分开，表示被迫精细。下游换头时这个精细表示直接可用：5 个样本够线性层学会「新词在嵌入空间的哪一片」。
  - generic [ref=f302e104]:
    - generic [ref=f302e105]:
      - heading "为什么冻结能防遗忘" [level=3] [ref=f302e106]
      - paragraph [ref=f302e107]: 旧词的分类器都建在同一个冻结的嵌入上——新词训练只动新分类器的权重，旧分类器与其无关，物理上不可能被覆盖。微调则整个嵌入空间为新词重排，旧词的位置全部漂移——24.3% 的灾难性遗忘就是空间重排的代价。
    - generic [ref=f302e108]:
      - heading "5 个样本就饱和的原因" [level=3] [ref=f302e109]
      - paragraph [ref=f302e110]: 样本数扫描显示 5→1000 样本在 LibriKWS 上只从 98.5 到 98.8——嵌入已把难的部分做完，线性头只学「新词在哪个方向」这个浅层映射。这与 few-shot literature 的「骨干定上限、头部定下限」完全一致。
