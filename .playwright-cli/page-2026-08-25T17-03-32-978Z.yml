- generic [ref=f302e2]:
  - generic [ref=f302e3]: 论文精读 · 可视化版 · 2021 №22 · 系列基石
  - heading "让一个分类头学 1.5 万个词： 词汇规模换数据量——5 个样本识别全新关键词" [level=1] [ref=f302e4]: 让一个分类头学 1.5 万个词：词汇规模换数据量——5 个样本识别全新关键词
  - generic [ref=f302e5]:
    - generic [ref=f302e6]: KeySEM · Google Research 瑞士 + IIT 孟买
    - generic [ref=f302e7]: arXiv 2106.02443 · 250h 预训练 → 96 维嵌入
    - generic [ref=f302e8]: 15,200 词单一分类头预训练 · 冻结适配 + 顺序学习
    - generic [ref=f302e9]: 5 样本/词 LibriKWS 98.5%（MTLEmb 43.9）· 顺序学习仅 −0.4%
  - generic [ref=f302e10]: 一句话：KWS 模型训完就焊死在 20 个词上，用户自定义词无法适配。前作 MTLEmb 用 111K 小时数据 + 125 个分类头（每个只区分 40 词）学嵌入——每个头的判别任务太简单。KeySEM 反着来：一个分类头同时区分 15,200 个从 LibriSpeech 对齐标注挖出的 n-gram 词，只要 250 小时（少三个数量级）——极难的判别任务逼出极强区分性的 96 维嵌入。5 个样本/词在 150 个未见关键词上达 98.5%（MTLEmb 43.9），英语预训练直接泛化到日/世界语/波兰/葡萄牙语，冻结嵌入的顺序学习只比同时训练低 0.4%。
  - generic [ref=f302e11]:
    - generic [ref=f302e12]: TL;DR
    - listitem [ref=f302e13]: ◈ 僵化鸿沟：KWS 模型在数千小时内部数据上训练、只认 ≤20 个词——用户自定义唤醒词/命令词完全无法适配；为新词收集大量数据贵且慢。目标：极少量样本识别全新词 + 跨语言泛化 + 增量学新词不忘旧词。
    - listitem [ref=f302e14]: ◈ MTLEmb 的天花板：111K 小时 YouTube 语音、125 个分类头 × 每头仅区分 40 词——每个头的判别任务太简单，特征只需分开 40 类，区分性不足；用数据量堆不出词汇间的细粒度差异。
    - listitem [ref=f302e15]: ◈ KeySEM 的核心赌注：预训练任务的词汇规模（而非数据量）决定嵌入质量——一个分类头学 15,200 词，判别任务极难，模型被迫学出细粒度声学区分；250 小时就够，比 MTLEmb 少三个数量级。
    - listitem [ref=f302e16]: ◈ 预训练数据工程：LibriSpeech 社区强制对齐标注 → 提取 n-gram（≤5 词 · ≥10 字符 · 出现 ≥10 次）→ 15,200+ 关键词 · 250 小时。架构：6 卷积块（1×3/3×1 交替 · 第 5 块后频率维压到 1）→ 96 维嵌入（约 410K 参数）。
    - listitem [ref=f302e17]: ◈ 下游适配两种模式：冻结（fix，只训新线性头——少样本时显著更优）vs 微调（FT，全模型训——数据充足上限更高，1000 样本/词达 97.5%）。「样本少冻骨干、样本足微调」。
    - listitem [ref=f302e18]: ◈ 5 样本核心结果：LibriKWS test-clean 98.5%（MTLEmb 43.9）· test-other 94.5%（vs 33.1，差 61 点）；Speech Commands 86.5（vs 79.1）；四门非英语语言 80.8–87.4——vs MTLEmb 绝对提升 +7 到 +61 个点。
    - listitem [ref=f302e19]: ◈ 跨语言发现：仅英语预训练，日/世界语/波兰/葡萄牙语全提升——学到的是「关键词检测任务本质」的表征而非英语特定特征（15K 词的分类压力迫使模型关注跨语言共享的声学线索）。
    - listitem [ref=f302e20]: ◈ 顺序学习：每个新词训独立 sigmoid 二分类器（5 正例 + 50 负例），嵌入全程冻结——10 个类依次学完仅比同时训练低 0.4%；微调方式则灾难性遗忘（掉到 24.3%）。「云端强嵌入 + 设备端线性头」的个性化路径成立。
