  - generic [ref=f302e23]: 现有四条路的局限
  - generic [ref=f302e24]:
    - generic [ref=f302e25]:
      - heading "ASR 初始化的词典锁" [level=3] [ref=f302e26]
      - paragraph [ref=f302e27]: 用 ASR 权重初始化 KWS 听着合理，但依赖音素-字素词典——换语言就要换词典，扩展性差。这条路把 KWS 绑死在 ASR 的语言假设上。
    - generic [ref=f302e28]:
      - heading "增强与元学习的不足" [level=3] [ref=f302e29]
      - paragraph [ref=f302e30]: SpecAugment 只缓解数据不足的表面问题；MAML/原型网络等 few-shot 方法在跨语言泛化上表现有限——它们学「怎么快速适应」但底座表示不够强。
    - generic [ref=f302e31]:
      - heading "MTLEmb 的问题诊断" [level=3] [ref=f302e32]
      - paragraph [ref=f302e33]: 前作的 125 个分类头各只区分 40 词——对每个头来说任务太简单，梯度信号只需要推开 40 类，学不出词汇间细粒度差异。数据量再大也填不平任务简单导致的表示瓶颈。
    - generic [ref=f302e34]:
      - heading "任务难度即燃料" [level=3] [ref=f302e35]
      - paragraph [ref=f302e36]: KeySEM 的洞察可以一句话说清：把预训练分类头做「大而全」（15K 类），少量数据就能逼出强区分性表示——表示学习的瓶颈常在任务设计而不在数据规模。
