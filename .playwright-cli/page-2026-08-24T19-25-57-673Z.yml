      - generic [ref=f105e25]:
        - heading "一分钟版本" [level=2] [ref=f105e26]
        - list [ref=f105e27]:
          - listitem [ref=f105e28]: 两条路线各自拿掉了对方的长处：QbyA（语音注册）信息贴近真实发音但注册贵、怕信道 / 噪声 / 说话状态变化——1 条注册时 SPC Acc 崩到 69.0%；QbyT（文本注册）便宜稳定但丢掉说话人实际发音——口音用户音素发错显著伤害性能。
          - listitem [ref=f105e29]: 方案：注册端做成「文本 + 语音」双模板且都可缺省——查询支路 Tiny Conformer（在线）；支持支路三个冻结多语言预训练模型（DistilBERT 文本 768d + G2P 音素 64d + XLS-R 0.3B 语音 1024d → mapper 统一 128d），注册嵌入只预计算一次、推理时查表——大模型不在关键路径上，这就是「多模态 + 大模型 + 6ms 延迟」能同时成立的全部秘密。
          - listitem [ref=f105e30]:
            - text: 匹配：QTAM（查询+音素+文本三路拼接自注意力）与 QAAM（查询+注册语音）并行 → GRU 后验加性融合（文本为主、语音为辅）；辅助损失 L
            - subscript [ref=f105e31]: phon
            - text: /L
            - subscript [ref=f105e32]: text
            - text: 给注意力提供单元级密集监督——消融里贡献最大（去掉后 LH EER 9.30→12.95）。
          - listitem [ref=f105e33]: 结果：英语 LH 难集 EER 9.30%（3.9M 参数登顶，反超 109M 的 AdaKWS-Small 的 11.48）；普通话 WH 上 ASR 系统 AUC 全贴随机线（56-58%）而 MM-KWS 85.84%、延迟 6ms 对 300ms；零样本 SPC：纯文本注册（94.4%）已胜 QbyA 用 5 条语音（90.5%），方差还小一个量级。
          - listitem [ref=f105e34]: 难例挖掘四路：音素编辑距离（音近）+ 语义余弦（义近）+ 词序排列 + LLM 生成 → ZS-TTS 合成 390 万条双语负例——LH EER 12.45→9.30 的主要功臣；代价诚实：易集轻微退化（LE 0.41→0.68、WE 1.95→4.25）——决策边界推向保守侧的权衡。
          - listitem [ref=f105e35]: 成色缺口：普通话 WH 最好 EER 仍 22.06%（声调是硬骨头）；融合是最朴素加性（无置信度门控）；口音假设无专项评测；流式 / 6ms 测量条件未报告。
    - generic [ref=f105e36]:
      - paragraph [ref=f105e37]: §01 · 问题陈述
      - heading "把「关键词是什么」从模型参数搬到推理时的输入端" [level=2] [ref=f105e38]
      - generic [ref=f105e40]: 四代方案与量化死穴：① LVCSR 词格检索——表外词性能骤降 + 端侧太重；② 热词增强 ASR——FunASR 带热词表 300ms / Whisper-Large 316ms 单次推理（对常驻监听不可接受）；③ QbyA——1 条注册语音时 SPC Acc(close) 仅 69.0%（注册信息太少性能崩塌）；④ QbyT（CMCD / EMKWS / PhonMatchNet / AdaKWS）——单文本模态固有软肋：只告诉模型「标准上该怎么发音」，不知道「这个用户实际会怎么发音」。四个挑战：双模态融合成统一注册机制（不是二选一）；同一套系统覆盖多语言（英 + 普通话，不重训）；针对性提升易混词区分（UDKWS 错误主要来源）；融合多模态 + 多个大模型的同时把在线开销压到 6ms。
