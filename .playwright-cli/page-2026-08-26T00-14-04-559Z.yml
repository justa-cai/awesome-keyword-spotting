      - generic [ref=f83e17]: TL;DR
      - list [ref=f83e18]:
        - listitem [ref=f83e19]: ◆ 近讲模型进远场就崩：生产声学模型在海量近讲数据上训出，房间混响/噪声/距离衰减让 WER 大涨；远场标注数据贵且慢。
        - listitem [ref=f83e20]: ◆ 大模型塞不进音箱：生产 KWS 检测器百万到千万参数，第三方音箱算力远远不够。
        - listitem [ref=f83e21]: ◆ 第三方硬件是黑盒：信号处理由厂商控制——端到端联合优化做不了，只能从模型侧想办法。
