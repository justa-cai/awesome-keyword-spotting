    - text: Developing Far-field Speaker System via Teacher-Student Learning · Jinyu Li / Rui Zhao / Zhuo Chen / Changliang Liu / Xiong Xiao / Guoli Ye / Yifan Gong（微软 AI 与研究）· arXiv
    - link "1804.05166" [ref=f83e12] [cursor=pointer]:
      - /url: https://arxiv.org/abs/1804.05166
    - text: （ICASSP 2018） 一句话：教师（大 · 近讲）与学生（小 · 远场）吃同一段语音的不同声学版本，最小化输出分布的 KL 散度——域适应不需要转录、压缩不需要硬标签：WER 相对降 72.6%（回放）/ 57.2%（实时），KWS 模型压 27× 准确率不变。
