  - generic [ref=f83e219]:
    - heading "5 判断：能带走的三句话" [level=2] [ref=f83e220]:
      - generic [ref=f83e221]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f83e222]:
      - generic [ref=f83e223]: JUDGEMENT
      - paragraph [ref=f83e224]: ↳ 域适应和模型压缩是同一件事：都是「让学生在受限条件下复现教师的输出分布」——一个受限在输入（远场），一个受限在容量（小模型）。T/S 是它们的公共解。
      - paragraph [ref=f83e225]: ↳ 软标签是数据有限时的杠杆：硬标签一比特信息，教师分布携带类间相似性的连续信号——标注越少，蒸馏的边际收益越大；这就是后来「未标注数据 + 强教师」成为工业标配的原因。
      - paragraph [ref=f83e226]: ↳ 模拟数据的增益要按真实数据打折验收：72.6%（回放）到 57.2%（实时）的落差就是模拟-真实域差距的标价——报告适应结果时两套数字都要看，只报模拟集是常见的自我高估。
