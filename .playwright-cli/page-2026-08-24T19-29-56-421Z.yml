    - generic [ref=f106e37]:
      - paragraph [ref=f106e38]: §01 · 问题陈述
      - heading "变异性保留 × 计算效率的两难" [level=2] [ref=f106e39]
      - generic [ref=f106e41]: 三条既有路线的失效机制：① DTW 加速技术（Sakoe-Chiba 带 / 剪枝 / 对角并行）——优化的都是「一次 DTW」内部的常数与并行度，完全不触及 K 因子的乘性放大；② Fréchet 均值压缩——DTW 度量下求均值是 NP 完全（只能启发式），更致命的是均值是「抹平」而关键词判别恰依赖被抹平的细节；③ 聚类多均值（每簇一个均值）——伪模板数 = 簇数、切换只能在簇均值粒度发生，仍是有损压缩。两条路线之间没有中间形态：「性能与逐样本持平、运行时间与单均值接近」这一档在本文之前是空白。三层挑战：数学上保留全部 K 个样本贡献（非有损压缩）；工程上把 K 因子从串行 DP 转移到可并行部分；配套上需要一个统一时间网格的对齐机制且本身不引入新损失。
