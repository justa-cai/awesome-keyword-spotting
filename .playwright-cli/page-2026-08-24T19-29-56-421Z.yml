            - listitem [ref=f106e230]: 名义复杂度没变：K 因子留在代价张量的计算与存储（内存随 K 线性涨，数字未报）；单线程低端 MCU 上串行版优势缩水（HFCC 20.9s 对 29.5s 只快 29%）。
            - listitem [ref=f106e231]: 嵌合体误报风险无理论约束：「A 的开头拼 B 的结尾」这类真实语音不存在的模板可能造误报——实验精确率未受损但只是单一数据集经验、无对抗压力测试。
            - listitem [ref=f106e232]: 不可微：硬 min + 精确 DP 保了精确性但进不了训练回路——特征与匹配割裂两阶段，无法端到端联合优化。
            - listitem [ref=f106e233]: 参考模板依赖启发式：Fréchet 均值本身 NP 完全的近似；模板长度固定为「平均长度」对长度方差大的类可能次优；初始化敏感性未比较。
            - listitem [ref=f106e234]: 阈值依赖：决策阈值在验证集逐类调优——域偏移下失配风险与所有模板匹配系统相同，重校准成本未讨论。
        - generic [ref=f106e235]:
          - heading "实验设计不足" [level=4] [ref=f106e236]
          - list [ref=f106e237]:
            - listitem [ref=f106e238]: 单一数据集单语言单域：全部结论来自 KWS-DailyTalk（英文对话 / 15 金融出行词）——作者自认在 Speech Commands 上复验是未来工作；10 分钟测试集 + 每词约 12 次出现，0.05 点级差异（69.43 对 69.48）无统计意义、无显著性检验。
            - listitem [ref=f106e239]: 性能-shot 曲线缺失：few-shot 方法的核心卖点之一是 K=1→10 的性能爬坡——只有运行时间曲线，论证少了半边。
            - listitem [ref=f106e240]: 聚类均值基线缺席：引言重点讨论却没实现——「聚类 + multi-sample 组合是否更强」无从判断。
            - listitem [ref=f106e241]: 对比局限 DTW 家族：无度量学习分类器 / 原型网络等非 DTW 少样本方案——「路线内最优」≠「任务最优」。
            - listitem [ref=f106e242]: 并行细节不透明：线程数 / 框架 / SIMD 未报——12.4s / 6.5s 可复现性打折；GPU 未测。
      - generic [ref=f106e243]: 值得追的方向：① 跨数据集跨任务验证（Speech Commands + 生物声学 / 多基频估计——方法不依赖语音特性，任何「多模板对长序列」场景适用）；② 软最小值化：min 换带温度 soft-min（借鉴 soft-DTW）→ 张量聚合变可微算子，端到端训练「适配」聚合目标的嵌入，甚至学每样本的注意力式加权 min；③ 与正交加速叠加（带约束 / 剪枝 / GPU 对角并行——论文明说对所有方法影响相同，可叠加）；④ 超大 K 的分层结构（先聚类、簇内 multi-sample、簇间取优）缓解张量的线性内存；⑤ 嵌合体误报控制：切换罚项或限制每路径切换次数——保留重组增益同时约束非自然模板，为精确率给理论保障；⑥ 改造均值推广到「一个模板编码 N 个可替换模板」（更细步集 / 更高维结构）+ 有效容量与误报率权衡的理论分析。
