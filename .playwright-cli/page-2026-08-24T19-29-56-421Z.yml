        - list [ref=f106e26]:
          - listitem [ref=f106e27]: 两难：少样本开放集 KWS 靠模板匹配（QbyE + DTW）。C 类 × 每类 K 个样本对 10 分钟长序列做子序列 DTW → O(N·M·C·K)，逐样本查询随 K 线性膨胀「可能高度不实用甚至不可行」；每类压缩成一个 Fréchet 均值 → O(N·M·C) 快但「抹平」了类内变异性（不同说话人 / 上下文 / 时长节奏）——HFCC 上均值把 F 值从 58.82 拉到 42.44、召回崩到 36.46%。
          - listitem [ref=f106e28]: 方案（四步）：① 每类求 Fréchet 均值做参考模板（且做「改造」）；② 每个样本经单次 DBA 迭代对齐到参考模板的时间网格（保持个性但时间结构统一，为逐元素合并创造可比性）；③ K 张代价矩阵堆成张量、逐元素取 min 坍缩成一张；④ 每类只跑一次子序列 DTW。
          - listitem [ref=f106e29]:
