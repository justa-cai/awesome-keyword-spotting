      - generic [ref=f129e214]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f129e215]:
      - generic [ref=f129e216]: JUDGEMENT
      - paragraph [ref=f129e217]: ↳ 骨架迁移是高风险高回报的早期投资：把 CV 的 ResNet 搬进 KWS 当时不是显然的事——时频图与自然图像几何不同（见 2018 №19 的边界讨论），但「梯度畅通」的收益跨模态成立；骨架级的迁移成功会定义一个领域后续数年的默认配置。
      - paragraph [ref=f129e218]: ↳ 感受野是可以「免费」买的：膨胀卷积用同一份参数买到指数增长的时间视野——KWS 的时域多尺度需求（音素到韵律）与这个机制天然匹配；先问「哪个维度需要视野」再选膨胀轴。
      - paragraph [ref=f129e219]: ↳ 消融要打到「破坏性证据」：去 skip 深层崩到不如浅层、固定膨胀输给指数——这种「去掉就坏」的对照比「加上更好」的说服力高一档，是架构论文消融设计的标准。
