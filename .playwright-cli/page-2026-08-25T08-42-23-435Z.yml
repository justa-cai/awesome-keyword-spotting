  - generic [ref=f230e258]:
    - heading "可迁移判断（防御视角）" [level=4] [ref=f230e259]
    - list [ref=f230e260]:
      - listitem [ref=f230e261]: ↳ 数据供应链是 KWS 最现实的后门入口——「只碰数据」的弱攻击者已足够有效：训练外包和第三方数据采购都在暴露面上。
      - listitem [ref=f230e262]: ↳ 人耳感知的系统性弱点（掩蔽效应）可被武器化成隐蔽通道——防「人检」更要防「机检」：能量尖峰检测、基频统计是攻击未测的对手。
      - listitem [ref=f230e263]: ↳ 全局变换触发器专克时序模型：局部扰动会被循环结构用上下文平滑掉，全局变换没有干净帧可依托——这条对攻击和防御都成立。
      - listitem [ref=f230e264]: ↳ 时序建模层是实验支持的抗后门资产（攻击侧负结果 = 防御侧正资产）——抗局部触发类后门，加 LSTM 层是被验证的选项。
      - listitem [ref=f230e265]: ↳ 复合触发的两个分量生效条件不同：全局分量低投毒即生效、局部分量需足量样本「延迟生效」——低预算攻击押全局分量，防御审查优先盯全局统计异常。
