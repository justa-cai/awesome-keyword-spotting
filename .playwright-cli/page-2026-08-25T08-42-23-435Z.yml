    - heading "把后门触发器藏进 人耳的听觉盲区" [level=1] [ref=f230e5]: 把后门触发器藏进人耳的听觉盲区
    - generic [ref=f230e6]:
      - generic [ref=f230e7]: PBSM · 河海大学 × RMIT · arXiv 2211.08697
      - generic [ref=f230e8]: 音高提升 5 半音 + 20ms 掩蔽信号
      - generic [ref=f230e9]: 只碰数据的弱攻击者威胁模型
      - generic [ref=f230e10]: GSC 10 类 · CNN/CNN-LSTM/ResNet18
    - generic [ref=f230e11]: 投毒不到 1% 的训练数据，三个受害模型平均攻击成功率接近 90%；20 名志愿者无一人感知到高幅度信号——隐蔽性不靠「频率超出可闻域」的物理边界，靠人类听觉对强邻信号的忽略。
    - generic [ref=f230e12]:
      - heading "一分钟版本" [level=3] [ref=f230e13]
      - list [ref=f230e14]:
        - listitem [ref=f230e15]: ▸ 定位：KWS 是设备常驻监听入口——后门触发等于攻击者拿到「万能唤醒词」，后续语音指令链路全部暴露；后门攻击研究集中在图像/文本，部署量最大的端侧 KWS 恰是防御最薄弱的一环。
        - listitem [ref=f230e16]: ▸ 威胁模型：攻击者不知道受害网络任何结构信息，唯一攻击面是修改训练数据——对应训练外包和采购第三方数据两类真实场景；能力假设越弱，攻击面越贴近现实供应链风险。
        - listitem [ref=f230e17]: ▸ 两条已有路线的死穴：多数触发器「难懂但可闻」——人耳能清晰区分嵌没嵌触发器，抽听即暴露；超声脉冲真正不可闻但被采样率硬约束（需 >40kHz，真实产品多在 16kHz）且短脉冲打不动 LSTM。
        - listitem [ref=f230e18]: ▸ 组合触发范式：音高提升（时序通道）——STFT 频域整体上移 5 半音（约 1.335 倍频）——全局变换让 LSTM 无论哪个时间步建模都没有干净帧可依托；对人耳「不是噪声」（仍是一段自然可懂的话）。
        - listitem [ref=f230e19]: ▸ 声音掩蔽（空间通道）：心理声学上掩蔽声抬升听阈——20ms 高幅度信号插在整段音频最高幅度段（≥200ms 下限）旁边，能量很大但被强邻信号掩蔽到听不见。
        - listitem [ref=f230e20]: ▸ 共生关系：音高提升在听感上构造出掩蔽空间，高幅度信号就藏在里面——两层隐蔽互相加强。
        - listitem [ref=f230e21]: ▸ 主结果：投毒 <1% 时三模型平均 ASR 接近 90%，随投毒样本数增加快速收敛 >90%；准确率方差平均 0.64%（vs 基线 0.66%）——良性性能几乎不受影响。
        - listitem [ref=f230e22]: ▸ 人工验证：20 人 × 20 条——95% 认为后门音频自然可懂、无一人感知到高幅度信号；1 人觉得少数音频不可懂（音高提升是有损变换的残留窗口）。
        - listitem [ref=f230e23]: ▸ 消融机制链：高幅度/超声只攻空间维（打得动纯 CNN、打不动 LSTM）；仅音高提升在低投毒率下攻击 CNN_LSTM 全面反超（全局变换无干净帧）；高幅度分量「延迟生效」——低投毒预算押音高分量。
        - listitem [ref=f230e24]: ▸ 防御侧正资产：结论章明确「时序层（LSTM）能提升 KWS 对后门攻击的抵抗力」——攻击侧的负结果就是防御侧的设计依据。
    - heading "§01 问题：隐蔽性与有效性的张力" [level=2] [ref=f230e25]:
      - generic [ref=f230e26]: §01
      - text: 问题：隐蔽性与有效性的张力
    - generic [ref=f230e27]: 触发信号越强模型越好学但人越容易听出来
    - paragraph [ref=f230e28]: 论文要同时满足四个互相牵制的目标：触发器让人耳「听不出」而非「听不懂」；不受采样率约束；同时命中纯 CNN（空间特征）和 LSTM 类（时序建模）；投毒率压到 1% 以下还维持约 90% 攻击成功率且良性准确率几乎不受影响。语音同时包含空间特征（个体声音组成）和时序特征（语音段关联）——超声脉冲只在局部时间窗注入扰动等于只攻击空间维度，时序维度留下大量干净信息供模型依赖，这就是它打不动 LSTM 的根源。
    - generic [ref=f230e29]:
      - generic [ref=f230e30]:
        - heading "「难懂但可闻」的触发器" [level=4] [ref=f230e31]
        - paragraph [ref=f230e32]: 现有方法注入的触发器人耳虽听不懂内容但能清晰区分「嵌了触发器」和「干净输入」——只要有人抽听训练数据或触发样本，攻击就极容易被发现：隐蔽性只做到「机器可学、人听不懂」，没做到「人听不出」。
      - generic [ref=f230e33]:
        - heading "超声路线的两个死穴" [level=4] [ref=f230e34]
        - paragraph [ref=f230e35]: 真正不可闻的超声脉冲要求采样率 >40kHz 否则攻击直接失效——真实语音产品绝大多数在 16kHz；且短超声脉冲对含 LSTM 的模型攻击困难——主流 KWS 架构普遍带时序建模层，正好卡在两个死穴上。
