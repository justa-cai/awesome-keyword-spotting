  - paragraph [ref=f230e113]: 为什么是 5 个半音：音高提升越高触发器越有效，但扰动原始声音越厉害——作者大量攻击实验 + 人耳测试后选定，最大化「攻击效果与声音自然度」的平衡并为高幅度信号提供隐蔽空间（经验定参，人耳测试数据矩阵未报告）。为什么 200ms 下限：掩蔽效应需要持续时间维持听阈抬升——掩蔽窗太短护不住后面的 20ms 信号。训练：BadNets 范式——p% 数据注入触发器 + 目标标签绑定；p 越大后门越牢但毒化样本越多越易被数据审核发现。
