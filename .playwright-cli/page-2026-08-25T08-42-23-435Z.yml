      - paragraph [ref=f230e248]: 高幅度信号在波形层是能量尖峰——信号级能量检测器未必受人耳局限约束；音高提升可被基频统计或音高归一化部分抹平。攻击在「人检」下隐蔽不等于在「机检」下隐蔽。
