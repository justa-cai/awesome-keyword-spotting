      - paragraph [ref=f230e251]: 16kHz 数据全频段上移 1.335 倍会把高频推过 8kHz 奈奎斯特——折叠/截断失真如何处理未报告；实验 40kHz 采样可能部分掩盖了问题，「不受采样率限制」在最常见的 16kHz 管线缺直接证据。
