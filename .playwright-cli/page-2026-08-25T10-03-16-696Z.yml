  - heading "§02 方法：三层互补保护网" [level=2] [ref=f240e125]:
    - generic [ref=f240e126]: §02
    - text: 方法：三层互补保护网
  - paragraph [ref=f240e127]: DAS 挑点 · MLDA 扩邻域 · KD 填间隙——同一个存储预算，保护密度翻几倍
  - generic [ref=f240e128]:
    - generic [ref=f240e129]: H(xᵢ) = −Σⱼ p(yⱼ|xᵢ) · log p(yⱼ|xᵢ)
    - generic [ref=f240e130]: 预测熵，衡量模型对样本的不确定度。分布接近 one-hot（模型笃定）→ 熵低；分布平坦（模型纠结）→ 熵高。DAS 按类别分组、组内熵降序，优先保留高熵样本——它们落在决策边界附近，是遗忘最先发生的位置。预算 m 在 C 个旧类间均分。
  - generic [ref=f240e131]:
    - generic [ref=f240e132]: L = CE_new + CE_replay + α · KL( p_old(y|x) ‖ p_new(y|x) )
    - generic [ref=f240e133]: 三部分各管一块：CE_new 学新词；CE_replay 在回放样本上复习旧类；KL 蒸馏项让新模型在全部旧样本分布上贴近教师（学新词前的模型快照）——回放只保护了保留样本的区域，软标签对未回放区域（类别中心）提供隐式兜底。
