  - heading "记住 5 个难的，胜过 20 个随机的： 把旧知识挑着存，增量学新唤醒词" [level=1] [ref=f240e4]: 记住 5 个难的，胜过 20 个随机的：把旧知识挑着存，增量学新唤醒词
  - generic [ref=f240e5]:
    - generic [ref=f240e6]: Rainbow Keywords
    - generic [ref=f240e7]: NTU Singapore · Interspeech 2022
    - generic [ref=f240e8]: arXiv 2203.16361
    - generic [ref=f240e9]: DAS 熵采样 + MLDA 增强 + KD 蒸馏
    - generic [ref=f240e10]: 无任务 ID · 零样本扩展输出层
    - generic [ref=f240e11]: GSC V2-35 · +4.2% vs 最佳基线（同预算）
  - generic [ref=f240e12]: 一句话：在线设备上持续学新唤醒词，存储只够存十几个旧样本——与其随机存一堆「典型」样本，不如用预测熵专挑决策边界上的「难样本」，再用 5–10 倍增强和蒸馏把它放大成一张三层保护网。场景：智能手表 / 耳机等存储预算以 KB 计的设备，用户随时注册新唤醒词。
  - generic [ref=f240e13]:
    - heading "一分钟版本" [level=3] [ref=f240e14]
    - listitem [ref=f240e15]: 任务：在线类增量学习（CIL）用于 KWS——设备端持续注册新词，不重训全局、不忘旧词。
    - listitem [ref=f240e16]: 约束：存储预算几十 KB（一条频谱 2–4KB）；每个新词只有 3–5 条注册语音；学习须实时在设备上完成。
    - listitem [ref=f240e17]: DAS：对旧样本算预测熵，按类分组、组内熵降序保留——专存「模型最不确定」的决策边界样本，那是遗忘最先发生的地方。
    - listitem [ref=f240e18]: MLDA：每个存储样本 × K=5–10 种增强（时间拉伸 / 频率时间掩蔽 / 增益 / 噪声）——100 条存储等效 1000 条训练集，存储效率虚拟翻 5–10 倍。
    - listitem [ref=f240e19]: KD：学新词前复制教师模型，KL 软标签约束覆盖回放没保护到的类别中心区域——第三层兜底。
    - listitem [ref=f240e20]: 协同：DAS 挑关键点 → MLDA 扩成邻域 → KD 填邻域间隙——三层网互补，组合效果 > 任意两件组合。
    - listitem [ref=f240e21]: 无任务 ID：统一动态扩展的 softmax 输出层，新词只加输出节点；推理 argmax 全类别，可同时监控全部已学词。
    - listitem [ref=f240e22]: 主结果：GSC V2-35（20 基础类 + 15 增量类、5 步），RK ≈ 88.5% 平均准确率，比最佳基线 iCaRL 高约 4.2 点，存储预算相同。
    - listitem [ref=f240e23]: 消融：去 DAS 掉约 4 点（最大）；去 MLDA / KD 各掉 1.5–2 点；采样策略排序 DAS > 遗忘感知 > 随机 > 类中心（Herding 最差）。
    - listitem [ref=f240e24]: 诚实边界：熵采样要对全部旧样本过一遍前向；熵质量依赖模型状态；增强手工设计；仅 GSC 一个数据集验证。
