    - text: 贡献：把「存什么」变成可计算的决策
  - paragraph [ref=f240e334]: 从随机 / 类中心采样，到显式优化「保护价值」的采样准则
  - generic [ref=f240e335]:
    - generic [ref=f240e336]:
      - generic [ref=f240e337]: "1"
      - paragraph [ref=f240e338]: 提出 RK 框架：DAS + MLDA + KD 三件套，专为 KWS 的低存储在线增量设计——同预算 +4.2 点，是「数据选择质量」而非「数据量」带来的提升。
    - generic [ref=f240e339]:
      - generic [ref=f240e340]: "2"
      - paragraph [ref=f240e341]: 把回放采样从启发式变成准则：用预测熵度量「遗忘脆弱度」，并实验证明熵采样 > 遗忘感知采样 > 随机 > 类中心（Herding）——「典型样本」的保护边际收益最低，反直觉但数据一致。
    - generic [ref=f240e342]:
      - generic [ref=f240e343]: "3"
      - paragraph [ref=f240e344]: MLDA 让存储预算虚拟翻倍：5–10 倍增强把每条存储样本展开成一个小邻域，等效训练集 ×K——在不增加一字节存储的前提下扩大回放覆盖。
    - generic [ref=f240e345]:
      - generic [ref=f240e346]: "4"
      - paragraph [ref=f240e347]: 协同效应有实证：三件组合（88.5）> 任意两件组合（85–87）；边界样本经增强产生更多边界附近变体，进一步放大 KD——组件之间是乘法不是加法。
    - generic [ref=f240e348]:
      - generic [ref=f240e349]: "5"
      - paragraph [ref=f240e350]: 无任务 ID 的部署形态：统一动态扩展输出层 + 全类别 argmax，直接对应「设备不知道用户接下来说哪个词」的真实约束。
