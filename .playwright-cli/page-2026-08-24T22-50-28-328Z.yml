      - generic [ref=f173e24]:
        - heading "一分钟版本" [level=2] [ref=f173e25]
        - list [ref=f173e26]:
          - listitem [ref=f173e27]: 产品需求已从「跑得多省」转到「改得多快」：用户想不等厂商发版就换自己的唤醒词——传统定制要在采集数据上训练深度模型，同时受制于服务器算力与录音量，必须离开设备回到云端。三重耦合约束：数据（用户只肯念几遍，5/10-shot）、算力（微控制器上反传基本不现实——定制只允许前向推理量级计算）、开集（绝大多数滑窗既不是任何用户关键词还常与关键词发音相近——闭集模型会把相似未知词全判成关键词，误唤醒直接摧毁体验）。
          - listitem [ref=f173e28]: 四类已有方法的硬伤：① 闭集评测占主流——Jung 等的 96% 来自「预训练后微调」（微调需反传与端侧冲突），且闭集指标完全不度量拒识能力；② DProto 训练测试同分布（系统性高估跨域）；PEELER 的方差估计网络额外 6.3M 参数（骨干 407K 的 15 倍包袱）；③ QbE 一线 LSTM 逐窗步进——估计比「1 秒大窗一次卷积」慢 10–100 倍；④ 文献高度碎片化——损失 / 归一化 / 分类器三条轴各自有支撑却从未统一对比。
          - listitem [ref=f173e29]: 本文形态：基准型工作：3 损失（PN/AP/TL）× 3 输出变体（CONV/RELU/NORM）× 3 开集分类器（openNCM/OpenMAX/DProto）全网格，统一数据管线（MSWC→GSC 跨集 + DEMAND 加噪）、统一训练预算（40 epoch × 400 episode）、统一操作点（FAR=5%）、双骨干（407K/22K）——把「我这种方法好」的叙事替换成「在这个协议下哪种组合好」。
          - listitem [ref=f173e30]: 最重要的实验发现（反直觉）：损失函数与输出归一化强交互，不能单独选型——PN 配 NORM 直接崩（5-shot 0.21）、配 RELU 最好（0.56）；TL 恰好相反，NORM 是最优点（0.71，比 RELU/CONV 高 4–5 点）。机制：归一化削掉幅度自由度后，hinge 的相对距离约束把全部优化压力挤压到方向维度——类间角度结构被锻打得更干净；而 PN 的原型是归一化向量的均值（范数 < 1），欧氏得分差被压缩、梯度拉不开角度。
          - listitem [ref=f173e31]: openNCM 的零参数开集：把闭集最近类均值扩成 N+1 维（未知类原型用目标域随机语音估计）——额外代价 = 多存一个向量 + Softmax 多一维。大模型上追平 PEELER（省 6.3M）与目标域端到端训练（省全部目标标注）：「最简单的基线在训练得当的嵌入上就够用」。
          - listitem [ref=f173e32]: 小模型排序反转（诚实读法）：DSCNN-S 上 PEELER 以 0.60 领先 TL 的 0.56（方差建模开始值回票价）、端到端领先 16 点（嵌入质量受容量制约时目标域监督边际收益变大）——小设备的最优选型与大设备不同，不能照搬；NORM 与 RELU 差距也缩小甚至反转。
          - listitem [ref=f173e33]: 结果：TL+NORM+openNCM 在 DSCNN-L 10-shot 10-way 达 0.76 准确率 / 0.94 AUROC（FAR=5%）；复现的 DProto 0.71 / 0.93（更严协议下比原文冷静）；分类式编码器 0.52 垫底——闭集训练的过度自信是开集的结构性缺陷，与模型大小无关。
          - listitem [ref=f173e34]: OpenMAX 的注册样本硬下限：5-shot 每类只有 5 个距离样本可喂 Weibull 拟合——统计建模先天不可靠（0.37 vs openNCM 0.71）；10-shot 才追平（0.71 vs 0.76）。统计型开集方法对注册样本量有硬下限——选型时容易踩的坑。
          - listitem [ref=f173e35]: 边界：76% 意味着固定 5% 误收下仍有约四分之一真关键词被误拒（闭集文献已到 96–97% 量级——开集 + 跨集把难度抬了一整个档次）；γ 阈值手工整定（免校准方案缺失）；未知类原型取 5 个固定类的代表性未消融；标题里的 On-Device 无设备实证（无延迟 / 内存 / 能耗实测，LSTM 慢 10–100 倍也是引用估计）；操作点整定与评测数据未显式分离（乐观偏置风险）；只测英语单一测试集；表 1 是 3 种子均值但不报方差。
