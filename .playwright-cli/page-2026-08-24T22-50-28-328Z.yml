      - heading "一个工程选型问题" [level=2] [ref=f173e38]
      - generic [ref=f173e40]: 选型问题的准确表述：在跨数据集（训练 MSWC、测试 GSC，目标类不在源类集合）、固定训练预算、固定误收操作点（未知类误收 5%）约束下，「编码器损失 × 输出归一化 × 开集分类器」组合空间里哪种搭配能用最少的参数、零额外模块拿到最高的已知类准确率。三个子挑战：协议必须同时覆盖 few-shot 与开集并跨数据集（否则还是闭集幻觉）；候选空间要完整（否则给不出指南只能给个案）；最优组合必须两档骨干都验证（避免只对大模型成立、落到耳机级就翻车）。
