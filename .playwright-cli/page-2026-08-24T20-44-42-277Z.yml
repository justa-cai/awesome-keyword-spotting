    - generic [ref=f131e263]:
      - paragraph [ref=f131e264]: §04 · 主要贡献
      - heading "四条贡献" [level=2] [ref=f131e265]
      - generic [ref=f131e267]:
        - generic [ref=f131e268]:
          - generic [ref=f131e269]: "1"
          - text: 第一个超低功耗传感器节点的个性化 KWS 自学习框架：部署后用目标环境无标注数据增量微调特征提取器，打破冻结特征封顶的精度上限；相对 few-shot SOTA 最高 +19.2%（HeySnips）/ +16.0%（HeySnapdragon），ResNet15 仅 3 条初始化即达 93.7% / 94.6%。
        - generic [ref=f131e270]:
          - generic [ref=f131e271]: "2"
          - text: 面向不定长连续音频的伪标签策略：滑窗取 min + 低通滤波 + 双阈值死区，全部参数（α、ThL、ThH）由设备端 6 条录音自动校准——免人工调参、免服务器，自学习闭环能在现场成立的前提。
        - generic [ref=f131e272]:
          - generic [ref=f131e273]: "3"
          - text: 首个完整系统级落地与能耗账：真实节点常开实时标注 6.1–8.2mW（睡眠模式 0.66–0.88mW、电池月级寿命）；首次给出设备端训练的时延 / 内存 / 能量估计，并给出「训练能耗 = 标注 / 10」的可采样间隔判据（6.1s–262s）。
        - generic [ref=f131e274]:
          - generic [ref=f131e275]: "4"
          - text: 两条方法学结论：triplet 软约束 + 锚定真例能在伪正例错误率高达 84% 的极端标签噪声下仍正收益；仅靠增强 3 个样本微调在该量级是负收益——无监督环境数据不可替代。
      - generic [ref=f131e276]: 可迁移的工程判断：当手里只有一个不准的分类器却要产训练数据时，出路不是清洗标签，而是选一个对标签错误天然鲁棒的损失结构（软约束 + 真例锚定）+ 一个把不确定样本挡在门外的置信筛选（死区）——前者保证错了也朝对的方向优化，后者控制进入训练集的噪声率。两者分别作用于「训练目标」与「数据入口」，缺一不可。
    - generic [ref=f131e277]:
      - paragraph [ref=f131e278]: §05 · 局限与边界
      - heading "单类、无早停、精度与系统实测解耦" [level=2] [ref=f131e279]
      - generic [ref=f131e281]:
        - generic [ref=f131e282]:
          - heading "技术局限" [level=4] [ref=f131e283]
          - list [ref=f131e284]:
            - listitem [ref=f131e285]: 只支持单新类：全按「单一唤醒词 + unknown」展开；多新类、类别递增的持续学习留作未来——多原型距离分布重叠会直接冲击双阈值死区的校准逻辑。
            - listitem [ref=f131e286]: 无验证集、无早停：固定 epoch 返回最后一组权重，无法防止对伪标签集过拟合——Fig 8 部分说话人自学习后精度反降（幅度通常 <10%）且与标签错误率不相关，论文承认无法解释。方法鲁棒性上最实在的一块阴影。
            - listitem [ref=f131e287]: 天花板由标注回路决定：整套方法取决于预训练模型在新域的判别力；域偏移更极端（远场、强噪声）时死区可能收窄到采不到伪正例——HeySnips-REC 已出现伪正例不足 10 条、训练不触发的说话人。
            - listitem [ref=f131e288]: ResNet15 性价比最差：1339s 时延 / 58.64MB 激活 / 86.8J 能量 / 262s 临界间隔，真实噪声集上精度还最低（57.4%）——大模型在本框架里最不划算。
        - generic [ref=f131e289]:
          - heading "实验设计不足" [level=4] [ref=f131e290]
          - list [ref=f131e291]:
            - listitem [ref=f131e292]: 精度与系统实测解耦（最大缺口）：学习实验全在服务器跑（算法一致），设备端只实测标注任务；训练时延 / 能耗是估算（PULPTrainLib 例程 + 8 核半精度假设），端到端「在节点上完成训练并刷新模型」的闭环演示未报告。
            - listitem [ref=f131e293]: 自采集太小：HeySnips-REC 负样本仅 11.6 分钟只能报 FAR=0；回放-录音管线引入扬声器与房间信道畸变；单房间、单麦克风型号、单回放音量，泛化证据薄弱。
            - listitem [ref=f131e294]: 对比面偏窄：未与 dummy prototype / 余弦原型等同代方法直接对比；augment 在 HeySnapdragon 上 ResNet15 达 99.2% 反超 self 的 94.6%，论文仅以「平均更稳」带过，未深挖两者互补的条件边界。
            - listitem [ref=f131e295]: 假设未披露：电池月级寿命的电池容量假设、10% 声学活动率估算均未报告；K=3 条负例估计 distn 方差很大（负例空间本身是开集），阈值对负例选择顺序的敏感性未验证。
      - generic [ref=f131e296]: 值得补的方向：多类与持续学习扩展（新类随时间加入、原型集动态增长，需解决多原型死区校准与旧类灾难遗忘）；部分层微调 / 稀疏更新 / 偏置级适应与自学习闭环正交可叠加（直接缓解 ResNet15 的 262s 间隔）；标签质量的自适应控制（置信度加权 triplet、在线重校准阈值、高噪声域主动拒识——把死区从静态参数变成随域漂移动态调整的量）；训练触发事件驱动化（凑满 NpB 即触发、多次小步替代一次大训练，更贴合流式到达）；更宽部署面验证与训练闭环端到端实测。代码开源于 github.com/mrusci/ondevice-learning-kws，自采数据开源于 KU Leuven RDR。
