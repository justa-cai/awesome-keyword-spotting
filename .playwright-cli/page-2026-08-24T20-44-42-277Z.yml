      - generic [ref=f131e129]: 数据与协议：预训练 MSWC 500 类 2.7M 样本。评测：HeySnips（自适应集 5347 正 + 31830 负；测试 20 说话人）与 HeySnapdragon（自适应集仅 462 正 + 31830 负）——协议为 FAR=0.5 次/小时工作点的逐说话人平均准确率（唤醒词产品的真实工况由误报率定义，精度必须在固定误报约束下比较）；自采 HeySnips-REC（扬声器回放 + 办公室实录，含混响与非平稳噪声）负样本仅 11.6 分钟，退而报 FAR=0 工作点。四个模型：DS-CNN-S/M/L（21K/132K/407K 参数）+ ResNet15（482K）。对比对象：pretrained（冻结特征 + 原型 = few-shot SOTA）、self（本文）、augment（增强微调基线）、oracle（全部真实标签上界）。
