      - generic [ref=f131e24]:
        - heading "一分钟版本" [level=2] [ref=f131e25]
        - list [ref=f131e26]:
          - listitem [ref=f131e27]: 两个刚性痛点：「训练一次、到处部署」范式下，用户想加自己的唤醒词 / 适配自己口音和环境，只能传服务器-人工标注-重训-重烧录，成本延迟隐私都不可接受；且部署分布 ≠ 训练分布——作者用扬声器在办公室回放公开数据集实录（HeySnips-REC），预训练 DS-CNN-L 从干净集 84.4% 掉到 60%。
          - listitem [ref=f131e28]: 个性化 KWS 的结构性天花板：few-shot 路线（嵌入 + 原型 + 距离判类）天然支持开集，但特征提取器是冻结的——通用语料学的度量空间对特定用户 / 环境不是最优（ResNet15 10-shot 仅 ~80%）。要突破就必须在设备端、部署后、无标签条件下微调特征提取器本身——这就是标题里 self-learning 的确切含义。
          - listitem [ref=f131e29]: 三阶段闭环：① 校准——用户录 3 正 3 负，设备自动导出原型 cp、双阈值 ThL/ThH、滤波长度 α（零调参零服务器）；② 常开标注——1s 窗 / 0.125s 步长滑窗，距离序列低通滤波取 min，双阈值死区筛选伪正例 / 伪负例，中间地带弃用（把检测器改造成数据收割器）；③ 训练——攒够伪正例触发，triplet 微调特征提取器 + 每个 batch 锚定用户 3 条真例，训完重算原型（特征面和分类面一起动）。
          - listitem [ref=f131e30]: 为什么不会被伪标签毒死（最关键设计）：triplet 是软约束——只要求同类近 + 间隔 < 异类距离，不要求样本真是正例；错标样本仍可被拉近用户真例、推远伪负例来纠正位置。实证：HeySnapdragon 伪正例错误率 48%–84%，微调后准确率仍大涨（ResNet15 82.6→94.6%）。
          - listitem [ref=f131e31]: 结果：FAR=0.5/h 工作点、3 样本初始化——HeySnips 最高 +19.2%（DS-CNN-S 62.5→81.6），HeySnapdragon 最高 +16.1%；真实环境 HeySnips-REC 上 DS-CNN-L 60→73.4。跨说话人标准差同步收窄——不仅提精度还提稳定性。
          - listitem [ref=f131e32]: 最强的对照论据：augment 基线（DEMAND 增强 3 个样本微调）在 HeySnips 上全线负收益（ResNet15 −15.6%）——与其在 3 个样本上做同分布增强，不如去无监督收割环境真实数据，多样性和数量由环境免费提供。
          - listitem [ref=f131e33]: 能耗账算平了：常开标注 6.1–8.2mW（占空比 4–12%），睡眠模式 0.66–0.88mW（电池月级）；单次全参数训练 DS-CNN-S 仅 20.6s / 1.5J；「训练能耗 = 标注 / 10」的临界采样间隔 6.1s（DS-CNN-S）到 262s（ResNet15）——中小模型可密集收割，ResNet15 性价比最差。
          - listitem [ref=f131e34]: 边界：只支持单新类；训练无验证集无早停（部分说话人自学习后反降且论文承认无法解释）；天花板由预训练模型在新域的判别力决定——域偏移更极端时死区可能收窄到采不到伪正例（HeySnips-REC 已出现训练不触发的说话人）。
    - generic [ref=f131e35]:
      - paragraph [ref=f131e36]: §01 · 问题陈述
      - heading "冻结的特征提取器，封死了 few-shot 个性化的上限" [level=2] [ref=f131e37]
      - generic [ref=f131e39]: 为什么必须「部署后自己学」：唤醒词检测跑在电池供电的超低功耗 MCU 上全天候监听。工业范式「训练一次、到处部署」暴露两个刚性痛点：① 个性化缺失——加自定义唤醒词 / 适配口音环境的唯一途径是服务器回传-标注-重训-重烧录；② 分布不一致——办公室实录实验直接证明预训练模型从 84.4% 掉到 60%。个性化 few-shot 路线（特征提取器 + 原型 + 距离判类，天然开集）绕开了服务器，但特征提取器冻结：通用度量空间对特定用户 / 环境不是最优，10-shot 场景 ResNet15 只有约 80%——突破上限必须在设备端、部署后、无标签条件下微调特征提取器本身。
      - generic [ref=f131e40]: 三族相关工作各自的缺口： ① few-shot 个性化族（ProtoNet / 余弦原型 / dummy 原型开集）：特征冻结封顶精度；评测全用 GSC 这类已切好 1 秒定长的数据集，回避了真实音频不定长、关键词起止未知的问题；自家前作 IEEE Micro（~20mW few-shot 推理）同样只吃 1s 定长、开集只测 5 个未知类、不支持训练。 ② 自学习 / 伪标签族：Noisy Student-Teacher 靠 250 万语料的强教师产出高质量伪标签（错误率 1.83%→0.78%）——本文只有 3 条录音初始化的距离规则，伪标签质量天差地别；TinyTrain 需 30 个标注样本（本文只有 3），数据增强只能在几个样本上做同分布变换，无法扩分布多样性。 ③ 设备端训练族：TinyOL / TinyTL / 稀疏更新都在压反向传播内存，但都假设新数据带真实标签，不解决标签从哪来；此前唯一的个性化 KWS 硬件原型整机 100mW，比本文预算高一个数量级。
      - generic [ref=f131e41]: 四个具体挑战：伪标签从哪来、错了怎么办（预训练分类器本身只有 62.5%，自学习经典误差累积回路在 few-shot 下被急剧放大）；不定长音频如何打标签（需要一个从滑窗序列提炼单值判决 + 挡住不确定样本的机制）；训练能不能塞进 MCU（0.5M 参数卷积网络的反向传播激活远超 1.5MB 片上 RAM）；能耗账能不能算平（标注常开 + 训练偶发，必须落在电池预算内——这决定自学习传感器是真实产品还是论文演示）。
