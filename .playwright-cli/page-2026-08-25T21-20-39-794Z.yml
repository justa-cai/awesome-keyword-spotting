      - generic [ref=f34e240]:
        - generic [ref=f34e241]: "1"
        - paragraph [ref=f34e242]: 「先养再压」的顺序是精度的保命符。二值化在养好的紧凑网络上近无损（<0.25%），但在刚剪完的网络上直接上会掉更多——极端量化放大的是「网络当前的脆弱度」，先把精度养回来再压位宽，顺序不能反。
      - generic [ref=f34e243]:
        - generic [ref=f34e244]: "2"
        - paragraph [ref=f34e245]: 加速的正交性账本值得记住。剪枝作用在 MAC 总数（2×）、二值化作用在单个 MAC 成本（2×）——相乘 4×；维度不重叠所以不互相蚕食，这是「压缩手段可以叠加」的数学根据。
      - generic [ref=f34e246]:
        - generic [ref=f34e247]: "3"
        - paragraph [ref=f34e248]: 标准 TF 函数拿到 2× 意味着落地门槛极低。不需要 XNOR 专用加速器、不需要定制算子——手机上的标准推理框架直接受益；专用硬件（FPGA/NPU）的余量是后续空间。
