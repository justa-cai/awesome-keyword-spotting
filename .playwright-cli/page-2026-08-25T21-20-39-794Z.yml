    - generic [ref=f34e154]:
      - generic [ref=f34e155]: "RGSM: L_β(u,w) = ℓ(w) + μP(u) + (β/2)‖w−u‖² ← 交替优化 u / w u-更新: u_g = max(0, 1 − λ/‖w_g‖)·w_g ← 近端算子: 小组整组置零 w-更新: w ← w − η∇L_β ← 标准 SGD 二值化: w ≈ α·sign(w) ∈ R₊×{±1}^D ← 卷积 → XNOR + popcount"
      - generic [ref=f34e156]: 人话：先把网络「按通道分小组」体检——贡献小的组整组辞退（剪枝）；剩下的人重新培训补上损失（重训练）；最后把每个人的工资卡压成只有正负一块钱两种（二值化），乘法变成比大小。三步各有专职，跳过哪步都有实测代价。
    - paragraph [ref=f34e157]: 通道级稀疏的结构优势：剪出来的还是「更窄的稠密网络」——通用 CPU 直接受益，不需要稀疏矩阵硬件；这与非结构化剪枝的「纸面稀疏、落地不加速」形成对照。
