      - generic [ref=f34e299]: ↳ 位宽（量化/二值化）、结构（通道剪枝）、容量（蒸馏）作用于不同维度——正交所以收益相乘；但每加一维就多一遍训练与一套超参，「维度收益 × 流程成本」要一起核算，不是叠加越多越好。
      - paragraph [ref=f34e300]: ② 极端量化放大网络当前的脆弱度——先恢复再压缩。
      - generic [ref=f34e301]: ↳ 剪枝后立刻二值化 = 在受伤的网络上做激进手术；Stage II 的精度恢复是 Stage III 近无损的前提——顺序化流水线（动结构 → 养精度 → 压位宽）是压缩工程的可复用模板。
      - paragraph [ref=f34e302]: ③ 落地门槛低的方案优先于理论上限高的方案。
      - generic [ref=f34e303]: ↳ 标准 TF 函数拿 2× vs 专用硬件理论拿 10×——前者今天就能上线、后者要等硬件生态；本文选择先兑现低门槛收益、把硬件优化留作余量，这个优先级对工程团队更实用。
