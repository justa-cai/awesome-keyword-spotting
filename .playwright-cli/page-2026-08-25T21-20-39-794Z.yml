    - heading "机制：整组置零与三步的必要性" [level=2] [ref=f34e84]
    - paragraph [ref=f34e85]: RGSM 的巧劲在把「加惩罚项的联合优化」拆成交替的两半：辅助变量 u 只管 Group Lasso（用近端算子把小范数的通道组整组压零），原权重 w 只管交叉熵（标准 SGD）——两者通过增广项 β/2‖w−u‖² 拉在一起。直接把 GL 惩罚加进损失在 KWS 的 CNN 上压不出稀疏（惩罚与损失打架），RGSM 才是能收敛的那条路，且有收敛性定理背书。
