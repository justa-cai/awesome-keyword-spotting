  - generic [ref=f34e13]:
    - generic [ref=f34e14]: "01"
    - heading "问题：单一压缩各有天花板" [level=2] [ref=f34e15]
    - generic [ref=f34e16]:
      - generic [ref=f34e17]: TL;DR
      - list [ref=f34e18]:
        - listitem [ref=f34e19]: ◆ always-on 的 KWS 对轻量化要求极高：非结构化剪枝要稀疏硬件（通用 CPU 不加速）、INT8 在极端受限场景压缩比不够、二值化单独上精度崩。
        - listitem [ref=f34e20]: ◆ 本文的洞察：通道剪枝（少算）与权重二值化（省存快算）作用在两个正交维度——组合是「双重压缩」，但怎么排顺序、怎么保精度，此前缺系统研究。
        - listitem [ref=f34e21]: ◆ 三阶段流水线：Stage I RGSM + Group Lasso 训练后整组剪掉小范数通道；Stage II 结构冻结、全精度重训练恢复精度；Stage III w ≈ α·sign(w) 二值化微调。
        - listitem [ref=f34e22]: ◆ 实测拿到 >50% 通道稀疏 + <0.25% 精度损失；仅二值化在 Galaxy J7 上就 ~2×（标准 TF 函数），叠加剪枝 ~4×。
