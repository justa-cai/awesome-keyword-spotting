      - generic [ref=f141e24]:
        - heading "一分钟版本" [level=2] [ref=f141e25]
        - list [ref=f141e26]:
          - listitem [ref=f141e27]: 痛点：常驻系统的结构性浪费。唤醒词系统是每时每刻都在耗算力的守夜人——误报、召回、计算负担三角张力尖锐。Transducer 性能好但自回归解码计算密集；更结构性的是所有已有 Transducer KWS 都「直接跑 ASR 解码再检查输出里有没有关键词」：搜索空间不加约束（概率质量与算力分配给无关 token 路径）、自回归假设递归推高解码成本、帧同步决策让静音段也逐帧付账——为一个几秒出现一次的词支付逐帧全量搜索代价。
          - listitem [ref=f141e28]: 核心算法（对 RNN-T 与 TDT 通用）三个咬合设计：① 预测器只吃关键词 token 序列（teacher forcing 式）——每帧 DP 开销与关键词长度 U 同阶、与词表大小无关；② δ(t,0)=1——每个 t 都允许「关键词从这帧重新开始」的假设免费入场，DP 自动维护任意起点最优路径（流式唤醒最微妙的起始点问题被一行解决）；③ TDT 分支时长引导跳帧——每步 d=argmax P_D，跳过的帧不产生置信度也不触发搜索。
          - listitem [ref=f141e29]: 收益第一来源是搜索不是模型（Table 2 硬证据）：同一 RNN-T 模型，贪心→本文算法在 test-other 上 57.6→88.1（+30.5 点）、束搜索 60.0→88.1；TDT 上 63.2→87.9。越难的集，锁死搜索空间的收益越大。
          - listitem [ref=f141e30]: TDT 首次进 KWS：joiner 输出升级为 P(v,d|t,u)=P_T(v)·P_D(d)（条件独立，时长头仅 0.1% 参数）——一次跨多帧，模型调用次数随 Dmax 下降。召回持平或更好（Snips 98.6 vs 基线 98.1；test-other Dmax=4 的 91.9 还超基线 90.2）的前提下，搜索加速 1.4–4.2×、系统级 1.4–3.6×。
          - listitem [ref=f141e31]: Dmax 甜点由任务难度决定（最有信息量的消融）：Snips（静音+一个短语，模式简单）对大 Dmax 不敏感；LibriKWS-20 甜点在 4–6——适度跳帧意外成为「聚焦关键帧」的正则化，跳过头则漏 token 退化；加速边际递减（静音段长度有上限，无帧可跳）。
          - listitem [ref=f141e32]: 噪声鲁棒：WHAM! 加噪不重训——噪声越大 TDT 相对 RNN-T 优势越大，且各 SNR 下加速保持。机理（笔者推测）：帧同步在噪声下逐帧决策错误累积，TDT 时长机制在时间维聚合证据、跳过不确定帧。
          - listitem [ref=f141e33]: 边界：条件独立假设未做对照实验；置信度未长度归一化（不同长度关键词不宜共用阈值，论文靠固定 FAR 宏平均回避）；跳帧依赖贪心历史不可回溯（大 Dmax 退化的直接体现）；TDT 侧缺束搜索对照；加速只有相对倍数（无硬件、绝对 RTF、功耗）；LibriKWS-20 是自建仿真且误报集仅 ~3 小时（FAR=0.67/h 对应 2 次误报，统计置信度有限）。
    - generic [ref=f141e34]:
      - paragraph [ref=f141e35]: §01 · 问题陈述
      - heading "架构层面已有共识，问题出在解码与搜索层面" [level=2] [ref=f141e36]
      - generic [ref=f141e38]: 三层不足拆解：① 搜索空间不加约束——ASR 解码在整个词表空间搜索完整假设，而 KWS 只关心固定关键词在与不在，把概率质量与算力分配给无关路径「既不有效也不高效」（RNN-T 贪心在 Snips 宏召回只有 79.7、束 10 也只 89.4，约束到关键词后 98.7）；② 自回归依赖推高成本——预测器被递归喂部分假设，每个假设 token 都要更新预测器状态再做 joiner 计算，解码计算量随假设长度增长；③ 帧同步决策本身是浪费——每帧都必须做一次搜索决策（步长 d≡1），哪怕纯属静音。
      - generic [ref=f141e39]: 为什么是 TDT：Token-and-Duration Transducer（ICML 2023，同团队前作）联合预测 token 及其时长，在序列建模上同时拿到更好性能与显著加速——KWS 音频里绝大多数帧与关键词无关，恰是时长引导跳帧最能发挥的场景。但 TDT 的默认搜索同样为 ASR 设计、不考虑 KWS 特性，直接搬来照样不行——本文填补的空白：TDT 的潜力需要 KWS 专用解码算法才能释放。三个环环相扣的问题：KWS 专用流式解码（约束搜索空间 + 任意时刻起始）；时长预测换真实可测加速而非纸面理论值；加速不以鲁棒性为代价。
