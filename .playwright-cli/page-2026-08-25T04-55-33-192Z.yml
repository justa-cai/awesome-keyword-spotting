    - paragraph [ref=f199e269]: 图3 · 三骨干全景（5-shot AUROC）：越弱的骨干哑类优势越大——Conv4-64 上 SnaTCHer 崩（51.1/53.1）而哑类 +10.6/+10.1；BCResNet-8 上最大增益 +14.8/+13.5（代价：Acc 让位，需 RFN 托底）。
  - paragraph [ref=f199e270]: miniImageNet 跨域验证：D-ProtoNet L=3 达 AUROC 70.2/77.8，超过自跑 SnaTCHer-F（69.4/76.4）；与 FEAT 组合（正交可叠加）进一步到 70.6/78.5。但 1-shot Acc 只有 63.4，落后 FEAT（67.1）/SnaTCHer（67.4）约 4 个点——set-to-set 变换能利用支持样本之间的关系，极低样本区间更鲁棒；D-ProtoNet 不做原型变换，把容量花在开集上。5-shot 时差距基本消失。开集分数「距离 vs 概率」两条路线各有失效域：与 FEAT 组合时未归一化距离反而更好，SnaTCHer 的距离法在弱骨干上崩——哑类机制的好处是对分数选择不敏感。
