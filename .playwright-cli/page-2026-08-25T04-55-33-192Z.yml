      - generic [ref=f199e267]: 两个读数：① Conv4-64 弱骨干上 SnaTCHer（51.1/53.1）反而不如什么都不做的 ProtoNet（55.3/63.8）——依赖嵌入质量的间接机制在弱表征下崩；哑类显式监督稳（+10.6/+10.1）
