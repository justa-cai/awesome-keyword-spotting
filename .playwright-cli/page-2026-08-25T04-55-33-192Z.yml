    - generic [ref=f199e4]: 论文精读 · 可视化版 · 2022 №13
    - heading "注册五条发音就能换唤醒词， 还得拒绝其余整个世界" [level=1] [ref=f199e5]: 注册五条发音就能换唤醒词，还得拒绝其余整个世界
    - generic [ref=f199e6]:
      - generic [ref=f199e7]: D-ProtoNet · arXiv 2206.13691
      - generic [ref=f199e8]: Qualcomm AI Research
      - generic [ref=f199e9]: 少样本开集 KWS（首个设定）
      - generic [ref=f199e10]: splitGSC 基准 · 三骨干验证
    - generic [ref=f199e11]: 哑原型不是训练后固定的参数，而是每个回合从当前 N 个已知类原型现场生成的一个嵌入点——开集检测被改写成 N+1 类分类，推理开销接近零。
    - generic [ref=f199e12]:
      - heading "一分钟版本" [level=3] [ref=f199e13]
      - list [ref=f199e14]:
        - listitem [ref=f199e15]: ▸ 新设定 FSOS-KWS：用户/OEM 注册 M 条发音即插即用（少样本），同时拒绝所有不属于注册词的开集发音（噪声/闲聊/电视/相近词）——第一篇提出该设定的工作。
        - listitem [ref=f199e16]: ▸ 本质难点：开集随回合漂移——N 个已知类每个回合临时抽，「开集 = 剩下的一切」（含 Silence），拒绝边界必须从本回合支持样本即时推断；固定哑类（Proser）或静态 Unknown 类都无从适配。
        - listitem [ref=f199e17]: ▸ SnaTCHer 的两宗罪：每个查询都要过 Transformer（端侧常驻监听硬伤）；弱骨干上距离法直接崩（Conv4-64 AUROC 51.1/53.1，不如什么都不做的 ProtoNet 55.3/63.8）。
        - listitem [ref=f199e18]: ▸ 核心机制：哑原型生成器 gϕ（DeepSets：FC → 沿类维 Maxpool → 投影，隐藏维仅 32）从本回合原型集现场合成哑类中心，与真原型同空间同度量进入同一个 softmax 分母。
        - listitem [ref=f199e19]: ▸ 非对称温度 γ=3：哑类是单个点却要替 5 个未知类的并集兜底——开集查询到单点的平均距离系统性偏大，温度=1 时哑类概率永远上不去，梯度会逼编码器扭曲整个嵌入空间；放大 τ 把哑类那一路压平「更容易降低损失」。
        - listitem [ref=f199e20]: ▸ 双路损失 λ=0.1：已知与开集查询数量相当，等权会让哑类监督占掉一半分类头容量——0.1 宣示「闭集少样本精度是主任务不容侵蚀」。
        - listitem [ref=f199e21]: ▸ 主结果：ResNet-12 上 5-shot AUROC 86.7（对 SnaTCHer-F +3.4、对 ProtoNet +18.3），Acc 86.9 反而最高；弱骨干 Conv4-64 上优势更大（+10.6/+10.1）；KWS 骨干 BCResNet-8 上 +14.8/+13.5。
        - listitem [ref=f199e22]: ▸ 消融大头：裸加哑类训练（γ=1）就 +14.3（Acc 几乎不动）——「给开集一个显式类表征」这一个动作解释了总增益的绝大部分，温度/Gumbel/L 都是精修。
        - listitem [ref=f199e23]: ▸ RFN 意外发现：频率轴实例归一化（抹掉说话人音色/信道色差）对全骨干一致有效，还把哑类在 BCResNet-8 上欠的闭集精度账还了（65.2→69.7）。
        - listitem [ref=f199e24]: ▸ 边界：1-shot 闭集精度让位（miniImageNet 63.4 vs SnaTCHer 67.4）；点状哑类逼近多模态开集有天花板（L=3 饱和）；开集全来自同一词表——更像 held-out 类检测。
    - heading "§01 问题：换词的自由与拒绝的义务" [level=2] [ref=f199e25]:
      - generic [ref=f199e26]: §01
      - text: 问题：换词的自由与拒绝的义务
    - generic [ref=f199e27]: 唤醒词是产品决策变量，为每个新词重跑管线是成本黑洞
    - paragraph [ref=f199e28]: 过去 KWS 研究全建立在 GSC 固定词表闭集分类范式上——词表训练时冻结。产品侧正在松动：不同地区、品牌、技能都想换词。query-by-example 路线让注册 M 条发音即可识别新词，但真实音频流补上残酷的另一半：绝大多数音频不是任何注册词，而 DNN 是过度自信的——面对没有支持样本的未预期类别，模型会以高置信度硬塞进 N 个已知类之一。对唤醒词系统，误唤醒直接打击用户信任还搭上后续链路上电的功耗。
    - generic [ref=f199e29]:
      - generic [ref=f199e30]:
        - heading "闭集方案的 Unknown 类失效" [level=4] [ref=f199e31]
        - paragraph [ref=f199e32]: 传统 GSC 12 类把剩余 25 个词打包成 Unknown 类——本质是把开集重包装成闭集，前提是「未知」能被训练时剩余词表穷举。少样本场景 N 类每回合临时抽，静态 Unknown 类完全对不上。
      - generic [ref=f199e33]:
        - heading "视觉 FSOSR 方法各有硬伤" [level=4] [ref=f199e34]
        - paragraph [ref=f199e35]: PEELER 用熵最大化间接压低已知类概率——没有显式未知类表征可校准；SnaTCHer 是当时的 SOTA 但每个查询都要过 Transformer；Proser 的哑分类器训练后固定——只适用于标签空间固定的传统 OSR，开集随回合漂移时无从适配。
