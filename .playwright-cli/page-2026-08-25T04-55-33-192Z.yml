    - text: 局限与边界
  - generic [ref=f199e335]: 机会成本曲线在 1-shot 处最陡
  - generic [ref=f199e336]:
    - generic [ref=f199e337]:
      - heading "1-shot 闭集精度让位" [level=4] [ref=f199e338]
      - paragraph [ref=f199e339]: miniImageNet 1-shot Acc 63.4 落后 FEAT/SnaTCHer 约 4 个点——支持集只有 5 个点时哑类监督分走的容量无从补偿；「开集检测 vs 极端低样本分类」存在明确的机会成本曲线，5-shot 后才追平。
    - generic [ref=f199e340]:
      - heading "点状哑类的天花板" [level=4] [ref=f199e341]
      - paragraph [ref=f199e342]: splitGSC 开集是 25 词 + Silence 的有限组合，L=3 饱和；真实开集是「全部人类语音」，模态数远超 3——分布化哑类（高斯）或自动聚类多哑结构是理论上的更自然做法，未验证。
    - generic [ref=f199e343]:
      - heading "开集来源单一且同分布" [level=4] [ref=f199e344]
      - paragraph [ref=f199e345]: 未知类全来自同一词表剩余词——更像「闭集词的 held-out 类检测」；对话语音、媒体音频、跨语种的真实开集，类间差距和类内多样性都大得多。episode 级 AUROC 之外缺流式误报率（每小时误唤醒）等操作点指标。
    - generic [ref=f199e346]:
      - heading "旋钮多 + 开销未量化" [level=4] [ref=f199e347]
      - paragraph [ref=f199e348]: γ/λ/L/退火/δ 五个旋钮只消融了 γ 和 L；阈值 δ 按误报预算标定的流程没给；挂 Qualcomm 名头的端侧工作却无 FLOPs/时延/功耗数字。BCResNet-8（最贴部署的骨干）上没跑 FEAT/PEELER/SnaTCHer 对照。
  - generic [ref=f199e349]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f199e350]
    - list [ref=f199e351]:
      - listitem [ref=f199e352]: ↳ 拒绝边界必须从本回合的已知类推断——开集的定义随任务实例漂移时，任何静态学出来的「未知类」都会失效。
      - listitem [ref=f199e353]: ↳ 把异常检测改写成 N+1 类分类：检测器就是分类器本身，机制直接、可校准、阈值只有一个——比间接评分路线（熵/一致性）在弱表征下稳健得多。
      - listitem [ref=f199e354]: ↳ 单个辅助类替多个类的并集兜底时，要给它更宽的温度（更宽容的决策地盘），否则梯度会去扭曲主表征空间来迁就损失。
      - listitem [ref=f199e355]: ↳ 辅助任务的损失权重压到 0.1 是显式的优先级声明：附加能力不许侵蚀主任务——并配一个守门指标（Acc）持续监控。
      - listitem [ref=f199e356]: ↳ 少样本场景最大的捷径风险是实例伪差异（说话人音色/信道色差）——支持样本越少，模型越省力地抓住伪相关；输入级的实例归一化是低成本解药。
