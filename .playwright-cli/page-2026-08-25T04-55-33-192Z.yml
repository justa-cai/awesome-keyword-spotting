  - generic [ref=f199e124]:
    - generic [ref=f199e125]: "c_d = gϕ(C) = Maxpool(g₁(C)) · W_g ； p(y=n|x) = softmax(−d(f(x), c_n)/τ_n)，τ_{N+1} = γ·τ_n（γ=3）"
    - generic [ref=f199e126]: 人话：N 个原型按行堆叠 → 每个原型过同样的 FC 变换 → 沿类维做 Maxpool（对称函数 → 置换不变，打乱类顺序不改变结果）→ 投影回嵌入空间。Maxpool 的语义：每个隐藏维只保留「所有已知类中最显著的那个值」——哑原型学到的是已知类的包络而非平均，包络之外才是开集该占的地方。
  - paragraph [ref=f199e127]: 为什么选 ProtoNets 作基座：类表征就是嵌入空间里的一个原型点——这给「再添加一个哑类中心」留下天然接口，开集检测复用整套分类机制，不需要额外二分类头或重打分管线。**为什么推理近零开销**：哑原型每回合只生成一次（生成器是隐藏维 32 的两层 FC），每个查询只多算 L=3 次欧氏距离。
