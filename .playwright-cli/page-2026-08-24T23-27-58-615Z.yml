    - generic [ref=f181e243]:
      - paragraph [ref=f181e244]: §04 · 主要贡献
      - heading "四条贡献" [level=2] [ref=f181e245]
      - generic [ref=f181e247]:
        - generic [ref=f181e248]:
          - generic [ref=f181e249]: "1"
          - text: 第一个流式 conformer 装进视觉式 KWS 管线：1.2s 窗 / 240ms 滑移 / 960ms 缓存 / 四倍子采样——内存与延迟双上界受控下把全局注意力带进检测定位，增益集中在最关乎部署的误警侧（FAR 0.314→0.146）。
        - generic [ref=f181e250]:
          - generic [ref=f181e251]: "2"
          - text: I3D 扩展到 conformer 四模块 + 流式 KWS 多任务：Gumbel-Softmax + 开启率正则 + 先预训练后开门三个工程问题配套解决；门参数开销趋近于零（~1k）。
        - generic [ref=f181e252]:
          - generic [ref=f181e253]: "3"
          - text: 三档跳过率量化输入条件化计算：30% / 42% / 97%——纯噪声段 97% 把隐性浪费变成可砍的显式成本。
        - generic [ref=f181e254]:
          - generic [ref=f181e255]: ★
          - text: 容量对等对照的方法论贡献：Ours-S 对照组把「动态跳过」与「静态缩小」放同一杆秤——跳过优于缩小的结论对后续端侧高效推理有参考价值。
      - generic [ref=f181e256]: 可迁移判断：省算力有两条路——均匀缩小（所有输入一起变差）vs 输入条件化跳过（简单输入走浅路径，难输入保留完整深度）；在输入分布高度倾斜（常开检测器绝大部分时间是非语音）的场景后者严格更优，且验证它的正确姿势是容量对等对照而非只报平均计算量；配套判断：全局注意力的价值常常不在「多抓住」而在「学会拒绝」——误警侧的收益对常开系统比召回侧更值钱。
    - generic [ref=f181e257]:
      - paragraph [ref=f181e258]: §05 · 局限与边界
      - heading "不减内存不降延迟，97% 跳过率兑多少电池时间未实测" [level=2] [ref=f181e259]
      - generic [ref=f181e261]:
        - generic [ref=f181e262]:
          - heading "技术局限" [level=4] [ref=f181e263]
          - list [ref=f181e264]:
            - listitem [ref=f181e265]: 论文自认的两条硬边界：跳过不减少需加载的模型体积（内存不变）、不明显改善感知延迟——收益仅平均计算量与功耗。
            - listitem [ref=f181e266]: 门决策是窗口级：输入取时间平均——同 1.2s 窗内所有帧共享同一开闭决策，无法窗口内部更细的条件计算；短命令埋在长噪声里只能整体决策。
            - listitem [ref=f181e267]: 工作点固定：β=0.5、λ=1 固定——无法运行时切「省电 / 全精度」档，比宽度可裁剪网络灵活性低。
            - listitem [ref=f181e268]: 精度非零代价：MTWV 门控后降 3–6 点、GSC IOU 降 6 点——「维持同等性能」的结论在检索与定位指标上要打折扣。
            - listitem [ref=f181e269]: 停留跳过率层面：无绝对 MACs / 实测延迟 / 实测功耗 / 每焦耳检测数——「可观的功耗节省」只是机制推断。
        - generic [ref=f181e270]:
          - heading "实验设计不足" [level=4] [ref=f181e271]
          - list [ref=f181e272]:
            - listitem [ref=f181e273]: 对比面窄：基线只有复现的 BC-ResNet 一个——无 cFSMN / DS-TCN / MatchboxNet 等流式编码器、无其它早退 / 动态计算方案、无与文献[12]原报告数字并排核对。
            - listitem [ref=f181e274]: 噪声条件单一：只有嘈杂人声一种、SNR 10–40dB 一个区间——远场 / 混响 / 多说话人重叠 / 音乐背景全部缺席。
            - listitem [ref=f181e275]: 消融缺失：门位置、λ、β、预训练轮数、窗长、子采样倍率全无扫描；无多随机种子方差。
            - listitem [ref=f181e276]: MTWV 外推谨慎：只在 20 个关键词上计算——1000 词词表下的检索性能外推需谨慎；测试集规模与噪声以外失真类型未报。
      - generic [ref=f181e277]: 值得补的方向：门细化到帧级 / token 级（带时间权重池化或学习查询向量——短命令触发局部加深，有望修复 GSC 定位 IOU 退化）；运行时预算控制（λ 换成推理期约束 / 目标跳过率下受限解码——电量充足与紧张间切换工作点，做成多档省电模式）；与量化蒸馏叠加（门控减动态计算不减内存、量化减内存不动结构——正交组合收益空间大）；能量维度实测（真实终端芯片测每秒功耗与检测延迟——97% 跳过率兑多少电池时间，「适合常开检测器」从定性变定量的最后一步）；推广到自定义唤醒词与多语种词表；门控决策与下游 NMS 阈值联合优化。
