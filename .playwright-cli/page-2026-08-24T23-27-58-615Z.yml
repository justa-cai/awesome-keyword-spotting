      - generic [ref=f181e24]:
        - heading "一分钟版本" [level=2] [ref=f181e25]
        - list [ref=f181e26]:
          - listitem [ref=f181e27]: 定位是级联系统的省钱变量：端侧「轻量 KWS + 重量级 ASR」两级架构的隐私与效率都取决于 KWS 能否给出关键词的精确时间边界——给不出就整段音频进大模型（浪费算力）或靠粗糙能量检测（误触发多）。视觉式 KWS 路线（SpeechYOLO → 本文基础框架）已形成「检测-分类-定位」三头标准管线——但编码器一直是全卷积 BC-ResNet：局部相关性强、无显式全局交互，区分同音词（peace/piece、night/knight）与判断完整关键词需要窗口尺度上下文。
          - listitem [ref=f181e28]: 流式契约（最基础的创新）：ASR 的 conformer 默认整句输入、注意力无界——直接搬违反流式与内存约束。三个数字钉死边界：1.2 秒窗口（注意力上下文上界，内存不随音频时长增长）、240ms 滑移（输出节奏，几乎构成全部感知延迟）、960ms 缓存复用（不重复计算）；子采样卷积把 120 帧压到 29 帧——自注意力的平方开销建立在压缩时间轴上，这是 conformer 塞进端侧预算的关键一步。
          - listitem [ref=f181e29]: I3D 门控扩展到 conformer（四类模块）：transformer 只有前馈 / 注意力两类可跳对象，conformer 有四类（FFN×2 / MHSA / CONV）——每个模块的残差连接上装独立二值门（共 4Nz 个：Librispeech 32 个 / GSC 12 个），门看该模块输入的时间平均（窗口级决策粒度，参数每门仅 2H+2，GSC 全套门 ~1k 参数）。训练用 Gumbel-Softmax 可微采样离散 0/1，推理退化硬判决 p>0.5；门开启率正则防「全开退化静态」；先无门预训练再开门（网络没训到位时时间平均输入是噪声，门学到乱开策略）——也可反向加装到已训好的非门控模型。
          - listitem [ref=f181e30]: conformer 的增益模式（最有信息量）：test-other 上 FAR 从 0.314 砍到 0.146（每秒误警降一半多）、精确率 0.749→0.869、MTWV 0.58→0.76——但召回率几乎没动（0.684→0.705）。提升全部来自误警侧：全局注意力最大受益方是「第 C+1 类（无关键词）」建模与同音词判别——conformer 教会模型什么不是关键词，而不是多抓住几个。对常开检测器恰是最有价值的方向（误警反复唤醒大模型、耗电 + 隐私）。
          - listitem [ref=f181e31]: 参数账：Ours-L 1.29M vs 基线 1.54M——参数少 16% 指标几乎全线提升（唯二例外：干净集上事件准确率与 IOU 略低于卷积基线——卷积在干净数据的定位边界反而稍好，论文诚实报告）。
          - listitem [ref=f181e32]: 跳过优于缩小（效率论证支点）：Ours-L-gated（跳过 30%）与 Ours-S（静态砍小的非门控模型，平均计算量相当）对照——前者全部指标更好（test-other F1 0.769 vs 0.737）。省算力的正确姿势不是把网络均匀削薄让所有输入一起变差，而是保持容量让简单输入走浅路径、难输入仍走完整深度。
          - listitem [ref=f181e33]: 三档跳过率（输入条件化的直接证据）：连续语音 30%、孤立命令语音 42%、纯噪声段 97%——两者相差一倍多验证「门学会了区分语音与非语音」；常开检测器「大部分算力花在非语音上」的隐性浪费变成可砍的显式成本。
          - listitem [ref=f181e34]: 代价的诚实清单（论文表述之外）：「所有指标差异 <1%」只对 P/R/F1 成立——MTWV 落差 3–6 个点（0.87→0.84 / 0.76→0.70）；GSC 上 IOU 0.818→0.757 是最大单点退化（短命令有效信息集中在少数帧，跳过更容易丢边界信息）。论文自己划清的硬边界：跳过不减模型体积（内存不变）、不改善感知延迟——收益仅平均计算量与功耗。
          - listitem [ref=f181e35]: 边界：门决策是窗口级（1.2s 内所有帧共享同一决策——短命令埋在长噪声里只能整体决策）；β=0.5 / λ=1 固定（无法运行时切「省电 / 全精度」档）；无绝对 MACs / 实测延迟 / 实测功耗（97% 跳过率兑多少电池时间只是机制推断）；基线只有 BC-ResNet 一个（无 cFSMN / MatchboxNet / 早退机制横向对比）；噪声只有嘈杂人声一种（无远场 / 混响 / 多说话人 / 音乐）；门位置 / λ / β / 预训练轮数 / 窗长全无敏感性扫描。
