  - generic [ref=f227e294]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f227e295]
    - list [ref=f227e296]:
      - listitem [ref=f227e297]: ↳ 端侧模型的真实效率 = MACs × 算子兑换率——先在目标芯片上 profiling 兑换率再决定压哪个量；「每 MAC 真实周期数」应是一等公民的设计约束。
      - listitem [ref=f227e298]: ↳ 「重写算子类」是有别于压缩数值的另一条路线：零精度损失、与量化正交可叠加——架构级的等价变换比有损压缩更干净。
      - listitem [ref=f227e299]: ↳ 训练形态与部署形态可以解耦：各用各的最优（建模友好 vs 硬件友好），中间靠数学等价衔接——前提是转换条件被严格刻画（命题 1 式的「当且仅当」）。
      - listitem [ref=f227e300]: ↳ 推理频率是独立于模型大小的效率旋钮：步长换 MIPS 几乎不伤精度——决策粒度只要相对目标事件的时长足够稠密。
      - listitem [ref=f227e301]: ↳ 基线对比要同 MACs 更要同算子类：混合算子的开销会被 MACs 数字掩盖——报告每 MAC 周期数才能暴露真实差距。
