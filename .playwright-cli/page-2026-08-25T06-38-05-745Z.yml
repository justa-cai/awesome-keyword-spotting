    - heading "同样的乘加，在芯片上兑换的周期 差三倍：训练用卷积，推理全线性" [level=1] [ref=f227e5]: 同样的乘加，在芯片上兑换的周期差三倍：训练用卷积，推理全线性
    - generic [ref=f227e6]:
      - generic [ref=f227e7]: LiCo-Net · Meta AI · arXiv 2211.04635
      - generic [ref=f227e8]: 流式卷积 → 线性层等价转换
      - generic [ref=f227e9]: Cadence HiFi4 · int8 周期实测
      - generic [ref=f227e10]: 「hey operator」· 95K 语句
    - generic [ref=f227e11]: 学术界以 MACs 论英雄，但 ML 算子在低功耗处理器上呈异构效率剖面——LiCo-Net 的赌注不是计算量，是计算量在芯片上的兑换率：命题 1 保证转换零精度损失。
    - generic [ref=f227e12]:
      - heading "一分钟版本" [level=3] [ref=f227e13]
      - list [ref=f227e14]:
        - listitem [ref=f227e15]: ▸ 立论：理论 MACs「往往不能解读为真实硬件效率」——同样 1 次乘加，卷积算子和全连接在真实芯片上的周期完全不同；反直觉现象：MACs 更高的 MLP 可能比 MACs 更低的 CNN 更快。
        - listitem [ref=f227e16]: ▸ 三条经验事实：int8 比 float 省算力；线性层比其他层类型更高效（被处理器厂商几十年手工优化、吃满 SIMD）；卷积建模能力强——双阶段设计让每阶段各用各的最优形态。
        - listitem [ref=f227e17]: ▸ 命题 1：流式 CNN 可等价转 MLP ⟺ 第一层步长 = chunk 大小（输入长锁定为核宽 K，卷积退化为一次矩阵向量乘）+ 其余层步长 1（逐点卷积天然线性）。
        - listitem [ref=f227e18]: ▸ 零精度损失：转换只是权重 reshape + 输入展平——部署后的线性网与训练时的卷积网在数学上是同一个函数，根本区别于蒸馏/剪枝/低秩这类有损压缩。
        - listitem [ref=f227e19]: ▸ LiCo-Block：大核扩张卷积（时序上下文只混合一次）+ 两层逐点卷积（纯通道混合）+ ReLU；s=1 时加残差（s>1 时间维下采样形状不对齐）。统一视角：MLP 是 LiCo-Net 在 L=1、K=21 的退化特例。
        - listitem [ref=f227e20]: ▸ 硬件实测：HiFi4 周期精确模拟器——相近 MACs 与步长下比 SVDF 快 1.5–1.8×（周期降约 40%）；兑换率 SVDF 1.68 cyc/MAC vs LiCo 0.98 vs MLP 0.51——同 MACs 不同算子差 3 倍以上。
        - listitem [ref=f227e21]: ▸ 步长语义：s = 推理频率（10ms 特征下 s=3 每 30ms 推一次）——MIPS = 单次周期 × 频率，大 LiCo 9.36→3.12；单次推理周期几乎不随步长变（收益全在持续负载/功耗维度）。
        - listitem [ref=f227e22]: ▸ 精度侧：大步长对所有模型几乎无损（1.1s 外部解码平滑窗——30ms 决策粒度相对关键词时长足够稠密）；小模型 s=3 时小 LiCo 反超小 SVDF（0.025 FA/Hr 处 FRR 2%→1.2%）。
        - listitem [ref=f227e23]: ▸ 性价比最优点：小 LiCo-Net + stride=3——61,154 周期 / 2.01 MIPS，精度还优于同设定 SVDF。
        - listitem [ref=f227e24]: ▸ 边界：HiFi4 单核绑定（「另一颗芯片上差距可能不同」）；命题 1 锁死架构自由度（多尺度/池化/空洞不可用）；vs MLP 仍有 2× 周期差；单唤醒词内部数据不可复现；基线只 SVDF/MLP；全模拟器无真机功耗。
    - heading "§01 问题：算子类型决定每 MAC 的真实周期数" [level=2] [ref=f227e25]:
      - generic [ref=f227e26]: §01
      - text: 问题：算子类型决定每 MAC 的真实周期数
    - generic [ref=f227e27]: 四类 KWS 方案的「建模能力 vs 硬件亲和」两难
    - paragraph [ref=f227e28]: KWS 是设备里唯一 24×7 不间断烧电烧算力的神经网络。MLP 硬件友好但容量上限低；RNN 对常驻流式数据预测不稳定、非线性算子低效且对静态 int8 量化脆弱；CNN 量化友好性能高但开销太大；流式 CNN（SVDF/S1DCNN）把 MACs 压小了——但优化的仍是卷积类算子，而卷积恰是 DSP 上效率低于预期的算子，算子异质性的开销只是被 MACs 数字掩盖。
    - generic [ref=f227e29]:
      - generic [ref=f227e30]:
        - heading "RNN 的两条死刑" [level=4] [ref=f227e31]
        - paragraph [ref=f227e32]: 对前一时刻状态的依赖是「非确定的」——常驻流式数据上预测不稳定；内部非线性算子在低功耗硬件上效率低，且对静态 int8 量化很脆弱——对常开系统，量化后性能崩塌几乎是死刑。
      - generic [ref=f227e33]:
        - heading "SVDF 的隐藏开销" [level=4] [ref=f227e34]
        - paragraph [ref=f227e35]: SVDF 块内仍是「矩阵分解 + 记忆维深度卷积 + 瓶颈层」的混合体——算子异质性带来的每 MAC 周期差没有被消除；Table 1 里 SVDF 在 stride=3 时 MACs 反而升高（90.7→111.2K），机理未解释。
