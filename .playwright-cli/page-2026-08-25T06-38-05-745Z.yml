    - generic [ref=f227e120]: 人话（式 4 + 命题 1）：流式场景提供了天然配合——chunk 大小等于步长时每块输入恰好一个核宽长，卷积每块只产生一个输出位置，于是「卷积」退化为一次纯矩阵向量乘。流式本身还消灭了滑窗推理的重复计算：相邻窗 window−shift 的重叠反复参与计算，而「内部状态 + 小块新输入」等价产出输出。
  - paragraph [ref=f227e121]: 为什么第一层才用大核：时序上下文的混合只需要发生一次，放在入口把 K 帧声学上下文编码进单帧表示，后续层就能全部用核宽 1 的逐点卷积——命题 1 的条件 2 自然满足。为什么扩张因子：先撑宽（32→192）再做非线性，等效于在瓶颈预算内加大隐藏层宽度——移动端倒瓶颈思路的 KWS 流式移植。
