      - generic [ref=f146e183]: 人话：普通矩阵像一张每个格子都不同的表格，要存 n² 个数。Toeplitz 矩阵像「斜条纹壁纸」——沿对角线的格子全是同一个值，只要存 n 个数就能画出整张表。低位移秩是给「这张表有多规则」定一个可度量的指标，规则程度越高，要存的越少。
