    - generic [ref=f146e279]:
      - generic [ref=f146e280]: JUDGEMENT
      - paragraph [ref=f146e281]: 压缩有两条哲学：「训完再压」（剪枝/量化）与「先立规矩再训」（结构化参数化）——后者把先验写进参数空间，训练全程在低维流形上进行；没有重训环节，但规矩错了天花板也低。
      - paragraph [ref=f146e282]: 参数的「自由度」不等于「个数」：密集矩阵 n² 个参数但有效自由度可能远低——识别数据的内在维度并用紧凑参数化对齐它，是所有高效架构（卷积/循环/低秩/结构化）的共同本质。
      - paragraph [ref=f146e283]: 工程可落地性往往决定学术路线的胜负：结构化变换数学上更优雅，但量化/depthwise 有现成算子与工具链——好思想的扩散速度受工程摩擦力制约，这是读「被埋没的好论文」时最该带的眼镜。
