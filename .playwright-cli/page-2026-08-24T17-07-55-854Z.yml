          - list [ref=f51e233]:
            - listitem [ref=f51e234]: 单一 backbone 单一特征：全实验 ResNet-15 + 40 维 MFCC——TC-ResNet/BC-ResNet 或现代特征下未验证。
            - listitem [ref=f51e235]: 对比依赖自行复现：Freq-MixStyle 无官方实现（调优充分性无法核验）；mixup/CrossGrad/BIN/CSD 引言列出却未进实验——实际对比面只有两个同类方法 + 裸基线。
            - listitem [ref=f51e236]: Unknown 类混杂：跨域全集/关键词集落差 20–30 pp，全集指标解释力受污染。
            - listitem [ref=f51e237]: 小数据高方差：TED 9.4h 训练，部分表标准差 ±2.3~2.4——1 pp 内差距可能不显著，无显著性检验。
            - listitem [ref=f51e238]: 补丁尺寸消融不充分：只两组配置，无系统网格与随机/可学习尺寸对照。
            - listitem [ref=f51e239]: 噪声类型有限：仅 WGN 与 MUSAN——真实远场混响、多说话人重叠、编解码失真未覆盖。
      - generic [ref=f51e240]:
        - heading "下一步方向（论文展望 + 笔者延伸）" [level=3] [ref=f51e241]
        - paragraph [ref=f51e242]: ① 层间自适应补丁尺寸：浅层细补丁捕局部声学、深层粗补丁对齐语义粒度。 ② 频域专注切分：让切分显式对齐频谱能量分布而非均匀网格（TED→GSC 反常的教训）。 ③ 条件决策：部署期轻量统计检验估计输入与训练域差距 → 路由到对应 p 的模型或动态调整增强强度。 ④ 混合两种补丁配置；⑤ 弥合 OODG 与域内的跷跷板（确定性混合与随机采样各覆盖偏移谱不同区段，可能互补）；⑥ 推广到时序卷积 backbone、混响/多说话人偏移源、流式部署场景。
