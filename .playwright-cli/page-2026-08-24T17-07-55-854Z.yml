      - generic [ref=f51e24]:
        - heading "一分钟版本" [level=2] [ref=f51e25]
        - list [ref=f51e26]:
          - listitem [ref=f51e27]: 痛点：KWS 每天面对分布偏移（噪声/设备/说话人）——但现有 DG 评测几乎全在 Google Speech Commands 一家内做「库内偏移」，缺真跨语料同标签的 OODG 评测。
          - listitem [ref=f51e28]: 核心改造：DSU（ICLR 2022 视觉方法）把特征统计建模为高斯随机变量——但语音不是图像：频谱图稀疏（大片静音与高频空白），全局统计被稀疏区拖偏。PatchDSU 把统计粒度从整张特征图降到补丁级——每个补丁内部统计更均匀，采样扰动才落在有意义的统计邻域内。
          - listitem [ref=f51e29]: 形式：特征图切成 K 个补丁（两组配置 (k_h=6,k_w=10) 时间细切 60 补丁 / (7,3) 频率细切 21 补丁），每补丁独立计算 μ/σ、构造对角协方差高斯、采样替换实例归一化统计量；逐卷积层前施加、以概率 p 触发。训练期专用，推理零开销零参数。
          - listitem [ref=f51e30]: 结果：域内 GSC 饱和（98.43）差距在低资源库拉开（Libri 时移 94.65 领先 DSU 0.95 / 基线 1.09；TED 时移 82.07 领先 0.8 / 3+）；MUSAN 音乐噪声下 Freq-MixStyle 灾难崩塌（−5dB 70.64 比基线低 12 pp）而 PatchDSU 稳。
          - listitem [ref=f51e31]: 诚实的边界：六个跨域方向高度不对称——GSC→TED 裸基线最佳、TED→GSC Freq-MixStyle 大幅领跑（DSU 崩到 19.82）；无全胜方法，PatchDSU 是多数场景一致胜出的单模型；最优 p 因库而异必须校准（视觉域的 p 鲁棒性在语音域不成立）。
