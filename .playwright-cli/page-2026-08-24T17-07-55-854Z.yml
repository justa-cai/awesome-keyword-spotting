      - generic [ref=f51e221]:
        - generic [ref=f51e222]:
          - heading "方法的技术局限" [level=4] [ref=f51e223]
          - list [ref=f51e224]:
            - listitem [ref=f51e225]: 补丁尺寸全程固定：浅层是局部声学纹理、深层是整词抽象——一套 (k_h,k_w) 难以适配所有深度（论文自认，提出层间灵活性）。
            - listitem [ref=f51e226]: p 无自适应机制：最优 p 因库因条件而异，每次换域都要重新校准——部署成本高；「条件决策」（按分布差距路由 p）提出未实现。
            - listitem [ref=f51e227]: 两个补丁配置强弱分裂：(7,3) 与 (6,10) 各有擅长场景，只能靠验证集二选一，混合方案待做。
            - listitem [ref=f51e228]: 特定跨域方向失手：TED→GSC 被 Freq-MixStyle 大幅超越（32.54 vs 75.02）；GSC→TED 裸基线最佳——「一致性」是统计多数胜不是全胜。
            - listitem [ref=f51e229]: 高斯假设未验证：补丁统计服从高斯是继承先验，无拟合优度检验；分布重叠度极低的库对（GSC↔TED）采样扰动可能覆盖不到目标域。
            - listitem [ref=f51e230]: 开销未量化：训练期逐补丁统计与采样的额外计算/显存、训练时长影响均未报告（推理零开销由设计保证）。
