      - generic [ref=f114e24]:
        - heading "一分钟版本" [level=2] [ref=f114e25]
        - list [ref=f114e26]:
          - listitem [ref=f114e27]: 模态异质性（audio-text mismatch）：文本编码器从字面字符出发，表征里没有「声音」概念；音频编码器满是音色/信道/噪声等文本侧不存在的变量。两条不平行轨道硬架桥，最直接症状在近音词判别——CMCD 在 LibriPhrase Hard 上 EER 32.9%。
          - listitem [ref=f114e28]: 核心思想：跨任务知识套利：Tacotron 2 的编码器全部工作就是「看字猜声」——必须把「这段文本怎么发音」编码进中间表示才能预测梅尔谱。把这层表示直接搬来当 KWS 文本编码器的输入特征（不合成音频、不加新预训练目标、只换特征源），用生成任务的免费副产品填补判别任务的模态鸿沟。
          - listitem [ref=f114e29]: 七层消融的关键结论：E3（编码器 Bi-LSTM 输出）全场最优；编码器侧（说话人无关）显著优于解码器侧（E5/E6/E7 纠缠 LJSpeech 单说话人音色——对「任意说话人音频对文本」是噪声）；E6（Postnet）甚至差过最朴素的 E1 字符嵌入。可迁移判断：迁移点应选在模态转换之前、上下文建模完成之后。
          - listitem [ref=f114e30]: 结果：Q / LPE / LPH 三库全面第一；LPH EER 32.9→24.68（−8.22）、AUC 73.58→86.14（+12.56）——近音词上拉开约十个点是质变级收益；G 上第二（QbyE 吃训练集内高频词的「熟悉度」红利——一旦关键词陌生立刻崩到 49.13，恰是开放词表最不能接受的失败模式）。
          - listitem [ref=f114e31]: 开放词表证据：OOV 未见词上 EER 23.48→18.14、AUC +6.36、F1 +7.25 对 CMCD——文本侧靠 TTS 的字素-音素知识照样正确编码匹配，不是拟合训练词表；词长 1→4 EER 只差约 3 点（4 词档仅 56 episode 置信度有限）；Fig.2：E3 训练损失下降快于 CMCD——跨模态对齐被 TTS 预训练部分预解。
          - listitem [ref=f114e32]: 成色缺口：单层迁移（多层融合自留）；绑死字符级英语单说话人 Tacotron 2（拼读不规则语言未验证）；零部署指标（参数/延迟/内存）；成对二分类形态——连续音频流的滑窗检测与定位未讨论。引用警告：论文三处正文数字与表格不一致（AUC/EER 标签互换两处、OOV 改善量笔误）——引用必须回表格复核。
    - generic [ref=f114e33]:
      - paragraph [ref=f114e34]: §01 · 问题陈述
      - heading "三条路线各有死穴，模态异质性是共同软肋" [level=2] [ref=f114e35]
      - generic [ref=f114e37]: 三条路线的量化验伤（Table I）：① QbyE（音频注册）——性能严重依赖注册与测试语音的相似度：注意力 QbyE 在 G（关键词在训练集内、高频常用词）EER 14.75 全场最佳（吃「熟悉度」红利），换陌生 Qualcomm 立刻崩到 49.13 / AUC 50.13 接近随机；② ASR 文本注册——级联依赖，ASR 错 KWS 跟着错、误差沿链路放大；③ 端到端共享空间（CMCD / PhonMatchNet / MLE）——最强路线但模态异质性未解：文本表征缺声学知识，近音词对（madame/modem 字面与发音都只差一点）划不出清晰边界——LPH 32.9% 就是代价。三层问题链：怎么让文本表征自带声学知识（不靠训练时两编码器互相迁就）；搬哪一层（七种候选中间表示需系统消融）；搬来稳不稳（OOV 与词长鲁棒性——否则收益可能只是拟合训练词表）。
