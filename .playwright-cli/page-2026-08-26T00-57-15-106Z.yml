    - generic [ref=f107e195]:
      - generic [ref=f107e196]: JUDGEMENT
      - paragraph [ref=f107e197]: ↳ 基准数据集是公共品，规模要选「单 GPU 一晚跑完」的甜点：太大学术界跑不动，太小训不出有意义的模型——GSC 的 65K 恰好让每个研究者都能完整地做实验，这是它被广泛采用的前提，比「更大」更重要。
      - paragraph [ref=f107e198]: ↳ 统一评估协议比数据本身更有粘性：固定划分 + 明确指标 + 官方基线三件套让「公平比较」成为可能——数据会被更好的替代，但协议定义了一个领域的对话语言。
      - paragraph [ref=f107e199]: ↳ 基准的局限会变成领域的系统性盲区：仅英语、近场、一秒定长、单准确率——这些设计选择让整整一代论文集中在同一类场景上；读 GSC 上的 SOTA 时要意识到「考场」本身划定了考纲。
