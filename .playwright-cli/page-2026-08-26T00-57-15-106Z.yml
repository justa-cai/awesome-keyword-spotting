    - generic [ref=f107e107]:
      - generic [ref=f107e108]: "65,000 条 × ~1s × 16kHz 12 类 = 10 目标词 + {未知} + {静音} 基线：4 层 CNN + 40 维 log-mel ≈ 86%"
      - generic [ref=f107e109]: 人话：让几千个人在网页上每人念几个词，收上来六万五千条一秒的录音，人工和自动双保险把垃圾过滤掉。考试规则也定死：十个词各自算一类，其他所有词算「未知」，没说话算「静音」——这样全世界任何人跑同一个模型都能得到同一个分数。
