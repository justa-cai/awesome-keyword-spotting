    - heading "机制：一张频谱图的两种待遇" [level=2] [ref=f68e70]
    - paragraph [ref=f68e71]: 把标准 CNN 与子带 CNN 并排画出来最直观：标准版五个频带块同一待遇（同一核、同通道数）——高频白烧；子带版算力按柱高分配——低频厚、高频薄，融合时各子带输出按通道拼接，后续层做跨子带聚合。关键设计约束：减法只做在冗余区——低频判别主力保持完整卷积，确保砍掉的计算确实不含判别信息。
