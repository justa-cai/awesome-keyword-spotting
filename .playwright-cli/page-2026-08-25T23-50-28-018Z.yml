        - generic [ref=f68e183]: "1"
        - paragraph [ref=f68e184]: "「按信息分配算力」是四维家族。本文（2019）按频率维分配、#16 NAS-KWS（2020）按时间感受野维（浅层大核/深层小核）、MTConv（2020 #22）按时间尺度维、SANAS（#18，2019）按输入难度维——共同哲学是：找到「冗余在哪个维度」，把减法做在那个维度。"
      - generic [ref=f68e185]:
        - generic [ref=f68e186]: "2"
        - paragraph [ref=f68e187]: "与 #22 MTConv 互补而非竞争。一个按频率切（垂直方向）、一个按时间尺度切（水平方向的多核）——两个正交维度上的非均匀分配可叠加；「非均匀分配」是比任何单一架构更长寿的设计原则。"
      - generic [ref=f68e188]:
        - generic [ref=f68e189]: "3"
        - paragraph [ref=f68e190]: −49.3% 的意义在硬件选型。计算砍半意味着同一颗 MCU 能跑双倍通道的模型，或同样的模型能进更便宜的芯片档——计算削减直接翻译为 BOM 成本，比学术精度更有产品话语权。
