  - generic [ref=f68e13]:
    - generic [ref=f68e14]: "01"
    - heading "问题：「一刀切」卷积的三处浪费" [level=2] [ref=f68e15]
    - generic [ref=f68e16]:
      - generic [ref=f68e17]: TL;DR
      - list [ref=f68e18]:
        - listitem [ref=f68e19]: ◆ 标准 CNN 的卷积核在所有频带上相同——但语音信息在频域分布不均：低频（元音基频与谐波）是判别主力，高频信息量相对少——均匀分配等于把算力浪费在高频。
        - listitem [ref=f68e20]: ◆ 端侧设备每一点计算都贵——低信息频带的计算是纯冗余；而且同一核扫全频率，无法针对频区特性专门建模。
        - listitem [ref=f68e21]: ◆ 子带 CNN 四步：频谱图按频率切子带 → 每子带独立卷积核（低频大/多、高频小/少）→ 拼接/聚合融合 → 分类。分解可均匀或按梅尔刻度。
        - listitem [ref=f68e22]: ◆ 计算优化三把刀全在高频：更小的核、更少的通道、极简操作甚至跳过——减计算不减判别信息，因为减的位置本来就没多少信息。
