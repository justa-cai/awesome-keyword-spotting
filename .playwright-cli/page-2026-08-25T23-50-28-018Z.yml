  - generic [ref=f68e238]:
    - generic [ref=f68e239]: "05"
    - heading "可迁移的判断" [level=2] [ref=f68e240]
    - generic [ref=f68e241]:
      - generic [ref=f68e242]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f68e243]: ① 算力分配应跟随信息分布。
      - generic [ref=f68e244]: ↳ 先量化「哪个维度冗余」（本文测出是高频），把减法集中在冗余区——判别主力保完整；「减计算不减信息」的前提是减对了地方，盲减会同时减掉信号。
      - paragraph [ref=f68e245]: ② 非均匀分配是比任何单一架构更长寿的原则。
      - generic [ref=f68e246]: ↳ 频率维（本文）、时间感受野维（NAS-KWS）、时间尺度维（MTConv）、输入难度维（SANAS）——每个维度都可以问「要不要均匀分」；这个原则在量化（位宽非均匀）、注意力（算力非均匀）里同样成立。
      - paragraph [ref=f68e247]: ③ 消融要先验证「假设的事实基础」。
      - generic [ref=f68e248]: ↳ 本文先证明「频带贡献不均等」这个事实，再做针对性的架构响应——顺序是事实→设计，不是设计→找理由；做高效化工作前先做贡献分析，减法才有依据。
    - paragraph [ref=f68e249]: "系列坐标：「按信息分配算力」家族的频率维代表——与 MTConv（时间尺度维，2020 #22）、NAS-KWS（感受野维，2020 #16）、SANAS（难度维， #18 2019）构成四个正交维度；与量化（位宽维）、剪枝（结构维）正交可叠加——KWS 的效率工程本质是「找到所有可非均匀分配的维度，逐个做减法」。"
