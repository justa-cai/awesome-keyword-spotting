            - text: (αf)。对 KWS 这是纯粹的类内方差：模型小、数据少，没有余量去消化说话人变异。
          - listitem [ref=f64e30]: 老办法卡在哪：经典 VTLN 要先逐说话人估计 α（多遍对齐解码），常驻监听的端侧场景跑不起；深度 KWS 文献又集体默认「MFCC 直接进网络」，输入侧归一化是空白。
          - listitem [ref=f64e31]: 本文方案：训练期每个 epoch 全局随机抽一个 α（0.80~1.20 共 21 档）规整特征、训同一个 DNN，末 epoch 锚定 α=1.00；测试期两条路——M1 21 视角分数等权平均（+0.31~+0.59），M2 只用常规特征、部署零成本（+0.18~+0.42）。
          - listitem [ref=f64e32]: 四后端一致：GRU-MttAten / TC-ResNet8 / KWT-3 / BCResNet-8 全部超基线 → 增益归因到特征而非结构，与架构演进正交可叠加。
          - listitem [ref=f64e33]: 负结果划界：M3 特征拼接（40 维 × 21 = 840 维）反而掉 0.10~0.74——融合要在分数域做，特征域不可行。
          - listitem [ref=f64e34]: 诚实账单：十种子均值 +0.22 / +0.14（p=3.5×10⁻⁵ / 0.0016，显著但不大）；35 类闭集没有误报口径；f₀=20 Hz 印刷疑点让规整近乎恒等映射，复现前必须核对源码。
