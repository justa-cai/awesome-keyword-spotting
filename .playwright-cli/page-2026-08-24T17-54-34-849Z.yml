      - heading "训练：按 epoch 全局随机 α + 末 epoch 中心锚定" [level=3] [ref=f64e111]
      - generic [ref=f64e112]:
        - text: 机制：每个 epoch 全局随机抽一个 α，用整个训练集在该 α 下的规整特征训练这个 epoch，单一 DNN 贯穿始终；最后一个 epoch 固定 α=1.00。三个设计理由：
        - list [ref=f64e113]:
          - listitem [ref=f64e114]: BN 统计平稳：TC-ResNet / BCResNet 都带批归一化——若一个 batch 内混 21 种规整，BN 运行统计量要同时追 21 个相关但不同的分布，估计噪声显著变大；按 epoch 切换保证任意时刻 batch 内规整一致。
          - listitem [ref=f64e115]: 21 个相关训练集的课程轮换：100 epoch 扣除末尾锚定 1 个，99 个 epoch 均匀随机落在 21 档 α 上，每档期望被见约 4.7 个 epoch——模型被迫学出对所有规整都稳定的表征。
          - listitem [ref=f64e116]: 末 epoch 锚定的动机是 recency 效应：深度网络最终权重对训练末段数据分布有超比例的敏感性——随机到底意味着最后一个视角纯靠运气，抽到极端 α 会让最终权重偏向该端。钉在几何中心 α=1.00 等于结束前强制刷新一次「中心视角」，对测试期只用 α=1.00 的 M2 尤其关键。
        - text: 代价也明确：同一 epoch 内所有说话人共享同一个 α，丢掉了「每个说话人自带不同规整」的多样性——VTLP 按条扰动在这点上更强，论文没做两种粒度的对照。
