      - heading "三种特征用法 × 四种网络后端的正交矩阵" [level=2] [ref=f64e71]
      - generic [ref=f64e73]: 设计逻辑是「证明输入侧改造对任意后端普遍有效」，而不是把一个架构调到极致。四个后端覆盖四种归纳偏置：GRU-MttAten（2D 卷积 + 双向 GRU + 四头注意力的时序混合）、TC-ResNet8（纯时域卷积，通道 16/24/32/48）、KWT-3（谱切块进 transformer）、BCResNet-8（广播残差 y = x + BC(f¹(avgpool(f²(x)))，一维时域卷积兼二维卷积之长）。若增益在循环、卷积、注意力、混合四种偏置下方向一致，结论才能归因到特征而非结构。特征配置沿用 GSC 社区标准：40 维 MFCC、30 ms 窗 / 10 ms 移、HTK 提取；训练 AdamW、batch 512、余弦 warmup、最多 100 epoch。
