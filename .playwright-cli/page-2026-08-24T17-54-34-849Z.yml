      - heading "现有方法的三层不足" [level=3] [ref=f64e62]
      - list [ref=f64e64]:
        - listitem [ref=f64e65]: 经典 VTLN 的结构性代价（1998, Lee & Rose）：收益的前提是先知道每个说话人的 α——多遍对齐与解码搜索（EM 迭代估计 warp 因子）。「估 α → 规整 → 再识别」的三段式对常驻监听、低功耗、流式的 KWS 在延迟和能耗上都不可接受。这是 VTLN 思想 27 年进不了 KWS 的核心障碍。
        - listitem [ref=f64e66]: 深度 KWS 文献的输入侧欠账：TC-ResNet、KWT、BC-ResNet 这些架构演进都默认输入是未经说话人归一化的 MFCC——架构侧收益（更强归纳偏置）和输入侧收益（更干净的类内分布）本是正交的，后者在 KWS 上是空白。
        - listitem [ref=f64e67]: 训练扰动路线（VTLP, Jaitly & Hinton）只做了一半：训练期随机规整扰动、测试期常规特征——只把规整当增强用，没探索测试期多视角融合，也没在 KWS 任务、多种 SOTA 架构下系统评估。特征级拼接路线能否走通（40 维 × 21 = 840 维）本身悬而未决。
      - generic [ref=f64e68]: 论文要回答的核心问题：能不能设计一套不改网络架构、测试期不增加参数、完全不需要估计说话人 α 的方案，把 VTL 规整特征装进 KWS？拆成三个子挑战——① 单一 DNN 如何见到全部规整视角而不偏袒任何 α；② 「精度优先的多视角融合」和「复杂度与基线完全相同的免规整推理」两条路都要给出并证明后者也有收益（否则部署价值为零）；③ 特征级拼接是否可行——负面结果同样有价值，它划定融合抽象层级的边界。
    - generic [ref=f64e69]:
