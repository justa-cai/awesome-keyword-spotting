      - generic [ref=f64e186]: 数据与设置：Google Speech Commands，35 个指令词全部作为目标词（35 类闭集 Top-1 准确率）。训练 84,843 条 / 评测 11,005 条，每条约 1 秒。训练增强对所有系统统一施加且相当重：时间平移 ±100 ms、重采样 [0.85, 1.15]、时/频掩码、babble / 混响 / MUSAN（15/10/8/5 dB）。一个论文没点破的对照价值：重采样本身就同时缩放时频两轴，与 VTL 的频轴伸缩有重叠——在人人都有重采样的前提下规整仍带来一致增益，说明它提供了速度扰动覆盖不了的纯频轴视角，这反而强化了主张（论文没把这层互补性单独拆开验证）。
