          - generic [ref=f21e196]: "3"
          - text: 无代码采集工具链 + 质检协议Power Apps + SharePoint + Power Automate，140 说话人 / 130MB / 23 词，非识别性元数据规避隐私风险——小团队短周期可复用的采集方案。
