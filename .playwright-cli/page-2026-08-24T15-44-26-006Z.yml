          - generic [ref=f21e194]: "2"
          - text: 23 词词表模板四层配比（数字 10 / 指令 8 / 确认 2 / 动作+唤醒 3）+「按位数裁剪词表」的务实设计——可直接迁移到其他非洲语言的命令词表设计。
