      - generic [ref=f21e220]:
        - heading "下一步方向（论文规划 + 笔者补充）" [level=3] [ref=f21e221]
        - paragraph [ref=f21e222]: 论文规划：误差驱动的数据清洗（用模型找拉低准确率的样本，替代人工盲审）；扩大采集规模与说话人多样性、根除 OPUS 转码；训练前补负样本（尤其对抗词）应对误报；更多边缘设备评估；个性化交互（首次校准、声纹检测、仅对核准用户反馈——对齐商用做法并回应偏见关切）。 笔者补充：MSWC 与本地数据做域混同训练或通道归一化，挽救「合并反而掉点」；引入误报/拒识曲线作为一级指标对齐行业标准。一句话总结：价值不在精度，在于把「给一门几乎没有语音命令资源的语言从零建语料、建工具、跑通端侧部署」走了一遍并开源——词表配比、无代码采集、域差教训都是可迁移的工程判断。
