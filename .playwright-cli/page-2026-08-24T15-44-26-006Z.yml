          - list [ref=f21e206]:
            - listitem [ref=f21e207]: 指标单薄：只有验证准确率——误报率、拒识率、延迟、模型大小全缺；对唤醒系统，核心风险未量化。
            - listitem [ref=f21e208]: 清洗协议不可扩展：五类问题全靠人工逐条审听，无信噪比/时长/能量的程序化过滤——数据规模扩大后不可持续。
