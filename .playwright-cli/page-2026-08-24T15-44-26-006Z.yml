        - paragraph [ref=f21e182]: 笔者的工程解读（非论文原文）：合并集低于 MSWC 单独训练，说明当前清洗协议下本地数据是「负资产」——分布扩展超过了信息增量；与预训练支线 36.7% 几乎相同的 36.8% 指向同一个结论：MSWC 与本地 App 采集之间域间距过大。可能来源：采集设备（手机麦克风 vs Common Voice 多设备）、信道（OPUS 有损往返只发生在本地数据上）、环境噪声、人工审听未剔净的残余标签噪声、以及 23 类不平衡。⚠ 论文未报告数据划分方式——若说话人在训练/验证间重叠，78.1% 也需保留解读。
      - generic [ref=f21e183]:
        - heading "指标的诚实账单" [level=3] [ref=f21e184]
        - paragraph [ref=f21e185]: 唯一量化指标是验证准确率——误报率（每小时误唤醒）、拒识率、延迟、模型大小全部缺失，而对以「唤醒设备」为目标的系统，误报恰是核心风险。论文并非不知道：文献综述专门引述了 Saidutta 的「关键词/非关键词/非语音」三分类逐级精化（误报降为八分之一不损精度）并称之为现成方法——但实验阶段既没实现也没测误报，对抗负样本的加入被推迟到未来工作。CNN/LSTM 的具体数值、PyTorch 版「显著改进」的幅度、端侧延迟/内存/量化精度差也均未报告。
