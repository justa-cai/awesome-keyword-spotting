            - listitem [ref=f21e216]: 逐类样本数与增强参数未报告：类平衡处理、移位幅度、变速范围、放大增益——不可精确复现。
            - listitem [ref=f21e217]: 手机部署缺位：摘要宣称 PC / 手机 / 边缘三类部署，正文只有 PC 与 Wio Terminal。
