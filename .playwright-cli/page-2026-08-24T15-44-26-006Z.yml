        - heading "一分钟版本" [level=2] [ref=f21e25]
        - list [ref=f21e26]:
          - listitem [ref=f21e27]: 不对称的空白：基尼阿万达语（卢旺达通用语，Common Voice 上最大的非洲语种之一）的文本侧工作不少（KinyaBERT、KINNEWS 基准），但语音命令资源为零——用户被迫用产品预装的主流语言唤醒设备；对残障用户（语音交互价值最大的群体）尤其如此。
          - listitem [ref=f21e28]: 三条现有路线全走不通：Howl 需要「发音词典 + 强制对齐器」（最稀缺的环节）；知识蒸馏需要「目标语言大 ASR 教师」（低资源语种没有）；MSWC 词级数据覆盖参差（Zero 不足）且不可能有自创唤醒词 "Muraho Afrika"。
          - listitem [ref=f21e29]: 三源拼装：MSWC（词级已切分，绕开对齐）+ GSC（补 Zero）+ 本地 140 名母语说话人（Power Apps 无代码工具链自采，含对抗负例位）；23 词词表四层配比（10 数字 + 8 指令 + 2 确认 + 2 动作 + 1 唤醒词）。
          - listitem [ref=f21e30]: 基线爬坡：CNN/声谱图 → LSTM → MFCC → 80% 数据增强 + PyTorch 重写。结果：MSWC 78.1% / 合并 71.8% / 本地 36.8%——合并反而低于单源，预训练微调支线 36.7% 失败，两个几乎相同的数字指向同一个域差问题。
          - listitem [ref=f21e31]: 价值定位：不在精度（离实用都远），在于把完整路径走了一遍并开源——词表配比、无代码采集、以及「合并数据反而掉点」的低资源域差教训，可迁移到一切低资源语种。
