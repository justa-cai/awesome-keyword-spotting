      - paragraph [ref=f175e238]: SOTA 对比全面胜出：固定延迟下相对依赖端点的 max-latency 约 25% 相对误收改善，且无需对齐标注。
  - heading "§05 局限与边界" [level=2] [ref=f175e239]:
    - generic [ref=f175e240]: §05
    - text: 局限与边界
  - generic [ref=f175e241]: 一步回退的前提与验证范围
  - generic [ref=f175e242]:
    - generic [ref=f175e243]:
      - heading "一步回退依赖大后验步长" [level=4] [ref=f175e244]
      - paragraph [ref=f175e245]: 伯努利 β 只能回退一个后验步——10ms 级输出步长的模型一步只有 10ms，压不出有意义的延迟；泊松多变回退只有提议没有验证。负例支完全没动——误收侧时序行为不在控制范围。
    - generic [ref=f175e246]:
      - heading "极端点与饱和效应" [level=4] [ref=f175e247]
      - paragraph [ref=f175e248]: b=1 峰值抢在关键词说完之前（信息不完整下判决），误收风险上边界未量化；峰值贴近窗口起点的样本 (·)₊ 截断让 β 实际失效——有效 b 低于名义 b，论文未讨论。
    - generic [ref=f175e249]:
      - heading "全相对值、单关键词" [level=4] [ref=f175e250]
      - paragraph [ref=f175e251]: 只验证「Amazon」二分类——多词/多类/短语未测；无绝对延迟毫秒表、无置信区间显著性——跨论文不可比。
    - generic [ref=f175e252]:
      - heading "不可复现 + 无在线验证" [level=4] [ref=f175e253]
      - paragraph [ref=f175e254]: 全部内部数据（20,000h 训练 / 1,400h 评测）无公开代码；延迟锚点是 HMM 端点（其对齐误差污染延迟测量本身）；max-latency 基线的 f 扫描未报告是否调到最优；延迟对真实用户行为（重复唤醒率）的影响无在线实验——而这恰是立论起点。
  - generic [ref=f175e255]:
    - heading "可迁移判断（超出 KWS 也成立）" [level=4] [ref=f175e256]
    - list [ref=f175e257]:
      - listitem [ref=f175e258]: ↳ 自动选帧/选例的损失会让学生自己挑最舒服的位置——监督信号集中在哪个时刻，行为就漂向哪个时刻；要控制行为先控制监督落点。
      - listitem [ref=f175e259]: ↳ 「收窄搜索范围」可以换成「从搜索结果回退」：前者要边界知识，后者只要相对参照——免标注的控制往往来自相对化改写。
      - listitem [ref=f175e260]: ↳ 把 trade-off 从「系统设计目标」变成「训练期超参数」的前提是单调映射——单调性让命中约束的搜索成本从密集扫参降到几个点。
      - listitem [ref=f175e261]: ↳ 随机化回退优于确定性回退：交替监督两个位置避免单点过拟合，代价曲线从悬崖变成可调斜坡。
      - listitem [ref=f175e262]: ↳ 算法延迟与工程延迟是两本账：改损失压算法延迟、省算力压工程延迟——两者正交，完整的端侧延迟账本要两边一起算。
