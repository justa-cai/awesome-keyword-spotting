  - generic [ref=f175e97]:
    - generic [ref=f175e98]: 正例支：t = ( argmax(p_i^y) − β )₊ β ~ Bernoulli(b)；负例支不动（仍选 p⁰ 最小帧）
    - generic [ref=f175e99]: 人话：max-pooling 的正例支把全部监督集中在（往往迟到的）峰值帧——峰值之前的帧从未被要求给出高后验，判决自然后漂。减一个随机 β：要么网络学会把置信度质量整体前移，要么把峰值前一帧的后验也抬高。b 越大前移压力越强：延迟越低、精度损失越大——由 b 连续控制的软权衡。
  - paragraph [ref=f175e100]: 控制变量设计：所有模型严格共用同一套架构（5 层卷积 + 3 层 FC 的流式 CNN）、初始化和训练流程，只换损失函数——本文全部论点落在「损失的改动导致延迟和精度变化」这条因果链上，任何架构或优化器的混杂因素都会污染它。
