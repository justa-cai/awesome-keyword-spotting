      - generic [ref=f13e124]: · 元音的区分在共振峰（频谱结构）——
      - generic [ref=f13e125]: 嘴型张得差不多，视觉分不出 a/i 的舌位
      - generic [ref=f13e126]: · 辅音的区分在唇齿动作（/p/ vs /b/ 的
      - generic [ref=f13e127]: 唇部闭合）——视觉直接可见
      - generic [ref=f13e128]: 结论：两模态不是冗余备份而是互补分工——
      - generic [ref=f13e129]: 这正是融合有效的根基
      - generic [ref=f13e130]: 左：特征级（早期）融合优于决策级投票——两模态在表示层互相适应。右：元音信息主要来自音频（共振峰不可见），辅音信息显著依赖视觉（唇齿动作直接可见）——互补分工是融合有效性的根基
    - generic [ref=f13e131]: 图 2 · 机制解剖：决策级 vs 特征级融合 · 元音/辅音的信息来源分工
    - generic [ref=f13e132]:
      - generic [ref=f13e133]: "音频流: x_audio → Mel → CNN → f_a ← 元音/共振峰信息主力 视觉流: 唇部视频帧 → 3D CNN（或 2D CNN+RNN）→ f_v ← 辅音/唇齿动作信息主力 融合: [f_a ; f_v] → 共享分类器 → 关键词概率 ← 特征级（早期）融合 ★ 模式: 仅音频 | 仅视觉 | 联合——按输入可用性切换"
      - generic [ref=f13e134]: 人话：耳朵和眼睛各自写一份「我听到/看到什么」的笔记，拼在一起交给一个共同做决定的裁判——裁判学会了在吵的时候多看笔记的视觉页。摄像头没开就只交耳朵那份，麦克风被干扰就只交眼睛那份。
    - paragraph [ref=f13e135]: 元音/辅音分工是本文最有启发的分析：元音的区分在共振峰结构（频谱里），嘴型张得差不多——视觉分不出 /a/ 和 /i/ 的舌位；辅音的区分常在唇齿动作（/p/ vs /b/ 的唇部闭合差异）——视觉直接可见。两模态各管一段音素空间，不是备份而是拼图。
