      - generic [ref=f13e276]: JUDGMENTS · 能带走的三条
      - paragraph [ref=f13e277]: ① 抗噪设计的最高形式：找一个物理隔离的信息通道。
      - generic [ref=f13e278]: ↳ 视觉不受声学噪声影响、空间先验不受某些混响维度影响——与其在单一通道里硬扛噪声（增强、降噪），不如引入一个「不被同一种噪声污染」的第二通道；判断标准是污染源的物理范围。
      - paragraph [ref=f13e279]: ② 多模态融合要在特征级做，且要能退化到单模态。
      - generic [ref=f13e280]: ↳ 特征级融合让表示层交叉校验（音频不可信时看视觉），决策级投票做不到；同时必须保留单模态推理模式——多模态系统最常见的死法是「缺一个模态就瘫痪」。
      - paragraph [ref=f13e281]: ③ 模态价值要看「分工结构」不是「平均增益」。
      - generic [ref=f13e282]: ↳ AV 在安静环境增益≈0，在 SNR<−5 是救命的——平均精度掩盖了价值的分布；先分析「主通道在哪些条件下失明」，再问第二模态是否恰好在那段有效（元音/辅音分工就是答案）。
    - paragraph [ref=f13e283]: 系列坐标：「给 KWS 加非声学模态」谱系的视觉分支——本文（2020）用视觉（唇动），2021 年 TAML 用文本（音素级锚定，连注册都不用说话），2026 年方向感知多通道用空间（波束先验）——共同逻辑都是：声学通道被污染时，找一个物理上不受同种干扰的第二信息源。
