    - heading "问题：噪声与鸡尾酒会效应" [level=2] [ref=f13e15]
    - generic [ref=f13e16]:
      - generic [ref=f13e17]: TL;DR
      - list [ref=f13e18]:
        - listitem [ref=f13e19]: ◆ 音频 KWS 在电视播放、交通、多人交谈里精度跳水——SNR 一降，关键词信息被噪声掩蔽；这是部署环境的核心痛点。
        - listitem [ref=f13e20]: ◆ 人类在嘈杂酒会里靠看嘴唇辅助理解（鸡尾酒会效应）——唇部运动与声学噪声物理隔离，且编码了发音动作的内容信息。
        - listitem [ref=f13e21]: ◆ 架构：音频流（Mel 频谱 + CNN）与视觉流（唇部视频 + 3D CNN）做特征级早期融合——优于决策级投票；支持仅音频/仅视觉/联合三种模式按输入可用性切换。
        - listitem [ref=f13e22]: ◆ 模态分工有物理基础：元音靠音频（共振峰不可见）、辅音靠视觉（唇齿动作直接可见）——互补而非冗余，这是融合有效的根基。
