      - generic [ref=f13e216]:
        - generic [ref=f13e217]: "1"
        - paragraph [ref=f13e218]: 「仅视觉」是一条平线——噪声免疫的直接证据。视觉模式的性能不随 SNR 变化：它根本不经过声学通道。这条平线不是拿来用的（性能低于音频），是拿来证明「第二通道的物理隔离性」的。
      - generic [ref=f13e219]:
        - generic [ref=f13e220]: "2"
        - paragraph [ref=f13e221]: 收益曲线的非对称性指导选型。安静时 AV≈音频（摄像头白开），极端噪声时 AV 是唯一活着的——适合「安静与嘈杂都存在」的场景（车载、厨房、会议屏），不适合恒温安静场景。
      - generic [ref=f13e222]:
        - generic [ref=f13e223]: "3"
        - paragraph [ref=f13e224]: 三种推理模式是部署弹性的关键设计。多模态系统最常见的死法是「缺一个模态就瘫痪」——模式可切换让同一套模型适配硬件配置各异的产品线。
