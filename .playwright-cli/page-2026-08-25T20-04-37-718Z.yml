  - generic [ref=f13e80]:
    - generic [ref=f13e81]: "02"
    - heading "机制：融合层级与模态分工" [level=2] [ref=f13e82]
    - paragraph [ref=f13e83]: 特征级融合优于决策级的原因：早期融合让两模态在表示层互相适应——分类器见到的是「声 + 形」的联合特征，能学会「音频这条频谱线索不可信时去看视觉」的交叉校验；决策级投票只能事后拼两个独立判断，模态间没有信息交换。
