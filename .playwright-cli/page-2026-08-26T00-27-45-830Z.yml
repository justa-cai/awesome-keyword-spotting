    - heading "5 判断：能带走的三句话" [level=2] [ref=f91e252]:
      - generic [ref=f91e253]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f91e254]:
      - generic [ref=f91e255]: JUDGEMENT
      - paragraph [ref=f91e256]: ↳ 级联系统的每个模块都在优化自己的代理指标——端到端的价值不是「某个模块更强」，而是让所有参数为最终指标一起负责；替换级联的第一步往往是找一个「可微分的简化版」放在同一位置。
      - paragraph [ref=f91e257]: ↳ 辅助任务是把先验塞进训练的手术：频谱映射告诉网络「干净语音长这样」——但消融同样警告，辅助信号过度会喧宾夺主；多任务收益的大小与「训练-测试条件是否匹配」强耦合，不是普适增益。
      - paragraph [ref=f91e258]: ↳ 注意力能学「少听」，学不了「消音」：加权平均没有相位操作，注定做不了信号抵消——读端到端前端论文时先问它替代的信号处理里哪些操作是加权平均能表达的，哪些不是。
