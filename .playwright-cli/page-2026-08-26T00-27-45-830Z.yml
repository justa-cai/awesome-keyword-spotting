      - generic [ref=f91e148]: 人话：给每个麦克风打一个「现在多可信」的分，按分数把六路信号混成一路再去识别——分数随环境实时变，噪声在哪边就把那边的音量调低。第二个损失逼模型同时输出「干净版频谱」，等于内置一个去噪练习，帮注意力学会分辨干净和脏。
