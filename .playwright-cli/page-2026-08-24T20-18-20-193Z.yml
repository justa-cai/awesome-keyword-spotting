      - generic [ref=f122e24]:
        - heading "一分钟版本" [level=2] [ref=f122e25]
        - list [ref=f122e26]:
          - listitem [ref=f122e27]: QbyE 的两重泛化难题：注册即用（几句话当模板）把「每词重训」变成嵌入比对，但嵌入空间必须同时做到词表泛化（评测词训练时从未出现）与说话人泛化（注册者和喊词的人可能不是同一人——家庭设备的常态）。现有 QbyE 普遍假设「使用者即注册者」+ 注意力模型算力太重不适合 always-on。
          - listitem [ref=f122e28]: 混合多任务损失（最反直觉处）：L = 词级损失 − η·说话人损失 + μ·音素损失——说话人项是负号：梯度反转层（GRL 前向恒等 / 反向梯度取反）让编码器被训练成「让说话人分类头尽量分不对」= 对抗性剥离嗓音信息；音素项用强制对齐的帧级标签提供细粒度词结构监督（为未见词的「音素拼接」泛化铺路）。
          - listitem [ref=f122e29]: 谱-时图注意力池化（GAP）：ASP 只在时间维软加权（所有帧保留只调权重）；GAP 把时频位置当图节点、图注意力学关系、图池化硬性剪掉不重要节点（保留比 0.71/0.86/0.71）——静音段与无差别浊音段直接剔除而非压低权重，从「软加权」到「关系建模 + 内容自适应选择」的代际差。
          - listitem [ref=f122e30]: SoftTriplet 的机制：每类 K=10 个中心显式建模类内多模态（同一个词被不同口音 / 性别 / 语速的人说本就不是一团而是多团）——AAM 的全局角度间隔对未见类的类内方差无能为力，多中心结构先验可零样本地迁移到未见词上，对开放词表更友好。
          - listitem [ref=f122e31]: 结果：629 人内部评测集、0.3 FAs/Hr 工作点，LiCoNet（轻量线性化卷积）从词 CE 的 13.20% 一路降到 1.98%（累计 −85%），与重型 Conformer（1.63%）只差 0.35 点而 FLOPs 低 13.8×（46.5M 对 642.2M）。
          - listitem [ref=f122e32]: 最有信息量的架构观察：反向说话人损失对 Conformer 收益最大（−40.9%）、对 ECAPA 最小（−10.6%）——注意力容量大最易把嗓音编进嵌入、而 ECAPA 的架构天性就是区分说话人（SV 骨干），GRL 在跟架构天性对抗；缩小 Conformer 显著退化、增大轻量模型仅轻微提升——端侧应押注线性化架构 + 训练框架而非缩小大模型。
    - generic [ref=f122e33]:
      - paragraph [ref=f122e34]: §01 · 问题陈述
      - heading "把「每词重训」变成「注册即用」的代价全压在嵌入质量上" [level=2] [ref=f122e35]
      - generic [ref=f122e37]: 四条路线的不足：① 预定义 KWS（cFSMN / TD-BHNN / 端到端）——每个词都要大量目标数据与专用训练，与「随手自定义」结构性冲突；② ASR+DTW/CTC 的早期 QbyE——相似度度量从通用 ASR 继承，没有任何环节被「两词分开、同词靠近」的判别目标塑造过；③ 多头注意力 QbyE（ICASSP 2021）——性能好但注意力伴随显著计算需求与运行时内存负担，不适合 always-on；④ MLPMixer 替代——矩阵转置在硬件上仍造成显著开销。两个被忽视的嵌入质量问题：说话人耦合假设（使用者 = 注册者）一破，注册与查询嵌入出现系统性分布错配；单一词级监督下词信息与说话人信息纠缠（分类头不关心靠音素还是靠嗓音分开 1002 类），帧级音素结构无显式监督——对未见词泛化不利。
