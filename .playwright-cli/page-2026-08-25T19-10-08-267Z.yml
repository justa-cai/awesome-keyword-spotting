      - generic [ref=f338e281]: ↳ 本文不是发明新 NAS 算法，而是把「架构搜索」与「硬件实测」解耦——当循环里某个环节（真机测量）吞吐极低时，为它找代理或脱钩，收益常大于改进搜索算法本身。
      - paragraph [ref=f338e282]: ③ 通用轻量架构 ≠ 端侧架构。
      - generic [ref=f338e283]: ↳ 为手机 SoC 设计的 MobileNet 系在 MCU 上被专门搜索的架构反超——端侧设计的自由度要按目标平台的资源形状（SRAM/Flash/无加速器）重新定，照搬「现成轻量模型」是常见陷阱。
    - paragraph [ref=f338e284]: 系列坐标：MCU × NAS 谱系的关键节点——2020 №2 AutoKWS 把 DARTS 带进 KWS 但没有硬件在环，本文补上这块并给出「操作数代理」这个便宜又准的方案；2021 年硬件感知 NAS 继续深化约束意识；同年同目录的 2020 №1（DS-CNN on M4）是部署侧姊妹篇——一个管架构怎么搜，一个管搜出来怎么跑。本文也是 MLPerf Tiny 时代的基准架构来源之一。
