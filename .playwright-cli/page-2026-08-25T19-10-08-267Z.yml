    - generic [ref=f338e138]:
      - generic [ref=f338e139]: "latency(model) ≈ k · OpCount(model) ← 搜索空间内 r > 0.95, 误差 5–10% OpCount: 编译期静态统计（MAC 数）——零真机实测 NAS: DARTS 连续松弛 + 一次超网训练 → 约束下取最优"
      - generic [ref=f338e140]: 人话：同一块纯 CPU 上，「多少次乘加」和「跑多少毫秒」几乎是同一件事的两 种说法——那就不必真跑，数一遍乘加数乘个系数就行。这个系数从少量实测校准，之后整个搜索过程都查表过。
    - paragraph [ref=f338e141]: 省下的是「搜索 × 硬件」的双循环。架构评估从「上真机」变成「查表 + 乘法」：搜索数千候选不再需要板子排队，硬件迭代（换芯片）与架构搜索彻底解耦——只要新平台还是纯 CPU，重新校准一个系数即可。MicroNet 族本身大量使用深度可分离卷积与倒置瓶颈块，通道扩展比与核配置由 NAS 精调；不同约束档位各出一个变体。
