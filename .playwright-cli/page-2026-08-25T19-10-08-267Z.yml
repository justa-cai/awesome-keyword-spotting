    - generic [ref=f338e16]:
      - generic [ref=f338e17]: TL;DR
      - list [ref=f338e18]:
        - listitem [ref=f338e19]: ◆ MCU 的游戏规则：SRAM ~256KB 放激活、Flash ~1MB 放参数、无加速器纯 CPU 硬算、电池供电——四条全卡死，纸面精度没有意义。
        - listitem [ref=f338e20]: ◆ 传统硬件感知 NAS 的真瓶颈不是搜索算法而是延迟评估：每个候选都要上目标板子跑一遍，一次搜索数千候选，换块板子全部重测。
        - listitem [ref=f338e21]: ◆ 本文最重要的发现：搜索空间内操作数与延迟统计上近似线性（r>0.95）——因为搜索空间由结构化重复单元组成、各操作计算密度相近、先验均匀。
        - listitem [ref=f338e22]: ◆ 推论：数操作数就能当延迟代理，编译期静态可得——DARTS 式搜索全程零真机实测，产出覆盖不同约束档位的 MicroNet 架构族。
