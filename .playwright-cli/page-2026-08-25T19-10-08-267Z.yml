  - generic [ref=f338e80]:
    - generic [ref=f338e81]: "02"
    - heading "机制：为什么数 MAC 就够了" [level=2] [ref=f338e82]
    - paragraph [ref=f338e83]: 线性关系的成立有明确的物理直觉：在纯 CPU 上，每个乘加都要过 ALU，MAC 数就是工作量本身；而访存与计算的比例在同一搜索空间内稳定（结构化重复单元、各操作计算密度相近），所以延迟 ≈ 常数 × 操作数。这也是它适用域的边界——一旦硬件里有专用加速器（调度、带宽、缓存行为异质化），这个比例就不再稳定。
