    - listitem [ref=f287e208]: ◈ 重叠场景是分水岭：回声与用户语音同时存在时 iAEC 优势最大——显式 AEC 的自适应滤波在双讲（double-talk）场景本就是经典难题，端到端学习绕开了这个坑。
    - listitem [ref=f287e209]: ◈ 消融三条都指向同一结论：参考信号是关键输入（去分支掉点显著）、融合方式有讲究（注意力 > 拼接）、训练分布决定泛化（回声条件要多样）。
    - listitem [ref=f287e210]: ◈ 证据边界（引用注意）：与显式 AEC 的计算成本对比不详细；缺真实用户环境 A/B；未探索量化后保持——原论文有量化表格但笔记未保留具体数字，本页全部为定性结论。
  - heading "§04 贡献" [level=2] [ref=f287e211]:
    - generic [ref=f287e212]: §04
    - text: 贡献
  - generic [ref=f287e213]: 四点：从可行性证明到设计范式
  - generic [ref=f287e214]:
    - generic [ref=f287e215]:
      - generic [ref=f287e216]: "1"
      - paragraph [ref=f287e217]: 证明隐式 AEC 可行：首次证明 KWS 模型可在无显式 AEC 预处理下通过端到端训练学会回声消除——挑战「AEC 必须在 KWS 之前独立实现」的传统理念。
    - generic [ref=f287e218]:
      - generic [ref=f287e219]: "2"
      - paragraph [ref=f287e220]: 降低系统复杂度：消除独立 AEC 模块及其调参需求——对快速迭代的商业产品尤其重要。
    - generic [ref=f287e221]:
      - generic [ref=f287e222]: "3"
      - paragraph [ref=f287e223]: KWS 与 DDD 同时改善：不仅 KWS 准确率不输级联方案，设备导向检测同样获益——一份参考信号两份收益。
    - generic [ref=f287e224]:
      - generic [ref=f287e225]: "4"
      - paragraph [ref=f287e226]: 统一端到端框架：回声处理 + 关键词检测 + 设备导向检测统一进一个模型——为多任务语音前端处理提供新设计范式。
  - heading "§05 局限与判断" [level=2] [ref=f287e227]:
    - generic [ref=f287e228]: §05
    - text: 局限与判断
  - generic [ref=f287e229]: 参考信号依赖 · 训练分布 · 多设备未解
  - generic [ref=f287e230]:
    - img [ref=f287e231]:
      - generic [ref=f287e233]: 边界与延伸
      - generic [ref=f287e235]: 技术边界
      - generic [ref=f287e236]: · 参考信号依赖：需要设备能提供扬声器播放的参考信号——
      - generic [ref=f287e237]: 参考不可用或延迟大的场景受限（这是硬前提）
      - generic [ref=f287e238]: · 训练数据偏差：性能依赖训练回声条件的多样性与真实性——
      - generic [ref=f287e239]: 部署环境的回声特性与训练差异大时性能下降
      - generic [ref=f287e240]: · 多设备场景未探索：多个设备同时播放时，参考信号与回声的
      - generic [ref=f287e241]: 对应关系变复杂（哪个参考对哪路回声？）
      - generic [ref=f287e243]: 实验边界 + 延伸
      - generic [ref=f287e244]: · 与显式 AEC 流水线的计算成本对比不详细
      - generic [ref=f287e245]: · 缺真实用户环境 A/B 测试
      - generic [ref=f287e246]: · 未探索量化部署后的性能保持
      - generic [ref=f287e247]: 延伸：无参考信号的隐式 AEC（仅麦克风）；自监督提升回声
      - generic [ref=f287e248]: 鲁棒性；扩展到多通道麦克风阵列；推广到降噪/语音增强
      - generic [ref=f287e249]: 等前端任务的隐式化
      - generic [ref=f287e250]: 可迁移判断：端到端学习可以替代传统信号处理流水线里的独立模块——隐式学习往往优于显式级联；条件是你手里有该模块的「驱动信号」（如参考信号）可以作输入
    - generic [ref=f287e251]: 图4 · 边界与延伸：左技术边界（参考信号硬前提、训练回声偏差、多设备场景），右实验边界（成本对比不详、无 A/B、无量化研究）+ 延伸方向。
  - generic [ref=f287e252]:
    - generic [ref=f287e253]: 可迁移判断
    - paragraph [ref=f287e254]: ↳ 隐式学习往往优于显式级联——前提是你手里有该模块的「驱动信号」可以作输入：AEC 的参考信号、降噪的噪声估计、增强的干净目标……凡是信号处理模块有先验输入的，都可以问一句「能不能塞进网络端到端学」。
    - paragraph [ref=f287e255]: ↳ 级联的局部最优不是全局最优：AEC 按信号指标（ERLE）优化，下游要的是检测准确率——两个目标不重合时，级联必然留损。端到端让「减成什么样」由最终任务说了算。
    - paragraph [ref=f287e256]: ↳ 同一份证据可以服务多个任务：参考信号既消回声又判导向——设计多任务框架时先找「同源证据」，比硬拼两个任务的头更自然。
    - paragraph [ref=f287e257]: ↳ 先检查硬前提再谈范式：iAEC 的全部前提是参考信号可得且低延迟——方法迁移前先确认自己场景的「钥匙」是否存在，否则范式再优雅也落不了地。
