- generic [ref=f287e2]:
  - generic [ref=f287e3]: 论文精读 · 可视化版 · 2021 №14
  - heading "设备自己播放的声音不用滤掉： 把参考信号直接喂给 KWS，让模型自己学会忽略" [level=1] [ref=f287e4]: 设备自己播放的声音不用滤掉：把参考信号直接喂给 KWS，让模型自己学会忽略
  - generic [ref=f287e5]:
    - generic [ref=f287e6]: Implicit AEC · 马尔凯理工 + Amazon Alexa
    - generic [ref=f287e7]: arXiv 2111.10639 · IEEE SLT 2023
    - generic [ref=f287e8]: 双分支（麦克风 + 扬声器参考）· KWS+DDD 多任务
    - generic [ref=f287e9]: 回声场景 ≥ 显式 AEC 级联 · 重叠场景优势最大
  - generic [ref=f287e10]: 一句话：音箱边播音乐/TTS 边监听，扬声器声音被自己的麦克风录回来形成回声——TTS 里恰含唤醒词音素时设备「自己唤醒自己」。传统方案在 KWS 前串显式 AEC 模块，但级联各有各的调参、AEC 失真伤下游、两模块无法联合优化。本文让回声消除长进 KWS 模型里：麦克风信号与扬声器参考信号（D/A 前的干净数字音频）双分支输入、注意力融合、端到端多任务训练（KWS + 设备导向检测）——回声场景下相当或优于显式级联，回声与用户语音重叠的困难场景优势最大。
  - generic [ref=f287e11]:
    - generic [ref=f287e12]: TL;DR
    - listitem [ref=f287e13]: ◈ 回声的三重伤害：误报（TTS 合成语音含与唤醒词相似音素 → 自己唤醒自己——播报「Alexa 能做什么」的瞬间就是误触发）、召回下降（回声掩蔽用户语音）、导向检测失败（分不清「用户对设备说」与「设备自己播」）。
    - listitem [ref=f287e14]: ◈ 显式 AEC 级联的三宗罪：模块复杂度与调参难度；AEC 自身引入的失真伤害下游 KWS；AEC 与 KWS 分别独立优化、无法联合——级联的局部最优不是全局最优。
    - listitem [ref=f287e15]: ◈ 双分支架构：主分支吃麦克风信号（用户语音+回声+噪声），参考分支吃扬声器参考信号（D/A 前数字域直取——干净无噪）；两路独立编码 → 注意力融合 → 分类头。模型学习 F_ref 与回声分量的映射，在特征空间完成回声减除。
    - listitem [ref=f287e16]: ◈ 训练：合成数据（干净用户语音 + 设备播放音频在真实/仿真 RIR 下混合）让模型见过各种回声条件；多任务 L = α·L_KWS + β·L_DDD（词存在吗 + 语音指向设备吗）。
    - listitem [ref=f287e17]: ◈ 推理：麦克风流 + 参考流同时输入，端到端输出两个结果——没有任何独立的 AEC 预处理步骤。
    - listitem [ref=f287e18]: ◈ DDD 的意外红利：参考信号同时是导向检测的关键证据——「麦克风内容 ≈ 参考信号」→ 是设备在播不是用户在说——这就是 KWS 与 DDD 能共享一个框架的原因。
    - listitem [ref=f287e19]: ◈ 结果（定性）：回声场景准确率相当或优于显式 AEC+KWS 级联；回声与用户语音重叠的困难场景优势最大；DDD 同样受益（传统方法易把播放内容误判为用户指令）。三条消融：去参考分支显著掉点；注意力融合优于拼接；回声条件多样性对泛化至关重要。
    - listitem [ref=f287e20]: ◈ 硬前提：方法需要设备能提供扬声器参考信号——参考不可用或延迟大的场景受限；多设备同时播放的场景未探索。
  - heading "§01 问题：自己的声音骗自己的耳朵" [level=2] [ref=f287e21]:
    - generic [ref=f287e22]: §01
    - text: 问题：自己的声音骗自己的耳朵
  - generic [ref=f287e23]: 回声三重伤害 + 级联三宗罪
  - generic [ref=f287e24]:
    - generic [ref=f287e25]:
      - heading "自己唤醒自己" [level=3] [ref=f287e26]
      - paragraph [ref=f287e27]: TTS 合成语音恰好包含与唤醒词相似的音素序列时——设备播放「Alexa 能做什么」的瞬间就可能误触发。这不是假设场景：语音助手的产品形态决定了它必须边播报边监听。
    - generic [ref=f287e28]:
      - heading "级联的三宗罪" [level=3] [ref=f287e29]
      - paragraph [ref=f287e30]: AEC 模块增加系统复杂度和调参难度；自适应滤波本身会引入失真，污染下游 KWS 的输入；AEC 和 KWS 分别优化——AEC 的最优（信号指标）不等于下游的最优（检测准确率）。
    - generic [ref=f287e31]:
      - heading "导向检测的盲区" [level=3] [ref=f287e32]
      - paragraph [ref=f287e33]: 设备导向语音检测（DDD：这段话是对设备说的吗）在没有回声处理时形同虚设——设备分不清麦克风里的声音是用户的指令还是自己的播放。这是多轮对话产品的刚需能力。
    - generic [ref=f287e34]:
      - heading "参考信号是免费的钥匙" [level=3] [ref=f287e35]
      - paragraph [ref=f287e36]: 扬声器要播什么，设备自己最清楚——D/A 转换前的数字音频就是回声的「底稿」，干净、无噪、零成本获取。显式 AEC 用它驱动滤波器，本文让它直接成为模型的第二路输入。
