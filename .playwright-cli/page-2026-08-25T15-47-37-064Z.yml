  - heading "§02 方法：特征空间的回声减除" [level=2] [ref=f287e98]:
    - generic [ref=f287e99]: §02
    - text: 方法：特征空间的回声减除
  - generic [ref=f287e100]: 两路输入 · 注意力融合 · 多任务驱动
  - generic [ref=f287e101]:
    - generic [ref=f287e102]: "主分支: 麦克风信号 → 主编码器 → F_mic （用户语音 + 回声 + 噪声） 参考分支: 扬声器参考 → 参考编码器 → F_ref （D/A 前数字音频 · 干净） 融合: Attention(F_mic, F_ref) （优于拼接+卷积，消融验证） 预测: 融合特征 → 分类头 → KWS + DDD 损失: L = α·L_KWS + β·L_DDD （多任务联合驱动）"
    - generic [ref=f287e103]: 人话：显式 AEC 是「先估计回声再从信号里减掉，然后把残差给 KWS」；iAEC 是「把底稿和混合信号一起给模型，让它自己在特征层学会对掉」。学会的映射由检测损失端到端驱动——减成什么样由下游说了算，这正是它优于级联的根源。
  - generic [ref=f287e104]:
    - generic [ref=f287e105]:
      - heading "训练数据的构造" [level=3] [ref=f287e106]
      - paragraph [ref=f287e107]: 干净用户语音 + 设备播放音频，在真实或仿真的房间脉冲响应（RIR）下混合——RIR 的多样性决定模型见过的回声条件。消融证实：训练回声条件越多样，泛化越好——部署环境的回声特性超出训练分布时性能下降。
    - generic [ref=f287e108]:
      - heading "为什么 KWS 和 DDD 能共享框架" [level=3] [ref=f287e109]
      - paragraph [ref=f287e110]: 两个任务需要的证据同源：「麦克风里的内容是否与参考信号对应」既回答「是不是回声」（KWS 视角），也回答「是不是设备在播而非用户在说」（DDD 视角）——一个融合特征天然服务两个头。
