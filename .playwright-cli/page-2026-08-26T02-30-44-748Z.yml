    - heading "5 判断：能带走的三句话" [level=2] [ref=f137e241]:
      - generic [ref=f137e242]: "5"
      - text: 判断：能带走的三句话
    - generic [ref=f137e243]:
      - generic [ref=f137e244]: JUDGEMENT
      - paragraph [ref=f137e245]: ↳ 「标签粒度粗于证据粒度」时就该用 MIL：只有整段标签、判别证据却在局部——MIL 把这个结构显式写进损失，比帧级投票多了一份原则性；任何「全局标签 + 局部证据」的任务（病历/文档/音频）都适用同一框架。
      - paragraph [ref=f137e246]: ↳ 证据单元的粒度要匹配信号的可靠度：窄带下帧不可靠、段更稳——把聚合单元从帧升到段是对数据质量的适配；单元太小噪声大、太大稀释信号，粒度本身是超参。
      - paragraph [ref=f137e247]: ↳ 级联与聚合是正交的两根轴：一个管「在谁身上花算力」（平均成本结构），一个管「证据怎么合成决策」（精度结构）——可以独立选型再组合，本文的价值之一是示范了这种正交组合。
