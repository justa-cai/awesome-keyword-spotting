    - text: 一句话：窄带（8kHz 电话/VoIP）下帧级预测不可靠——把话语当包、时间段当示例（至少一段含词 → 包为正），MIL 聚合（max）做包级判断 + 级联分类器把大多负样本早期便宜地滤掉：精度显著优于帧级投票、平均计算量降 50-70%。
