- generic [ref=f260e2]:
  - generic [ref=f260e3]: 论文精读 · 可视化版 · 2021 №1
  - heading "只听一个人的唤醒词： 先问「说了什么」，再问「谁在说」" [level=1] [ref=f260e4]: 只听一个人的唤醒词：先问「说了什么」，再问「谁在说」
  - generic [ref=f260e5]:
    - generic [ref=f260e6]: Two-pass Personalized Voice Trigger
    - generic [ref=f260e7]: 厦门大学 · arXiv 2106.15950
    - generic [ref=f260e8]: KWS 宽松阈值 + SV 严格阈值 · 部分共享 4 层
    - generic [ref=f260e9]: EER 2–3%（单阶段 5–8%）· 他人唤醒词拒 >90%
  - generic [ref=f260e10]: 一句话：个性化语音触发要同时拒绝「他人说唤醒词」「注册用户说别的」「噪声」三类输入，单阶段模型里低 FRR 与低 FAR 是拧在一起的跷跷板。本文拆成两阶段：第一阶段 KWS 宽松阈值只管「词出现了吗」（高召回），第二阶段说话人验证严格阈值管「是不是本人」（低误报）；底层 4 层特征共享让计算量只有独立双模型的 55–60%，端侧常驻可行。五种得分融合策略里，校准后融合最优。
  - generic [ref=f260e11]:
    - generic [ref=f260e12]: TL;DR
    - listitem [ref=f260e13]: ◈ 单阶段的核心矛盾：注册用户低 FRR 要求边界宽松 → 他人误报 FAR 上升，反之亦然——两个目标在单一决策空间里不可同时最优，一个旋钮拧向哪头都是另一头恶化。
    - listitem [ref=f260e14]: ◈ 两阶段解耦：第一阶段 KWS 帧级运行、θ=0.3 宽松（宁可放过不可错杀，把说话人判别整个交给第二阶段）；第二阶段 SV 用 x-vector 风格嵌入 + 余弦相似度、阈值严格——两个旋钮各管一件事，独立调到各自最优。
    - listitem [ref=f260e15]: ◈ 部分共享是算力关键：底层 4 层共享（通用声学特征）+ 高层分叉（KWS 分支看时序结构 / SV 分支看声道特征）——一次前向拿两路特征，计算量 55–60%（两个独立模型是 200%），推理时间省约 40%。
    - listitem [ref=f260e16]: ◈ 共享的性能税可控：KWS 准确率掉 <0.5%，SV EER 升 0.5–1%——用 55% 计算量买到个性化能力，这笔账端侧划算。共享层数消融：4 层（共 8 层）是甜点，太少效率优势弱、≥6 层任务干扰。
    - listitem [ref=f260e17]: ◈ 五种融合策略排序：校准后（Platt/Isotonic）> 学习型 SVM（~2.0%）> 加权 α=0.4（~2.3%）> 乘法（~2.5%）> 级联——两模块得分分布差异大时校准收益最显著（再降 0.3–0.5pp）。
    - listitem [ref=f260e18]: ◈ 训练：多任务 L=α·L_KWS+β·L_SV（CE + AAM-Softmax）+ 分阶段训练（先共享+KWS，冻结底层再训 SV）+ SpecAugment/噪声/速度扰动。AAM-Softmax 的 margin 对说话人区分力的提升在 SV 分支直接兑现。
    - listitem [ref=f260e19]: ◈ 结果（约值）：EER 2–3% vs 单阶段 5–8%（约一半）；FAR=1% 下注册用户 FRR 约 2–3%（低约 50%）；他人唤醒词拒 >90%。
    - listitem [ref=f260e20]: ◈ 代价：两阶段推理延迟 +50–100%；注册要录几遍唤醒词（开箱体验受损）；模板静态——生病/情绪变化时合法用户可能被拒；远场噪声与对抗攻击评估有限。
  - heading "§01 问题：一个旋钮拧不动两个目标" [level=2] [ref=f260e21]:
    - generic [ref=f260e22]: §01
    - text: 问题：一个旋钮拧不动两个目标
  - generic [ref=f260e23]: 三类要拒的输入 + FRR/FAR 跷跷板 + 常驻算力约束
  - generic [ref=f260e24]:
    - generic [ref=f260e25]:
      - heading "三类拒绝目标" [level=3] [ref=f260e26]
      - paragraph [ref=f260e27]: 他人说相同唤醒词（防他人激活）、注册用户的日常对话（防误触发）、环境噪声与非语音（防噪声触发）——系统只对「注册用户 ∩ 唤醒词」这个交集开绿灯。三类输入在特征空间高度纠缠，单模型一刀切不开。
    - generic [ref=f260e28]:
      - heading "FRR/FAR 跷跷板" [level=3] [ref=f260e29]
      - paragraph [ref=f260e30]: 用户说了唤醒词设备没反应是体验灾难——注册用户 FRR 必须极低，这决定边界要宽松；但宽松边界放进他人唤醒词。单阶段把「词判断」和「人判断」压进同一个决策空间，两个错误率此消彼长。
    - generic [ref=f260e31]:
      - heading "端侧算力约束" [level=3] [ref=f260e32]
      - paragraph [ref=f260e33]: 个性化 = KWS + SV 两个能力。两个独立模型计算量 200%，端侧常驻装不起——必须共享底层特征把开销压回来。这是框架成立的前提条件，也是「部分共享」设计的全部出发点。
    - generic [ref=f260e34]:
      - heading "分而治之的思路" [level=3] [ref=f260e35]
      - paragraph [ref=f260e36]: 把个性化触发分解为关键词检测与说话人验证两个独立子任务，每个子任务可独立优化、独立设阈——避免单阶段方法中两个目标的冲突。这一思想可推广到任何需要同时满足多个约束的 KWS 场景。
