  - generic [ref=f260e282]: 四点：从框架到工程指导
  - generic [ref=f260e283]:
    - generic [ref=f260e284]:
      - generic [ref=f260e285]: "1"
      - paragraph [ref=f260e286]: 集成两阶段框架：个性化触发分解为 KWS 与 SV 两个独立子任务，各可独立优化——避免单阶段两个目标的冲突，分而治之在工程实践中被证明非常有效。
    - generic [ref=f260e287]:
      - generic [ref=f260e288]: "2"
      - paragraph [ref=f260e289]: 高效特征共享：部分共享让计算开销只比单阶段 KWS 多约 50–60%（而非独立双模型的 200%）——两阶段个性化系统在边缘设备上部署变得可行。
    - generic [ref=f260e290]:
      - generic [ref=f260e291]: "3"
      - paragraph [ref=f260e292]: 融合策略的系统分析：级联/乘法/加权/学习型/校准后五种策略的清晰排序，为实践者选择融合方案提供直接指导。
    - generic [ref=f260e293]:
      - generic [ref=f260e294]: "4"
      - paragraph [ref=f260e295]: 更优的 FRR/FAR 权衡：独立双阈值让注册用户 FRR 压到 <1% 的同时他人 FAR 控制在 <0.5%——单阶段做不到的组合。
