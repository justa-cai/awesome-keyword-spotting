    - generic [ref=f260e277]: 读表要点
    - listitem [ref=f260e278]: ◈ 融合的实用建议：数据少用乘法（零训练成本、表现稳）；有标注数据上 SVM；两个模块分开训练、得分分布没对齐时，先校准再融合几乎总是值得的——Platt Scaling 是一行代码的事。
    - listitem [ref=f260e279]: ◈ 注意规模边界：说话人数十个量级、远场/噪声评估有限、未测对抗攻击（语音合成/转换）——引用数字时记住这些前提，大规模用户场景的外推存疑。
