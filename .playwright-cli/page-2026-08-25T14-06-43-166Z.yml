  - heading "§02 方法：解耦、共享、再融合" [level=2] [ref=f260e128]:
    - generic [ref=f260e129]: §02
    - text: 方法：解耦、共享、再融合
  - generic [ref=f260e130]: x-vector 嵌入 + 余弦相似度 · 多任务训练 · 分阶段训练
  - generic [ref=f260e131]:
    - generic [ref=f260e132]: "S_SV = cos(e_test, e_reg) = e_test · e_reg / (‖e_test‖·‖e_reg‖) 注册: e_reg = mean( 几遍注册录音的说话人嵌入 ) 判决: 融合(S_KWS, S_SV) > θ → ACCEPT 训练: L = α·L_KWS + β·L_SV （CE + AAM-Softmax）"
    - generic [ref=f260e133]: 人话：注册就是把自己的声纹坐标取平均存下来；验证就是算测试语音的声纹坐标离这个模板多近（余弦夹角）。AAM-Softmax 在训练时给不同说话人的嵌入之间加 margin，把「同一人说的话聚得紧、不同人分得开」直接训进表示里——比标准 softmax/对比损失的区分力都强（消融验证）。
  - generic [ref=f260e134]:
    - generic [ref=f260e135]:
      - heading "为什么是部分共享不是完全共享" [level=3] [ref=f260e136]
      - paragraph [ref=f260e137]: 完全共享参数最省但两任务互相干扰——KWS 要的关键词时序结构和 SV 要的声道特征在高层是不同的信息；完全独立算力翻倍端侧装不起。底层 4 层共享提音素级通用模式，高层分叉各取所需——效率与特异性的平衡点在消融里被验证。
    - generic [ref=f260e138]:
      - heading "阈值哲学：宽进严出" [level=3] [ref=f260e139]
      - paragraph [ref=f260e140]: θ_KWS=0.3 宽松（>0.5 会在第一阶段就拒掉注册用户——不可接受；<0.2 让第二阶段白跑——算力浪费）；θ_SV 严格压他人误报。宽松第一阶段会放进一些他人的唤醒词，这正是设计意图：漏检交给第二阶段兜底，错杀在第一阶段就杜绝。
