    - img [ref=f260e300]:
      - generic [ref=f260e302]: 边界与延伸
      - generic [ref=f260e304]: 技术边界
      - generic [ref=f260e305]: · 两阶段延迟：一阶段触发后要跑 SV 分支——比单阶段多约 50–100%
