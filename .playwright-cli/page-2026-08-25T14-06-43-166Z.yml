  - generic [ref=f260e325]:
    - generic [ref=f260e326]: 可迁移判断
    - paragraph [ref=f260e327]: ↳ 两个拧着的目标，拆成两阶段各配各的阈值：FRR/FAR 跷跷板的根源是「一条边界同时切割两类错误」——解耦后每个阈值独立逼近各自最优。这个框架适用于任何多约束的检测系统（准确率 × 环境 × 身份 × 权限）。
    - paragraph [ref=f260e328]: ↳ 宽进严出的级联省的是平均算力：第一阶段便宜且宽松（高召回），第二阶段贵且严格、只在触发时跑——常驻成本由便宜的那级决定。代价是触发时的额外延迟，要不要付取决于哪头错误更贵。
    - paragraph [ref=f260e329]: ↳ 共享多少层是个可消融的问题：太少拿不到效率、太多任务打架——通用特征（底层）可共享、任务特征（高层）该分叉，4/8 的甜点有参考意义但需按任务重扫。
    - paragraph [ref=f260e330]: ↳ 融合前先看得分分布对不对齐：两个分开训练的模块，得分尺度几乎必然不一致——一行 Platt Scaling 常常比换更复杂的融合器收益更大。先校准，再谈融合策略。
