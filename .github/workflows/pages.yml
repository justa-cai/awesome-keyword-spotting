name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 站点即仓库内容本身（Docsify 运行时渲染），剔除非站点文件后整包部署
      - name: Stage site content
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' --exclude='.github' --exclude='*.py' --exclude='LICENSE' ./ /tmp/site/
          ls /tmp/site | head

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # 首次运行自动开启 Pages（免网页设置）

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - id: deployment
        uses: actions/deploy-pages@v4
